<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>債券評価シミュレーター</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f2;
      --panel: #ffffff;
      --ink: #1d2328;
      --muted: #68727d;
      --line: #d9ded4;
      --accent: #0b6b6f;
      --accent-2: #ad4f2d;
      --accent-3: #4867a8;
      --soft: #e8f3f2;
      --warn: #fff2df;
      --shadow: 0 18px 48px rgba(37, 47, 56, 0.12);
      font-family: "Segoe UI", "Yu Gothic UI", "Meiryo", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.7), rgba(246,247,242,0.92)),
        radial-gradient(circle at 10% 5%, rgba(11,107,111,0.11), transparent 30%),
        var(--bg);
      color: var(--ink);
    }

    main {
      width: min(1420px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 40px;
    }

    header {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 24px;
      align-items: end;
      padding: 12px 0 24px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(28px, 4vw, 52px);
      line-height: 1.04;
      letter-spacing: 0;
    }

    .lead {
      margin: 0;
      max-width: 760px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.8;
    }

    .summary-strip {
      display: grid;
      grid-template-columns: repeat(3, minmax(180px, 1fr));
      gap: 10px;
    }

    .metric {
      background: rgba(255,255,255,0.86);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      box-shadow: 0 8px 24px rgba(37, 47, 56, 0.07);
      min-width: 0;
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 6px;
    }

    .metric strong {
      display: block;
      font-size: clamp(17px, 1.65vw, 24px);
      white-space: nowrap;
      overflow: visible;
      text-overflow: clip;
      letter-spacing: 0;
    }

    .layout {
      display: grid;
      grid-template-columns: 360px minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }

    .controls, .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .controls {
      position: sticky;
      top: 18px;
      padding: 18px;
    }

    .section-title {
      margin: 0 0 14px;
      font-size: 15px;
      font-weight: 700;
    }

    .field {
      display: grid;
      gap: 7px;
      margin-bottom: 14px;
    }

    label {
      color: #34404a;
      font-size: 13px;
      font-weight: 650;
    }

    input, select {
      width: 100%;
      border: 1px solid #cbd3ca;
      border-radius: 7px;
      padding: 10px 11px;
      color: var(--ink);
      background: #fff;
      font: inherit;
      font-size: 15px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(11,107,111,0.14);
    }

    .split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .segmented {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding: 4px;
      border-radius: 8px;
      background: #edf1ed;
      border: 1px solid #d8ded6;
    }

    .segmented button {
      border: 0;
      border-radius: 6px;
      padding: 10px 8px;
      color: var(--muted);
      background: transparent;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .segmented button.active {
      color: #fff;
      background: var(--accent);
      box-shadow: 0 8px 18px rgba(11,107,111,0.22);
    }

    .currency-toggle, .rate-tools {
      display: grid;
      gap: 6px;
    }

    .currency-toggle {
      grid-template-columns: 1fr 1fr;
      margin-bottom: 8px;
    }

    .currency-toggle button, .rate-tools button {
      border: 1px solid #cbd3ca;
      border-radius: 7px;
      padding: 9px 10px;
      background: #f8faf7;
      color: #34404a;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    .currency-toggle button.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .rate-tools {
      grid-template-columns: auto auto 1fr;
      align-items: stretch;
    }

    .rate-tools button {
      width: 42px;
      font-size: 18px;
      line-height: 1;
    }

    .rate-tools .plus {
      color: #08745d;
      border-color: rgba(8, 116, 93, 0.35);
      background: #eef8f4;
    }

    .rate-tools .minus {
      color: #b53b2f;
      border-color: rgba(181, 59, 47, 0.35);
      background: #fff1ef;
    }

    .rate-tools .plus.active {
      color: #fff;
      background: #08745d;
      border-color: #08745d;
      box-shadow: 0 0 0 3px rgba(8, 116, 93, 0.16);
    }

    .rate-tools .minus.active {
      color: #fff;
      background: #b53b2f;
      border-color: #b53b2f;
      box-shadow: 0 0 0 3px rgba(181, 59, 47, 0.16);
    }

    .amount-row {
      position: relative;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: stretch;
    }

    .amount-row button {
      border: 1px solid #cbd3ca;
      border-radius: 7px;
      padding: 0 14px;
      background: #f8faf7;
      color: #34404a;
      font: inherit;
      font-weight: 900;
      cursor: pointer;
    }

    .amount-popover {
      position: absolute;
      right: 0;
      top: calc(100% + 8px);
      z-index: 8;
      width: 230px;
      display: none;
      gap: 8px;
      padding: 10px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .amount-popover.open {
      display: grid;
    }

    .amount-popover-row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 6px;
      align-items: center;
      font-size: 13px;
      font-weight: 800;
    }

    .amount-popover-row button {
      width: 34px;
      height: 30px;
      padding: 0;
    }

    .amount-popover-row .add { color: #08745d; background: #eef8f4; }
    .amount-popover-row .sub { color: #b53b2f; background: #fff1ef; }

    .fx-field {
      display: none;
      margin-top: 8px;
    }

    .fx-field.visible {
      display: grid;
      gap: 7px;
    }

    .chart-actions {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
      margin-bottom: 8px;
    }

    .chart-actions button {
      border: 1px solid #cbd3ca;
      border-radius: 7px;
      padding: 8px 12px;
      background: #f8faf7;
      color: #34404a;
      font: inherit;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }

    .chart-actions button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .chart-actions.hidden {
      display: none;
    }

    .chart-slider {
      width: 66.778%;
      margin-left: 21.111%;
      margin-top: 10px;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 10px;
      align-items: center;
    }

    .chart-slider label {
      font-size: 12px;
      color: #34404a;
      font-weight: 750;
    }

    .chart-slider input[type="range"] {
      width: 100%;
    }

    .chart-slider .value-pill {
      justify-self: center;
    }

    .range-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
    }

    input[type="range"] {
      padding: 0;
      accent-color: var(--accent);
    }

    .value-pill {
      min-width: 68px;
      padding: 6px 8px;
      border-radius: 999px;
      background: var(--soft);
      color: #07585b;
      font-size: 12px;
      font-weight: 800;
      text-align: center;
      white-space: nowrap;
    }

    .note {
      margin: 16px 0 0;
      padding: 12px;
      border-radius: 8px;
      background: var(--warn);
      color: #67503b;
      font-size: 12px;
      line-height: 1.7;
    }

    .workspace {
      display: grid;
      gap: 18px;
      min-width: 0;
    }

    .panel {
      padding: 18px;
      min-width: 0;
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: start;
      margin-bottom: 12px;
    }

    .panel h2 {
      margin: 0 0 5px;
      font-size: 20px;
      letter-spacing: 0;
    }

    .panel p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      justify-content: flex-end;
      font-size: 12px;
      color: var(--muted);
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .key {
      width: 24px;
      height: 3px;
      border-radius: 999px;
      background: var(--accent);
    }

    .key.orange { background: var(--accent-2); }
    .key.blue { background: var(--accent-3); }
    .key.gray { background: #82909c; border-top: 1px dashed #82909c; background: transparent; }

    .chart-wrap {
      position: relative;
      width: 100%;
      min-height: 360px;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 360px;
      border-radius: 8px;
      background: linear-gradient(180deg, #ffffff, #fbfcfa);
      border: 1px solid #edf0eb;
    }

    .tooltip {
      position: fixed;
      z-index: 10;
      pointer-events: none;
      min-width: 220px;
      max-width: 300px;
      padding: 10px 12px;
      border-radius: 8px;
      background: rgba(29,35,40,0.94);
      color: #fff;
      font-size: 12px;
      line-height: 1.55;
      box-shadow: 0 12px 30px rgba(0,0,0,0.22);
      opacity: 0;
      transform: translate(-50%, calc(-100% - 14px));
      transition: opacity 120ms ease;
    }

    .tooltip.pinned {
      position: absolute;
      cursor: move;
      pointer-events: auto;
      transform: none;
    }

    .tooltip strong {
      display: block;
      margin-bottom: 4px;
      color: #9ee3df;
      font-size: 13px;
    }

    .tooltip-close {
      position: absolute;
      top: 5px;
      right: 6px;
      width: 20px;
      height: 20px;
      border: 0;
      border-radius: 50%;
      background: rgba(255,255,255,0.12);
      color: #fff;
      font-size: 15px;
      line-height: 20px;
      text-align: center;
      cursor: pointer;
    }

    .tooltip-close:hover {
      background: rgba(255,255,255,0.24);
    }

    .table-panel {
      overflow: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      min-width: 650px;
    }

    th, td {
      padding: 10px 8px;
      border-bottom: 1px solid #edf0eb;
      text-align: right;
      white-space: nowrap;
    }

    th:first-child, td:first-child { text-align: left; }
    th { color: var(--muted); font-weight: 750; }

    .positive { color: #08745d; font-weight: 750; }
    .negative { color: #b53b2f; font-weight: 750; }

    @media (max-width: 960px) {
      header, .layout { grid-template-columns: 1fr; }
      .controls { position: static; }
      .summary-strip { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .panel-head { display: grid; }
      .legend { justify-content: flex-start; }
      .controls, .panel { box-shadow: 0 10px 28px rgba(37, 47, 56, 0.09); }
    }

    @media (max-width: 760px) {
      .summary-strip { grid-template-columns: 1fr; }
    }

    @media (max-width: 560px) {
      main { width: min(100% - 20px, 1420px); padding-top: 18px; }
      .split { grid-template-columns: 1fr; }
      .summary-strip { gap: 8px; }
      .metric { padding: 10px; }
      .metric strong { font-size: 18px; white-space: normal; overflow-wrap: anywhere; }
      .rate-tools { grid-template-columns: 42px 42px minmax(0, 1fr); }
      .currency-toggle { grid-template-columns: 1fr 1fr; }
      .amount-popover {
        left: 0;
        right: auto;
        width: min(260px, 100%);
      }
      .panel { padding: 12px; }
      .panel h2 { font-size: 17px; }
      .legend { gap: 6px 10px; font-size: 11px; }
      .chart-actions { justify-content: stretch; }
      .chart-actions button { flex: 1; }
      .chart-slider {
        width: 100%;
        margin-left: 0;
        grid-template-columns: minmax(0, 1fr);
      }
      canvas { height: 300px; }
      .chart-wrap { min-height: 300px; }
      table { min-width: 560px; font-size: 12px; }
      th, td { padding: 8px 6px; }
      .tooltip { max-width: min(280px, calc(100vw - 30px)); }
    }

    @media (max-width: 390px) {
      main { width: min(100% - 12px, 1420px); }
      .controls { padding: 12px; }
      input, select { font-size: 14px; }
      .rate-tools { grid-template-columns: 38px 38px minmax(0, 1fr); }
      .rate-tools button { width: 38px; }
      canvas { height: 280px; }
      .chart-wrap { min-height: 280px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>債券評価シミュレーター</h1>
        <p class="lead">額面・利率・満期までの期間を基準に、金利変化で現在および中途時点の債券評価額がどう動くかを比較します。</p>
      </div>
      <div class="summary-strip" aria-live="polite">
        <div class="metric"><span>基準評価額</span><strong id="basePrice">-</strong></div>
        <div class="metric"><span>中途評価額</span><strong id="midPrice">-</strong></div>
        <div class="metric"><span>満期償還価格</span><strong id="maturityCash">-</strong></div>
      </div>
    </header>

    <div class="layout">
      <aside class="controls">
        <h2 class="section-title">① 基準債券</h2>
        <div class="field">
          <label>通貨</label>
          <div class="currency-toggle" aria-label="通貨">
            <button id="currencyYen" class="active" type="button">￥</button>
            <button id="currencyDollar" type="button">$</button>
          </div>
          <div id="fxPrimary" class="fx-field">
            <label for="fxRatePrimary">ドル円</label>
            <input id="fxRatePrimary" type="number" step="0.01" value="155.00">
          </div>
          <label for="faceValue">額面</label>
          <div class="amount-row">
            <input id="faceValue" type="text" inputmode="numeric" value="1,000,000">
            <button id="amountAdjust" type="button">±</button>
            <div id="amountPopover" class="amount-popover"></div>
          </div>
        </div>
        <div class="field">
          <label for="couponRate">債券の金利（年率%）</label>
          <input id="couponRate" type="number" step="0.01" value="3.00">
        </div>
        <div class="split">
          <div class="field">
            <label for="years">満期まで（年）</label>
            <input id="years" type="number" min="0" max="60" step="1" value="10">
          </div>
          <div class="field">
            <label for="months">満期まで（月）</label>
            <input id="months" type="number" min="0" max="11" step="1" value="0">
          </div>
        </div>
        <div class="field">
          <label>種類</label>
          <div class="segmented" role="tablist" aria-label="債券種類">
            <button id="couponBond" type="button">利付債</button>
            <button id="zeroBond" class="active" type="button">割引債</button>
          </div>
        </div>

        <h2 class="section-title" style="margin-top:22px;">② 比較条件</h2>
        <div class="field">
          <div id="fxCompare" class="fx-field">
            <label for="fxRateCompare">ドル円</label>
            <input id="fxRateCompare" type="number" step="0.01" value="155.00">
          </div>
          <label for="compareRate">比較する金利（年率%）</label>
          <input id="compareRate" type="number" min="0" step="0.01" value="4.00">
        </div>
      </aside>

      <section class="workspace">
        <section class="panel">
          <div class="panel-head">
            <div>
              <h2>金利変動と債券評価額</h2>
            </div>
            <div class="legend">
              <span><i class="key"></i>② 比較後</span>
              <span><i class="key orange"></i>① 基準</span>
              <span><i class="key blue"></i>中途評価</span>
            </div>
          </div>
          <div class="chart-wrap">
            <div class="chart-actions">
              <button id="displayDollar" type="button">$表記</button>
              <button id="displayYen" type="button">円換算</button>
            </div>
            <canvas id="shockChart" width="900" height="360"></canvas>
            <div class="chart-slider">
              <label for="elapsedMonths">中途評価までの経過月数</label>
              <input id="elapsedMonths" type="range" min="0" max="60" step="1" value="60">
              <span id="elapsedLabel" class="value-pill">5年</span>
            </div>
          </div>
        </section>

        <section class="panel table-panel">
          <div class="panel-head">
            <div>
              <h2>比較サマリー</h2>
              <p>中途評価額と基準評価額の差を、主要な金利シナリオで確認できます。</p>
            </div>
          </div>
          <table>
            <thead>
              <tr>
                <th>シナリオ</th>
                <th>適用利回り</th>
                <th>中途評価額</th>
                <th>基準比</th>
                <th>満期償還価格</th>
              </tr>
            </thead>
            <tbody id="summaryRows"></tbody>
          </table>
        </section>
      </section>
    </div>
  </main>
  <div id="tooltip" class="tooltip"></div>

  <script>
    const els = {
      faceValue: document.getElementById("faceValue"),
      amountAdjust: document.getElementById("amountAdjust"),
      amountPopover: document.getElementById("amountPopover"),
      currencyYen: document.getElementById("currencyYen"),
      currencyDollar: document.getElementById("currencyDollar"),
      fxPrimary: document.getElementById("fxPrimary"),
      fxCompare: document.getElementById("fxCompare"),
      fxRatePrimary: document.getElementById("fxRatePrimary"),
      fxRateCompare: document.getElementById("fxRateCompare"),
      couponRate: document.getElementById("couponRate"),
      marketRate: null,
      years: document.getElementById("years"),
      months: document.getElementById("months"),
      elapsedMonths: document.getElementById("elapsedMonths"),
      elapsedLabel: document.getElementById("elapsedLabel"),
      compareRate: document.getElementById("compareRate"),
      couponBond: document.getElementById("couponBond"),
      zeroBond: document.getElementById("zeroBond"),
      basePrice: document.getElementById("basePrice"),
      midPrice: document.getElementById("midPrice"),
      maturityCash: document.getElementById("maturityCash"),
      summaryRows: document.getElementById("summaryRows"),
      tooltip: document.getElementById("tooltip"),
      displayDollar: document.getElementById("displayDollar"),
      displayYen: document.getElementById("displayYen"),
      shockChart: document.getElementById("shockChart")
    };

    let bondType = "zero";
    let currency = "JPY";
    let showYenConversion = false;
    let dragMidLine = false;
    let suppressCanvasClickUntil = 0;
    let midLinePointer = null;
    let midLineMoved = false;
    let chartGeometry = null;
    const hitMaps = new Map();
    let pinnedTooltip = false;
    let dragTooltip = null;

    function money(value) {
      const useYen = currency === "JPY" || showYenConversion;
      const displayValue = showYenConversion && currency === "USD" ? value * fxRate() : value;
      return new Intl.NumberFormat(useYen ? "ja-JP" : "en-US", {
        style: "currency",
        currency: useYen ? "JPY" : currency,
        maximumFractionDigits: 0
      }).format(displayValue);
    }

    function faceUnitMoney(value) {
      return new Intl.NumberFormat(currency === "JPY" ? "ja-JP" : "en-US", {
        style: "currency",
        currency,
        maximumFractionDigits: 0
      }).format(value);
    }

    function fxRate() {
      return Math.max(0, Number(els.fxRatePrimary.value) || 0);
    }

    function syncFx(source) {
      const value = source.value;
      els.fxRatePrimary.value = value;
      els.fxRateCompare.value = value;
      update();
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function parseAmount(value) {
      return Number(String(value).replace(/[^\d.-]/g, "")) || 0;
    }

    function formatAmount(value) {
      const num = Math.max(0, Math.round(parseAmount(value)));
      return num ? new Intl.NumberFormat("ja-JP").format(num) : "";
    }

    function formatFaceInput() {
      els.faceValue.value = formatAmount(els.faceValue.value);
    }

    function amountUnits() {
      return currency === "JPY" ? [1000000, 100000, 10000] : [100000, 10000, 1000];
    }

    function renderAmountPopover() {
      els.amountPopover.innerHTML = amountUnits().map(unit => `
        <div class="amount-popover-row">
          <span>${faceUnitMoney(unit)}</span>
          <button class="add" type="button" data-delta="${unit}">+</button>
          <button class="sub" type="button" data-delta="${-unit}">−</button>
        </div>
      `).join("");
    }

    function adjustFace(delta) {
      const next = Math.max(1, parseAmount(els.faceValue.value) + delta);
      els.faceValue.value = new Intl.NumberFormat("ja-JP").format(next);
      update();
    }

    function setCurrency(nextCurrency) {
      const previousCurrency = currency;
      currency = nextCurrency;
      els.currencyYen.classList.toggle("active", currency === "JPY");
      els.currencyDollar.classList.toggle("active", currency === "USD");
      els.fxPrimary.classList.toggle("visible", currency === "USD");
      els.fxCompare.classList.toggle("visible", currency === "USD");
      if (previousCurrency !== currency && currency === "USD") {
        els.faceValue.value = "10,000";
      }
      if (currency === "JPY") {
        showYenConversion = false;
      }
      updateDisplayButtons();
      renderAmountPopover();
      update();
    }

    function updateDisplayButtons() {
      const visible = currency === "USD";
      els.displayDollar.parentElement.classList.toggle("hidden", !visible);
      els.displayDollar.classList.toggle("active", visible && !showYenConversion);
      els.displayYen.classList.toggle("active", visible && showYenConversion);
    }


    function readModel() {
      const face = Math.max(1, parseAmount(els.faceValue.value));
      const couponRate = bondType === "zero" ? 0 : (Number(els.couponRate.value) || 0) / 100;
      const marketRate = (Number(els.couponRate.value) || 0) / 100;
      const years = Math.max(0, Number(els.years.value) || 0);
      const months = clamp(Math.round(Number(els.months.value) || 0), 0, 11);
      els.months.value = months;
      let totalMonths = Math.max(1, Math.round(years * 12 + months));
      const elapsed = clamp(Math.round(Number(els.elapsedMonths.value) || 0), 0, totalMonths);
      els.elapsedMonths.max = Math.max(0, totalMonths);
      els.elapsedMonths.value = elapsed;
      return { face, couponRate, marketRate, totalMonths, elapsed };
    }

    function monthsLabel(months) {
      const y = Math.floor(months / 12);
      const m = months % 12;
      if (y && m) return `${y}年${m}か月`;
      if (y) return `${y}年`;
      return `${m}か月`;
    }

    function bondPrice(face, couponRate, annualYield, remainingMonths) {
      const years = Math.max(0, remainingMonths / 12);
      const y = Math.max(-0.95, annualYield);
      if (remainingMonths <= 0) return face;
      if (couponRate === 0) return face / Math.pow(1 + y, years);

      const paymentCount = Math.ceil(remainingMonths / 6);
      const firstPaymentPeriods = remainingMonths / 6 - (paymentCount - 1);
      const periodYield = y / 2;
      let value = 0;
      const coupon = face * couponRate / 2;

      for (let i = 0; i < paymentCount; i += 1) {
        value += coupon / Math.pow(1 + periodYield, firstPaymentPeriods + i);
      }
      value += face / Math.pow(1 + periodYield, remainingMonths / 6);
      return value;
    }

    function visualDiscountPrice(face, annualYield, remainingMonths) {
      const years = Math.max(0, remainingMonths / 12);
      const y = Math.max(-0.95, annualYield);
      return remainingMonths <= 0 ? face : face / Math.pow(1 + y, years);
    }

    function maturityCash(face, couponRate, remainingMonths) {
      return face;
    }

    function niceNumber(value) {
      if (value === 0) return 1;
      const exp = Math.floor(Math.log10(Math.abs(value)));
      const fraction = Math.abs(value) / Math.pow(10, exp);
      const nice = fraction < 1.5 ? 1 : fraction < 3 ? 2 : fraction < 7 ? 5 : 10;
      return nice * Math.pow(10, exp);
    }

    function fitCanvas(canvas) {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      const width = Math.max(320, Math.round(rect.width * dpr));
      const height = Math.max(280, Math.round(rect.height * dpr));
      if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width;
        canvas.height = height;
      }
      return { width, height, dpr };
    }

    function drawAxes(ctx, box, xTicks, yTicks, formatX, formatY) {
      ctx.save();
      ctx.strokeStyle = "#dce2da";
      ctx.lineWidth = 1;
      ctx.fillStyle = "#69747c";
      ctx.font = "12px Segoe UI, sans-serif";
      ctx.textBaseline = "middle";

      yTicks.forEach(t => {
        const y = box.y + box.h - (t.ratio * box.h);
        ctx.beginPath();
        ctx.moveTo(box.x, y);
        ctx.lineTo(box.x + box.w, y);
        ctx.stroke();
        ctx.textAlign = "right";
        ctx.fillText(formatY(t.value), box.x - 10, y);
      });

      xTicks.forEach(t => {
        const x = box.x + t.ratio * box.w;
        ctx.beginPath();
        ctx.moveTo(x, box.y);
        ctx.lineTo(x, box.y + box.h);
        ctx.stroke();
        ctx.textAlign = "center";
        ctx.textBaseline = "top";
        ctx.fillText(formatX(t.value), x, box.y + box.h + 10);
      });

      ctx.strokeStyle = "#9aa59b";
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(box.x, box.y);
      ctx.lineTo(box.x, box.y + box.h);
      ctx.lineTo(box.x + box.w, box.y + box.h);
      ctx.stroke();
      ctx.restore();
    }

    function buildTicks(min, max, count) {
      const span = max - min || 1;
      const step = niceNumber(span / Math.max(1, count - 1));
      const start = Math.floor(min / step) * step;
      const end = Math.ceil(max / step) * step;
      const ticks = [];
      for (let v = start; v <= end + step * 0.5; v += step) {
        ticks.push({ value: v, ratio: (v - min) / (max - min || 1) });
      }
      return ticks.filter(t => t.ratio >= -0.001 && t.ratio <= 1.001);
    }

    function drawLabel(ctx, text, x, y, options = {}) {
      ctx.save();
      ctx.fillStyle = options.color || "#1d2328";
      ctx.font = `${options.weight || 700} ${options.size || 14}px Segoe UI, Yu Gothic UI, sans-serif`;
      ctx.textAlign = options.align || "left";
      ctx.textBaseline = options.baseline || "middle";
      String(text).split("\n").forEach((line, index) => {
        ctx.fillText(line, x, y + index * ((options.size || 14) + 5));
      });
      ctx.restore();
    }

    function drawArrow(ctx, x1, y1, x2, y2, color = "#416fbe", width = 3) {
      const angle = Math.atan2(y2 - y1, x2 - x1);
      const head = Math.max(8, width * 2.2);
      ctx.save();
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = width;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x2, y2);
      ctx.lineTo(x2 - head * Math.cos(angle - Math.PI / 6), y2 - head * Math.sin(angle - Math.PI / 6));
      ctx.lineTo(x2 - head * Math.cos(angle + Math.PI / 6), y2 - head * Math.sin(angle + Math.PI / 6));
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function drawDoubleArrow(ctx, x1, y1, x2, y2, color = "#416fbe") {
      drawArrow(ctx, x1, y1, x2, y2, color, 2.6);
      drawArrow(ctx, x2, y2, x1, y1, color, 2.6);
    }

    function drawDurationAxis(ctx, left, right, y, label) {
      ctx.save();
      ctx.fillStyle = "#c9c9c9";
      ctx.beginPath();
      ctx.moveTo(left, y);
      ctx.lineTo(right - 10, y);
      ctx.lineTo(right, y + 8);
      ctx.lineTo(right - 10, y + 16);
      ctx.lineTo(left, y + 16);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
      if (label) drawLabel(ctx, label, (left + right) / 2, y + 8, { align: "center", size: 12, color: "#111", weight: 800 });
      drawLabel(ctx, "発行日", left, y + 43, { align: "center", size: 12, color: "#111", weight: 700 });
      drawLabel(ctx, "償還日", right, y + 43, { align: "center", size: 12, color: "#111", weight: 700 });
      drawArrow(ctx, left, y + 29, left, y + 19, "#111", 1.8);
      drawArrow(ctx, right, y + 29, right, y + 19, "#111", 1.8);
    }

    function drawRoundedRect(ctx, x, y, w, h, r) {
      const radius = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + w - radius, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
      ctx.lineTo(x + w, y + h - radius);
      ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
      ctx.lineTo(x + radius, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }

    function drawValueBar(ctx, x, baseY, width, height, color, label, value) {
      ctx.save();
      ctx.fillStyle = color;
      drawRoundedRect(ctx, x, baseY - height, width, height, 7);
      ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.font = "800 12px Segoe UI, Yu Gothic UI, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(label, x + width / 2, baseY - Math.max(18, height / 2));
      ctx.restore();
      drawLabel(ctx, money(value), x + width / 2, baseY - height - 14, { align: "center", size: 12, color: "#26333d", weight: 800 });
    }

    function renderShockChart(model, basePrice) {
      const canvas = els.shockChart;
      const ctx = canvas.getContext("2d");
      const { width, height } = fitCanvas(canvas);
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, width, height);

      const scale = width / 900;
      ctx.save();
      ctx.scale(scale, scale);
      const viewH = height / scale;
      const top = 58;
      const bottom = Math.min(viewH - 70, 310);
      const left = 190;
      const right = 760;
      const maturityW = 62;
      const axisRight = right + maturityW / 2;
      const compareRate = Math.max(0, Number(els.compareRate.value) || 0) / 100;
      const remaining = Math.max(0, model.totalMonths - model.elapsed);
      const baseNow = bondPrice(model.face, model.couponRate, model.marketRate, model.totalMonths);
      const compareNow = bondPrice(model.face, model.couponRate, compareRate, model.totalMonths);
      const baseMid = bondPrice(model.face, model.couponRate, model.marketRate, remaining);
      const compareMid = bondPrice(model.face, model.couponRate, compareRate, remaining);
      const baseVisualNow = visualDiscountPrice(model.face, model.marketRate, model.totalMonths);
      const compareVisualNow = visualDiscountPrice(model.face, compareRate, model.totalMonths);
      const baseVisualMid = visualDiscountPrice(model.face, model.marketRate, remaining);
      const compareVisualMid = visualDiscountPrice(model.face, compareRate, remaining);
      const midRatio = clamp(model.elapsed / model.totalMonths, 0, 1);
      const midX = left + (axisRight - left) * midRatio;
      const topRateY = top;
      const priceToY = price => {
        const ratio = clamp(price / model.face, 0, 1);
        return bottom - ratio * (bottom - topRateY);
      };
      const baseY = priceToY(baseVisualNow);
      const compareY = priceToY(compareVisualNow);
      const baseMidY = priceToY(baseVisualMid);
      const compareMidY = priceToY(compareVisualMid);
      chartGeometry = { left, right: axisRight, midX, scale, totalMonths: model.totalMonths };
      let baseLabelY = baseY;
      let compareLabelY = compareY;
      if (Math.abs(baseLabelY - compareLabelY) < 22) {
        if (compareRate <= model.marketRate) {
          compareLabelY = Math.max(topRateY + 10, compareLabelY - 13);
          baseLabelY = Math.min(bottom - 10, baseLabelY + 13);
        } else {
          baseLabelY = Math.max(topRateY + 10, baseLabelY - 13);
          compareLabelY = Math.min(bottom - 10, compareLabelY + 13);
        }
      }

      ctx.save();
      ctx.fillStyle = "#e7edf7";
      ctx.beginPath();
      ctx.moveTo(left, Math.min(baseY, compareY));
      ctx.lineTo(right, topRateY);
      ctx.lineTo(right, bottom);
      ctx.lineTo(left, bottom);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "rgba(34, 118, 128, 0.28)";
      ctx.beginPath();
      ctx.moveTo(left, compareY);
      ctx.lineTo(right, topRateY);
      ctx.lineTo(right, bottom);
      ctx.lineTo(left, bottom);
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.strokeStyle = "#0b6b6f";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(left, compareY);
      ctx.lineTo(right, topRateY);
      ctx.stroke();
      ctx.setLineDash([6, 5]);
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(left, baseY);
      ctx.lineTo(right, topRateY);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(left, topRateY);
      ctx.lineTo(right, topRateY);
      ctx.stroke();
      ctx.restore();

      ctx.save();
      ctx.fillStyle = "#4774bf";
      ctx.strokeStyle = "#355f9f";
      ctx.lineWidth = 1;
      ctx.fillRect(right, topRateY, maturityW, bottom - topRateY);
      ctx.strokeRect(right, topRateY, maturityW, bottom - topRateY);
      ctx.translate(right + maturityW / 2, (topRateY + bottom) / 2);
      ctx.rotate(Math.PI / 2);
      ctx.fillStyle = "#fff";
      ctx.font = "800 22px Segoe UI, Yu Gothic UI, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.restore();

      drawLabel(ctx, `${(model.marketRate * 100).toFixed(2)}%`, left - 12, baseLabelY, { align: "right", size: 13, color: "#416fbe", weight: 850 });
      drawLabel(ctx, `${(compareRate * 100).toFixed(2)}%`, left - 12, compareLabelY, { align: "right", size: 13, color: "#416fbe", weight: 850 });
      drawDoubleArrow(ctx, left, baseY, left, compareY, "#b53b2f");
      drawDurationAxis(ctx, left, axisRight, bottom + 10, "");

      if (bondType === "coupon") {
        const payment = model.face * model.couponRate / 2;
        const count = Math.floor(model.totalMonths / 6);
        const couponY = Math.max(22, Math.min(topRateY, baseY, compareY, baseMidY, compareMidY) - 24);
        ctx.save();
        ctx.fillStyle = "#f0c419";
        ctx.strokeStyle = "#b48a00";
        ctx.lineWidth = 1;
        for (let i = 1; i <= count; i += 1) {
          const ratio = (i * 6) / model.totalMonths;
          const x = left + (axisRight - left) * ratio;
          const y = couponY;
          ctx.beginPath();
          ctx.arc(x, y, 5, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          if (i % 2 === 0) {
            ctx.beginPath();
            ctx.moveTo(x, y + 6);
            ctx.lineTo(x, y + 16);
            ctx.stroke();
          }
        }
        ctx.restore();
        drawLabel(ctx, `6か月利払い ${money(payment)}`, left + 12, Math.max(14, couponY - 12), { size: 12, color: "#8a6a00", weight: 800 });
      }

      ctx.save();
      ctx.strokeStyle = "#4867a8";
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.moveTo(midX, topRateY + 12);
      ctx.lineTo(midX, bottom);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = "#4867a8";
      ctx.beginPath();
      ctx.arc(midX, baseMidY, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#0b6b6f";
      ctx.beginPath();
      ctx.arc(midX, compareMidY, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      const lineHits = [];
      const addLineHit = (ratio, rate, yStart, title, baseForDiff) => {
        const elapsedAt = Math.round(model.totalMonths * ratio);
        const remainingAt = Math.max(0, model.totalMonths - elapsedAt);
        const price = remainingAt === 0 ? model.face : bondPrice(model.face, model.couponRate, rate, remainingAt);
        const xAt = left + (axisRight - left) * ratio;
        const yAt = priceToY(visualDiscountPrice(model.face, rate, remainingAt));
        const lines = [
          `利回り ${(rate * 100).toFixed(2)}%`,
          `経過 ${monthsLabel(elapsedAt)}`,
          `残存 ${monthsLabel(remainingAt)}`,
          `評価額 ${money(price)}`
        ];
        if (baseForDiff !== null) {
          const basePriceAt = remainingAt === 0 ? model.face : bondPrice(model.face, model.couponRate, model.marketRate, remainingAt);
          lines.push(`基準比 ${money(price - basePriceAt)} (${((price / basePriceAt - 1) * 100).toFixed(2)}%)`);
        }
        lineHits.push({
          x: xAt * scale,
          y: yAt * scale,
          r: 16 * scale,
          title,
          lines
        });
      };
      for (let i = 0; i <= 120; i += 1) {
        const ratio = i / 120;
        addLineHit(ratio, model.marketRate, baseY, "① 基準", null);
        addLineHit(ratio, compareRate, compareY, "② 比較後", true);
      }

      hitMaps.set(canvas, [
        ...lineHits,
        {
          x: left * scale,
          y: baseY * scale,
          r: 28 * scale,
          title: "① 基準状態",
          lines: [
            `利回り ${(model.marketRate * 100).toFixed(2)}%`,
            `評価額 ${money(baseNow)}`,
            `満期まで ${monthsLabel(model.totalMonths)}`
          ]
        },
        {
          x: left * scale,
          y: compareY * scale,
          r: 28 * scale,
          title: "② 金利変動後",
          lines: [
            `比較利回り ${(compareRate * 100).toFixed(2)}%`,
            `評価額 ${money(compareNow)}`,
            `基準比 ${money(compareNow - baseNow)} (${((compareNow / baseNow - 1) * 100).toFixed(2)}%)`
          ]
        },
        {
          x: midX * scale,
          y: baseMidY * scale,
          r: 42 * scale,
          x1: (midX - 18) * scale,
          x2: (midX + 18) * scale,
          y1: (baseMidY - 34) * scale,
          y2: (baseMidY + 34) * scale,
          title: "中途評価 ①基準",
          lines: [
            `経過 ${monthsLabel(model.elapsed)}`,
            `残存 ${monthsLabel(remaining)}`,
            `評価額 ${money(baseMid)}`
          ]
        },
        {
          x: midX * scale,
          y: compareMidY * scale,
          r: 42 * scale,
          x1: (midX - 18) * scale,
          x2: (midX + 18) * scale,
          y1: (compareMidY - 34) * scale,
          y2: (compareMidY + 34) * scale,
          title: "中途評価 ②比較後",
          lines: [
            `比較利回り ${(compareRate * 100).toFixed(2)}%`,
            `評価額 ${money(compareMid)}`,
            `基準比 ${money(compareMid - baseMid)} (${((compareMid / baseMid - 1) * 100).toFixed(2)}%)`,
            `残存 ${monthsLabel(remaining)}`
          ]
        },
      ]);
    }

    function updateTable(model, basePrice) {
      const compareRate = (Number(els.compareRate.value) || 0) / 100;
      const remaining = Math.max(0, model.totalMonths - model.elapsed);
      const baseMid = bondPrice(model.face, model.couponRate, model.marketRate, remaining);
      const rows = [
        ["基準", model.marketRate],
        ["比較後", compareRate]
      ].map(([name, rate]) => {
        const price = bondPrice(model.face, model.couponRate, rate, remaining);
        const diffPct = (price / baseMid - 1) * 100;
        const cls = diffPct >= 0 ? "positive" : "negative";
        return `<tr>
          <td>${name}</td>
          <td>${(rate * 100).toFixed(2)}%</td>
          <td>${money(price)}</td>
          <td class="${cls}">${diffPct >= 0 ? "+" : ""}${diffPct.toFixed(2)}%</td>
          <td>${money(model.face)}</td>
        </tr>`;
      });
      els.summaryRows.innerHTML = rows.join("");
    }

    function update() {
      pinnedTooltip = false;
      els.tooltip.style.opacity = 0;
      els.tooltip.classList.remove("pinned");
      if ((Number(els.compareRate.value) || 0) < 0) {
        els.compareRate.value = "0.00";
      }
      const model = readModel();
      els.couponRate.disabled = false;
      els.elapsedLabel.textContent = monthsLabel(model.elapsed);

      const basePrice = bondPrice(model.face, model.couponRate, model.marketRate, model.totalMonths);
      const midPrice = bondPrice(model.face, model.couponRate, model.marketRate, model.totalMonths - model.elapsed);
      const cash = model.face;

      els.basePrice.textContent = money(basePrice);
      els.midPrice.textContent = money(midPrice);
      els.maturityCash.textContent = money(cash);
      updateDisplayButtons();

      renderShockChart(model, basePrice);
      updateTable(model, basePrice);
    }

    function getTooltipHit(canvas, event) {
      const hits = hitMaps.get(canvas) || [];
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      const x = (event.clientX - rect.left) * dpr;
      const y = (event.clientY - rect.top) * dpr;
      let closest = null;
      let bestDist = Infinity;
      hits.forEach(hit => {
        if (hit.x1 !== undefined && x >= hit.x1 && x <= hit.x2 && y >= hit.y1 && y <= hit.y2) {
          const centerDist = Math.hypot(hit.x - x, hit.y - y);
          if (centerDist < bestDist) {
            bestDist = centerDist;
            closest = hit;
          }
          return;
        }
        const dist = Math.hypot(hit.x - x, hit.y - y);
        if (dist < bestDist && dist <= hit.r) {
          bestDist = dist;
          closest = hit;
        }
      });
      return closest;
    }

    function renderTooltip(hit, clientX, clientY, pinned = false) {
      els.tooltip.innerHTML = `<strong>${hit.title}</strong>${hit.lines.map(line => `<div>${line}</div>`).join("")}`;
      els.tooltip.style.left = `${clientX}px`;
      els.tooltip.style.top = `${clientY}px`;
      els.tooltip.style.opacity = 1;
      els.tooltip.classList.toggle("pinned", pinned);
    }

    function clampPanelPosition(panel, x, y, container) {
      const maxX = Math.max(0, container.clientWidth - panel.offsetWidth - 4);
      const maxY = Math.max(0, container.clientHeight - panel.offsetHeight - 4);
      panel.style.left = `${clamp(x, 4, maxX)}px`;
      panel.style.top = `${clamp(y, 4, maxY)}px`;
    }

    function createPinnedTooltip(canvas, hit, clientX, clientY) {
      const container = canvas.closest(".chart-wrap");
      const rect = container.getBoundingClientRect();
      const panel = document.createElement("div");
      panel.className = "tooltip pinned";
      panel.innerHTML = `<button class="tooltip-close" type="button" aria-label="閉じる">×</button><strong>${hit.title}</strong>${hit.lines.map(line => `<div>${line}</div>`).join("")}`;
      panel.style.opacity = 1;
      container.appendChild(panel);
      clampPanelPosition(panel, clientX - rect.left + 12, clientY - rect.top + 12, container);
    }

    function hideTooltip() {
      if (pinnedTooltip) return;
      els.tooltip.style.opacity = 0;
      els.tooltip.classList.remove("pinned");
    }

    function showTooltip(canvas, event) {
      if (pinnedTooltip) return;
      const hit = getTooltipHit(canvas, event);
      if (!hit) {
        hideTooltip();
        return;
      }
      renderTooltip(hit, event.clientX, event.clientY, false);
    }

    [els.shockChart].forEach(canvas => {
      canvas.addEventListener("mousemove", event => showTooltip(canvas, event));
      canvas.addEventListener("mouseleave", hideTooltip);
      canvas.addEventListener("mousedown", event => {
        if (!chartGeometry) return;
        const rect = canvas.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        const x = (event.clientX - rect.left) * dpr / chartGeometry.scale;
        if (Math.abs(x - chartGeometry.midX) <= 14) {
          dragMidLine = true;
          midLineMoved = false;
          midLinePointer = { x: event.clientX, y: event.clientY };
          event.preventDefault();
        }
      });
      canvas.addEventListener("click", event => {
        if (performance.now() < suppressCanvasClickUntil) {
          suppressCanvasClickUntil = 0;
          return;
        }
        suppressCanvasClickUntil = 0;
        const hit = getTooltipHit(canvas, event);
        if (!hit) {
          hideTooltip();
          return;
        }
        createPinnedTooltip(canvas, hit, event.clientX, event.clientY);
      });
    });

    function updateElapsedFromPointer(event) {
      if (!dragMidLine || !chartGeometry) return;
      if (midLinePointer && Math.hypot(event.clientX - midLinePointer.x, event.clientY - midLinePointer.y) < 4) {
        return;
      }
      midLineMoved = true;
      const rect = els.shockChart.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      const x = (event.clientX - rect.left) * dpr / chartGeometry.scale;
      const ratio = clamp((x - chartGeometry.left) / (chartGeometry.right - chartGeometry.left), 0, 1);
      els.elapsedMonths.value = Math.round(chartGeometry.totalMonths * ratio);
      update();
    }

    window.addEventListener("mousedown", event => {
      if (event.target.closest && event.target.closest(".tooltip-close")) return;
      const panel = event.target.closest ? event.target.closest(".tooltip.pinned") : null;
      if (!panel) return;
      const panelRect = panel.getBoundingClientRect();
      const containerRect = panel.parentElement.getBoundingClientRect();
      dragTooltip = {
        panel,
        container: panel.parentElement,
        dx: event.clientX - panelRect.left,
        dy: event.clientY - panelRect.top,
        ox: containerRect.left,
        oy: containerRect.top
      };
      event.preventDefault();
    });

    window.addEventListener("mousemove", event => {
      updateElapsedFromPointer(event);
      if (!dragTooltip) return;
      clampPanelPosition(
        dragTooltip.panel,
        event.clientX - dragTooltip.ox - dragTooltip.dx,
        event.clientY - dragTooltip.oy - dragTooltip.dy,
        dragTooltip.container
      );
    });

    window.addEventListener("mouseup", () => {
      if (dragMidLine && midLineMoved) {
        suppressCanvasClickUntil = performance.now() + 250;
      }
      dragMidLine = false;
      midLinePointer = null;
      midLineMoved = false;
      dragTooltip = null;
    });

    window.addEventListener("click", event => {
      const close = event.target.closest ? event.target.closest(".tooltip-close") : null;
      if (close) {
        close.closest(".tooltip.pinned").remove();
      }
    });

    els.faceValue.addEventListener("input", () => {
      formatFaceInput();
      update();
    });
    els.faceValue.addEventListener("change", () => {
      formatFaceInput();
      update();
    });

    els.currencyYen.addEventListener("click", () => setCurrency("JPY"));
    els.currencyDollar.addEventListener("click", () => setCurrency("USD"));
    els.fxRatePrimary.addEventListener("input", () => syncFx(els.fxRatePrimary));
    els.fxRateCompare.addEventListener("input", () => syncFx(els.fxRateCompare));
    els.displayDollar.addEventListener("click", () => {
      showYenConversion = false;
      updateDisplayButtons();
      update();
    });
    els.displayYen.addEventListener("click", () => {
      showYenConversion = currency === "USD";
      updateDisplayButtons();
      update();
    });
    els.amountAdjust.addEventListener("click", event => {
      event.stopPropagation();
      els.amountPopover.classList.toggle("open");
    });
    els.amountPopover.addEventListener("click", event => {
      const button = event.target.closest("button[data-delta]");
      if (!button) return;
      adjustFace(Number(button.dataset.delta));
    });
    window.addEventListener("click", event => {
      if (!event.target.closest(".amount-row")) {
        els.amountPopover.classList.remove("open");
      }
    });

    [els.couponRate, els.compareRate].forEach(el => {
      el.addEventListener("blur", () => {
        el.value = (Number(el.value) || 0).toLocaleString("en-US", {
          useGrouping: false, minimumFractionDigits: 2, maximumFractionDigits: 2
        });
        update();
      });
      el.addEventListener("keydown", event => {
        if (event.key === "Enter" && !event.isComposing) el.blur();
      });
    });

    [els.couponRate, els.years, els.months, els.elapsedMonths, els.compareRate].forEach(el => {
      el.addEventListener("input", update);
      el.addEventListener("change", update);
    });

    els.couponBond.addEventListener("click", () => {
      bondType = "coupon";
      els.couponBond.classList.add("active");
      els.zeroBond.classList.remove("active");
      update();
    });

    els.zeroBond.addEventListener("click", () => {
      bondType = "zero";
      els.zeroBond.classList.add("active");
      els.couponBond.classList.remove("active");
      update();
    });

    window.addEventListener("resize", update);
    renderAmountPopover();
    formatFaceInput();
    update();
  </script>
</body>
</html>
