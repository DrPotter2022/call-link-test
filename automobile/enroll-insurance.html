<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自動車保険の普及率</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.6.1/dist/chart.umd.min.js" integrity="sha384-Emf5ZVIUiarAdhkgtqK+5/Z5qIvM6QoVrS+qAVtfyZVuD5lIHrac0me485+Antp0" crossorigin="anonymous"></script>
  <style>
    body {
      font-family: sans-serif;
      margin: 40px;
      color: #111827;
      background: #fff;
    }

    h2 { margin-bottom: 24px; }

    .top-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      align-items: center;
      margin-bottom: 18px;
    }

    select,
    input[type="number"] {
      font-size: 15px;
      padding: 6px 8px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: #fff;
    }

    #checkboxes {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin: 12px 0 22px;
    }

    #checkboxes label,
    .axis-panel label {
      cursor: pointer;
      user-select: none;
    }

    .main-layout {
      display: grid;
      grid-template-columns: 240px minmax(0, 1fr);
      gap: 22px;
      align-items: stretch;
    }

    .axis-panel {
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 16px;
      background: #fafafa;
      min-height: 460px;
      box-sizing: border-box;
    }

    .axis-panel h3 {
      margin: 0 0 18px;
      font-size: 16px;
    }

    .axis-control {
      margin-bottom: 22px;
    }

    .axis-control-title {
      font-weight: 700;
      margin-bottom: 8px;
      display: block;
    }

    .axis-slider-row {
      display: grid;
      grid-template-columns: 1fr 72px;
      gap: 8px;
      align-items: center;
    }

    input[type="range"] {
      width: 100%;
    }

    .hint {
      font-size: 12px;
      color: #64748b;
      line-height: 1.5;
      margin-top: 8px;
    }

    .button-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 18px;
    }

    button {
      font-size: 14px;
      padding: 8px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
    }

    button:hover { background: #f1f5f9; }

    .chart-container {
      width: 100%;
      height: 560px;
      position: relative;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 12px;
      box-sizing: border-box;
      background: #fff;
    }

    .status {
      margin: 8px 0 14px;
      color: #475569;
      font-size: 13px;
    }

    @media (max-width: 820px) {
      body { margin: 20px; }
      .main-layout { grid-template-columns: 1fr; }
      .axis-panel { min-height: auto; }
      .chart-container { height: 460px; }
    }
  </style>
</head>
<body>
  <h2>自動車保険の普及率</h2>

  <div class="top-controls">
    <div>
      <label for="pref-select">都道府県を選択：</label>
      <select id="pref-select">
        <option value="">───</option>
      </select>
    </div>
  </div>

  <div id="status" class="status">JSONを読み込み中：data/insurance_data.json</div>

  <div id="checkboxes">
    <label><input type="checkbox" value="対人賠償" checked> 対人賠償</label>
    <label><input type="checkbox" value="対物賠償" checked> 対物賠償</label>
    <label><input type="checkbox" value="人身傷害" checked> 人身傷害</label>
    <label><input type="checkbox" value="搭乗者傷害" checked> 搭乗者傷害</label>
    <label><input type="checkbox" value="車両保険" checked> 車両保険</label>
  </div>

  <div class="main-layout">
    <aside class="axis-panel">
      <h3>縦軸調整</h3>

      <div class="axis-control">
        <label><input type="checkbox" id="auto-y-axis" checked> 自動調整</label>
        <div class="hint">チェックあり：選択中データに合わせて縦軸を自動調整します。</div>
      </div>

      <div class="axis-control">
        <span class="axis-control-title">最小値（%）</span>
        <div class="axis-slider-row">
          <input type="range" id="y-min-range" min="0" max="100" step="0.1" value="0">
          <input type="number" id="y-min-input" min="0" max="100" step="0.1" value="0">
        </div>
      </div>

      <div class="axis-control">
        <span class="axis-control-title">最大値（%）</span>
        <div class="axis-slider-row">
          <input type="range" id="y-max-range" min="0" max="100" step="0.1" value="100">
          <input type="number" id="y-max-input" min="0" max="100" step="0.1" value="100">
        </div>
      </div>

      <div class="button-row">
        <button type="button" id="auto-fit-btn">表示データに合わせる</button>
        <button type="button" id="reset-axis-btn">0〜100%に戻す</button>
      </div>

      <div class="hint">手動調整する場合は「自動調整」のチェックを外してください。</div>
    </aside>

    <div class="chart-container">
      <canvas id="myChart"></canvas>
    </div>
  </div>

  <script src="enroll-insurance.inline-1.js"></script>
</body>
</html>
