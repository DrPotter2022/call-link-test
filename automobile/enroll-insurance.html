<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>自動車保険の普及率</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: sans-serif;
      margin: 40px;
      color: #222;
      background: #fff;
    }

    h2 { margin: 0 0 20px; }

    .top-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 16px 24px;
      align-items: center;
      margin-bottom: 18px;
    }

    .json-loader {
      display: block;
      margin: 0 0 18px;
      padding: 14px 16px;
      border: 1px solid #b8d6ff;
      border-radius: 10px;
      background: #f4f9ff;
      line-height: 1.6;
    }

    .json-loader strong { display: block; margin-bottom: 6px; }
    .json-loader input { margin-top: 8px; }

    select,
    input[type="number"] {
      padding: 6px 8px;
      border: 1px solid #bbb;
      border-radius: 6px;
      font-size: 14px;
    }

    #checkboxes {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 14px;
      margin-bottom: 18px;
    }

    #checkboxes label,
    .axis-control label {
      cursor: pointer;
      user-select: none;
    }

    .dashboard-layout {
      display: grid;
      grid-template-columns: 240px minmax(0, 1fr);
      gap: 22px;
      align-items: stretch;
      width: 100%;
    }

    .axis-slicer {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 16px;
      background: #fafafa;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }

    .axis-slicer h3 {
      margin: 0 0 14px;
      font-size: 16px;
    }

    .axis-control {
      margin-bottom: 16px;
    }

    .axis-control-title {
      display: block;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .axis-row {
      display: grid;
      grid-template-columns: 1fr 72px;
      gap: 8px;
      align-items: center;
    }

    input[type="range"] {
      width: 100%;
    }

    .axis-note {
      font-size: 12px;
      color: #666;
      line-height: 1.55;
      margin-top: 10px;
    }

    .button-row {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    button {
      padding: 7px 10px;
      border: 1px solid #bbb;
      border-radius: 7px;
      background: #fff;
      cursor: pointer;
      font-size: 13px;
    }

    button:hover { background: #f2f2f2; }

    .chart-container {
      width: 100%;
      height: 560px;
      min-height: 420px;
      position: relative;
      border: 1px solid #eee;
      border-radius: 12px;
      padding: 12px;
      background: #fff;
    }

    @media (max-width: 860px) {
      body { margin: 20px; }
      .dashboard-layout { grid-template-columns: 1fr; }
      .chart-container { height: 480px; }
    }
  </style>
</head>
<body>
  <h2>自動車保険の普及率</h2>

  <div class="top-controls">
    <label for="pref-select">都道府県を選択：</label>
    <select id="pref-select">
      <option value="">───</option>
    </select>
  </div>

  <div id="json-loader" class="json-loader">
    <strong>JSONファイルを選択してください</strong>
    ChromeでHTMLを直接開く場合、<code>fetch()</code> によるローカルJSONの自動読み込みはCORS制限でブロックされます。<br>
    この版では自動fetchを廃止し、下のボタンから <code>insurance_data.json</code> を直接選択して読み込みます。
    <br>
    <input type="file" id="json-file-input" accept=".json,application/json">
  </div>

  <div id="checkboxes">
    <label><input type="checkbox" value="対人賠償" checked> 対人賠償</label>
    <label><input type="checkbox" value="対物賠償" checked> 対物賠償</label>
    <label><input type="checkbox" value="人身傷害" checked> 人身傷害</label>
    <label><input type="checkbox" value="搭乗者傷害" checked> 搭乗者傷害</label>
    <label><input type="checkbox" value="車両保険" checked> 車両保険</label>
  </div>

  <div class="dashboard-layout">
    <aside class="axis-slicer" aria-label="縦軸調整スライサー">
      <h3>縦軸調整</h3>

      <div class="axis-control">
        <label>
          <input type="checkbox" id="auto-axis" checked>
          自動調整
        </label>
        <div class="axis-note">チェックあり：選択中データに合わせて縦軸を自動調整します。</div>
      </div>

      <div class="axis-control">
        <span class="axis-control-title">最小値（%）</span>
        <div class="axis-row">
          <input type="range" id="y-min-range" min="0" max="100" step="0.1" value="0" disabled>
          <input type="number" id="y-min-input" min="0" max="100" step="0.1" value="0" disabled>
        </div>
      </div>

      <div class="axis-control">
        <span class="axis-control-title">最大値（%）</span>
        <div class="axis-row">
          <input type="range" id="y-max-range" min="0" max="100" step="0.1" value="100" disabled>
          <input type="number" id="y-max-input" min="0" max="100" step="0.1" value="100" disabled>
        </div>
      </div>

      <div class="button-row">
        <button type="button" id="reset-axis">0〜100に戻す</button>
      </div>

      <div class="axis-note">
        変化が小さい場合は、自動調整をオフにして例：90〜100%、70〜100%などにすると推移が見やすくなります。
      </div>
    </aside>

    <div class="chart-container">
      <canvas id="myChart"></canvas>
    </div>
  </div>

  <script>
    const select = document.getElementById('pref-select');
    const checkboxContainer = document.getElementById('checkboxes');
    const ctx = document.getElementById('myChart').getContext('2d');

    const jsonLoader = document.getElementById('json-loader');
    const jsonFileInput = document.getElementById('json-file-input');

    const autoAxis = document.getElementById('auto-axis');
    const yMinRange = document.getElementById('y-min-range');
    const yMaxRange = document.getElementById('y-max-range');
    const yMinInput = document.getElementById('y-min-input');
    const yMaxInput = document.getElementById('y-max-input');
    const resetAxis = document.getElementById('reset-axis');

    let allData, chartInstance;

    // --- JSON を読み込む ---
    // ChromeでHTMLをローカル表示する場合、fetch()でfile://配下のJSONを読むとCORS制限で失敗します。
    // そのため、この版ではfetchを使わず、FileReaderでユーザーが選択したJSONを読み込みます。

    function initializeData(json) {
      allData = json;
      select.innerHTML = '<option value="">───</option>';

      Object.keys(allData).forEach(pref => {
        const opt = document.createElement('option');
        opt.value = pref;
        opt.textContent = pref;
        select.appendChild(opt);
      });

      select.value = allData['全国平均'] ? '全国平均' : Object.keys(allData)[0];
      jsonLoader.style.display = 'block';
      renderChart();
    }

    jsonFileInput.addEventListener('change', event => {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = e => {
        try {
          const json = JSON.parse(e.target.result);
          initializeData(json);
        } catch (err) {
          alert('JSONファイルの形式を確認してください：' + err.message);
        }
      };
      reader.onerror = () => alert('JSONファイルの読み込みに失敗しました。');
      reader.readAsText(file, 'UTF-8');
    });

    function toNumber(value) {
      const num = Number(value);
      return Number.isFinite(num) ? num : null;
    }

    function setAxisControlDisabled(disabled) {
      [yMinRange, yMaxRange, yMinInput, yMaxInput].forEach(el => {
        el.disabled = disabled;
      });
    }

    function syncAxisControls(source, value) {
      const fixedValue = Math.max(0, Math.min(100, Number(value))).toFixed(1);
      if (source === yMinRange || source === yMinInput) {
        yMinRange.value = fixedValue;
        yMinInput.value = fixedValue;
      }
      if (source === yMaxRange || source === yMaxInput) {
        yMaxRange.value = fixedValue;
        yMaxInput.value = fixedValue;
      }
    }

    function getSelectedDatasets(getData) {
      return Array.from(
        checkboxContainer.querySelectorAll('input[type=checkbox]')
      ).filter(cb => cb.checked).map(cb => ({
        label: cb.value,
        data: getData(cb.value),
        borderWidth: 2,
        fill: false,
        tension: 0.2,
        pointRadius: 3,
        pointHoverRadius: 5
      }));
    }

    function getAxisOptions(datasets) {
      const values = datasets
        .flatMap(d => d.data)
        .map(toNumber)
        .filter(v => v !== null);

      if (values.length === 0) {
        return { beginAtZero: true };
      }

      if (autoAxis.checked) {
        const dataMin = Math.min(...values);
        const dataMax = Math.max(...values);
        const range = Math.max(dataMax - dataMin, 1);
        const padding = Math.max(range * 0.15, 0.5);
        return {
          min: Math.max(0, Math.floor((dataMin - padding) * 10) / 10),
          max: Math.min(100, Math.ceil((dataMax + padding) * 10) / 10),
          ticks: {
            callback: value => Number(value).toFixed(1) + '%'
          }
        };
      }

      let min = toNumber(yMinInput.value);
      let max = toNumber(yMaxInput.value);

      if (min === null) min = 0;
      if (max === null) max = 100;
      if (min >= max) {
        max = Math.min(100, min + 1);
        if (max === min) min = Math.max(0, max - 1);
        yMinInput.value = yMinRange.value = min.toFixed(1);
        yMaxInput.value = yMaxRange.value = max.toFixed(1);
      }

      return {
        min,
        max,
        ticks: {
          callback: value => Number(value).toFixed(1) + '%'
        }
      };
    }

    function renderChart() {
      if (!allData) return;

      const raw = allData[select.value];
      if (!raw) {
        // 選択なし or データなし
        if (chartInstance) chartInstance.destroy();
        return;
      }

      let labels, getData;
      if (Array.isArray(raw)) {
        // [{年度:..., 対人賠償:...},...] の形式
        labels = raw.map(r => r.年度);
        getData = field => raw.map(r => toNumber(r[field]));
      } else {
        // { 年度: [...], 対人賠償: [...], ... } の形式
        labels = raw.年度;
        getData = field => raw[field].map(toNumber);
      }

      const datasets = getSelectedDatasets(getData);

      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: { labels, datasets },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: {
            mode: 'index',
            intersect: false
          },
          plugins: {
            tooltip: {
              callbacks: {
                label: context => `${context.dataset.label}: ${Number(context.parsed.y).toFixed(1)}%`
              }
            }
          },
          scales: {
            y: getAxisOptions(datasets)
          }
        }
      });
    }

    select.addEventListener('change', renderChart);
    checkboxContainer.querySelectorAll('input[type=checkbox]')
      .forEach(cb => cb.addEventListener('change', renderChart));

    autoAxis.addEventListener('change', () => {
      setAxisControlDisabled(autoAxis.checked);
      renderChart();
    });

    [yMinRange, yMinInput, yMaxRange, yMaxInput].forEach(el => {
      el.addEventListener('input', event => {
        syncAxisControls(event.target, event.target.value);
        renderChart();
      });
    });

    resetAxis.addEventListener('click', () => {
      autoAxis.checked = false;
      setAxisControlDisabled(false);
      yMinRange.value = yMinInput.value = '0.0';
      yMaxRange.value = yMaxInput.value = '100.0';
      renderChart();
    });
  </script>
</body>
</html>
