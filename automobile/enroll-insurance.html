<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自動車保険の普及率</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: sans-serif;
      margin: 40px;
      color: #111827;
      background: #fff;
    }

    h2 { margin-bottom: 24px; }

    .top-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      align-items: center;
      margin-bottom: 18px;
    }

    select,
    input[type="number"] {
      font-size: 15px;
      padding: 6px 8px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: #fff;
    }

    #checkboxes {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin: 12px 0 22px;
    }

    #checkboxes label,
    .axis-panel label {
      cursor: pointer;
      user-select: none;
    }

    .main-layout {
      display: grid;
      grid-template-columns: 240px minmax(0, 1fr);
      gap: 22px;
      align-items: stretch;
    }

    .axis-panel {
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 16px;
      background: #fafafa;
      min-height: 460px;
      box-sizing: border-box;
    }

    .axis-panel h3 {
      margin: 0 0 18px;
      font-size: 16px;
    }

    .axis-control {
      margin-bottom: 22px;
    }

    .axis-control-title {
      font-weight: 700;
      margin-bottom: 8px;
      display: block;
    }

    .axis-slider-row {
      display: grid;
      grid-template-columns: 1fr 72px;
      gap: 8px;
      align-items: center;
    }

    input[type="range"] {
      width: 100%;
    }

    .hint {
      font-size: 12px;
      color: #64748b;
      line-height: 1.5;
      margin-top: 8px;
    }

    .button-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 18px;
    }

    button {
      font-size: 14px;
      padding: 8px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
    }

    button:hover { background: #f1f5f9; }

    .chart-container {
      width: 100%;
      height: 560px;
      position: relative;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 12px;
      box-sizing: border-box;
      background: #fff;
    }

    .status {
      margin: 8px 0 14px;
      color: #475569;
      font-size: 13px;
    }

    @media (max-width: 820px) {
      body { margin: 20px; }
      .main-layout { grid-template-columns: 1fr; }
      .axis-panel { min-height: auto; }
      .chart-container { height: 460px; }
    }
  </style>
</head>
<body>
  <h2>自動車保険の普及率</h2>

  <div class="top-controls">
    <div>
      <label for="pref-select">都道府県を選択：</label>
      <select id="pref-select">
        <option value="">───</option>
      </select>
    </div>
  </div>

  <div id="status" class="status">JSONを読み込み中：data/insurance_data.json</div>

  <div id="checkboxes">
    <label><input type="checkbox" value="対人賠償" checked> 対人賠償</label>
    <label><input type="checkbox" value="対物賠償" checked> 対物賠償</label>
    <label><input type="checkbox" value="人身傷害" checked> 人身傷害</label>
    <label><input type="checkbox" value="搭乗者傷害" checked> 搭乗者傷害</label>
    <label><input type="checkbox" value="車両保険" checked> 車両保険</label>
  </div>

  <div class="main-layout">
    <aside class="axis-panel">
      <h3>縦軸調整</h3>

      <div class="axis-control">
        <label><input type="checkbox" id="auto-y-axis" checked> 自動調整</label>
        <div class="hint">チェックあり：選択中データに合わせて縦軸を自動調整します。</div>
      </div>

      <div class="axis-control">
        <span class="axis-control-title">最小値（%）</span>
        <div class="axis-slider-row">
          <input type="range" id="y-min-range" min="0" max="100" step="0.1" value="0">
          <input type="number" id="y-min-input" min="0" max="100" step="0.1" value="0">
        </div>
      </div>

      <div class="axis-control">
        <span class="axis-control-title">最大値（%）</span>
        <div class="axis-slider-row">
          <input type="range" id="y-max-range" min="0" max="100" step="0.1" value="100">
          <input type="number" id="y-max-input" min="0" max="100" step="0.1" value="100">
        </div>
      </div>

      <div class="button-row">
        <button type="button" id="auto-fit-btn">表示データに合わせる</button>
        <button type="button" id="reset-axis-btn">0〜100%に戻す</button>
      </div>

      <div class="hint">手動調整する場合は「自動調整」のチェックを外してください。</div>
    </aside>

    <div class="chart-container">
      <canvas id="myChart"></canvas>
    </div>
  </div>

  <script>
    const JSON_PATH = 'data/insurance_data.json';

    const select = document.getElementById('pref-select');
    const checkboxContainer = document.getElementById('checkboxes');
    const ctx = document.getElementById('myChart').getContext('2d');
    const statusEl = document.getElementById('status');

    const autoYAxis = document.getElementById('auto-y-axis');
    const yMinRange = document.getElementById('y-min-range');
    const yMaxRange = document.getElementById('y-max-range');
    const yMinInput = document.getElementById('y-min-input');
    const yMaxInput = document.getElementById('y-max-input');
    const autoFitBtn = document.getElementById('auto-fit-btn');
    const resetAxisBtn = document.getElementById('reset-axis-btn');

    let allData;
    let chartInstance;
    let currentDatasets = [];

    fetch(JSON_PATH)
      .then(res => {
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
      })
      .then(json => {
        allData = json;
        Object.keys(allData).forEach(pref => {
          const opt = document.createElement('option');
          opt.value = pref;
          opt.textContent = pref;
          select.appendChild(opt);
        });
        select.value = allData['全国平均'] ? '全国平均' : Object.keys(allData)[0];
        statusEl.textContent = `JSON読み込み完了：${JSON_PATH}`;
        renderChart();
      })
      .catch(err => {
        statusEl.textContent = `JSON読み込み失敗：${JSON_PATH} / ${err.message}`;
        alert('JSON読み込み失敗：' + err.message + '\n\nGitHub上で HTML と同じ階層に data/insurance_data.json があるか確認してください。');
      });

    function toNumber(value) {
      if (value === null || value === undefined || value === '') return null;
      const num = Number(String(value).replace('%', '').trim());
      return Number.isFinite(num) ? num : null;
    }

    function getVisibleValues(datasets) {
      return datasets
        .flatMap(d => d.data)
        .map(toNumber)
        .filter(v => v !== null);
    }

    function getAutoAxis(values) {
      if (!values.length) return { min: 0, max: 100 };
      const minValue = Math.min(...values);
      const maxValue = Math.max(...values);
      const span = Math.max(maxValue - minValue, 1);
      const padding = Math.max(span * 0.15, 0.5);
      const min = Math.max(0, Math.floor((minValue - padding) * 10) / 10);
      const max = Math.min(100, Math.ceil((maxValue + padding) * 10) / 10);
      return min >= max ? { min: Math.max(0, min - 1), max: Math.min(100, max + 1) } : { min, max };
    }

    function syncAxisInputs(min, max) {
      yMinRange.value = min;
      yMinInput.value = min;
      yMaxRange.value = max;
      yMaxInput.value = max;
    }

    function getManualAxis() {
      let min = toNumber(yMinInput.value);
      let max = toNumber(yMaxInput.value);
      if (min === null) min = 0;
      if (max === null) max = 100;
      min = Math.max(0, Math.min(100, min));
      max = Math.max(0, Math.min(100, max));
      if (min >= max) max = Math.min(100, min + 1);
      return { min, max };
    }

    function setAxisControlsDisabled(disabled) {
      yMinRange.disabled = disabled;
      yMinInput.disabled = disabled;
      yMaxRange.disabled = disabled;
      yMaxInput.disabled = disabled;
    }

    function getAxisForChart(datasets) {
      if (autoYAxis.checked) {
        const axis = getAutoAxis(getVisibleValues(datasets));
        syncAxisInputs(axis.min, axis.max);
        setAxisControlsDisabled(true);
        return axis;
      }
      setAxisControlsDisabled(false);
      const axis = getManualAxis();
      syncAxisInputs(axis.min, axis.max);
      return axis;
    }

    function renderChart() {
      if (!allData) return;

      const raw = allData[select.value];
      if (!raw) {
        if (chartInstance) chartInstance.destroy();
        return;
      }

      let labels, getData;
      if (Array.isArray(raw)) {
        labels = raw.map(r => r.年度);
        getData = field => raw.map(r => toNumber(r[field]));
      } else {
        labels = raw.年度;
        getData = field => raw[field].map(toNumber);
      }

      const datasets = Array.from(
        checkboxContainer.querySelectorAll('input[type=checkbox]')
      ).filter(cb => cb.checked).map(cb => ({
        label: cb.value,
        data: getData(cb.value),
        borderWidth: 2,
        fill: false,
        tension: 0.15,
        pointRadius: 3
      }));

      currentDatasets = datasets;
      const axis = getAxisForChart(datasets);

      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: { labels, datasets },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            tooltip: {
              callbacks: {
                label: context => `${context.dataset.label}: ${Number(context.parsed.y).toFixed(1)}%`
              }
            }
          },
          scales: {
            y: {
              min: axis.min,
              max: axis.max,
              ticks: {
                callback: value => Number(value).toFixed(1) + '%'
              }
            }
          }
        }
      });
    }

    function updateManualPair(source, target) {
      target.value = source.value;
      autoYAxis.checked = false;
      setAxisControlsDisabled(false);
      renderChart();
    }

    select.addEventListener('change', renderChart);
    checkboxContainer.querySelectorAll('input[type=checkbox]').forEach(cb => cb.addEventListener('change', renderChart));

    autoYAxis.addEventListener('change', renderChart);
    yMinRange.addEventListener('input', () => updateManualPair(yMinRange, yMinInput));
    yMinInput.addEventListener('input', () => updateManualPair(yMinInput, yMinRange));
    yMaxRange.addEventListener('input', () => updateManualPair(yMaxRange, yMaxInput));
    yMaxInput.addEventListener('input', () => updateManualPair(yMaxInput, yMaxRange));

    autoFitBtn.addEventListener('click', () => {
      const axis = getAutoAxis(getVisibleValues(currentDatasets));
      autoYAxis.checked = false;
      setAxisControlsDisabled(false);
      syncAxisInputs(axis.min, axis.max);
      renderChart();
    });

    resetAxisBtn.addEventListener('click', () => {
      autoYAxis.checked = false;
      setAxisControlsDisabled(false);
      syncAxisInputs(0, 100);
      renderChart();
    });
  </script>
</body>
</html>
