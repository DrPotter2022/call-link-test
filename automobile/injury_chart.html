<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>用途車種別：人身傷害保険金額区分構成比（円グラフ）</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.6.1/dist/chart.umd.min.js" integrity="sha384-Emf5ZVIUiarAdhkgtqK+5/Z5qIvM6QoVrS+qAVtfyZVuD5lIHrac0me485+Antp0" crossorigin="anonymous"></script>
  <style>
    body {
      font-family: sans-serif;
      margin: 20px;
    }
    h1 {
      font-size: 20px;
      margin-bottom: 10px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
    }
    #chart-container {
      height: 400px;
    }
    .tooltip-icon {
      display: inline-block;
      width: 16px;
      height: 16px;
      background-color: #ccc;
      color: white;
      border-radius: 50%;
      text-align: center;
      font-size: 12px;
      line-height: 16px;
      cursor: pointer;
      margin-left: 6px;
    }
    select {
      font-size: 14px;
      margin-left: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>用途車種別：人身傷害保険金額区分構成比（円グラフ）</h1>
    <label for="vehicleType">用途車種を選択：
      <select id="vehicleType"></select>
      <span id="infoIcon" class="tooltip-icon" title="用途車種の詳細情報を表示します。">i</span>
    </label>
    <div id="chart-container">
      <canvas id="insuranceChart"></canvas>
    </div>
  </div>

  <script src="injury_chart.inline-1.js"></script>
</body>
</html>
