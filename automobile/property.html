<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>対物賠償の保険金額帯別加入割合（スライサー）</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.6.1/dist/chart.umd.min.js" integrity="sha384-Emf5ZVIUiarAdhkgtqK+5/Z5qIvM6QoVrS+qAVtfyZVuD5lIHrac0me485+Antp0" crossorigin="anonymous"></script>
  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100vw; height: 100vh;
      display: flex; flex-direction: column;
      align-items: center;
    }
    h1 { margin: 16px 0 8px; font-size: 1.5em; }
    #controls {
      padding: 8px;
      display: flex; align-items: center; gap: 16px;
    }
    #vehicleTypes {
      display: flex; flex-wrap: wrap; gap: 8px; max-width: 70vw;
    }
    #chart-container {
      width: 50vw; height: 50vh;
      display: flex; align-items: center; justify-content: center;
    }
    canvas { width: 100%; height: 100%; }
    label, span { font-size: 14px; }
    #yearSlider { width: 200px; }
  </style>
</head>
<body>
  <h1>対物賠償の保険金額帯別加入割合</h1>
  <div id="controls">
    <label>年度:
      <input type="range" id="yearSlider" />
      <span id="yearDisplay"></span>
    </label>
    <div>
      <span>用途車種:</span>
      <div id="vehicleTypes"></div>
    </div>
  </div>
  <div id="chart-container">
    <canvas id="chartCanvas"></canvas>
  </div>
  <script src="property.inline-1.js"></script>
</body>
</html>
