<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>シリコンサイクル分析ツール v1.0.1</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root {
  --bg:#f5f7fb;--panel:#fff;--ink:#172033;--muted:#667085;--line:#d7dde8;--nav:#103b5f;--accent:#1769aa;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP","Yu Gothic",sans-serif}
header{padding:14px 20px;background:var(--nav);color:#fff}
header h1{margin:0 0 4px;font-size:20px}
header p{margin:0;color:#dbeaf6;font-size:13px}
.layout{display:grid;grid-template-columns:320px 1fr;gap:12px;padding:12px;transition:grid-template-columns .2s ease}
.layout.collapsed{grid-template-columns:48px 1fr}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 5px rgba(15,31,50,.06)}
.sidebar{padding:12px;min-height:calc(100vh - 88px);position:sticky;top:10px;overflow:auto}
.layout.collapsed .sidebar{padding:8px;overflow:hidden}
.sidebar-content{display:block}
.layout.collapsed .sidebar-content{display:none}
.collapse-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:700}
.sidebar-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
h2{font-size:15px;margin:0 0 10px}
h3{font-size:13px;margin:14px 0 7px;color:#103b5f}
.series-item{border-bottom:1px solid #eef1f6;padding:7px 0}
.series-item label{display:flex;gap:8px;align-items:center;font-size:13px;line-height:1.35}
.series-item small{display:block;margin-left:25px;color:#8a94a6;font-size:11px}
.controls{padding:12px;display:grid;gap:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
label{font-size:13px}
select,input[type=number],input[type=file]{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;max-width:100%}
input[type=range]{width:100%}
.dual-slider-wrap{position:relative;height:44px;margin:4px 0 0}
.dual-slider-track{position:absolute;left:0;right:0;top:19px;height:8px;border-radius:999px;background:#dfe6ef}
.dual-slider-range{position:absolute;top:19px;height:8px;border-radius:999px;background:#1769aa}
.dual-slider-wrap input[type=range]{position:absolute;left:0;right:0;top:10px;width:100%;pointer-events:none;appearance:none;-webkit-appearance:none;background:transparent;margin:0}
.dual-slider-wrap input[type=range]::-webkit-slider-thumb{pointer-events:auto;appearance:none;-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#1769aa;border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.25);cursor:pointer}
.dual-slider-wrap input[type=range]::-moz-range-thumb{pointer-events:auto;width:18px;height:18px;border-radius:50%;background:#1769aa;border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.25);cursor:pointer}
.dual-slider-wrap input[type=range]::-webkit-slider-runnable-track{background:transparent;height:8px}
.dual-slider-wrap input[type=range]::-moz-range-track{background:transparent;height:8px}
.slider-scale{display:flex;justify-content:space-between;font-size:11px;color:#667085}
#chart{width:100%;height:68vh;min-height:520px}
.chart-card{padding:8px}
.note{color:var(--muted);font-size:12px;line-height:1.65;margin:8px 0 0}
.warn{background:#fff7e6;border:1px solid #ffe0a3;color:#6b4a00;padding:10px;border-radius:8px;font-size:12px;line-height:1.55;margin-top:10px}
.stats{padding:12px;overflow:auto}
table{border-collapse:collapse;width:100%;font-size:12px;background:#fff}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{background:#eef5fb;color:#103b5f}
button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 10px;cursor:pointer}
button:hover{background:#f0f5fa}
.toggle-row{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;border-bottom:1px solid #eef1f6;padding:6px 0;font-size:12px}
.switch{position:relative;display:inline-block;width:38px;height:20px}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:#cbd5e1;transition:.2s;border-radius:999px}
.slider:before{position:absolute;content:"";height:16px;width:16px;left:2px;bottom:2px;background:white;transition:.2s;border-radius:50%;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.switch input:checked + .slider{background:var(--switch-on,#1769aa)}
.switch input:checked + .slider:before{transform:translateX(18px)}
.palette-panel{display:none;border:1px solid #e3e8f0;border-radius:10px;padding:10px;margin-top:8px;background:#fbfdff}
.palette-panel.open{display:block}
.color-row{display:grid;grid-template-columns:1fr 44px;gap:8px;align-items:center;margin:6px 0;font-size:12px}
.color-row input{width:42px;height:28px;border:0;background:none;padding:0}
.file-box{border:1px dashed #cbd5e1;border-radius:10px;padding:10px;background:#fbfdff}
@media(max-width:1000px){
  .layout{grid-template-columns:1fr}
  .layout.collapsed{grid-template-columns:1fr}
  .sidebar{position:static;min-height:auto}
  .layout.collapsed .sidebar-content{display:block}
  #chart{height:58vh;min-height:420px}
}
@media(max-width:640px){
  header h1{font-size:17px}
  .row{align-items:stretch}
  .row label{width:100%}
  #chart{height:55vh;min-height:360px}
  table{font-size:11px}
  th,td{padding:5px}
}
</style>
</head>
<body>
<header>
  <h1>シリコンサイクル分析ツール v1.0.1 色補正版 色補正版</h1>
  <p>起点年＝100で指数化。表示期間・系列・網掛け条件を切り替えて、WSTSと株価指数の連動を確認します。</p>
</header>

<div class="layout" id="layout">
  <aside class="card sidebar">
    <div class="sidebar-head">
      <button class="collapse-btn" id="collapseBtn" title="左メニューを収納/展開">−</button>
      <div class="sidebar-content"><strong>設定</strong></div>
    </div>
    <div class="sidebar-content">
      <h2>表示データ</h2>
      <div id="seriesList"></div>
      <div class="warn" id="missingNote"></div>

      <h3>網掛け条件</h3>
      <p class="note">ONにした項目の上昇・下落を年ごとに数え、該当数に応じて背景色を付けます。</p>
      <div id="shadeToggles"></div>
      <button id="paletteBtn" style="margin-top:8px">🎨 色設定</button>
      <div class="palette-panel" id="palettePanel">
        <div class="color-row"><span>上昇1つ</span><input type="color" id="colorUp1"></div>
        <div class="color-row"><span>上昇2つ以上</span><input type="color" id="colorUp2"></div>
        <div class="color-row"><span>下落1つ</span><input type="color" id="colorDown1"></div>
        <div class="color-row"><span>下落2つ以上</span><input type="color" id="colorDown2"></div>
      </div>

      <h3>データ読込</h3>
      <div class="file-box">
        <input type="file" id="xlsxInput" accept=".xlsx,.xlsm,.xls">
        <p class="note"><a href="https://docs.google.com/spreadsheets/d/1GY9DaCjQw3UGsHYItt7PWEQYP5iV15Ay9vMDAcF1J4s/edit?usp=sharing" target="_blank" rel="noopener noreferrer">silicon_cycle_data.xlsx</a>を読み込むと、HTML内の初期データは使わず、Excelのデータのみで再描画します。</p>
      </div>

      <hr style="border:none;border-top:1px solid #e7ecf3;margin:14px 0">
      <button id="resetBtn">表示をリセット</button>
    </div>
  </aside>

  <main style="display:grid;gap:12px;">
    <section class="card controls">
      <div class="row">
        <label>起点年：
          <select id="baseYear"></select>
        </label>
        <label>開始年：
          <input type="number" id="startYear">
        </label>
        <label>終了年：
          <input type="number" id="endYear">
        </label>
      </div>
      <div>
        <label>表示期間スライサー（左右のつまみをドラッグ）</label>
        <div class="dual-slider-wrap" id="yearSlider">
          <div class="dual-slider-track"></div>
          <div class="dual-slider-range" id="yearSliderRange"></div>
          <input id="startRange" type="range" aria-label="開始年">
          <input id="endRange" type="range" aria-label="終了年">
        </div>
        <div class="slider-scale">
          <span id="sliderMinLabel"></span>
          <span id="sliderMaxLabel"></span>
        </div>
      </div>
      <p class="note">凡例クリックで線の表示/非表示を切替。グラフ下のレンジスライダーでも期間変更できます。</p>
    </section>

    <section class="card chart-card">
      <div id="chart"></div>
    </section>

    <section class="card stats">
      <h2>WSTSとの相関・方向一致</h2>
      <div id="statsTable"></div>
    </section>
  </main>
</div>

  document.getElementById("startYear").value=MIN_YEAR;
  document.getElementById("endYear").value=MAX_YEAR;
  document.getElementById("startRange").value=MIN_YEAR;
  document.getElementById("endRange").value=MAX_YEAR;
  document.getElementById("sliderMinLabel").textContent=MIN_YEAR;
  document.getElementById("sliderMaxLabel").textContent=MAX_YEAR;
}
function selectedKeys() {
  return Array.from(document.querySelectorAll("#seriesList input:checked")).map(x=>x.value);
}
function syncAndUpdate(e) {
  const id=e.target.id;
  if(id==="startRange") document.getElementById("startYear").value=e.target.value;
  if(id==="endRange") document.getElementById("endYear").value=e.target.value;
  if(id==="startYear") document.getElementById("startRange").value=e.target.value;
  if(id==="endYear") document.getElementById("endRange").value=e.target.value;
  update();
}
function updateDualSliderFill() {
  const start=document.getElementById("startRange"), end=document.getElementById("endRange"), fill=document.getElementById("yearSliderRange");
  let s=Number(start.value), e=Number(end.value); if(s>e)[s,e]=[e,s];
  const min=Number(start.min), max=Number(start.max);
  fill.style.left = ((s-min)/(max-min))*100 + "%";
  fill.style.width = ((e-s)/(max-min))*100 + "%";
}
function normalizedSeries(key,baseYear,sy,ey) {
  const baseRow=DATA.find(d=>Number(d.year)===baseYear);
  const base=val(baseRow,key);
  return DATA.filter(d=>d.year>=sy&&d.year<=ey).map(d=> {
    const v=val(d,key); return (v!=null&&base!=null&&base!==0) ? v/base*100 : null;
  });
}
function shadeShapes(sy,ey) {
  const toggles = Array.from(document.querySelectorAll(".shade-toggle:checked"))
    .map(el => ({key: el.dataset.key, dir: el.dataset.dir}));
  if(!toggles.length) return [];

  const shapes = [];
  for(let y = sy; y <= ey; y++) {
    const cur = DATA.find(d => d.year === y);
    const prev = DATA.find(d => d.year === y - 1);
    if(!cur || !prev) continue;

    let up = 0, down = 0;
    for(const t of toggles) {
      const dir = direction(val(cur, t.key), val(prev, t.key));
      if(t.dir === "up" && dir === 1) up++;
      if(t.dir === "down" && dir === -1) down++;
    }

    let fill = null;

    // 透明度を上げ、指定色に近い見え方に修正。
    // 1つ一致：やや薄く、2つ以上一致：より濃く表示。
    if(up > 0 || down > 0) {
      if(up > down) {
        fill = up >= 2 ? getColor("colorUp2", 0.42) : getColor("colorUp1", 0.34);
      } else if(down > up) {
        fill = down >= 2 ? getColor("colorDown2", 0.42) : getColor("colorDown1", 0.34);
      } else {
        // 上昇・下落が同数の場合は下落色を優先。
        fill = down >= 2 ? getColor("colorDown2", 0.38) : getColor("colorDown1", 0.30);
      }
    }

    if(fill) {
      shapes.push({
        type: "rect",
        xref: "x",
        yref: "paper",
        x0: y - 0.5,
        x1: y + 0.5,
        y0: 0,
        y1: 1,
        fillcolor: fill,
        line: {width: 0},
        layer: "below"
      });
    }
  }
  return shapes;
}
function update() {
  let sy=Number(document.getElementById("startYear").value), ey=Number(document.getElementById("endYear").value);
  if(sy>ey){[sy,ey]=[ey,sy];document.getElementById("startYear").value=sy;document.getElementById("endYear").value=ey;document.getElementById("startRange").value=sy;document.getElementById("endRange").value=ey}
  updateDualSliderFill();
  const baseYear=Number(document.getElementById("baseYear").value), keys=selectedKeys();
  const x=DATA.filter(d=>d.year>=sy&&d.year<=ey).map(d=>d.year);
  const traces=keys.map(k=>({
    x, y: normalizedSeries(k,baseYear,sy,ey), name:SERIES[k].label, mode:"lines+markers",
    line:{color:COLORS[k]||"#555",width:k==="wsts"?3:2}, marker:{size:5}, connectgaps:false
  }));
  const layout={
    title:{text:`シリコンサイクル比較（${baseYear}年＝100）`,x:0.03},
    paper_bgcolor:"#fff",plot_bgcolor:"#fff",margin:{l:58,r:24,t:55,b:62},hovermode:"x unified",
    legend:{orientation:"h",x:0,y:-0.25},
    xaxis:{title:"年",tickmode:"linear",dtick:Math.max(1,Math.ceil((ey-sy)/14)),rangeslider:{visible:true,thickness:0.08},range:[sy-0.5,ey+0.5]},
    yaxis:{title:`指数（${baseYear}=100）`,zeroline:false},
    shapes:shadeShapes(sy,ey)
  };
  Plotly.react("chart",traces,layout,{responsive:true,displaylogo:false,modeBarButtonsToRemove:["lasso2d","select2d"]}).then(gd=>{
    gd.on("plotly_relayout",ev=>{
      if(ev["xaxis.range[0]"]!==undefined&&ev["xaxis.range[1]"]!==undefined){
        let ns=Math.max(MIN_YEAR,Math.round(Number(ev["xaxis.range[0]"])));
        let ne=Math.min(MAX_YEAR,Math.round(Number(ev["xaxis.range[1]"])));
        if(ns<=ne){document.getElementById("startYear").value=ns;document.getElementById("endYear").value=ne;document.getElementById("startRange").value=ns;document.getElementById("endRange").value=ne;updateDualSliderFill();renderStats(keys,ns,ne);}
      }
    });
  });
  renderStats(keys,sy,ey);
}
function renderStats(keys,sy,ey) {
  const rows=DATA.filter(d=>d.year>=sy&&d.year<=ey);
  let html=`<table><thead><tr><th>比較対象</th><th>実数値の相関</th><th>前年比％の相関</th><th>方向一致件数</th><th>比較件数</th><th>方向一致率</th><th>同時上昇</th><th>同時下落</th></tr></thead><tbody>`;
  keys.forEach(k=>{
    if(k==="wsts")return;
    const xs=[],ys=[],gx=[],gy=[],dirs=[]; let upSame=0,downSame=0;
    for(let i=1;i<rows.length;i++) {
      const p=rows[i-1],c=rows[i],w=val(c,"wsts"),kv=val(c,k),wp=val(p,"wsts"),kp=val(p,k);
      if(w!=null&&kv!=null){xs.push(w);ys.push(kv)}
      if(w!=null&&wp!=null&&kv!=null&&kp!=null){
        const wg=(w/wp-1)*100, kg=(kv/kp-1)*100, wd=Math.sign(wg), kd=Math.sign(kg);
        gx.push(wg);gy.push(kg);dirs.push([wd,kd]); if(wd===1&&kd===1)upSame++; if(wd===-1&&kd===-1)downSame++;
      }
    }
    const same=dirs.filter(d=>d[0]===d[1]).length,total=dirs.length;
    html+=`<tr><td>${SERIES[k].label}</td><td>${fmt(pearson(xs,ys),3)}</td><td>${fmt(pearson(gx,gy),3)}</td><td>${same}</td><td>${total}</td><td>${total?fmt(same/total*100,1)+"%":"-"}</td><td>${upSame}</td><td>${downSame}</td></tr>`;
  });
  html+="</tbody></table>";
  document.getElementById("statsTable").innerHTML=html;
}
function normalizeHeader(h) {
  return String(h||"").toLowerCase().replace(/\s+/g,"").replace(/[\^_\-\/（）()]/g,"");
}
function mapHeader(header) {
  const n=normalizeHeader(header);
  for(const [key,aliases] of Object.entries(COLUMN_ALIASES)) {
    if(aliases.some(a=>n.includes(normalizeHeader(a)))) return key;
  }
  return null;
}
function handleWorkbook(file) {
  const reader=new FileReader();
  reader.onload=e=>{
    const wb=XLSX.read(new Uint8Array(e.target.result),{type:"array"});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:null});
    if(rows.length<2){alert("データ行がありません");return;}
    const headers=rows[0];
    const mapped=headers.map(mapHeader);
    const yearIdx=mapped.indexOf("year");
    if(yearIdx<0){alert("Year列が見つかりません");return;}
    const newRows=[];
    for(let i=1;i<rows.length;i++) {
      const r=rows[i]; const year=Number(r[yearIdx]);
      if(!Number.isFinite(year)) continue;
      const obj={year:year};
      Object.keys(SERIES).forEach(k=>obj[k]=null);
      mapped.forEach((key,idx)=>{
        if(key && key!=="year") {
          const v=Number(r[idx]);
          obj[key]=Number.isFinite(v)?v:null;
        }
      });
      newRows.push(obj);
    }
    if(!newRows.length){alert("読み込める年次データがありません");return;}
    DATA=newRows.sort((a,b)=>a.year-b.year);
    Object.keys(DEFAULT_LABELS).forEach(k=>{SERIES[k]=SERIES[k]||{label:DEFAULT_LABELS[k],unit:"年末値",default:false};});
    buildUI(); update(); alert("Excelデータを読み込みました");
  };
  reader.readAsArrayBuffer(file);
}
function init() {
  loadColors();
  buildUI();
  ["baseYear","startYear","endYear","startRange","endRange"].forEach(id=>document.getElementById(id).addEventListener("input",syncAndUpdate));
  ["colorUp1","colorUp2","colorDown1","colorDown2"].forEach(id=>document.getElementById(id).addEventListener("input",e=>{localStorage.setItem(id,e.target.value);applyToggleColors();update();}));
  document.getElementById("paletteBtn").addEventListener("click",()=>document.getElementById("palettePanel").classList.toggle("open"));
  document.getElementById("collapseBtn").addEventListener("click",()=>{
    const layout=document.getElementById("layout"); layout.classList.toggle("collapsed");
    document.getElementById("collapseBtn").textContent=layout.classList.contains("collapsed")?"+":"−";
    setTimeout(()=>Plotly.Plots.resize("chart"),250);
  });
  document.getElementById("resetBtn").addEventListener("click",()=>{buildUI();update();});
  document.getElementById("xlsxInput").addEventListener("change",e=>{ if(e.target.files[0]) handleWorkbook(e.target.files[0]); });
  update();
}
init();
</script>
