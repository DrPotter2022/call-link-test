集人をいう、との理解でよいか。","pageStart":222,"pageEnd":222,"answer":"貴見のとおりです。\nⅡ－4－2－9(5)における乗合代理店とは、生命保険会社、損害保険会社、少額短期保険業者の別を問わず、二以上の所属保険会社等を有する保険募集人をいいます。\nなお、比較推奨販売に係る規定の適用に当たっては、当該乗合代理店が取り扱う保険契約の中に、「二以上の比較可能な同種の保険契約」が存在し、これらの中から顧客の意向に沿って保険契約を選別し、提示・推奨するかに応じて判断されます。","theme":"比較可能な同種の保険契約","section":"監督指針","tags":["比較推奨"]},{"no":375,"location":"Ⅱ－4－2－9(5)","comment":"生命保険専属もしくは損害保険専属の代理店の場合であ222っても、同種の商品(例えば、生保がん保険と損保がん保険)\nが存在し、比較推奨販売を行う場合には、監督指針Ⅱ－4－2－9(5)乗合代理店における比較推奨販売、を踏まえた対応・体制整備を行う必要がある、との理解でよいか。","pageStart":222,"pageEnd":223,"answer":"生命保険会社1社及び損害保険会社1社など、生命保険・損害保険の別を問わず二以上の所属保険会社等を有する保険募集人は、乗合代理店に該当します。\nこのため、当該代理店が取り扱う保険契約の中に、「二以上の比較可能な同種の保険契約」が存在し、これらの中から顧客の意向に沿って保険契約を選別し、提示・推奨する場合には、Ⅱ－4－2－9(5)を踏まえた対応や体制整備が必要です。","theme":"比較可能な同種の保険契約","section":"監督指針","tags":["比較推奨"]},{"no":376,"location":"Ⅱ－4－2－9(5)","comment":"代理店において共済取扱があり、それが保険商品と類似する補償内容である場合でも、共済商品との比較推奨販売は求められないという理解でよいか。","pageStart":223,"pageEnd":223,"answer":"貴見のとおりです。\n保険業法施行規則第227条の2第3項第4号は、所属保険会社等が引き受ける保険契約を対象とするものです。\nここでいう「所属保険会社等」とは、保険会社又は少額短期保険業者を指し、共済事業者は含まれません。したがって、共済事業者が提供する共済商品については、同号に基づく比較推奨販売の対象には含まれません。","theme":"比較可能な同種の保険契約","section":"監督指針","tags":["比較推奨"]},{"no":377,"location":"Ⅱ－4－2－9(5)","comment":"顧客へ保険契約のご案内をするにあたり、「同種目の保険契約」を比較する場合、保険会社間で商品(サービス)の差があまりにも細かすぎるため、ほとんど差がないのが現状である。\n特に「高齢の顧客」が増えている現在では顧客の理解度も浅くなる可能性がある。\n金融庁におかれては、保険会社に対し「商品の差別化」、「わかりやすい商品内容」に移行すべく指導いただきたい。","pageStart":223,"pageEnd":223,"answer":"貴重なご意見として承ります。","theme":"比較可能な同種の保険契約","section":"監督指針","tags":[]},{"no":378,"location":"－","comment":"A保険会社と委託契約がある保険代理店について、A保険会社の全商品を取り扱うことが必須ではなく、以下のようなケースにおいては今後も一部商品のみ取り扱うことが許容されるという理解でよいか。\n2231.取扱商品のうち一部のみ新商品を取り扱っているケース2.商品毎に採用要否を決裁しており、保険代理店側で決裁された商品のみを取り扱っているケース3.以前販売していたが、現在は、販売しておらず継続手数料支払いがあるため委託契約が残っているケース","pageStart":223,"pageEnd":224,"answer":"推奨販売の対象となる保険契約の範囲については、代理店委託契約又はこれに基づく覚書等において取り扱うこととされている保険契約の中に「二以上の比較可能な同種の保険契約」が存在するか否かで判断するものです。\nしたがって、代理店委託契約等において定められた取扱対象となる保険契約の中から、乗合代理店が独自の判断(理由等)のみにより、あらかじめ、比較推奨販売の対象とする保険契約を選定・決定することや推奨商品群を設けることは適当ではありません。\nなお、保険会社と乗合代理店との間において、代理店委託契約に基づき取扱対象となる保険契約を決定することまでを否定するものではありません。","theme":"推奨商品群","section":"監督指針","tags":["手数料・インセンティブ","比較推奨"]},{"no":379,"location":"－","comment":"取り扱う全損害保険会社の商品の知識やシステム対応の習得が不十分となる可能性があることから、顧客に対して正確な商品提案をするために、乗合代理店において、推奨会社を絞り込むことは可能か。\n可能である場合、乗合代理店において選定した推奨会社以外の、既存の損害保険契約を引き続き取り扱うことは可能か。","pageStart":224,"pageEnd":224,"answer":"推奨販売の対象となる保険契約の範囲については、代理店委託契約又はこれに基づく覚書等において取り扱うこととされている保険契約の中に「二以上の比較可能な同種の保険契約」が存在するか否かで判断するものです。\nしたがって、代理店委託契約等において定められた取扱対象となる保険契約の中から、乗合代理店が独自の判断(理由等)のみにより、あらかじめ、比較推奨販売の対象とする保険契約を選定・決定することや推奨商品群を設けることは適当ではありません。\nなお、保険会社と乗合代理店との間において、代理店委託契約に基づき取扱対象となる保険契約を決定することまでを否定するものではありません。","theme":"推奨商品群","section":"監督指針","tags":["比較推奨","システム・比較ツール"]},{"no":380,"location":"Ⅱ－4－2－9(5)","comment":"金融機関(乗合代理店)による窓口販売(投信・保険)では、「プロダクトガバナンス」(顧客最善利益に適った商品提供等を確保するためのガバナンス)の観点から、複数の金融商品の中から金融機関自らが商品を選別していることを公表しているが、顧客の意向を確認した上で、複数の所属保険会社の中から金融機関が選定した取扱商品一覧表(ラインアップ)の中から、推奨販売をすることは認められるという理解でよいか。","pageStart":224,"pageEnd":224,"answer":"推奨販売の対象となる保険契約の範囲については、代理店委託契約又はこれに基づく覚書等において取り扱うこととされている保険契約の中に「二以上の比較可能な同種の保険契約」が存在するか否かで判断するものです。\nしたがって、代理店委託契約等において定められた取扱対象となる保険契約の中から、乗合代理店が独自の判断(理由等)のみにより、あらかじめ、比較推奨販売の対象とする保険契約を選定・決定することや推奨商品群を設けることは適当ではありません。\nなお、保険会社と乗合代理店との間において、代理店委託契約に基づき取扱対象となる保険契約を決定することまでを否定するものではありません。","theme":"推奨商品群","section":"監督指針","tags":["比較推奨"]},{"no":381,"location":"－","comment":"現在、損害保険会社3社が乗り合う代理店であるが、今後1社専属代理店に変更することを検討している。代理店委託契約を解約する予定の2社には保有契約があり、委託契約を解約するまでには数年かかる見込みである。\n224保険業法施行規則第227条の2第3項第4号ハの廃止以降、新規契約は1社専属とする予定の保険会社のみを案内することは可能か。一定期間、代理店委託契約を解約する予定の2社は保全対応のみの対応としたい。","pageStart":224,"pageEnd":225,"answer":"ご意見にあるケースに関して、当該乗合代理店と「代理店委託契約を解約する予定の2社」との間で、それぞれに締結されている同契約において、新規契約を取り扱わないことが規定されている場合については、当該乗合代理店における「比較可能な同種の保険契約」は存在しないものとして、ご意見にあるような対応も可能となると考えられます。","theme":"推奨商品群","section":"監督指針","tags":["ハ方式"]},{"no":382,"location":"－","comment":"乗合代理店が、取り扱う保険契約の中で、顧客意向によらず、あらかじめ推奨商品(群)を設定することは、改正される内閣府令及び監督指針の内容・趣旨を踏まえ、許容されない、との認識でよいか。\n(考え方)\n1.(保険業法施行規則第227条の2第3項第4号ハが廃止され)監督指針改正案のとおり「顧客の意向に沿って保険契約を選別する場合には、事前に商品特性や保険料水準などの顧客が重視する事項を丁寧かつ明確に確認」し、当該意向に沿って提示・推奨する必要があることから、乗合代理店が、取り扱う保険契約の中で、顧客意向によらず、あらかじめ推奨商品(群)を設定し、当該商品(群)を推奨・提案することは、監督指針改正の内容・趣旨に反するものと認識。","pageStart":225,"pageEnd":225,"answer":"貴見のとおり、乗合代理店が独自の判断(理由等)のみにより、あらかじめ、推奨販売の対象とする商品を選定・決定することは適当ではありません。推奨販売の対象となる商品の範囲については、乗合代理店が所属保険会社等から委託を受ける保険商品の中に「二以上の比較可能な同種の保険契約」が存在するか否かで判断するものです。","theme":"推奨商品群","section":"監督指針","tags":["ハ方式"]},{"no":383,"location":"Ⅱ－4－2－9(5)","comment":"2.(上記1を前提とした上で)\n「(a)乗合代理店が二以上の比較可能な同種の保険契約の中から顧客の意向に沿って保険契約を選別し、一又は二以上の保険契約を提示・推奨する場合」(例えば、医療という種別・特性で絞り込んだ場合)に、それ以上の顧客意向がないことをもって、そのために、乗合代理店内で推奨商品(群)\nを設定しておく(例えば、医療が、A～J商品まで10種類取り225扱っている中で、A・B・C商品を推奨商品に設定する)ことが考えられるが、この場合も「B本文また書：顧客の意向に沿って保険契約を選別する場合には、事前に商品特性や保険料水準などの顧客が重視する事項を丁寧かつ明確に確認する必要があること」、また、「B(b)顧客の意向が不明確な場合であっても、保険契約の選別に当たっては、例えば、顧客が特に重視すると考えられる事項を例示するなど、可能な限り顧客の意向を把握した上で、」説明する必要があることを踏まえれば、医療という絞り込みだけでなく、加えて、何か重視する項目がないか(例えば、保険料水準等)を確認する必要があるにもかかわらず、確認せずに、乗合代理店が設定した推奨商品(群)を推奨することが問題であり、このことから、推奨商品(群)を設定すること自体が問題である、という理解でよいか。","pageStart":225,"pageEnd":226,"answer":"貴見のとおり、乗合代理店が独自の判断(理由等)のみにより、あらかじめ、推奨販売の対象とする商品を選定・決定することは適当ではありません。推奨販売の対象となる商品の範囲については、乗合代理店が所属保険会社等から委託を受ける保険商品の中に「二以上の比較可能な同種の保険契約」が存在するか否かで判断するものです。","theme":"推奨商品群","section":"監督指針","tags":[]},{"no":384,"location":"－","comment":"乗合代理店が、取り扱う保険契約の中で、「他に比較可能な商品があるにも関わらず、取扱商品一覧等にあらかじめ選定した特定の商品群を記載する」ことは、内閣府令改正案及び監督指針改正案の趣旨・内容に照らして、許容されない、との理解でよいか。","pageStart":226,"pageEnd":226,"answer":"貴見のとおり、乗合代理店が独自の判断(理由等)のみにより、あらかじめ、推奨販売の対象とする商品を選定・決定することは適当ではありません。推奨販売の対象となる商品の範囲については、乗合代理店が所属保険会社等から委託を受ける保険商品の中に「二以上の比較可能な同種の保険契約」が存在するか否かで判断するものです。","theme":"推奨商品群","section":"監督指針","tags":[]},{"no":385,"location":"Ⅱ－4－2－9(5)","comment":"監督指針Ⅱ－4－2－9(5)\n①B.(a)\n「推奨する特定の保険契約以外の保険契約もある旨及び顧客の求めに応じて、それらの保険契約の概要又は契約内容を説明する旨を説明しているか」とあるが、数十社の保険会社が乗り合う乗合代理店の場合、該当の保険契約が非常に多く、全てを説明するのは実務上の運用が難しいと考えられるため、具体的な運用226例についてお示しいただきたい。また、この部分の説明については、「必須」ではなく、「運用の推奨」とする等、ルールを緩和できないかご検討いただきたい。","pageStart":226,"pageEnd":227,"answer":"本指針改正は、乗合代理店に対し、全ての案件について、所属保険会社等から委託を受けて取り扱う全ての保険契約について一律に説明することを求めるものではありません。\n「推奨する特定の保険契約以外の保険契約」とは、乗合代理店が取り扱う全ての保険契約を指すものではなく、「二以上の比較可能な同種の保険契約」のうち、顧客の意向に沿って選別の対象とした保険契約であって、最終的に推奨しなかった保険契約を想定しています。\nしたがって、数十社と乗合がある場合であっても、取扱可能な全保険契約について網羅的に説明する必要はなく、あらかじめ所属保険会社等の商号等を明らかにした上で、顧客の意向、商品特性等を踏まえ、選別対象となった範囲についてⅡ－4－2－9(5)①B.に基づいた対応を行うことになります。\nその上で、特定の保険契約を推奨する場合には、当該推奨契約以外にも選別対象となった保険契約がある旨、及び顧客の求めに応じてそれらの概要又は契約内容を説明する旨を説明する必要があります。\nなお、当該推奨契約以外の選別対象となった保険契約について、顧客から説明を求められた場合には、顧客の理解に資する範囲で、当該保険契約の概要又は契約内容を分かりやすく説明することが重要です。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":[]},{"no":386,"location":"Ⅱ－4－2－9(5)","comment":"「「平成26年改正保険業法(2年以内施行)に係る政府令・監督指針案」に対するパブリックコメント結果等について」\nにおける「コメントの概要及びコメントに対する金融庁の考え方」No.510の回答において、代理店独自の判断で社内規則等に定めさえすれば、取り扱う保険契約を限定できると解釈され得るものが存在したが、これは比較推奨販売のハ方式が存在していたことを背景に回答されているように考えられる。\n実際、乗合代理店が保険業法施行規則第227条の2第3項第4号ハ(以下、ハ方式とする)に基づき優先的に顧客に提案す227る保険契約をあらかじめ絞込み、その上で同号ロに基づき販売していた事例も存在したと認識している。\nこのような事例は、顧客の商品選択の機会を阻害するおそれがあると考えられることや、今般のハ方式廃止の趣旨を踏まえれば、代理店の判断で社内規則等に定めることをもって取り扱う保険契約を限定することは許容されないと考えられるが、その理解でよいか。","pageStart":227,"pageEnd":228,"answer":"貴見のとおりです。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["比較推奨","ハ方式"]},{"no":387,"location":"Ⅱ－4－2－9(5)","comment":"「令和5年金融商品取引法等改正に係る政令・内閣府令案等に関するパブリックコメントの結果等について」における「コメントの概要及びコメントに対する金融庁の考え方」\nNo.7について、金融庁の見解に変更がないことを確認したい。\nまた、そうした観点から、保険業法施行規則第227条の2第3項第4号ハの削除後も、保険販売の現場において、経営方針上の理由など代理店の都合を顧客に対して説明することが一律に否定されるものではないと考えるがどうか。\n【上記のパブリックコメントのおける金融庁の考え方No.7】「新設する誠実公正義務を履行する方法は、それぞれの金融事業者の事業の内容等やそれぞれの顧客の状況等により異なり得るものであり、形式的・画一的に定まるものではないと考えられます。また、各監督指針等において「社会に付加価値をもたらし、同時に自身の経営の持続可能性を確保していくためには、顧客の最善の利益を勘案しつつ、顧客に対して誠実かつ公正にその業務を行うことが求められる」\n228と記載しているとおり、顧客の最善の利益を勘案することと金融事業者の収益性とを両立させることは否定されないものと考えております。\nなお、手数料の多寡や有無に応じて、顧客に提供するサービスの内容を異ならせることが一律に否定されるものではありませんが…」","pageStart":228,"pageEnd":229,"answer":"ご意見にある「令和5年金融商品取引法等改正に係る政令・内閣府令案等に関するパブリックコメントの結果等について」における「コメントの概要及びコメントに対する金融庁の考え方」における考え方は、誠実公正義務の履行方法が金融事業者の業務内容や顧客の状況等により異なり得ることを示したものであり、例えば、登録金融機関が顧客より直接、手数料を収受するのに対して、保険代理店は、所属保険会社等から販売手数料を収受するなど前提となる状況が異なるため、一概に回答をお示しすることは困難です。\nまた、保険募集人は、金融サービス提供法上の誠実公正義務に加え、保険業法等の関係法令及び監督指針に基づき、顧客の意向に沿った適正な保険募集を行う必要があります。\n今般、顧客の意向に基づかない保険契約の選別を前提とする同法施行規則第227条の2第3項第4号ハを廃止する趣旨を踏まえれば、経営方針、手数料水準、販売目標、便宜供与、取引関係等の代理店の都合を理由として、特定の保険契約を選別し、提示・推奨することは適切ではありません。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["便宜供与","手数料・インセンティブ","ハ方式","顧客の最善の利益"]},{"no":388,"location":"Ⅱ－4－2－9(5)","comment":"複数の拠点を持つ乗合代理店が拠点によって提示・推奨する基準や理由等が異なることは許容されるか。「「平成26年改正保険業法(2年以内施行)に係る政府令・監督指針案」\nに対するパブリックコメント結果等について」における「コメントの概要及びコメントに対する金融庁の考え方」\nNo.537では「合理的なものであれば許容される」との考え方が示されているが、この点につき改めて確認したい。","pageStart":229,"pageEnd":229,"answer":"今般の監督指針改正は、乗合代理店における比較推奨販売について、乗合代理店の都合や、あらかじめ定めた推奨方針による商品選別ではなく、顧客の意向に沿って選別し、提示・推奨が適切に行われるよう改正するものです。\n「「平成26年改正保険業法(2年以内施行)に係る政府令・監督指針案」に対するパブリックコメント結果等について」における「コメントの概要及びコメントに対する金融庁の考え方」No.537は、保険業法施行規則第227条の2第3項第4号ハに基づいて販売する場合を前提として、保険代理店の拠点によって、保険契約を提示・推奨する基準や理由等が異なることも許容され得ると回答したものであり、今般、Ⅱ－4－2－9(5)③の根拠規定である同号ハが削除されることを受けて、保険代理店の拠点ごと各々の事情に応じた提示・推奨する基準や理由は許容されません。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["比較推奨","ハ方式"]},{"no":389,"location":"Ⅱ－4－2－9(5)","comment":"本改正案が「顧客本位(最善利益)」の実効性確保を志向し、営業推進態勢の整備・検証等を明示した点に賛同する。\n「最善利益」の内容が十分に明確化されないまま各乗合代理店に個別の定義・運用を委ねると、基準のばらつきにより顧客保護の水準が不均一となる懸念がある。\n加えて、顧客本位を徹底しようとすると保険代理店の役229割は、保険仲立人に近づく一方、顧客本位の結果として特定の保険会社及び特定の保険契約の販売が伸びない場合には、保険会社の販売目標(契約件数等)と衝突し得る。また、保険会社から委託・手数料を受ける保険募集人という制度上の位置付けの下で比較推奨が歪められる。\n主要因は、個々の保険代理店の姿勢というより、保険会社が販売促進のために運用するノルマや最低契約件数未達を理由とする委託解除等の仕組みにあると考える。これらが存在する場合、委託解除のプレッシャーが保険代理店への圧力となり、比較推奨の形骸化や不要な募集を誘発する。\nまた、委託契約解除後はアフターフォローも行えないことになり、ひいては顧客の最善利益を阻害するおそれがある。\nよって、契約件数を基にした代理店評価及び委託解除の運用から、保険代理店業務の実態及び品質を重視する枠組みへの移行を行うに際し、監督上の目線感(具体例・不適切な例)を明確化していただきたい。\nついては、保険代理店における「最善利益を勘案する」ことの定義(最低限満たすべきプロセス要件等)を示すとともに、乗合代理店が制度上の位置付けと整合する形で、誇りを持って業務を遂行できる環境整備が必要と考える。","pageStart":229,"pageEnd":230,"answer":"貴重なご意見として承ります。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["手数料・インセンティブ","比較推奨","委託解除"]},{"no":390,"location":"Ⅱ－4－2－9(5)","comment":"保険募集人が、特定の保険契約が顧客にとって明白に最適であると判断したような場合でも、比較推奨販売のプロセスは省略不可であり、監督指針Ⅱ－4－2－9(5)に沿った募集を行う必要がある、との理解でよいか。\n230","pageStart":230,"pageEnd":230,"answer":"貴見のとおりです。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["比較推奨"]},{"no":391,"location":"－","comment":"顧客の意向把握のプロセスについては、下記1.から5.の流れで行うことが考えられる、という理解でよいか。\n1.当初意向の把握2.説明を受ける商品を絞り込むかの確認3.特に重視する意向の把握4.商品特性等により、乗合代理店が特定の保険契約を推奨する場合の取扱い5.個別商品の説明・申込","pageStart":231,"pageEnd":231,"answer":"ご意見にあるプロセスは、顧客の意向把握及び推奨販売の一例としてあり得るものと考えます。\n比較推奨販売においては、まず、顧客の当初意向を把握し、必要に応じて、説明を受ける商品の範囲、顧客が特に重視する事項を確認した上で、当該意向に沿って保険契約を選別し、提示・推奨することが重要です。\nその上で、乗合代理店が商品特性等により特定の保険契約を推奨する場合には、顧客の最善の利益を勘案したものとして、保険募集人や乗合代理店の都合によることなく、顧客の意向との関係で、合理的かつ一定の具体性を有する基準や理由等を説明するとともに、推奨する特定の保険契約以外の保険契約もある旨及び顧客の求めに応じて、それらの保険契約の概要又は契約内容を説明する必要があります。\nなお、意向把握の方法や順序は、取扱商品、募集形態、顧客属性等に応じて異なり得るものであり、必ずしも、ご指摘の流れに限られるものではありません。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["比較推奨","意向把握","顧客の最善の利益"]},{"no":392,"location":"Ⅱ－4－2－9(5)","comment":"「「平成26年改正保険業法(2年以内施行)に係る政府令・監督指針案」に対するパブリックコメント結果等について」\nにおける「コメントの概要及びコメントに対する金融庁の考え方」No.521を踏まえ、「提示・推奨する基準や理由等が複数ある場合」は、「主たるもの」を告げることが必要と認識しているが、「主たるもの」の選定は顧客の意向を踏まえて保険募集人や乗合代理店にて合理的に判断することでよいか。\n231","pageStart":231,"pageEnd":232,"answer":"「「平成26年改正保険業法(2年以内施行)に係る政府令・監督指針案」に対するパブリックコメント結果等について」における「コメントの概要及びコメントに対する金融庁の考え方」No.521は乗合代理店都合の保険契約の選別(保険業法施行規則第227条の2第3項第4号ハ)を前提としたものであり、顧客の意向に沿った保険契約の選別(同号ロ)を前提としたものではありません。\n顧客の意向に沿って保険契約を選別し、提示・推奨する場合においては、顧客自身が提示・推奨される保険契約が自らのリスクや保険ニーズに合致し得るものか適切に判断するために、保険募集人は商品特性等にかかる顧客の意向に対応した推奨理由等を説明するとともに、実際に把握した顧客の意向や重視する事項を踏まえ、上記顧客の判断に資する事項を個別具体的に判断し、提示・推奨理由として情報提供する必要があります。\nなお、保険募集人において、恣意的に特定の保険契約に誘導することを目的として、顧客の意向に優劣をつけることや便宜供与等の乗合代理店の都合を隠すために、顧客意向との関係で重要でない理由を主たる理由として説明することは不適切です。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["便宜供与","ハ方式"]},{"no":393,"location":"Ⅱ－4－2－9(5)","comment":"顧客の意向に基づき商品を絞り込み、推奨を行う際、代理店が提供可能な「事務対応の品質やアフターフォロー」などを比較・選定の基準とすることが許容されるか、許容される場合はその旨を監督指針に明記いただきたい。\n改正案において、代理店の経営方針のみに基づいた恣意的な推奨(保険業法施行規則第227条の2第3項第4号ハ)が見直され、顧客の意向に基づいた推奨(同号ロ)へ統合される方向性と理解している。\nしかしながら、乗合代理店の中には、特定の保険会社及び特定の保険契約について深い専門知識を有していたり、当該保険会社とのシステム連携等により迅速な事故対応・事務処理が可能であったりと、取り扱う保険契約によって「顧客に提供できるサービスの質」に差異が生じるケースがある。\nこの場合、単に商品スペック(保険料や補償内容)のみで比較するのではなく、「当該代理店において最も質の高いサポートが受けられる保険契約」であることを理由に特定の232保険契約を推奨することは、結果として「安心かつ迅速なサービスを受けたい」という顧客の意向に合致し、顧客の最善の利益に資するものと考える。\nついては、単なる代理店都合(手数料や資本関係等)による絞り込みは排除しつつも、「代理店が提供する役務(アフターフォロー等)の品質・専門性」を根拠とし、かつ顧客がそのメリットを求めた場合においては、特定の保険契約を推奨・選定することが法令上認められること、又は比較説明義務の例外として正当な理由に当たること)を、監督指針やQ＆A等で明確にしていただきたい。","pageStart":232,"pageEnd":233,"answer":"提示・推奨する基準や理由等が、顧客の最善の利益に照らし、合理的かつ一定の具体性を有するか否かについては、顧客の意向や商品特性等を踏まえ、個別具体的に判断されます。\n他方、保険業法施行規則第227条の2第3項第4号ハの廃止の趣旨は、便宜供与等により代理店の利益のみを優先して特定の保険契約の推奨が行われ、顧客の適切な商品選択の機会が阻害されないよう求める点にあり、手数料水準、販売目標、保険会社からの便宜供与、資本・取引関係、特定の保険会社の事務に精通していることなど代理店側の都合や、募集人の主観的又は属人的判断に基づく事項を基準や理由等とすることは、不適切な提示・推奨に該当し得るため適切でないと考えます。\n比較推奨販売を行うに当たっては、顧客が自らの抱えるリスクや保険ニーズに合致した保険商品であるかを十分に確認できるよう、保険募集人が保険商品に係る事項について顧客の意向を丁寧に把握することが前提であると考えます。こうした点を踏まえると、顧客の意向に沿って特定の保険商品を提示・推奨する際には、主たる基準や理由等として、顧客の意向に沿う保障(補償)内容等の商品特性や保険料水準といった保険商品に直接関係する事項を説明する必要があります。\nまた、顧客が事故対応件数や販売実績等の商品特性と直結しない事項についても重視する場合には、保険商品に直接関係する事項とあわせて、提示・推奨理由とすることは否定されませんが、これらの事項は顧客意向との関係で合理性・具体性を有し、顧客の比較判断に資する客観的事項である必要があります。いずれにせよ、これらの事項は商品特性と直結せず、恣意的な推奨につながるおそれがある点に留意が必要です。\n加えて、提示・推奨の基準や理由等に係る数値・資料の根拠について、例えば、同号ハに基づいて乗合代理店の店舗ごとに異なる保険会社の保険契約を取り扱っていたことを前提として、特定の保険契約を推奨するような資料等に基づく場合など、結果として、恣意的な選別とならないよう、収集期間、対象、件数、集計・評価方法等を明らかにするなど、合理性を適切に判断すべきです。\nなお、比較推奨販売における情報提供のみで適切な選択に至らない場合は、無理に特定の保険契約へ絞らず、比較説明や複数の保険契約の提示、追加の意向確認等により、顧客の適切な商品選択の機会を確保することが求められます。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["便宜供与","手数料・インセンティブ","比較推奨","ハ方式","意向把握","顧客の最善の利益","システム・比較ツール"]},{"no":394,"location":"Ⅱ－4－2－9(5)","comment":"監督指針Ⅱ－4－2－9(5)①B.(a)に記載されている「保険契約を提示・推奨する基準や理由等」については、必ずしも、商品特性や保険料水準といった保険契約の内容に関するものに限定されないとの理解で相違ないか。","pageStart":233,"pageEnd":233,"answer":"提示・推奨する基準や理由等が、顧客の最善の利益に照らし、合理的かつ一定の具体性を有するか否かについては、顧客の意向や商品特性等を踏まえ、個別具体的に判断されます。\n他方、保険業法施行規則第227条の2第3項第4号ハの廃止の趣旨は、便宜供与等により代理店の利益のみを優先して特定の保険契約の推奨が行われ、顧客の適切な商品選択の機会が阻害されないよう求める点にあり、手数料水準、販売目標、保険会社からの便宜供与、資本・取引関係、特定の保険会社の事務に精通していることなど代理店側の都合や、募集人の主観的又は属人的判断に基づく事項を基準や理由等とすることは、不適切な提示・推奨に該当し得るため適切でないと考えます。\n比較推奨販売を行うに当たっては、顧客が自らの抱えるリスクや保険ニーズに合致した保険商品であるかを十分に確認できるよう、保険募集人が保険商品に係る事項について顧客の意向を丁寧に把握することが前提であると考えます。こうした点を踏まえると、顧客の意向に沿って特定の保険商品を提示・推奨する際には、主たる基準や理由等として、顧客の意向に沿う保障(補償)内容等の商品特性や保険料水準といった保険商品に直接関係する事項を説明する必要があります。\nまた、顧客が事故対応件数や販売実績等の商品特性と直結しない事項についても重視する場合には、保険商品に直接関係する事項とあわせて、提示・推奨理由とすることは否定されませんが、これらの事項は顧客意向との関係で合理性・具体性を有し、顧客の比較判断に資する客観的事項である必要があります。いずれにせよ、これらの事項は商品特性と直結せず、恣意的な推奨につながるおそれがある点に留意が必要です。\n加えて、提示・推奨の基準や理由等に係る数値・資料の根拠について、例えば、同号ハに基づいて乗合代理店の店舗ごとに異なる保険会社の保険契約を取り扱っていたことを前提として、特定の保険契約を推奨するような資料等に基づく場合など、結果として、恣意的な選別とならないよう、収集期間、対象、件数、集計・評価方法等を明らかにするなど、合理性を適切に判断すべきです。\nなお、比較推奨販売における情報提供のみで適切な選択に至らない場合は、無理に特定の保険契約へ絞らず、比較説明や複数の保険契約の提示、追加の意向確認等により、顧客の適切な商品選択の機会を確保することが求められます。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["便宜供与","手数料・インセンティブ","比較推奨","ハ方式","意向把握","顧客の最善の利益"]},{"no":395,"location":"Ⅱ－4－2－9(5)","comment":"特定の保険契約を提示・推奨する基準や理由等には、必ずしも定量的な基準が求められるものではないとの理解でよいか。\nまた、特定の保険契約を提示・推奨する理由には、必ずしも裏付けとなる定量的なデータ等が求められるものではないとの理解でよいか。","pageStart":233,"pageEnd":233,"answer":"提示・推奨する基準や理由等が、顧客の最善の利益に照らし、合理的かつ一定の具体性を有するか否かについては、顧客の意向や商品特性等を踏まえ、個別具体的に判断されます。\n他方、保険業法施行規則第227条の2第3項第4号ハの廃止の趣旨は、便宜供与等により代理店の利益のみを優先して特定の保険契約の推奨が行われ、顧客の適切な商品選択の機会が阻害されないよう求める点にあり、手数料水準、販売目標、保険会社からの便宜供与、資本・取引関係、特定の保険会社の事務に精通していることなど代理店側の都合や、募集人の主観的又は属人的判断に基づく事項を基準や理由等とすることは、不適切な提示・推奨に該当し得るため適切でないと考えます。\n比較推奨販売を行うに当たっては、顧客が自らの抱えるリスクや保険ニーズに合致した保険商品であるかを十分に確認できるよう、保険募集人が保険商品に係る事項について顧客の意向を丁寧に把握することが前提であると考えます。こうした点を踏まえると、顧客の意向に沿って特定の保険商品を提示・推奨する際には、主たる基準や理由等として、顧客の意向に沿う保障(補償)内容等の商品特性や保険料水準といった保険商品に直接関係する事項を説明する必要があります。\nまた、顧客が事故対応件数や販売実績等の商品特性と直結しない事項についても重視する場合には、保険商品に直接関係する事項とあわせて、提示・推奨理由とすることは否定されませんが、これらの事項は顧客意向との関係で合理性・具体性を有し、顧客の比較判断に資する客観的事項である必要があります。いずれにせよ、これらの事項は商品特性と直結せず、恣意的な推奨につながるおそれがある点に留意が必要です。\n加えて、提示・推奨の基準や理由等に係る数値・資料の根拠について、例えば、同号ハに基づいて乗合代理店の店舗ごとに異なる保険会社の保険契約を取り扱っていたことを前提として、特定の保険契約を推奨するような資料等に基づく場合など、結果として、恣意的な選別とならないよう、収集期間、対象、件数、集計・評価方法等を明らかにするなど、合理性を適切に判断すべきです。\nなお、比較推奨販売における情報提供のみで適切な選択に至らない場合は、無理に特定の保険契約へ絞らず、比較説明や複数の保険契約の提示、追加の意向確認等により、顧客の適切な商品選択の機会を確保することが求められます。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["便宜供与","手数料・インセンティブ","比較推奨","ハ方式","意向把握","顧客の最善の利益"]},{"no":396,"location":"Ⅱ－4－2－9(5)","comment":"顧客の意向に沿って選別した保険契約の中から特定の保険契約を推奨する場合、「顧客の最善の利益を勘案」する際の判断理由は、必ずしも商品・サービスの特性によるものばかりとは限らないと思料する。\n監督指針II－4－2－9(5)①B.(a)において、「保険募集人233や乗合代理店の都合によることなく、合理的かつ一定の具体性を有する基準や理由等」の説明が求められているが、適切に意向把握を行った結果、顧客意向に適う保険契約が複数ある場合、顧客が最終的な商品選択を行う場面において、乗合代理店が以下の事由を説明し商品の絞込・推奨を行うことは必ずしも否定されるものではないという理解でよいか。\nなお、当然顧客へ推奨理由の説明を行い、正確に証跡を保存することを前提とするほか、手数料の高い商品への誘引ではなく、顧客・乗合代理店双方が真により良いサービスやアフターフォロー、効率的な手続き等のメリットが享受できる蓋然性が高いことを前提とする。また、以下について恣意的な判断余地があると見倣される場合、その判断理由を伺いたい。\n1.「推奨会社の事務に精通している」等の事由が事実であることが明らかな場合長年の取引等により事務に精通しているなど、保険会社と乗合代理店間において個別・固有の事情がある場合、それを推奨理由として説明することは許容されるのか。それとも商品およびサービス内容によらない事情であるとして、いかなる場合も認められないのか。\n乗合代理店としては、誠実な取引を積み重ねることで保険会社と信頼関係を築いているケースも少なくない。商品に著しい差異がない場合、意向把握の結果、比較可能な同種の保険契約の中から事務に精通した保険契約を推奨するこ234とは顧客本位にも適うと考えている。\n実務上においても、商品性だけで優劣を付けなければならない場合、顧客に対してより多くの質問が必要になり、顧客の望まない、より煩雑な募集工程を強いられることから顧客にとっても効率的な募集の阻害要因となり得る。\n商品性のみで差別化を行うことが困難な場合に限っては、保険会社取扱高概況等を客観的エビデンスとして示すことで事務に精通していることを推奨理由として問題ないことを確認したい。\n2.保険会社担当者の実務遂行能力に著しい劣後がある場合営業・保険金サービスを問わず、保険会社の担当者の実務能力に明らかな劣後が認められるケースがある。商品間に有意な差異が認められない場合、顧客に対して、特定の保険会社の担当者が優秀であることを推奨理由として保険契約を選別することは許容されるか。\n適切な意向把握が行われた後の最終的な商品選別・推奨に当たって、より有能で熱心な担当者を擁する保険会社及び保険契約を推奨することが顧客最善義務にも適い、否定されるものではないことを確認したい。","pageStart":233,"pageEnd":235,"answer":"提示・推奨する基準や理由等が、顧客の最善の利益に照らし、合理的かつ一定の具体性を有するか否かについては、顧客の意向や商品特性等を踏まえ、個別具体的に判断されます。\n他方、保険業法施行規則第227条の2第3項第4号ハの廃止の趣旨は、便宜供与等により代理店の利益のみを優先して特定の保険契約の推奨が行われ、顧客の適切な商品選択の機会が阻害されないよう求める点にあり、手数料水準、販売目標、保険会社からの便宜供与、資本・取引関係、特定の保険会社の事務に精通していることなど代理店側の都合や、募集人の主観的又は属人的判断に基づく事項を基準や理由等とすることは、不適切な提示・推奨に該当し得るため適切でないと考えます。\n比較推奨販売を行うに当たっては、顧客が自らの抱えるリスクや保険ニーズに合致した保険商品であるかを十分に確認できるよう、保険募集人が保険商品に係る事項について顧客の意向を丁寧に把握することが前提であると考えます。こうした点を踏まえると、顧客の意向に沿って特定の保険商品を提示・推奨する際には、主たる基準や理由等として、顧客の意向に沿う保障(補償)内容等の商品特性や保険料水準といった保険商品に直接関係する事項を説明する必要があります。\nまた、顧客が事故対応件数や販売実績等の商品特性と直結しない事項についても重視する場合には、保険商品に直接関係する事項とあわせて、提示・推奨理由とすることは否定されませんが、これらの事項は顧客意向との関係で合理性・具体性を有し、顧客の比較判断に資する客観的事項である必要があります。いずれにせよ、これらの事項は商品特性と直結せず、恣意的な推奨につながるおそれがある点に留意が必要です。\n加えて、提示・推奨の基準や理由等に係る数値・資料の根拠について、例えば、同号ハに基づいて乗合代理店の店舗ごとに異なる保険会社の保険契約を取り扱っていたことを前提として、特定の保険契約を推奨するような資料等に基づく場合など、結果として、恣意的な選別とならないよう、収集期間、対象、件数、集計・評価方法等を明らかにするなど、合理性を適切に判断すべきです。\nなお、比較推奨販売における情報提供のみで適切な選択に至らない場合は、無理に特定の保険契約へ絞らず、比較説明や複数の保険契約の提示、追加の意向確認等により、顧客の適切な商品選択の機会を確保することが求められます。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["便宜供与","手数料・インセンティブ","比較推奨","ハ方式","意向把握","顧客の最善の利益","証跡・記録"]},{"no":397,"location":"Ⅱ－4－2－9(5)","comment":"保険業法施行規則第227条の2第3項第4号ハに基づき、乗合代理店において店舗ごとに推奨する保険会社を決めている体制や、乗合代理店において店舗ごとに特定の保険会社が主となって教育・管理・指導を行っている体制のもとでは、保険募集人が特定の保険会社と連携を密にしているケ235ースがある。\nこうした中、例えば、顧客から「アフターフォロー」、「事故対応」を重視するとの意向が示された場合において、「当店舗ではA保険会社が最も連携しやすい」等の内部事情に依拠した推奨販売は、原則として許容されないとの理解でよいか。\nまた、顧客に対して推奨販売を行う場合は、主観的な理由ではなく、客観的に見て合理的である根拠に基づく必要があるものと考えるが相違ないか。\nなお、合理的な根拠を示したうえで、主観的な意見(自らが使用した際の感想や他の顧客からの評判など)を述べることは、直ちに問題とならないものと考えるがどうか。","pageStart":235,"pageEnd":236,"answer":"提示・推奨する基準や理由等が、顧客の最善の利益に照らし、合理的かつ一定の具体性を有するか否かについては、顧客の意向や商品特性等を踏まえ、個別具体的に判断されます。\n他方、保険業法施行規則第227条の2第3項第4号ハの廃止の趣旨は、便宜供与等により代理店の利益のみを優先して特定の保険契約の推奨が行われ、顧客の適切な商品選択の機会が阻害されないよう求める点にあり、手数料水準、販売目標、保険会社からの便宜供与、資本・取引関係、特定の保険会社の事務に精通していることなど代理店側の都合や、募集人の主観的又は属人的判断に基づく事項を基準や理由等とすることは、不適切な提示・推奨に該当し得るため適切でないと考えます。\n比較推奨販売を行うに当たっては、顧客が自らの抱えるリスクや保険ニーズに合致した保険商品であるかを十分に確認できるよう、保険募集人が保険商品に係る事項について顧客の意向を丁寧に把握することが前提であると考えます。こうした点を踏まえると、顧客の意向に沿って特定の保険商品を提示・推奨する際には、主たる基準や理由等として、顧客の意向に沿う保障(補償)内容等の商品特性や保険料水準といった保険商品に直接関係する事項を説明する必要があります。\nまた、顧客が事故対応件数や販売実績等の商品特性と直結しない事項についても重視する場合には、保険商品に直接関係する事項とあわせて、提示・推奨理由とすることは否定されませんが、これらの事項は顧客意向との関係で合理性・具体性を有し、顧客の比較判断に資する客観的事項である必要があります。いずれにせよ、これらの事項は商品特性と直結せず、恣意的な推奨につながるおそれがある点に留意が必要です。\n加えて、提示・推奨の基準や理由等に係る数値・資料の根拠について、例えば、同号ハに基づいて乗合代理店の店舗ごとに異なる保険会社の保険契約を取り扱っていたことを前提として、特定の保険契約を推奨するような資料等に基づく場合など、結果として、恣意的な選別とならないよう、収集期間、対象、件数、集計・評価方法等を明らかにするなど、合理性を適切に判断すべきです。\nなお、比較推奨販売における情報提供のみで適切な選択に至らない場合は、無理に特定の保険契約へ絞らず、比較説明や複数の保険契約の提示、追加の意向確認等により、顧客の適切な商品選択の機会を確保することが求められます。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["便宜供与","手数料・インセンティブ","比較推奨","ハ方式","意向把握","顧客の最善の利益"]},{"no":398,"location":"Ⅱ－4－2－9(5)","comment":"例えば、顧客の意向が「事故対応が優れている」等、乗合代理店として客観的なデータ等を示すことが難しいものであった場合には、乗合代理店としての合理的かつ一定の具体性を有する基準や理由等(例えば、乗合代理店が認識している、過去の事故に関する保険会社の対応状況等が考えられる)を説明することによって、監督指針II－4－2－9(5)①B.(a)第1段落のとおり特定の保険会社(複数ある場合は複数)の保険契約を選別したり、同B.(a)第2段落のとおり特定の保険会社(複数ある場合は複数)の保険契約を推奨したりできるという理解でよいか。なお、当然のことながら、当該保険会社からの手数料の多寡や便宜供与の有無・内容を基準や理由等とすることはない。","pageStart":236,"pageEnd":236,"answer":"提示・推奨する基準や理由等が、顧客の最善の利益に照らし、合理的かつ一定の具体性を有するか否かについては、顧客の意向や商品特性等を踏まえ、個別具体的に判断されます。\n他方、保険業法施行規則第227条の2第3項第4号ハの廃止の趣旨は、便宜供与等により代理店の利益のみを優先して特定の保険契約の推奨が行われ、顧客の適切な商品選択の機会が阻害されないよう求める点にあり、手数料水準、販売目標、保険会社からの便宜供与、資本・取引関係、特定の保険会社の事務に精通していることなど代理店側の都合や、募集人の主観的又は属人的判断に基づく事項を基準や理由等とすることは、不適切な提示・推奨に該当し得るため適切でないと考えます。\n比較推奨販売を行うに当たっては、顧客が自らの抱えるリスクや保険ニーズに合致した保険商品であるかを十分に確認できるよう、保険募集人が保険商品に係る事項について顧客の意向を丁寧に把握することが前提であると考えます。こうした点を踏まえると、顧客の意向に沿って特定の保険商品を提示・推奨する際には、主たる基準や理由等として、顧客の意向に沿う保障(補償)内容等の商品特性や保険料水準といった保険商品に直接関係する事項を説明する必要があります。\nまた、顧客が事故対応件数や販売実績等の商品特性と直結しない事項についても重視する場合には、保険商品に直接関係する事項とあわせて、提示・推奨理由とすることは否定されませんが、これらの事項は顧客意向との関係で合理性・具体性を有し、顧客の比較判断に資する客観的事項である必要があります。いずれにせよ、これらの事項は商品特性と直結せず、恣意的な推奨につながるおそれがある点に留意が必要です。\n加えて、提示・推奨の基準や理由等に係る数値・資料の根拠について、例えば、同号ハに基づいて乗合代理店の店舗ごとに異なる保険会社の保険契約を取り扱っていたことを前提として、特定の保険契約を推奨するような資料等に基づく場合など、結果として、恣意的な選別とならないよう、収集期間、対象、件数、集計・評価方法等を明らかにするなど、合理性を適切に判断すべきです。\nなお、比較推奨販売における情報提供のみで適切な選択に至らない場合は、無理に特定の保険契約へ絞らず、比較説明や複数の保険契約の提示、追加の意向確認等により、顧客の適切な商品選択の機会を確保することが求められます。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["便宜供与","手数料・インセンティブ","比較推奨","ハ方式","意向把握","顧客の最善の利益"]},{"no":399,"location":"Ⅱ－4－2－9(5)","comment":"各保険会社の自動車商品が差別化されていない現状にあ236っては、どこの保険会社を選択するかということよりも、事故の際に代理店としてしっかり対応してくれるのかが最大の関心である顧客も多いものと考える(日本損害保険協会の「保険加入に関する消費者アンケート」によると、自動車保険加入に際して最も重視するものは「アフターフォローの体制」となっているところ)。\n保険契約の選択に際して、乗合代 ならないよう、収集期間、対象、件数、集計・評価方法等を明らかにするなど、合理性を適切に判断すべきです。\nなお、比較推奨販売における情報提供のみで適切な選択に至らない場合は、無理に特定の保険契約へ絞らず、比較説明や複数の保険契約の提示、追加の意向確認等により、顧客の適切な商品選択の機会を確保することが求められます。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["便宜供与","手数料・インセンティブ","比較推奨","ハ方式","意向把握","顧客の最善の利益"]},{"no":409,"location":"Ⅱ－4－2－9(5)","comment":"監督指針Ⅱ－4－2－9(5)①B.(a)第1段落に関して、顧客が「保険事故発生から保険金のお支払いまでのサポート対応」や「保険契約内容変更時のスムーズな対応」を重視する場合、その意向を踏まえて当該対応が充実している保険会社の保険契約を選別することは許容されるという理解でよいか。\nまた、監督指針Ⅱ－4－2－9(5)①B.(a)第2段落に関して、「保険事故発生から保険金のお支払いまでのサポート対応」や「保険契約内容変更時のスムーズな対応」の充実度によって特定の保険会社の保険契約を推奨することは許容されるという理解でよいか。\nなお、保険契約は事故対応や保全対応が充実したものであることが顧客の最善利益に資するものと考えられし、また、当該対応の充実度は、保険会社側の拠点数や人員体制、乗合代理店として認識している保険会社による過去の対応実績等によって判断して提示・推奨することとし、乗合代理店の都合によって提示・推奨しないこととする。","pageStart":241,"pageEnd":241,"answer":"提示・推奨する基準や理由等が、顧客の最善の利益に照らし、合理的かつ一定の具体性を有するか否かについては、顧客の意向や商品特性等を踏まえ、個別具体的に判断されます。\n他方、保険業法施行規則第227条の2第3項第4号ハの廃止の趣旨は、便宜供与等により代理店の利益のみを優先して特定の保険契約の推奨が行われ、顧客の適切な商品選択の機会が阻害されないよう求める点にあり、手数料水準、販売目標、保険会社からの便宜供与、資本・取引関係、特定の保険会社の事務に精通していることなど代理店側の都合や、募集人の主観的又は属人的判断に基づく事項を基準や理由等とすることは、不適切な提示・推奨に該当し得るため適切でないと考えます。\n比較推奨販売を行うに当たっては、顧客が自らの抱えるリスクや保険ニーズに合致した保険商品であるかを十分に確認できるよう、保険募集人が保険商品に係る事項について顧客の意向を丁寧に把握することが前提であると考えます。こうした点を踏まえると、顧客の意向に沿って特定の保険商品を提示・推奨する際には、主たる基準や理由等として、顧客の意向に沿う保障(補償)内容等の商品特性や保険料水準といった保険商品に直接関係する事項を説明する必要があります。\nまた、顧客が事故対応件数や販売実績等の商品特性と直結しない事項についても重視する場合には、保険商品に直接関係する事項とあわせて、提示・推奨理由とすることは否定されませんが、これらの事項は顧客意向との関係で合理性・具体性を有し、顧客の比較判断に資する客観的事項である必要があります。いずれにせよ、これらの事項は商品特性と直結せず、恣意的な推奨につながるおそれがある点に留意が必要です。\n加えて、提示・推奨の基準や理由等に係る数値・資料の根拠について、例えば、同号ハに基づいて乗合代理店の店舗ごとに異なる保険会社の保険契約を取り扱っていたことを前提として、特定の保険契約を推奨するような資料等に基づく場合など、結果として、恣意的な選別とならないよう、収集期間、対象、件数、集計・評価方法等を明らかにするなど、合理性を適切に判断すべきです。\nなお、比較推奨販売における情報提供のみで適切な選択に至らない場合は、無理に特定の保険契約へ絞らず、比較説明や複数の保険契約の提示、追加の意向確認等により、顧客の適切な商品選択の機会を確保することが求められます。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["便宜供与","手数料・インセンティブ","比較推奨","ハ方式","意向把握","顧客の最善の利益"]},{"no":410,"location":"Ⅱ－4－2－9(5)","comment":"提示・推奨する理由として、顧客の意向を踏まえた商品特性等を主たる理由として告げるとともに、あわせて営業上の理由を従たる理由として告げることは差し支えないか。\n241仮に、代理店が保険募集に当たり、営業上の理由や事情を顧客に伝えることが一律に否定されるのであれば、その法的根拠がどこにあるのか伺いたい。","pageStart":241,"pageEnd":242,"answer":"提示・推奨する基準や理由等が、顧客の最善の利益に照らし、合理的かつ一定の具体性を有するか否かについては、顧客の意向や商品特性等を踏まえ、個別具体的に判断されます。\n他方、保険業法施行規則第227条の2第3項第4号ハの廃止の趣旨は、便宜供与等により代理店の利益のみを優先して特定の保険契約の推奨が行われ、顧客の適切な商品選択の機会が阻害されないよう求める点にあり、手数料水準、販売目標、保険会社からの便宜供与、資本・取引関係、特定の保険会社の事務に精通していることなど代理店側の都合や、募集人の主観的又は属人的判断に基づく事項を基準や理由等とすることは、不適切な提示・推奨に該当し得るため適切でないと考えます。\n比較推奨販売を行うに当たっては、顧客が自らの抱えるリスクや保険ニーズに合致した保険商品であるかを十分に確認できるよう、保険募集人が保険商品に係る事項について顧客の意向を丁寧に把握することが前提であると考えます。こうした点を踏まえると、顧客の意向に沿って特定の保険商品を提示・推奨する際には、主たる基準や理由等として、顧客の意向に沿う保障(補償)内容等の商品特性や保険料水準といった保険商品に直接関係する事項を説明する必要があります。\nまた、顧客が事故対応件数や販売実績等の商品特性と直結しない事項についても重視する場合には、保険商品に直接関係する事項とあわせて、提示・推奨理由とすることは否定されませんが、これらの事項は顧客意向との関係で合理性・具体性を有し、顧客の比較判断に資する客観的事項である必要があります。いずれにせよ、これらの事項は商品特性と直結せず、恣意的な推奨につながるおそれがある点に留意が必要です。\n加えて、提示・推奨の基準や理由等に係る数値・資料の根拠について、例えば、同号ハに基づいて乗合代理店の店舗ごとに異なる保険会社の保険契約を取り扱っていたことを前提として、特定の保険契約を推奨するような資料等に基づく場合など、結果として、恣意的な選別とならないよう、収集期間、対象、件数、集計・評価方法等を明らかにするなど、合理性を適切に判断すべきです。\nなお、比較推奨販売における情報提供のみで適切な選択に至らない場合は、無理に特定の保険契約へ絞らず、比較説明や複数の保険契約の提示、追加の意向確認等により、顧客の適切な商品選択の機会を確保することが求められます。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["便宜供与","手数料・インセンティブ","比較推奨","ハ方式","意向把握","顧客の最善の利益"]},{"no":411,"location":"Ⅱ－4－2－9(5)","comment":"顧客の意向が保険料等客観的な内容以外であった場合、個人的主観によって判断が異なる内容(補償内容、アフターサービス等)が顧客の意向となり得る。個人的主観によって判断が異なる事項であった場合、保険募集人又は乗合代理店の主観で保険会社の選定を行ってもよいか。","pageStart":242,"pageEnd":242,"answer":"提示・推奨する基準や理由等が、顧客の最善の利益に照らし、合理的かつ一定の具体性を有するか否かについては、顧客の意向や商品特性等を踏まえ、個別具体的に判断されます。\n他方、保険業法施行規則第227条の2第3項第4号ハの廃止の趣旨は、便宜供与等により代理店の利益のみを優先して特定の保険契約の推奨が行われ、顧客の適切な商品選択の機会が阻害されないよう求める点にあり、手数料水準、販売目標、保険会社からの便宜供与、資本・取引関係、特定の保険会社の事務に精通していることなど代理店側の都合や、募集人の主観的又は属人的判断に基づく事項を基準や理由等とすることは、不適切な提示・推奨に該当し得るため適切でないと考えます。\n比較推奨販売を行うに当たっては、顧客が自らの抱えるリスクや保険ニーズに合致した保険商品であるかを十分に確認できるよう、保険募集人が保険商品に係る事項について顧客の意向を丁寧に把握することが前提であると考えます。こうした点を踏まえると、顧客の意向に沿って特定の保険商品を提示・推奨する際には、主たる基準や理由等として、顧客の意向に沿う保障(補償)内容等の商品特性や保険料水準といった保険商品に直接関係する事項を説明する必要があります。\nまた、顧客が事故対応件数や販売実績等の商品特性と直結しない事項についても重視する場合には、保険商品に直接関係する事項とあわせて、提示・推奨理由とすることは否定されませんが、これらの事項は顧客意向との関係で合理性・具体性を有し、顧客の比較判断に資する客観的事項である必要があります。いずれにせよ、これらの事項は商品特性と直結せず、恣意的な推奨につながるおそれがある点に留意が必要です。\n加えて、提示・推奨の基準や理由等に係る数値・資料の根拠について、例えば、同号ハに基づいて乗合代理店の店舗ごとに異なる保険会社の保険契約を取り扱っていたことを前提として、特定の保険契約を推奨するような資料等に基づく場合など、結果として、恣意的な選別とならないよう、収集期間、対象、件数、集計・評価方法等を明らかにするなど、合理性を適切に判断すべきです。\nなお、比較推奨販売における情報提供のみで適切な選択に至らない場合は、無理に特定の保険契約へ絞らず、比較説明や複数の保険契約の提示、追加の意向確認等により、顧客の適切な商品選択の機会を確保することが求められます。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["便宜供与","手数料・インセンティブ","比較推奨","ハ方式","意向把握","顧客の最善の利益"]},{"no":412,"location":"Ⅱ－4－2－9(5)","comment":"監督指針改正案で示されている「顧客の最善の利益を勘案したものとして、保険募集人や乗合代理店の都合によることなく、合理的かつ一定の具体性を有する基準や理由等を説明しているか。」に関して、例えば、以下のような基準や理由等は、監督指針の定め・趣旨に則したものとはいえないという理解でよいか。\n(顧客の最善の利益を勘案したものと考えられないもの)\n・「代理店への便宜供与(例えば、契約見込み客の提供・保険募集人候補の紹介、広告出稿費の多寡等)」や「乗合代理店との資本関係・取引関係があること」を提案・推奨の理由とするもの(具体性を有する説明であるとは考えられないもの)\n・「当社の経営方針により選定している」、「当社独自の基準に基づき選定している」等、具体的な説明ではないもの","pageStart":242,"pageEnd":242,"answer":"ご理解のとおりです。\n推奨販売においては、顧客の意向に沿って、合理的かつ一定の具体性を有する基準や理由等に基づき、保険契約を選別し、提示・推奨する必要があります。\nしたがって、保険代理店への便宜供与、資本関係、取引関係、手数料水準、「当社の経営方針による」、「当社独自の基準による」などといった、顧客の意向や利益と直接関係しない代理店の都合を提示・推奨理由とすることは適切ではありません。\n提示・推奨理由については、保障(補償)内容、保険料水準、特約等、顧客が重視する事項との関係で、分かりやすく説明される必要があります。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["便宜供与","手数料・インセンティブ","顧客の最善の利益"]},{"no":413,"location":"Ⅱ－4－2－9(5)","comment":"顧客意向に基づく商品提案の基準について、「合理的か242つ一定の具体性を有する基準」とは具体的にどのように設定すればよいのか。\n提案理由の説明において、他の保険契約も存在する旨や比較対象についてどの程度詳細に説明する必要があるのか。\n顧客の意向に沿って推奨商品を選別するに当たり、商品選別の客観的基準を明確化することは重要だが、各乗合保険会社の保険契約について、その特徴、強み、弱み、他社商品との違い(優劣)を分析し、序列付けをする必要があるが、その際、その判定基準は各乗合代理店の任意と考えてよいか。\n「保険料を最優先で抑えたい」という意向であれば、保険料水準の低い商品群を選別することになるが、各社、補償内容やサービスに差があるため、厳密に保険料だけで比較することはできない。この場合は、近似の補償・サービスという判定基準は、各乗合代理店の任意と考えて良いのか。\n顧客が重視する事項を確認する際、「補償範囲」、「保険料水準」、「保険期間」などの項目以外にどのような項目を含めるべきかなど諸々の設定についてガイドライン・指針を定める予定はないのか。","pageStart":242,"pageEnd":243,"answer":"合理的かつ一定の具体性を有する基準や理由等の設定方法は、顧客の意向、商品特性等により異なるため、一概にお示しすることは困難です。\n推奨販売においては、乗合代理店が取扱商品全てについて一律に優劣や序列を付けることまで求めるものではありませんが、特定の保険契約を他の保険契約と比較する場合には、Ⅱ－4－2－9(5)①A.及び針Ⅱ－4－2－2(9)②の内容やその趣旨に照らして、顧客に誤認を与えないよう適切に説明する必要があります。\nまた、特定の保険契約を推奨する場合には、推奨する保険契約以外にも、選別対象となった保険契約がある旨及び顧客の求めに応じて、それらの概要又は契約内容を説明する旨を説明する必要があります。\n保険料水準を基準に比較する場合には、保障(補償)内容、特約、免責金額等を可能な限り同一又は近似の条件で比較することが考えられます。また、その場合、前提とした条件や差異について、顧客に誤認を与えないよう説明するなど適切に対応する必要があります。\nなお、提示・推奨する基準や理由等は、各乗合代理店が取扱商品等を踏まえ、社内規則等において組織的に定め、恣意的な運用とならないよう、記録・検証態勢を整備することも重要です。\n顧客が重視する事項についても、監督指針において画一的な項目を定めることは困難ですが、各乗合代理店において、商品特性や顧客属性を踏まえ、顧客の意向を適切に把握できる項目を設定する必要があります。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["証跡・記録"]},{"no":414,"location":"Ⅱ－4－2－9(5)","comment":"乗合代理店が、顧客の意向によらず、「客観的な基準・理由等(例えば、予定利率が良い、特約等の機能が他にはな243い等)に基づき1商品に絞り込んで顧客に提示する」ことは、顧客が重視する項目を丁寧かつ明確に把握した上で顧客の意向に沿って保険商品を絞り込み推奨することを求める保険業法施行規則改正案及び監督指針改正案の趣旨に照らして、許容されないとの理解でよいか。","pageStart":243,"pageEnd":244,"answer":"貴見のとおりです。\n乗合代理店が、顧客の意向を確認せず又は顧客が重視する事項との関係を踏まえずに、自ら、予定利率、特約、商品機能等の商品特性のみを理由として、特定の保険契約を選別し、提示・推奨することは適切ではありません。\n推奨販売においては、顧客が重視する事項を丁寧かつ明確に確認した上で、当該意向に沿って、合理的かつ一定の具体性を有する基準や理由等に基づき保険契約を選別し、提示・推奨する必要があります。\nなお、予定利率、特約、商品機能等の商品特性は、顧客の意向に照らして重要な要素である場合には、提示・推奨理由の一つとなり得ます。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":[]},{"no":415,"location":"Ⅱ－4－2－9(5)","comment":"比較可能な商品の中から、「その保険会社の営業職員等である」ことのみを絞込みの理由であるとして、自社の商品のみを顧客に提示・推奨することは、顧客が重視する項目を丁寧かつ明確に把握した上で顧客の意向に沿って保険商品を絞り込み推奨することを求める保険業法施行規則改正案及び監督指針改正案の趣旨に照らして、許容されないとの理解でよいか。","pageStart":244,"pageEnd":244,"answer":"貴見のとおりです。\n二以上の比較可能な同種の保険契約がある場合に、顧客の意向を踏まえず、「当該保険会社の営業職員等であること」を理由として、自社商品のみを提示・推奨することは適切ではありません。\n推奨販売においては、顧客が重視する事項を丁寧かつ明確に確認した上で、当該意向に沿って、合理的かつ一定の具体性を有する基準や理由等に基づき、保険契約を選別し、提示・推奨する必要があります。\nなお、自社商品を提示・推奨する場合であっても、その理由は、顧客の意向に照らした商品内容、保障(補償)内容、保険料水準等との関係で説明される必要があります。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":[]},{"no":416,"location":"Ⅱ－4－2－9(5)","comment":"監督指針Ⅱ－4－2－9(5)①B.(a)について、顧客の意向に沿って選別した保険契約の中から、商品特性等により、特定の保険契約を推奨する場合において、推奨する基準・理由等が複数ある場合には、その主たるものを説明する必244要がある、との理解でよいか。","pageStart":244,"pageEnd":245,"answer":"貴見のとおりです。\nなお、手数料水準、便宜供与、販売目標等の代理店の都合による理由を、他の理由に置き換えて説明することは適切ではありません。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["便宜供与","手数料・インセンティブ"]},{"no":417,"location":"Ⅱ－4－2－9(5)","comment":"顧客から「最も保険料が安い保険会社が良い」という意向があった場合、年齢や等級、事故有無や補償条件等によりあらゆるパターンが想定され、また、補償内容が各社均一で揃うことは無いため、正しい比較による価格差の提示は現実的には難しく、乗合代理店にとっても負担増となるところ、どのような対応が必要になるのか伺いたい。","pageStart":245,"pageEnd":245,"answer":"顧客が「最も保険料が安い商品を希望する」と述べた場合であっても、保険料の多寡のみをもって直ちに商品を選別し、提示・推奨するのではなく、顧客のリスク認識、保障(補償)内容、保険金額、保険期間、特約、免責等について、適切に意向を把握する必要があります。\nその上で、保険料水準を重視する意向に沿って、可能な限り同一又は近似の条件で比較し、保障(補償)内容やサービス等の差異、保険料に影響する要素を顧客に分かりやすく説明することなどⅡ－4－2－9(5)①A及びⅡ－4－2－2(9)に照らして適切に対応することが重要です。\nなお、全ての案件について、取扱保険会社全社の保険契約を網羅的に試算・説明することを一律に求めるものではありません。\n顧客との対話を通じて、必要な保障(補償)内容、リスク許容度、保険料負担等を確認し、顧客の意向に沿って比較対象を絞り込むことは考えられます。\nただし、顧客の意向に沿って比較対象を絞り込むことは、特定の保険契約への推奨行為にあたるため、Ⅱ－4－2－9(5)①B.に基づき、絞り込みの基準や理由等を合理的かつ一定の具体性をもって説明することなどが必要です。また、手数料水準、販売目標、便宜供与等の代理店の都合により、特定の保険会社又は特定の保険契約へ誘導することは認められないため留意が必要です。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["便宜供与","手数料・インセンティブ"]},{"no":418,"location":"Ⅱ－4－2－9(5)","comment":"推奨方針について、当社は損保15社、生保24社と代理店委託契約を結んでいる。\n顧客から、「とにかく一番保険料が安い保険に加入したい」という意向があった場合、生命保険の場合であれば、24社の保険料を試算する必要があるのか伺いたい。\n顧客と話し合いながら、客観的な理由(例えば保障の広さ等)を説明した上で顧客が納得できていれば、乗合代理店がある程度絞り込んだうえで提案を行っても問題はないか。\n顧客の意向をよく聞き、顧客の要望を引き出しながら絞り込む場合、改正案に反していないものと考えている。","pageStart":245,"pageEnd":245,"answer":"顧客が「最も保険料が安い商品を希望する」と述べた場合であっても、保険料の多寡のみをもって直ちに商品を選別し、提示・推奨するのではなく、顧客のリスク認識、保障(補償)内容、保険金額、保険期間、特約、免責等について、適切に意向を把握する必要があります。\nその上で、保険料水準を重視する意向に沿って、可能な限り同一又は近似の条件で比較し、保障(補償)内容やサービス等の差異、保険料に影響する要素を顧客に分かりやすく説明することなどⅡ－4－2－9(5)①A及びⅡ－4－2－2(9)に照らして適切に対応することが重要です。\nなお、全ての案件について、取扱保険会社全社の保険契約を網羅的に試算・説明することを一律に求めるものではありません。\n顧客との対話を通じて、必要な保障(補償)内容、リスク許容度、保険料負担等を確認し、顧客の意向に沿って比較対象を絞り込むことは考えられます。\nただし、顧客の意向に沿って比較対象を絞り込むことは、特定の保険契約への推奨行為にあたるため、Ⅱ－4－2－9(5)①B.に基づき、絞り込みの基準や理由等を合理的かつ一定の具体性をもって説明することなどが必要です。また、手数料水準、販売目標、便宜供与等の代理店の都合により、特定の保険会社又は特定の保険契約へ誘導することは認められないため留意が必要です。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["便宜供与","手数料・インセンティブ"]},{"no":419,"location":"Ⅱ－4－2－9(5)","comment":"「推奨する場合の、合理的かつ一定の具体性を有する基準や理由」について、一般的に、乗合代理店による商品・保険会社の「推奨」行為には、顧客のニーズ把握や経験に245基づく判断など、一定程度の主観的要素が含まれるものと考えられる。\nそのような中で、「合理的かつ一定の具体性を有する基準や理由」という要件については、実務上の判断が難しい場面も想定されるが、本監督指針の趣旨に沿うものとして想定される基準や理由の具体例、また、趣旨に沿わない例や留意が必要な例について伺いたい。","pageStart":245,"pageEnd":246,"answer":"「提示・推奨する基準や理由等」が、顧客の最善の利益の観点から、合理的かつ一定の具体性を有するかは、顧客の意向、商品特性等を踏まえ、個別具体的に判断されますが、例えば、顧客が重視する事項との関係で、保障(補償)内容、保険料水準、特約、免責、保障(補償)期間、支払事由を理由として説明する場合には、合理的かつ一定の具体性を有する理由となり得ます。\n一方で、手数料水準、販売目標、保険会社からの便宜供与、保険会社との取引関係等、顧客の意向や利益と直接関係しない代理店側の事情や保険募集人の主観的又は属人的な理由により特定の保険契約を提示・推奨することは適切ではありません。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["便宜供与","手数料・インセンティブ","顧客の最善の利益"]},{"no":420,"location":"Ⅱ－4－2－9(5)","comment":"提示・推奨する理由には様々なものがあると考えるが、具体的にどのような範囲のものがこれに該当するのか伺いたい。","pageStart":246,"pageEnd":246,"answer":"「提示・推奨する基準や理由等」が、顧客の最善の利益の観点から、合理的かつ一定の具体性を有するかは、顧客の意向、商品特性等を踏まえ、個別具体的に判断されますが、例えば、顧客が重視する事項との関係で、保障(補償)内容、保険料水準、特約、免責、保障(補償)期間、支払事由を理由として説明する場合には、合理的かつ一定の具体性を有する理由となり得ます。\n一方で、手数料水準、販売目標、保険会社からの便宜供与、保険会社との取引関係等、顧客の意向や利益と直接関係しない代理店側の事情や保険募集人の主観的又は属人的な理由により特定の保険契約を提示・推奨することは適切ではありません。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["便宜供与","手数料・インセンティブ","顧客の最善の利益"]},{"no":421,"location":"Ⅱ－4－2－9(5)","comment":"今後保険業法施行規則第227条の2第3項第4号ロ(以下、ロ方式とする。)を基本とする販売方針を策定した場合、顧客の意向に沿って比較可能な同種の保険契約又は特定の保険会社を選別・推奨して募集を行うことになると理解している。\nしかしながら、現状においては、取扱保険会社間で商品性、サービス、アフターフォロー体制等に大きな差が見られないケースが多く、保険料が低廉であること以外の点では顧客の意向を十分に差別化して把握できない状況が想定される。\nまた、保険料においても乗合代理店型の保険会社の差は年間で数千円程度にとどまる場合が多く、概算保険料だけでは適切な比較が困難であることから、結局は取扱保険会社すべての保険料を算出し、保険契約の内容を説明した上で顧客意向を形成する募集プロセスとなってしまう可能246性が高い。\nこのような場合、実態として同号イ(以下、イ方式とする。)と同じ募集プロセスを経ることとなり、乗合代理店がロ方式を採用したとしても、実質的にイ方式による募集と変わらない運用となってしまう懸念がある。保険契約ごとの差異がほとんどない現状において、ロ方式を残した趣旨を確認したい。\nまた、比較推奨販売に関する方針を乗合代理店が策定するにあたり、どこまで具体的に定めるべきか伺いたい。","pageStart":246,"pageEnd":247,"answer":"改正監督指針において、比較説明と別に推奨販売を定めている趣旨は、顧客の意向が多様であることを踏まえ、全ての場合に取扱保険会社全社の商品を網羅的に比較説明することを求めるのではなく、顧客の意向に沿って、合理的かつ一定の具体性を有する基準や理由等に基づき、保険契約を選別し、提示・推奨することを可能とする点にあります。\nしたがって、保険会社間の商品性や保険料水準の差異が小さい場合であっても、顧客が重視する事項を確認した上で、保障(補償)内容等の商品特性や保険料など、顧客の意向との関係で合理的かつ一定の具体性を有し、顧客の比較判断に資する客観的事項を踏まえて提示・推奨することが重要です。なお、代理店の都合や保険募集人の主観的又は属人的な事項を提示・推奨理由とすることは恣意的な保険契約の選別に該当し得るため、適切ではありません。\n一方で、顧客の意向に照らして差異が乏しい場合には、その旨を説明した上で、必要な範囲で分かりやすく説明することが考えられます。全ての場合に、全社の詳細な見積りや商品説明を一律に求めるものではありません。\nまた、比較推奨販売に関する方針については、乗合代理店自身の規模や業務特性を踏まえつつ、保険募集人ごとに恣意的な運用とならないよう、Ⅱ－4－2－9(5)②に基づき、例えば、提示・推奨する基準や理由、意向把握の方法、顧客が重視する事項の確認方法、顧客への説明方法、記録・検証方法などを組織的に適切に定めたうえで、各店舗又は各保険募集人に対し教育・管理・指導を徹底することが重要であると考えます。\nなお、当該方針は、手数料水準、販売目標、便宜供与等の代理店の都合により特定の保険会社又は特定の保険契約へ誘導するものとならないよう留意する必要があります。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["便宜供与","手数料・インセンティブ","比較推奨","意向把握","証跡・記録"]},{"no":422,"location":"Ⅱ－4－2－9(5)","comment":"監督指針Ⅱ－4－2－9(5)\n①A.(c)に「自らが勧める保険契約の優位性の根拠を説明しているか」と記載されているが、「自らが勧める」という表現は、監督指針Ⅱ－4－2－9(5)\n①B.に記載されている「推奨」と明確に区別できるものではないことから意図的に異なる文言が使用されているという理解だが、違いについて伺いたい。\nまた、今後、乗合代理店が比較推奨販売に関する方針を策定するにあたり、注意すべき点(表現方法等)を伺いたい。\n247","pageStart":247,"pageEnd":248,"answer":"Ⅱ－4－2－9(5)①A.は、乗合代理店が複数の保険契約の内容を比較して説明する場合を想定したものです。その中でA.(c)の「自らが勧める保険契約」とは、比較説明の過程や、同①B.において特定の保険契約を提示・推奨する際に、特定の保険契約の優位性を説明する場面を想定したものです。\n一方、同①B.は、「二以上の比較可能な同種の保険契約」の中から、顧客の意向に沿って、一又は二以上の保険契約を選別し、提示・推奨する場合を想定したものです。\n両者は、実務上、重なり得る場面もありますが、Aは「比較説明」、Bは「顧客意向に沿った選別・提示・推奨」に着目した整理です。\n比較推奨販売に関する方針を策定する際には、比較説明を行う場合と推奨販売を行う場合を区別しつつ、いずれの場合も、顧客の意向に沿わない特定の保険契約への恣意的な誘導とならないよう、例えば、顧客意向の把握方法、顧客が重視する事項の確認方法、顧客への説明方法、記録・検証方法などを組織的に適切に定めたうえで、各店舗又は各保険募集人に対し教育・管理・指導を徹底することが重要であると考えます。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["比較推奨","証跡・記録"]},{"no":423,"location":"－","comment":"顧客の意向把握のプロセスについて、下記1.から5.の流れで行うことが考えられる。\n1.当初意向の把握2.説明を受ける商品を絞り込むかの確認3.特に重視する意向の把握4.商品特性等により、代理店が特定の保険契約を推奨する場合の取扱い5.個別商品の説明・申込上記1.について、当初意向を把握する事項としては、希望する保障内容(万一の保障・遺族の生活保障、医療・介護・就業不能に備える保障、資産形成等)、貯蓄部分の必要性、保障期間、保険料、保険金額に関する範囲の希望、優先する事項がある場合は、その旨等とすることが考えられる、という理解でよいか。","pageStart":248,"pageEnd":248,"answer":"貴見のとおりです。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["意向把握"]},{"no":424,"location":"Ⅱ－4－2－9(5)","comment":"監督指針Ⅱ－4－2－9(5)①B.(a)前段に「当該提示・推奨する基準や理由等」と記載されているが、「基準や理由等」\nについては、後段の「合理的かつ一定の具体性を有する」\n必要はないと考えてよいか。\n248","pageStart":248,"pageEnd":249,"answer":"Ⅱ－4－2－9(5)①B.(a)前段の「当該提示・推奨する基準や理由等」については、顧客の意向との関係で、合理的かつ一定の具体性を有するものである必要があります。\n前段は、乗合代理店が「二以上の比較可能な同種の保険契約」\nの中から、顧客の意向に沿って、一又は二以上の保険契約を選別し、提示・推奨する場合の説明を求めるものです。後段は、特に特定の保険契約を推奨する場合には、保険募集人の恣意的な判断が介在する程度が高まることから、顧客の最善の利益を勘案し、代理店都合によらない合理的かつ具体的な基準や理由の説明が特に重要であることを明確化したものです。\nしたがって、前段・後段のいずれの場合も、抽象的又は形式的な説明では足りず、顧客の意向に照らして、提示・推奨の基準や理由等を分かりやすく説明する必要があります。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["顧客の最善の利益"]},{"no":425,"location":"Ⅱ－4－2－9(5)","comment":"監督指針Ⅱ－4－2－9(5)①B.について、前提として、現在の保険契約は内容が完全に同じものがなく、比較推奨の対象となりうる内容も保険料、特約、付帯サービス等、多岐に亘っており、全ての情報を網羅的に比較し、完全に同条件での比較を行うことは実務上極めて困難である。\nこの点、乗合代理店は保険仲立人のようなベストアドバイス義務を負っている訳ではないことから、把握した顧客の意向に対し、乗合代理店で設定した客観的かつ合理的な基準に基づき保険契約を絞り込み、その推奨方針と理由を顧客に明示して勧めることで問題ないか。","pageStart":249,"pageEnd":249,"answer":"推奨販売の対象となる保険契約は、「二以上の比較可能な同種の保険契約」であり、乗合代理店が取り扱う全ての保険契約について、網羅的かつ一律に説明が求められるものではありません。\n一方で、貴見のケースにおいて、想定されている場面が必ずしも明らかではありませんが、あらかじめ乗合代理店が設定した推奨方針のみを理由に、顧客の意向に先立って特定の保険契約を絞り込み、提示・推奨することは、顧客の意向に基づく選別とはいえず、保険業法施行規則第227条の2第3項第4号ハの廃止の趣旨に照らし、適切ではありません。\n乗合代理店が商品を選別し、提示・推奨する場合には、顧客の意向を把握した上で、当該意向との関係で、保障(補償)内容、保険料水準、特約等について、合理的かつ一定の具体性を有する基準や理由等を説明する必要があります。\nなお、社内規則等において、提示・推奨に係る判断枠組みや基準を定めること自体は必要ですが、当該基準は、顧客意向に沿って保険契約を選別し、提示・推奨を行うためのものであり、代理店都合による事前の絞込みを正当化するものではありません。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["比較推奨","ハ方式"]},{"no":426,"location":"Ⅱ－4－2－9(5)","comment":"監督指針Ⅱ－4－2－9(5)①A.では、取扱保険会社すべて249の保険契約を比較・説明したうえで顧客に選択してもらうことが求められている一方、監督指針Ⅱ－4－2－9(5)①B.では、顧客の意向、とりわけ商品特性や保険料水準を踏まえて特定の保険契約を推奨するとされており、両方式の実務上の差異が、ほぼなくなっているように感じられる。\nしかしながら、監督指針Ⅱ－4－2－9(5)①B.(a)後段に「推奨する特定の保険契約以外の保険契約もある旨及び顧客の求めに応じて、それらの保険契約の概要又は契約内容を説明する旨を説明しているか」と記載されており、結果として、同B.においても取扱保険会社すべてについて説明することが求められる内容となっている。\n例えば、特定の保険契約を推奨しつつ、顧客に対して保険料や保障(補償)内容について他社商品との違いがある旨を説明すれば、顧客から他社商品の説明を求められることは容易に想定される。\nこのような点を踏まえると、両方式の違いが不明確になっていると考えられるが、具体的にどのような募集場面を想定して整理されているのかご教示いただきたい。","pageStart":249,"pageEnd":250,"answer":"Ⅱ－4－2－9(5)①A.は、保険会社との代理店委託契約又はこれに基づく覚書等において定められた保険契約全てを比較する場合や、Ⅱ－4－2－9(5)①B.において、特定の保険契約を提示・推奨する際、当該特定の保険契約の優位性を示すために他の保険契約と比較を行う場合を想定したものです。\n一方、同①B.は、保険会社との代理店委託契約又はこれに基づく覚書等において定められた保険契約のうち、「二以上の比較可能な同種の保険契約」の中から、顧客の意向に沿って一又は二以上の保険契約を選別し、提示・推奨する場合を想定したものです。\nしたがって、①B.は、取扱保険会社等の全ての保険契約について説明を求めるものではなく、顧客の意向に照らして選別対象となった範囲について対応するものです。\nまた、①B.において特定の保険契約を推奨する場合には、当該契約を推奨する基準や理由等を説明するとともに、推奨する契約以外にも選別対象となった保険契約がある旨及び顧客の求めに応じてそれらの概要又は契約内容を説明する旨を説明する必要があります。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":[]},{"no":427,"location":"Ⅱ－4－2－9(5)","comment":"監督指針Ⅱ－4－2－9(5)①B.(a)について、「乗合代理店が二以上の比較可能な同種の保険契約の中から顧客の意向に沿って保険契約を選別し、一又は二以上の保険契約を提示・推奨する場合には」と記載されているが、顧客の意向を把握していれば、すべての乗合保険会社の保険契約を説明する必要はないという理解でよいか。\nまた、顧客の意向に沿っていれば、乗合代理店が一つの250保険契約を推奨することも許容されると考えて問題ないか。","pageStart":250,"pageEnd":251,"answer":"Ⅱ－4－2－9(5)①B.については、保険会社との代理店委託契約又はこれに基づく覚書等において、取り扱うこととされている保険契約の中に「二以上の比較可能な同種の保険契約」が存在する場合に、顧客の意向に沿って保険契約を選別し、提示・推奨する際の対応を定めるものです。したがって、全ての乗合保険会社の保険契約を一律に説明することを求めるものではありません。\nまた、顧客の意向に沿って選別した結果、合理的かつ一定の具体性を有する基準や理由等に基づき、一の保険契約のみを提示・推奨することもあり得ます。ただし、その場合には、提示・推奨する保険契約の概要、当該契約を提示・推奨する基準や理由及び推奨する契約以外にも顧客の意向に沿った保険契約がある旨及び顧客の求めに応じてそれらの保険契約の概要又は契約内容を説明する旨を顧客に分かりやすく説明する必要があります。\nなお、手数料水準、販売目標、便宜供与等の代理店の都合により、特定の保険契約へ誘導することは適切ではありません。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["便宜供与","手数料・インセンティブ"]},{"no":428,"location":"Ⅱ－4－2－9(5)","comment":"顧客の意向把握のプロセスについて、下記1.から5.の流れで行うことが考えられる。\n1.当初意向の把握2.説明を受ける商品を絞り込むかの確認3.特に重視する意向の把握4.商品特性等により、代理店が特定の保険契約を推奨する場合の取扱い5.個別商品の説明・申込上記2について、監督指針Ⅱ－4－2－9(5)①B.(a)では「乗合代理店が二以上の比較可能な同種の保険契約の中から顧客の意向に沿って保険契約を選別し、一又は二以上の保険契約を提示・推奨する場合」(例えば、医療という種別・特性で絞り込んだ場合)に、「顧客が重視する事項を丁寧かつ明確に確認」した上で、もしくは、「顧客の意向が不明確な場合であっても、保険契約の選別に当たっては、例えば、顧客が特に重視すると考えられる事項を例示するなど、可能な限り、顧客の意向を把握した」結果、当該顧251客の意向(例えば、医療で、とにかく保険料が低廉を希望等)を踏まえても、なお、当該意向に沿った商品が複数ある(例えば、A商品、B商品、C商品)場合が存在すると思われる。\nこのような場合に、例えば、保障範囲が広いことから、A・B・CのうちA商品を推奨することは、「顧客の最善の利益を勘案したものとして、保険募集人や乗合代理店の都合によることなく、合理的かつ一定の具体性を有する基準や理由等」の説明として問題となるものではない、という理解でよいか。\n(「医療」という商品特性により絞り込んだ上で、「保険料水準」という顧客が重視する項目に沿って選別している(さらに「顧客最善利益を勘案した基準や理由(合理的かつ一定の具体性を有する説明)」)といえるものであり、このようなケースのために、推奨商品(群)を設定しておく必要性はない。\n推奨商品(群)を設定しておくこと自体が、「顧客の意向がないため推奨商品群を推奨した」という、本来、顧客の意向を丁寧に確認・把握すべき取扱いの潜脱につながるおそれがある、という理解でよいか)","pageStart":251,"pageEnd":252,"answer":"ご意見にあるプロセスは、顧客の意向把握及び推奨販売の一例としてあり得るものと考えます。\n顧客の意向に沿って選別した結果、なお複数の保険契約が残る場合に、例えば、保険料水準を重視する顧客意向を踏まえつつ、保障範囲の広さ等の商品特性によりA商品を提示・推奨することは、顧客の最善の利益を勘案したものとして、顧客の意向との関係で合理的かつ一定の具体性を有する基準や理由等を説明できる限り、直ちに問題となるものではありません。\nその場合には、A商品を推奨する理由、A商品以外にも比較・選別対象となった保険契約がある旨及び顧客の求めに応じてそれらの概要又は契約内容を説明する旨を、分かりやすく説明する必要があります。\nなお、推奨商品群をあらかじめ固定的に設定し、それを顧客意向の把握・確認に代替させるような運用は適切ではありません。\n一方で、乗合代理店には、提示・推奨する基準や理由等を社内規則等に定め、当該枠組みに基づき、顧客の意向に沿って個別具体的に保険契約を選別し、提示・推奨する態勢を整備することが求められます。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["意向把握","顧客の最善の利益"]},{"no":429,"location":"Ⅱ－4－2－9(5)","comment":"監督指針Ⅱ－4－2－9(5)①B.(a)により、顧客の意向に基づいて選別した保険契約の数が多い場合(それ以上は顧客の意向に基づいて絞り込むことが難しく、あえて質問をして絞り込もうとすると誘導になりかねない場合)には、保険募集人や乗合代理店の都合によることなく、顧客が示252した意向との対応関係や顧客の最善利益を勘案し、推奨する保険契約を絞り込んだ上で、合理的かつ一定の具体性を有する基準や理由等を説明(補償内容などの商品特性等に関する説明)することができるという理解でよいか。","pageStart":252,"pageEnd":253,"answer":"推奨販売を行うに当たっては、まず、比較可能な同種の保険契約の範囲を判断できる程度に、顧客の意向を把握することが前提となります。\nその上で、顧客の意向に沿って選別してもなお複数の保険契約が残る場合には、顧客が重視すると考えられる事項を例示するなどして、可能な限り追加的に意向を把握することが重要です。\nその結果、なお複数の保険契約が残る場合には、顧客の意向との対応関係や顧客の最善の利益を勘案しつつ、保障(補償)内容等の商品特性や保険料水準等に基づき、合理的かつ一定の具体性を有する基準や理由等を説明した上で、特定の保険契約を提示・推奨することが考えられます。\nただし、この場合、推奨する特定の保険契約以外の保険契約もある旨及び顧客の求めに応じて、それらの保険契約の概要又は契約内容を説明する旨を説明する必要があります。\nまた、比較対象を狭める目的で顧客の意向を恣意的に誘導することや、手数料水準、販売目標、便宜供与等の代理店の都合により特定の保険契約へ誘導することは適切ではありません。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["便宜供与","手数料・インセンティブ","顧客の最善の利益"]},{"no":430,"location":"Ⅱ－4－2－9(5)","comment":"顧客から保険料水準を重視する意向が示された場合、乗合代理店が各社の保険料水準を顧客に示すに当たっては、特定の保険会社に恣意的な誘導をすることがないように、算出の前提となる補償内容(特約等の内容を含む)は同等の内容である必要があるものと考えるがどうか。","pageStart":253,"pageEnd":253,"answer":"顧客が保険料水準を重視する意向を示している場合、保障(補償)内容、特約、保険金額、免責金額、保険期間、対象リスク等の前提条件を可能な限り同一又は近似の条件にすることが望ましいと考えられます。\nまた、保険料に関する比較表示を行う場合は、Ⅱ－4－2－2(9)\n④の趣旨に照らして、契約条件や保障(補償)内容の概要等、保険料に影響を与えるような前提条件について、顧客に適切に示す必要があり、かつ、前提条件や補償内容の差異により保険料が異なる場合がある旨、顧客に予め説明することが重要です。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":[]},{"no":431,"location":"Ⅱ－4－2－9(5)","comment":"推奨販売における情報提供義務において、「推奨」の意味する所を確認をしたい。例えば、AからJ社まで計10社の比較可能な同種の保険契約を取り扱っている乗合代理店の保険募集人が、顧客の意向(例：がんの自由診療にも備え253られるがん保険)に沿って、10社のうち、がん自由診療特約を付帯できるAからC社に絞って顧客に提案したとする。\nこの時、顧客から「このAからC社の中でおすすめはどの会社か」と聞かれた保険募集人が、比較販売における情報提供義務を履行した上で、「〇〇な理由から、A社がおすすめです」などと追加の説明を加えたとする。\n監督指針における「推奨」とは、上記例でいうAからJ社の中から、AからC社を提案するところまでを指しているという理解か。それとも、提示・推奨したAからC社の中から、A社を勧める説明も、特定の保険会社を「推奨」した事になるのか。","pageStart":253,"pageEnd":254,"answer":"比較可能な同種の保険契約の中から、顧客の意向に沿って一又は二以上の保険契約を選別し、顧客に示す行為は「提示」に当たり得ます。\nまた、その中から、保険募集人が、当該顧客の意向を踏まえて、特定の保険契約を勧める場合には「推奨」に当たります。\nA社を推奨する基準や理由について、顧客の意向との関係で、合理的かつ一定の具体性を有する説明を行う必要があります。また、A社以外にも比較・選別対象となったB社・C社がある旨及び顧客の求めに応じて、それらの概要又は契約内容を説明する旨を説明する必要があります。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":[]},{"no":432,"location":"Ⅱ－4－2－9(5)","comment":"顧客が複数の意向(低廉な保険料水準、幅広い補償範囲、優れたアフターフォロー体制等)を示した場合、当該複数の意向の中で顧客が最も優先する意向に基づいて保険契約を選別し推奨することも認められるとの理解でよいか。","pageStart":254,"pageEnd":254,"answer":"顧客が複数の意向を示した場合には、顧客が特に重視する事項や優先順位を確認した上で、当該意向に沿って保険契約を選別し、提示・推奨することは考えられますが、顧客の優先順位を確認する過程で、特定の保険契約へ誘導するよう恣意的に意向を形成又は解釈することは適切ではありません。\n特定の保険契約を選別し、提示・推奨するに当たっては、顧客が重視する事項を踏まえつつ、推奨する保険契約が、当該事項にどのように対応しているかという観点から、保障(補償)内容等の商品特性や保険料水準等等に基づいて主たる基準や理由等を説明することが基本となります。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":[]},{"no":433,"location":"Ⅱ－4－2－9(5)","comment":"例えば、履行保証保険は必然的に保険契約の申込みから発注者が定める保険証券提出の期限までの期間が短いことに留意して保険募集を行う必要がある。\n乗合代理店において、当該顧客に対する履行保証保険の254与信枠が既に設定されている保険会社と未設定の保険会社がある場合、前述の点に留意して、与信枠が既に設定されている保険会社を選定・推奨することは顧客の意向に沿った保険会社・商品の選定・推奨に当たるとの理解でよいか。","pageStart":254,"pageEnd":255,"answer":"顧客の具体的な意向の内容によるため、個別具体的に判断されるべきであり、一律の見解を示すことは困難です。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":[]},{"no":434,"location":"Ⅱ－4－2－9(5)","comment":"今回の改正案では、「特定の保険契約を推奨する場合には、合理的かつ一定の具体性を有する基準や理由を説明する」ことが求められるが、システムにより特定の保険契約・保険会社を絞り込み、推奨した場合でも、保険募集人による「合理的かつ一定の具体性を有する基準や理由」の説明が必要との理解でよいか。\n例えば、顧客への説明について、「当社システムによりA保険会社の保険が推奨商品となりました」と説明するだけでは不十分であり、「システムが、どのような基準や理由でその保険会社・保険契約を推奨したのか」を保険募集人が説明する必要があると考える。","pageStart":255,"pageEnd":255,"answer":"システムの内容や運用に応じ個別具体的に判断されるべき事項ですが、一般論として、システムにより特定の保険契約を選別し、提示・推奨する場合であっても、保険募集人は、当該提示・推奨について「合理的かつ一定の具体性を有する基準や理由」の説明を行う必要があります。\nまた、単に「システムにより推奨された」との説明では足りず、顧客の意向との対応関係を踏まえた提示・推奨の基準や理由などⅡ－4－2－9(5)に照らして適切に説明することが必要です。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["システム・比較ツール"]},{"no":435,"location":"Ⅱ－4－2－9(5)","comment":"代理店が定める客観的基準において、例えば、「乗合代理店と保険会社との属人的な関係による事務連携のしやすさ」を「顧客への迅速な情報提供」という名目に書き換えるなど代理店都合の基準を顧客の最善の利益を勘案した基準・理由とみなして保険契約を推奨することは不適切と考えるがどうか。\n255","pageStart":255,"pageEnd":256,"answer":"ご理解のとおりです。\n推奨販売においては、顧客の意向に沿って、合理的かつ一定の具体性を有する基準や理由等に基づき、保険契約を提示・推奨する必要があります。\nしたがって、乗合代理店と保険会社との属人的な関係、事務連携のしやすさ、営業上の関係等の代理店の都合を、「顧客への迅速な情報提供」等と形式的に言い換え、顧客の最善の利益を勘案した理由であるかのように説明することは適切ではありません。\n一方で、商品特性や保険料水準といった事項を主たる提示・推奨理由として説明することを前提に、保険会社が提供する照会対応サービスや事故対応サービスを顧客が重視し、かつ、これらの事項が、顧客意向との関係で合理性・具体性を有し、顧客の比較判断に資する事項にあたる場合には、顧客の意向に沿った推奨理由の一要素となり得ます。その場合でも、代理店都合ではなく、顧客利益との関係で具体的に説明する必要があります。ただし、このような場合であっても、まずは商品特性や保険料水準にかかる顧客の意向を把握し、顧客との意向との関係で提示・推奨理由を説明することが重要です。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["顧客の最善の利益"]},{"no":436,"location":"Ⅱ－4－2－9(5)","comment":"監督指針II－4－2－9(5)①B.に記載されている「顧客の意向に沿って保険契約を選別する場合には、事前に商品特性や保険料水準などの顧客が重視する事項を丁寧かつ明確に確認する」を踏まえ、顧客の意向(保険加入の目的、保険種別、重要視する保障(補償)内容、特約、保険会社の特性、保険料など)を踏まえた上で、提示・推奨する保険契約を乗合代理店が選別し顧客に提示する。その後、選別した保険契約の中から、保険募集人や乗合代理店の都合ではない前提において、乗合代理店で特定の保険契約を推奨できるとの理解でよいか。\n256","pageStart":256,"pageEnd":257,"answer":"貴見のようなケースは、顧客の意向把握及び推奨販売の一例としてあり得るものと考えます。\n乗合代理店は、まず、顧客の意向を踏まえ、「二以上の比較可能な同種の保険契約」の中から、一又は二以上の保険契約を選別し、提示・推奨することができます。\nその上で、当該選別した保険契約の中から、商品特性等により特定の保険契約を推奨する場合には、顧客の最善の利益を勘案したものとして、乗合代理店の都合によることなく、合理的かつ一定の具体性を有する基準や理由等を説明する必要があります。\nしたがって、特定の保険契約を推奨すること自体は否定されませんが、当該推奨は、把握した顧客の意向に沿ったものである必要があり、手数料水準、販売目標、便宜供与等の代理店の都合による恣意的な選別・誘導とならないよう留意する必要があります。\nなお、主たる基準や理由等として、顧客の意向に沿う保障(補償)内容、特約等の商品特性や保険料水準といった商品に関する事項を説明する必要があります。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["便宜供与","手数料・インセンティブ","意向把握","顧客の最善の利益"]},{"no":437,"location":"Ⅱ－4－2－9(5)","comment":"・監督指針Ⅱ－4－2－9(5)①B.(b)(注3)\n「恣意的に特定の保険契約へ誘導することのないよう留意する」について確認したい。\n顧客の保険に関する知識が十分ではないケースにおいては、顧客の意向を明確にする観点から、募集に携わる役員・使用人が、顧客に必要と考えられる補償や事故受付や事故処理体制等のサービスについて、保険会社ごとの違いを理解し提案することも、保険募集人としての役割のひとつであると考える。\nただし、その提案は、顧客の最善の利益を勘案したものである必要があり、代理店の都合によって特定の保険会社に誘導するものであってはならないと理解している。\n例えば、以下のような提案は恣意的な誘導と捉えられ得ると考えるがどうか。\n・顧客の利益に資すると考えられる補償・サービス等に対応する商品が複数社に存在するにも関わらず、特定の保険会社の商品のみを提案すること。\n・類似の補償・サービスとのメリット・デメリットの説明をすることなく、特定の保険会社の商品のメリットや他の商品のデメリットのみを説明して提案すること。\n・(顧客の意向が示される前に、または複数の推奨項目として示すことではなく)自店の販売実績のみをもって提案すること。","pageStart":257,"pageEnd":257,"answer":"貴見のとおりです。\n顧客の意向を把握する過程においては、顧客が自らのリスクや保険ニーズを適切に認識し意向を表明できるよう、商品特性等といった保険商品に直接関係する事項を確認した上で、意向把握のために確認する事項が、他の商品選択肢を不当に排除しない合理的かつ一定の具体性を有するものとなっているか留意する必要があります。\nなお、顧客意向との関係を確認せず、例えば、顧客の意向に合致し得る保険契約が複数存在するにもかかわらず特定の保険契約のみを提案すること、特定の保険契約のメリット又はデメリットのみを片面的に説明することや自店の販売実績のみを理由に提案することは、恣意的な誘導と評価され得ます。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["意向把握","顧客の最善の利益"]},{"no":438,"location":"Ⅱ－4－2－9(5)","comment":"顧客の意向に沿って選別した保険契約の中から、顧客の257最善の利益を勘案したものとして、保険募集人や代理店の都合によることなく、合理的かつ一定の具体性を有する基準や理由を説明して特定の保険会社を推奨した場合においても、推奨する特定の保険契約以外の保険契約がある旨を説明し、概要及び契約内容を説明する必要があるか。","pageStart":257,"pageEnd":258,"answer":"貴見において想定されている場面が必ずしも明確ではありませんが、Ⅱ－4－2－9(5)①B.(a)に基づき、合理的かつ一定の具体性を有する基準や理由等を説明し、特定の保険会社を推奨した場合においても、推奨する特定の保険契約以外の保険契約がある旨を説明し、顧客の求めに応じて、それらの概要又は契約内容を説明する旨を説明する必要があります。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":[]},{"no":439,"location":"Ⅱ－4－2－9(5)","comment":"「特定の保険契約を推奨する場合には、顧客の最善の利益を勘案したものとして、保険募集人や乗合代理店の都合によることなく、合理的かつ一定の具体性を有する基準や理由等を説明しているか」という点について、合理性・具体性が、どの時点でどのような記録や説明内容であれば充足していると判断されるのか明確にしていただきたい。また、基準について、法人保険と個人保険で異なる場合には、その点もお示しいただきたい。","pageStart":258,"pageEnd":258,"answer":"合理的かつ一定の具体性を有する基準や理由等の内容、説明時点及び記録方法については、一概にお示しすることは困難です。\nなお、一般論としては、特定の保険契約を提示・推奨する場合には、具体的な顧客の意向を把握する必要があります。その上で、提示・推奨理由として、保障(補償)内容、保障(補償)期間、特約等の商品特性や保険料水準を踏まえた合理的かつ具体的な説明であり、顧客の比較判断に資する客観的事項である必要があります。これら推奨基準や理由は、顧客の属性のみによって一律に定めるのではなく、顧客の具体的な意向を踏まえる必要があります。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["顧客の最善の利益","証跡・記録"]},{"no":440,"location":"Ⅱ－4－2－9(5)","comment":"監督指針II－4－2－9(5)①B.(a)第1段落の保険契約の選別は、保険募集人が募集時に確認された個々の顧客の意向に沿って行うことになると理解しているが、その際、仮に全く同じ意向の顧客がいたとすれば、乗合代理店として全く同じ保険契約が選別されなければならないという理解になるのか。\nまた、同B.(a)第1段落の保険契約の選別後に第2段落の特定の保険契約の推奨を行う際の「合理的かつ一定の具体性を有する基準や理由等」とは、乗合代理店として統一された基準や理由等を社内規則等に定めなければならない258という理解になるのか。なお、当該基準や理由等を公表する必要はないという理解でよいか。","pageStart":258,"pageEnd":259,"answer":"顧客の意向に沿った保険契約の選別にあたっては、個々の保険募集人が把握した顧客の具体的な意向を踏まえ、合理的かつ一定の具体性を有する基準や理由等に基づき特定の保険契約を提示・推奨した結果、保険募集人ごとに異なる保険契約を提示・推奨すること自体は、同じ意向であっても顧客によってリスク許容度、顧客属性等が異なるため、直ちに不適切とされるものではありません。\nもっとも、属人的・恣意的判断により保険募集人ごとに異なる保険契約を提示・推奨することは適切ではありません。\n特定の保険契約を推奨する基準や理由等についての社内規則等は、乗合代理店自身の規模や業務特性を踏まえつつ、保険募集人ごとに恣意的な運用とならないよう、例えば、顧客意向の把握方法、顧客が重視する事項の確認方法、提示・推奨する基準や理由、顧客への説明方法、記録・検証方法などを組織的に適切に定めたうえで、各店舗又は各保険募集人に対し教育・管理・指導を徹底することが重要であると考えます。\n当該社内規則等の公表は法令上義務付けられていませんが、顧客に対しては、把握した意向と提示・推奨する保険契約との対応関係など、Ⅱ－4－2－9(5)①B.において求められた事項を分かりやすく説明する必要があります。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["証跡・記録"]},{"no":441,"location":"Ⅱ－4－2－9(5)","comment":"意向把握をしたうえで、顧客から保険料水準を重視する意向が示された場合、一般的な消費者が求めるであろう補償内容を基準として、同等の補償内容で複数保険会社の保険料をあらかじめ比較し、その算出結果を根拠に顧客へ推奨販売をすることが許容されるという理解でよいか。なお、当該対応が許容される場合であっても、各保険会社の保険料改定等が発生した際には、その都度保険料の比較を行う必要があるとの理解でよいか。\n259","pageStart":259,"pageEnd":260,"answer":"顧客が保険料水準を重視する意向を示している場合、保障(補償)内容、特約、保険金額、免責金額、保険期間、対象リスク等の前提条件を可能な限り同一又は近似の条件にした上で、複数保険会社の保険料を比較し、その結果を提示・推奨理由の一つとすることは考えられます。その際は、比較説明及び推奨販売にあたりうることから、Ⅱ－4－2－9(5)①A.及びB.に照らして、適切に顧客に説明する必要があります。\nただし、保険料の比較に当たり、「一般的な消費者が求める補償内容」を用いる場合であっても、当該内容が当該顧客の意向に沿うものであるかを確認する必要があります。また、各社の商品内容、保険料水準、引受条件等に改定があった場合には、当該比較結果が最新の内容を反映したものとなるよう適切に更新・管理する必要があります。\nなお、貴見のようなケースにおいては、Ⅱ－4－2－2(9)④の趣旨に照らして、前提条件や保障(補償)内容の差異により実際の保険料水準が異なる場合がある旨、顧客に予め説明することが重要と考えられます。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["比較推奨","意向把握","更改・継続"]},{"no":442,"location":"Ⅱ－4－2－9(5)","comment":"保険業法施行規則第227条の2第3項第4号ロでは、顧客の意向に沿って保険契約を選別する場合には「事前に商品特性や保険料水準などの顧客が重視する事項を丁寧かつ明確に確認する」となっている。\nダイレクト損保のように保険料水準に明らかな商品特性がある場合を除き、その他の損害保険会社の商品内容は顧客に明確な違い(特性事項)を認識させることが困難な内容である。\n今般の改正において示す「事前に商品特性や保険料水準などの顧客が重視する事項」のうち、「商品特性」とは主に何を指すと想定されているのか。\nまた、例えば、保険本体では無い「付帯サービス(ブランド保険補償内容)」は「商品特性」に該当するのか。","pageStart":260,"pageEnd":260,"answer":"「商品特性」とは、保険の種別、保障(補償)内容、特約、免責、保険期間等、当該保険契約の内容・条件に関する特徴を指します。\n付帯サービスについては、保険契約との関連性によって「商品特性」に当たるか否かにつき判断が異なるため、一概に回答することは困難です。\nなお、特定の保険契約を提示・推奨する際、主契約や保障(補償)\n内容との関連性、サービスの内容・利用条件等を踏まえ、顧客の適切な商品選択の機会に影響を与える場合には、顧客の意向を踏まえ、その内容を顧客に誤認なく説明し、手数料水準、販売目標、便宜供与等の代理店の都合による特定の保険契約への誘導とならないよう留意する必要があります。\nまた、商品間の差異が小さい場合であっても、全ての案件において、全保険契約について網羅的・画一的な比較説明を一律に求めるものではなく、顧客が重視する事項に即して、必要な範囲で分かりやすく説明することが重要です。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["便宜供与","手数料・インセンティブ","比較推奨"]},{"no":443,"location":"－","comment":"商品特性に有意な差が認められない複数の保険契約を取り扱っている場合でも、いきなり監督指針Ⅱ－4－2－9(5)①B.(a)後段に定める「特定の保険契約を推奨する」ことはできず、同B.(a)前段に定める顧客の意向に沿った保険契約の選別を行う必要があると理解しているが、商品特性以外の顧客の意向を確認することにより保険契約の選別を行うことは許容されるという理解でよいか。\nまた、商品特性に有意な差が認められない場合に、商品260特性以外の顧客の意向を確認せず、監督指針Ⅱ－4－2－9(5)①A.に定める比較説明を行うことも考えられるという理解でよいか。","pageStart":260,"pageEnd":261,"answer":"顧客の意向に沿った保険契約を選別するに当たっては、商品特性以外の顧客の意向を確認することは一概に否定されませんが、結果的に保険募集人による恣意的な特定の保険契約の選別とならないよう留意する必要があります。\nⅡ－4－2－2(3)に照らして適切に意向把握・確認義務を果たした上で比較説明を行うことは否定されませんが、比較説明の際にはⅡ－4－2－9(5)①A.及びⅡ－4－2－2(9)②を遵守する必要があること、また、例えば、比較対象となる保険契約をあらかじめ限定することは、結果として顧客の意向に沿わない保険契約の選別に該当し得ることに留意が必要です。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["比較推奨","意向把握"]},{"no":444,"location":"Ⅱ－4－2－9(5)","comment":"顧客の最善の利益とは、保険事故が発生した際に速やかに保険金を受け取れることだと認識しているが、保険金支払実績や請求実務に精通しているという事実は「商品特性等」に含まれるのか。","pageStart":261,"pageEnd":261,"answer":"商品特性等により特定の保険契約を推奨する場合における「商品特性等」とは、例えば、商品特性や保険料水準など客観的なものを指し、請求実務に精通しているといった乗合代理店による主観的又は属人的な理由は該当しないと考えられます。\nなお、ご意見を踏まえ、Ⅱ－4－2－9(5)①B「商品特性や保険料水準など」及びⅡ－4－2－9(5)①B(a)\n「商品特性等」を修正いたしました。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["顧客の最善の利益"]},{"no":445,"location":"Ⅱ－4－2－9(5)","comment":"「商品特性等により、特定の保険契約を推奨する場合には、顧客の最善の利益を勘案したものとして、保険募集人や代理店の都合によることなく、合理的かつ一定の具体性を有する基準や理由等を説明」とあるが、商品特性等との記載に関して、商品特性以外の選定基準としてはどのようなケースを意図しているのか。商品特性によらずに特定の保険契約を推奨してもよいという反対解釈を招くおそれがあるため、趣旨を確認したい。","pageStart":261,"pageEnd":261,"answer":"商品特性等により特定の保険契約を推奨する場合における「商品特性等」とは、例えば、商品特性や保険料水準など客観的なものを指し、請求実務に精通しているといった乗合代理店による主観的又は属人的な理由は該当しないと考えられます。\nなお、ご意見を踏まえ、Ⅱ－4－2－9(5)①B「商品特性や保険料水準など」及びⅡ－4－2－9(5)①B(a)\n「商品特性等」を修正いたしました。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["顧客の最善の利益"]},{"no":446,"location":"－","comment":"顧客の意向を確認する前に、例えば、「意向把握に基づいた乗合保険会社の保険料比較」、「保険募集人個人または店舗単位における事故対応で推奨する保険会社」、「保険募集人個人または店舗単位における契約手続の顧客利便性の高い保険会社」等をあらかじめ顧客に明示しておくことは、保険業法施行規則第227条の2第3項第4号ロの運用として問題ないか確認したい。\n顧客に明確な意向がある場合でも、別の選択肢に気付きを与える可能性も考えられ、事前に明示してくことは有効であると考える。また、明確な意向がない顧客に対しても、261あらかじめ明示しておくことで、この意向を保険契約の選択肢として重視したいという気付きを与える可能性が考えられ、顧客本位の業務運営に資するものと考える。","pageStart":261,"pageEnd":262,"answer":"乗合代理店が比較推奨販売を行うに当たっては、まず、顧客の意向を適切に把握することが前提となるため、貴見のような保険募集人個人又は店舗単位で「事故対応で推奨する保険会社」、「手続利便性が高い保険会社」等として、あらかじめ特定の保険会社を明示することは、顧客意向に基づく選別とはいえず、実質的に保険業法施行規則第227条の2第3項第4号ハと同様の運用となり得るため適切ではありません。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["比較推奨","ハ方式","意向把握"]},{"no":447,"location":"Ⅱ－4－2－9(5)","comment":"「売れ筋で上位の保険を勧めてほしい」等の顧客意向を確認した場合、客観的な情報を用いて推奨することは許容されるという理解でよいか。また、客観的な情報について、例えば、外部評価機関による評価や一般的に書店等で販売されている雑誌に掲載されている等適切な手法によって集計されたランキングは客観的といえるか。","pageStart":262,"pageEnd":262,"answer":"提示・推奨する基準や理由等が、顧客の最善の利益に照らし、合理的かつ一定の具体性を有するか否かについては、顧客の意向や商品特性等を踏まえ、個別具体的に判断されます。\n他方、保険業法施行規則第227条の2第3項第4号ハの廃止の趣旨は、便宜供与等により代理店の利益のみを優先して特定の保険契約の推奨が行われ、顧客の適切な商品選択の機会が阻害されないよう求める点にあり、手数料水準、販売目標、保険会社からの便宜供与、資本・取引関係、特定の保険会社の事務に精通していることなど代理店側の都合や、募集人の主観的又は属人的判断に基づく事項を基準や理由等とすることは、不適切な提示・推奨に該当し得るため適切でないと考えます。\n比較推奨販売を行うに当たっては、顧客が自らの抱えるリスクや保険ニーズに合致した保険商品であるかを十分に確認できるよう、保険募集人が保険商品に係る事項について顧客の意向を丁寧に把握することが前提であると考えます。こうした点を踏まえると、顧客の意向に沿って特定の保険商品を提示・推奨する際には、主たる基準や理由等として、顧客の意向に沿う保障(補償)内容等の商品特性や保険料水準といった保険商品に直接関係する事項を説明する必要があります。\nまた、顧客が「売れ筋」、「ランキング上位」、「当該代理店における販売量の多さ」等の商品特性と直結しない事項についても重視する場合には、保険商品に直接関係する事項とあわせて、","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["便宜供与","手数料・インセンティブ","比較推奨","ハ方式","顧客の最善の利益"]},{"no":448,"location":"Ⅱ－4－2－9(5)","comment":"今般の監督指針改正の趣旨を踏まえると、「人気ランキング」、「資料請求件数ランキング」、「当該代理店における販売量の多さ」等について、顧客から説明を求められた際に、ランキング等として「提示」することはともかく、「推奨理由・基準」とすることに関しては、当該商品の手数料の多寡や便宜供与の影響の結果としてランキングされている可能性も完全には払拭できないことから、推奨理由としては不適切である(顧客の最善の利益を勘案していない)とも考えられるがどうか。","pageStart":262,"pageEnd":262,"answer":"提示・推奨する基準や理由等が、顧客の最善の利益に照らし、合理的かつ一定の具体性を有するか否かについては、顧客の意向や商品特性等を踏まえ、個別具体的に判断されます。\n他方、保険業法施行規則第227条の2第3項第4号ハの廃止の趣旨は、便宜供与等により代理店の利益のみを優先して特定の保険契約の推奨が行われ、顧客の適切な商品選択の機会が阻害されないよう求める点にあり、手数料水準、販売目標、保険会社からの便宜供与、資本・取引関係、特定の保険会社の事務に精通していることなど代理店側の都合や、募集人の主観的又は属人的判断に基づく事項を基準や理由等とすることは、不適切な提示・推奨に該当し得るため適切でないと考えます。\n比較推奨販売を行うに当たっては、顧客が自らの抱えるリスクや保険ニーズに合致した保険商品であるかを十分に確認できるよう、保険募集人が保険商品に係る事項について顧客の意向を丁寧に把握することが前提であると考えます。こうした点を踏まえると、顧客の意向に沿って特定の保険商品を提示・推奨する際には、主たる基準や理由等として、顧客の意向に沿う保障(補償)内容等の商品特性や保険料水準といった保険商品に直接関係する事項を説明する必要があります。\nまた、顧客が「売れ筋」、「ランキング上位」、「当該代理店における販売量の多さ」等の商品特性と直結しない事項についても重視する場合には、保険商品に直接関係する事項とあわせて、","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["便宜供与","手数料・インセンティブ","比較推奨","ハ方式","顧客の最善の利益"]},{"no":449,"location":"Ⅱ－4－2－9(5)","comment":"乗合代理店によるインターネットでの募集について、当該代理店が過去から保険業法施行規則第227条の2第3項第4号ハを採用せず顧客の意向のみによる保険契約の選別によって募集していた場合には、その結果を適切に集計したデータに基づく限り、当該代理店においてインターネットでの売上ランキングを表示することは、改正後の比較推奨販売規制に違反するものではないという理解でよいか。\n262","pageStart":262,"pageEnd":262,"answer":"提示・推奨する基準や理由等が、顧客の最善の利益に照らし、合理的かつ一定の具体性を有するか否かについては、顧客の意向や商品特性等を踏まえ、個別具体的に判断されます。\n他方、保険業法施行規則第227条の2第3項第4号ハの廃止の趣旨は、便宜供与等により代理店の利益のみを優先して特定の保険契約の推奨が行われ、顧客の適切な商品選択の機会が阻害されないよう求める点にあり、手数料水準、販売目標、保険会社からの便宜供与、資本・取引関係、特定の保険会社の事務に精通していることなど代理店側の都合や、募集人の主観的又は属人的判断に基づく事項を基準や理由等とすることは、不適切な提示・推奨に該当し得るため適切でないと考えます。\n比較推奨販売を行うに当たっては、顧客が自らの抱えるリスクや保険ニーズに合致した保険商品であるかを十分に確認できるよう、保険募集人が保険商品に係る事項について顧客の意向を丁寧に把握することが前提であると考えます。こうした点を踏まえると、顧客の意向に沿って特定の保険商品を提示・推奨する際には、主たる基準や理由等として、顧客の意向に沿う保障(補償)内容等の商品特性や保険料水準といった保険商品に直接関係する事項を説明する必要があります。\nまた、顧客が「売れ筋」、「ランキング上位」、「当該代理店における販売量の多さ」等の商品特性と直結しない事項についても重視する場合には、保険商品に直接関係する事項とあわせて、","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["便宜供与","手数料・インセンティブ","比較推奨","ハ方式","顧客の最善の利益"]},{"no":450,"location":"Ⅱ－4－2－9(5)","comment":"顧客の意向に沿った商品が複数ある場合において、商品特性等により特定の保険契約を推奨する際は合理的かつ一定の具体性を有する基準や理由の説明が必要となる。また、取扱高が多いと安心できるという理由で、保険会社との取引状況を重視する顧客も一定数いると考えられることから、例示の一つとして、代理店内の過去の保険会社ごとの販売実績のランキングを提示することは、ランキング作成のためのデータの集計方法等が合理的、客観的である限り、「合理的かつ一定の具体性を有する基準や理由」として認められるという理解でよいか。","pageStart":263,"pageEnd":263,"answer":"提示・推奨理由とすることは否定されませんが、これらの事項は顧客意向との関係で合理性・具体性を有し、顧客の比較判断に資する客観的事項である必要があります。いずれにせよ、これらの事項は商品特性と直結せず、恣意的な推奨につながるおそれがある点に留意が必要です。\n加えて、提示・推奨の基準や理由等に係る数値・資料の根拠について、例えば、同号ハに基づいて乗合代理店の店舗ごとに異なる保険会社の保険契約を取り扱っていたことを前提として、特定の保険契約を推奨するような資料等に基づく場合など、結果として、恣意的な選別とならないよう、収集期間、対象、件数、集計・評価方法等を明らかにするなど、合理性を適切に判断すべきです。\nなお、外部評価機関による資料を用いるなど、乗合代理店において、当該資料の合理性や具体性を検証することが困難であるおそれが高い場合、調査主体、調査対象、調査時期、評価項目、サンプル数、集計方法等により結果が異なり得るため、当該資料の性質や限界を踏まえ、顧客に誤認を与えないようこれらについて説明する必要があります。\nまた、比較推奨の情報提供のみで適切な選択に至らない場合は、無理に特定の保険契約へ絞らず、比較説明や複数提示、追加の意向確認等により、顧客の適切な商品選択の機会を確保することが求められます。\nなお、インターネット募集において売上ランキング等を表示する場合であっても、表示内容、画面導線、集計ロジック等によっては恣意的な特定の保険契約の推奨に該当し得るため、個別具体的に判断されるべき事項ですが、例えば、一般的に顧客が重視するであろう項目ごとに保険契約を掲載する場合には、特定の保険契約の提示・推奨に該当し得るため、当該保険契約の概要及び提示・推奨する基準や理由等を、顧客に分かりやすく説明する必要があります。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["比較推奨","意向把握"]},{"no":451,"location":"Ⅱ－4－2－9(5)","comment":"アフターサービス等の顧客満足度は算定する外部会社(オリコン等)によってランキングが異なるため、1社が必ず1位というわけではない。客観的評価を基にする場合、どのような尺度で評価すればよいのか。","pageStart":263,"pageEnd":263,"answer":"提示・推奨理由とすることは否定されませんが、これらの事項は顧客意向との関係で合理性・具体性を有し、顧客の比較判断に資する客観的事項である必要があります。いずれにせよ、これらの事項は商品特性と直結せず、恣意的な推奨につながるおそれがある点に留意が必要です。\n加えて、提示・推奨の基準や理由等に係る数値・資料の根拠について、例えば、同号ハに基づいて乗合代理店の店舗ごとに異なる保険会社の保険契約を取り扱っていたことを前提として、特定の保険契約を推奨するような資料等に基づく場合など、結果として、恣意的な選別とならないよう、収集期間、対象、件数、集計・評価方法等を明らかにするなど、合理性を適切に判断すべきです。\nなお、外部評価機関による資料を用いるなど、乗合代理店において、当該資料の合理性や具体性を検証することが困難であるおそれが高い場合、調査主体、調査対象、調査時期、評価項目、サンプル数、集計方法等により結果が異なり得るため、当該資料の性質や限界を踏まえ、顧客に誤認を与えないようこれらについて説明する必要があります。\nまた、比較推奨の情報提供のみで適切な選択に至らない場合は、無理に特定の保険契約へ絞らず、比較説明や複数提示、追加の意向確認等により、顧客の適切な商品選択の機会を確保することが求められます。\nなお、インターネット募集において売上ランキング等を表示する場合であっても、表示内容、画面導線、集計ロジック等によっては恣意的な特定の保険契約の推奨に該当し得るため、個別具体的に判断されるべき事項ですが、例えば、一般的に顧客が重視するであろう項目ごとに保険契約を掲載する場合には、特定の保険契約の提示・推奨に該当し得るため、当該保険契約の概要及び提示・推奨する基準や理由等を、顧客に分かりやすく説明する必要があります。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["比較推奨","意向把握"]},{"no":452,"location":"Ⅱ－4－2－9(5)","comment":"推奨販売を行うにあたり、顧客ニーズをできる限り引き出すことの重要性が謳われていると認識している。\n以下の考え方について相違ないか確認したい。\n・売れ筋商品や販売ランキング上位、といったニーズも、明確に顧客がそれを望んでいるなら、一切否定されるものではない。\n・しかし、その時点の販売状況が、そもそも歪められたもの(保険業法施行規則第227条の2第3項第4号ハで販売されてきた等)であるなど、潜脱的に対応されることは認められない。\n・また、真に顧客が望んだのか(過剰に誘導したもので263はない等)を事後的に検証できるよう、実態として乗合代理店が推奨商品をあらかじめ用意していないこと(例：売れ筋商品に誘導する話法が存在しないこと)や、募集記録(応対記録)の詳細化など、乗合代理店には取組が求められ、保険会社にもその推進が求められる。","pageStart":263,"pageEnd":264,"answer":"提示・推奨理由とすることは否定されませんが、これらの事項は顧客意向との関係で合理性・具体性を有し、顧客の比較判断に資する客観的事項である必要があります。いずれにせよ、これらの事項は商品特性と直結せず、恣意的な推奨につながるおそれがある点に留意が必要です。\n加えて、提示・推奨の基準や理由等に係る数値・資料の根拠について、例えば、同号ハに基づいて乗合代理店の店舗ごとに異なる保険会社の保険契約を取り扱っていたことを前提として、特定の保険契約を推奨するような資料等に基づく場合など、結果として、恣意的な選別とならないよう、収集期間、対象、件数、集計・評価方法等を明らかにするなど、合理性を適切に判断すべきです。\nなお、外部評価機関による資料を用いるなど、乗合代理店において、当該資料の合理性や具体性を検証することが困難であるおそれが高い場合、調査主体、調査対象、調査時期、評価項目、サンプル数、集計方法等により結果が異なり得るため、当該資料の性質や限界を踏まえ、顧客に誤認を与えないようこれらについて説明する必要があります。\nまた、比較推奨の情報提供のみで適切な選択に至らない場合は、無理に特定の保険契約へ絞らず、比較説明や複数提示、追加の意向確認等により、顧客の適切な商品選択の機会を確保することが求められます。\nなお、インターネット募集において売上ランキング等を表示する場合であっても、表示内容、画面導線、集計ロジック等によっては恣意的な特定の保険契約の推奨に該当し得るため、個別具体的に判断されるべき事項ですが、例えば、一般的に顧客が重視するであろう項目ごとに保険契約を掲載する場合には、特定の保険契約の提示・推奨に該当し得るため、当該保険契約の概要及び提示・推奨する基準や理由等を、顧客に分かりやすく説明する必要があります。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["比較推奨","ハ方式","意向把握","証跡・記録"]},{"no":453,"location":"Ⅱ－4－2－9(5)","comment":"顧客の意向に沿って保険契約を選別して推奨する場合、合理的かつ一定の具体性を有する基準や理由等を説明するとあるが、乗合代理店が保険会社ごとに保険契約及びサービスを提供する体制(事故対応、引受能力、商品開発力、専門性、財務状況など定量、定性の両面)について客観的な基準を設けて具体的事実や事象に基づき総合的な評価を行い、その評価に基づき推奨方針を策定するとともに顧客に対して推奨方針の内容及び推奨方針の策定プロセスを説明することで推奨理由の説明とすることも可能との理解でよいか。","pageStart":264,"pageEnd":264,"answer":"比較推奨販売を行うにあたっては、顧客の意向を適切に把握することが大前提となります。\nその上で、特定の保険契約を提示・推奨する基準や理由等については、実際に把握した顧客の意向に沿った保険契約の絞り込みと対応関係にある理由を説明する必要があります。\nしたがって、あらかじめ乗合代理店が保険会社ごとに策定した一般的な推奨方針や、その策定プロセス自体を説明することのみをもって、合理的かつ一定の具体性を有する基準や理由等の説明に代えることはできません。\nなお、乗合代理店が所属保険会社等ごとの保険契約やサービス提供体制について、客観的な評価項目に基づき整理・分析すること自体を妨げるものではありませんが、特定の保険会社の保険契約の恣意的な提示・推奨とならないよう当該評価項目の内容等については、慎重に検討・判断する必要があります。\nまた、当該評価は、あくまで個別の顧客の意向との関係において、Ⅱ－4－2－9(5)①B.の内容・趣旨に照らし、具体的に説明される必要があることに留意が必要です。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["比較推奨"]},{"no":454,"location":"Ⅱ－4－2－9(5)","comment":"顧客の意向把握にあたり、保険業法施行規則第227条の2第3項第4号ロ(以下、ロ方式とする。)を原則として比較推264奨販売に関する方針を策定し、顧客が重視する事項をアンケート形式により把握した上で、特定の保険会社又は特定の保険契約を選別することを検討している。\nアンケートの設問例としては、日本損害保険協会が実施したものを参考に「商品特性」、「アフターフォロー体制」、「保険料水準」、「保険会社の社会貢献活動やブランドイメージ」等を想定しているが、いずれの項目も差異が生じにくいものが多く、顧客によっては全て重視するとの回答も想定される。そのような場合、同規則上では、より丁寧な意向把握や意向形成が求められているが、結果として選別に至らない可能性もあると考える。\nこのような場合、ロ方式による選別が困難となった時点で保険業法施行規則第227条の2第3項第4号イ(以下、イ方式とする。)に切り替えて提案するべきか、あるいは、あらかじめ販売方針としてロ方式により選定・絞り込みに至らなかった場合には、イ方式による提案に切り替える旨まで販売方針として定めるべきか見解を伺いたい。","pageStart":264,"pageEnd":265,"answer":"Ⅱ－4－2－9(5)①A.に定める比較説明(保険業法施行規則第227条の2第3項第4号イ)又は推奨販売(同号ロ)のいずれを採用するか、又は、両者をどのように組み合わせて用いるかについては、各社において、取扱商品や募集形態、顧客属性等を踏まえつつ、顧客の最善の利益の確保の観点から適切に判断される事項であると考えられます。\nなお、主たる基準や理由等として、顧客の意向に沿う保障(補償)内容、特約等の商品特性や保険料水準といった保険商品に関する事項をまず説明する必要があります。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["比較推奨","意向把握","顧客の最善の利益"]},{"no":455,"location":"Ⅱ－4－2－9(5)","comment":"監督指針Ⅱ－4－2－9(5)①B.(a)「乗合代理店が二以上の比較可能な同種の保険契約の中から」と記載されているが、顧客は万が一に生じた事故に備えて保険に加入されていることを踏まえると、「二以上の比較可能な同種の保険契約」は単なる保険契約の比較だけではなく、その先にある事故対応、アフターフォローを含めると解釈してよいか。\nまた、保険会社ごとに商品や特約、約款構成なども異な265っているが、比較可能な同種の保険契約とは、補償だけではなく事故対応等を含むなど、どこまでの範囲をもって同種と解釈すればよいのか伺いたい。","pageStart":265,"pageEnd":266,"answer":"「二以上の比較可能な同種の保険契約」の考え方については、「「平成26年改正保険業法(2年以内施行)に係る政府令・監督指針案」に対するパブリックコメント結果等について」における「コメントの概要及びコメントに対する金融庁の考え方」のとおり、主契約程度の意向の共通性も手がかりとしつつ、顧客の具体的な意向、対象リスク、保険給付・補償内容、保険契約の特性・類型等を踏まえつつ、個別具体的かつ実質的に判断されるものと考えます。\nまた、事故対応やアフターフォローについては、一般に、対象リスクや保険給付・保障(補償)内容とは性質を異にするため、「同種」該当性を判断する際の主たる要素となるものではないと考えられます。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":[]},{"no":456,"location":"－","comment":"顧客に対してアプローチする際、電話オペレーター等が意向把握を行い、保険募集人へ伝達した場合、改めて顧客から意向把握を行う必要はあるのか","pageStart":266,"pageEnd":266,"answer":"電話オペレーター等が顧客の意向把握を行う場合であって、その行為が保険募集に該当する場合には、保険業法に基づき、当該オペレーターは保険募集を行うことができる保険募集人である必要があります。\nその上で、ご意見にあるケースについては、個別具体的に判断すべき事項であり一概に回答することが困難ですが、一般論としては、特定の保険募集人が当初の意向を把握している場合であっても、顧客の意向が変遷する可能性があるため、他の保険募集人においても顧客の意向を適切に把握する必要があります。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["意向把握"]},{"no":457,"location":"Ⅱ－4－2－9(5)","comment":"乗合代理店において、特定の保険会社の保険契約について説明できる保険募集人をオペレーターとして配置するコールセンターを設ける場合がある。その際、特定の保険会社の保険契約の契約者(既契約者)ではなく未契約者を対象として当該コールセンターにおいて当該契約の募集を行う場合は、オペレーターが、顧客に対し、適切に権限明示を行うとともに、当該特定の保険会社の保険契約に関する説明を行う担当者である旨を説明した上で、顧客から当該説明を希望する旨の意向が確認できた場合には、当該特定の保険会社の保険契約の募集を行うことは許容されるという理解でよいか。\nなお、顧客から当該特定の保険会社以外の保険会社の保266険契約の説明を希望する旨の意向が確認できた場合は、かかる説明を行うことができる乗合代理店の保険募集人に連携して当該保険募集人が顧客対応を行うことを前提としている。","pageStart":266,"pageEnd":267,"answer":"貴見のケースにおける具体的な募集態様が必ずしも明らかではありませんが、特定の保険会社の商品説明のみを行う保険募集人が、顧客(未契約者)や既契約者に対して保険募集を行う場合、当該保険会社の保険契約へ誘導し、比較推奨販売規制の潜脱となるおそれがあります。そのため、当該特定の保険会社の保険契約に関する説明を行う担当者であったとしても、そのことのみをもって顧客の意向を判断することは適切ではなく、保険募集を行うに当たっては、保険業法第294条第3項に基づく権限明示を適切に行うとともに、意向把握・確認義務を適切に履行する必要があります。\n意向把握を行うに当たっては、顧客の保険商品に対する理解度合いにも留意しつつ、顧客が抱えるリスクを的確に把握し、顧客が複数の保険契約の中から自主的な判断により保険契約を選択できるよう、顧客の意向を丁寧かつ適切に把握するとともに、必要な情報提供が行われることが重要です。\nなお、一連の保険募集の過程において、当該保険契約の特定が保険募集人による選別・提案が実質的に伴わず、顧客の主体的な判断のみにより特定の保険契約が選択されているといえるかについては、個別具体的に判断される必要があります。\nまた、通常の意向把握プロセスを経る過程において、乗合代理店が他の保険契約との比較説明を行う場合には、同法施行規則第227条の2第3項第4号イに係る対応が求められるとともに、顧客の状況や意向の内容に照らし、他の保険契約についても検討の余地が認められる場合には、意向把握・確認義務や比較推奨販売に係る規制の趣旨・目的を踏まえた適切な対応が求められます。そうした募集過程において、顧客が他の保険契約の説明を希望した場合には、適時・適切に、対応可能な保険募集人に連携するなど、顧客の意向に応じた対応を行う必要があります。\nいずれにしても、乗合代理店においては、顧客の最善の利益を勘案する観点や、規制の趣旨・目的を十分に踏まえ、比較推奨販売に係る規制の潜脱とならないよう、乗合代理店自身の規模や業務特性に応じた実効的な対応を行う必要があります。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["比較推奨","意向把握","顧客の最善の利益"]},{"no":458,"location":"Ⅱ－4－2－9(5)","comment":"乗合代理店において、特定の保険会社の保険契約の取扱数が非常に多いなどの理由から、当該契約について説明できる保険募集人をオペレーターとして配置するコールセンターを設ける場合がある。その際、特定の保険会社の保険契約の契約者(既契約者)を対象として当該コールセンターにおいて当該契約の募集を行う場合は、オペレーターが、顧客に対し、適切に権限明示を行うとともに、当該特定の保険会社の保険契約に関する説明を行う担当者である旨を説明した上で、顧客から当該説明を希望する旨の意向が確認できた場合には、当該特定の保険会社の保険契約の募集を行うことは許容されるという理解でよいか。なお、顧客から当該特定の保険会社以外の保険会社の保険契約の説明を希望する旨の意向が確認できた場合は、かかる説明を行うことができる乗合代理店の保険募集人に連携して当該保険募集人が顧客対応を行うことを前提としている。","pageStart":267,"pageEnd":267,"answer":"貴見のケースにおける具体的な募集態様が必ずしも明らかではありませんが、特定の保険会社の商品説明のみを行う保険募集人が、顧客(未契約者)や既契約者に対して保険募集を行う場合、当該保険会社の保険契約へ誘導し、比較推奨販売規制の潜脱となるおそれがあります。そのため、当該特定の保険会社の保険契約に関する説明を行う担当者であったとしても、そのことのみをもって顧客の意向を判断することは適切ではなく、保険募集を行うに当たっては、保険業法第294条第3項に基づく権限明示を適切に行うとともに、意向把握・確認義務を適切に履行する必要があります。\n意向把握を行うに当たっては、顧客の保険商品に対する理解度合いにも留意しつつ、顧客が抱えるリスクを的確に把握し、顧客が複数の保険契約の中から自主的な判断により保険契約を選択できるよう、顧客の意向を丁寧かつ適切に把握するとともに、必要な情報提供が行われることが重要です。\nなお、一連の保険募集の過程において、当該保険契約の特定が保険募集人による選別・提案が実質的に伴わず、顧客の主体的な判断のみにより特定の保険契約が選択されているといえるかについては、個別具体的に判断される必要があります。\nまた、通常の意向把握プロセスを経る過程において、乗合代理店が他の保険契約との比較説明を行う場合には、同法施行規則第227条の2第3項第4号イに係る対応が求められるとともに、顧客の状況や意向の内容に照らし、他の保険契約についても検討の余地が認められる場合には、意向把握・確認義務や比較推奨販売に係る規制の趣旨・目的を踏まえた適切な対応が求められます。そうした募集過程において、顧客が他の保険契約の説明を希望した場合には、適時・適切に、対応可能な保険募集人に連携するなど、顧客の意向に応じた対応を行う必要があります。\nいずれにしても、乗合代理店においては、顧客の最善の利益を勘案する観点や、規制の趣旨・目的を十分に踏まえ、比較推奨販売に係る規制の潜脱とならないよう、乗合代理店自身の規模や業務特性に応じた実効的な対応を行う必要があります。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["比較推奨","意向把握","顧客の最善の利益"]},{"no":459,"location":"Ⅱ－4－2－9(5)","comment":"近年の環境意識やコンプラ意識の高まりの中、保険会社の地球環境問題への取組や行政処分歴等に関心のある顧客には、そうした情報(ホームページ等で公開されている情報など)を提供すべきものと考えるがそうした理解でよいか。\n267","pageStart":267,"pageEnd":268,"answer":"貴見のようなケースは具体的にどのような場面を想定しているか必ずしも明確ではありませんが、顧客が、保険会社の環境問題への取組み、法令等遵守態勢、行政処分歴等への関心を示した場合には、保険会社の公表資料、行政庁の公表情報等、正確性が確認できる情報を提供することは考えられます。\nただし、当該情報を提供する場合には、顧客に誤認を与えないよう、情報の基準時点、内容、対象範囲等を正確に説明する必要があるほか、関係法令及び監督指針を遵守する必要があります。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":[]},{"no":460,"location":"Ⅱ－4－2－9(5)","comment":"監督指針Ⅱ－4－2－9(5)①B.には、比較推奨販売を行うにあたり、乗合代理店が「顧客の意向に沿って保険契約を選別」する場合に遵守すべき点が詳述されており、顧客の意向を確認する方法については、監督指針Ⅱ－4－2－2(3)\n①及び②に記載されていると認識している。\n乗合代理店が第二分野の商品の募集を行うに当たって把握すべき最低限の顧客意向は、監督指針Ⅱ－4－2－2(3)\n①及び②に記載されている程度の内容で問題ないか。","pageStart":268,"pageEnd":268,"answer":"Ⅱ－4－2－2(3)①及び②は、顧客意向の把握・確認に関する基本的な考え方を示したものです。\nしたがって、第二分野の商品に係る意向把握・確認についても、同規定を踏まえて対応することとなりますが、当該規定のみをもって、全ての場合に一律に十分であるとする趣旨ではありません。\n特に、乗合代理店が比較推奨販売を行う場合には、顧客の意向に沿って保険契約を選別し、提示・推奨する必要があるため、商品特性、保険料水準等、顧客が重視する事項を、取扱商品や募集形態に応じて適切に把握・確認する必要があります。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["比較推奨","意向把握"]},{"no":461,"location":"Ⅱ－4－2－9(5)","comment":"損害保険における推奨方針の記載方法はどのように記載すればよいか。","pageStart":268,"pageEnd":268,"answer":"貴見における推奨方針が必ずしも明確ではございませんが、乗合代理店が、代理店独自の理由等のみにより、あらかじめ特定の保険会社又は特定の保険契約を推奨商品として選定・決定することは、顧客の意向に基づく選別とはいえず、適切ではありません。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":[]},{"no":462,"location":"－","comment":"顧客の意向把握のプロセスについて、下記1.から5.の流れで行うことが考えられる。\n1.当初意向の把握2.説明を受ける商品を絞り込むかの確認3.特に重視する意向の把握4.商品特性等により、代理店が特定の保険契約を推奨する場合の取扱い5.個別商品の説明・申込268上記3.について、保険募集人が、顧客が特に重視する意向を把握するに当たっては、例えば、以下のような項目が考えられる、という理解でよいか。\nまた、把握する意向としては、以下のような項目が考えられるが、各社の募集実態に沿って創意工夫のもと、把握する項目を設定することが重要と考えられる、という理解でよいか。\n(特に重視する意向)\n○保障内容・期間・万一の保障備える期間、受取方法、保険料の支払方法(一括or分割)、通貨、変額保険等・医療・介護・就業不能に備える保障備える目的、備える期間、受取方法、保険料の支払方法(一括or分割)、保障範囲、通貨、変額保険等・資産形成備える目的、備える期間、受取方法、保険料の支払方法(一括or分割)、通貨、変額保険等・保障内容と保険料のバランス・保険会社の付帯サービス・その他","pageStart":268,"pageEnd":269,"answer":"貴見のとおりです。\nなお、顧客が特に重視する意向を把握するにあたっては、意向把握の方法等が顧客の意向確認に先立って特定の保険会社又は特定の保険契約へ誘導するものとなる場合には、代理店都合による恣意的な選別と評価され得るため留意が必要です。\n各乗合代理店における取扱商品、募集形態、顧客属性、顧客の理解度等を踏まえつつも、保障内容といった商品特性等の保険商品に直接関係する事項を確認するとともに、合理的かつ一定の具体性を有する基準や理由等として説明可能であり、他の商品選択肢を不当に排除しないものを確認する必要があることに留意が必要です。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["意向把握"]},{"no":463,"location":"Ⅱ－4－2－9(5)","comment":"ヒアリングシートで顧客の意向を確認する際、加入目的・重視するポイントの選択肢に以下の事項を含めることは代理店都合により意図的に誘導しているとみなされる可能性はあるか。\n269・特定の保険会社や保険契約の情報(例：団体割引適用商品)\n・代理店の保有契約件数又は年間取扱契約件数上位○社の保険契約・生命保険契約について簡易告知対応可能な保険会社","pageStart":269,"pageEnd":270,"answer":"本件については、個別具体的に判断すべき事項であり一概に回答することは困難ですが、顧客の意向を適切に把握する観点から、ヒアリングシートに加入目的や重視事項の選択肢を設けること自体は否定されません。\nただし、顧客が重視する事項を確認するにあたり、その選択肢や表示方法等については、顧客の意向が重要であることを前提に、顧客が自らのリスクや保険ニーズを適切に認識し意向を表明できるよう設計される必要があり、保障(補償)内容等の商品特性や保険料水準等といった保険商品に直接関係する事項を含めることが適切と考えます。\n団体割引、簡易告知、取扱実績等を選択肢又は説明項目とする場合も、それらが合理的かつ一定の具体性を有する基準や理由等として説明可能であり、他の商品選択肢を不当に排除しない客観的な事項であることが必要です。\n特に、「保有契約件数」や「年間取扱件数上位」等は、例えば、保険業法施行規則第227条の2第3項第4号ハに基づいて乗合代理店の店舗ごとに異なる保険会社の保険契約を取り扱っていたことを前提として、特定の保険契約を推奨するような根拠等に基づく場合などには、結果として、恣意的な選別となることから、その採用の適否は慎重に判断するとともに、特定の事項が過度に強調されないよう表示方法等を工夫することも重要と考えます。\nいずれにせよ、選択肢や表示方法が、顧客の意向確認に先立って特定の保険会社又は特定の保険契約へ誘導するものとなる場合には、代理店都合による恣意的な選別と評価され得ます。\nなお、ヒアリングシートの設計に当たっては、顧客が商品特性や保険料水準等に関する意向を適切に表明でき、保険代理店が、これを把握できるような項目・導線等とするとともに、その内容を事後的に確認・検証できる態勢を整備することも重要です。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["ハ方式","意向把握"]},{"no":464,"location":"－","comment":"監督指針Ⅱ－4－2－9(5)①B.(b)において、「顧客が特に重視すると考えられる事項を例示する」とあるが、顧客が重視する事項には代理店として事務処理や事故対応に長けているという事項も含まれると理解してよいか。\n取扱契約件数が多い保険会社の商品を扱うことで迅速かつ安定的な提供が可能であることも事実であり、取扱契約件数の少ない保険会社の商品については、自信をもって販売できないのが実態である。","pageStart":270,"pageEnd":270,"answer":"本件については、個別具体的に判断すべき事項であり一概に回答することは困難ですが、顧客の意向を適切に把握する観点から、ヒアリングシートに加入目的や重視事項の選択肢を設けること自体は否定されません。\nただし、顧客が重視する事項を確認するにあたり、その選択肢や表示方法等については、顧客の意向が重要であることを前提に、顧客が自らのリスクや保険ニーズを適切に認識し意向を表明できるよう設計される必要があり、保障(補償)内容等の商品特性や保険料水準等といった保険商品に直接関係する事項を含めることが適切と考えます。\n団体割引、簡易告知、取扱実績等を選択肢又は説明項目とする場合も、それらが合理的かつ一定の具体性を有する基準や理由等として説明可能であり、他の商品選択肢を不当に排除しない客観的な事項であることが必要です。\n特に、「保有契約件数」や「年間取扱件数上位」等は、例えば、保険業法施行規則第227条の2第3項第4号ハに基づいて乗合代理店の店舗ごとに異なる保険会社の保険契約を取り扱っていたことを前提として、特定の保険契約を推奨するような根拠等に基づく場合などには、結果として、恣意的な選別となることから、その採用の適否は慎重に判断するとともに、特定の事項が過度に強調されないよう表示方法等を工夫することも重要と考えます。\nいずれにせよ、選択肢や表示方法が、顧客の意向確認に先立って特定の保険会社又は特定の保険契約へ誘導するものとなる場合には、代理店都合による恣意的な選別と評価され得ます。\nなお、ヒアリングシートの設計に当たっては、顧客が商品特性や保険料水準等に関する意向を適切に表明でき、保険代理店が、これを把握できるような項目・導線等とするとともに、その内容を事後的に確認・検証できる態勢を整備することも重要です。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["ハ方式","意向把握"]},{"no":465,"location":"Ⅱ－4－2－9(5)","comment":"顧客が特に重視すると考えられる事項を例示する際、保270険募集人個人の主観や想像力に依存するのではなく、保険代理店として一定の客観的な選定基準(フローチャート等)を策定し、組織的に運用することを正当な業務プロセスとして認めることを明文化又は解釈として容認することを求める。\n改正案では「顧客が重視する事項を例示」することが求められているが、これを個々の保険募集人の「想像力」に委ねた場合、担当者の価値観によって判断が分かれ、結果として「抽象的で不透明な説明」や「属人的な恣意性」を招くリスクがある。保険代理店が顧客のライフステージやニーズに応じた「標準的な推奨ロジック(フローチャート等)」をあらかじめ策定し、それに沿って意向を確認することは、保険業法第300条第1項第1号および第6号が禁じる「恣意的な誘導」を排除し、どの保険募集人が対応しても均質な「顧客本位の業務運営」を実現するために極めて有効である。組織的な基準策定が「恣意性」とみなされるのではなく、適正なプロセスであるという指針を明確にすべきである。","pageStart":270,"pageEnd":271,"answer":"顧客が特に重視すると考えられる事項を例示する際に、保険募集人ごとの属人的・恣意的な対応を防止するため、乗合代理店として、顧客属性、ライフステージ、リスク特性、取扱商品等を踏まえた確認項目や募集フロー、フローチャート等を社内規則等に定め、組織的に運用することは望ましい対応の1つと考えられます。\nただし、当該フローチャート等は、顧客の意向を適切に把握・確認するためのものであり、顧客の意向に先立って特定の保険会社又は特定の保険契約へ誘導することは適切ではありません。\nまた、フローチャート等を用いる場合であっても、各保険募集人においては、形式的・画一的なヒアリングにとどまらず、顧客の具体的な意向、理解度、属性、リスク状況等を踏まえ、必要に応じて追加確認を行うなど適切に意向把握をする必要があります。その上で、具体的な意向に沿って比較推奨販売を行う場合、Ⅱ－4－2－9(5)①に照らし、比較事項や提示・推奨する基準や理由等を適切に説明する必要があります。\n各代理店においては、当該フロー等の内容、運用状況、記録・検証方法、保険募集人への教育・管理・指導を整備し、恣意的な商品選別とならないよう留意することが重要です。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["比較推奨","意向把握","証跡・記録"]},{"no":466,"location":"－","comment":"意向把握の方法について、書面・WEB・電子メール等非対面でフローチャート形式やアンケート形式で顧客に回答してもらう方法も認められるとの理解でよいか。","pageStart":271,"pageEnd":271,"answer":"ご意見にあるケースについては、個別具体的に判断すべき事項であり一概に回答することは困難です。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["意向把握"]},{"no":467,"location":"Ⅱ－4－2－9(5)","comment":"「合理的かつ一定の具体性を有する基準や理由等」について、保険会社から提供された商品の特長(機能、保障等)\nを基に乗合代理店が定めるものも含まれるという理解で相違ないか。\n271","pageStart":271,"pageEnd":272,"answer":"保険会社から提供された商品の特徴、機能、保障(補償)内容、特約、保険料水準等を基に、乗合代理店が、実際に把握した顧客の意向との関係で、提示・推奨の基準や理由等を判断すること自体は否定されません。ただし、当該基準や理由等は、当該顧客の意向に沿ったものであり、合理的かつ一定の具体性を有する必要があります。\nまた、保険会社から提供された資料等を用いる場合であっても、特定の保険契約への恣意的な誘導とならないよう、顧客の意向との関係で分かりやすく提示・推奨理由等を説明する必要があります。なお、手数料水準、販売目標、便宜供与、保険会社との取引関係等、代理店側の事情を理由として特定の保険契約を提示・推奨することは適切ではありません。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["便宜供与","手数料・インセンティブ"]},{"no":468,"location":"Ⅱ－4－2－9(5)","comment":"「顧客の意向把握」や「顧客の意向に基づき乗合代理店として推奨する商品の絞り込み」を目的にシステム開発をすることが想定されるが、単なる意向把握だけでなく、「特定の保険会社や特定の保険契約を推奨する機能」までシステムが対応する場合、システムが保険会社・保険契約を絞り込むロジックと乗合代理店が定める社内規則(提示・推奨する基準や理由等)の間には整合性が必要であると考える。そのため、乗合代理店が定める社内規則において、「顧客の意向を確認し、当社のシステムにより絞り込まれた保険契約を推奨する」といった方針を定めることのみでは不十分との理解でよいか。","pageStart":272,"pageEnd":272,"answer":"貴見のとおりです。\nシステムにより特定の保険会社又は特定の保険契約を絞り込み・推奨する場合であっても、乗合代理店は、Ⅱ－4－2－9(5)①に基づき、顧客の意向に沿った合理的かつ一定の具体性を有する基準や理由等により提示・推奨する必要があります。\nしたがって、社内規則等に「当社システムにより絞り込まれた保険契約を推奨する」と定めるだけでは足りず、当該システムの推奨する保険契約の選定ロジック、選定に使用されるデータ、比較推奨販売の対象商品の範囲、推奨基準や理由等が、社内規則等に定める提示・推奨基準と整合しているか等を確認・検証し、かつ、顧客に説明可能である必要があります。\nまた、手数料水準、販売実績、便宜供与等の代理店の都合により特定の保険会社又は特定の保険契約へ誘導するものとならないよう、システムの構築・運用状況を確認・検証できる態勢を整備することが重要です。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["便宜供与","手数料・インセンティブ","比較推奨","意向把握","システム・比較ツール"]},{"no":469,"location":"－","comment":"現在、損害保険会社と乗合代理店は委託契約書を締結し、保険会社としては乗合代理店に権限を付与していると272考えている。乗合代理店は自代理店が委託契約書を締結した保険会社の商品を顧客に正確に案内することが役割の1つとなっている。\n今回の改正で、保険業法施行規則第227条の2第3項第4号ハが廃止されることになるが、委託契約書の中で、保険会社ごとに販売する保険契約を制限し、1社のみを顧客に案内することは可能か。\n例えば、A保険会社は自動車、自動車損害賠償責任保険、傷害保険B保険会社は自動車、自動車損害賠償責任保険、火災保険など、販売する保険契約を1社のみ選択することで、推奨する保険会社を1社に絞ることが可能か伺いたい。","pageStart":272,"pageEnd":273,"answer":"取扱保険契約の範囲は、原則として、所属保険会社等との代理店委託契約又はこれに基づく覚書等により、当該代理店が取り扱うこととされている保険契約を前提に判断されます。\nしたがって、保険会社ごとに取扱商品・保険種類の範囲が委託契約又は覚書等で明確に限定され、そのうえで、顧客の意向に照らして、「二以上の比較可能な同種の保険契約」が存在しない場合には、比較推奨販売は求められないものと考えられます。\n一方で、乗合代理店の内部判断のみで取扱範囲を限定するなど、比較推奨販売規制の潜脱又は顧客の適切な商品選択の機会を阻害することのないよう留意する必要があります。\nまた、顧客に対しては、権限明示を含め、当該代理店が取り扱う保険会社・保険契約の範囲について誤認を与えないよう、適切に対応する必要があると考えます。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["比較推奨","ハ方式"]},{"no":470,"location":"Ⅱ－4－2－9(5)","comment":"顧客の意向を把握するための項目選定は代理店の判断で設定して問題ないか。\n273","pageStart":273,"pageEnd":273,"answer":"顧客の意向を把握するための項目は、Ⅱ－4－2－2(3)を踏まえつつ、取扱商品、募集形態、顧客属性等に応じて、各保険代理店において創意工夫して設定することが考えられます。\nただし、意向把握・確認義務の趣旨に鑑みて、当該項目は、顧客が自らのリスクや保険のニーズを適切に認識できるよう商品特性等保険商品と直接関係する事項について設定されることが重要と考えます。また、設問・選択肢・導線等が、特定の保険会社又は特定の保険契約へ恣意的に誘導するものとならないよう留意する必要があります。\nなお、乗合代理店においては、意向を把握するための項目、確認方法、記録・検証方法等を社内規則等に定め、保険募集人に対し、教育・管理・指導を行うとともに、保険募集人ごとに属人的・恣意的な運用とならないよう確認・検証を行うことが重要です。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["意向把握","証跡・記録"]},{"no":471,"location":"Ⅱ－4－2－9(5)","comment":"監督指針Ⅱ－4－2－9(5)①B.(a)に「顧客の意向に沿って保険契約を選別」と記載されているが、顧客の意向や考え方は多様なため、顧客が重視する事項を含め、これらを事前に完全に想定した上で乗合代理店内で統一的な基準を定めることは困難であると考える。そのため、顧客の意向及び顧客が重視する事項が全く同じ場合であっても、乗合代理店内の保険募集人によって、選別し、提示・推奨する保険契約が異なる結果となり得ると考えられるが問題ないか。","pageStart":274,"pageEnd":274,"answer":"顧客の意向、重視する事項、属性やリスク許容度は多様であるため、案件ごとに提示・推奨される保険契約が異なること自体は、一律に否定されるものではありません。\nただし、乗合代理店においては、提示・推奨する基準や理由等について社内規則等に定め、当該枠組みに基づき運用する必要があります。社内規則等に関して、顧客が重視する事項を完全に想定することまで一律に求めるものではなく、保険募集人ごとに恣意的な運用とならないよう、例えば、顧客意向の把握方法、顧客が重視する事項の確認方法、顧客への説明方法、記録・検証方法などを組織的に適切に定めたうえで、各店舗又は各保険募集人に対し教育・管理・指導を徹底することが重要であると考えます。\nしたがって、顧客の意向、属性、重視する事項、比較対象となる商品内容等が実質的に同一であるにもかかわらず、保険募集人ごとの属人的・恣意的な判断により異なる保険契約を提示・推奨することは適切ではありません。\n一方で、同じように見える顧客意向であっても、既加入契約、健康状態、リスク状況、保険料負担能力等に関する希望等の個別事情が異なる場合には、社内規則等に基づく同一の判断枠組みの下で、異なる保険契約が提示・推奨されることはあり得ます。\nその場合でも、顧客の意向に沿った合理的かつ一定の具体性を有する理由を説明し、事後的に確認・検証できる態勢を整備することが重要です。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["証跡・記録"]},{"no":472,"location":"－","comment":"乗合代理店における適切な比較推奨販売を確保するための具体的な保険募集実務に関しては、乗合代理店の創意工夫等によって多様な方法が検討されるところ、例えば、274以下のようなプロセスを経ることも考えられるがどうか。\n1.保険会社選択に係る意向の把握顧客が保険加入の際に重視する項目(補償範囲、保険商品の付帯サービス、保険料水準、事故対応に関するサービス等)に関する意向を把握する。\n2.情報提供取扱保険会社各社の商品の中から、顧客の意向に沿って選別したうえで、顧客意向を適宜深掘しながら、ニーズに応じた保険契約の主要な特徴を説明する又は保険契約の主要な特徴(補償内容、付帯サービスの内容、保険会社の事故拠点数等)を簡潔に記載した一覧表を提示し、顧客の関心事項を確認しながら説明を行う。また、この段階では、顧客が望まない場合は、保険約款の詳細な差異や一覧に記載したすべての保険契約の試算までは行わない。\n3.商品の推奨顧客から乗合代理店による保険契約の推奨を求められた場合、あるいは乗合代理店が推奨を行う場合、上記1.2.で把握又は確認した顧客の意向や関心事項をもとに各保険会社の商品特性やサービス等の利便性を基準や根拠として、特定の保険契約を推奨し、顧客がそれらの中から選択した保険契約の見積書を作成・提示する(結果として1社の提示となるケースを含む。)。","pageStart":274,"pageEnd":275,"answer":"顧客の意向、商品特性、募集形態等により個別具体的かつ実質的に判断する必要がありますが、ご指摘のようなプロセスも、関係法令及び監督指針に基づいて行われている限り、直ちに否定されるものではありません。\n一般論として、比較推奨販売においては、まず顧客が重視する事項を丁寧かつ明確に確認することが重要です。\nその上で、顧客の理解に資する範囲で、保障(補償)内容、保険料水準等の主要な特徴を一覧表等により、適切かつ正確に説明することは考えられます。なお、全ての場合に、約款の詳細な差異や全商品の試算を一律に求めるものではありません。\nまた、特定の保険契約を提示・推奨する場合には、顧客の意向との関係で、合理的かつ一定の具体性を有する基準や理由等を説明する必要があります。結果として、一の保険契約のみを提示・推奨することもあり得ますが、手数料水準、販売目標、便宜供与等の代理店の都合による恣意的な選別・誘導とならないよう留意する必要があります。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["便宜供与","手数料・インセンティブ","比較推奨"]},{"no":473,"location":"Ⅱ－4－2－9(5)","comment":"監督指針Ⅱ－4－2－9(5)①A.(c)について、重要情報シートを「自らが勧める保険契約の優位性の根拠」として説明に用いることは問題ないか。\n275例えば、保険会社から承認を受けた「商品特性を端的にまとめた資料」を用いて「自らが勧める保険契約の優位性の根拠」を説明することは差し支えないか。","pageStart":275,"pageEnd":276,"answer":"個別具体的に判断されますが、一般論として、保険会社の承認を受けた商品特性を端的にまとめた資料を用いて、勧める保険契約の特徴や優位性の根拠を説明すること自体は否定されるものではありません。\nただし、当該資料を用いる場合であっても、乗合代理店においては、顧客の意向に照らして、比較対象となる保険契約との相違点を整理し、保障(補償)内容、保険料水準、特約、留意点等を、誤解を与えないよう分かりやすく説明するなど、Ⅱ－4－2－9(5)\n①A.及びⅡ－4－2－2(9)②に基づいて適切に顧客に説明する必要があります。\nまた、特定の保険契約の優位性のみを強調し、他の保険契約との重要な相違点や不利益となり得る事項を説明しないなど、顧客の適切な商品選択の機会を阻害するような使用は適切ではありません。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":[]},{"no":474,"location":"Ⅱ－4－2－9(5)","comment":"顧客の意向に沿って推奨販売を行うにあたり、取引する生命保険会社を最大限網羅している有償の生命保険商品比較システム(同システムに各社が情報提供している)を活用して比較推奨販売を行う場合、保険会社の事情で同システムに情報提供していない保険契約があるが、比較推奨販売を行う際に情報提供していない保険会社を顧客に提示する保険契約から除いてもよいか。\n276","pageStart":276,"pageEnd":277,"answer":"乗合代理店が、代理店委託契約又はこれに基づく覚書等により取り扱うこととされている保険契約の中に「二以上の比較可能な同種の保険契約」が存在する場合には、比較システムへの掲載の有無のみを理由として、当該保険契約を比較推奨販売の対象から除外することは適切ではありません。\nしたがって、比較システムに掲載されていない保険契約であっても、当該乗合代理店が取り扱うことができ、顧客の意向に照らして比較可能な同種の保険契約に該当する場合には、保険会社からの資料提供、商品資料、照会対応等を通じて必要な情報を確認し、顧客の意向に沿って適切に選別し、提示・推奨する必要があります。\nなお、比較システムを利用する場合には、Ⅱ－4－2－9(5)①A.及びⅡ－4－2－2(9)②に基づいて、当該システムに掲載されている商品範囲や掲載基準について、顧客に誤認を与えないよう留意することが重要です。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["比較推奨","システム・比較ツール"]},{"no":475,"location":"Ⅱ－4－2－9(5)","comment":"次のようなケースでは選択の余地がなく保険契約を提示・推奨することになると考えられるが問題ないか。その場合に「顧客の求めに応じて」行う「当該提示・推奨する基準や理由等」については、選択の余地がない理由を説明することでよいか。\n郵送募集を主体とする代理店において、郵送募集が可能な生命保険契約が限られるため、特定の保険会社の特定の保険契約を提示・推奨する。\nなお、別の保険会社の保険契約の提示を求める等の顧客意向が示された場合は、当然にそれら保険契約の概要又は契約内容の説明することを前提とする。","pageStart":277,"pageEnd":277,"answer":"顧客の求めがあるか否かを問わず、特定の保険契約を提示・推奨する場合には、顧客の意向に沿った保険契約の絞り込みと対応関係にある基準や理由等について説明する必要があります。\n貴見のケースが必ずしも明確ではございませんが、恣意的な保険契約の提示・推奨とならないよう、顧客の意向を適切に判断したうえで、意向に沿った保険契約を選別し、提示・推奨できるよう体制を整備する必要があると考えます。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":[]},{"no":476,"location":"Ⅱ－4－2－9(5)","comment":"顧客の意向把握のプロセスについて、下記1.から5.の流れで行うことが考えられる。\n1.当初意向の把握2.説明を受ける商品を絞り込むかの確認3.特に重視する意向の把握4.商品特性等により、代理店が特定の保険契約を推奨する場合の取扱い5.個別商品の説明・申込上記4.について、上記のように監督指針Ⅱ－4－2－9(5)\n①B.(a)第一段落でいう顧客の意向に沿って保険契約を選別した上で、さらに同第二段落(「特に」以下)、商品特性等により、乗合代理店が特定の保険契約を推奨する場合、推奨する基準や理由等について、顧客の最善の利益を勘案277したものとして、保険募集人や乗合代理店の都合によることなく、合理的かつ一定の具体性を有する説明を行うと共に、推奨する特定の保険契約以外の保険契約もある旨及び顧客の求めに応じて、それらの保険契約の概要又は契約内容を説明する旨を説明することが考えられる、という理解でよいか。","pageStart":277,"pageEnd":278,"answer":"ご意見にあるプロセスは、顧客の意向把握及び推奨販売の一例としてあり得るものと考えます。\n個別具体的に判断すべき事項であり一概に回答することは困難ですが、一般論として、乗合代理店が未契約の顧客に対し、顧客が提案を希望する保険会社について、恣意性を排除して確認し、顧客が自ら選択した保険契約を提示することは、顧客の意向に沿った選別に該当し得ます。\nただし、顧客の意向を確認する際、顧客が自らのリスクや保険ニーズを適切に認識し、意向を表明できるようにする必要があり、商品特性や保険料水準といった保険商品に関する事項を含めることが重要と考えます。\nなお、保険会社名の提示方法、表示順、選択肢、説明内容等により、特定の保険会社又は特定の保険契約へ誘導するものとなっていないか留意する必要があります。また、顧客が保険会社名ではなく、補償内容、保険料水準、事故対応、付帯サービス等を重視する意向を示した場合には、当該意向に沿って適切に選別し、提示・推奨する必要があります。\nいずれの場合も、顧客の意向、選別理由及び説明内容を事後的に確認・検証できる態勢を整備することも重要です。\n貴見において想定されている場面が必ずしも明確ではありませんが、特定の保険契約を提示・推奨する場合には、Ⅱ－4－2－9(5)①B.(a)に基づき、顧客の意向に沿って、合理的かつ一定の具体性を有する基準や理由等を説明する必要があります。\nまた、乗合代理店においては、同(5)②ア.に基づき、代理店自身の規模や業務特性を踏まえつつ、提示・推奨する基準や理由等について、社内規則等に定め、保険募集人ごとに恣意的・属人的な運用とならないよう管理することも重要です。\nなお、社内規則等を定める場合も、あらかじめ特定保険会社を推奨するための方針ではなく、顧客意向に沿って保険契約を選別し、提示・推奨を行うための判断の枠組み、記録・検証態勢等を定めた上で、保険募集人への教育・管理・指導を徹底することが重要であると考えます。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["意向把握","顧客の最善の利益","証跡・記録"]},{"no":477,"location":"Ⅱ－4－2－9(5)","comment":"乗合代理店が、保険契約を締結していない顧客に対して、提案を希望する保険会社をフラットに質問して、顧客の回答に沿って提案する保険契約を選別することは、監督指針Ⅱ－4－2－9(5)①B.(a)第1段落に定める「顧客の意向に沿って保険契約を選別」することになるという理解でよいか。","pageStart":278,"pageEnd":278,"answer":"ご意見にあるプロセスは、顧客の意向把握及び推奨販
