<script id="embedded-data" type="application/json">[{"no":1,"location":"－","comment":"実務上、短時間での説明を希望する顧客も多い中で、比較推奨販売に係る手続きが形式的に長時間化すると、顧客の利便性や満足度を損なうおそれがある。そのため、顧客のニーズに応じて、説明内容や対応方法を柔軟に選択できる運用とする仕組みを整備いただきたい。","pageStart":3,"pageEnd":3,"answer":"今般の改正の趣旨は保険業法に基づく意向把握を前提として、顧客の意向等に照らし適切な商品選択の機会を確保する点にあります。\n「簡潔な説明」が何を指しているか明らかではありませんが、顧客の意向に整合的な形で、当該保険契約を選別・推奨する理由が合理的に説明できること、また、顧客の理解と納得を得られる実効的な募集が行われていることが重要であると考えています。","theme":"顧客の最善の利益","section":"保険業法施行規則","tags":["比較推奨","意向把握"]},{"no":2,"location":"－","comment":"法令を遵守し、お客様の立場に立った保険の取扱いは必須と考える。事故修理の際、特に外注委託をする場合、外注先の作業内容を確認の上、過不足のない適切な保険請求をすることの重要性を理解し、再徹底を指示し、社内監査も含めて徹底の仕組み強化を図っている。\nその他、保険募集人に対する諸々の指導や教育支援等々、体制整備は従来からも取り組んでいるが、今回の保険業法改正を機に総点検の上、整備を図っていく。\n比較推奨販売はお客様にとって保険を選ぶ際の良い方法と考えるため、お客様の利便性を損なうことのない制度設計をぜひともお願いしたい。\nすべてのお客様が時間をかけて1から10まで説明されることを望んでいないことも想定される。保険契約継続のお客様、新規でもお客様がご指定の損保会社がある場合など、お客様意向を最優先にご指定損保会社の保険契約をメインに勧めていくことがあると考える。当然、損保会社を決めていないお客様には、お客様が保険で拘られる点をお聞きした上で扱い損保会社・保険を勧めていければと考えている。\n3","pageStart":3,"pageEnd":3,"answer":"今般の改正の趣旨は保険業法に基づく意向把握を前提として、顧客の意向等に照らし適切な商品選択の機会を確保する点にあります。\n「簡潔な説明」が何を指しているか明らかではありませんが、顧客の意向に整合的な形で、当該保険契約を選別・推奨する理由が合理的に説明できること、また、顧客の理解と納得を得られる実効的な募集が行われていることが重要であると考えています。","theme":"顧客の最善の利益","section":"保険業法施行規則","tags":["比較推奨","意向把握"]},{"no":3,"location":"－","comment":"実務上、顧客に意向を確認した場合、半数以上が保険料の安さを重視しており、それ以外の意向を把握することが難しいと感じるケースが多い。\nまた、比較や説明に伴う工数が増加すると、手続きが煩雑化し、顧客の負担や理解不足を招くおそれがあるため、かえって顧客利益を損なうリスクがあるのではないか。","pageStart":4,"pageEnd":4,"answer":"今般の改正の趣旨は保険業法に基づく意向把握を前提として、顧客の意向等に照らし適切な商品選択の機会を確保する点にあります。\n「簡潔な説明」が何を指しているか明らかではありませんが、顧客の意向に整合的な形で、当該保険契約を選別・推奨する理由が合理的に説明できること、また、顧客の理解と納得を得られる実効的な募集が行われていることが重要であると考えています。","theme":"顧客の最善の利益","section":"保険業法施行規則","tags":["意向把握"]},{"no":4,"location":"－","comment":"兼業代理店(自動車ディーラー)では、納車時に保険手続を行うケースが多く、商品間の差異が大きくない保険については、詳細な比較説明よりも、短時間で簡潔な説明を行う方が顧客ニーズに合致する場合が多い。\nこうした実務実態を踏まえ、顧客の希望に応じた柔軟な対応が可能な制度とすべきではないか。","pageStart":4,"pageEnd":4,"answer":"今般の改正の趣旨は保険業法に基づく意向把握を前提として、顧客の意向等に照らし適切な商品選択の機会を確保する点にあります。\n「簡潔な説明」が何を指しているか明らかではありませんが、顧客の意向に整合的な形で、当該保険契約を選別・推奨する理由が合理的に説明できること、また、顧客の理解と納得を得られる実効的な募集が行われていることが重要であると考えています。","theme":"顧客の最善の利益","section":"保険業法施行規則","tags":["比較推奨","意向把握"]},{"no":5,"location":"第227条の2第3項第4号","comment":"保険業法施行規則第227条の2第3項第4号ハ(以下、ハ方式とする。)が廃止された背景は、ビッグモーター事案といった個別事案への対応にとどまらず、「損害保険業等に関する制度等ワーキング・グループ」報告書に示された「顧客本位の業務運営の徹底」、とりわけ乗合代理店における適切な比較推奨販売の確保という考え方に基づくものと理解して差し支えないか。\nすなわち、顧客の最善の利益を勘案する義務が改正金融サービス提供法により明確化されたこと等、法規制環境の変化を踏まえると、ハ方式を存続させることは今日的に適当ではないとの判断に至った、との理解でよいか確認したい。","pageStart":4,"pageEnd":4,"answer":"ご理解のとおり、保険業法施行規則第227条の2第3項第4号ハの廃止は、特定の個別事案への対応にとどまらず、顧客の最善の利益を重視する法制度の整備や、金融審議会ワーキング・グループの提言を踏まえ、乗合代理店における比較推奨販売の在り方を見直した結果によるものです。","theme":"顧客の最善の利益","section":"保険業法施行規則","tags":["比較推奨","ハ方式","顧客の最善の利益"]},{"no":6,"location":"－","comment":"近年の保険業法違反事案の背景には、商品差が小さい損4害保険市場において、保険会社が代理店との関係性や手数料ポイント制度、利益供与を通じて自社商品の推奨を事実上促してきた構造があり、一部の悪質な代理店がこれに便乗したことが真因であると考えられる。\n一方、現行の損害保険商品は顧客意向を踏まえても明確な優劣を付けにくく、商品差による顧客トラブルは限定的である中、比較推奨販売を義務的・画一的に強化すると、代理店の負担増により乗合縮小や専属化が進み、結果として顧客の選択肢減少や募集停止リスク等、顧客不利益につながるおそれがある。\n制度改正に当たっては、保険契約者利益と代理店業務負荷のバランスを考慮した、持続可能な募集体制の構築が重要である。","pageStart":4,"pageEnd":5,"answer":"貴重なご意見として承ります。\n本改正は、金融審議会における議論を踏まえ、近年の不適切事案について、単に募集現場の問題として捉えるのではなく、保険会社による保険代理店向けの販売手数料体系や各種支援・便宜供与の在り方が、乗合代理店における顧客による適切な商品選択に影響を及ぼしてきた構造的課題があるとの認識の下で進められたものです。\n議論においては、乗合代理店における比較推奨販売について、顧客の意向を丁寧に把握し、その意向に沿って合理的な基準と理由に基づく商品の選定が行われるべきである一方、保険代理店向けの販売手数料体系や各種支援・便宜供与の在り方等、顧客から見えにくい要素が推奨判断に影響する状況は是正される必要があるとの指摘がなされました。\nこうした議論を踏まえ、本改正では、監督指針に基づき、保険会社に対し、過度の便宜供与や不適切なインセンティブが生じないよう、代理店管理態勢の一層の高度化を求めるとともに、乗合代理店においても、顧客の意向に照らして、適切な比較推奨販売が行われているかを確保することを目的としています。\n今後とも、こうした議論を踏まえ、顧客の最善の利益の確保と代理店実務の持続可能性とのバランスを考慮しながら、実態に即した業務運営が図られることが重要と考えます。","theme":"顧客の最善の利益","section":"保険業法施行規則","tags":["便宜供与","手数料・インセンティブ","比較推奨","顧客の最善の利益"]},{"no":7,"location":"－","comment":"保険募集人と保険契約者との知識差により、意向把握の過程で、保険募集人の説明の仕方次第で顧客の意向が実質的に誘導・修正され、結果として代理店の意向に沿った保険会社・商品が選択される構図が生じ得るのではないかとの懸念がある。\n5形式上は顧客意向に沿った選択と見えても、実態としては代理店の判断が強く反映されている可能性があることから、比較推奨販売の公平性・透明性を確保するため、業界や協会による統一的な比較推奨資料の整備が必要ではないか。","pageStart":5,"pageEnd":6,"answer":"保険募集において、保険募集人は、顧客の最善の利益を確保するため、保険業法に基づく意向把握・確認義務を適切に履行するとともに、金融サービス提供法の趣旨を踏まえ、顧客が自ら納得して保険商品を選択できるよう支援することも重要と考えます。\nそのため、保険募集人には、顧客との知識の差を踏まえ、自らの専門的知識やスキルを活かして、リスクや保障(補償)の考え方などを分かりやすく説明し、顧客の理解を深めることにより、適切な意向の形成を促す役割も期待されます。\n比較推奨販売においては、顧客が説明内容を理解し、十分に納得した上で意思決定が行われ、また、その判断過程が合理的なものとなるよう、適切に情報提供義務が果たされることが必要となります。\nご意見にある比較推奨資料については、一律に様式等を定めるような性質のものではなく、乗合代理店の募集実務や募集形態に応じた創意工夫により、顧客の理解を助け、顧客の意向形成を適切に支援するために資するものであるべきと考えます。\nなお、顧客の意向を確認していることを装い、実質的には代理店又は保険会社の都合に基づく恣意的な誘導を行うことは適切ではありません。","theme":"顧客の最善の利益","section":"保険業法施行規則","tags":["比較推奨","意向把握","顧客の最善の利益"]},{"no":8,"location":"－","comment":"乗合代理店における比較推奨販売については、代理店の形態や取り扱う保険種目によって、顧客が比較推奨を期待する程度や実務の実態が大きく異なるため、一律の規制を課すことは必ずしも顧客の利益につながらないおそれがある。\n生命保険や企業向け包括保険のように、比較推奨が本質的に期待される分野では厳格な管理が理解できる一方、自賠責保険や自動車保険、特にディーラー代理店による自動車保険取扱いでは、顧客は比較よりも利便性や信頼関係を重視しており、同水準の比較推奨対応を求めることは現場の混乱や顧客負担増を招きかねない。\n6その結果、代理店の専属化や保険取扱いの萎縮につながることは、顧客および保険業界双方にとって望ましくないため、ディーラー代理店の自動車保険については、顧客が求める場合に限定して比較推奨販売を行うなど、実務に即した柔軟な運用が必要である。","pageStart":6,"pageEnd":7,"answer":"貴重なご意見として承ります。\n比較推奨販売に係る体制整備については、顧客の最善の利益を勘案しつつ、顧客による適切な商品選択の機会を確保するため、乗合代理店の規模や業務特性等に応じて、自社の募集実務や募集形態等を踏まえた適切な比較推奨販売が実施されるよう実効的な体制が整備されることが重要であり、監督指針は、一律かつ画一的な対応や、規模・業務特性等に照らして過度な実務上の負担を求める趣旨ではありません。\nまた、保険募集人(乗合代理店)には、法令に基づき、自らの所属保険会社等の保険商品について、顧客の最善の利益を勘案しつつ、公正な保険募集を行うことが求められています。そのため、保険契約者等の保護の観点から、自らの規模や業務特性に見合った体制整備を図ることが必要と考えます。","theme":"顧客の最善の利益","section":"保険業法施行規則","tags":["比較推奨","顧客の最善の利益","自賠責"]},{"no":9,"location":"－","comment":"複数の損害保険会社の商品を比較説明する際、顧客は最終的に保険料水準を主な判断基準とすることが多い。\nしかし、各社で見積作成に用いるシステムが異なるため、複数社の見積を取得・提示するには相当の時間と工数がかかり、結果として顧客の待ち時間や負担が増大するおそれがあることを懸念している。","pageStart":7,"pageEnd":7,"answer":"今般の改正の趣旨は保険業法に基づく意向把握・確認義務を前提として、顧客の意向等に照らし、顧客による適切な商品選択の機会を確保する点にあります。\n顧客が保険料水準を重視する場合には、その意向を踏まえつつ、判断に必要な情報を効率的に提供するなど、顧客の理解と利便性に配慮した実効的な対応が重要と考えます。","theme":"顧客の最善の利益","section":"保険業法施行規則","tags":["比較推奨","意向把握","システム・比較ツール"]},{"no":10,"location":"－","comment":"乗合代理店が取り扱う保険会社間で、補償内容や保険料の差異がほとんどない場合に、詳細な比較推奨を行うことは時間対効果に見合わず、乗合代理店の事業運営に影響を及ぼすおそれがある。\nまた、そのような状況で比較説明を行うとかえって顧客にとって分かりにくい説明となる懸念もあるため、差異の少ない商品については、顧客の意向に応じて比較推奨を簡素化、又は比較を行わない対応も、顧客本位の募集手段として認められるべきではないか。","pageStart":7,"pageEnd":7,"answer":"「詳細な比較推奨」が何を指しているか明らかではありませんが、たとえ、保障(補償)内容や保険料水準の差異がほとんどない場合であっても、当該差異が、顧客の意向となることは考えられます。したがって、「かえって顧客にとってわかりにくい」ことを理由に、Ⅱ－4－2－9(5)に則した適切な比較推奨販売を行わないことは、不適切であると考えます。\n保障(補償)内容や保険料水準の差異が限定的である場合には、例えば、その点を含めて顧客に説明した上で、顧客の理解や意向に沿い、説明や比較の範囲を工夫するなど、顧客の最善の利益に資するよう実効的な対応を図ることも考えられます。","theme":"顧客の最善の利益","section":"保険業法施行規則","tags":["比較推奨","顧客の最善の利益"]},{"no":11,"location":"第227条の2第3項第4号","comment":"専属代理店と乗合代理店が合併した結果、店舗ごとに異なる募集形態が併存しているが保険業法施行規則第227条の2第3項第4号ハの廃止により、全店舗で同号イ又は同号ロの採用又は専属化を迫られる状況にある。\n7その場合、取扱量が圧倒的に多い保険会社の商品に事実上集約され、他社の既存顧客に対して乗換えを勧めざるを得ない事態が生じかねず、顧客の意向が十分に尊重されているのか疑問がある。\n合併の都度、同様の問題が生じる可能性や、教育体制が十分に整わない中で専属化が進むことは、顧客を混乱させ、顧客本位の業務運営に逆行するおそれがある。\n顧客に対して一つの保険会社の商品に統一させるよりも、取扱状況の公表や顧客に選択の余地を確保し、顧客ニーズに応じた柔軟な対応が重要ではないか。\nテレマティクス技術を採用した保険会社もあり、保険会社それぞれで異なる特徴やサービスがある。会社の合併という都合で、顧客に乗り換えや他代理店への変更を強要するのではなく、顧客のニーズに合わせ、個々の状況に応じた柔軟な対応が求められるのではないか。","pageStart":7,"pageEnd":8,"answer":"貴重なご意見として承ります。\n保険募集人(乗合代理店)には、法令に基づき、自らの所属保険会社等の保険商品について、顧客の最善の利益を勘案しつつ、公正な保険募集を行うことが求められています。そのため、保険契約者等の保護の観点から、自らの規模や業務特性に見合った体制整備を図ることが必要と考えます。","theme":"顧客の最善の利益","section":"保険業法施行規則","tags":["ハ方式","顧客の最善の利益"]},{"no":12,"location":"－","comment":"昨今の状況を鑑みると、今回発表された保険業法改正に関するパブリックコメントの趣旨(消費者保護・説明の充実など)には賛同している。\n自動車ディーラーの使命は「お客様へ安全・安心をお届けする」ことであり、そのためには、お客様の声に耳を傾け、その意向に合った最適な商品を提案する「お客様本位」\nであることを大切にしている。\nその視点において、今回の法改正の内容を受け止め、当社の保険業務を再度見直し改善を進めている中で、懸念していることを申し上げる。\n8自動車ディーラーにおいて、お客様が高額商品である自動車を購入される際、担当スタッフとの信頼関係が意思決定に大きく影響する傾向がある。自動車保険の加入先を検討する場面においても、商品そのものの差異よりも「信頼できるスタッフに任せたい」というニーズが強いケースが少なくない。\nしかし、乗合代理店に対して、取扱損保全ての商品について比較推奨販売が義務付けられると、担当スタッフは時間をかけて商品の違いを詳細に説明する必要が生じる。こうした対応は、お客様のニーズと必ずしも合致せず、かえってお客様の負担となる可能性があると考える。\n弊社では「重要事項説明」について最も重きをおいており、契約後に「知らなかった」、「聞いていなかった」ことが決して起こらぬよう、透明性の高い説明を徹底している。代理店としての使命やお客様ニーズに対する比較推奨販売の必要性に対し、本当にお客様のためになるのか懸念している。\nまた、営業スタッフが取扱損保全ての商品知識を備え、比較推奨販売を行うためのオペレーションを整備しても、実際の現場がその運用に追従できるのかという点についても危惧している。","pageStart":8,"pageEnd":9,"answer":"貴重なご意見として承ります。\n比較推奨販売に係る体制整備については、顧客の最善の利益を勘案しつつ、顧客による適切な商品選択の機会を確保するため、乗合代理店の規模や業務特性等に応じて、自社の募集実務や募集形態等を踏まえた適切な比較推奨販売が実施されるよう実効的な体制が整備されることが重要であり、監督指針は、一律かつ画一的な対応や、規模・業務特性等に照らして過度な実務上の負担を求める趣旨ではありません。\nまた、保険募集人(乗合代理店)には、法令に基づき、自らの所属保険会社等の保険商品について、顧客の最善の利益を勘案しつつ、公正な保険募集を行うことが求められています。そのため保険契約者等の保護の観点から、自らの規模や業務特性に見合った体制整備を図ることが必要と考えます。","theme":"顧客の最善の利益","section":"保険業法施行規則","tags":["比較推奨","顧客の最善の利益"]},{"no":13,"location":"－","comment":"監督指針Ⅱ－4－2－9(5)B.(a)では、特定の保険契約を推奨する場合に「顧客の最善の利益を勘案」することが求められているが、実務上、特定の保険会社において新規取扱件数の未達を理由に代理店の種別格下げや委託解除を9行うルールが存在する。\nこうした保険会社側のルールにより代理店が委託解除となった場合、既存契約者に対する継続的な保全業務が困難となり、結果として顧客の最善の利益を損なうおそれがあるのではないか。","pageStart":9,"pageEnd":10,"answer":"貴重なご意見として承ります。","theme":"顧客の最善の利益","section":"保険業法施行規則","tags":["顧客の最善の利益","委託解除"]},{"no":14,"location":"－","comment":"顧客の意向には「募集人のあなたに任せるから」、「募集人のあなたが良いと思う商品にするよ」という内容のものが相当数ある。このような場合に、顧客の細かい意向を聞き出し、複数商品を詳しく説明することが、本当に顧客のためになるのか疑問である。逆に、時間がかかりすぎているという顧客の不満につながる可能性がある。\nこのようなケースの場合、どのような運用を考えているのか。","pageStart":10,"pageEnd":10,"answer":"顧客が「あなたに任せる」、「あなたが良いと思う商品にする」\nなどと述べた場合であっても、その意思表示のみをもって、乗合代理店が任意に特定の保険会社又は特定の保険契約を選別し、提示・推奨することは適切ではありません。\n当該意思表示がされたことを踏まえつつ、保障(補償)内容、保険料水準、特約等、顧客が重視し得る事項を確認するなど、可能な限り意向の形成を促し、又は意向の明確化に努めた上で、把握した顧客の意向に沿って、合理的かつ一定の具体性を有する基準や理由等に基づき、保険契約を選別し、提示・推奨することが重要です。\nその上で、顧客の意向や募集実態に応じて、Ⅱ－4－2－9(5)①A.に基づき複数の保険契約を比較説明すること、又は同①B.に基づき「二以上の比較可能な同種の保険契約」の中から顧客の意向に沿って保険契約を選別し、提示・推奨することが考えられます。\n上記の対応をしたものの明確な意向がなお確認できない場合に、顧客の意向に沿って保険契約を選別し、提示・推奨するためには、顧客の理解度や負担にも配慮しつつ、それまでに把握した顧客の当初意向、顧客属性、加入目的、既加入契約、保険料水準、","theme":"意向がない場合","section":"保険業法施行規則","tags":["比較推奨"]},{"no":15,"location":"－","comment":"乗合代理店における適切な比較推奨販売の確保について、顧客の意向や重視される項目を丁寧に確認した場合であっても、顧客から最終的に保険募集人の判断に委ねられる状況となった際には、保険募集人の都合による提案に偏るおそれがある点を懸念している。\n10","pageStart":10,"pageEnd":10,"answer":"顧客が「あなたに任せる」、「あなたが良いと思う商品にする」\nなどと述べた場合であっても、その意思表示のみをもって、乗合代理店が任意に特定の保険会社又は特定の保険契約を選別し、提示・推奨することは適切ではありません。\n当該意思表示がされたことを踏まえつつ、保障(補償)内容、保険料水準、特約等、顧客が重視し得る事項を確認するなど、可能な限り意向の形成を促し、又は意向の明確化に努めた上で、把握した顧客の意向に沿って、合理的かつ一定の具体性を有する基準や理由等に基づき、保険契約を選別し、提示・推奨することが重要です。\nその上で、顧客の意向や募集実態に応じて、Ⅱ－4－2－9(5)①A.に基づき複数の保険契約を比較説明すること、又は同①B.に基づき「二以上の比較可能な同種の保険契約」の中から顧客の意向に沿って保険契約を選別し、提示・推奨することが考えられます。\n上記の対応をしたものの明確な意向がなお確認できない場合に、顧客の意向に沿って保険契約を選別し、提示・推奨するためには、顧客の理解度や負担にも配慮しつつ、それまでに把握した顧客の当初意向、顧客属性、加入目的、既加入契約、保険料水準、","theme":"意向がない場合","section":"保険業法施行規則","tags":["比較推奨"]},{"no":16,"location":"－","comment":"ブランド保険と言われる自動車メーカー独自の付帯サービスについて、各損害保険会社の商品にさほど違いは感じられない。この状況の中、顧客が複数の損保会社から選ぶのは難しい。\n保険募集人が説明し易い慣れている保険契約など、特定の保険契約に誘導することは不適切と認識しているが、顧客から「希望する保険会社はないのでおすすめを教えてほしい」と聞かれた場合に、どの質問が恣意的ではない対応となるのか伺いたい。","pageStart":11,"pageEnd":11,"answer":"必要と考えられる保障(補償)内容等を踏まえて、顧客の最善の利益を勘案し、合理的かつ一定の具体性を有する基準や理由等に基づき、保険契約を提示・推奨することが考えられます。\nただし、手数料水準、販売目標、保険会社からの便宜供与等の代理店側の都合により、特定の保険会社又は特定の保険契約へ誘導することは適切ではありません。また、意向把握・例示・提示・推奨理由・顧客への説明内容について、事後的に確認・検証できるよう記録することが重要です。","theme":"意向がない場合","section":"保険業法施行規則","tags":["便宜供与","手数料・インセンティブ","意向把握","顧客の最善の利益","証跡・記録"]},{"no":17,"location":"－","comment":"多くの顧客は、自動車保険を「難しくて考えたくないもの」と捉え、信頼できる担当者に「おまかせ」したいと考えている。そうでない方は自分で勉強して通販型などに加入されている。この圧倒的多数の「おまかせしたい」という消費者の意向を無視し、無理やり比較を強いることが、本当に消費者のためになるのか。","pageStart":11,"pageEnd":11,"answer":"必要と考えられる保障(補償)内容等を踏まえて、顧客の最善の利益を勘案し、合理的かつ一定の具体性を有する基準や理由等に基づき、保険契約を提示・推奨することが考えられます。\nただし、手数料水準、販売目標、保険会社からの便宜供与等の代理店側の都合により、特定の保険会社又は特定の保険契約へ誘導することは適切ではありません。また、意向把握・例示・提示・推奨理由・顧客への説明内容について、事後的に確認・検証できるよう記録することが重要です。","theme":"意向がない場合","section":"保険業法施行規則","tags":["便宜供与","手数料・インセンティブ","意向把握","顧客の最善の利益","証跡・記録"]},{"no":18,"location":"－","comment":"新規契約、継続手続きで顧客が特に重視すると考えられる事項を例示してもなお顧客から「あなたに一任するので保険契約はどれでもよい」との発言を受けた場合、選定理由はどのようにすればよいか。","pageStart":11,"pageEnd":11,"answer":"必要と考えられる保障(補償)内容等を踏まえて、顧客の最善の利益を勘案し、合理的かつ一定の具体性を有する基準や理由等に基づき、保険契約を提示・推奨することが考えられます。\nただし、手数料水準、販売目標、保険会社からの便宜供与等の代理店側の都合により、特定の保険会社又は特定の保険契約へ誘導することは適切ではありません。また、意向把握・例示・提示・推奨理由・顧客への説明内容について、事後的に確認・検証できるよう記録することが重要です。","theme":"意向がない場合","section":"保険業法施行規則","tags":["便宜供与","手数料・インセンティブ","意向把握","顧客の最善の利益","証跡・記録"]},{"no":19,"location":"－","comment":"保険の加入に関して、「担当者に任せる」という顧客の意向が示された場合、顧客から一任されたという意向確認も認めていただきたい。","pageStart":11,"pageEnd":11,"answer":"必要と考えられる保障(補償)内容等を踏まえて、顧客の最善の利益を勘案し、合理的かつ一定の具体性を有する基準や理由等に基づき、保険契約を提示・推奨することが考えられます。\nただし、手数料水準、販売目標、保険会社からの便宜供与等の代理店側の都合により、特定の保険会社又は特定の保険契約へ誘導することは適切ではありません。また、意向把握・例示・提示・推奨理由・顧客への説明内容について、事後的に確認・検証できるよう記録することが重要です。","theme":"意向がない場合","section":"保険業法施行規則","tags":["便宜供与","手数料・インセンティブ","意向把握","顧客の最善の利益","証跡・記録"]},{"no":20,"location":"－","comment":"乗合代理店における適切な比較推奨販売の確保について、「顧客意向が不明瞭な場合であっても、顧客が重視す11る事項を例示するなどして、丁寧に意向を把握する必要がある」とされている。しかし、それでもなお意向が明確にならない場合には、保険募集人が合理的に推定したうえで提案を行って差し支えないのか、疑問に感じている。\nまた、金融庁においては、意向把握に関しシステムの活用を推奨しているものと認識しているが、一方で、プログラム作成の段階において保険会社(商品)を選定する際には、代理店側の事情が影響を及ぼす可能性があるのではないかと感じている。\n結果として、従来と同様に代理店の都合による商品絞り込みに至るおそれもあるのではないか。","pageStart":11,"pageEnd":12,"answer":"顧客の意向が不明確な場合には、顧客が重視し得る事項を確認するなど、可能な限り意向の形成を促し、又は意向の明確化に努める必要があります。\nその上で、明確な意向がなお確認できない場合であっても、それまでに把握した当初意向、顧客属性、加入目的、既加入契約、保険料水準、必要と考えられる保障(補償)内容等を踏まえて、顧客の最善の利益を勘案し、合理的かつ一定の具体性を有する基準や理由等に基づき、保険契約を提示・推奨することが考えられます。\nただし、あらかじめ特定の保険会社又は特定の保険契約を推奨することを前提に、これに適合するよう顧客の意向を形成・解釈することは適切ではありません。\nまた、システム活用の要否については、各保険代理店における事情を踏まえて判断されるべき事項ですが、意向把握に関してシステムを活用する場合には、システムの開発過程において、選定ロジック、使用データ、比較対象商品の範囲、推奨理由等が、手数料水準、販売目標、保険会社からの便宜供与等の代理店側の都合が介在することにより、特定の保険会社又は特定の保険契約への誘導とならないように留意することが望ましいと考えます。\nさらに、乗合代理店がシステムを利用するにあたり、意向把握及び比較推奨販売を適切に行う観点から当該システムのプログラム等の適切性を確認・検証できる態勢を整備することも重要です。","theme":"意向がない場合","section":"保険業法施行規則","tags":["便宜供与","手数料・インセンティブ","比較推奨","意向把握","顧客の最善の利益","システム・比較ツール"]},{"no":21,"location":"第227条の2第3項第4号","comment":"保険業法施行規則第227条の2第3項第4号ロについて、選別に足りるだけの顧客の「意向」が存在しない場合や、そうした「意向」を表現してもらえない場合(「お任せ」といった場合)には、保険募集人が「おすすめ」を選別すること12は法令上許されなくなったという理解でよいか(選別しようとすると、「顧客」の意向に沿った選別結果による情報提供が必要となるが、そのような情報提供ができないため。)。\n監督指針Ⅱ－4－2－9(5)①B.(b)に「顧客の意向が不明確な場合であっても、保険契約の選別に当たっては、例えば、顧客が特に重視すると考えられる事項を例示するなど、可能な限り顧客の意向を把握した上で、上記(a)に基づき対応しているか」と記載があることは承知しているが、それでも顧客の意向が引き出せない場合はあり得ると思われる。\n顧客の意向が引き出せなくても、代理店として真に「おすすめ」の保険契約を提示できる道を残すことは考えられないか。\n顧客が情報過多に溺れるか、代理店が取り扱う保険契約を減らして競争減となること、情報提供義務の規制回避のために不透明な「適用除外」(団体保険スキーム等)に逃げないかを懸念している。\n「顧客の意向に沿った選別」とは、「おすすめをお願いします」といった場合に、当該意向(おすすめを選別してほしいという意向)に沿った選別も許されるということか(その場合も、顧客に「おすすめを提示してほしい」と言わせる話法が発達しないか懸念している)。","pageStart":12,"pageEnd":13,"answer":"顧客が「お任せで」、「おすすめを提示してほしい」と述べた場合であっても、その意思表示のみをもって、乗合代理店が任意に特定の保険会社又は特定の保険契約を選別し、提示・推奨することは適切ではありません。\n当該意思表示がされたことを踏まえつつ、保障(補償)内容、保険料水準、特約等、顧客が重視し得る事項を確認するなど、可能な限り意向の形成を促し、又は意向の明確化に努めた上で、把握した顧客の意向に沿って、合理的かつ一定の具体性を有する基準や理由等に基づき、保険契約を選別し、提示・推奨することが重要です。\nその上で、明確な意向がなお確認できない場合に、顧客の意向に沿って保険契約を選別し、提示・推奨するためには、顧客の理解度や負担にも配慮しつつ、それまでに把握した顧客の当初意向、顧客属性、加入目的、既加入契約、保険料水準、必要と考えられる保障(補償)内容等を踏まえて、顧客の最善の利益を勘案し、合理的かつ一定の具体性を有する基準や理由等に基づき、保険契約を提示・推奨することが考えられます。\nただし、あらかじめ特定の保険契約を推奨することを目的として、顧客に「おすすめを希望する」と言わせるような話法や導線を設けること、又は手数料水準、販売目標、保険会社からの便宜供与等の代理店側の都合により、特定の保険会社又は特定の保険契約へ誘導することは適切ではありません。\nまた、ご指摘の「不透明な「適用除外」(団体保険スキーム等)」\nとして想定されている場面が不明確ですが、比較推奨販売の対象を恣意的に狭めるなど規制を潜脱するような行為や運用も適切ではありません。","theme":"意向がない場合","section":"保険業法施行規則","tags":["便宜供与","手数料・インセンティブ","比較推奨","顧客の最善の利益","団体・団体扱い"]},{"no":22,"location":"－","comment":"比較可能な同種の保険契約の説明を行った際に、保険契約を決めかねて顧客から「あなたならどこが良いと思13う？」という質問があった場合、特定の保険会社を薦めることは誘導に該当するという理解でよいか。","pageStart":13,"pageEnd":14,"answer":"貴見にあるケースが恣意的な誘導等に該当するか否かについては、個別具体的な判断を要するため、一概に回答することは困難ですが、顧客が「あなたならどこが良いと思う」という質問をした場合であっても、そのことのみをもって、乗合代理店が任意に特定の保険会社又は特定の保険契約を選別し、提示・推奨することは適切ではありません。\n当該質問がされたことを踏まえつつ、保障(補償)内容、保険料水準、特約等、顧客が重視し得る事項を確認するなど、可能な限り意向の形成を促し、又は意向の明確化に努めた上で、把握した顧客の意向に沿って、合理的かつ一定の具体性を有する基準や理由等に基づき、保険契約を選別し、提示・推奨することが重要です。\nその上で、明確な意向がなお確認できない場合に、顧客の意向に沿って保険契約を選別し、提示・推奨するためには、顧客の理解度や負担にも配慮しつつ、それまでに把握した顧客の当初意向、顧客属性、加入目的、既加入契約、保険料水準、必要と考えられる保障(補償)内容等を踏まえて、顧客の最善の利益を勘案し、合理的かつ一定の具体性を有する基準や理由等に基づき、保険契約を提示・推奨することが考えられます。\nただし、あらかじめ特定の保険商品を推奨することを目的として、顧客に「あなたならどこが良いと思う」と尋ねさせるような話法や導線を設けること、又は手数料水準、販売目標、保険会社からの便宜供与等の代理店側の都合により、特定の保険会社又は特定の保険契約へ誘導することは適切ではありません。","theme":"意向がない場合","section":"保険業法施行規則","tags":["便宜供与","手数料・インセンティブ","顧客の最善の利益"]},{"no":23,"location":"－","comment":"今後、取扱損害保険の中から顧客の意向に沿った保険契約を提案するにあたり、顧客が保険会社や保険契約で加入検討するのではなく、営業スタッフがおすすめする保険契14約で良いと言った場合、おすすめの保険契約を提案することは問題ないか。\n保険会社や保険契約に関する意向が無く、スタッフを信頼して保険に入る顧客も一定数いることから、「営業スタッフのおすすめの保険契約」が顧客の意向と捉えても問題ないか。","pageStart":14,"pageEnd":15,"answer":"顧客が「営業スタッフがおすすめする商品でよい」と述べた場合であっても、その意思表示のみをもって、乗合代理店が任意に特定の保険会社又は特定の保険契約を選別し、提示・推奨することは適切ではありません。\n当該意思表示がされたことを踏まえつつ、保障(補償)内容、保険料水準、特約等、顧客が重視し得る事項を確認するなど、可能な限り意向の形成を促し、又は意向の明確化に努めた上で、把握した顧客の意向に沿って、合理的かつ一定の具体性を有する基準や理由等に基づき、保険契約を選別し、提示・推奨することが重要です。\nその上で、明確な意向がなお確認できない場合に、顧客の意向に沿って保険契約を選別し、提示・推奨するためには、顧客の理解度や負担にも配慮しつつ、それまでに把握した顧客の当初意向、顧客属性、加入目的、既加入契約、保険料水準、必要と考えられる保障(補償)内容等を踏まえて、顧客の最善の利益を勘案し、合理的かつ一定の具体性を有する基準や理由等に基づき、保険契約を提示・推奨することが考えられます。\nただし、あらかじめ特定の保険契約を推奨することを目的として、顧客に「営業スタッフがおすすめする商品でよい」と言わせるような話法や導線を設けること、又は手数料水準、販売目標、保険会社からの便宜供与等の代理店側の都合により、特定の保険会社又は特定の保険契約へ誘導することは適切ではありません。","theme":"意向がない場合","section":"保険業法施行規則","tags":["便宜供与","手数料・インセンティブ","顧客の最善の利益"]},{"no":24,"location":"－","comment":"比較推奨販売に関する顧客への影響について、顧客の中には短時間での説明を希望する方もいる中で、比較推奨販売のために丁寧かつ分かりやすい説明を行うことで時間を要することは、顧客の意向に沿っていると言えるのかと考えている。\n顧客から見積比較は不要と申し出があった場合でも、比15較推奨販売を進めるべきか。比較推奨販売を進めた場合、形式的な比較説明をせざるを得ない状況になり、顧客の意向に沿わない募集になる可能性を懸念している。\n状況に応じて簡素化した説明で単品募集が可能な事例等を監督指針に追記いただきたい。","pageStart":15,"pageEnd":16,"answer":"貴重なご意見として承ります。\n乗合代理店が比較推奨販売を行う場合であっても、全ての案件について、全ての取扱保険会社の商品を網羅的に見積り・説明することを一律に求めるものではありません。\n顧客が短時間での説明や見積比較不要を希望する場合であっても、意向把握や本来必要となる説明が不要となるものではありません。\nその場合でも、顧客の理解度や負担にも配慮しつつ、顧客の意向、商品特性、募集形態等を踏まえて、顧客の判断に資する事項を分かりやすく説明し、可能な限り意向の形成を促し、又は意向の明確化に努めた上で、把握した顧客の意向に沿って、顧客の最善の利益を勘案し、合理的かつ一定の具体性を有する基準や理由等に基づき、保険契約を選別し、提示・推奨する必要があります。\nなお、顧客が比較不要と述べたことを理由に、手数料水準、販売目標、保険会社からの便宜供与等の代理店側の都合により、特定の保険会社又は特定の保険契約へ誘導することは適切ではありません。","theme":"意向がない場合","section":"保険業法施行規則","tags":["便宜供与","手数料・インセンティブ","比較推奨","意向把握","顧客の最善の利益"]},{"no":25,"location":"－","comment":"自動車保険の場合、商品内容や保険料にほとんど差が無い中で、保険商品の僅かな違いを突き詰めて説明することは、時間と労力がかかり代理店ビジネスに影響を与えるおそれがある他、意向が明確ではない顧客にとっても、分かりにくくならないか懸念している。\nまた、時間をかけ、資料を用いて丁寧に説明したとしても、「結局どこの保険会社が良いのか？」と顧客から質問されることが予測され、その際は結果的に営業スタッフや代理店の考える特定の保険会社をおすすめすることとなってしまわないか懸念している。\n16","pageStart":16,"pageEnd":17,"answer":"貴重なご意見として承ります。\n乗合代理店が比較推奨販売を行うに当たり、全ての案件について、全ての取扱保険会社の商品を網羅的に見積り・説明し、又は商品の細部の差異まで一律に説明することを求めるものではありません。\n商品内容や保険料水準に大きな差異がない場合には、その旨を説明した上で、顧客が重視する事項に照らし、保障(補償)内容、保険料水準、特約等、顧客の判断に資する事項を分かりやすく説明することが重要です。\nまた、上記の場合において、顧客から「どこの保険会社がよいか」と問われたときであっても、顧客の最善の利益を勘案し、顧客の意向との関係で、合理的かつ一定の具体性を有する基準や理由等を説明する必要があります。\nなお、手数料水準、販売目標、保険会社からの便宜供与等の代理店側の都合により、特定の保険会社又は特定の保険契約へ誘導することは適切ではありません。","theme":"意向がない場合","section":"保険業法施行規則","tags":["便宜供与","手数料・インセンティブ","比較推奨","顧客の最善の利益"]},{"no":26,"location":"第227条の2第3項第4号","comment":"乗合代理店が保険契約を比較又は特定の保険契約を推奨せず、顧客の求めに応じ取扱い可能な保険契約の中から、単に指定された保険契約の内容の説明を行うのみの場合は、本改正後の保険業法施行規則第227条の2第3項第4号イ及びロのいずれの要件にも該当しないことから、引き続き比較推奨販売規制の対象外となるという理解でよいか。","pageStart":17,"pageEnd":17,"answer":"保険募集人による一又は二以上の保険契約の選別・提案がされることがなく、顧客の主体的な判断のみにより、顧客から特定の保険会社又は特定の保険契約が指定され、その結果、加入の対象となる一の保険契約が選択された場合には、直ちに保険業法施行規則第227条の2第3項第4号ロ(推奨販売)に係る対応が必要となるものではありません。\nただし、その場合であっても、通常の意向把握プロセスを経る過程において、顧客の状況や意向の内容に照らし、他の保険契約についても検討の余地が認められるときには、意向把握・確認義務や比較推奨販売に係る規制の趣旨・目的を踏まえた適切な対応が求められます。\nまた、当該選択が顧客の主体的判断に基づくものであるか、又はその過程において保険募集人による恣意的な誘導が行われていないかについては、個別具体的に判断される必要があります。\nなお、顧客の判断過程において、保険募集人が営業上の理由等により恣意的に誘導する行為は適切とはいえず、厳に慎む必要があると考えます。\nまた、同号イは、乗合代理店が取り扱う保険契約の契約内容と他の保険契約の契約内容を比較して説明する場合に適用される規定であるため、顧客が特定の保険契約を選択した後においても、乗合代理店が保険募集の過程で、他の保険契約と比較して説明を行う場合には当然に適用されますのでご留意ください。","theme":"指名買い","section":"保険業法施行規則","tags":["比較推奨","意向把握"]},{"no":27,"location":"第227条の2第3項第4号","comment":"新規契約において、顧客から保険会社を指定された場合は、この点を顧客意向と捉えて取り扱っている他社の損害保険との商品比較は不要としてよいか。","pageStart":17,"pageEnd":17,"answer":"保険募集人による一又は二以上の保険契約の選別・提案がされることがなく、顧客の主体的な判断のみにより、顧客から特定の保険会社又は特定の保険契約が指定され、その結果、加入の対象となる一の保険契約が選択された場合には、直ちに保険業法施行規則第227条の2第3項第4号ロ(推奨販売)に係る対応が必要となるものではありません。\nただし、その場合であっても、通常の意向把握プロセスを経る過程において、顧客の状況や意向の内容に照らし、他の保険契約についても検討の余地が認められるときには、意向把握・確認義務や比較推奨販売に係る規制の趣旨・目的を踏まえた適切な対応が求められます。\nまた、当該選択が顧客の主体的判断に基づくものであるか、又はその過程において保険募集人による恣意的な誘導が行われていないかについては、個別具体的に判断される必要があります。\nなお、顧客の判断過程において、保険募集人が営業上の理由等により恣意的に誘導する行為は適切とはいえず、厳に慎む必要があると考えます。\nまた、同号イは、乗合代理店が取り扱う保険契約の契約内容と他の保険契約の契約内容を比較して説明する場合に適用される規定であるため、顧客が特定の保険契約を選択した後においても、乗合代理店が保険募集の過程で、他の保険契約と比較して説明を行う場合には当然に適用されますのでご留意ください。","theme":"指名買い","section":"保険業法施行規則","tags":["比較推奨","意向把握"]},{"no":28,"location":"第227条の2第3項第4号","comment":"乗合代理店において、顧客にはフリート契約である場合17や、既存契約中の損害保険会社に特段の不満がなく、同損害保険会社で契約したい場合、保険募集人との継続的な取引関係・信頼関係を重視したい場合などを基に希望されることも少なくない。\nこのような顧客の明確な意向が存在する場合においては、保険業法施行規則第227条の2第3項第4号ロを選択した場合であっても、すべての取扱保険会社を一律に比較提示することを必須とするのではなく、顧客の意向を文書等により適切に確認・記録することで、適正な意向把握・確認と認められる運用とすることも検討いただきたい。\n画一的な比較提示の義務付けは、かえって顧客の理解を阻害する可能性もあり、顧客本位の業務運営の観点からも、実態に即した柔軟な運用が必要であると考える。\n18","pageStart":17,"pageEnd":19,"answer":"今般の改正の趣旨は、保険業法に基づく意向把握を前提として、顧客の意向等に照らし、顧客による適切な商品選択の機会を確保する点にあります。\n一方で、全ての案件について、取扱保険会社の全商品を一律に試算・比較し、網羅的かつ詳細な説明を行うことまで求めるものではありません。\n例えば、顧客が、既契約の継続又は特定の保険会社での契約を重視する意向を明確に示している場合には、当該意向を踏まえて対応することが考えられます。\n他方、顧客が保険募集人との継続的な取引関係・契約関係を重視する場合や、顧客から「代理店に任せたい」などの意思表示があった場合であっても、乗合代理店において、手数料水準、販売目標、便宜供与、取引関係等、代理店又は保険募集人の都合により、特定の保険契約を選別し、又は特定の保険会社若しくは特定の保険契約へ誘導することは適切ではありません。顧客の意向を適切に把握し、当該意向に沿って選別・提案を行う場合には、保障(補償)内容、保険料水準等を総合的に勘案の上、合理的かつ一定の具体性を有する理由や基準等に基づいて保険契約を提示・推奨する必要があります。\n乗合代理店における情報提供は、顧客が適切な理解に基づき、複数の保険契約の中から顧客が自主的な判断により保険契約を選択するために行われるものです。顧客が抱えるリスクの中でどの部分を保険によってカバーするのかは顧客ごとに異なることとともに、顧客の理解度合いも様々であることを踏まえつつ、取り扱う保険契約や募集形態に応じて、顧客の意向を実質的に把握し、これに沿った情報提供を行うことが求められます。\nなお、各保険代理店においては、意向把握の内容、提示・推奨の理由及び説明内容について、事後的に確認・検証できるよう、適切に記録・保存することが重要です。","theme":"指名買い","section":"保険業法施行規則","tags":["便宜供与","手数料・インセンティブ","意向把握","証跡・記録"]},{"no":29,"location":"－","comment":"既に契約のあるお客さまに新商品等の情報提供(対面、電子メール、DM等募集行為ではないと認識)を実施するなかで、お客さまから能動的に内容を詳しく聞いて保険に入りたいと申し出があった場合は、比較推奨不要であることを確認したい。\n19","pageStart":19,"pageEnd":19,"answer":"既契約者に対する新商品案内等については、その内容・態様により保険募集に該当し得る点に留意が必要です。\nまた、当該案内等を契機として特定の保険契約に関心を有する顧客がいた場合であっても、まずは適切な意向把握を行うことが重要です。その際には、顧客の保険商品に対する理解度合いにも留意しつつ、顧客が抱えるリスクを的確に把握し、顧客が複数の保険契約の中から自主的な判断により保険契約を選択できるよう、顧客の意向を丁寧かつ適切に把握するとともに、必要な情報提供が行われることが重要です。\nその上で、保険募集人による選別・提案が実質的に伴わず、顧客の主体的な判断のみにより特定の保険契約が選択された場合には、直ちに保険業法施行規則第227条の2第3項第4号ロ(推奨販売)に係る対応が必要となるものではありません。\nただし、その場合であっても、通常の意向把握プロセスを経る過程において、乗合代理店が他の保険契約との比較説明を行う場合には同号イに係る対応が求められるとともに、顧客の状況や意向の内容に照らし、他の保険契約についても検討の余地が認められる場合には、意向把握・確認義務や比較推奨販売に係る規制の趣旨・目的を踏まえた適切な対応が求められます。\n乗合代理店においては、顧客の最善の利益を勘案する観点からも、規制の趣旨・目的を十分に踏まえ、比較推奨販売に係る規制の潜脱とならないよう、実効的な対応を行う必要があります。","theme":"指名買い","section":"保険業法施行規則","tags":["比較推奨","意向把握","顧客の最善の利益"]},{"no":30,"location":"－","comment":"保険会社が既契約者に対するDM(費用は代理店負担)により特約追加等の勧奨を行うケースもある。\nまた契約に結びついた場合、代理店としては事務処理を行い、代理店手数料を受領するが、この場合は比較推奨を行わずに保険会社を絞り込めると理解してよいか。","pageStart":20,"pageEnd":20,"answer":"ご指摘のケースに関しては、乗合代理店が費用を負担し保険会社が既契約者へDMを送付する行為の当否を含め、その前提が必ずしも明らかでないため、一律の回答は困難です。\n保険会社からのDMを契機とする手続であっても、乗合代理店が実質的に関与しているものであるか、保険募集の態様を伴うものであるか、顧客の意向はどのようなものであるのか等に応じて、個別具体的に判断される必要があります。\nなお、既契約者に対する案内を行う場合であっても、過度の便宜供与に該当しないことに留意するとともに、法令又は監督指針に定める各規制の潜脱とならないようにする必要があります。","theme":"指名買い","section":"保険業法施行規則","tags":["便宜供与","手数料・インセンティブ","比較推奨"]},{"no":31,"location":"－","comment":"推奨販売は、顧客の意向に沿って一又は二以上の保険会社に絞り込むとあるが、顧客のライフスタイルを把握している保険募集人は、そのライフスタイルに合わせて、保険会社各社の商品・サービスを提案し、その後提案する中で顧客の意向を把握し、保険契約を絞り込むという流れで問題ないか。\n20","pageStart":20,"pageEnd":20,"answer":"保険募集人は、保険業法第294条の2に基づき、顧客の意向を把握し、当該意向に沿った保険契約の提案・説明を行う必要があります。したがって、保険募集人が把握している顧客のライフスタイル等は、顧客の意向を把握する上での参考となる事情にはなり得るものの、それのみをもって顧客の意向を把握したものとして特定の保険契約の提案を行うことが適切と評価されるものではなく、顧客の意向を適切に確認した上で、これに沿った提案・説明を行う必要があります。\nなお、顧客のニーズが潜在的である場合もあり得ることから、顧客の意向を把握する過程において、顧客の理解を深めるために一般的な情報提供を行うことまで直ちに否定されるものではありません。\nただし、特定の保険契約の提案を前提として当該契約に適合するよう顧客の意向を形成し、又は誘導するような行為等は、比較推奨販売規制の潜脱に該当し得ますのでご留意ください。","theme":"意向推定","section":"保険業法施行規則","tags":["比較推奨"]},{"no":32,"location":"第227条の2第3項第4号","comment":"監督指針Ⅱ－4－2－9(5)①B.について、保険業法施行規則第227条の2第3項第4号ロにより火災保険契約を顧客の意向に沿って選別し、一又は二以上の保険契約を提示・推奨する場合、以下2つのいずれかの方法をとることは問題ないと考えてよいか。\n1.監督指針Ⅱ－4－2－2(3)①ア.(注3)に基づく損保型の意向把握ではなく、監督指針Ⅱ－4－2－2(3)①ア.(注2)\nの意向推定型により保険契約を選別し個別プランの提案・作成を行う方法。\n2.個別プラン提案前に実施する顧客の意向把握(監督指針Ⅱ－4－2－2(3)①ア.(注3)に基づく監督指針Ⅱ－4－2－2(3)②イ.(ア)\n・(イ)の意向把握)に加え、監督指針Ⅱ－4－2－2(3)①ア.(注2)の意向推定型の意向把握に基づき保険契約を選別し顧客への個別プランの作成・提案を行う方法。\n21","pageStart":21,"pageEnd":21,"answer":"Ⅱ－4－2－2(3)①ア.(注2)で定める意向推定の方法は、例えば、保険会社の営業職員が、第一分野又は第三分野の保険契約について、当初は潜在化している顧客の意向を顧客属性や生活環境等に基づき推定した上で、対面で顧客と双方向的なやり取りを通じて意向を説明・明確化しつつその変化にも対応する保険募集の場面に用いられることを想定したものです。\n特に、乗合代理店において、意向推定の方法を用いるとした場合には、推定した顧客の意向に基づき、複数の保険契約の中から選別・推奨が行われることとなるため、意向推定の合理性・妥当性が推奨販売の適切性に直結し得ることとなります。乗合代理店が当該方法を用いる場合には、こうした観点を十分に踏まえ、推定の確度を含め、その合理性・妥当性の確保について特に慎重な検討・判断が求められるとともに、その後の保険募集の過程において、顧客の意向を丁寧かつ明確に確認し、その結果に基づく適切な選別・推奨を行う必要があります。\nしたがって、火災保険に係る保険契約について、意向推定の方法を用いることの適切性については、上記の考え方を踏まえつつ、個別具体的かつ実質的に判断される必要があります。\nなお、特定の保険契約を選別・推奨するに当たり、特定の保険契約の選別・推奨をあらかじめ企図した上でこれに適合するように意向を推定しているときや、顧客の主体的な意向形成を経たものとはいえないとき、又は保険募集人による恣意的な誘導が認められるときは、比較推奨販売規制の潜脱に該当し得ます。","theme":"意向推定","section":"保険業法施行規則","tags":["比較推奨","意向把握"]},{"no":33,"location":"－","comment":"単純な保険料比較システムを販売し、あたかも比較推奨が行えるように謳っているケースがある。仮に販売する会社が大規模代理店傘下のシステム会社であった場合、各保険会社が一概には非開示情報である各種試算情報を特定の会社にのみ提供することは、外形的には特定の大規模代理店に対する便宜供与を行っていると考えるが、この理解でよいか。\nまた、システム的に各社保険料と一部補償を一覧表示する場合には、恣意的な余地を含めないためにも、手数料明示を義務付けるなどの対策も必要ではないか。\n上記質問の趣旨は、単純な保険料比較をもって今回や前回の改正保険業法の趣旨から逸脱し、安易な比較のみをもって意向把握を履行していると考えているケースが多いと認識している危機感から意見するものである。\n本来、取扱保険会社商品の知識を向上し、顧客にお伝えし、ご意向を伺うこと、とかけ離れていくのではないかと考えている。特に、今般の改正保険業法で、「具体的な事例」として保険料が述べられているが、貴庁の考えと異なる流れを助長する恐れがあると考えているため、確認させていただきたい。\n今般の改正が、顧客の最善利益を勘案し、顧客意向を踏まえた適切な比較推奨販売の実現を目的とするものであることに鑑み、単なる価格比較のみをもって義務を履行したとみなす運用がなされないよう、実務上の留意点について明確な指針をお示しいただきたい。\n22","pageStart":22,"pageEnd":22,"answer":"情報提供先が大規模代理店傘下のシステム会社であることのみをもって、直ちに便宜供与に該当するものではありません。提供目的、情報の内容・価値、提供条件、利用範囲、システムの仕様・運用実態等を踏まえ、個別具体的に判断されます。\nまた、システムを利用する場合も、顧客の意向を適切に把握し、これに沿って保険契約を選別し、提示・推奨する必要があります。\n単なる保険料比較やシステムの出力結果の提示のみをもって、意向把握又は比較推奨販売に係る対応を履行したことにはなりません。比較に当たっては、Ⅱー4ー2－2(9)④などにも留意しつつ、保障(補償)内容その他の契約条件も含め、顧客が適切に判断できるよう説明することが重要です。\n乗合代理店は、選定ロジック、使用データ、比較対象、表示方法等について、手数料水準、販売目標、便宜供与等により特定の保険会社又は特定の保険契約への誘導が生じていないかを確認・検証し、必要な教育・管理態勢を整備する必要があります。\nなお、代理店手数料の顧客への明示を、今般の改正において一律に義務付けることは予定していません。","theme":"比較ツール","section":"保険業法施行規則","tags":["便宜供与","手数料・インセンティブ","比較推奨","意向把握","システム・比較ツール"]},{"no":34,"location":"－","comment":"損害保険における比較推奨販売について、乗合代理店が複数の保険契約を実務上の実効性と安定性を担保した上で実施し、結果として損害保険市場における健全な競争環境の維持・発展が促進され、消費者利益が確保されることを目指していくと考えておりますが、当局の認識に相違ないか確認させていただきたい。\n生命保険分野では、顧客の意向を把握したうえで保険料データを活用した比較推奨制度が整備され軌道に乗っていると認識している。今回、損害保険分野においても、顧客の最善の利益の観点から同様の取組を進めることは望ましい姿である。しかしながら、損害保険の保険料算出は生命保険以上にパラメータが多岐にわたり、誤った条件設定や設計ロジックにより不正確な比較結果を提示するリスクも高い。\nそのような前提である中、損害保険分野では保険料収入の大半を占める主要損害保険会社による情報連携(データ提供)が限定的である結果、市場全体の保険料カバー率が低く、比較推奨制度の前提となる『網羅的・客観的な比較』\nが実務上成立しない状況にあり、同一制度の下で生損保横断的に非対称な状況が生じている。\n改正保険業法施行規則が求める顧客本位の比較推奨制度の実効性確保の観点から、客観的基準を満たすシステム事業者等に対しては、主要損害保険会社による適切な情報提供を促す政策的対応を検討いただきたい。\nなお、保険料データの開放は無限定に行われるべきでは23なく、生命保険領域等において既に長期間、網羅的・客観的な比較推奨を安定的に運用し、誤情報提供を防ぐための品質管理やガバナンス体制を備えた事業者へ限定されることが、消費者保護の観点から合理的である。この整理により、「情報開放による市場の不透明性解消(公平性)」と「品質担保による誤情報防止(消費者保護)」という一見相反する要求は、制度的に両立可能となる。","pageStart":23,"pageEnd":24,"answer":"比較推奨販売の具体的な実施方法は、保険募集の実務、募集形態、取扱商品、顧客の意向等に応じ、各保険会社及び各乗合代理店において適切に検討されるべきものと考えます。\n損害保険分野においても、顧客の意向に沿った適切な比較推奨販売が行われ、顧客が自主的に保険契約を選択できる環境を確保することは重要です。そのため、比較ツール、ITツール、外部システム等の活用は、商品改定や特約の差異を適時に反映し、比較推奨販売の適切な実施、顧客理解の促進及び募集管理態勢の高度化に資する取組の一つとなり得ます。\nただし、これらのツール等の活用を、一律に募集管理態勢の標準的要件として求めるものではなく、各乗合代理店においては、規模・業務特性、取扱商品等を踏まえ、創意工夫による実効的な方法により、顧客に誤認を与えない情報提供を行うことが重要です。\nまた、システムを利用する場合も、顧客の意向を適切に把握し、これに沿って保険契約を選別し、提示・推奨する必要があります。\n単なる保険料比較やシステムの出力結果の提示のみをもって、意向把握又は比較推奨販売に係る対応を履行したことにはなりません。比較に当たっては、Ⅱ－4－2－2(9)④などにも留意しつつ、保障(補償)内容その他の契約条件も含め、顧客が適切に判断できるよう説明することが重要です。\nその上で、比較ツール、ITツール、外部システム等を用いる場合には、掲載情報の正確性・最新性、比較の前提条件、保障(補償)\n内容、保険料算定条件、対象商品、表示順、比較ロジック等について、顧客に誤認を与えないよう留意するとともに、特定の保険会社又は特定の保険契約へ恣意的に誘導するものとならないよう、適切に管理・検証する必要があります。\nなお、保険会社による外部事業者等へのデータ提供の在り方については、個別の契約関係、情報管理、正確性の確保、顧客保護、競争環境等を踏まえ、各社において適切に判断されるべきものと考えます。","theme":"比較ツール","section":"保険業法施行規則","tags":["比較推奨","意向把握","顧客の最善の利益","システム・比較ツール"]},{"no":35,"location":"－","comment":"頻繁な商品改定に対するITツールの活用について、商品改定や特約の差異を人力で網羅することは物理的に不可能であり、形式的な比較に陥る原因となる。\n恣意性を排除した「適切な情報提供」を継続するには、常に最新情報を反映したITツールの活用を、募集管理態勢の標準的要件として求めるべきではないか。","pageStart":24,"pageEnd":24,"answer":"比較推奨販売の具体的な実施方法は、保険募集の実務、募集形態、取扱商品、顧客の意向等に応じ、各保険会社及び各乗合代理店において適切に検討されるべきものと考えます。\n損害保険分野においても、顧客の意向に沿った適切な比較推奨販売が行われ、顧客が自主的に保険契約を選択できる環境を確保することは重要です。そのため、比較ツール、ITツール、外部システム等の活用は、商品改定や特約の差異を適時に反映し、比較推奨販売の適切な実施、顧客理解の促進及び募集管理態勢の高度化に資する取組の一つとなり得ます。\nただし、これらのツール等の活用を、一律に募集管理態勢の標準的要件として求めるものではなく、各乗合代理店においては、規模・業務特性、取扱商品等を踏まえ、創意工夫による実効的な方法により、顧客に誤認を与えない情報提供を行うことが重要です。\nまた、システムを利用する場合も、顧客の意向を適切に把握し、これに沿って保険契約を選別し、提示・推奨する必要があります。\n単なる保険料比較やシステムの出力結果の提示のみをもって、意向把握又は比較推奨販売に係る対応を履行したことにはなりません。比較に当たっては、Ⅱ－4－2－2(9)④などにも留意しつつ、保障(補償)内容その他の契約条件も含め、顧客が適切に判断できるよう説明することが重要です。\nその上で、比較ツール、ITツール、外部システム等を用いる場合には、掲載情報の正確性・最新性、比較の前提条件、保障(補償)\n内容、保険料算定条件、対象商品、表示順、比較ロジック等について、顧客に誤認を与えないよう留意するとともに、特定の保険会社又は特定の保険契約へ恣意的に誘導するものとならないよう、適切に管理・検証する必要があります。\nなお、保険会社による外部事業者等へのデータ提供の在り方については、個別の契約関係、情報管理、正確性の確保、顧客保護、競争環境等を踏まえ、各社において適切に判断されるべきものと考えます。","theme":"比較ツール","section":"保険業法施行規則","tags":["比較推奨","意向把握","システム・比較ツール"]},{"no":36,"location":"－","comment":"比較対象商品の選別理由を、システム等によりあらかじめ定めたロジックに基づいて行うことは許容されるか。\n改正後の比較推奨においては、見積結果ではなく顧客の意向に基づいて比較対象商品を選別することが求められているが、この選別を個々の保険募集人の裁量に委ねた場合、説明内容や判断基準にばらつきが生じ、結果として比較推奨の客観性・再現性が損なわれるおそれがある。\nこれに対し、顧客の意向把握項目と比較軸との対応関係をあらかじめ整理し、当該ロジックに基づいてサンプル保険料も提示しながら比較対象商品を選別する仕組みを用いることは、恣意性を排除し、比較推奨プロセスの透明性・一貫性を確保する上で有効であると考えられる。\n24また、当該ロジックに基づく選別結果及びその理由を記録として残すことにより、事後的な検証や説明責任にも対応可能であり、顧客保護及び募集管理の観点からも合理的である。さらに、ロジックによる統一的選別は、募集人間・店舗間の説明差異の抑制、保険募集人の恣意的判断の排除、顧客間の説明の公平性を確保等に有益である。\nしたがって、比較対象商品の選別について、顧客の意向を前提とした一定のルール・ロジックを用いて行うことは、改正趣旨に反するものではなく、むしろ適切な比較推奨を担保する方法として許容されるとの整理が望ましいと考えるが如何か。","pageStart":24,"pageEnd":25,"answer":"比較対象となる保険契約の選別について、一定のルールやシステムを活用することは、比較推奨販売の適切な実施、募集品質の確保及び管理態勢の高度化に資する取組の一つとなり得るものと考えられます。\n一方で、この場合には、顧客の意向に応じた適切な比較対象となる保険契約の選別が行われるよう設計・運用されることが重要であり、掲載情報の正確性・最新性、比較の前提条件、保障(補償)\n内容、保険料算定条件、対象商品、表示順、比較ロジック等について、顧客に誤認を与えないよう留意する必要があります。また、その設計や運用の内容によっては、画一的に不適切な選別・提案が行われるおそれもあることから、その設計、運用、検証及び適時の見直しが適切に実施されることが重要です。\nまた、システムを利用する場合も、顧客の意向を適切に把握し、これに沿って保険契約を選別し、提示・推奨する必要があります。\n単なる保険料比較やシステムの出力結果の提示のみをもって、意向把握又は比較推奨販売に係る対応を履行したことにはなりません。比較に当たっては、Ⅱ－4－2－2(9)④などにも留意しつつ、保障(補償)内容その他の契約条件も含め、顧客が適切に判断できるよう説明することが重要です。\nいずれにせよ、顧客の意向に応じた適切な比較推奨販売が継続的に確保されるよう、実効的な管理態勢が整備・構築されることが重要であると考えます。","theme":"比較ツール","section":"保険業法施行規則","tags":["比較推奨","意向把握","証跡・記録","システム・比較ツール"]},{"no":37,"location":"－","comment":"本部主導で統一した比較推奨プロセスを定め、これをフランチャイズ店舗等において共通に用いることは許容されるか。\nとりわけ、損害保険領域において、改正後の比較推奨においては、保険募集人個々の説明能力や経験に依存するのではなく、顧客の意向把握から比較対象商品の選別、推奨理由の説明に至るまでのプロセス全体として、適切性・一貫性が確保されていることが重要であると考えられる。\n仮に各店舗・各保険募集人に大幅な裁量が委ねられる場合、同一の意向内容であっても比較結果や説明内容に差異が生じ、顧客間の公平性や募集品質の確保が困難となるおそれがある。\nこれに対し、本部において顧客の意向把握項目、比較軸の整理方法、比較対象商品の選別プロセス等を統一的に定25め、これを各店舗において共通に用いることは、比較推奨の品質を一定水準以上に保ち、顧客に対して分かりやすく説明する上で合理的である。\nまた、当該プロセスに基づき募集を行うことにより、本部による監督・指導、内部監査等も実効性をもって実施可能となり、改正趣旨である顧客本位の業務運営及び募集管理態勢の高度化にも資するものと考えられる。\nしたがって、本部主導で統一した比較推奨プロセスを定め、これを共通に用いることは、改正後の比較推奨の枠組みにおいても許容されるとの整理が望ましいと考える。","pageStart":25,"pageEnd":26,"answer":"保険募集人指導事業を行う者については、保険業法施行規則第227条の15に基づき、指導対象の保険募集人に対する適切な指導及び管理を行うための体制を整備することが求められています。\nその上で、比較推奨販売に係るプロセスの策定及び運用について、フランチャイズ本部において一定のルールを定め、その加盟店において共通のプロセスを用いることは、募集品質の確保や管理態勢の高度化に資する取組となり得る場合があるものと考えられます。ただし、その具体的な内容や運用の在り方については、契約関係や具体的な業務運営の実態等を踏まえ、当事者間において定められる事項であると考えます。\nなお、比較推奨販売に係るプロセスを共通化する場合であっても、その内容が顧客の意向に応じた適切な比較推奨販売が行われるものとなるよう、設計、運用、検証及び適時の見直しが適切に実施されることが重要です。\nいずれにせよ、顧客の意向に応じた適切な比較推奨販売を確保するため、保険募集人指導事業を行う者による適切な指導・管理を通じて、各指導対象の保険募集人において実効的な管理態勢が整備・構築されるよう、両当事者間において適切に対応することが重要であると考えます。","theme":"比較ツール","section":"保険業法施行規則","tags":["比較推奨","意向把握"]},{"no":38,"location":"－","comment":"推奨理由等の裏付けとなるデータの時期や定義が損害保険会社ごとに異なることが想定される。時期やデータが異なっていると顧客が戸惑うことになることから、例えば損害保険協会から業界共通のデータを提供いただきたい。","pageStart":26,"pageEnd":26,"answer":"業界団体による共通データの提供要否に関する事項については、当該団体における個別の判断事項であり、当局として回答する立場にございません。\n比較推奨販売を行う場合にデータを用いること自体は否定されません。ただし、保険募集人は、データの出典、定義、対象範囲、基準時点等を確認し、比較条件の相違を含め、顧客に誤認を与えないよう適切に説明する必要があります。","theme":"比較ツール","section":"保険業法施行規則","tags":["比較推奨"]},{"no":39,"location":"第227条の2第3項第4号","comment":"保険業法施行規則第227条の2第3項第4号ロにおいて、「二以上の所属保険会社等を有する保険募集人が取り扱う保険契約」とあるが、改正案における「保険募集人が取り扱う保険契約」の解釈をお示しいただきたい。\n基本的には、委託契約で販売が認められている保険契約を「取り扱う保険契約」と解釈するのが自然であり、顧客へ権限明示を行うこととの関係でも自然であると思われるが、例えば、乗合代理店が売れ行きの悪い保険契約の取26扱いをしないと独自に決めて顧客へ提示しないといった行為や、保険会社との何らかの関係性を重視し他の保険会社の保険契約を売らない(取り扱わないと整理する。)といった行為を、「保険募集人が取り扱っていない」と解釈することは顧客本位の業務運営上疑義があると考えるが如何か。","pageStart":26,"pageEnd":27,"answer":"貴見のとおりです。\nご指摘のように、乗合代理店の判断のみにより、乗合代理店の都合や保険会社との関係性を理由として、取扱保険会社や保険契約を恣意的に限定し、顧客の適切な商品選択の機会を実質的に阻害する業務運営は、適切ではありません。\n保険業法施行規則第227条の2第3項第4号ロにおける「取り扱う保険契約」とは、所属保険会社等との代理店委託契約又はこれに基づく覚書等により、当該代理店が取り扱うこととされている保険契約を指すものであり、「二以上の比較可能な同種の保険契約」\nについても、当該委託契約又はこれに基づく覚書等により、当該代理店が取り扱うこととされている保険契約を前提に判断されます。\nその上で、保険会社と乗合代理店との間で当該委託契約又はこれに基づく覚書等により取り扱う保険契約を限定する場合であっても、顧客本位の業務運営の確保を目的とする合理的な理由なく、形式的な委託範囲の限定を行うことにより、保険会社からの便宜供与等の見返りとして、特定の保険会社の保険契約を優先的に取り扱うなど、顧客の適切な商品選択の機会を実質的に阻害するおそれのある業務運営を行う場合には、比較推奨販売規制を潜脱するものとして問題となり得ます。\nまた、顧客に対しては、権限明示を適切に実施するとともに、当該限定を行う場合には、当該乗合代理店が取り扱う保険契約の範囲について誤認を与えないよう、適切に説明することが重要です。","theme":"比較可能な同種の保険契約","section":"保険業法施行規則","tags":["便宜供与","比較推奨"]},{"no":40,"location":"第227条の2第3項第4号","comment":"保険会社への乗合については、当該保険代理店の意向に関わらず乗合を実施しているケースが存在する。\n不動産会社(賃貸管理会社)のケースでは、入居者への火災保険の募集は1社に限定しているものの、建物の火災保険についてはグループの保険代理店から情報連携を受ける目的として、複数社乗り合うケースが存在する。\nこれは、自然災害が発生した場合に、問い合わせを受けるのは賃貸管理会社であるため、洪水・地震などが発生した場合において、保険契約者に対してスムーズに対応する27ために保険契約の情報連携を目的とした対応であり、顧客本位の業務運営に資する対応と考えている。\n一方で、上記の対応を行う結果として、入居者が加入する火災保険について比較推奨販売を行う必要が生じる場合がある。\nこの対応は保険代理店(不動産会社(賃貸管理会社))が行う顧客本位の趣旨に適さない結果となり得る。","pageStart":27,"pageEnd":28,"answer":"保険業法施行規則第227条の2第3項第4号ロに定める「二以上の比較可能な同種の保険契約」は、代理店委託契約又はこれに基づく覚書等により、当該代理店が取り扱うこととされている保険契約を前提に判断されます。\nしたがって、入居者向け火災保険については1社のみを取り扱い、他社との乗合いは建物火災保険に係る情報連携・保全対応等を目的とするものであって、他社の入居者向け火災保険を実際に募集できないことが当該委託契約又は覚書等により明確化されている場合には、当該他社商品は入居者向け火災保険の推奨販売における「二以上の比較可能な同種の保険契約」に含まれないものと考えられます。また、このとき、取り扱えない当該保険契約が誤って顧客へ提案されないよう、保険会社及び乗合代理店において実態に即して実効的に管理されることが重要と考えます。\n一方で、当該委託契約上は他社商品も募集可能であるにもかかわらず、乗合代理店の判断のみで入居者向け火災保険を1社に限定し、当該他社商品を当然に比較対象外とすることは適切ではありません。\nなお、顧客本位の業務運営の確保を目的とする合理的な理由なく、形式的な委託範囲の限定を行うことにより、保険会社からの便宜供与等の見返りとして、特定の保険会社の保険契約を優先的に取り扱うなど、顧客の適切な商品選択の機会を実質的に阻害するおそれのある業務運営を行う場合には、比較推奨販売規制を潜脱するものとして問題となり得ます。\nまた、顧客に対しては、権限明示を適切に実施するとともに、当該保険代理店が取り扱う保険契約の範囲について誤認を与えないよう、分かりやすく説明することが重要です。","theme":"比較可能な同種の保険契約","section":"保険業法施行規則","tags":["便宜供与","比較推奨"]},{"no":41,"location":"第227条の2第3項第4号","comment":"二以上の所属保険会社のうち、提案する保険契約の保険期間内に代理店委託契約を解除する予定がある場合、その旨を説明し、顧客が当該保険会社の保険契約の提案を望まない場合は、当該保険会社を比較推奨の対象から除外しても問題ないか。\n28","pageStart":28,"pageEnd":29,"answer":"代理店委託契約の終了予定があった場合であっても、その旨を顧客に説明したこと等のみをもって、当該保険会社の保険契約を当然に比較推奨販売の対象外とすることは適切ではありません。\n保険業法施行規則第227条の2第3項第4号ロに定める「二以上の比較可能な同種の保険契約」は、代理店委託契約又はこれに基づく覚書等により、当該代理店が取り扱うこととされている保険契約を前提に判断されます。\nしたがって、当該委託契約の解消に向けた準備期間中であっても、新規募集を停止する場合には、所属保険会社等との間で、例えば、新規募集停止の対象となる保険契約、停止時期、既契約の保全・更改対応の範囲等について、当該委託契約又はこれに基づく覚書等により明確化されているときは、新規募集の場面において、当該保険契約は「二以上の比較可能な同種の保険契約」に含まれないものと考えられます。また、このとき、取り扱えない保険契約が誤って顧客へ提案されないよう、保険会社及び乗合代理店において実態に即して実効的に管理されることが重要と考えます。\nまた、顧客に対しては、権限明示を適切に実施するほか、取扱保険会社・保険契約の範囲や、当該保険契約を新規に提示・推奨しない理由について、誤認を与えないよう適切に説明する必要があります。","theme":"比較可能な同種の保険契約","section":"保険業法施行規則","tags":["比較推奨","更改・継続"]},{"no":42,"location":"第227条の2第3項第4号","comment":"当社は自動車販売を主業とする3社が乗り合う兼業乗合代理店である。\n現在、保険業法施行規則第227条の2第3項第4号ハに基づき、いわゆるテリトリー制で保険募集を行っているが、今後は同号ロに基づく保険募集を行うことを検討している。\n乗り合っている3社のうち1社はほぼ新規の取扱いがない保険会社であるものの、保有契約が多く残っているため、乗合解消はできない状況である。\nついては、保有契約の更新は3社で対応しつつ、新規契約については2社のみで取り扱う運用としても問題ないか確認したい。","pageStart":29,"pageEnd":29,"answer":"既契約者対応のために代理店委託契約を継続することのみをもって、当該保険会社の保険契約を当然に比較推奨販売の対象外とすることは適切ではありません。\n保険業法施行規則第227条の2第3項第4号ロに定める「二以上の比較可能な同種の保険契約」は、代理店委託契約又はこれに基づく覚書等により、当該代理店が取り扱うこととされている保険契約を前提に判断されます。\nしたがって、既契約者対応のみへの移行に伴い、一部の保険契約の新規募集を停止する場合には、所属保険会社等との間で、例えば、新規募集停止の対象となる保険契約、停止時期、既契約の保全・更改対応の範囲等について、当該委託契約又はこれに基づく覚書等により明確化されているときは、新規募集の場面において、当該保険契約は「二以上の比較可能な同種の保険契約」に含まれないものと考えられます。また、このとき、取り扱えない当該保険契約が誤って顧客へ提案されないよう、保険会社及び乗合代理店において実態に即して実効的に管理されることが重要と考えます。なお、顧客本位の業務運営の確保を目的とする合理的な理由なく、形式的な委託範囲の限定を行うことにより、保険会社からの便宜供与等の見返りとして、特定の保険会社の保険契約を優先的に取り扱うなど、顧客の適切な商品選択の機会を実質的に阻害するおそれのある業務運営を行う場合には、比較推奨販売規制を潜脱するものとして問題となり得ます。\nまた、顧客に対しては、権限明示を適切に実施するほか、取扱保険会社・保険契約の範囲や、当該保険契約を新規に提示・推奨しない理由について、誤認を与えないよう適切に説明する必要があります。","theme":"比較可能な同種の保険契約","section":"保険業法施行規則","tags":["便宜供与","比較推奨","ハ方式","更改・継続"]},{"no":43,"location":"－","comment":"比較推奨販売が難しいと考え、2社以上の保険会社の取29扱いを終了する乗合代理店が出てくると考えられる。\nただし、乗合代理店の都合で引受保険会社の変更、もしくは顧客に対して引受不可の案内を行うことは好ましくないと考えられ、保有契約があることから委託契約を継続せざるを得ない乗合代理店が一定数存在する。\nその場合、更新契約のために2社以上の保険会社の取扱いを継続し、新規契約については1社のみ取り扱うことは可能か。\n例えば、A保険会社及びB保険会社を取り扱う乗合代理店において、これまでいわゆるテリトリー制で自動車保険を販売していた。\n監督指針の改正を受け、新規募集についてはA保険会社に絞る一方で、更新契約の対応を目的としてB保険会社との委託契約も継続するケースを想定している。\n当該乗合代理店が取り扱うB保険会社の契約を他の保険代理店に移管することで専属代理店になることは可能であるものの、保険契約者は当該乗合代理店との信頼関係から保険加入をしている側面もあると考えており、1社専属への変更は顧客本位の業務運営の観点から疑問である。\n法令に反しない前提において、乗合代理店が信義則に則って顧客対応を行う場合には、新規募集を行わないB保険会社との委託契約を継続しつつ、新規募集を行うA保険会社のみの保険募集を行うことも可能であると認識してよいか。","pageStart":29,"pageEnd":30,"answer":"既契約者対応のために代理店委託契約を継続することのみをもって、当該保険会社の保険契約を当然に比較推奨販売の対象外とすることは適切ではありません。\n保険業法施行規則第227条の2第3項第4号ロに定める「二以上の比較可能な同種の保険契約」は、代理店委託契約又はこれに基づく覚書等により、当該代理店が取り扱うこととされている保険契約を前提に判断されます。\nしたがって、既契約者対応のみへの移行に伴い、一部の保険契約の新規募集を停止する場合には、所属保険会社等との間で、例えば、新規募集停止の対象となる保険契約、停止時期、既契約の保全・更改対応の範囲等について、当該委託契約又はこれに基づく覚書等により明確化されているときは、新規募集の場面において、当該保険契約は「二以上の比較可能な同種の保険契約」に含まれないものと考えられます。また、このとき、取り扱えない当該保険契約が誤って顧客へ提案されないよう、保険会社及び乗合代理店において実態に即して実効的に管理されることが重要と考えます。なお、顧客本位の業務運営の確保を目的とする合理的な理由なく、形式的な委託範囲の限定を行うことにより、保険会社からの便宜供与等の見返りとして、特定の保険会社の保険契約を優先的に取り扱うなど、顧客の適切な商品選択の機会を実質的に阻害するおそれのある業務運営を行う場合には、比較推奨販売規制を潜脱するものとして問題となり得ます。\nまた、顧客に対しては、権限明示を適切に実施するほか、取扱保険会社・保険契約の範囲や、当該保険契約を新規に提示・推奨しない理由について、誤認を与えないよう適切に説明する必要があります。","theme":"比較可能な同種の保険契約","section":"保険業法施行規則","tags":["便宜供与","比較推奨","更改・継続"]},{"no":44,"location":"－","comment":"取扱い可能な全保険契約を比較推奨することはハード30ルが高い。\n例えば、A・B・C社を取り扱う乗合代理店において、新規募集はA・B社に絞りこむものの、C社は保有契約が満期を迎えるまで委託解除しない予定である。\nその場合でも、3社の委託がある限りにおいては3社の保険契約を比較推奨する必要があるのか。\nまた、C社の契約がわずかでも残り続けた場合は現場の負担が減ることはないがどうすればよいか。\nC社の委託を解除し、他保険代理店に移管するという方法も考えられるが、そうした場合、加入時の保険代理店のサポートを受けることができず、顧客が不利益を被る可能性があるが、顧客に許容してもらう必要があるのか。","pageStart":30,"pageEnd":31,"answer":"既契約者対応のために代理店委託契約を継続することのみをもって、当該保険会社の保険契約を当然に比較推奨販売の対象外とすることは適切ではありません。\n保険業法施行規則第227条の2第3項第4号ロに定める「二以上の比較可能な同種の保険契約」は、代理店委託契約又はこれに基づく覚書等により、当該代理店が取り扱うこととされている保険契約を前提に判断されます。\nしたがって、既契約者対応のみへの移行に伴い、一部の保険契約の新規募集を停止する場合には、所属保険会社等との間で、例えば、新規募集停止の対象となる保険契約、停止時期、既契約の保全・更改対応の範囲等について、当該委託契約又はこれに基づく覚書等により明確化されているときは、新規募集の場面において、当該保険契約は「二以上の比較可能な同種の保険契約」に含まれないものと考えられます。また、このとき、取り扱えない当該保険契約が誤って顧客へ提案されないよう、保険会社及び乗合代理店において実態に即して実効的に管理されることが重要と考えます。なお、顧客本位の業務運営の確保を目的とする合理的な理由なく、形式的な委託範囲の限定を行うことにより、保険会社からの便宜供与等の見返りとして、特定の保険会社の保険契約を優先的に取り扱うなど、顧客の適切な商品選択の機会を実質的に阻害するおそれのある業務運営を行う場合には、比較推奨販売規制を潜脱するものとして問題となり得ます。\nまた、顧客に対しては、権限明示を適切に実施するほか、取扱保険会社・保険契約の範囲や、当該保険契約を新規に提示・推奨しない理由について、誤認を与えないよう適切に説明する必要があります。","theme":"比較可能な同種の保険契約","section":"保険業法施行規則","tags":["便宜供与","比較推奨","更改・継続","委託解除"]},{"no":45,"location":"第227条の2第3項第4号","comment":"保険業法施行規則第227条の2第3項第4号ロの一般的な考え方については、改正された府令の条文に反しない限り、「「平成26年改正保険業法(2年以内施行)に係る政府令・監督指針案」に対するパブリックコメント結果等について」における「コメントの概要及びコメントに対する金融庁の考え方」を継承しているという理解でよいか。\n例えば、「絞り込み」を行う前の取扱保険契約の範囲は「保険会社から販売を委託された保険契約(同パブリックコメントNo.510)」であるが、社内規則で当該保険契約の販売を行わないとしている場合(特定の営業店、特定の場合に行わないことを含む。)には、取扱保険契約の範囲を狭めることができるという理解でよいか(同パブリックコメントNo.476及びNo.510参照)\n。\n31","pageStart":31,"pageEnd":32,"answer":"過去のパブリックコメントにおける考え方については、公表時点の規定内容を前提とするものであり、今般の改正後は、改正の趣旨及び改正後の規定に即して判断する必要があります。\nその上で、保険業法施行規則第227条の2第3項第4号ロの「取り扱う保険契約」とは、所属保険会社等との代理店委託契約又はこれに基づく覚書等により、当該乗合代理店が取り扱うこととされている保険契約を指します。\nしたがって、乗合代理店が社内規則等のみで取扱保険契約を限定し、比較推奨販売の対象外とすることは適切ではありません。\n取扱範囲を限定する場合には、所属保険会社等との間で、対象となる保険契約の範囲や取扱いについて、当該委託契約又はこれに基づく覚書等により明確化されているときは、保険募集の場面において、当該保険契約は「二以上の比較可能な同種の保険契約」\nに含まれないものと考えられます。また、このとき、取り扱えない当該保険契約が誤って顧客へ提案されないよう、保険会社及び乗合代理店において実態に即して実効的に管理されることが重要と考えます。\nなお、顧客本位の業務運営の確保を目的とする合理的な理由なく、形式的な委託範囲の限定を行うことにより、保険会社からの便宜供与等の見返りとして、特定の保険会社の保険契約を優先的に取り扱うなど、顧客の適切な商品選択の機会を実質的に阻害するおそれのある業務運営を行う場合には、比較推奨販売規制を潜脱するものとして問題となり得ます。\nまた、顧客に対しては、権限明示を適切に実施するとともに、当該保険代理店が取り扱う保険契約の範囲について誤認を与えないよう、分かりやすく説明することが重要です。","theme":"比較可能な同種の保険契約","section":"保険業法施行規則","tags":["便宜供与","比較推奨"]},{"no":46,"location":"第227条の2第3項第4号","comment":"保険業法施行規則第227条の2第3項第4号ロについて、社内において販売停止としたものは、「当該二以上の所属保険会社等を有する保険募集人が取り扱う保険契約」\nに含まれないことが実務上の取り扱いであるが、その理解でよいか。\nなお、「「平成26年改正保険業法(2年以内施行)に係る政府令・監督指針案」に対するパブリックコメント結果等について」における「コメントの概要及びコメントに対する金融庁の考え方」No.510の「保険会社から販売を委託された商品は取扱可能な商品となります。ただし、例えば、社内規則において、店舗に応じて取扱商品を決めている場合には、その範囲内となります。\n」の「例えば」は例示に過32ぎないと実務上理解されている。","pageStart":32,"pageEnd":33,"answer":"「「平成26年改正保険業法(2年以内施行)に係る政府令・監督指針案」に対するパブリックコメント結果等について」における「コメントの概要及びコメントに対する金融庁の考え方」については、公表時点における制定趣旨及び規定内容に照らして金融庁の考え方を回答しているものです。\n今般の改正では、監督指針の規定内容についても、保険業法施行規則第227条の2第3項第4号ハが削除される趣旨を踏まえ、再整理を行っています。このため、改正前の監督指針の規定内容を前提とした解釈については、今般の改正の趣旨や改正後の規定に基づき判断される必要があります。\nその上で、乗合代理店の判断で特定の保険契約を販売停止することのみをもって、当該保険契約を当然に比較推奨販売の対象外とすることは適切ではありません。\n同号ロに定める「二以上の比較可能な同種の保険契約」は、代理店委託契約又はこれに基づく覚書等により、当該代理店が取り扱うこととされている保険契約を前提に判断されます。\nしたがって、所属保険会社等との間で、例えば、募集停止の対象となる保険契約、停止時期、既契約の保全対応等について、代理店委託契約又は覚書等により明確化されているときは、保険募集の場面において、当該保険契約は「二以上の比較可能な同種の保険契約」に含まれないものと考えられます。また、このとき、取り扱えない当該保険契約が誤って顧客へ提案されないよう、保険会社及び乗合代理店において実態に即して実効的に管理されることが重要と考えます。\nなお、顧客本位の業務運営の確保を目的とする合理的な理由なく、形式的な委託範囲の限定を行うことにより、保険会社からの便宜供与等の見返りとして、顧客に対して特定の保険会社の保険契約を優先的に取り扱うなど、顧客の適切な商品選択の機会を実質的に阻害するおそれのある業務運営を行う場合には、比較推奨販売規制を潜脱するものとして問題となり得ます。\nまた、顧客に対しては、権限明示を適切に実施するとともに、当該保険会社について、「新規募集は行わず、既契約の保全・異動対応のみを行う」旨など、取扱範囲について誤認を与えないよう適切に説明することが重要です。","theme":"比較可能な同種の保険契約","section":"保険業法施行規則","tags":["便宜供与","比較推奨","ハ方式"]},{"no":47,"location":"第227条の2第3項第4号","comment":"今般の保険業法改正に係る内閣府令(案)等において、乗合代理店における比較推奨販売の確保が記載されているが、損害保険1社・生命保険1社のみを取扱う保険代理店に33おいても、顧客の意向に対して2以上の代替可能な保険契約がある場合は、比較推奨の対象になると考えているが相違ないか。\n(例：生命保険の就業不能保険と損害保険の所得補償保険など。顧客の「就業不能リスクを補完したい」という意向に照らせば、いずれも検討対象となるケース)。\n「「平成26年改正保険業法(2年以内施行)に係る政府令・監督指針案」に対するパブリックコメント結果等について」における「コメントの概要及びコメントに対する金融庁の考え方」でも同種のコメントは承知しているが、今般の改正で改めて確認するもの。","pageStart":33,"pageEnd":34,"answer":"貴見のとおり、乗合代理店が損害保険会社1社・生命保険会社1社と代理店委託契約を締結している場合であっても、当該代理店において取り扱うこととされている保険契約のうち、顧客の意向に照らし、ある保険契約のほかに「比較可能な同種の保険契約」\nに該当する保険契約が存在し、選別・提案を行う場合には、保険業法施行規則第227条の2第3項第4号ロに基づく対応が必要となります。","theme":"比較可能な同種の保険契約","section":"保険業法施行規則","tags":["比較推奨"]},{"no":48,"location":"－","comment":"比較対象商品(保険会社)の選定数について、代表的な数社を一定の幅をもって整理することは許容されるか。(例：顧客の意向に照らし、合理的と考えられる数社(概ね5社程度)を選定すること)\n改正後の比較推奨においては、見積結果ありきではなく、顧客の意向に基づき比較対象商品を選別することが求められているが、顧客の意向内容や商品特性に照らせば、比較対象とすべき商品数は一律ではなく、一定の幅をもって整理されることが合理的であると考えられる。\n仮に比較対象数について明確な下限や多数社比較を事実上求める整理がなされる場合、顧客にとって必要以上に多くの情報が提示され、かえって商品間の差異や比較軸が分かりにくくなるおそれがある。\nこれに対し、顧客の「比較軸」に基づいた顧客の意向範34囲に含まれる代表的な数社(例えば5社程度)を選定し、その選定理由を記録・説明可能な形で整理した上で比較を行うことは、恣意的な商品選別を防止しつつ、顧客が自己の意向に基づき合理的な判断を行うことを可能とする方法であり、改正趣旨である顧客本位の比較推奨の実現に資するものと考えられる。\nしたがって、比較対象商品数については、顧客の意向及び比較軸との関係で合理性が説明できる範囲において、一定の幅をもって整理することが許容されるとの理解が望ましいと考える。\n特に、損害保険分野における保険料情報連携が一定期間整備されない場合、全社見積の取得が実務上著しく困難となることが予見されるため、意向に基づく代表的数社の試算提示は制度の実効性確保の観点から必要な代替手段である。煩雑さを嫌い、乗合会社を縮小する、さらには専属化する動きもある。","pageStart":34,"pageEnd":35,"answer":"比較対象とする保険契約の数について、一律の下限や固定的な社数を設けるものではありません。\nまた、あらかじめ「概ね5社」など特定の件数を固定し、その件数に合わせて比較対象を選別することが当然に適切となるものではありません。比較対象とする保険契約の数や範囲は、顧客の意向との関係で個別具体的に判断される必要があります。\nなお、比較対象を絞り込む場合であっても、手数料水準、販売目標、取引関係、事務都合等の代理店又は保険会社の都合により、特定の保険契約へ誘導することは適切ではありません。","theme":"比較可能な同種の保険契約","section":"保険業法施行規則","tags":["手数料・インセンティブ","比較推奨","証跡・記録"]},{"no":49,"location":"－","comment":"不動産管理会社が利用する賃貸管理システムには、家賃管理、契約管理、入居者管理、物件管理、修繕管理など、多様な機能が備わっている。\nこれらの賃貸管理システムの中には、入居者向けのWebインターフェースを提供しているものがある。その場合、入居希望者や入居者は、Web上で入居申込や退去申請が行えるほか、管理会社が提供する各種サービスへの加入手続なども行うことができる。\n一般に、入居希望者が家財保険へ加入する際には、氏名・35住所に加えて、物件所在地、建物名、部屋番号、建物構造、建築年月日など、物件に関する詳細情報を申込書へ記入する必要がある。\n保険会社が保険代理店向けに提供するシステムの中には、賃貸管理システムと連携しているものがある。これらのシステムでは、入居者が賃貸管理システムのWeb画面から家財保険の加入手続きを行う際、上記の物件情報等が自動的に申込画面へ取り込まれる。そのため、入居希望者が自ら情報を入力することなく、家財保険の申込手続を完了できる。\n他の乗合保険会社がこうした保険代理店システムと賃貸管理システムとの連携機能を提供しない場合には、その保険会社の保険契約は比較対象にならないと理解してよいか。","pageStart":35,"pageEnd":36,"answer":"貴見のケースは、代理店システムと賃貸管理システムとの連携機能を提供しない保険会社の保険契約について、顧客が加入できない状態なのか等が必ずしも明らかではなく、当該保険契約が保険業法施行規則第227条の2第3項第4号ロに定める「二以上の比較可能な同種の保険契約」に該当するかどうかは個別具体的かつ実質的に判断される必要があります。\n一般論として、「二以上の比較可能な同種の保険契約」は、代理店委託契約又はこれに基づく覚書等により、当該代理店が取り扱うこととされている保険契約を前提に判断されます。\nしたがって、保険会社と乗合代理店との間で、委託対象となる保険契約の範囲等が明確に限定されている場合には、取り扱えない保険契約は、当該代理店における推奨販売の対象には含まれないものと考えられます。\nなお、顧客本位の業務運営の確保を目的とする合理的な理由なく、形式的な委託範囲の限定を行うことにより、保険会社からの便宜供与等の見返りとして、特定の保険会社の保険契約を優先的に取り扱うなど、顧客の適切な商品選択の機会を実質的に阻害するおそれのある業務運営を行う場合には、比較推奨販売規制を潜脱するものとして問題となり得ます。\nまた、保険会社都合によるシステム設計上の制約又は技術的制約により、連携機能を提供しない保険会社の保険契約について、保険募集を行う代替手段がなく、当該保険契約の保険募集を行うことが事実上困難となる場合には、当該保険契約は取り扱う保険契約から除外され、推奨販売の対象外になるものと考えます。ただし、その場合であっても、当該取扱いが乗合代理店における恣意的な運用につながらないよう、代理店委託契約又はこれに基づく覚書等により、取り扱う範囲等についてあらかじめ明確化されていることが望ましいと考えます。","theme":"比較可能な同種の保険契約","section":"保険業法施行規則","tags":["便宜供与","比較推奨","システム・比較ツール"]},{"no":50,"location":"第227条の2第3項第4号","comment":"損害保険4社の保険契約を扱う乗合代理店において、メインで取り扱うA社(代理店内シェア50％)及びB社(同49％)のみ比較提案し、取扱件数が極小のC社(同1％)及びD社(同0％)を提案対象外とした場合、比較販売(保険業法施行規則第227条の2第3項第4号イ)に当たる募集とみなせるか伺いたい。\n36過去の取引経緯からC社及びD社との代理店委託契約を見直すことは、C社及びD社で引き受ける保険契約を切り替えるロードが発生することを懸念している。","pageStart":36,"pageEnd":37,"answer":"保険業法施行規則第227条の2第3項第4号イは、乗合代理店が取り扱う保険契約の内容と、他の保険契約の内容を比較して説明する場合に、当該比較に係る事項について適切な説明を求めるものです。\nご意見のケースで、A社・B社を比較して説明する場合、その比較説明自体については同号イに基づく対応が必要となります。\nただし、C社・D社も代理店委託契約又は覚書等により新規募集が可能な保険契約であり、顧客の意向に照らして「二以上の比較可能な同種の保険契約」に含まれる場合には、代理店内シェアや取扱件数が少ないことを理由に、これらを比較対象から除外することは適切ではありません。\nC社・D社を新規募集の対象外とする場合には、所属保険会社等との間で、例えば、新規募集停止の対象契約、停止時期、既契約の保全対応の範囲等について、当該委託契約又はこれに基づく覚書等により明確化されているときは、保険募集の場面において、当該保険契約は「二以上の比較可能な同種の保険契約」に含まれないものと考えられます。また、このとき、取り扱えない当該保険契約が誤って顧客へ提案されないよう、保険会社及び乗合代理店において実態に即して実効的に管理されることが重要と考えます。\nなお、顧客本位の業務運営の確保を目的とする合理的な理由なく、形式的な委託範囲の限定を行うことにより、保険会社からの便宜供与等の見返りとして、特定の保険会社の保険契約を優先的に取り扱うなど、顧客の適切な商品選択の機会を実質的に阻害するおそれのある業務運営を行う場合には、比較推奨販売規制を潜脱するものとして問題となり得ます。\nまた、既契約の移管や委託契約の見直しを行う場合には、既契約者の保全、異動、事故対応、満期案内等に支障が生じないよう、保険会社及び保険代理店において適切な引継ぎ・管理態勢を整備することが重要です。","theme":"比較可能な同種の保険契約","section":"保険業法施行規則","tags":["便宜供与","比較推奨"]},{"no":51,"location":"－","comment":"一部保険会社の代理店委託契約及び保険契約を別代理37店に移管すれば、比較推奨の範囲が狭まり、提案する保険会社が少なくなると理解して良いか。","pageStart":37,"pageEnd":38,"answer":"既存の保険契約を他代理店に移管したことのみをもって、当該保険会社の保険契約を当然に比較推奨販売の対象外とすることは適切ではありません。\n比較推奨販売の対象となる保険契約は、代理店委託契約又はこれに基づく覚書等により、当該代理店が取り扱うこととされている保険契約を前提に判断されます。\n当該委託契約の解消又は取扱停止に向けた準備期間中であっても、例えば、新規募集停止の対象となる保険契約、停止時期、既契約の保全対応等について、所属保険会社等との間で当該委託契約又は覚書等により明確化されている場合には、新規募集の場面において、当該保険契約は「二以上の比較可能な同種の保険契約」に含まれないものと考えられます。また、このとき、取り扱えない保険契約が誤って顧客へ提案されないよう、保険会社及び乗合代理店において実態に即して実効的に管理されることが重要と考えます。\nその後、当該委託契約が解消された場合には、当該保険会社の保険契約は当該代理店において取り扱うことができないため、「二以上の比較可能な同種の保険契約」には含まれないこととなります。","theme":"比較可能な同種の保険契約","section":"保険業法施行規則","tags":["比較推奨"]},{"no":52,"location":"－","comment":"複数の保険会社を取り扱う乗合代理店において、保険会社との取引を見直し、「委託契約を解約する」、「共同保険における非幹事会社のみ取り扱う」といった対応をとる場合、顧客に対して、事前に保険会社との取引関係の説明を行い、選別対象外とすることで了承を得た上で、その旨の証跡・記録を残せば、保険会社との契約書(覚書)締結を待たず、当該保険会社を選別候補から外すことは問題ない38と考えるがその理解でよいか。","pageStart":38,"pageEnd":39,"answer":"乗合代理店において、代理店委託契約を終了する予定がある場合、又は共同保険における非幹事会社のみを取り扱おうとする場合であっても、顧客へ事前に保険会社との取引関係を説明することや、選別対象外とすることの了承を得て証跡・記録を残すことのみをもって、当該保険会社の保険契約を当然に比較推奨販売の対象外とすることは適切ではありません。\n保険業法施行規則第227条の2第3項第4号ロに定める「二以上の比較可能な同種の保険契約」は、代理店委託契約又はこれに基づく覚書等により、当該代理店が取り扱うこととされている保険契約を前提に判断されます。\nしたがって、代理店委託契約の解消や取り扱う保険契約の範囲を限定する場合には、その内容について所属保険会社等との間で代理店委託契約又はこれに基づく覚書等により明確化されているときは、当該委託契約等で定められた保険募集の場面において、その保険契約は「二以上の比較可能な同種の保険契約」に含まれないものと考えられます。また、このとき、取り扱えない当該保険契約が誤って顧客へ提案されないよう、保険会社及び乗合代理店において実態に即して実効的に管理されることが重要と考えます。\nなお、顧客本位の業務運営の確保を目的とする合理的な理由なく、形式的な委託範囲の限定を行うことにより、保険会社からの便宜供与等の見返りとして、特定の保険会社の保険契約を優先的に取り扱うなど、顧客の適切な商品選択の機会を実質的に阻害するおそれのある業務運営を行う場合には、比較推奨販売規制を潜脱するものとして問題となり得ます。\nまた、顧客に対しては、権限明示を適切に実施するとともに、当該限定を行う場合には、当該保険代理店が取り扱う保険契約の範囲について誤認を与えないよう、適切に説明する必要があります。","theme":"比較可能な同種の保険契約","section":"保険業法施行規則","tags":["便宜供与","比較推奨","証跡・記録"]},{"no":53,"location":"－","comment":"「二以上の比較可能な同種の保険契約」の範囲や考え方について、「「平成26年改正保険業法(2年以内施行)に係る政府令・監督指針案」に対するパブリックコメント結果等39について」における「コメントの概要及びコメントに対する金融庁の考え方」No.74～77の見解に変更がないことを確認させていただきたい。\n本改正に伴い、「顧客の意向と異なる商品」については、顧客の希望がない限り提案できなくなったということか。\nもしくは、意向は変わることも有り得ることから、当初意向とは異なる商品の提案まで否定し得るものではないという理解か。","pageStart":39,"pageEnd":40,"answer":"前段について、「「平成26年改正保険業法(2年以内施行)に係る政府令・監督指針案」に対するパブリックコメント結果等について」における「コメントの概要及びコメントに対する金融庁の考え方」No.74～77で示した「二以上の比較可能な同種の保険契約」\nに関する考え方に変更はありません。\n後段について、保険募集人は、保険業法第294条の2に基づき顧客の意向を把握し、当該意向に沿った保険契約の提案・説明を行う必要があります。\n一方で、顧客の意向は募集過程において明確化又は変化し得るものであり、当初意向と異なる商品について、顧客の属性や状況を踏まえ、別のリスクに係るニーズの確認や一般的な情報提供を行うことまで直ちに否定されるものではありません。\nただし、顧客の意向を顧みず、代理店の都合により当初意向と異なる商品へ誘導することは適切ではなく、最終的には、顧客の意向を適切に確認した上で、その意向に沿った提案・説明を行う必要があります。","theme":"比較可能な同種の保険契約","section":"保険業法施行規則","tags":[]},{"no":54,"location":"第227条の2第3項第4号","comment":"保険業法施行規則第227条の2の情報提供について、「「平成26年改正保険業法(2年以内施行)に係る政府令・監督指針案」に対するパブリックコメント結果等について」における「コメントの概要及びコメントに対する金融庁の考え方」No.278及び「広く共有することが有効な相談事例(保険業法関係)」において「家財保険等の総括契約」については例外規定(社会通念上、景品(おまけ)程度のもの)に該当するケースを除き、情報提供並びに意向把握・確認が必要との見解が示されており、当該見解の趣旨を踏まえると、現在は賃貸物件の入居者に対して家財の火災保険を募集する際に、保険業法施行規則第227条の2第3項第4号ハを用いて「家財保険等の総括契約」(例外規定該当ケースを除く)\n40のみを提案するケースがあるが、今後は別の保険会社が引き受ける総括契約以外の家財の火災保険についても総括契約と比較可能な同種の保険として比較・推奨の対象になるとの理解でよいか。\nここでいう総括契約とは、同パブリックコメントNo.278に記載のような「1.損害保険会社の提供する総括契約方式(不動産賃貸物件の管理会社が保険契約者)、2.いわゆる「駆けつけサービスや家賃保証サービス」等に家財保険を付加した総括契約方式(サービス提供会社が保険契約者)、3.一部少額短期保険会社が実施している「不動産賃貸物件の大家等」を契約者とする「ミニ総括契約」」にて、物件を借りる入居者が被保険者となるものを指している。","pageStart":40,"pageEnd":41,"answer":"「二以上の比較可能な同種の保険契約」に該当するかは、顧客の具体的な意向、保険契約の対象となるリスクの種類、保険給付の内容、保険契約の特性・類型等を踏まえて、個別具体的かつ実質的に判断されます。\nしたがって、乗合代理店が、他の保険会社等から委託を受けて取り扱う家財の火災保険について、保険契約者又は被保険者に対し選択可能な保険契約として提示・推奨し得る場合には、当該保険契約は「二以上の比較可能な同種の保険契約」に含まれ得ます。\n一方で、いわゆる「総括契約方式」において、契約形態や取扱範囲の実態上、保険契約者又は被保険者が他の保険会社等の商品を選択できない場合や、保険募集人による選別・提示・推奨を伴わない場合には、直ちに比較推奨販売規制の対象となるものではありません。\nいずれの場合も、保険加入について被保険者に対する情報提供や意向把握・確認が必要となる場面では、法令や監督指針に従い、適切に対応する必要があります。","theme":"比較可能な同種の保険契約","section":"保険業法施行規則","tags":["比較推奨","ハ方式","意向把握"]},{"no":55,"location":"－","comment":"保険業法施行規則第227条の2第3項第4号ロで規定する推奨販売の情報提供義務は、「「平成26年改正保険業法(2年以内施行)に係る政府令・監督指針案」に対するパブリックコメント結果等について」における「コメントの概要及びコメントに対する金融庁の考え方」No.82、83で回答されているとおり、「明示すべき比較可能な同種の保険契約の概要」とは、「保険商品のパンフレットの商品概要に記載している内容を提示すること」という考え方を踏襲しているという理解でよいか。\nまた、保険商品概要提示とアンケート形式やフローチャート形式等により、保険契約者の意向を確認して保険商品を絞り込むことは問題ないか。\n41","pageStart":41,"pageEnd":42,"answer":"前段については、「「平成26年改正保険業法(2年以内施行)に係る政府令・監督指針案」に対するパブリックコメント結果等について」における「コメントの概要及びコメントに対する金融庁の考え方」を踏まえて、「比較可能な同種の保険契約」の概要としては、一般に、保険商品のパンフレット等に記載された商品概要を用いて説明することが考えられます。\nただし、顧客の意向、商品特性、募集形態等に応じて、顧客の適切な商品選択に資する内容を分かりやすく説明する必要があります。\nまた、顧客の意向把握に関して、アンケート形式やフローチャート形式等を活用すること自体は否定されません。\nただし、その場合であっても、設問、選択肢、表示方法、導線等により特定の保険会社又は特定の保険契約へ恣意的に誘導することのないよう留意する必要があります。\nその上で、把握した顧客の意向に沿って、合理的かつ一定の具体性を有する基準や理由等に基づき保険契約を提示・推奨する必要があります。","theme":"比較可能な同種の保険契約","section":"保険業法施行規則","tags":["意向把握"]},{"no":56,"location":"－","comment":"複数の保険会社を取扱っている乗合代理店の比較推奨販売について、例えば、保険会社(A社・B社・C社・D社)と全種目委託契約を交わしている乗合代理店において、保険会社ごとに以下のような特徴を有している。\n・A社：一般顧客向けの保険募集は行わず、契約者が保険代理店であり、自社社有車を対象とした引受のみ実施。\n・B社及びC社：一般顧客に対する全種目の保険契約を保有。\n・D社：一般顧客に対する火災保険のみ保有。\n顧客が加入する自動車保険契約の権限明示及び比較推奨販売にて案内する保険会社はB社及びC社のみとして問題ないか。\n42","pageStart":42,"pageEnd":43,"answer":"保険業法第294条第3項に基づく権限明示を行うに当たっては、乗合代理店が実際に販売している保険種目などを勘案したうえで、所属保険会社等の一部のみの商号等を明らかにすることは許容されないものと考えます。\nまた、同法施行規則第227条の2第3項第4号ロに定める「二以上の比較可能な同種の保険契約」は、代理店委託契約又はこれに基づく覚書等により、当該代理店が取り扱うこととされている保険契約を前提に判断されます。\nこのため、乗合代理店の判断のみにより、取扱保険会社や保険契約を限定し、顧客の適切な商品選択の機会を実質的に阻害する業務運営は適切ではありません。\nしたがって、取り扱う保険契約の範囲を限定する場合には、その内容について所属保険会社等との間で代理店委託契約又はこれに基づく覚書等により明確化されているときは、当該委託契約等で定められた保険募集の場面において、その保険契約は「二以上の比較可能な同種の保険契約」に含まれないものと考えられます。また、このとき、取り扱えない保険契約が誤って顧客へ提案されないよう、保険会社及び乗合代理店において実態に即して実効的に管理されることが重要と考えます。\nなお、顧客本位の業務運営の確保を目的とする合理的な理由なく、形式的な委託範囲の限定を行うことにより、保険会社からの便宜供与等の見返りとして、特定の保険会社の保険契約を優先的に取り扱うなど、顧客の適切な商品選択の機会を実質的に阻害するおそれのある業務運営を行う場合には、比較推奨販売規制を潜脱するものとして問題となり得ます。\nまた、顧客に対しては、権限明示を適切に実施するとともに、当該限定を行う場合には、当該保険代理店が取り扱う保険契約の範囲について誤認を与えないよう、適切に説明する必要があります。","theme":"比較可能な同種の保険契約","section":"保険業法施行規則","tags":["便宜供与","比較推奨"]},{"no":57,"location":"－","comment":"媒介のために乗り合っている保険会社(A社)及び代理で乗り合っている保険会社(B社)の2社のみ取り扱っている乗合代理店において、比較推奨販売を行う際は両社の説明が必要となるのか。","pageStart":43,"pageEnd":43,"answer":"乗合代理店においては、所属保険会社等の代理を行う場合であるか、又は媒介を行う場合であるかを問わず、「二以上の比較可能な同種の保険契約」に該当する保険契約については、比較推奨販売に係る規定に基づき、顧客に対して適切に説明を行う必要があります。\nまた、乗合代理店は、保険業法第294条第3項に基づき、保険募集を行おうとするときは、あらかじめ、顧客に対して、所属保険会社等の商号や、自己が所属保険会社等の代理人として保険契約を締結するか、又は保険契約の締結を媒介するかの別などについて明示する必要があります。","theme":"比較可能な同種の保険契約","section":"保険業法施行規則","tags":["比較推奨"]},{"no":58,"location":"－","comment":"多くの所属保険会社の中から、「代理店の都合」ではなく、取扱商品の商品優位性等の客観的理由により選定した保険会社群を顧客に書面等で示し、営業社員が顧客の意向をよく伺い、保険商品を数種類程度に絞り込んだ(絞り込む方法は規程化する)後に、偏りなく比較推奨するフローにしたいと考えている。\n当然、顧客が客観的理由により選定した保険会社群以外43を希望する場合は比較推奨の対象に加えることとするが、このような業務フローは適切な対応といえるか。","pageStart":43,"pageEnd":44,"answer":"推奨販売の対象となる保険契約の範囲は、代理店委託契約又はこれに基づく覚書等において取り扱うこととされている保険契約の中に「二以上の比較可能な同種の保険契約」が存在するか否かで判断するものです。\nしたがって、代理店委託契約等において定められた取扱対象となる保険契約の中から、乗合代理店が独自の判断のみで、あらかじめ、推奨保険会社群や比較対象保険会社群などを設定し、それ以外の取扱保険契約を比較推奨販売の対象外とすることは適切ではありません。","theme":"推奨商品群","section":"保険業法施行規則","tags":["比較推奨"]},{"no":59,"location":"－","comment":"監督指針Ⅱ－4－2－14において、以下のとおり規定されているが、今回の乗合代理店における適切な比較推奨販売の確保に弊害を来すおそれが生じるのではないかと感じている。\n【監督指針Ⅱ－4－2－14】(1)損害保険会社による評価項目として、「規模・増収率」\nに偏ることなく、「業務品質」を重視しているか(2)略(3)乗合代理店におけるシェアの拡大・維持や、保険代理店の新設や乗合いの承諾を得るなどの営業上の目的で、他の損害保険会社の代理店手数料の割増引率に追随するなどの例外的な運用を行っていないか。\n代理店手数料の算出は、前年度の損害保険会社による評価項目に対する評価によって当年度の代理店手数料が決定されるが、今年度の代理店手数料は昨年度(監督指針改正前)の評価項目によって算定されており、規模や増収率に偏った評価基準が採用されていたが、監督指針Ⅱ－4－2－14(3)が規定されたことにより、各損害保険会社の代理店手数料の割増引率の追随が否定され、今年度の各保険会社の代理店手数料は昨年度と比較すると非常に大きな差が生じている。\n今年度の各保険会社の評価項目も監督指針改定前の評価項目によって算定されており、規模や増収率に偏った評44価基準が採用されている。\n即ち来年度の代理店手数料も継続して「業務品質」を重視した代理店手数料割増引率にはならない。\n各損害保険会社の乗合代理店に対する規模や増収率に偏った代理店手数料格差が生じた状態において、今回の乗合代理店に課された比較推奨販売を遂行するには、営利企業として特定の保険契約を推奨する場合に、監督指針案II－4－2－9(5)①B.(a)に記載の「乗合代理店の都合によることなく、合理的かつ一定の具体性を有する基準や理由等を説明」することは現実的ではないと考える。\nまた、乗合代理店における顧客の意向として、迅速な保険契約の締結が第一である場合等、監督指針Ⅱ－4－2－9(5)①B.(b)(注3)に記載の「顧客の意向を顧みず、営業上の理由から恣意的に特定の保険契約へ誘導することのないよう留意する」とあるが、顧客の意向を顧みた上で、営業上の理由(特定の保険会社の事務手続き・経営方針上の理由)を説明した上で、特定の保険会社の保険契約を提示・推奨することは許容されるべきであると考える。","pageStart":44,"pageEnd":45,"answer":"保険業法施行規則第227条の2第3項第4号ハが廃止された趣旨に照らし、特定の保険契約を提案する場合、手数料水準、販売目標、便宜供与、保険会社との取引関係、社内都合、経営方針など代理店の都合や、保険募集人の主観的又は属人的判断に基づく事項を理由として、当該保険契約を提案することは顧客の意向に沿わない保険契約の提案と考えられます。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"保険業法施行規則","tags":["便宜供与","手数料・インセンティブ","比較推奨","ハ方式"]},{"no":60,"location":"第227条の2第3項第4号","comment":"監督指針Ⅱ－4－2－9(5)①B.(a)後段に記載されている以下の内容について伺いたい。\n【監督指針Ⅱ－4－2－9(5)①B.(a)後段】「特に、顧客の意向に沿って選別した保険契約の中から、商品特性等により、特定の保険契約を推奨する場合には、顧客の最善の利益を勘案したものとして、保険募集人や乗合代理店の都合によることなく、合理的かつ一定の具体性45を有する基準や理由等を説明しているか。その場合、推奨する特定の保険契約以外の保険契約もある旨及び顧客の求めに応じて、それらの保険契約の概要又は契約内容を説明する旨を説明しているか」\n(1)\n監督指針Ⅱ－4－2－9(5)①B.(a)前段において、「顧客の意向に沿って選別」した保険契約の中から、さらに特定の保険契約を推奨するための情報提供であることから、保険業法施行規則第227条の2第3項第4号ロ(「顧客の意向に沿って選別」した場合の情報提供)に規定する「提案の理由」ではなく、体制整備の一環として、監督指針上求められる情報提供という理解でよいか。\n※従前の監督指針にあった「顧客に対し、特定の商品を提示・推奨する際には、当該提示・推奨理由を分かりやすく説明することとしているか。特に、自らの取扱商品のうち顧客の意向に合致している商品の中から、二以上の所属保険会社等を有する保険募集人の判断により、さらに絞込みを行った上で、商品を提示・推奨する場合には、商品特性や保険料水準などの客観的な基準や理由等について、説明を行っているか。」の「特に」以下は、改正前同号ロと同号ハを同時適用して情報提供を同時にできるという前提の記載だったと思われる。同号ハがなくなった場合の再整理が必要と考えている。\n(2)\n監督指針Ⅱ－4－2－9(5)①B.(a)前段において、「顧客の意向に沿って選別」した保険契約の概要の説明を要することとなったが、当該「概要」を提示する保険契約46の範囲と、同号ロの「提案契約の提案をしようとする場合」\nの提案契約の範囲は、同じではなく、同号ロは、顧客の意向に沿って絞り込んだ保険契約の概要を説明した上で、さらに絞り込んだ提案契約の提案も許容され、その「提案の理由」を示せば足りるという理解でよいか。\n上記の理由から、今回の改正府令案では、同号ロの要件から「二以上の比較可能な同種の保険契約の中から顧客の意向に沿った保険契約を選別することにより」という提案契約の範囲を示す文言を削除したという理解でよいか。\n(3)\n同号ロには「提案の理由」としか記載されていないが、この「提案の理由」とは「合理的かつ一定の具体性を有する基準や理由等」と解釈してよいか。また、この解釈は「「平成26年改正保険業法(2年以内施行)に係る政府令・監督指針案」に対するパブリックコメント結果等について」における「コメントの概要及びコメントに対する金融庁の考え方」No.94における「顧客に対して提示されるべき理由は、一定の具体性を有する理由であることを要するものと考えられる点にご留意ください」を考慮したものと考えてよいか。\n(4)\n上記の理解が正しい場合、同号ハが削除されたとしても、顧客の意向に基づかない絞り込みを一切認めないものではなく、顧客の意向に基づいた絞り込みを一定程度行うことをプロセスとして求めたうえで、保険募集人による絞り込みは、理由を提示すれば改正後も認められる(少なくとも、法令違反(不祥事件届出)にはならない)という47理解でよいか。\nなお、監督指針Ⅱ－4－2－9(5)①B.(a)後段では「その場合、推奨する特定の保険契約以外の保険契約もある旨及び顧客の求めに応じて、それらの保険契約の概要又は契約内容を説明する旨を説明しているか」と記載されているが、「保険契約の概要」について、同号ロでは「顧客の求めに応じて」という記載がないため、「顧客の求めに応じて」\nという文言は法令解釈としてはおけないのではないか。\n(5)\n監督指針Ⅱ－4－2－9(5)①B.(a)後段では「特に、顧客の意向に沿って選別した保険契約の中から、商品特性等により、特定の保険契約を推奨する場合」に「合理的かつ一定の具体性を有する基準や理由等を説明」することを求めているが、反対解釈すると、同号ロでは「合理的かつ一定の具体性を有する基準や理由等」は法令上の情報提供義務の内容として求められないという理解でよいか。","pageStart":45,"pageEnd":48,"answer":"(1)\n改正前のⅡ－4－2－9(5)②は、保険業法施行規則第227条の2第3項第4号ロに基づく顧客の意向に沿った保険契約を選別する場面を想定したものであり、同号ハに基づく顧客の意向に沿わないで保険契約を選別する場面を想定したものではありません。\nその上で、改正監督指針Ⅱ－4－2－9(5)①B.(a)の後段は、同号ロに基づく情報提供義務を踏まえ、顧客に対して説明を求めるものであり、体制整備の一環として説明を求めるものではありません。\n(2)\n同号ロに基づいて保険契約の概要及び当該提案の理由の説明が求められるのは、最終的に保険募集人が絞り込んだ保険契約について、これらの説明が求められます。\n(3)\n改正監督指針Ⅱ－4－2－9(5)①B.(a)においては、同号ロに基づき、特定の保険契約を提案する場合における当該提案の理由の説明が求められていることを理由に、「合理的かつ一定の具体性を有する基準や理由等」の説明を求めています。これは同号ロの趣旨を踏まえた解釈を示すものであり、「「平成26年改正保険業法(2年以内施行)に係る政府令・監督指針案」に対するパブリックコメント結果等について」における「コメントの概要及びコメントに対する金融庁の考え方」No.94を直接の根拠とするものではありません。\n(4)\n同号ハが廃止された後においては、募集過程全体を通じて顧客の意向に基づいた保険契約の選別が行われる必要があり、顧客の意向に基づかない保険契約の絞り込みは許容されません。\nしたがって、特定の保険契約を提示・推奨する場合には、顧客の意向に沿った選別を前提として行う必要があります。\nⅡ－4－2－9(5)①B.(a)\n「その場合、推奨する特定の保険契約以外の保険契約もある旨及び顧客の求めに応じて、それらの保険契約の概要又は契約内容を説明する旨を説明しているか。」は、顧客の意向に沿って最終的に絞り込んだ特定の保険契約以外の選別対象となる保険契約について、同号ロの趣旨に照らして、顧客の適切な商品選択の機会の確保の観点から、説明を求めるものです。\n(5)\n同号ハが廃止された後、上記のとおり、保険募集人による顧客の意向に基づかない保険契約の絞り込みは許容されません。\nⅡ－4－2－9(5)①B.は、「比較可能な同種の保険契約」の中から、顧客の意向に沿って一又は二以上の保険契約を選別し、顧客に示す行為は「提示」とし、さらに、その中から、保険募集人が特定の保険契約を勧める場合を「推奨」としており、いずれの場合であっても合理的かつ一定の具体性を有する基準や理由等を説明する必要があります。なお、特定の保険契約を「推奨」する場合について、保険募集人の恣意的な判断が介在する程度が高まることから、顧客の最善の利益を勘案し、代理店都合によらない合理的かつ一定の具体性を有する基準や理由等の説明が特に重要であることを明確化したものです。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"保険業法施行規則","tags":["顧客の最善の利益"]},{"no":61,"location":"第227条の2第3項第4号","comment":"今回の改正によって、保険業法施行規則第227条の2第3項第4号ロ(以下、ロ方式とする)についての文言に変更・修正が行われ、改正案では、「顧客の意向に沿って当該ニ以上の所属保険会社等を有する保険募集人が選別した比較可能な同種の」とあり、改正前の文言には「保険募集人が選別した」という文言はない。\nまた、改正前の監督指針においても、「特に、自らの取扱商品のうち顧客の意向に合致している商品の中から、二以上の所属保険会社等を有する保険募集人の判断により、さらに絞込みを行った上で、商品を提示・推奨する場合に48は」という表現が使われている。今回の改正案ではあくまでこの従前の監督指針の表現を流用・加筆しただけで、修正ではないと考えてよいか。\nつまり、ロ方式のプロセスにおいて、顧客の意向を聞き取り、最終的には個々の保険募集人が保険契約を選別するという流れは、改正前後で特段変更はないと考えてよいか。","pageStart":48,"pageEnd":49,"answer":"(1)\n改正前のⅡ－4－2－9(5)②は、保険業法施行規則第227条の2第3項第4号ロに基づく顧客の意向に沿った保険契約を選別する場面を想定したものであり、同号ハに基づく顧客の意向に沿わないで保険契約を選別する場面を想定したものではありません。\nその上で、改正監督指針Ⅱ－4－2－9(5)①B.(a)の後段は、同号ロに基づく情報提供義務を踏まえ、顧客に対して説明を求めるものであり、体制整備の一環として説明を求めるものではありません。\n(2)\n同号ロに基づいて保険契約の概要及び当該提案の理由の説明が求められるのは、最終的に保険募集人が絞り込んだ保険契約について、これらの説明が求められます。\n(3)\n改正監督指針Ⅱ－4－2－9(5)①B.(a)においては、同号ロに基づき、特定の保険契約を提案する場合における当該提案の理由の説明が求められていることを理由に、「合理的かつ一定の具体性を有する基準や理由等」の説明を求めています。これは同号ロの趣旨を踏まえた解釈を示すものであり、「「平成26年改正保険業法(2年以内施行)に係る政府令・監督指針案」に対するパブリックコメント結果等について」における「コメントの概要及びコメントに対する金融庁の考え方」No.94を直接の根拠とするものではありません。\n(4)\n同号ハが廃止された後においては、募集過程全体を通じて顧客の意向に基づいた保険契約の選別が行われる必要があり、顧客の意向に基づかない保険契約の絞り込みは許容されません。\nしたがって、特定の保険契約を提示・推奨する場合には、顧客の意向に沿った選別を前提として行う必要があります。\nⅡ－4－2－9(5)①B.(a)\n「その場合、推奨する特定の保険契約以外の保険契約もある旨及び顧客の求めに応じて、それらの保険契約の概要又は契約内容を説明する旨を説明しているか。」は、顧客の意向に沿って最終的に絞り込んだ特定の保険契約以外の選別対象となる保険契約について、同号ロの趣旨に照らして、顧客の適切な商品選択の機会の確保の観点から、説明を求めるものです。\n(5)\n同号ハが廃止された後、上記のとおり、保険募集人による顧客の意向に基づかない保険契約の絞り込みは許容されません。\nⅡ－4－2－9(5)①B.は、「比較可能な同種の保険契約」の中から、顧客の意向に沿って一又は二以上の保険契約を選別し、顧客に示す行為は「提示」とし、さらに、その中から、保険募集人が特定の保険契約を勧める場合を「推奨」としており、いずれの場合であっても合理的かつ一定の具体性を有する基準や理由等を説明する必要があります。なお、特定の保険契約を「推奨」する場合について、保険募集人の恣意的な判断が介在する程度が高まることから、顧客の最善の利益を勘案し、代理店都合によらない合理的かつ一定の具体性を有する基準や理由等の説明が特に重要であることを明確化したものです。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"保険業法施行規則","tags":["顧客の最善の利益"]},{"no":62,"location":"－","comment":"保険募集における説明義務は保険募集人に課されている一方、顧客に対して一律かつ網羅的な説明を受ける義務が課されているものではないと理解している。商品内容が類似し差異が限定的な場合において、顧客の関心、理解度及び説明を求める意思を確認した上で、主要な補償内容及び契約条件の要点に限定して説明を行うことは、顧客本位の業務運営の趣旨に反しないとの理解でよいか。\nまた、顧客が詳細説明を希望しない場合において要点説明にとどめることが、直ちに不適切な募集行為と評価されるものではないとの理解で相違ないか。","pageStart":49,"pageEnd":49,"answer":"保険募集人には、法令に基づき、顧客の判断に必要な情報を分かりやすく提供することが求められますが、常に網羅的・詳細な説明を一律に行うことを求めるものではありません。\nただし、特定の保険契約を提案する場合には、当該保険契約の概要及び顧客の意向に照らした合理的かつ一定の具体性を有する提案基準や理由等について、説明する必要があります。\n顧客が詳細説明を希望しない場合であっても、顧客の意向、関心事項、理解度、商品特性等を踏まえ、顧客の適切な判断に重要な事項を過不足なく説明することが重要であり、必要な情報提供まで省略できるものではありません。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"保険業法施行規則","tags":[]},{"no":63,"location":"－","comment":"比較推奨販売において「合理的かつ具体的な基準」が求められていることは理解しているが、自動車保険を含む損害保険分野においては、主要な補償構造、約款形式及び保険料水準が市場競争の結果として各社間で相当程度均質化している保険契約も存在する。\nこのような場合において、商品間に実質的な差異が限定的又は認められないという事実を説明すること自体が説明責任の履行に該当し、差異が存在しないにもかかわらず49形式的な比較説明を行うことは、顧客の合理的判断をかえって阻害する可能性があるとの理解でよいか。\nまた、顧客の意向確認を前提として、補償内容・保険料水準・契約条件等の客観的事実に基づき一つの保険契約に合理的に絞り込むことは、制度趣旨に反しないとの理解で相違ないか。","pageStart":49,"pageEnd":50,"answer":"比較説明に係る情報提供については、複数の保険契約の契約内容を比較して説明する場合に求められるものであり、複数の保険契約が存在することのみをもって、常に網羅的・詳細な比較説明が求められるものではありません。\n商品間の差異が限定的であっても、特定の保険契約を提案する場合には、顧客の意向に沿った商品の絞り込みと対応関係にある理由が必要となり、商品間に限定的な差異しかない旨の説明は提案理由として適切ではありません。なお、他の商品との差異について比較する場合には、比較の前提、補償内容、保険料水準、特約、免責、契約条件等について、顧客に誤認を与えないよう留意する必要があります。\nまた、顧客の意向を踏まえ、補償内容、契約条件等の客観的な商品特性や保険料水準に基づき、合理的かつ一定の具体性を有する理由により一つの保険契約を選別し、提示・推奨することは、制度趣旨に反するものではありません。一方で、商品間の差異が限定的であることを理由として、手数料水準、販売目標、取引関係、事務都合等の代理店の都合により特定の保険会社又は特定の保険契約へ誘導することは適切ではありません。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"保険業法施行規則","tags":["手数料・インセンティブ","比較推奨","意向把握"]},{"no":64,"location":"－","comment":"1996年から「保険の自由化」が開始されたが、規制緩和とは言われながらも、一方で、リスク細分型保険については金融庁主導の上限・下限のほか、保険会社の忖度・怠慢・システムへの投資不十分によって、米国と比較して個社ごとに差別化が進んでいない状況である。\nその中での「比較推奨販売」と言われても、特約や保険料が少し異なるだけで明確な相違点がなく、現場では混乱が予想され、時間もかかってしまう。顧客本位という視点に異論はないが、今般の改正が果たして顧客本位になるのか再度検証が必要と考える。また、保険会社に更なる自由化を促し、商品内容の差別化を図る必要があると考える。","pageStart":50,"pageEnd":50,"answer":"比較推奨販売に係る規定は、商品間に大きな差異がある場合に限って適用されるものではなく、顧客が適切に商品選択できるよう、必要な情報提供・説明を求めるものです。商品間の差異が限定的な場合であっても、顧客の意向や商品特性を踏まえ、保障(補償)内容、保険料水準、特約等について、当該意向に即して分かりやすく説明することが重要です。\n一方で、常に取扱保険会社全社の保険契約を網羅的・詳細に比較説明することを一律に求めるものではありません。\n保険商品の開発については、各保険会社が顧客ニーズ、リスクの状況、競争環境等を踏まえ、法令等の範囲内で創意工夫を活かして取り組むことが基本です。金融庁としても、商品開発・商品審査、比較推奨販売の適切性、顧客への分かりやすい情報提供等の観点から、引き続き適切にモニタリングしてまいります。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"保険業法施行規則","tags":["比較推奨","システム・比較ツール"]},{"no":65,"location":"第227条の2第3項第4号","comment":"「合理的かつ一定の具体性を有する基準」について、監督指針Ⅱ－4－2－9(5)①B.では「商品特性」及び「保険料50水準」が顧客の重視事項として提示されている。\n実務上、顧客の意向は「保障(補償)内容」と「保険料」\nの二者択一に還元されるものではなく、「双方のバランスを重視する」、「保障(補償)は重視するが一定の価格制約がある」等、複合的な価値基準が存在することが一般的である。\nこの点、保険業法施行規則第227条の2第3項第4号ロにおいて推奨を行う際には、複数の重要比較軸(保障(補償)内容・価格・双方など)の関係性について、顧客自身が視覚的に比較・検討できる形で情報を提供することが、説明義務を果たす上で重要であるとの理解でよいか。\n併せて、比較軸が複数ある場合においても、当該軸間のバランスを顧客が自ら判断できるようにすることが、改正案が意図する「顧客の意向に沿った適切な比較推奨」に資するとの理解で相違ないか。","pageStart":50,"pageEnd":51,"answer":"推奨販売における情報提供の方法は、顧客の意向、商品特性、募集形態等を踏まえ、個別具体的に判断されます。\n顧客が保障(補償)内容と保険料水準の双方、又はそのバランスを重視する場合には、保障(補償)内容、特約、免責、保険料水準、契約条件等の関係について、顧客が比較・検討しやすい方法で分かりやすく説明することが重要です。\n比較表や図表等を用いて視覚的に示すことも、顧客の理解を助ける有効な方法の一つと考えられます。ただし、特定の保険会社又は特定の保険契約へ恣意的に誘導する表示とならないよう、比較の前提、対象範囲、算定条件等を明確にする必要があります。\nまた、複数の比較軸がある場合には、保険募集人が一方的に優劣をつけるのではなく、顧客が重視する事項を丁寧に確認し、その意向に沿って合理的かつ一定の具体性を有する理由に基づき提案することが重要です。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"保険業法施行規則","tags":["比較推奨"]},{"no":66,"location":"－","comment":"事故の経験がない、又は保険の必要性を感じていない顧客の意向は保険料が安い保険会社となることが想定される。その意向を優先するのであれば、取扱保険会社全ての見積もりを出して比較することになるが、事故時の安心なサービスやメーカーのブランド保険を提案することで、顧客の意向は保険料から事故の安心さやブランド保険に変化することも考えられる。\n乗合代理店の推奨方針で顧客の当初意向があった場合でも、事故時の安心なサービスやブランド保険を提案すると定めることは乗合代理店の恣意的な誘導と判断される51のか。\n当初の意向が顧客の真の意向ではないこともあるため、意向を深掘りするプロセスを方針で定める必要があると考える。","pageStart":51,"pageEnd":52,"answer":"個別具体的に判断されますが、顧客の意向は募集過程における説明や確認を通じて明確化・変化し得るものであり、当初意向と最終意向が異なること自体は直ちに問題とはなりません。\n例えば、当初は保険料水準を重視していた顧客に対して、補償内容の特徴等を丁寧に説明し、顧客がこれらを重視する意向に変化した場合には、その最終意向に沿った提案は許容されます。\n他方で、保険代理店において、顧客の意向にかかわらず特定の保険会社又は特定の保険契約へ誘導することは認められないため留意が必要です。\nしたがって、社内方針においては、特定の保険契約ではなく、顧客のリスク認識や重視事項を深掘りし、意向形成を促すことや意向を明確にするためのプロセス(確認項目、説明方法、記録・検証等)を整備することが重要であり、意向変化の経緯や提案理由を適切に記録され、当該意向の変化の経緯や理由が合理的なものであるかを確認しつつ、顧客の最終的な意向に基づいた提案が行われているかを確認することが重要です。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"保険業法施行規則","tags":["証跡・記録"]},{"no":67,"location":"第227条の2第3項第4号","comment":"自動車保険において、基本補償の内容についてほとんど差異がないのが現状であり、契約者の意向により希望する損保が決まるようなケースは実際の募集においては想定しがたい。\n保険業法施行規則第227条の2第3項第4号ロにおいて、募集前に契約者の意向を客観的な根拠に基づいて、乗合代理店が推奨しなければならないとするのであれば、損害保険会社の規模や過去実績、保険料差等を根拠として契約者に説明することになり、結果として規模の大きな損害保険会社か保険料が安い損害保険会社に集中することになる懸念がある。\nまた損害保険会社が、自社の推奨理由を乗合代理店に提案してくることも想定され、行政による公正な立場での顧客の意向に合わせたガイドラインの策定と公表は必要であると思われる。","pageStart":52,"pageEnd":52,"answer":"貴重なご意見として承ります。\n自動車保険について、顧客が重視する事項に即して必要な範囲で比較・説明することが考えられます。\n一方で、手数料水準、販売目標、取引関係、便宜供与、保険会社又は代理店の都合により、特定の保険会社又は特定の保険契約へ誘導することは認められないため留意が必要です。\nまた、監督指針は、比較推奨販売に関する基本的な考え方を示したものであり、顧客の意向や商品特性は多様であるため、画一的な推奨基準を定めることは困難ですが、各保険会社及び乗合代理店においては、これらを踏まえ、顧客本位の業務運営の観点から適切な教育・管理・指導を行うことが重要です。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"保険業法施行規則","tags":["便宜供与","手数料・インセンティブ","比較推奨"]},{"no":68,"location":"－","comment":"意向がない顧客に対して、ニーズの掘り起こしをする際に、保険料水準が確認必須の項目として金融庁によって設定されることがないよう要望する。\n実態として顧客要望では保険料の比較希望は潜在的に52発生しているものの、ダイレクト型の保険シェアが8％程度にとどまっていることを鑑みると、保険料水準は顧客にとって決定要素ではなく、心理的要素(背中を押す)にとどまっていると考えられる。顧客にとって保険料水準は関心のある事項であるが、本質的な保険契約上のニーズは、日本損害保険協会の「保険加入に関する消費者アンケートの実施結果について」で示されているとおり、アフターフォローや丁寧なニーズ確認・説明時間であり、保険料水準以外の対人・サービス要因が契約選択に影響することが確認されている。\nよって、推奨販売方針で保険料水準を確認必須項目とする合理的理由がないと考える。\n保険料比較の必須化は表面的な価格の比較が優先され、補償内容・事故対応体制の説明時間が圧迫された結果として顧客理解が浅くなり、顧客への利益提供を損なうものと考えられる。\n管理の容易さを目的として「ニーズの掘り起こしを行う際に確認する項目」の設定が行われない運用を求める。","pageStart":52,"pageEnd":53,"answer":"貴重なご意見として承ります。\n顧客の意向が明確でない場合に確認・例示すべき事項について、監督指針上、保険料水準等を含む特定項目を全ての募集場面で一律に必須とする趣旨ではありません。\n各乗合代理店においては、取扱商品、募集形態、顧客属性等を踏まえ、顧客が重視し得る事項を適切に設定し、顧客の意向形成を促し又は明確化に努めることが重要です。\nもっとも、保険料水準について、顧客がこれを重視する意向を示した場合には、補償内容、特約、免責等との関係も含め、分かりやすく説明する必要があります。\nなお、保険料水準を確認することにより、全ての案件において、直ちに全取扱保険契約を網羅的に見積り・説明しなければならないものではありません。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"保険業法施行規則","tags":[]},{"no":69,"location":"－","comment":"比較推奨における募集文書のあり方について、乗合代理店における比較推奨販売を実効性あるものとするためには、顧客が理解しやすい比較資料の活用が不可欠であり、募集文書の位置付けや作成主体について、より明確な考え方が必要であると考える。\n乗合代理店は、複数の保険会社の保険契約を比較・推奨することが求められているが、顧客の立場から見れば、複53数社の補償内容や保険料を一枚の資料等で一覧的に比較できることは、理解促進の観点から有効であると考える。\nしかしながら現状では、代理店が独自に作成した比較資料は募集文書として認められておらず、比較説明は各保険会社が定めた募集文書の範囲内に限定されている。その結果、顧客にとって分かりやすい比較説明を行いたくとも、実務上の制約が大きい状況にある。\nまた、民間システム会社等による比較ツールの活用(生命保険分野では既にある)についても、損害保険分野では保険会社からのデータ開示がなければ実現が困難であり、生命保険分野との間で環境差が生じている。\n今回の改正により比較推奨販売の徹底を求めるのであれば、乗合代理店独自で作成した比較資料の取扱い・外部システムを活用した比較説明の可否・募集文書として求められる要件について、顧客理解の向上を軸とした明確な整理・方向性を示していただきたい。\n比較推奨の形式的な遵守にとどまらず、顧客が納得して保険契約の選択を行える環境を整えることが、顧客本位の業務運営の実質化につながると考える。","pageStart":53,"pageEnd":54,"answer":"貴重なご意見として承ります。\n比較表や比較ツールは、顧客の理解を助ける有効な手段の一つと考えられます。もっとも、比較表の作成主体、記載項目、使用方法等について、法令又は監督指針において一律の様式や要件を定めるものではありません。\n募集文書の作成・使用方法については、保険募集管理態勢の一環として、所属保険会社等が保険代理店との委託契約等を踏まえ、正確性や誤認防止の観点から適切に確認・管理すべきものと考えます。\nその上で、乗合代理店及び保険会社においては、顧客にとって分かりやすい比較説明が行われるよう、創意工夫を行うことが重要です。\nなお、比較資料やツールを用いる場合であっても、比較の前提条件、対象範囲、算定条件、商品内容の差異等について、顧客に誤認を与えないよう適切に説明するよう、法令や監督指針に照らして対応する必要があります。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"保険業法施行規則","tags":["比較推奨","システム・比較ツール"]},{"no":70,"location":"第227条の2第3項第4号","comment":"監督指針Ⅱ－4－2－9(5)①B.(a)前段に記載されている以下の内容のうち、「契約内容並びに当該提示・推奨する基準や理由等を説明」の部分は、保険業法施行規則第227条の2第3項4号ロの情報提供義務の内容と理解してよいか。\n【監督指針Ⅱ－4－2－9(5)①B.(a)前段】「乗合代理店が二以上の比較可能な同種の保険契約の中54から顧客の意向に沿って保険契約を選別し、一又は二以上の保険契約を提示・推奨する場合には、当該提示・推奨する保険契約の概要及び顧客の求めに応じて契約内容並びに当該提示・推奨する基準や理由等を説明しているか」\n上記の理解でよい場合、「顧客の求めに応じて契約内容並びに当該提示・推奨する基準や理由等を説明しているか」について、「顧客の求めに応じて」という記載は「契約内容」のみにかかるという理解でよいか。\n保険業法施行規則第227条の2第3項第4号ロには「顧客の求めに応じて」という規定がないことから、「理由説明」\nについて、顧客の求めに応じて、とすることはできないものと思われる。","pageStart":54,"pageEnd":55,"answer":"貴見のとおり、Ⅱ－4－2－9(5)①B.(a)は、保険業法施行規則第227条の2第3項第4号ロにおける情報提供義務の内容を踏まえたものです。\n同(a)の「顧客の求めに応じて」は、「契約内容」にかかるものであり、「提示・推奨する保険契約の概要」及び「提示・推奨する基準や理由等」については、顧客の求めの有無にかかわらず説明する必要があります。\nなお、ご意見を踏まえ、上記趣旨がより明確となるようⅡ－4－2－9(5)①B.(a)を一部修正しました。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"保険業法施行規則","tags":[]},{"no":71,"location":"－","comment":"比較推奨販売において、特定の保険契約を推奨する場合には、「顧客の最善の利益を勘案したものとして、代理店の都合によらない合理的かつ一定の具体性を有する基準や理由等」が求められるとされています。制度趣旨については理解している一方で、実務の現場においては、・どのような観点が「顧客の最善の利益を勘案した基準や理由等」として整理され得るのか・顧客の意向や重視事項を踏まえた結果として、特定の保険契約を推奨する判断が、どのような形であれば合理的と評価されるのかといった点について、判断に迷う場面も想定される。\nまた、顧客が一定の判断基準に基づく比較説明を受け、その内容を理解した上で、特定の保険会社を選定するに至55らず、乗合代理店及び保険募集人に判断を一任する意思を示されるケースも実務上想定される。\nこのような場合において、・乗合代理店はどのような考え方や手順に基づいて保険会社を選定することが適切と考えられるのか・代理店の都合により恣意的に保険会社を選定したものではないと判断されるためには、どのような対応や整理が求められるのかといった点について、制度上の考え方を確認したい。\n特に、自動車保険のように商品内容や保険料の差が限定的な分野においては、顧客が「どの会社でも大きな差はない」と認識した結果として、乗合代理店又は保険募集人に判断を委ねる場面も少なくない。\n現場での説明や記録が過度に形式化することを防ぎつつ、顧客の意思を尊重した柔軟な対応が可能となるよう、乗合代理店又は保険募集人が顧客に判断を一任された場合の位置づけや、代理店として許容される判断プロセスについて、一定の考え方や整理が示されることが望ましいと考える。","pageStart":55,"pageEnd":56,"answer":"合理的かつ一定の具体性を有する基準や理由等の内容については、顧客の意向、商品特性等により異なるため、一概にお示しすることは困難です。\n一般論としては、特定の保険契約を提案する場合には、具体的な顧客の意向に照らして、保障(補償)内容や保険料水準などについて、当該保険契約を提案した主な基準や理由等を、顧客が理解できるよう説明する必要があります。\nただし、保険業法施行規則第227条の2第3項第4号ハの廃止の趣旨に照らして、手数料水準、販売目標、便宜供与、資本・取引関係など代理店の都合や、保険募集人の主観的又は属人的判断に基づく事項を基準・理由とすることは、不適切な提案に該当し得るため適切ではありません。また、特定の保険会社の事務への精通等、顧客意向との関係で合理性・具体性に乏しく、顧客の比較判断に資しない事項を理由とすることも適切ではありません。\nなお、乗合代理店においては、当該提案の基準や理由等について、社内規則等を定める必要があり、各保険募集人による特定の保険契約への恣意的な誘導とならないよう、例えば、顧客意向の把握方法、顧客が重視する事項の確認方法、顧客への説明方法、記録・検証方法などを組織的に適切に定めたうえで、各保険募集人に対し教育・管理・指導を徹底することが重要であると考えます。\nその上で、顧客の意向との関係で合理的かつ一定の具体性を有する説明を行い、意向変化の経緯や提案理由を適切に記録され、当該意向の変化の経緯や理由が合理的なものであるかなどについて、事後的に確認・検証できる態勢を整備することも重要です。\n顧客が保険募集人に判断を一任する意思を示した場合であっても、顧客の理解度、属性、リスク特性等が個々の募集において異なることから、一律に整理を示すことは困難です。\nなお、顧客より一任する意思が示された場合であっても、その意思表示のみをもって、乗合代理店が任意に特定の保険会社又は特定の保険契約を選別し、提示・推奨することは適切でははく、顧客が重視し得る事項を確認するなど、可能な限り意向の形成を促すこと又は意向の明確化に努め、その上で、把握した顧客の意向に沿って、合理的かつ一定の具体性を有する基準や理由等に基づき、保険契約を提案することが重要です。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"保険業法施行規則","tags":["便宜供与","手数料・インセンティブ","比較推奨","ハ方式","顧客の最善の利益","証跡・記録"]},{"no":72,"location":"－","comment":"比較推奨販売の改正案において、10台以下のノンフリート契約の場合、新規契約時に複数損害保険の見積りを、顧客にお示しすることとなるが、商品内容・サービス内容に56差がなく、唯一異なるのは保険料のみであるため、必然的に、顧客は、その時点で最安の損害保険を選択することとなる。\n各損害保険会社は毎年のように保険料改定を行っているため、同じ顧客がいろいろな損害保険会社と契約することとなり、いざ、真夜中にバッテリーが上がった等、本当に困った時に、どの損害保険会社に電話をすればよいかわからない、といった事態が発生することを懸念している。\n比較推奨販売の改正案において、例えば複数台保有の顧客は例外とする等、再考いただきたい。","pageStart":56,"pageEnd":57,"answer":"比較推奨販売については、保険契約の台数や契約形態により適用の有無が左右されるものではなく、複数台保有の顧客を一律に対象外とすることは適当ではありません。\n一方で、常に取扱保険会社全社の見積りを作成・提示することを一律に求めるものではありません。顧客の意向、リスク特性、補償内容、保険料水準等を踏まえ、顧客の判断に重要な事項を分かりやすく説明することも重要です。\nなお、同一契約者が複数の保険会社との契約を有している場合には、事故時等の連絡先や契約内容について、顧客が適切に理解できるよう分かりやすく説明する必要があります。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"保険業法施行規則","tags":["比較推奨"]},{"no":73,"location":"－","comment":"自動車メーカーのブランド保険は取扱いできる保険会社が制限されている。ブランド保険を取扱うディーラー代理店において、3社取り扱っている場合であっても、ブランド保険を販売できる特定の保険会社が他社の保険契約に比べて魅力的になるため、当該乗合代理店の保険販売実績は結果的に1社に集中することが見込まれる。ブランド保険で取扱保険会社を絞り込んだ上で、ブランド保険を推奨することは恣意的な誘導に当たるか。\n57","pageStart":57,"pageEnd":57,"answer":"乗合代理店が、特定の保険契約を提案する場合においては、まず、補償内容等の商品特性や保険料水準について具体的な意向を確認する必要があることを前提に、合理的かつ一定の具体性を有する基準や理由等として説明可能であり、他の商品選択肢を不当に排除しない事項についてあわせて顧客の意向を把握することが考えられます。\nその上で、乗合代理店が、特定の保険契約を提案する場合は、当該提案理由について、顧客の意向との関係で合理的かつ具体的に説明する必要があります。\nなお、当該特定の保険契約を推奨する場合には、Ⅱ－4－2－9(5)①B.(a)に照らして、他に比較可能な保険契約があること、顧客の求めに応じてそれらの概要又は契約内容を説明することを、分かりやすく説明する必要があります。\nいずれにせよ、顧客の意向を踏まえず特定の保険会社又は特定の保険契約へ誘導することは適切ではありません。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"保険業法施行規則","tags":[]},{"no":74,"location":"－","comment":"現在の自動車保険について、保険会社の担当者に各社との違いを聞いても明確な回答が得られない状況である。各社の商品性に違いがほとんどない実態を踏まえると、現場の保険募集人が保険契約の比較説明をすることは困難と考えている。\n顧客から「事故対応が良い会社」という意向が示され、1社を推奨した後、当該保険会社の対応に不満が出た場合、当該保険会社を推奨した乗合代理店の責任になるのか。その場合、乗合代理店は怖くてどこの保険会社も推奨できなくなってしまうのではないか。\nまた、保険料の安さを求める顧客には通販型や共済が最も良いのは明白であり、我々乗合代理店が存在する意味自体を否定しているように感じる。","pageStart":58,"pageEnd":58,"answer":"今般の保険業法施行規則及び監督指針改正は、乗合代理店における比較推奨販売について、代理店の都合や保険会社との関係により、顧客の意向に沿わない商品選別・提案が行われることを防止し、公正な保険募集を確保することを目的とするものであって、特定の募集方法を否定するものではありません。\n特定の保険契約を提案すること自体が直ちに問題となるものではなく、顧客の意向を踏まえ、合理的かつ一定の具体性を有する基準や理由等に基づき説明されているかにより判断されます。\n「事故対応が良い会社」といった意向については、保険募集人の主観的評価に基づいて説明するのではなく、商品特性や保険料水準について説明するとともに、事故受付時間、ロードサービス、事故後のサポート内容等、合理性・具体性を有し、顧客の比較判断に資する事項に即して説明する必要があります。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"保険業法施行規則","tags":["比較推奨"]},{"no":75,"location":"－","comment":"乗合代理店における適切な比較推奨販売の確保について、顧客の意向に沿って二以上の比較可能な同種の保険契約から選別することとなっているが、どのような募集方法であれば「顧客の意向に沿って選別した」と言えるのか。\nまた、どのような募集方法であれば「顧客の意向に沿って選別していない」となるのか、判断基準が必要と考える。\n過去に損害保険協会が「過度な便宜供与のガイドライン」を作成されたが、「顧客意向に沿った保険会社選別のガイドライン」のようなものがあると、改正保険業法への対応を進めやすい。","pageStart":58,"pageEnd":58,"answer":"具体的な募集方法の適否は個別具体的に判断されるものであり、一律の判断基準を示すことは困難ですが、例えば、補償内容、保険料水準、特約、免責金額等、顧客の比較判断に資する事項に基づき選別する場合は、顧客の意向に沿った選別となり得ます。\n一方、手数料水準、販売目標、便宜供与、資本関係、取引関係、代理店の都合等、乗合代理店又は保険会社の都合を提案理由として特定の保険会社又は特定の保険契約を選別・提案することは、顧客の意向に沿ったものとはいえません。\n監督指針において基本的な考え方を示しており、各乗合代理店において、社内規則等の整備、保険募集人への教育・管理・指導、記録・検証を通じて適切に対応することが重要です。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"保険業法施行規則","tags":["便宜供与","手数料・インセンティブ","比較推奨","証跡・記録"]},{"no":76,"location":"－","comment":"顧客の意向として、乗合代理店の保険募集人が一番取扱58いに慣れている損害保険会社の商品を希望する旨の意向が示される場合も多々あると思うが、当該意向を推奨理由とすることは問題ないか。","pageStart":58,"pageEnd":59,"answer":"顧客が「乗合代理店の保険募集人が取扱いに慣れている保険会社の商品」を希望する場合であっても、保険募集人の属人的又は主観的な事情を理由に特定の保険契約を提案することは、顧客の意向に沿わない特定の保険契約の選別に該当し得るため、適切ではありません。\nこのような場合には、顧客が何を重視しているのかを確認した上で、例えば、保障(補償)内容、保険料水準、特約、免責金額等、顧客の比較判断に資する事項との関係で、合理的かつ一定の具体性を有する説明を行う必要があります。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"保険業法施行規則","tags":[]},{"no":77,"location":"－","comment":"顧客の最善の利益とは、保険事故が発生した際に速やかに保険金を受け取っていただくことだと認識しているが、「保険金支払実績が多い」ことや「保険金請求実務に精通している」というのは「当該提案の理由」として正当か。\n59","pageStart":59,"pageEnd":60,"answer":"提示・推奨する基準や理由等が、顧客の最善の利益に照らし、合理的かつ一定の具体性を有するか否かについては、顧客の意向や商品特性等を踏まえ、個別具体的に判断されます。\n他方、保険業法施行規則第227条の2第3項第4号ハの廃止の趣旨は、便宜供与等により代理店の利益のみを優先して特定の保険契約の推奨が行われ、顧客の適切な商品選択の機会が阻害されないよう求める点にあり、手数料水準、販売目標、保険会社からの便宜供与、資本・取引関係、特定の保険会社の事務に精通していることなど代理店側の都合や、募集人の主観的又は属人的判断に基づく事項を基準や理由等とすることは、不適切な提示・推奨に該当し得るため適切でないと考えます。\n比較推奨販売を行うに当たっては、顧客が自らの抱えるリスクや保険ニーズに合致した保険商品であるかを十分に確認できるよう、保険募集人が保険商品に係る事項について顧客の意向を丁寧に把握することが前提であると考えます。こうした点を踏まえると、顧客の意向に沿って特定の保険商品を提示・推奨する際には、主たる基準や理由等として、顧客の意向に沿う保障(補償)内容等の商品特性や保険料水準といった保険商品に直接関係する事項を説明する必要があります。\nまた、顧客が事故対応件数や販売実績等の商品特性と直結しない事項についても重視する場合には、保険商品に直接関係する事項とあわせて、提示・推奨理由とすることは否定されませんが、これらの事項は顧客意向との関係で合理性・具体性を有し、顧客の比較判断に資する客観的事項である必要があります。いずれにせよ、これらの事項は商品特性と直結せず、恣意的な推奨につながるおそれがある点に留意が必要です。\n加えて、提示・推奨の基準や理由等に係る数値・資料の根拠について、例えば、同号ハに基づいて乗合代理店の店舗ごとに異なる保険会社の保険契約を取り扱っていたことを前提として、特定の保険契約を推奨するような資料等に基づく場合など、結果として、恣意的な選別とならないよう、収集期間、対象、件数、集計・評価方法等を明らかにするなど、合理性を適切に判断すべきです。\nなお、比較推奨販売における情報提供のみで適切な選択に至らない場合は、無理に特定の保険契約へ絞らず、比較説明や複数の保険契約の提示、追加の意向確認等により、顧客の適切な商品選択の機会を確保することが求められます。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"保険業法施行規則","tags":["便宜供与","手数料・インセンティブ","比較推奨","ハ方式","意向把握","顧客の最善の利益"]},{"no":78,"location":"第227条の2第3項第4号","comment":"保険業法施行規則第227条の2第3項第4号ロは、「絞り込み」を行う場合の情報提供義務の内容として、保険募集人が「絞り込み」を行って提案をしようとする場合には、「顧客の意向に沿って選別をした保険契約の概要及び提案の理由」を情報提供義務の内容として課している。「顧客の60意向に沿って選別をした」ことが義務として規定されていることから、絞り込みの際には「顧客の意向に沿った選別」\nをすることが、情報提供義務の観点から必須となったという理解でよいか。\nまた、同号ロについて、「顧客の意向」の具体性のレベルについて、法令上は、定義がされていないという理解でよいか。定義されていない場合、「顧客の意向」\nをどのような具体性のレベルで捉えるか、また、どのように段階を追って引き出していくかについて、顧客の個性は様々であり定型化できないことから、保険募集人の裁量に委ねられている(法令上の規制はない)という理解でよいか(少なくとも、一定の幅が許容されることになるのではないか。)。\nなお、監督指針Ⅱ－4－2－9(5)①B.は、「また、顧客の意向に沿って保険契約を選別する場合には、事前に商品特性や保険料水準などの顧客が重視する事項を丁寧かつ明確に確認する必要があることに留意する」とあり、そうした体制整備上の手続き的な規制を通じて、適正な「意向」\nの把握が図られているものと理解している。","pageStart":60,"pageEnd":61,"answer":"保険業法施行規則第227条の2第3項第4号ハが廃止された趣旨などに照らし、保険募集人が特定の保険契約を選別する場合には、顧客の意向に沿った選別を行うことが必要です。\n顧客の意向は、多様であることから、法令上その具体的な内容について一律の定めておらず、意向把握の具体性の程度やその把握方法について一概に回答することは困難ですが、意向の把握・確認を通じて、顧客が自らの抱えているリスクを認識し、その中でどのようなリスクを保険でカバーするのかを認識した上で保険に加入できる機会を確保する必要があることに照らすと、保険募集人の恣意的な取扱いが許容されるものではありません。\nⅡ－4－2－9(5)①B.は、顧客が重視する事項を丁寧かつ明確に確認し、形式的な意向把握にとどまらず、把握した意向に沿って合理的かつ一定の具体性を有する基準や理由等により提示・推奨する必要があることを示したものです。\n一方で、手数料水準、販売目標、便宜供与、取引関係等、代理店の都合による恣意的な選別・誘導とならないよう留意する必要があります。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"保険業法施行規則","tags":["便宜供与","手数料・インセンティブ","ハ方式","意向把握"]},{"no":79,"location":"－","comment":"監督指針Ⅱ－4－2－9(5)②ア.について、「基準」や「理由」が具体的に何を意味するか不明である。具体的な内容がわかるよう例示を示すなど、どのようなものを想定して「基準」や「理由」という文言を使用されたのか明らかにしていただきたい。\n例えば、保険種類ごとや個別の顧客とのやりとりごとに、顧客に説明する推奨の基準や理由等は変わると思われ61るが、そのすべてのケースをあらかじめ想定して、個々のケースごとの基準や理由等を社内規則に定める必要があるのか。仮に、そこまで規定化する必要がないのであれば、自社の社内規則について、「基準」や「理由」につきどのような定め方をする必要があるのかご教示いただきたい。","pageStart":61,"pageEnd":62,"answer":"Ⅱ－4－2－9(5)②ア.の「提示・推奨する基準や理由等」についての「社内規則等」とは、乗合代理店自身の規模や業務特性を踏まえつつ、保険募集人ごとに恣意的な運用とならないよう、例えば、顧客意向の把握方法、顧客が重視する事項の確認方法、提示・推奨する基準や理由、顧客への説明方法、記録・検証方法などを組織的に適切に定めることを指し、各店舗又は各保険募集人に対しては、社内規則等に基づき、教育・管理・指導を徹底することが重要であると考えます。\nしたがって、全ての保険種類や個別顧客ごとの具体的な推奨理由を、あらかじめ網羅的に社内規則等へ定めることまで求めるものではありません。\nその上で、個別の募集場面では、把握した顧客意向に照らし、合理的かつ一定の具体性を有する理由を説明できるよう対応する必要があり、その適切性を事後的に確認・検証する必要があります。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"保険業法施行規則","tags":["証跡・記録"]},{"no":80,"location":"－","comment":"意向把握・比較推奨のプロセスについて、顧客の意向に沿って保険契約を絞り込む際の「客観的な基準」とは、例えば保険会社A社の事故対応サービスの充実度を重視して比較した等の記載も抽象的であるとの理解でよいか。また、「顧客が特に重視すると考えられる事項」について考え方を具体的に示していただきたい。","pageStart":62,"pageEnd":62,"answer":"乗合代理店が顧客の意向に沿って保険契約を選別し、提示・推奨する場合には、顧客が重視する事項を丁寧かつ明確に確認した上で、提示・推奨する基準や理由等を合理的かつ具体的に説明する必要があります。\n例えば、「A社は事故対応サービスが充実している」とのみ説明する場合は、一般に抽象的であり、事故受付体制、受付時間、ロードサービス、事故後のサポート内容、保険金支払手続等、顧客の比較判断に関係する合理的かつ具体的な事項に即して説明する必要があります。\n「顧客が特に重視すると考えられる事項」としては、補償内容、保険料水準、特約、免責金額等が考えられます。\nなお、顧客の意向確認に先立ち、特定の保険会社又は特定の保険契約へ誘導することや、保険募集人の主観的評価、販売実績、手数料水準、販売目標、便宜供与等を主たる理由として推奨することは適切ではありません。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"保険業法施行規則","tags":["便宜供与","手数料・インセンティブ","比較推奨","意向把握"]},{"no":81,"location":"－","comment":"顧客の意向に沿って保険契約を選別する場合には、乗合代理店が事前に推奨方針に沿って、商品特性や保険料水準、付帯サービスなどから保険契約を選別することになる62が、顧客の意向が保険料水準のみといった限定的な場合は乗合代理店の推奨方針と違う対応が求められる。\nその際は証跡・記録を残す、非推奨商品も必要に応じて説明を行うなどの対応を行っている限り、問題ないと考えるがその理解でよいか。","pageStart":62,"pageEnd":63,"answer":"貴見における推奨方針が必ずしも明確ではないため、お答えすることは困難です。なお、乗合代理店において事前に定める社内規則等は、顧客の意向に沿って保険契約を選別し、提示・推奨するための判断枠組みを定めるものであり、個別の顧客意向に反して適用するものや恣意的に特定の保険契約に誘導するためのものではありません。\n顧客の意向が保険料水準を重視するものである場合には、保険料の多寡のみで直ちに選別・提案するのではなく、可能な限り同一又は近似の条件で比較することが望ましく、補償内容、特約、免責、付帯サービス等の差異も踏まえて、提案理由を合理的かつ具体的に説明する必要があります。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"保険業法施行規則","tags":["証跡・記録"]},{"no":82,"location":"－","comment":"損害保険の実務においては、乗合代理店における各保険会社の保有実績や過去の経験値による顧客対応品質の違いがでることが現実的にはあると想定している。実務として、乗合代理店が恣意的に判別することなく、保有実績、事故件数を開示し、顧客に示した上で、アンケート方式で顧客自身が保険会社を選定する場合は、顧客の意向に沿っているとの理解でよいか。また、提案の過程で、顧客による補償の要望が具体化した場合は、それに対応する保険会社を推奨することは問題ないとの理解でよいか。\n63","pageStart":63,"pageEnd":64,"answer":"本件については、個別具体的に判断すべき事項であり一概に回答することは困難ですが、顧客の意向を適切に把握する観点から、アンケートを活用すること自体は否定されません。\nただし、顧客が重視する事項を確認するにあたり、その選択肢や表示方法等については、顧客の意向が重要であることを前提に、顧客が自らのリスクや保険ニーズを適切に認識し意向を表明できるよう設計される必要があり、補償内容等の商品特性や保険料水準を含めることが適切と考えます。\n保有実績、事故件数等を選択肢又は説明項目とする場合も、それらが合理的かつ一定の具体性を有する基準や理由等として説明可能であり、他の商品選択肢を不当に排除しないものであることが必要です。\nまた、これら事項は、例えば、保険業法施行規則第227条の2第3項第4号ハに基づいて乗合代理店の店舗ごとに異なる保険会社の保険契約を取り扱っていたことを前提として、特定の保険契約を推奨するような根拠等に基づく場合など、結果として、恣意的な選別とならないよう、その採用の適否は慎重に判断するとともに、特定の事項が過度に強調されないよう表示方法等を工夫することも重要と考えます。\nいずれにせよ、選択肢や表示方法が、顧客の意向確認に先立って特定の保険会社又は特定の保険契約へ誘導するものとなる場合には、代理店都合による恣意的な選別と評価され得ます。\nなお、アンケートの設計に当たっては、顧客が商品特性や保険料水準等に関する意向を適切に表明でき、保険代理店が、これを把握できるような項目・導線等とするとともに、その内容を事後的に確認・検証できる態勢を整備することも重要です。\nまた、提案過程で顧客の補償ニーズが具体化した場合に、その意向に対応する保険契約を提示・推奨することは、当該理由を分かりやすく説明する限り、問題ないと考えます。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"保険業法施行規則","tags":["ハ方式","意向把握"]},{"no":83,"location":"－","comment":"意向把握の中で、システム的に一定の補償と保険料を一覧表示するようなケースにおいて、乗合代理店が取扱う保険契約のうち、各社で補償内容が異なる保険契約について全く同じ条件で作成することができず、乗合代理店やシステム会社の恣意的要素が入り込む余地があると考えている(例：特定の保険会社に有利な比較ロジックの設定や設問など)。\n単純に保険料比較を提示することは、顧客の意向を踏まえた対応とはいえないと考えるが、その理解でよいか。\n64","pageStart":64,"pageEnd":65,"answer":"ご理解のとおり、単に保険料のみを一覧表示することは、直ちに顧客の意向を踏まえた比較推奨販売と評価されるものではありません。保険料の多寡のみならず顧客のリスク認識、保障(補償)内容、保険金額、保険期間、特約、免責、引受条件、保険料負担等について、適切に具体的な顧客の意向を把握する必要があります。\n比較ツール等を用いる場合であっても、可能な限り同一又は近似の条件で比較することが望ましく、補償内容、特約、免責金額等の差異や、保険料に影響する要素を分かりやすく説明する必要があります。\nまた、比較ロジック、設問、表示順等が、特定の保険会社又は特定の保険契約へ恣意的に誘導するものとならないよう留意する必要があります。\nなお、全ての案件で取扱保険会社全社の保険契約を網羅的に試算・説明することを一律に求めるものではありませんが、比較対象を絞り込む場合には、推奨販売に該当し得ることから、その基準や理由を合理的かつ具体的に説明する必要があります。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"保険業法施行規則","tags":["比較推奨","意向把握","システム・比較ツール"]},{"no":84,"location":"－","comment":"顧客の意向に沿って保険契約を選別する際の確認事項(比較事項)については、商品特性や保険料水準、付帯サービスといった顧客が重視する事項である必要があるが、保険本来の補償機能やサービスとかけ離れた事項(購入した商品のメンテナンスなどといった観点)での選別は、代理店都合による恣意的な商品選別につながるおそれがあると考えられるがどうか。","pageStart":65,"pageEnd":65,"answer":"貴見のケースにおいて具体的に想定している事項が不明確ですが、保険本来の保障(補償)機能やサービスと乖離した事項に基づく保険契約の選別は、乗合代理店による恣意的な保険契約の選別にあたるおそれが高いと考えられます。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"保険業法施行規則","tags":[]},{"no":85,"location":"－","comment":"改正後の比較推奨においては、見積結果の前に、比較対象商品を選別することが求められているが、その選別基準として実務上もっとも一般的かつ合理的なのが、顧客が「価格を重視するか」、「補償内容を重視するか」といった価値判断である。\n価格重視・補償重視といった優先順位の確認は、「顧客の意向把握」に含まれるとの理解でよいか。","pageStart":65,"pageEnd":65,"answer":"貴見のとおり、価格重視・保障(補償)内容重視といった優先順位の確認は、顧客の意向把握に含まれ得ます。\nただし、これらの確認のみで常に十分というものではなく、顧客のリスク認識、必要な補償内容、保険金額、保険期間、特約、免責、保険料負担の許容度等を踏まえ、顧客の意向を具体化することが重要です。\nなお、顧客が保険料水準を重視する場合であっても、保険料の多寡のみで直ちに選別・提案するのではなく、可能な限り同一又は近似の条件で比較することが望ましく、保障(補償)内容等の差異、保険料に影響する要素を分かりやすく説明するなど適切に対応する必要があります。\nまた、比較軸や選別理由については、事後的に確認・検証できるよう、乗合代理店の業務実態に応じて適切に記録することも重要です。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"保険業法施行規則","tags":["比較推奨","意向把握","証跡・記録"]},{"no":86,"location":"－","comment":"保険加入希望の顧客に意向把握をしたところ、「事故対65応が良い保険会社」が希望であった場合、「事故対応の良い保険会社」は数値化することができず、客観的に顧客に示すことができない。\nこのように客観的に示
