集実態に応じた合理的な方法で記録・保存することが重要です。例えば、通話記録、システム入力記録、電子的な意向確認結果等により、顧客の意向確認や説明内容を事後的に確認できる態勢を整備することが考えられます。\n確認・検証方法については、全件確認を一律に求めるものではありません。乗合代理店の規模・業務特性、募集形態、苦情・不祥事の発生状況、特定の保険会社又は特定の保険契約への偏り、保険募集人・拠点ごとの傾向等を踏まえる必要があると考えます。その上で、サンプリングや重点確認を含むリスクベースの方法により、効率的かつ実効的に確認・検証することが考えられます。確認・検証の結果、課題が認められた場合には、保険募集人への教育・管理・指導、社内規則や記録方法の見直し等、必要な業務改善につなげることが求められます。\nなお、意向把握・確認義務に係る体制整備については、Ⅱ－4－2－2(3)④や上記の考え方を踏まえ、自社の規模・業務特性等に応じ、合理的かつ実効的な態勢を整備することが重要です。\n金融庁として、比較推奨販売に係る記録や証跡等の保存について、一律の記録フォーマット、記載項目、保存媒体、保存期間又は確認・検証方法を定めるものではありません。各乗合代理店においては、形式的な記録作成に偏らず、実効的な記録・検証態勢を整備することが重要であり、顧客本位の業務運営が実質的に確保されることが重要と考えます。","theme":"証跡保存","section":"保険業法施行規則","tags":["比較推奨","意向把握","証跡・記録","システム・比較ツール"]},{"no":161,"location":"第227条の2第3項第4号","comment":"比較推奨販売の適切性確認検証のための記録や証跡の保存期間は社内規則で自由に定めてよいか。","pageStart":101,"pageEnd":101,"answer":"比較推奨販売に係る記録・証跡等の保存期間については、法令等で特段の定めがある場合を除き、一律の期間を求めるものではありません。\n各乗合代理店において、自社の規模・業務特性、募集形態等を踏まえ、比較推奨販売の適切性を事後的に確認・検証し、必要な改善につなげることが可能となる合理的な保存期間を社内規則等で定め、それに従って適切に運用することが重要です。","theme":"証跡保存","section":"保険業法施行規則","tags":["比較推奨","証跡・記録"]},{"no":162,"location":"第227条の2第3項第4号","comment":"比較推奨販売に係る証跡の保存期間は「証跡等の保存に当たっては、顧客保護等(Ⅱ－4－4)の規定も踏まえつつ、顧客の意向や属性に応じた比較推奨販売に係る説明が適切に行われているか確認・検証できるものであること」とあるため、保険期間中を保存することで考えているが、別途定めはあるか。","pageStart":101,"pageEnd":101,"answer":"比較推奨販売に係る記録・証跡等の保存期間については、法令等で特段の定めがある場合を除き、一律の期間を求めるものではありません。\n各乗合代理店において、自社の規模・業務特性、募集形態等を踏まえ、比較推奨販売の適切性を事後的に確認・検証し、必要な改善につなげることが可能となる合理的な保存期間を社内規則等で定め、それに従って適切に運用することが重要です。","theme":"証跡保存","section":"保険業法施行規則","tags":["比較推奨","証跡・記録"]},{"no":163,"location":"第227条の2第3項第4号","comment":"比較推奨販売における保険業法施行規則第227条の2第3項第4号ロへの移行(同号ハの廃止)について、令和8年6月頃を目途とする時期が示されているが、具体的な移行時期の周知方法や、移行までの間に一定の猶予期間が設けられるのかを確認したい。","pageStart":101,"pageEnd":101,"answer":"今回の改正案の施行期間については、乗合代理店の実務や経営に与える影響等も考慮し、社内規程の改正や業務フローの整備、システム対応、募集人教育等の体制整備に要する期間として、円滑な対応が可能となるよう適当と考えられる期間を設定しています。","theme":"施行時期","section":"保険業法施行規則","tags":["比較推奨","システム・比較ツール"]},{"no":164,"location":"第227条の2第3項第4号","comment":"比較推奨販売に関する監督指針の具体的内容が確定した後、少なくとも半年程度の準備期間が必要と考えているが、改正内容の実施までにどの程度の準備期間が想定されているのかを確認したい。","pageStart":101,"pageEnd":101,"answer":"今回の改正案の施行期間については、乗合代理店の実務や経営に与える影響等も考慮し、社内規程の改正や業務フローの整備、システム対応、募集人教育等の体制整備に要する期間として、円滑な対応が可能となるよう適当と考えられる期間を設定しています。","theme":"施行時期","section":"保険業法施行規則","tags":["比較推奨","システム・比較ツール"]},{"no":165,"location":"第227条の2第3項第4号","comment":"比較推奨販売への対応に当たり、取扱保険会社の見直しや顧客への周知、既存契約の移管対応等に相応の準備期間101が必要となる。\n令和8年6月1日の施行日から実務運用開始まで、体制整備・実務準備を考慮した猶予期間について、基本的な考え方を明確に示してほしい。","pageStart":101,"pageEnd":102,"answer":"今回の改正案の施行期間については、乗合代理店の実務や経営に与える影響等も考慮し、社内規程の改正や業務フローの整備、システム対応、募集人教育等の体制整備に要する期間として、円滑な対応が可能となるよう適当と考えられる期間を設定しています。","theme":"施行時期","section":"保険業法施行規則","tags":["比較推奨","システム・比較ツール"]},{"no":166,"location":"第227条の2第3項第4号","comment":"推奨販売見直しの施行・適用に向けて、乗合代理店では意向把握ツールの導入や比較推奨に関するシステム対応を検討しているが、意向把握の具体的な対応方法や、システム対応が必須となる時期が現時点では不明確である。\n十分な準備期間(リードタイム)が確保されるのか懸念しており、施行時期および施行後に設けられる猶予期間について考え方を確認したい。","pageStart":102,"pageEnd":102,"answer":"今回の改正案の施行期間については、乗合代理店の実務や経営に与える影響等も考慮し、社内規程の改正や業務フローの整備、システム対応、募集人教育等の体制整備に要する期間として、円滑な対応が可能となるよう適当と考えられる期間を設定しています。","theme":"施行時期","section":"保険業法施行規則","tags":["比較推奨","意向把握","システム・比較ツール"]},{"no":167,"location":"第227条の2第3項第4号","comment":"比較推奨販売の適正化を施行するに当たり、事業者が円滑に対応できるよう、十分な準備期間を設定してほしい。","pageStart":102,"pageEnd":102,"answer":"今回の改正案の施行期間については、乗合代理店の実務や経営に与える影響等も考慮し、社内規程の改正や業務フローの整備、システム対応、募集人教育等の体制整備に要する期間として、円滑な対応が可能となるよう適当と考えられる期間を設定しています。","theme":"施行時期","section":"保険業法施行規則","tags":["比較推奨","システム・比較ツール"]},{"no":168,"location":"第227条の2第3項第4号","comment":"監督指針Ⅱ－4－2－9(5)において、保険業法施行規則第227条の2第3項第4号ハが廃止されることで、代理店の業務負担が一層増大することが見込まれるため、改正監督指針の施行開始に当たっては十分な猶予期間を設けるべきである。","pageStart":102,"pageEnd":102,"answer":"今回の改正案の施行期間については、乗合代理店の実務や経営に与える影響等も考慮し、社内規程の改正や業務フローの整備、システム対応、募集人教育等の体制整備に要する期間として、円滑な対応が可能となるよう適当と考えられる期間を設定しています。","theme":"施行時期","section":"保険業法施行規則","tags":["ハ方式","システム・比較ツール"]},{"no":169,"location":"第227条の2第3項第4号","comment":"改正の趣旨には賛同するが、体制整備、システム改修、社内規程や書類の見直し、研修の実施など実務上の対応は多岐にわたり、複数部門にまたがるため相応の準備期間が必要である。\n短期間での対応は現場や顧客対応に混乱を招くおそれがあることから、施行に当たっては十分な経過措置期間を設102けてほしい。","pageStart":102,"pageEnd":103,"answer":"今回の改正案の施行期間については、乗合代理店の実務や経営に与える影響等も考慮し、社内規程の改正や業務フローの整備、システム対応、募集人教育等の体制整備に要する期間として、円滑な対応が可能となるよう適当と考えられる期間を設定しています。","theme":"施行時期","section":"保険業法施行規則","tags":["システム・比較ツール"]},{"no":170,"location":"第227条の2第3項第4号","comment":"複数の保険会社の商品について、比較推奨販売を行うには人材確保や従業員教育、社内マニュアルの見直し・整備、システムの開発・導入など、多大な工数・費用負担が生じるため、監督指針の適用開始に当たっては1年程度の猶予期間を設けてほしい。","pageStart":103,"pageEnd":103,"answer":"今回の改正案の施行期間については、乗合代理店の実務や経営に与える影響等も考慮し、社内規程の改正や業務フローの整備、システム対応、募集人教育等の体制整備に要する期間として、円滑な対応が可能となるよう適当と考えられる期間を設定しています。","theme":"施行時期","section":"保険業法施行規則","tags":["比較推奨","システム・比較ツール"]},{"no":171,"location":"第227条の2第3項第4号","comment":"改正案の施行により、特にWEB完結型募集を行う乗合代理店では、UI／UX設計、意向把握・確認、記録・証跡管理等について大規模なシステム改修や業務フロー見直しが必要となり、時間・コストの負担が大きい。\n改正の趣旨は理解し対応する意向はあるが、円滑な移行のため、公布から施行までに十分な準備期間(例：1年程度)\nの猶予を設けてほしい。","pageStart":103,"pageEnd":103,"answer":"今回の改正案の施行期間については、乗合代理店の実務や経営に与える影響等も考慮し、社内規程の改正や業務フローの整備、システム対応、募集人教育等の体制整備に要する期間として、円滑な対応が可能となるよう適当と考えられる期間を設定しています。","theme":"施行時期","section":"保険業法施行規則","tags":["意向把握","証跡・記録","システム・比較ツール"]},{"no":172,"location":"第227条の2第3項第4号","comment":"比較推奨販売規制に関する改正規則・監督指針の施行日について確認したい。昨年成立した改正法と同時施行となった場合、システム対応を含む体制整備が困難であるため、少なくともパブリックコメント結果公表後1年程度の猶予期間が設けられるとの理解でよいか。","pageStart":103,"pageEnd":103,"answer":"今回の改正案の施行期間については、乗合代理店の実務や経営に与える影響等も考慮し、社内規程の改正や業務フローの整備、システム対応、募集人教育等の体制整備に要する期間として、円滑な対応が可能となるよう適当と考えられる期間を設定しています。","theme":"施行時期","section":"保険業法施行規則","tags":["比較推奨","システム・比較ツール"]},{"no":173,"location":"第227条の2第3項第4号","comment":"従来は専属代理店として活動していた保険募集人が、他社商品について十分に習熟し、顧客に適切な説明を行えるようになるには相応の時間を要する。このため、施行に当たっては、少なくとも1年間程度の準備期間を確保してほしい。","pageStart":103,"pageEnd":103,"answer":"今回の改正案の施行期間については、乗合代理店の実務や経営に与える影響等も考慮し、社内規程の改正や業務フローの整備、システム対応、募集人教育等の体制整備に要する期間として、円滑な対応が可能となるよう適当と考えられる期間を設定しています。","theme":"施行時期","section":"保険業法施行規則","tags":["システム・比較ツール"]},{"no":174,"location":"第227条の2第3項第4号","comment":"比較推奨販売の施行に当たっては、システム対応や人材103育成等に時間を要するため、可能な限り長い準備期間を設け、少なくとも1年以上の猶予期間を確保してほしい。","pageStart":103,"pageEnd":104,"answer":"今回の改正案の施行期間については、乗合代理店の実務や経営に与える影響等も考慮し、社内規程の改正や業務フローの整備、システム対応、募集人教育等の体制整備に要する期間として、円滑な対応が可能となるよう適当と考えられる期間を設定しています。","theme":"施行時期","section":"保険業法施行規則","tags":["比較推奨","システム・比較ツール"]},{"no":175,"location":"第227条の2第3項第4号","comment":"比較推奨販売に係る施行規則及び監督指針の施行については、当該施行規則及び監督指針に関するパブリックコメントの結果公表後1年程度の猶予をいただけるという理解でよいか。\n今般の改正は、乗合代理店のビジネスモデルに多大な影響を与える改正であり、当該結果を詳細に検討し、必要に応じて弁護士相談等も行った上で、システム対応も含めた各種体制整備を行う必要があるため、相応の準備時間が必要である。\nなお、2016年の業法改正時はパブリックコメントの結果公表後1年程度の猶予期間があったため今回も同程度の猶予期間をご考慮いただきたい。","pageStart":104,"pageEnd":104,"answer":"今回の改正案の施行期間については、乗合代理店の実務や経営に与える影響等も考慮し、社内規程の改正や業務フローの整備、システム対応、募集人教育等の体制整備に要する期間として、円滑な対応が可能となるよう適当と考えられる期間を設定しています。","theme":"施行時期","section":"保険業法施行規則","tags":["比較推奨","システム・比較ツール"]},{"no":176,"location":"第227条の2第3項第4号","comment":"乗合代理店における比較推奨販売の適正化について、パブリックコメント結果の確認、新ルール策定、社内規程・帳票・システムの改定など検討・対応事項が多岐にわたるため、施行までに十分な準備期間を設け、早くとも2027年4月1日以降の施行としてほしい。","pageStart":104,"pageEnd":104,"answer":"今回の改正案の施行期間については、乗合代理店の実務や経営に与える影響等も考慮し、社内規程の改正や業務フローの整備、システム対応、募集人教育等の体制整備に要する期間として、円滑な対応が可能となるよう適当と考えられる期間を設定しています。","theme":"施行時期","section":"保険業法施行規則","tags":["比較推奨","システム・比較ツール"]},{"no":177,"location":"第227条の2第3項第4号","comment":"比較推奨販売(保険業法施行規則第227条の2第3項第4号ハの廃止等)が施行される場合には、募集人教育や体制整備に相応の時間を要するため、十分な準備期間を設けた上で、2026年10月以降の施行とすることを希望する。","pageStart":104,"pageEnd":104,"answer":"今回の改正案の施行期間については、乗合代理店の実務や経営に与える影響等も考慮し、社内規程の改正や業務フローの整備、システム対応、募集人教育等の体制整備に要する期間として、円滑な対応が可能となるよう適当と考えられる期間を設定しています。","theme":"施行時期","section":"保険業法施行規則","tags":["比較推奨","ハ方式","システム・比較ツール"]},{"no":178,"location":"第227条の2第3項第4号","comment":"比較推奨販売の適正化は必要と認識しているものの、代104理店の規模はさまざまであり、今回の改正案は業務量や経営への影響が大きいため、段階的な改正とすることを希望する。","pageStart":104,"pageEnd":105,"answer":"今回の改正案の施行期間については、乗合代理店の実務や経営に与える影響等も考慮し、社内規程の改正や業務フローの整備、システム対応、募集人教育等の体制整備に要する期間として、円滑な対応が可能となるよう適当と考えられる期間を設定しています。","theme":"施行時期","section":"保険業法施行規則","tags":["比較推奨","システム・比較ツール"]},{"no":179,"location":"第227条の2第3項第4号","comment":"当社(自動車販売店)においては、損害保険4社を取り扱い、現状は店舗ごとに推奨損保を定めて販売している。\n取扱損保の中から顧客に合った商品を比較説明し販売することは、顧客の最善利益という点でもちろん必要なことだと思うが、ハ方式が廃止されると、4社すべての商品について比較説明や見積作成が必要となり、保険募集人・顧客双方の負担が大きくなると懸念している。\n比較推奨販売自体は顧客の最善の利益の観点から理解するものの、保険募集人が全商品に習熟し適切に提案できる体制を整えるには相当の期間(約3年)が必要であるため、実施に当たっては十分な猶予期間を設けてほしい。","pageStart":105,"pageEnd":105,"answer":"今回の改正案の施行期間については、乗合代理店の実務や経営に与える影響等も考慮し、社内規程の改正や業務フローの整備、システム対応、募集人教育等の体制整備に要する期間として、円滑な対応が可能となるよう適当と考えられる期間を設定しています。","theme":"施行時期","section":"保険業法施行規則","tags":["比較推奨","ハ方式","顧客の最善の利益","システム・比較ツール"]},{"no":180,"location":"第227条の2第3項第4号","comment":"当社(自動車販売店)においては、損害保険4社を取り扱い、現状は店舗ごとに推奨保険会社を選定して販売している。比較推奨販売は顧客の最善の利益の観点から理解できるものの、全保険募集人が4社の商品に習熟し適切に比較・説明できる体制を整えるには相当の期間(約3年)が必要であるため、比較推奨販売の実施に当たっては十分な猶予期間を設けてほしい。","pageStart":105,"pageEnd":105,"answer":"今回の改正案の施行期間については、乗合代理店の実務や経営に与える影響等も考慮し、社内規程の改正や業務フローの整備、システム対応、募集人教育等の体制整備に要する期間として、円滑な対応が可能となるよう適当と考えられる期間を設定しています。","theme":"施行時期","section":"保険業法施行規則","tags":["比較推奨","顧客の最善の利益","システム・比較ツール"]},{"no":181,"location":"第227条の2第3項第4号","comment":"保険業法施行規則第227条の2第3項第4号ハ廃止に向け、システムの導入を検討しているが、コストがかかり過ぎる。\n損保協会の自己点検内容に基づき対応を進めているが、今後のメンテナンスを含め相当量の業務負荷が発生してい105る。\n体制整備を進める上で専門知識を有した人材が不足しており、人材会社へ相談したが、そもそも該当人材自体が不足している状況である。\n取扱保険会社を減らす場合、当社の取扱いではなくなってしまい、既存のご契約者さまにもご迷惑をお掛けすることとなるため、安易に判断できない状況である。\nまた、対応を進めていく中で、改めて自動車保険は商品内容や保険料に大きな差がなく、時間をかけて顧客にご説明することにどこまで意味があるのか、また顧客が本当に望まれているのか疑問に感じており、意向が明確ではない顧客にとっては、かえって分かりにくくなるのではないかと懸念している。\n求められている内容については理解しているが、全体として準備期間が不足しており、本部保険部門はパンク状態である。","pageStart":105,"pageEnd":106,"answer":"今回の改正案の施行期間については、乗合代理店の実務や経営に与える影響等も考慮し、社内規程の改正や業務フローの整備、システム対応、募集人教育等の体制整備に要する期間として、円滑な対応が可能となるよう適当と考えられる期間を設定しています。","theme":"施行時期","section":"保険業法施行規則","tags":["ハ方式","システム・比較ツール"]},{"no":182,"location":"－","comment":"システム改修や教育体制の再構築には長期間を要するため、比較推奨販売規制の施行時期および猶予期間を延長し、最長で2029年3月末までとすることを希望する。\nまた、商品内容が類似しており比較説明が形骸化しやすい現状を踏まえ、保険会社各社に対して商品設計の差別化を促すことを求める。","pageStart":106,"pageEnd":106,"answer":"貴重なご意見として承ります。\n今回の改正案の施行期間については、乗合代理店の実務や経営に与える影響等も考慮し、社内規程の改正や業務フローの整備、システム対応、募集人教育等の体制整備に要する期間として、円滑な対応が可能となるよう適当と考えられる期間を設定しています。","theme":"施行時期","section":"保険業法施行規則","tags":["比較推奨","システム・比較ツール"]},{"no":183,"location":"－","comment":"改正後の保険販売に係る監査について、基本的な監査項目は業界共通の項目として整理してほしい。\nまた、改正案が施行された後、代理店内部での展開や準備106を十分に行えるよう、運用開始までに一定の準備期間を確保してほしい。","pageStart":106,"pageEnd":107,"answer":"保険会社が乗合代理店に対して実施する監査の具体的な監査項目については、法令等において、一律に定める性格のものではないと考えます。\nなお、改正案に係る施行期間については、No.163～181を参照願います。","theme":"施行時期","section":"保険業法施行規則","tags":[]},{"no":184,"location":"第227条の2第3項第4号","comment":"保険業法施行規則第227条の2第3項第4号ハ(以下、ハ方式とする。)が廃止された場合、現行の募集・管理実務との乖離が生じ、特に乗合代理店においては、実務運用上、いくつかの不具合が発生するおそれがあると考える。\n乗合代理店では、お客様に対して適切な意向確認を行った結果、複数の保険会社による保険料や補償内容の比較を求められるケースが想定される。その際、保険募集人が各保険会社の商品内容や保険料体系について十分な理解を有していなければ、見積作成や説明に相当の時間を要することとなり、迅速かつ円滑な顧客対応に支障を来すおそれがある。\n特に、ハ方式廃止後の新たな運用に関する十分な教育・研修が行われないまま比較説明を求められる状況となった場合、保険募集人が理解や経験の深い特定の保険会社の商品に説明や提案が偏る可能性が否定できない。その結果、代理店全体としての取扱保険会社の構成比率、いわゆる損保割合に偏りが生じることも懸念される。\nこのような状況は、必ずしもお客様の最善の利益に資するものとは言えず、制度改正の趣旨とは異なる結果を招くおそれがあると考える。また、現行の業務フローや社内規程、システムがハ方式を前提として構築されている代理店においては、短期間での見直しが求められることにより、事務負担や対応コストの増加が生じる点についても留意が必107要である。\n以上を踏まえ、ハ方式の廃止に当たっては、十分な経過措置の設定、実務に即した具体的な代替運用の明確化、並びに乗合代理店における教育・研修体制の整備や周知支援を併せて実施いただくことを要望する。","pageStart":107,"pageEnd":108,"answer":"貴重なご意見として承ります。\nなお、保険代理店は、保険業法施行規則第227条の2第3項第4号ハの廃止にかかわらず、保険募集を受託する所属保険会社等の保険商品を十分に理解した上で、顧客に対して、適切に保険募集を行う必要があります。\nこのため、貴見にある、保険募集人が各保険会社の商品内容や保険料体系について十分な理解を有していない、という状況は、保険契約者等の保護の観点から不適切な状況と考えます。\n今回の監督指針改正は、こうした法令上の基本的な考え方を踏まえ、乗合代理店における比較推奨販売について、顧客の意向に基づく適切な募集が行われるよう、その在り方を整理・明確化したものです。\n保険代理店においては、改正の趣旨を踏まえ、受託する所属保険会社等の保険商品について、顧客が理解できるよう、適切に説明できる体制を整備するなど、公正な保険募集に努める必要があります。\nなお、改正案に係る施行期間については、No.163～181を参照願います。","theme":"施行時期","section":"保険業法施行規則","tags":["比較推奨","ハ方式","意向把握","システム・比較ツール"]},{"no":185,"location":"第227条の2第3項第4号","comment":"保険業法施行規則第227条の2第3項第4号ハの少なくとも1年半以上(各社の26年度代理店手数料ポイント適用期間が終了するまで、若しくは下記提案の代理店手数料ポイント評価制度が適用されるまで)の暫定的な運用の許容を提案する。\n更には、監督指針II－4－2－14代理店手数料の算出方法において、損害保険会社による評価項目として、「規模・増収率」の排除、もしくは、代理店手数料の算出方法において、「規模・増収率」が代理店手数料算出基準の一定割合以下(未だに規模・増収率に対する評価基準が5割以上の損害保険会社が存在しているため、例えば3割以下、若しくは特定の損害保険会社に対する保険契約規模・増収率によらない等)とすべきである。\n保険会社は、各社の保険商品の特性や補償範囲の組み合わせ、保険料等により保険募集を行っているのであり、乗合代理店に対する手数料は規模・増収率、シェアではなく、共通の代理店品質評価基準(日本損害保険協会)によって評価されたポイントに則って手数料を定めるべきであり、保険会社各社の都合によるポイント制度により保険代理店の手数料率が変動するべきではないと考える。\n108現状の改正案のまま施行した場合、多くの乗合代理店は保険商品毎の乗合の解消、もしくは専属代理店への移行に繋がり、結果的に顧客の選択の機会の減少となり、顧客本位ではない改正になりかねないと考える。","pageStart":108,"pageEnd":109,"answer":"貴重なご意見として承ります。\n今般の改正の趣旨は、保険業法に基づく意向把握を前提として、顧客の意向等に照らし、顧客による適切な商品選択の機会を確保する点にあります。\n施行時期や実務対応については、保険代理店における社内規程、教育、システム、記録・検証態勢等の整備に要する期間や実務負担にも留意する必要があると考えます。","theme":"ご意見","section":"保険業法施行規則","tags":["手数料・インセンティブ","ハ方式","意向把握","証跡・記録","システム・比較ツール"]},{"no":186,"location":"－","comment":"代理店手数料ポイントを形成する項目の「規模・増収」を完全に排除、もしくは「乗合保険会社全社集計での規模・増収」にすることが望ましい。\n各保険会社毎の規模・増収の場合、引き続き手数料ポイント(代理店手数料)を稼ぐ為に、各保険会社の前年実績を考慮し、意向が曖昧なお客様への保険提案が、代理店にとってメリット(代理店手数料額が高いなど)のある保険会社を提案される可能性が高くなる。(本来、同じような保険料水準で補償が手厚いにもかかわらず、実績が不足している保険会社を提案してしまうリスクがある。)\n「規模・増収」の完全排除が理想であるが、どうしても残すのであれば、乗合保険会社全社集計での規模・増収に変更することで上記のリスクを限りなく最小化出来ると考える。","pageStart":109,"pageEnd":109,"answer":"貴重なご意見として承ります。","theme":"ご意見","section":"保険業法施行規則","tags":["手数料・インセンティブ"]},{"no":187,"location":"－","comment":"比較推奨の推進に伴う「商品偏り」は不可避であることを前提に、手数料制度を抜本的に見直す(出来高・前年対比・規模連動の廃止)必要があると考える。\n比較推奨販売を推進すれば、商品改定等により、保険会社商品の優劣(保険料水準、引受条件、補償範囲、特約設計、支払実務等)が変動し、代理店における推奨が特定の保険会社に偏る局面は避けられない。\n109さらに、その偏りは市場・商品改定の状況に応じて数年単位で回転することが予想される。\nこの状況下で、代理店手数料が「売上高」、「前年対比」、「規模・増収」等と連動する仕組みを残すことは、比較推奨販売の趣旨に反し、顧客利益と相反する誘因を温存することになる。\n代理店が顧客利益を優先して推奨すると、結果的に特定の保険会社へ偏る局面が生じ得るにもかかわらず、手数料制度がそれを不利益として扱うなら、現場には“制度に逆らえない”圧力が生じる。\nついては、以下を強く要望する。\n・代理店手数料について、売上・前年対比・規模等に連動する評価・ポイント制度を一切廃止し、顧客本位の推奨を阻害するインセンティブを排除すること・規模により、同一の顧客・同一の補償に対して代理店に支払われる報酬に差が生じる仕組みは不公平であり、顧客から見ても説明困難であるため、是正すること・当該仕組みが、保険会社誘導による代理店統合・合併を推し進めてきた一因となっている点を踏まえ、公正な競争環境の観点からも抜本的に見直すこと","pageStart":109,"pageEnd":110,"answer":"貴重なご意見として承ります。","theme":"ご意見","section":"保険業法施行規則","tags":["手数料・インセンティブ","比較推奨"]},{"no":188,"location":"－","comment":"比較推奨販売について、保険会社の代理店手数料ポイントが代理店の適正な比較推奨販売を阻害している。\nまた、保険会社は代理店手数料ポイントで代理店の囲い込みを狙っていることも事実であり、保険会社の代理店手数料ポイントは不公正な要素が多くあり、その存在自体が110諸悪の根源となっているケースが多い。\n代理店の募集品質が高く、適切な比較推奨販売を実施できるが、保険会社の手数料ポイントが低ければ、比較する上で推奨商品の選択に迷いが出るのが通常である。\n顧客本位を選択した結果代理店の収益が2割も3割も減るとすれば、経営者としては、このような行為に他の意味合いを見出さなければならない。\nこのまま施行した場合、募集品質の低下にも繋がり得ると考えるが、それでも無理に施行する意味はあるのか。\n保険会社の代理店手数料ポイント制度の改廃、業界統一の代理店品質評価等を設けた上で比較推奨販売が施行されることを希望する。\n損保有識者会議から既に長い年月が経過しており、保険会社は2026年度代理店手数料体系、2027年度代理店手数料体系を個社理論で構築している。\n金融庁は代理店手数料は民民の問題で不介入とせず、早期に適正な比較推奨が行われるよう保険会社を指導いただきたい。","pageStart":110,"pageEnd":111,"answer":"貴重なご意見として承ります。","theme":"ご意見","section":"保険業法施行規則","tags":["手数料・インセンティブ","比較推奨"]},{"no":189,"location":"第227条の2第3項第4号","comment":"監督指針における「比較推奨を行う場合の留意事項」について、改正案が示す顧客本位の比較推奨販売という基本的な方向性には、賛同する。\nもっとも、比較対象となる商品の間で手数料(以下、手数料ポイントを含む。)水準に著しい乖離がある場合、比較推奨の中立性・適切性が構造的に損なわれるリスクが高まる点については、損害保険代理店の実務に即したより明確な111位置づけが必要と考える。\nここでいう「著しい乖離」とは、同種・同水準の商品間において、当該差異が代理店の説明配分や提案プロセスに実質的に影響を与え得る程度の差を指す(定量基準の画一設定を求める趣旨ではない。)。\n本意見は、手数料乖離の存在のみをもって直ちに違法・不適切と断定する趣旨ではない。\n他方、生命保険分野では、過去に公平・中立を標榜しながら、顧客意向に即さず高い手数料の商品が販売された事実が公的資料・報道で確認されており、手数料乖離が販売実務に深刻な影響を及ぼし得ることは抽象的懸念にとどまらない。\n1.乗合代理店における複数社比較の実務について乗合代理店では、複数社の商品を取り扱い、顧客意向に応じて比較・説明を日常的に行う。\nもっとも、商品設計、特約構成、引受条件、事故対応体制、システム等は必ずしも共通化されておらず、実務上は一定の整理・抽象化を前提に比較説明せざるを得ない。\nこうした環境下で手数料に著しい乖離が存在すると、説明の厚み(深み)や資料の粒度、比較軸の設定が無意識のうちに手数料の高い保険会社の商品に寄りやすく、外形上は比較しているように見えながら実質的中立性が損なわれ得る構造的リスクが生じる。\n2.比較推奨に内在する構造的リスク手数料の大きな乖離がある場合に顕在化しやすいリスク112は、主に次の3点である。\n・説明内容・説明量の偏在(説明の厚みが高手数料側に厚く、低手数料側に薄くなる。)\n・比較観点・比較軸の選択による結論の偏向(どの観点を主軸に置くかで評価が反転)\n・推奨理由の構成・提示順序による印象誘導(名目上は複数提案、実質は単一誘導)\nこれらは個々の担当者の善意・努力の問題ではなく、収益構造が意思決定に影響し得る制度的・構造的問題である。\n実務上の恒常的バイアスとして現れるがゆえに、顧客本位の業務運営の実効性を阻害する。\n3.制度的認識の明確化と実務への配慮(監督指針の言語との整合)\n改正案は、顧客本位の業務運営の実効性確保や、保険会社の代理店への過度な便宜供与・手数料の影響といった論点を正面から扱い、比較推奨の中立性確保を明確に志向している。\nしたがって、「比較推奨を行う場合の留意事項」において、比較対象商品間に著しい代理店手数料乖離が存在する場合には、比較推奨の中立性・適切性が損なわれ得る構造リスクがあることを制度上明示しており、改正案の趣旨と整合する。\nまた、こうした明示は、便宜供与・手数料に起因する偏りを抑止しようとする最近の監督指針改正の方向性にも親和113的である。\nその際に重要なのは、画一的・過度な形式対応を求めないことである。\nすなわち、代理店の規模、業態、取扱保険会社数等の実務実態を踏まえ、合理的かつ実効的な運用が可能となるよう、留意事項の書きぶりを整えることが望ましい。\nこれにより、監督指針の実効性を高める観点からも、顧客の最善の利益の確保と代理店実務の持続可能性の両立を図ることができ、比較推奨制度に対する顧客の信頼の向上にも資する。","pageStart":111,"pageEnd":114,"answer":"貴重なご意見として承ります。","theme":"ご意見","section":"保険業法施行規則","tags":["便宜供与","手数料・インセンティブ","比較推奨","顧客の最善の利益","システム・比較ツール"]},{"no":190,"location":"－","comment":"顧客が損害保険会社の選択を行う前提となる中で、代理店が特定の損害保険会社に誘導してしまうリスクがあると考えられるため、契約数や保険料に応じた加重方式のポイント体系は見直すべきと考える。","pageStart":114,"pageEnd":114,"answer":"貴重なご意見として承ります。","theme":"ご意見","section":"保険業法施行規則","tags":[]},{"no":191,"location":"－","comment":"生命保険の乗合代理店における比較推奨販売が歪められる1つの要因として、生命保険会社の手数料ランク査定の問題がある。\n生命保険会社が手数料ランクを廃止し、すべての代理店で同じ手数料とすることで手数料ランク査定のための恣意的な販売を無くすことができると考える。","pageStart":114,"pageEnd":114,"answer":"貴重なご意見として承ります。","theme":"ご意見","section":"保険業法施行規則","tags":["手数料・インセンティブ","比較推奨"]},{"no":192,"location":"－","comment":"ネット通販等と異なり、そもそも代理店を通してご加入される顧客の多くが、保険商品知識には不安を覚えている方が多いことから、「安さ」以外の意向は把握しづらい可能性がある。\n仮に「補償の充実」に意向確認ができた場合でも、保険商114品の特約は膨大であることから、顧客も全ての特約の説明を行うことは情報過多となることから望んでいないケースが太宗を占めており、顧客の状況を把握した代理店による主体的情報提供は益々重要になると考えている。\nしかし、募集人が代理店手数料ポイントの高い保険会社の特約に優位性を持たせ、その保険商品へ誘導する事は容易に想像できる。\n保険業法施行規則第227条の2第3項第4号ハの廃止によって、本来目指すべき顧客本位が担保されるかは非常に心配であり、「保険会社毎の代理店手数料ポイントの多寡」がある限り、今般の改定を潜り抜けられてしまうおそれがあると考えている。\n例えば、顧客の意向が明確に「安さ」にあった場合、乗合保険会社すべての見積をしてみなければ、「安さ」で優位に立つ保険商品は提案できないが、見積り作成やエビデンスとしての保管作業まで含めると、代理店の事務ロードは膨大となり、費用対効果として成り立たなくなるおそれがある。\n加えて、各保険会社の特約に関する説明も必要となる。\n代理店にはシステム設備やセキュリティ整備、監査部門設置、事故対応部門設置等体制整備の強化が求められており、設備投資、人材確保投資等のコストは膨れ上がる一方である。\n多くの代理店では、代理店手数料ポイントの低下に加えて、教育にかける時間も今まで以上に必要となり、一人当た115りの労働生産性は減少している。\n従来より、給与水準の低い保険代理店が多く、賃上げもできないことから、優秀な人材を確保することも難しい。保険会社からの出向者も引き上げとなり、現場の募集品質の低下が危惧される。\n保険代理店の体制整備の本質は、代理店の社員各々が「私の契約者」では無く、「わが社の契約」という想いで、組織で顧客をお守りできるという体制にある。\n固定給の代理店であるほど人件費の余裕は無く、設備投資や人材確保が難しく、結果として、募集品質低下のツケは顧客に影響してしまう。\nこのような状況を鑑みた場合、代理店は「乗合保険会社の選別」を行う可能性がある。\n「代理店手数料ポイントの低い保険会社」や「保険会社の非により代理店が苦情を受け、そのフォローに辟易としている保険会社」、「保険見積システムが脆弱な保険会社」等、代理店事情で保険会社の選別が加速することが考えられる。\n保険会社がミスをしても代理店手数料のプラスは無いが、代理店がミスをした場合、代理店手数料がマイナスになる保険会社もある。\nここで問題なのは、「代理店の保有契約は保険会社が所有」との法律である。顧客の太宗は代理店の信頼度や利便性、相談しやすさに軸足を置いて保険に加入していると思われる。\n116しかるに、保険会社の選別により保険会社からの委託解除が行われると、代理店としては一切アフターフォローができなくなり、顧客が困惑してしまう可能性がある。\n保険契約の移管のほか、保険契約が満期切れし、保険事故が発生しても顧客をお守りできない事例が発生する可能性がある。\n委託解除後には保険会社の研修生や見ず知らずの代理店から満期案内があっても、「不信な人からの電話にはでない、訪問されても出ない」等、特に高齢者においては顕著である。\n委託解除時に顧客に案内する「代理店移管のご案内文」などを送付したとしても、数年経てば記憶も定かでは無くなる可能性もある。\n例えば、これらの事を想定した場合、以下の事はできないか。\n・代理店委託契約は解除せず、代理店が保有する契約はアフターフォローだけができるよう制度改定する。\n代理店が委託解除先の保険会社に対して、契約保険料を支払い契約満了まで責任をもって、顧客の相談に乗れるようにする。\n満期時のアナウンスも顧客に迷惑が掛からないよう確実に行う。\n・代理店ロードを削減するために、代理店手数料ポイントの体制整備評価基準を同一とする。","pageStart":114,"pageEnd":117,"answer":"貴重なご意見として承ります。\n今般の改正の趣旨は、保険業法に基づく意向把握を前提として、顧客の意向等に照らし、顧客による適切な商品選択の機会を確保する点にあります。\n一方で、全ての案件について、全ての取扱保険会社の商品を網羅的に比較・説明し、又は詳細な記録を一律に求めるものではありません。\n代理店の規模・業務特性、募集形態、取扱商品、顧客の意向等を踏まえた実効的な態勢整備が重要です。\nまた、代理店手数料、手数料ポイント、評価体系等が、顧客の意向に沿わない商品選別や特定の保険会社への不適切な誘導につながることは適切ではありません。\nさらに、乗合保険会社の見直しや代理店委託契約の終了等を行う場合には、既契約者の保全、異動、事故対応、満期案内等に支障が生じないよう、顧客保護の観点から、保険会社及び保険代理店において適切な引継ぎ・管理態勢を整備することが重要です。","theme":"ご意見","section":"保険業法施行規則","tags":["手数料・インセンティブ","ハ方式","意向把握","証跡・記録","出向","委託解除","システム・比較ツール"]},{"no":193,"location":"－","comment":"本改正案が目指す、乗合代理店における比較推奨販売の117透明性向上、顧客の最善の利益(顧客本位)に資する募集管理態勢の強化という方向性には賛同する。\n他方で、比較推奨販売ルールや募集行為の規定整備、意向把握書類・記録の保管をいかに厳格化しても、「販売主体の業務構造」自体が利益相反・不適切誘導を生みやすい形態(例：ディーラー、金融機関等における本業と一体化した保険販売)では、本質的な改善が困難であると考える。\n形式的な記録や規程整備を積み上げても、根本的な不正・不適切誘導が起こり得る環境が温存される限り、実効性には限界があると考える。","pageStart":117,"pageEnd":118,"answer":"貴重なご意見として承ります。\n乗合代理店における比較推奨販売については、記録・規程整備にとどまらず、顧客の意向に沿わない商品選別や特定の保険会社又は特定の保険契約への不適切な誘導が行われないよう、実効的な保険募集管理態勢を整備することが重要です。\n特に、保険代理店業務以外の業務との関係や取引上の力関係、手数料その他の経済的誘因等により、顧客本位の業務運営が損なわれるおそれがある場合には、乗合代理店は、利益相反管理、保険募集人への教育・管理・指導、モニタリング等を通じて、実態に即した対応を行う必要があります。\n金融庁としても、形式的な記録・規程整備にとどまらず、顧客本位の業務運営が実質的に確保されているかという観点から、引き続き、適切にモニタリングしてまいります。","theme":"ご意見","section":"保険業法施行規則","tags":["手数料・インセンティブ","比較推奨","意向把握","顧客の最善の利益","証跡・記録"]},{"no":194,"location":"－","comment":"比較推奨販売の実効性確保に関して、最も懸念するのは、最終的に「販売側の都合」や「販売側に有利な事情」により、顧客が意図せず特定の商品・保険会社へ誘導され得る点である。\n比較推奨販売の説明や記録が整っていても、運用が形式化すれば、実質的には誘導を正当化する手段となり得るため、以下の観点で、妥協のない改正・監督運用を要望する。\n・推奨理由の説明が「形式」にとどまらず、顧客利益に資する比較要素(補償範囲、免責、支払限度、特約構成、引受範囲、更新時の条件、支払実務等)に基づくことを、監督上より明確に位置付けること・「事務都合」、「社内事情」、「手数料・評価等に紐づく事情」など、顧客利益と無関係又は相反し得る要因が推118奨に影響しないよう、監督上の整理(不可視な誘導の排除)\nを強化すること・監査・検証の重点を、記録の有無だけでなく「推奨の合理性(顧客利益との整合)」へ置くこと","pageStart":118,"pageEnd":119,"answer":"貴重なご意見として承ります。\n比較推奨販売においては、形式的な説明や記録の整備にとどまらず、顧客の意向に沿って、保障(補償)内容、保険料水準、免責、特約等の顧客利益に関わる要素を踏まえ、合理的かつ一定の具体性を有する基準や理由等に基づき提示・推奨が行われることが重要です。\nまた、手数料水準、営業評価、取引実績、事務都合その他の販売側の事情により、顧客の意向に沿わない特定の保険会社又は特定の保険契約へ誘導することは適切ではありません。\n各保険会社及び乗合代理店においては、記録の有無だけでなく、推奨理由が顧客の意向及び利益に照らして合理的であるかを確認・検証し、必要に応じて保険募集人への教育・管理・指導や業務改善につなげる実効的な態勢を整備することが求められます。\n金融庁としても、顧客本位の業務運営が実質的に確保されているかという観点から、引き続き、適切にモニタリングしてまいります。","theme":"ご意見","section":"保険業法施行規則","tags":["手数料・インセンティブ","比較推奨","証跡・記録","更改・継続"]},{"no":195,"location":"－","comment":"ディーラー・金融機関等による保険販売を抑止・禁止する法整備(制度の本質改善)として、本改正の趣旨(顧客本位の徹底)を真に実現するためには、比較推奨販売ルールや書類保管の強化と並行して、利益相反が構造的に発生しやすい販売形態そのものを是正する必要があると考える。\n顧客との既存取引や優越的な関係性、本業の取引継続・条件等の文脈の中で保険が提案されやすく、顧客が自由に比較・選択しにくい状況が生じ得る。\nこの構造は、いかに記録・規程を厳格化しても、不適切誘導を完全に排除することは困難である。\nついては、ディーラー・金融機関等において、保険販売が本業取引に埋め込まれ、顧客の自由な選択を阻害し得る形態について、保険の取扱いを原則として認めない(又は厳格に制限する。)方向で、保険業法・関係法令の整備(法改正を含む。)を検討・推進することを要望する。\nまた、当該販売形態に固有の利益相反・不適切誘導リスクがあることを前提に、比較推奨販売の枠組みだけでは足りない“構造規制”の議論を公式に開始し、制度としての結論を示すことを要望する。","pageStart":119,"pageEnd":119,"answer":"貴重なご意見として承ります。\nディーラー、金融機関等における保険募集については、本業取引との関係や顧客との取引上の立場等により、顧客の自由な商品選択が阻害され、又は、特定の保険会社若しくは特定の保険契約への不適切な誘導が生じることのないよう留意する必要があります。\n今般の改正の趣旨は、保険業法に基づく意向把握を前提として、顧客の意向等に照らし、顧客による適切な商品選択の機会を確保する点にあります。\nまた、保険募集人においては、形式的な記録・規程整備にとどまらず、本業取引との関係を含む利益相反や顧客の適切な商品選択の機会を阻害し得るリスクを踏まえ、実効的な募集管理態勢を整備することが重要です。\n金融庁としては、いただいたご意見も踏まえ、顧客本位の業務運営が実質的に確保されているかという観点から、引き続き、適切にモニタリングしてまいります。","theme":"ご意見","section":"保険業法施行規則","tags":["比較推奨","意向把握","証跡・記録"]},{"no":196,"location":"－","comment":"2社以上の保険会社の取扱いがあり、各社の内容についてきちんと理解した上でのお客様への正しい提案をしなけれ119ばならないため、教育等含め負担がかかるがしっかりと取り組むことが重要と考える。","pageStart":119,"pageEnd":120,"answer":"貴重なご意見として承ります。\n乗合代理店においては、複数の所属保険会社等の保険契約を取り扱う以上、顧客の意向に沿った適切な選別・提示・推奨が行われるよう、商品内容、保障(補償)内容、保険料水準、特約、留意点等について、保険募集人が十分に理解していることが重要です。\n各保険会社及び乗合代理店においては、自社の規模・業務特性、取扱商品等を踏まえ、保険募集人に対する教育・管理・指導を適切に行い、顧客に正確で分かりやすい情報提供が行われる態勢を整備することが求められます。","theme":"ご意見","section":"保険業法施行規則","tags":[]},{"no":197,"location":"－","comment":"乗合代理店における比較推奨販売は、現実的に販売する者の商品知識によってどうしても得手不得手が出てきてしまう。保険会社のサポートの制限が大きくなってきている状況で、急にスキルを上げるのは困難と考える。\n自動車販売会社としては、自動車保険に対しての対応は注力していくが、自動車保険以外の保険まではもう少し準備が必要と考える。保険会社からの利益供与としてサポートが受けられない状況で、体制を整えるには時間が足りず急すぎる。\nついては、今回の比較推奨販売の改正において、自動車保険以外は延期していただきたい。","pageStart":120,"pageEnd":120,"answer":"貴重なご意見として承ります。\n乗合代理店においては、複数の所属保険会社等の保険契約を取り扱う以上、顧客の意向に沿った適切な選別・提示・推奨が行われるよう、商品内容、保障(補償)内容、保険料水準、特約、留意点等について、保険募集人が十分に理解していることが重要です。\n各保険会社及び乗合代理店においては、自社の規模・業務特性、取扱商品等を踏まえ、保険募集人に対する教育・管理・指導を適切に行い、顧客に正確で分かりやすい情報提供が行われる態勢を整備することが求められます。","theme":"ご意見","section":"保険業法施行規則","tags":["便宜供与","比較推奨"]},{"no":198,"location":"第227条の2第3項第4号","comment":"ディーラー代理店として、比較推奨販売の改正案において、保険業法施行規則第227条の2第3項第4号ハ(以下、ハ方式とする。)を廃止することは理解できるが、その代替案もしくは改善策については理解できない。\nそもそも比較推奨販売方式において、同号イ(以下、イ方式とする。)、同号ロ(以下、ロ方式とする。)、ハ方式があったのは、代理店販売状況も把握したうえで策定されていたものと考えている。\n昨今の保険業界不祥事により今般の改正に至っていると思われるが、改正案がハ方式を廃止して、イ方式・ロ方式をより具体的な改正案にしたとしか読み取れず、問題の原因はそもそも推奨販売方式(ハ方式)を作った国にあるのでは120ないかと感じてしまう。\nまた、改正案が出たうえで、社内および保険会社とも実際に何をどこまでしたらよいか話したが、改正案の捉え方の違いや具体的な行動についても考え方が違い、議論がまとまらなかった。法律への理解について、そこまで、いろいろな人が話しても具体的な行動が決まらないような規制で良いのか。\nまた、有識者が話した結果が、ハ方式を廃止し、イ方式・ロ方式をより具体的にした改正案となっており、誰でも考えられそうなものとなっており残念に感じた。\n顧客本位の業務運営の理解はしているが、もっと現状の代理店への影響も考えた改正にしてほしい。","pageStart":120,"pageEnd":121,"answer":"貴重なご意見として承ります。\n今般の改正の趣旨は、保険業法に基づく意向把握を前提として、顧客の意向等に照らし、顧客による適切な商品選択の機会を確保する点にあります。\nまた、全ての案件について、画一的・過度に詳細な比較説明や記録を求めるものではなく、代理店の規模・業務特性、募集形態、取扱商品、リスクの状況等を踏まえた実効的な態勢整備が重要です。\n金融庁としては、形式的な対応に偏ることなく、顧客本位の業務運営が実質的に確保されるよう、保険会社及び代理店の実務状況も踏まえつつ、適切にモニタリングしてまいります。","theme":"ご意見","section":"保険業法施行規則","tags":["比較推奨","ハ方式","意向把握","証跡・記録"]},{"no":199,"location":"第227条の2第3項第4号","comment":"乗合代理店において顧客本位の業務運営を行うにあたり、代理店独自の意向把握では限界がある。\n補償内容全ての意向を把握するのは不可能に近い。協会や保険会社共通の最低限の質問事項の掲載された意向把握シートの提供が必要である。\n代理店自立と謳ってバラバラに手動させると、また同じ時代の繰り返しで、手数料率の高い保険会社に誘導する事が可能になる。\n業界の共通の意向把握や、最低限の必要な意向把握の質問事項を作成する必要がある。\n121","pageStart":121,"pageEnd":122,"answer":"貴重なご意見として承ります。\n意向把握・確認については、保険業法第294条の2に基づき、顧客の意向を把握し、当該意向に沿った保険契約の提案・説明を行うために重要なものです。\n一方で、金融庁として、全ての保険契約・募集形態に共通する意向把握シートや最低限の質問項目を一律に定めるものではありません。\n各保険代理店においては、取扱商品、募集形態、顧客属性、リスクの状況等を踏まえ、顧客の意向を適切に把握・確認できる実効的な方法を整備する必要があります。\nまた、意向把握が形式化し、手数料水準等の代理店側の事情による不適切な誘導につながることは適切ではありません。\nなお、業界団体等において、法令等を踏まえて、意向把握・確認や比較推奨販売の適切性の確保に向けた取組みが行われることは有意義であると考えます。","theme":"ご意見","section":"保険業法施行規則","tags":["手数料・インセンティブ","比較推奨","意向把握"]},{"no":200,"location":"－","comment":"意向確認の情報量が過多となり、形式的な比較確認や比較推奨販売制度自体が形骸化してしまわないように仕組み化、ガイドラインを作成いただきたい。","pageStart":122,"pageEnd":122,"answer":"貴重なご意見として承ります。\n意向把握・確認や比較推奨販売に係る説明・記録については、顧客の理解に資することが重要であり、情報量が過多となり、形式的な確認や記録作成自体が目的化することは適切ではありません。\n金融庁として、全ての募集形態に共通する様式やガイドラインを一律に定めるものではありませんが、各代理店においては、取扱商品、募集形態、顧客属性、リスクの状況等を踏まえ、顧客の意向を適切かつ分かりやすく確認できる実効的な方法を整備することが重要です。\nなお、実務負担の軽減や意向把握・確認の実効性向上の観点から、業界団体等において、法令等を踏まえて、参考となる様式、質問項目、実務例等を整理・共有する取組が行われることは有意義であると考えます。","theme":"ご意見","section":"保険業法施行規則","tags":["比較推奨","意向把握","証跡・記録"]},{"no":201,"location":"－","comment":"金融庁主導で業界共通のシステム基盤やAPI連携の標準化を推進し、代理店のコスト負担を軽減していただけるようご検討いただきたい。\n122","pageStart":122,"pageEnd":123,"answer":"貴重なご意見として承ります。\n比較推奨販売に係る実務対応において、システム連携やデータ標準化等は、代理店の業務負担軽減や記録・検証の実効性向上に資するものと考えられます。\n一方で、金融庁として、業界共通のシステム基盤やAPI連携の標準化について一律に定めるものではありません。各保険会社及び代理店においては、顧客保護、情報管理、業務効率性等に加えて、システムの安全性を確保するとともに、恣意的な運用等を防止し、比較推奨販売を適切に行うための実効的な態勢整備を行うことが重要です。","theme":"ご意見","section":"保険業法施行規則","tags":["比較推奨","証跡・記録","システム・比較ツール"]},{"no":202,"location":"第227条の2第3項第4号","comment":"体制整備について、規模の大小にかかわらずしっかりとした体制整備を持つことが代理店に求められていることは理解している。\n顧客との強い信頼関係によって成り立ってきた保険契約を、さらに確実にするために「顧客の意向」を第一に考えているかを確認する機能の確立はCSの観点からも必須と考えている。\n適切な比較推奨販売について、保険業法施行規則第227条の2第3項第4号ハ(以下、ハ方式とする。)の廃止について、顧客の意思を確認しないまま廃止するということに疑問を感じる。\n顧客が保険を選ぶ際の優先順位として、保険料比較、迅速かつ簡潔な事務手続き、事故発生時の解決サポート(スキル)等によって代理店の推奨方針が変わることに鑑みた上で「適切な比較」を行うことが、真の顧客本位なのではないか。\n代理店の都合による推奨が認められないことは承知しているが、代理店都合による保険会社の選定となっていないかチェックすることができないことを理由としてハ方式が廃止されたのではないかと思われ、全廃という考えは飛躍しすぎていると感じる。\n顧客が選ぶ際、迅速かつ簡潔な事務手続き及び事故発生時の解決サポートを優先される場合などにおいては、代理店が熟知・精通している保険会社を推奨することが、顧客123にとっても利便性が高く、顧客満足につながると考えている。\n自動車損害賠償責任保険(自動車損害賠償保障法第5条)\nは全自動車ユーザーに広くコストを負担させることで被害者救済を担保する他国にはない日本固有の素晴らしいシステムであるが、どこの保険会社で加入しても同一料金である上、取り扱い手数料を除く収入保険料は国によって管理されることから、比較推奨販売から除外することが適切であると考える。","pageStart":123,"pageEnd":124,"answer":"貴重なご意見として承ります。今般の改正の趣旨は、保険業法に基づく意向把握を前提として、顧客の意向等に照らし、顧客による適切な商品選択の機会を確保する点にあります。\n比較推奨販売に当たっては、保障(補償)内容、保険料水準等、顧客が重視している事項を把握し、その意向に沿って、合理的かつ一定の具体性を有する基準や理由等に基づき、保険契約を選別し、提示・推奨することが重要です。\nまた、全ての案件について、全ての取扱保険会社の商品を網羅的に見積り・説明することを一律に求めるものではなく、代理店の規模・業務特性、募集形態、取扱商品、顧客の意向等を踏まえた実効的な態勢整備が求められます。\n自動車損害賠償責任保険については、自動車損害賠償保障法に基づき加入が義務付けられており、補償内容や保険料が法令等により定められているため、一般の任意保険のように商品内容や保険料を比較して選択する性質は限定的です。\nしたがって、複数の保険会社の自動車損害賠償責任保険を取り扱っている場合であっても、保険業法施行規則第227条の2第3項第4号ロに係る対応が必要となるものではないと考えられます。\nなお、顧客から保険会社の指定がある場合には、その希望を踏まえて適切に対応する必要があります。また、指定がない場合であっても、保険代理店において、複数の保険会社の自動車損害賠償責任保険の取り扱いがあるときは、これら保険会社を顧客に明示した上で、例えば、前契約の保険会社、任意保険と同一の保険会社等、顧客が希望する保険会社がないかを確認することが重要と考えられます。\nいずれにしても、顧客の最善の利益を勘案せず、保険会社からの便宜供与、取引関係その他の代理店側の都合により、特定の保険会社の保険契約を恣意的に優先することは適切ではなく、保険代理店においては、顧客の希望に沿った保険契約の販売ができるよう体制を整備することが求められます。\nまた、顧客が希望する保険会社を当該代理店が取り扱っていない場合には、取扱可能な保険会社の範囲を説明し、顧客の理解を得た上で対応することが重要です。","theme":"ご意見","section":"保険業法施行規則","tags":["便宜供与","手数料・インセンティブ","比較推奨","ハ方式","意向把握","顧客の最善の利益","システム・比較ツール"]},{"no":203,"location":"第227条の2第3項第4号","comment":"個人の自動車保険をはじめとする家計分野の保険については、大半の人が保険会社ではなく、代理店を選んで加入している。\n一方で、今回の改正により、乗合代理店から1社専属代理店にすることを検討している代理店も多い。\nこれは顧客本位のための乗合制度が逆行していることに他ならない。\nテリトリー制などの便宜供与はあってはならないが、今回の比較推奨販売の改正は的外れであり、他の方法とすべきと考える。","pageStart":124,"pageEnd":124,"answer":"貴重なご意見として承ります。\n今般の改正の趣旨は、保険業法に基づく意向把握を前提として、顧客の意向等に照らし、顧客による適切な商品選択の機会を確保する点にあります。金融庁としては、比較推奨販売の適正化が形式的な対応にとどまらず、顧客本位の業務運営の実効性確保につながるよう、代理店の業務実態や顧客の適切な商品選択の機会への影響も踏まえつつ、引き続き、適切にモニタリングしてまいります。","theme":"ご意見","section":"保険業法施行規則","tags":["便宜供与","比較推奨","意向把握"]},{"no":204,"location":"－","comment":"各損害保険会社からの便宜供与の制限により、代理店から保険会社担当者へのサポートが制限されたり、休日にコールセンターがつながりにくくなっており、募集品質の低下につながりかねない懸念を感じている。\n124","pageStart":124,"pageEnd":125,"answer":"貴重なご意見として承ります。\n保険会社による保険代理店への便宜供与については、顧客の意向に沿わない商品選別や特定の保険会社への不適切な誘導につながることのないよう、適切に管理される必要があります。\n一方で、保険募集の適切性を確保するために必要な商品知識、事務手続、事故対応、照会対応等に関する教育・管理・指導や支援を一律に否定するものではありません。\n保険会社及び保険代理店においては、過度の便宜供与を防止しつつ、募集品質の維持・向上や顧客保護に必要な支援・連携がなされるよう態勢整備を行うことが重要です。","theme":"ご意見","section":"保険業法施行規則","tags":["便宜供与"]},{"no":205,"location":"第227条の2第3項第4号","comment":"適切な比較推奨販売の確保について、これまで保険業法施行規則第227条の2第3項第4号ハに基づいた募集において、顧客からの苦情、ご意見は無く、顧客の不利益になっていたという認識がないため維持を希望する。","pageStart":125,"pageEnd":125,"answer":"貴重なご意見として承ります。\n今般の改正の趣旨は、保険業法に基づく意向把握を前提として、顧客の意向等に照らし、顧客による適切な商品選択の機会を確保する点にあります。\n苦情等が顕在化していない場合であっても、顧客が推奨理由や比較対象を十分に理解しないまま特定の商品を選択している可能性もあるため、顧客の意向に沿った合理的かつ具体的な説明と、事後的に確認・検証できる態勢整備が重要です。\nなお、今般の見直しは、全ての案件について画一的・過度に詳細な比較説明や記録を一律に求めるものではなく、代理店の規模・業務特性、募集形態、取扱商品、顧客の意向等を踏まえ、実務に即した実効的な対応が求められるものです。","theme":"ご意見","section":"保険業法施行規則","tags":["比較推奨","ハ方式","意向把握","証跡・記録"]},{"no":206,"location":"第227条の2第3項第4号","comment":"乗合代理店における比較推奨販売の改正案に対する反対意見私は地方の自動車ディーラーで保険統括をしている。現場を預かる責任者として、今回の改正案には強い憤りと危機感を抱いている。\n金融庁は「消費者保護」を掲げているが、今回の改正案は現場の実態を完全に無視しており、結果として消費者と代理店の双方を苦しめるものと言わざるを得ない。\n125","pageStart":125,"pageEnd":126,"answer":"貴重なご意見として承ります。\n今般の改正の趣旨は、保険業法に基づく意向把握を前提として、顧客の意向等に照らし、顧客による適切な商品選択の機会を確保する点にあります。\n一方で、全ての案件について画一的・過度に詳細な比較説明や記録を一律に求めるものではなく、代理店の規模・業務特性、募集形態、取扱商品、顧客の意向等を踏まえ、実務に即した実効的な態勢整備が重要です。\n金融庁としては、顧客保護の実効性を確保しつつ、代理店の実務負担や現場への影響にも留意し、顧客本位の業務運営が実質的に確保されるよう、引き続き、適切にモニタリングしてまいります。","theme":"ご意見","section":"保険業法施行規則","tags":["比較推奨","意向把握","証跡・記録"]},{"no":207,"location":"第227条の2第3項第4号","comment":"消費者として今回の比較推奨の改正に対して反対する。\n乗合代理店が自己の都合で勧めたい商品を勧めていただくだけで構わず、比較推奨の規制を変更する必要はない。\n提案内容が気に入らなければ、他の代理店やインターネットで別の保険会社の別の保険に加入すればよいだけである。\n規制があるのでやむを得ず、比較推奨商品を提示され、見たくもない合理的な基準とか、比較商品の説明をされ、資料や確認書を配付され、サインをして、余計な時間を取られることは迷惑以外の何物でもない。\n必要なら、なぜこれを勧めているのか教えてくれ、と言えばよいだけの話である。\n民民の話に行政が介入すべきではない。\n現代は、Web検索や生成AIを使用すれば狙った情報は手に入る世の中である。\nむしろ、情報過多のほうが問題であることは明らか。\n日本全国の代理店が、情報提供をするとすれば、膨大な量になる。\n紙や労力の無駄でしかない。そもそも、自由主義経済であり、契約自由の原則がある。\nここにコストを投下し、最終的に消費者に転嫁されるの126は納得できない。\n比較推奨販売規制のようなレギュレーションによって代理店廃業を余儀なくされ、あるいは、大いに収益を圧迫されることになれば、国民経済的にも利益があるとは言えない。\n圧倒的な優位性ゆえにビッグモーター問題は生じたが、その本質は事業会社の兼業である。\nカーディーラーは車検証情報に独占的・最速にアクセスでき、補償開始日の情報も入手できる。\n車両購入者と車両の売買契約の過程において、簡単に顧客にコンタクトできる。\nよって、情報入手にほとんど努力を要せず、自動車保険設計ができるという競争上の圧倒的な優位性故に生じた問題であるので、少なくとも車検証情報を現代のIT技術によって、誰でも容易にアクセスできるようにすれば、その優位性は相当に減殺されるため、検討すべきである。\n少なくとも問題のあった自動車販売業においては兼業を禁止すべきであり、そのためには、上述の車検証情報のオープン化が不可欠であるため、相当の期間は必要となるが、いずれにせよ、起こった問題とその対処の間に関係がなく、適切な対応とは考えられない。\n便宜供与によって取り扱い保険会社を決めていたとしても、特に自動車保険等の定型的保険商品は、商品差も少なく、補償なりの保険料で大差がないことから、解決策として比較推奨販売の強化を行うという考え方は適切では127ない。\nバイイングパワーの行使によって不公正な取引をしているのであれば、独禁法理で規制すべきものである。\nそもそも、このような検討をするために、税金が使われていることに対しても許しがたいものを感じる。\n審議会・御用学者、こういった構造も、もう何十年と変わっていないと思うため、時代に合っておらず、見直すべきではないか。\nまた、我が国の保険商品は全て金融庁の認可を経て販売していると理解しており、一つ一つが合理的な商品だと思う。\n問題がある商品があるのであれば商品認可を取り消せばよいだけである。\n代理店に合理性を問うのは自己矛盾ではないか。\n顧客ニーズと関係のない手数料の高いリスク商品が、消費者の知識不足等により押し売りされてきたことが問題だったことから、ありふれた補償性商品に関して比較推奨の規制強化は適切ではないと考える。","pageStart":126,"pageEnd":128,"answer":"貴重なご意見として承ります。","theme":"ご意見","section":"保険業法施行規則","tags":["便宜供与","手数料・インセンティブ","比較推奨"]},{"no":208,"location":"－","comment":"顧客への契約内容の伝わりやすさや募集実務の効率化を図るべく、意向票・推奨理由書式・比較表、利益相反管理テンプレート等の標準様式の策定が必要と考えるがどうか。","pageStart":128,"pageEnd":128,"answer":"貴重なご意見として承ります。\n金融庁として、全ての募集形態に共通する様式やガイドラインを一律に定めるものではありませんが、各保険代理店においては、代理店の規模・業務特性、取扱商品、募集形態、顧客属性、リスクの状況等を踏まえ、顧客の意向を適切かつ分かりやすく確認できる実効的な方法を整備することが重要です。","theme":"ご意見","section":"保険業法施行規則","tags":[]},{"no":209,"location":"－","comment":"乗合代理店における適切な比較推奨販売の確保について、代理店経由での募集の強みである顧客との対話において、顧客のご意向を正確に把握するために事前にアンケー128トを行うことなどを想定しているが、意向把握のプロセス方法について、ガイドラインを提示していただきたい。","pageStart":128,"pageEnd":129,"answer":"貴重なご意見として承ります。\n金融庁として、全ての募集形態に共通する様式やガイドラインを一律に定めるものではありませんが、各保険代理店においては、代理店の規模・業務特性、取扱商品、募集形態、顧客属性、リスクの状況等を踏まえ、顧客の意向を適切かつ分かりやすく確認できる実効的な方法を整備することが重要です。","theme":"ご意見","section":"保険業法施行規則","tags":["比較推奨","意向把握"]},{"no":210,"location":"第227条の2第3項第4号","comment":"顧客が取扱損保全ての比較を希望された場合、見積書・申込書作成にかかる時間が大幅に増えることが想定される。\n顧客にとっても選択肢が広がり良いことであると思うが、対応するスタッフの労力面が非常に心配である。\n現在、様々な会社で人員不足や働き方改革による労働時間の制限があり、ギリギリの状況で対応している企業も多いことから、顧客の最善の利益と共に、企業側にとってもできる限り負担が少ない形での推奨販売方針の策定をご検討いただきたい。","pageStart":129,"pageEnd":129,"answer":"貴重なご意見として承ります。\n比較推奨販売においては、顧客の意向に沿って、合理的かつ一定の具体性を有する基準や理由等に基づき、保険契約を選別し、提示・推奨することが重要です。\n一方で、全ての案件について、全ての取扱保険会社の見積書・申込書を一律に作成し、網羅的に比較説明することまで求めるものではありません。\n各代理店においては、代理店の規模・業務特性、取扱商品、募集形態、顧客の意向等を踏まえ、顧客の理解と適切な商品選択の機会の確保に資するよう、実効的な態勢を整備することが重要です。","theme":"ご意見","section":"保険業法施行規則","tags":["比較推奨","顧客の最善の利益"]},{"no":211,"location":"第227条の2第3項第4号","comment":"本改正案において、比較推奨販売に関するルールの明確化・厳格化が図られている点について、改正案の趣旨は理解している。\n一方で、推奨販売に関して、「比較対象商品の選定理由」、「推奨理由の詳細な説明」、「適切性に関する記録」等の運用がなされた場合、保険募集に要する説明時間が大幅に増加し、顧客への負担も増すなど、顧客のニーズに合致しないことも想定され、かつ、業務負荷の増大も懸念される。\n自動車ディーラーの販売現場においては、車両説明、支払方法や下取り、付帯サービス等の説明と並行して、保険募集を行っており、保険募集に割ける時間には制約がある。\n129その中で推奨販売に伴う説明・記録の負担が増加した場合、商談時間の長期化による顧客の負担増、営業担当者の業務過多、本来重視すべき顧客理解や対話の質の低下に繋がるおそれがあると考える。\n特に、顧客に補償内容や保険会社に強い希望がない場合や、更新時の募集においても、同水準の推奨販売手続きを求められることは、実務上過度な負担となる。\nついては、以下の点について監督指針等において明確にしていただきたい。\n・顧客の意向が明確であり、補償内容に実質的な差異がない場合には、簡素な推奨・説明方法を認める・画一的な推奨販売プロセスではなく、募集形態や商談実態に応じた柔軟な運用を可能とする・説明時間の増加が顧客利便性を損なわないよう、実務負担とのバランスに十分配慮する比較推奨販売を実際に運用した際に、代理店が顧客本位の説明が可能なよう、実務現場の実態を踏まえた制度設計及び運用を要望する。","pageStart":129,"pageEnd":130,"answer":"貴重なご意見として承ります。\nなお、比較推奨販売に係る体制整備については、顧客の最善の利益を勘案しつつ、顧客の適切な商品選択の機会を確保するため、乗合代理店の規模や業務特性等に応じて、自社の募集実務や募集形態等を踏まえた適切な比較推奨販売が実施されるよう実効的な体制が整備されることが重要であり、監督指針は、一律かつ画一的な対応や、規模・業務特性等に照らして過度な実務上の負担を求める趣旨ではありません。","theme":"ご意見","section":"保険業法施行規則","tags":["比較推奨","顧客の最善の利益","証跡・記録","更改・継続"]},{"no":212,"location":"－","comment":"比較推奨販売の実務上の難易度が高まることにより、乗合保険会社の取扱数を限定する、あるいは専属代理店化を選択せざるを得ないケースも想定される。\nしかしながら、昨今の保険会社における不祥事や、代理店に不利となりえる代理店手数料ポイント体系の提示、一方的な委託形態の変更等が発生した場合、取扱保険会社の選択肢が失われ、代理店経営や顧客への安定的なサービス130の提供に支障をきたすリスクがある。\n現行の乗合制度を持続可能なものとするためにも、比較推奨販売保険業法施行規則第227条の2第3項第4号イ及びロについて顧客・代理店双方にとって理解しやすく、実務に即した運用をお願いしたい。","pageStart":130,"pageEnd":131,"answer":"貴重なご意見として承ります。","theme":"ご意見","section":"保険業法施行規則","tags":["手数料・インセンティブ","比較推奨"]},{"no":213,"location":"第227条の2第3項第4号","comment":"比較推奨販売の見直しにより、顧客の意向に沿わない選別による提案を行う保険業法施行規則第227条の2第3項第4号ハが廃止され、複数の比較可能な同種の保険契約の中から選別して提案する方法(同号ロ)が整理されたことは理解した。\n一方で、比較推奨販売の方法として位置付けられている同号イについても、今後見直しや変更が検討されているのかを確認したい。","pageStart":131,"pageEnd":131,"answer":"今般の比較推奨販売の適正化については、保険業法施行規則第227条の2第3項第4号を改正し、顧客の意向に沿わない選別による提案(同号ハ)を廃止し、二以上の比較可能な同種の保険契約の中から顧客の意向に沿って保険契約を選別することにより、保険契約を提示・推奨する(同号ロ)ことを明確化したものです。\n複数の保険契約の契約内容を比較して説明する場合(同号イ)\nについて、見直すことを意図したものではありません。","theme":"その他","section":"保険業法施行規則","tags":["比較推奨","ハ方式"]},{"no":214,"location":"第227条の2第3項第4号","comment":"保険業法施行規則第227条の2第3項第4号ハ(以下、ハ方式とする。)が廃止されたことにより、従来、ハ方式で販売していた事業者は、今後は同号ロ(以下、ロ方式という。)\nに基づいて販売を行うことになるとの理解でよいかを確認したい。\nまた、その際、ハ方式からの移行事業者に配慮して、ロ方式を柔軟に解釈するといった考え方を、当局として制度設計上有していないことを確認したい。","pageStart":131,"pageEnd":131,"answer":"保険業法施行規則第227条の2第3項第4号ハの廃止に伴い、従来、同号ハにより比較推奨販売を行っていた事業者においては、今後、同号ロに基づく販売方法を含め、改正後の法令・監督指針に即した方法により適切に対応することが求められます。\n他方、同号ロについては、顧客の意向を把握した上で、「二以上の比較可能な同種の保険契約」から合理的に選別して提案するという基本的な考え方を明確化したものであり、同号ハからの移行に配慮して、当該要件を緩和する又は柔軟に解釈することを制度設計上、想定しているものではありません。","theme":"その他","section":"保険業法施行規則","tags":["比較推奨","ハ方式"]},{"no":215,"location":"第227条の2第3項第4号","comment":"保険会社による乗合代理店への指導・教育・管理は、推奨方針に基づく新規契約対応に限らず、既存契約の保全や顧客への情報提供の観点からも必要である。\n131推奨保険会社に該当しない保険会社であっても、顧客の希望に基づく商品選定への対応や、自社契約の保全、新商品・補償内容に関する情報提供を目的として行う指導・教育・管理については、代理店の推奨方針を歪めない限り、一律に内容や頻度が制限されるものではないとの理解でよいかを確認したい。","pageStart":131,"pageEnd":132,"answer":"ご意見にある「推奨保険会社」の意味が明確ではありませんが、Ⅱー4ー2－9(5)②ア.にいう社内規則等で規定する「提示・推奨する基準や理由等」については、顧客の最善利益を勘案した合理的なものである必要があり、代理店都合の推奨商品群や推奨保険会社といったものは認められません。\nなお、保険会社による乗合代理店に対する指導・教育・管理については、推奨方針に基づく新規契約対応に限らず、既存契約の適切な保全や顧客に対する必要な情報提供の観点から行われることも重要であると考えます。\n保険業法においても、所属保険会社等は、保険募集人に対して、法令等遵守や適正な保険募集を確保するため、必要かつ適切な指導・教育・管理を行う義務を負っています。","theme":"その他","section":"保険業法施行規則","tags":[]},{"no":216,"location":"第227条の2第3項第4号","comment":"保険業法施行規則第227条の2第3項第4号ハの削除に関連し、顧客が特定の保険商品を明確に指定している場合であっても、当該商品以外に、顧客の状況(例えば実際の医療費負担の実態等)を踏まえて、より適切と考えられる商品が存在する場合には、その提案は同号ロの規定に基づく判断(顧客の意向に沿った選別による提案)に該当するのかを確認したい。","pageStart":132,"pageEnd":132,"answer":"保険業法施行規則第227条の2第3項第4号ロにおける「選別」とは、顧客の意向を把握した上で、複数の比較可能な同種の保険契約の中から、顧客の最善の利益に照らして合理的に商品を選定し提案することを指します。\nしたがって、顧客が特定の保険商品を指定している場合であっても、その意向や属性、契約目的等を踏まえ、当該商品以外に、顧客のニーズやリスク実態により適合すると考えられる商品がある場合には、その理由を説明した上で他の商品を提案することは、ロの規定に基づく対応に該当するものと考えられます。","theme":"その他","section":"保険業法施行規則","tags":["ハ方式","顧客の最善の利益"]},{"no":217,"location":"第227条の2第3項第4号","comment":"監督指針Ⅱ－4－2－9(5)①B.における「顧客の意向」には、補償内容や保険料に限らず、申込手続の簡便性や保険料支払方法の選択肢の多様性といった要素を重視する顧客の考え方も含まれ得るとの理解でよいかを確認したい。\n132","pageStart":132,"pageEnd":133,"answer":"Ⅱ－4－2－9(5)①B.における「顧客の意向」とは、保障(補償)\n内容、保険料水準、保険期間等の商品特性などといった顧客が自らのリスクや保険ニーズを適切に認識するための意向を指していると考えます。\nただし、乗合代理店が二以上の比較可能な同種の保険契約の中から顧客の意向に沿って保険契約を選別するにあたっては、顧客の合理的な意向に基づいて選定されるべきであり、これらの事項のみによらず、保障(補償)内容や保険料水準も含めた顧客が重視する事項を丁寧かつ明確に確認し、比較推奨販売を行う必要がある点に留意すべきと考えます。","theme":"その他","section":"保険業法施行規則","tags":["比較推奨"]},{"no":218,"location":"第227条の2第3項第4号","comment":"顧客に対する誠実義務と金融事業者の利益追求との両立について「金融サービスの提供及び利用環境の整備等に関する法律」の改正により「顧客に対する誠実公正義務」が新設され、全ての金融事業者に本義務が課されること等を理由として、保険業法施行規則第227条の2第3項第4号ハ(以下、ハ方式とする。)(代理店独自の推奨理由による比較推奨販売)が削除されるものと承知しているが、誠実公正義務とハ方式削除との相当因果関係やハ方式削除の必然性については必ずしも金融審議会等においても論理的かつ説得的な説明がなされていないものと考える。\nまた、ハ方式が存在していることにより顧客の利益が日々害されているような実態もないものと考える。こうした中で、今般、内閣府令の改正によりハ方式を削除するような必然性や立法事実等はないものと考えるが、金融庁の見解をご教示願いたい。\n133","pageStart":133,"pageEnd":134,"answer":"今般の保険業法施行規則第227条の2第3項第4号ハの見直しについては、金融サービス提供法に基づく誠実公正義務の新設のみを直接の理由として行ったものではなく、金融審議会「損害保険業等に関する制度等ワーキング・グループ」や「損害保険業の構造的課題と競争のあり方に関する有識者会議」において指摘された保険会社と保険代理店の不適切な関係性やインセンティブ構造、比較推奨販売に係る透明性の確保といった課題を総合的に踏まえたものです。\nこれらの議論においては、乗合代理店が保険会社からの便宜供与の実績に応じて推奨商品を決定するなど、顧客の意向や利益を勘案したものといえない不適切な運用が認められたことを踏まえたものです。\nこのため、顧客の意向に関わらず、特定の保険会社の商品を推奨する販売(同号ハによる販売)は、保険会社と乗合代理店との間に上記のような不適切な関係性が存在する場合も、それが露呈しづらいことなどを踏まえると、顧客の適切な商品選択の機会を阻害するおそれがあることから、顧客の意向に基づく合理的な商品選別を明確化する観点で整理を行いました。\n本改正については、金融事業者による正当な収益活動や自主的な販売努力を否定するものではなく、顧客の最善の利益を勘案しつつ、提案理由や判断過程が顧客に対して説明可能な形で示されることを求めるものです。\n金融庁としては、保険契約者等の保護の確保と金融事業者の健全な事業運営の両立が図られるよう、これまでの議論や現場の実態も踏まえ、適切な運用が行われることが重要であると考えています。","theme":"その他","section":"保険業法施行規則","tags":["便宜供与","手数料・インセンティブ","比較推奨","ハ方式","顧客の最善の利益"]},{"no":219,"location":"第227条の2第3項第4号","comment":"現行の保険業法施行規則第227条の2第3項第4号ハ(以下、ハ方式とする。)を根拠としたテリトリー制では、乗合代理店が拠点ごとに推奨する損害保険会社を定め、当該保険会社が指導・支援を担うことで募集品質を確保している実態がある。\nハ方式が廃止された場合、複数の保険会社が同一拠点を支援することによる個人情報管理上のリスク等が懸念されるため、拠点の募集品質確保の観点から、指導担当の保険会社を定める運用は改正の趣旨に反しないのではないか。\nまた、自動車損害賠償責任保険(自動車損害賠償保障法第5条)については、推奨販売の対象外とされていることから、実務の円滑化のため、拠点ごとに自動車損害賠償責任保険の取扱保険会社を指定することも否定されるものではないのではないか。\n134","pageStart":134,"pageEnd":135,"answer":"保険会社は、保険業法に基づき、保険募集を委託する保険代理店に対して、当該保険代理店が専属代理店・乗合代理店の区分に関わらず、法令等遵守や適正な保険募集を確保する観点から、各々が必要かつ適切な教育・管理・指導を行う責務を負っています。\nまた、乗合代理店においては、顧客情報については、個人情報保護法等の関係法令に基づき、厳格に管理される必要があります。\nしたがって、ご意見にあるような個人情報管理上のリスク等の懸念を理由に、指導担当の保険会社を定める運用は、適切な比較推奨販売を歪ませる可能性があり、改正の趣旨に反します。\nまた、自動車損害賠償責任保険は、自動車損害賠償保障法に基づき加入が義務付けられており、補償内容や保険料が法令等により定められているため、一般の任意保険のように商品内容や保険料を比較して選択する性質は限定的です。\nしたがって、複数の保険会社の自動車損害賠償責任保険を取り扱っている場合であっても、同法施行規則第227条の2第3項第4号ロに係る対応が必要となるものではないと考えられます。\nなお、保険会社と保険代理店の間において、過度の便宜供与は防止される必要があることから、推奨販売の対象か否かを問わず、便宜供与の実績に応じて、保険募集人が顧客に特定の保険会社を提案することは許容されない点には留意が必要です。","theme":"その他","section":"保険業法施行規則","tags":["便宜供与","比較推奨","ハ方式"]},{"no":220,"location":"－","comment":"賃貸物件入居者向け火災保険において、不動産会社が保険代理店として募集を行わず、募集関連行為従事者として紹介・送客のみを行う場合には、乗合代理店としての比較推奨販売や意向把握、体制整備は不要との理解でよいかを確認したい。\n一方で、保険会社への直接紹介により比較推奨を経ない契約が行われ、代理店手数料と同レベルのコミッション(紹介料)を背景に特定の保険会社への恣意的な送客が行われる場合、顧客の適切な商品選択の機会が阻害され、比較推奨販売の潜脱につながるおそれがある。\nこのため、顧客の適切な商品選択の機会を阻害しないよう、募集関連行為に関する監督指針の見直しが必要と考えるがどうか。","pageStart":135,"pageEnd":135,"answer":"保険業法施行規則第227条の2第3項第4号は、保険募集人が比較推奨販売を行う場合の対応を規定したものであり、紹介・送客のみにとどまり保険募集を行わない募集関連行為従事者について、基本的には乗合代理店としての比較推奨販売や意向把握、体制整備を求めるものではありません。\n一方、募集関連行為を通じて特定の保険会社の商品に顧客を恣意的に誘導する行為や、高額な紹介料やインセンティブ報酬の支払により実質的に商品選択を歪めるおそれがある場合には、顧客の適切な商品選択の機会を阻害しかねません。\nこの点については、Ⅱ－4－2－1(2)においても留意が求められているところであり、募集関連行為が比較推奨販売の趣旨を潜脱することのないよう、引き続き、適切なモニタリングが重要であると考えます。","theme":"その他","section":"保険業法施行規則","tags":["手数料・インセンティブ","比較推奨","意向把握"]},{"no":221,"location":"第227条の2第3項第4号","comment":"保険募集のプロセスは、「誘引」・「募集(試算含む)」・「変更対応」・「事故対応」に分けられるところ、乗合代理店における比較推奨販売(保険業法施行規則第227条の2第3項第4号イ及びロ)に関し、意向把握及び比較推奨が求められるのは、どの段階を想定しているのかを確認したい。\n特に、単なる「誘引」の段階においては、意向把握や比較推奨は不要であり、「募集(試算含む)」の段階で実施すれば足りるとの理解でよいか。\nまた、業務を切り分けることで、質の高い商品説明につながるのではないかという点について当局の考えを示し135てほしい。","pageStart":135,"pageEnd":136,"answer":"個別具体的に判断すべき事項であり一概に回答することが困難ですが、法令や監督指針に照らして、募集プロセスの形式的な区分に着目することなく、顧客が保険商品の選択を判断する局面において、意向把握や比較推奨が適切に行われているか実質的に判断されるべきと考えます。\nなお、「誘引」が何を指しているか明らかではありませんが、「保険契約の締結の勧誘」に該当すれば、保険募集に該当します。","theme":"その他","section":"保険業法施行規則","tags":["比較推奨","意向把握"]},{"no":222,"location":"－","comment":"顧客本位の業務運営と実務効率の両立のためには、比較推奨販売に関する研修内容やチェックリスト等について、一定の標準化や共通化が必要ではないかと考える。\n保険会社や代理店ごとに形式が異なる運用でも差し支えないのか、また、顧客に対して分かりやすく安定的な説明を行う観点から、仕組みの統一化について、当局が、どのように考えているのかを確認したい。","pageStart":136,"pageEnd":136,"answer":"比較推奨販売に係る研修内容やチェックリスト等については、顧客の最善の利益を確保し、分かりやすく安定的な説明を行うことが重要である一方、その具体的な形式や内容について、一律の標準化や統一的な様式を義務付けることを意図するものではありません。\n監督指針においても、体制整備の方法は、保険会社や乗合代理店の規模・業務特性等に応じて合理的に判断されるべきものとしています。","theme":"その他","section":"保険業法施行規則","tags":["比較推奨","顧客の最善の利益"]},{"no":223,"location":"Ⅱ－4－2－9(5)","comment":"「顧客の意向に沿って保険契約を選別」とは、監督指針Ⅱ－4－2－2(3)に基づき顧客の意向を適切に把握した上で、その意向に合致する保険契約を抽出・選別することを意味すると理解してよいか。","pageStart":136,"pageEnd":136,"answer":"貴見のとおりです。\n「顧客の意向に沿って保険契約を選別」とは、Ⅱ－4－2－2(3)\nに照らして顧客の意向や事情を適切に把握した上で、その意向に合致する保険契約を合理的な基準に基づき選別することを指します。\n比較推奨販売においては、この意向把握を前提として、選別の理由や基準が顧客に対して説明可能であることが重要であり、代理店や保険会社の都合による恣意的な選別とならないよう留意する必要があります。","theme":"顧客の最善の利益","section":"監督指針","tags":["比較推奨","意向把握"]},{"no":224,"location":"Ⅱ－4－2－9(5)","comment":"監督指針Ⅱ－4－2－9(5)①B.(b)(注3)に関し、特定の保険商品の長所を説明する目的で、当該商品を他の一又は複数の商品と比較する場合には、比較推奨販売に関する同項Aに加えて、誤認を招く比較表示等に留意する旨を定めた監督指針Ⅱ－4－2－2(9)にも配慮する必要があるとの理136解でよいか。","pageStart":136,"pageEnd":137,"answer":"貴見のとおりです。\n特定の保険商品の長所を説明する目的で他の商品と比較する場合であっても、比較の方法や表現が顧客に誤認を与えないよう、Ⅱ－4－2－9(5)に加えて、比較表示や説明の適正性に関するⅡ－4－2－2(9)にも留意する必要があります。\nこのような場合には、比較の前提条件や範囲を明確にし、一般的な優位性があるとの誤解を招くことのないよう配慮した上で、顧客の意向に照らして合理的な説明が行われることが重要であると考えます。","theme":"顧客の最善の利益","section":"監督指針","tags":["比較推奨"]},{"no":225,"location":"Ⅱ－4－2－9(5)","comment":"監督指針Ⅱ－4－2－9(5)\n「適切な比較推奨販売を行わなければならない」との点について、金融サービス提供法に基づく顧客等に対する誠実公正義務の趣旨も踏まえることとされているが、1.令和5年10月30日の金商法等改正のパブコメでは、「「顧客等の最善の利益」は顧客一人ひとりによって、また、同一の顧客であっても当該顧客の置かれた状況等により異なり得るもの」と回答されている。\n保険事業者の場合、保険業法において、他法令には措置されていない意向把握義務が保険会社や保険募集人に対し課されていることから、これを適切に履行することが、最善利益勘案義務を履行する上で非常に重要になってくるものと考えているが、その理解でよいか。\n2.上記1の前提に立った場合、保険業法施行規則第227条の2第3項第4号ハの廃止によって、自己に都合の良い商品を販売できなくなった者が、安易に監督指針Ⅱ－4－2－2(3)①ア.(注2)に規定する意向推定型の方法を用いて、引き続き自己に都合の良い商品を販売しようとする行為が行われることが懸念されるところ、こうした行為は比較推奨販売の潜脱的な行為に該当し得るものと考えられる。かかる意向推定型は主として比較推奨販売が求められない137保険会社の営業職員が営業を行う場合を想定したものとして規定したと理解しているが、その理解でよいか。\n3.上記2の前提に立った場合、例えば、比較推奨販売を行う乗合代理店が、意向推定の確度の度合いが不十分なまま顧客の意向を推定し、特定の保険契約を選別して募集行為を行った場合、乗合代理店の恣意的な保険契約の選別を許容することにも繋がりかねず、結果として、顧客の商品選択の機会を阻害するおそれがあるものと考えられる。このように、顧客の意向を把握する際には、安易に意向推定型を用いるのは規制の趣旨に適うものではなく、特に乗合代理店の場合は保険会社に比べて意向推定の確度を確保するには相応のハードルがあるものと考えられるが、その理解でよいか。","pageStart":137,"pageEnd":138,"answer":"貴見のとおりです。\n金融サービス提供法に基づく誠実公正義務は、顧客ごとの状況や意向に応じて判断されるべきものであり、保険分野においては、保険業法上の意向把握・確認義務を適切に履行することも、その前提として大変重要です。\nまた、同法施行規則第227条の2第3項第4号ハの廃止後において、顧客の意向把握が不十分なまま意向推定の方法を用い、特定の商品を恣意的に選別する行為は、比較推奨販売の趣旨を潜脱するものとなり得るため、適切ではありません。\n比較推奨販売においては、顧客の意向を丁寧に把握した上で、合理的な基準と理由に基づく商品選別・推奨が行われていることが重要であるとともに、その確保を通じて顧客の適切な商品選択の機会が不当に損なわれることのないよう対応することが重要と考えます。","theme":"顧客の最善の利益","section":"監督指針","tags":["比較推奨","ハ方式","意向把握"]},{"no":226,"location":"－","comment":"顧客の意向把握のプロセスについては、下記1から5の流れで行うことが考えられる。\n1.当初意向の把握2.説明を受ける商品を絞り込むかの確認3.特に重視する意向の把握4.商品特性等により、代理店が特定の保険契約を推奨する場合の取扱5.個別商品の説明・申込上記2.について、1.にて把握した当初意向を踏まえて、代理店の募集実態等を鑑みつつ、必要に応じて、「該当する保障分野において当代理店が取り扱うすべての商品の説明を聞きたいか」、「該当する保障分野の中で、さらに138詳細な意向に基づいて説明を受ける商品を絞り込みたいか」を顧客に確認することが考えられる、という理解でよいか。","pageStart":138,"pageEnd":139,"answer":"貴見のとおりです。\n重要な点は、乗合代理店や保険会社の都合に基づく恣意的な誘導によることなく、合理的かつ一定の具体性を有する基準や理由等による提示・推奨を行うとともに、当該基準や理由等を明確に説明することであり、これを踏まえた実効的な運用が求められます。","theme":"顧客の最善の利益","section":"監督指針","tags":["意向把握"]},{"no":227,"location":"Ⅱ－4－2－9(5)","comment":"当社で「レクリエーション保険」という非常に単価の安い損害保険契約を取り扱っている。最低保険料は1000円で、正直売れば売るほど赤字になる商品である。地域のためと思いボランティア的な扱いで引き受けてきたが、今回の改定によりこのジャンルまで比較推奨をしなければならないとなれば、引き受けることをやめざるを得ない。\n顧客にとっては契約を引き受けてもらえることが最善利益な場合、「比較しなくていいなら契約しますが、どうしますか？」と顧客に問うて、それを顧客が了承すれば、それはそれで顧客最善利益を勘案したことになるのだろうか。それともやはり、引き受けるのならば比較可能な商品を比較せねばならないだろうか。結果断ることになってしまえば、本末転倒のように思える。\n乗合代理店がどの契約を用いて顧客に役立とうとするか、保険が諾成契約である以上、乗合代理店側にも一定自由な裁量で商品を選択する裁量権があるように思う。しかしながら「ハ方式(保険業法施行規則第227条の2第3項第4号ハ)」が一切許されないということは、つまり顧客最善利益を勘案した誠実公正義務は、保険代理店の契約締結権(の代理権)に優先するものである、という理解でよいか。","pageStart":139,"pageEnd":139,"answer":"比較推奨販売の適正化については、顧客の最善の利益を勘案し、顧客の意向を踏まえた合理的な商品選択が行われることを確保する趣旨であり、「二以上の比較可能な同種の保険契約」が存在する場合には、保険業法施行規則第227条の2第3項第4号ロに基づく推奨販売を行う必要があります。\n一方、例えば、保険募集人による保険契約の選別・提案が実質的に伴わず、顧客の主体的な判断のみにより、顧客から特定の保険会社又は特定の保険契約が指定され、その結果、加入の対象となる一の保険契約が選択された場合には、同号ロの適用対象とならないことから、Ⅱ－4－2－9(5)①B.において定める対応が直ちに求められるものではありません。\nただし、その場合でも「顧客から特定の保険会社又は特定の保険契約が指定され、その結果、加入の対象となる一の保険契約が選択された」という証跡はしっかりと残していただくことも重要と考えます。\nなお、金融サービス提供法に基づく誠実公正義務(顧客の最善の利益勘案義務)は、代理店の法的地位や契約締結に関する裁量を否定するものではなく、代理店としての立場を前提に、顧客の意向や事情に照らして誠実かつ公正に募集が行われることを求めるものです。個々の契約特性や実務実態を踏まえ、顧客の利益を確保する実効的な対応が重要であると考えられます。","theme":"顧客の最善の利益","section":"監督指針","tags":["比較推奨","ハ方式","顧客の最善の利益","証跡・記録"]},{"no":228,"location":"Ⅱ－4－2－9(5)","comment":"保険業法施行規則第227条の2第3項第4号ハの廃止によ139り、代理店が時流や経済情勢に即した新商品や特定の補償を柔軟に推奨する余地が狭まるのではないかとの懸念がある。\n顧客から明示的な要望がない場合でも、代理店として特に有用と考える商品や補償を提案・推奨することが可能なのか、また、そうした提案が恣意的な誘導と評価されないのかについて、当局の見解を求めたい。","pageStart":139,"pageEnd":140,"answer":"比較推奨販売に係る適正化については、顧客の最善の利益を勘案しつつ、顧客の適切な商品選択の機会を確保するものであり、重要な点は、代理店や保険会社の都合に基づく恣意的な誘導によることなく、合理的かつ一定の具体性を有する基準や理由等による提示・推奨を行うとともに、当該基準や理由等を明確に説明することであり、これを踏まえた実効的な運用が求められます。\nなお、顧客から意向が明確に示されない場合において、代理店として特に有用と考える商品や保障(補償)を提案・推奨することが恣意的な誘導と評価されないかについては、個別具体的に判断する必要があります。\nまた、顧客の意向が不明確である場合であっても、顧客が特に重視すると考えられる事項を例示するなど、可能な限り顧客の意向を把握する必要があります。","theme":"顧客の最善の利益","section":"監督指針","tags":["比較推奨","ハ方式","顧客の最善の利益"]},{"no":229,"location":"Ⅱ－4－2－9(5)","comment":"比較推奨販売に係る規制や実務対応が複雑化することで、保険募集人が負担を感じ、結果として保険募集そのものを敬遠する社員が増加するおそれがあるのではないか。","pageStart":140,"pageEnd":140,"answer":"比較推奨販売に係る適正化については、顧客の最善の利益を勘案しつつ、顧客の適切な商品選択の機会を確保するものであり、その運用に当たっては、自社の募集実務や募集形態等を踏まえた適切かつ合理的な対応が重要と考えます。\nまた、比較推奨販売に係る体制整備にあたっては、乗合代理店の規模や業務特性等を踏まえた実効的な体制が整備されることが重要と考えます。\n監督指針においても、形式的かつ画一的な対応とならないよう、創意工夫のもと、適切な運用が図られる必要があると考えます。","theme":"顧客の最善の利益","section":"監督指針","tags":["比較推奨","顧客の最善の利益"]},{"no":230,"location":"－","comment":"比較推奨販売の厳格化により、保険募集人による説明行為や募集自体を萎縮させ、責任回避的な対応が増加するおそれがあり、その結果、保険の普及という代理店本来の役割が損なわれ、かえって消費者利益の低下につながる懸念がある。","pageStart":140,"pageEnd":140,"answer":"比較推奨販売に係る適正化については、顧客の最善の利益を勘案しつつ、顧客の適切な商品選択の機会を確保するものであり、その運用に当たっては、自社の募集実務や募集形態等を踏まえた適切かつ合理的な対応が重要と考えます。\nまた、比較推奨販売に係る体制整備にあたっては、乗合代理店の規模や業務特性等を踏まえた実効的な体制が整備されることが重要と考えます。\n監督指針においても、形式的かつ画一的な対応とならないよう、創意工夫のもと、適切な運用が図られる必要があると考えます。","theme":"顧客の最善の利益","section":"監督指針","tags":["比較推奨","顧客の最善の利益"]},{"no":231,"location":"－","comment":"比較推奨販売に係る業務の煩雑化により、小規模な代理店が代理店業務の継続を断念する事態が生じるおそれがあり、その結果、当該代理店を信頼して保険に加入している顧客が不利益を被る可能性があることを懸念している。\n140","pageStart":140,"pageEnd":140,"answer":"比較推奨販売に係る適正化については、顧客の最善の利益を勘案しつつ、顧客の適切な商品選択の機会を確保するものであり、その運用に当たっては、自社の募集実務や募集形態等を踏まえた適切かつ合理的な対応が重要と考えます。\nまた、比較推奨販売に係る体制整備にあたっては、乗合代理店の規模や業務特性等を踏まえた実効的な体制が整備されることが重要と考えます。\n監督指針においても、形式的かつ画一的な対応とならないよう、創意工夫のもと、適切な運用が図られる必要があると考えます。","theme":"顧客の最善の利益","section":"監督指針","tags":["比較推奨","顧客の最善の利益"]},{"no":232,"location":"－","comment":"損害保険の実務上は、保険会社の営業担当者・事故担当者・保険会社としての姿勢といった対応力が顧客の利益に大きく影響する。\n保険料や補償内容の比較に重きを置き機械的に優劣をつけ推奨することが真に顧客のためになると考えているのか。\n損害保険業界として、表面的な比較推奨を優先すると、保険会社は保険料や商品の優位性を目指す方向に進むため、顧客に必要とされる保険会社の対応力の向上が著しく阻害されていくと思われる。","pageStart":141,"pageEnd":141,"answer":"顧客の最善の利益を勘案するに当たっては、保険料や保障(補償)内容の差異のみに着目するものではなく、保険業法に基づく意向把握を踏まえ、顧客が何を重視しているかに照らして適切な選択がなされているかを総合的に考慮することも必要と考えます。","theme":"顧客の最善の利益","section":"監督指針","tags":["比較推奨","意向把握","顧客の最善の利益"]},{"no":233,"location":"Ⅱ－4－2－9(5)","comment":"顧客本位の対応が重要であることは理解しているが、実務上、保険会社間で商品内容や特約、保険料に大きな差がないケースが多く、その違いを時間をかけて説明することが必ずしも顧客のニーズに合致しているかは検証が必要である。\n多くの顧客は短時間で要点を押さえた説明や提案を望んでおり、画一的ではなく、個々の顧客に応じた説明が求められる。\nまた、比較推奨対応による業務負担や慢性的な人手不足を背景に、取扱保険会社数の削減も検討せざるを得ず、その結果、顧客の選択肢が狭まるおそれがあるのではないか。\n141","pageStart":141,"pageEnd":142,"answer":"貴重なご意見として承ります。\n比較推奨販売に係る体制整備については、顧客の最善の利益を勘案しつつ、顧客の適切な商品選択の機会を確保するため、乗合代理店の規模や業務特性等に応じて、自社の募集実務や募集形態等を踏まえた適切な比較推奨販売が実施されるよう実効的な体制が整備されることが重要であり、監督指針は、一律かつ画一的な対応や、規模・業務特性等に照らして過度な実務上の負担を求める趣旨ではありません。\nまた、保険募集人(乗合代理店)には、法令に基づき、自らの所属保険会社等の保険商品について、顧客の最善の利益を勘案しつつ、公正な保険募集を行うことが求められています。そのため、保険契約者等の保護の観点から、自らの規模や業務特性に見合った体制整備を図ることが必要と考えます。\n顧客が簡素な説明を希望する場合には、顧客の意向に照らして適切と認められる範囲で、提案・推奨する保険契約の概要について、保険会社が作成したパンフレット等を用いて説明し、必要に応じて保障(補償)内容や保険料水準等の要点を補足する対応も考えられます。\nいずれにせよ、顧客の意向に整合的な形で、当該保険契約を選別・推奨する理由が合理的に説明できること、また、顧客の理解と納得を得られる実効的な募集が行われていることが重要であると考えています。","theme":"顧客の最善の利益","section":"監督指針","tags":["比較推奨","顧客の最善の利益"]},{"no":234,"location":"Ⅱ－4－2－9(5)","comment":"保険事業を取り扱うに当たって、お客様の意向を把握して取引することはわかるものの、顧客の最善の利益だけを追求するような比較推奨販売では、代理店の事業方針を反映することをすべて排除するように考えられるが、どのように考えるのか。","pageStart":142,"pageEnd":142,"answer":"今般の改正の趣旨は、保険業法に基づく意向把握を前提として、顧客の意向等に照らし適切な商品選択の機会を確保する点にあります。\n比較推奨販売においては、乗合代理店の方針等のみが優先されるなど代理店の都合による選別となり、顧客の意向や利益が損なわれることのないよう、当該方針等が顧客の意向に照らして合理的であり、その理由を説明できることが重要と考えます。","theme":"顧客の最善の利益","section":"監督指針","tags":["比較推奨","意向把握","顧客の最善の利益"]},{"no":235,"location":"Ⅱ－4－2－9(5)","comment":"損害保険会社ごとに、営業態勢や人材、事故対応、商品開発力等には差異があり、これらの総合力の違いは、代理店への支援力や顧客に提供できるサービスの質の違いとして現れる。\nその結果生じる優位性や顧客メリットを、推奨理由として適切に評価・説明することは、本来、公正な競争や健全な経済活動の一環と考えられる。\nしかし、今回の推奨販売方式の見直しでは、こうした差異を過度な便宜供与につながるものとして排除する方向に見受けられ、公正な競争を抑制するおそれがあるのではないか。\n142","pageStart":142,"pageEnd":142,"answer":"損害保険会社における営業態勢、人材、事故対応、商品開発力等の差異について、必ずしも全てが客観的かつ定量的に評価できるものではなく、客観的かつ合理的な根拠に基づかず、乗合代理店の都合による恣意的な特定の保険契約の選別となりうる場合においては、選別の理由や基準として適切ではありません。\n推奨販売を行う際には、顧客の最善の利益を勘案の上、顧客の意向を丁寧に把握するとともに顧客の意向に照らして合理的な基準と理由に基づく説明・推奨が行われることが重要と考えます。","theme":"顧客の最善の利益","section":"監督指針","tags":["便宜供与","顧客の最善の利益"]},{"no":236,"location":"－","comment":"顧客に対する誠実義務と金融事業者の利益追求との両立について金融サービスの提供及び利用環境の整備等に関する法律の改正により「顧客に対する誠実公正義務」が新設され、全ての金融事業者に本義務が課されることを理由として、いわゆるハ方式(保険業法施行規則第227条の2第3項第4号ハ(代理店独自の推奨理由による比較推奨販売))が削除される方向であると承知しているが、誠実公正義務とハ方式削除との相当因果関係やハ方式削除の必然性については必ずしも金融審議会等においても論理的かつ説得的な説明がなされていないものと考える。\n金融事業者であっても、企業としての利益追求は、事業を継続、拡大していく上で基本的なビジネス慣行であることは言うまでもなく、顧客に対する誠実義務とは両立させるべきものと考えるが、この点についての見解を伺いたい。","pageStart":143,"pageEnd":143,"answer":"金融サービス提供法に基づく誠実公正義務(顧客の最善の利益勘案義務)は、金融事業者による正当な利益追求を否定するものではありません。\n他方、今般の保険業法施行規則第227条の2第3項第4号ハの見直しは、金融サービス提供法に基づく誠実公正義務の新設のみを直接の理由として行ったものではなく、保険会社と乗合代理店との間の便宜供与等を理由とする不適切な関係性に起因して、特定の収益上、又は、業務上の都合が推奨判断に不透明に影響するおそれを踏まえ、顧客の意向に沿った合理的かつ説明可能な比較推奨販売を確保する観点から行うものです。\n本改正は、企業活動や公正な競争を抑制することを目的とするものではなく、顧客の意向把握を前提に、推奨理由の合理性・透明性を高め、誠実公正義務の実効性を確保することを目的としており、その趣旨を踏まえた運用がなされるべきと考えます。","theme":"顧客の最善の利益","section":"監督指針","tags":["便宜供与","比較推奨","ハ方式","意向把握","顧客の最善の利益"]},{"no":237,"location":"Ⅱ－4－2－9(5)","comment":"金融審議会「損害保険業等に関する制度等ワーキング・グループ」で議論された「顧客が重視する項目を丁寧かつ明確に把握した上で、顧客の意向に沿って保険商品を絞り込み、推奨すること」に沿った保険業法施行規則第227条の2第3項第4号ハ(以下、ハ方式とする。)の廃止については十分理解し、全く妥当であると受け止めている。\n一方で、ハ方式の廃止に伴って、同号イ又は同号ロを採用することにより、保険業界全体で必要以上の業務量増加となることを懸念している。\n143特に、保険代理店における作業工数の増加及びその証跡の確保・管理等は、保険代理店のコスト増加につながることが想定され、ひいては代理店を管理する保険会社にとってもコスト増となり、最終的に保険購買者(契約者)の保険料負担増につながるおそれがある。\n上記ワーキング・グループで議論された「顧客本位の業務運営の徹底」は論を俟ちませんが、そのために過剰な業務負担を課すことは保険業界全体の効率性向上の足かせとなる可能性があり、保険契約者(契約者)のコスト負担増、ひいては日本の保険業界の健全な成長にとっても望ましくないものと思われる。\n以上を踏まえ、保険代理店における業務効率を勘案の上、弾力的かつ具体的なルールの策定・運用を保険会社に求めていただきたい。","pageStart":143,"pageEnd":144,"answer":"貴重なご意見として承ります。\n比較推奨販売に係る体制整備については、顧客の最善の利益を勘案しつつ、顧客の適切な商品選択の機会を確保するため、乗合代理店の規模や業務特性等に応じて、自社の募集実務や募集形態等を踏まえた適切な比較推奨販売が実施されるよう実効的な体制が整備されることが重要であり、監督指針は、一律かつ画一的な対応や過度な実務上の負担を求める趣旨ではありません。\nまた、保険募集人(乗合代理店)には、法令に基づき、自らの所属保険会社等の保険商品について、顧客の最善の利益を勘案しつつ、公正な保険募集を行うことが求められています。そのため、保険契約者等の保護の観点から、自らの規模や業務特性に見合った体制整備を図ることが必要と考えます。","theme":"顧客の最善の利益","section":"監督指針","tags":["比較推奨","ハ方式","顧客の最善の利益","証跡・記録"]},{"no":238,"location":"Ⅱ－4－2－9(5)","comment":"本改正が顧客本位の業務運営と健全な競争確保を目的とする点には賛同するとともに、法人・団体契約における比較推奨販売で推奨理由や判断基準の明確化を求める方向性は妥当である。\n一方、個人顧客や一部中小法人では知識・理解度やニーズが多様であり、すべての個人契約に対し同一水準の比較説明、推奨理由の詳細化、記録・証跡保存等を求めることは実務負担が大きく、説明の分かりにくさや形式化を招くおそれがあるため、個人契約については、顧客の意向や理解度に応じた柔軟な対応を明確化すべきである。","pageStart":144,"pageEnd":144,"answer":"貴重なご意見として承ります。\n比較推奨販売に係る体制整備については、顧客の最善の利益を勘案しつつ、顧客の適切な商品選択の機会を確保するため、乗合代理店の規模や業務特性等に応じて、自社の募集実務や募集形態等を踏まえた適切な比較推奨販売が実施されるよう実効的な体制が整備されることが重要であり、監督指針は、一律かつ画一的な対応や過度な実務上の負担を求める趣旨ではありません。\nまた、保険募集人(乗合代理店)には、法令に基づき、自らの所属保険会社等の保険商品について、顧客の最善の利益を勘案しつつ、公正な保険募集を行うことが求められています。そのため、保険契約者等の保護の観点から、自らの規模や業務特性に見合った体制整備を図ることが必要と考えます。","theme":"顧客の最善の利益","section":"監督指針","tags":["比較推奨","顧客の最善の利益","証跡・記録","団体・団体扱い"]},{"no":239,"location":"Ⅱ－4－2－9(5)","comment":"比較推奨販売の実務においては、顧客のニーズや置かれ144た状況(時間的制約等)を踏まえ、画一的な対応ではなく、柔軟に対応できる手法を認めるべきである。","pageStart":144,"pageEnd":145,"answer":"今般の改正の趣旨は保険業法に基づく意向把握を前提として、顧客の意向等に照らし適切な商品選択の機会を確保する点にあります。\n「柔軟に対応できる手法」が何を指しているか明らかではありませんが、たとえ、保障(補償)内容や保険料水準の差異がほとんどない場合であっても、当該差異が、顧客の意向となることは考えられます。したがって、「時間的制約」を理由に、Ⅱー4ー2ー9(5)に則した適切な販売を行わないことは、不適切であると考えます。\n保障(補償)内容や保険料水準の差異が限定的である場合には、例えば、その点を含めて顧客に説明した上で、顧客の理解や意向に沿い、説明や比較の範囲を工夫するなど、顧客の最善の利益に資するよう実効的な対応を図ることも考えられます。","theme":"顧客の最善の利益","section":"監督指針","tags":["比較推奨","意向把握","顧客の最善の利益"]},{"no":240,"location":"Ⅱ－4－2－9(5)","comment":"比較表の位置づけについては、「「平成26年改正保険業法(2年以内施行)に係る政府令・監督指針案」に対するパブリックコメント結果等について」における「コメントの概要及びコメントに対する金融庁の考え方」で一定の考え方が示されているにもかかわらず、実務上、保険会社との関係において、比較表の作成や顧客への提示自体を認めてもらえない場合がある。\n保険会社が、保険募集人に対する教育・指導・管理を通じて適切な比較推奨販売を確保すべき立場にあることは理解しているが、比較表の内容について保険会社と合意が得られれば、比較表の作成および顧客への提示は認められるとの理解でよいか。\n145","pageStart":145,"pageEnd":146,"answer":"「「平成26年改正保険業法(2年以内施行)に係る政府令・監督指針案」に対するパブリックコメント結果等について」における「コメントの概要及びコメントに対する金融庁の考え方」No.406～411においても、顧客に分かりやすい説明を行うための説明補助資料として、比較推奨販売の際に比較表を活用すること自体は否定されていません。\n監督指針においては、比較表の作成や記載項目を一律に義務付けるものではなく、比較表の内容や使い方が不適切となり、誤認を招くおそれがないかについて、保険会社が募集管理態勢の一環として確認・指導する責任があることを前提としています。\nしたがって、比較表の商品説明に関わる内容については、各保険会社と十分に協議・合意がなされた上で、顧客の意向や商品の特性を踏まえた適切なものとして作成できると代理店が判断した場合には、比較表を作成し、顧客への説明に用いること自体が否定されるものではありません。","theme":"顧客の最善の利益","section":"監督指針","tags":["比較推奨"]},{"no":241,"location":"Ⅱ－4－2－9(5)","comment":"本改正は、保険募集の誠実性を高め、顧客が安心・納得して保険加入できる環境を整備し、保険募集の質を向上させるものとして評価している。\nその上で、比較推奨販売において、比較表は顧客にとって分かりやすい有効な説明補助資料であり、一定の表項目(基本補償、特約、保険料、算定条件等)を整理・共通化することで募集品質の均一化が図られると考えるが如何か。","pageStart":146,"pageEnd":146,"answer":"比較推奨販売において比較表を用いることは、顧客の理解を助ける選択肢の一つであり、「「平成26年改正保険業法(2年以内施行)に係る政府令・監督指針案」に対するパブリックコメント結果等について」でも示しているとおり、保険契約の特性や顧客の立場を踏まえた適切な方法が用いられることが重要です。\n他方、監督指針は、比較表の項目を一律に規定することを求めるものではなく、顧客の意向や保険商品・種目の特性に応じて、判断に重要な事項を分かりやすく示すことを重視しています。\n保険会社・代理店においては、算定条件等の前提も含め、顧客に誤認を生じさせない説明がなされるよう、実効性ある運用を図ることが求められます。","theme":"顧客の最善の利益","section":"監督指針","tags":["比較推奨"]},{"no":242,"location":"Ⅱ－4－2－9(5)","comment":"推奨販売においては、保険会社ごとに補償内容やシステムが異なる中で、顧客の要望が「保険料の安さ」であった場合、細かい違いを金額に置き換え説明することは現実的に難しいと思われ更にお客様も理解に苦慮することが想定される。\nその結果、顧客の要望に十分応えられない事態が生じる可能性があるため、商品内容やシステムの違いを踏まえ、説明はできる限りシンプルであるべきである。\n146","pageStart":146,"pageEnd":147,"answer":"今般の改正の趣旨は保険業法に基づく意向把握を前提として、顧客の意向等に照らし適切な商品選択の機会を確保する点にあります。\n「細かい違いを金額に置き換え説明することは現実的に難しいと思われ」が何を指しているか明らかではありませんが、たとえ、保障(補償)内容や保険料水準の差異がほとんどない場合であっても、当該差異が、顧客の意向となることは考えられます。\nしたがって、「細かい違いを金額に置き換え説明することは現実的に難しいと思われ更にお客様も理解に苦慮することが想定される」ことを理由に、Ⅱー4ー2ー9(5)に則した適切な販売を行わないことは、不適切であると考えます。\n保障(補償)内容や保険料の差異が限定的である場合には、例えば、その点を含めて顧客に説明した上で、顧客の理解や意向に沿い、説明や比較の範囲を工夫するなど、顧客の最善の利益に資するよう実効的な対応を図ることも考えられます。","theme":"顧客の最善の利益","section":"監督指針","tags":["意向把握","顧客の最善の利益","システム・比較ツール"]},{"no":243,"location":"Ⅱ－4－2－9(5)","comment":"顧客は、保険加入に際して、複数の代理店の中から信頼できる代理店や保険募集人を選択しており、その代理店が実績や経験を有する保険会社の商品を推奨することは、安定的なサービス提供や適切な事故対応等の観点から、顧客の最善の利益に資する場合もあるのではないか。","pageStart":147,"pageEnd":147,"answer":"顧客の最善の利益を勘案するに当たっては、保険業法に基づき、顧客の意向を丁寧に把握した上で、その意向に照らして合理的な商品選択が行われていることが前提となります。\n合理的な商品選択と言えるためには、金融サービス提供法に基づく顧客の最善の利益を勘案して誠実かつ公正に業務を遂行する義務の趣旨に照らし、当該契約が顧客の意向・利益にどのように資するのかについて、合理的な理由とともに説明できる必要があると考えます。\n比較推奨販売においては、乗合代理店や保険会社の都合による選別とならないよう留意しつつ、意向把握・確認義務および最善利益勘案義務を踏まえた、客観的かつ合理的な基準に基づく推奨が行われることが重要であると考えます。","theme":"顧客の最善の利益","section":"監督指針","tags":["比較推奨","意向把握","顧客の最善の利益"]},{"no":244,"location":"Ⅱ－4－2－9(5)","comment":"監督指針II－4－2－9(5)①A.(b)において、「正確な判断を行うに必要な事項を包括的に」示すとされているが、実務上、どの程度までの情報提供を求めているのか、その具体的な水準や範囲が分かりにくいため、明確にしてほしい。","pageStart":147,"pageEnd":147,"answer":"「正確な判断を行うに必要な事項を包括的に示す」とは、網羅的・一律な情報提供を求めるものではなく、顧客の意向や関心事項を踏まえ、判断に影響を与える重要な情報について、過不足なく分かりやすく示すことを趣旨としています。\n具体的には、比較の前提となる基準、主な商品内容や留意点等について、顧客が合理的に判断できる説明がなされていることが求められています。","theme":"顧客の最善の利益","section":"監督指針","tags":[]},{"no":245,"location":"Ⅱ－4－2－9(5)","comment":"比較推奨の名の下に複数の商品を提示し、最終判断を顧客に委ねる募集手法は、専門職である代理店・保険募集人の責任を十分に果たしているとは言えず、保険募集人は、147顧客の状況やニーズを踏まえ、専門的知見に基づいて最適な商品を理由とともに推奨すべきであり、判断をすべて顧客に委ねることが真に顧客本位かは慎重に検討すべきである。","pageStart":147,"pageEnd":148,"answer":"比較推奨販売においては、単に選択肢を提示することでは足りず、顧客の意向を丁寧に把握した上で、合理的な基準と理由に基づき商品を提示・推奨し、その内容を分かりやすく説明することが重要であり、保険募集人の専門的知見と説明責任が適切に発揮されるべき必要があるものと考えます。","theme":"顧客の最善の利益","section":"監督指針","tags":["比較推奨"]},{"no":246,"location":"Ⅱ－4－2－9(5)","comment":"保険会社がネット型保険を直接取り扱いしていることから、代理店で保険に加入を希望するお客様にとって、保険会社間で商品内容や保険料に大きな違いはないが、顧客の最善の利益をどのように考えているか。","pageStart":148,"pageEnd":148,"answer":"ご意見の趣旨が明らかではありませんが、顧客の最善の利益を勘案するに当たっては、保険料や保障(補償)内容の差異のみに着目するものではなく、保険業法に基づく意向把握を踏まえ、顧客が何を重視しているかに照らして適切な選択がなされているかを総合的に考慮することも必要と考えます。\nまた、商品間の差異が限定的な場合についても、顧客が特に重視する事項などを丁寧に把握し、必要性の高い範囲で比較・説明を行うなど、実効性を重視した対応が求められており、形式的な比較によって顧客利益を損なうことがないよう、実態に即した運用が重要であると考えます。","theme":"顧客の最善の利益","section":"監督指針","tags":["意向把握","顧客の最善の利益"]},{"no":247,"location":"Ⅱ－4－2－9(5)","comment":"今回の比較推奨販売に関する制度見直しについて、その趣旨については一定程度理解しているものの、「二以上の保険会社等から引き受ける保険契約を取り扱う保険媒介業者が、取り扱う複数の保険契約の契約内容を比較して説明する場合」の解釈について、なお疑義が残ると考えている。\n本改正の最大の趣旨は、「顧客の最善の利益」を確保することにあると認識している。一方で、保険募集人が十分に習熟していない保険商品について説明を行うことは、保険募集人の負担を増加させるのみならず、誤った説明や不適切な事務処理を招くおそれがあり、結果として顧客の利148益を損なう可能性が高いと考える。\n保険募集の品質を維持・向上させるためには、商品知識および事務スキルの習熟が不可欠である。保険会社ごとにシステムや事務ルールには大きな差異があり、不慣れな保険募集人による手続きは、募集品質の低下を招くおそれがある。\n乗合代理店において、取扱可能なすべての保険会社の商品・事務に対応することを求めることは、保険募集人の負担を過度に増加させ、結果として募集品質の低下、ひいては顧客が「最善の利益」を享受する機会の喪失につながるものと考える。\nそもそも当社における取引損害保険会社の選定基準は、ブランド保険(メーカー固有の付帯サービスを含む)が顧客利益の最大化に資するか否かに大きく依存しており、ブランド保険の取扱いに当たっては、特定の保険会社との取引が不可欠となる。\n当社のように法人として複数のブランド(メーカー)を取り扱い、店舗ごとに取り扱うブランドが異なる場合には、店舗単位で取扱保険会社を選定することが、募集品質を最大限に高め、効率的かつ顧客の最善の利益に資するものと考える。\n現行の法人単位での代理店登録を前提とした場合、必然的に乗り合いが求められ、取扱可能なすべての保険会社の商品・事務知識の習得が募集人の負担を増加させ、募集品質の低下や非効率な運用を招くおそれがある。\n149また、当社では顧客のカーライフ全体を支えるサービス提供を重視しており、保険商品についても、顧客が詳細な比較を望まない場合には、信頼できる保険募集人による提案に委ねる顧客が多いのが実情である。乗り合いだけを前提とした複数商品の説明は、募集時間の長期化を招き、顧客の負担となるケースも少なくない。\n以上を踏まえ、改正案における乗合代理店の場合の「顧客の意向に沿った保険契約の選別」の解釈については、一定の幅を持たせ、会社方針(ブランド保険取扱いに基づく保険会社選定等)を踏まえた運用を可能とするガイドラインを提示頂くなど明確化を強く要望する。","pageStart":148,"pageEnd":150,"answer":"保険募集人(乗合代理店)には、法令に基づき、自らの所属保険会社等の保険商品について、顧客の最善の利益を勘案しつつ、公正な保険募集を行うことが求められています。そのため、保険契約者等の保護の観点から、乗合代理店から専属代理店への移行や乗合の保険会社数を限定するなど、保険会社との委託契約の見直しを含め、自らの規模や業務特性に見合った体制整備を図ることが必要と考えます。\nまた、保険会社と保険代理店の関係については、過度の便宜供与や不適切な出向によって、顧客の適切な商品選択の機会が阻害されないよう留意しつつ、法令に基づく教育・管理・指導を通じて、公正な保険募集と顧客本位の業務運営を確保することが重要と考えます。","theme":"顧客の最善の利益","section":"監督指針","tags":["便宜供与","比較推奨","顧客の最善の利益","出向","システム・比較ツール"]},{"no":248,"location":"－","comment":"本改正は保険会社・保険代理店・金融サービス仲介業者を対象としているが、募集関連行為の委託先である送客サイトが改正内容に対応していない場合、当該サイトを利用する限り、これらの主体は法令違反となるおそれがあるため、送客サイトの利用停止まで求められるのではないかとの懸念がある。\nまた、送客サイトが規制対象外となると、利用者にとって保険代理店と送客サイトの区別が困難であり、本改正の趣旨や意義が顧客に十分伝わらない可能性がある。","pageStart":150,"pageEnd":150,"answer":"保険会社、保険代理店等が行う保険募集および「募集関連行為」\n(Ⅱ－4－2－1(2))については、例えば、送客サイト等の外部委託先が行う行為が募集関連行為に該当する場合には、当該行為が保険募集と一体として適切に管理され、法令遵守が確保されていることが必要であり、保険会社等には委託先の業務内容に応じた管理・監督責任が求められます。\n保険会社、保険代理店等においては、顧客が保険募集と誤認することのないよう留意しつつ、募集関連行為の内容や態様を踏まえ、委託関係や運用の見直しを含め、適切な対応を行うことが重要です。","theme":"顧客の最善の利益","section":"監督指針","tags":[]},{"no":249,"location":"Ⅱ－4－2－9(5)","comment":"保険料水準を基準として比較説明や推奨販売を行う場合、誤った比較表示(保険業法第300条第1項第6号)に該当しないための具体的な基準を明確にしてほしい。\n例えば、顧客の意向が保険料水準にある場合に、顧客属150性や保険金額等を同一条件とした保険設計書に基づき比較、又は特定商品を推奨することは、誤った比較表示に当たらないと理解してよいかを確認したい。","pageStart":150,"pageEnd":151,"answer":"保険料水準を基準として比較説明又は推奨販売を行う場合には、前提条件や算出方法が適切に整理され、顧客に誤認を生じさせない表示・説明となっていることが重要であり、保険業法第300条第1項第6号及びⅡ－4－2－2(9)②に基づき、個別具体的に判断する必要があります。\nただし、比較の前提や算出条件について十分な説明がなされていない場合や、特定の条件のみを強調することにより、顧客に一般的な優位性があると誤認させるような表示・説明は、同条の趣旨に照らし適切でないことから、監督指針に基づき、顧客の理解を確保する丁寧な説明が求められます。\nなお、ご質問にある「特定商品を推奨」するケースにおいては、とりわけⅡー4ー2－9(5)①B.(a)に留意する必要があります。","theme":"顧客の最善の利益","section":"監督指針","tags":["比較推奨"]},{"no":250,"location":"Ⅱ－4－2－9(5)","comment":"代理店手数料が保険商品の販売量等に応じて変動する「代理店手数料ポイント制度」の存在は、業務品質を重視する建付けであっても、特に小規模な乗合代理店に対し、実質的に特定保険会社の商品販売を誘引するインセンティブとして働きかねず、その下では、代理店が比較推奨販売を顧客本位かつ適切に行っているかを確保・確認することが困難ではないか。","pageStart":151,"pageEnd":151,"answer":"代理店手数料の算出方法に関しては、Ⅱ－4－2－14において、保険代理店における保険募集に関する業務の健全かつ適正な運営を阻害する不適切なインセンティブを与え、不適切な保険募集を誘引することがないよう求めています。\n加えて、比較推奨販売の適切性を確保する観点からも、乗合代理店においては、代理店手数料ポイントの多寡によらず、顧客の意向に沿った適切な推奨販売が行われていることを事後的にモニタリングできる態勢を構築することが重要です。","theme":"顧客の最善の利益","section":"監督指針","tags":["手数料・インセンティブ","比較推奨"]},{"no":251,"location":"－","comment":"本改正案では、乗合代理店に対し「顧客の最善の利益を勘案」した比較推奨を求めているが、保険代理店は保険会社の代理人であり、独立した立場でベストアドバイス義務を課されている保険仲立人とは法的性質が異なると理解している。\n本規制の導入により、実務上、乗合代理店に保険仲立人と同等の義務が課されるようにも見受けられるが、金融庁として、乗合代理店と保険仲立人の役割・義務の違いをどのように整理し、運用していく方針か、見解を示していた151だきたい。","pageStart":151,"pageEnd":152,"answer":"本改正は、保険代理店と保険仲立人の法的な位置付けや役割の違いを変更するものではありません。\n保険仲立人が保険契約の締結の媒介を行う者として保険会社から独立した立場から顧客に助言するのに対し、保険代理店は引き続き保険会社の代理人として保険募集を行うという基本的な構造に変更はありません。\nその上で、金融サービス提供法に基づく誠実公正義務(顧客の最善の利益勘案義務)は、金融事業者の行動規範として、募集行為全般に適用されるものであり、乗合代理店に対しても、自らの立場を明示した上で、顧客の意向や事情に照らし、合理的な理由に基づいて商品を選別・推奨しているかが問われるものです。\nこれは、保険仲立人に課される保険業法第299条に基づく義務と同様の義務を課す趣旨ではなく、保険代理店としての立場を前提に、顧客の意向把握・確認義務を踏まえつつ、顧客の最善利益勘案義務を履行するために顧客が重視する事項に基づく適切な商品の選別・推奨がなされているかを確認するものであり、当該趣旨を踏まえた運用を行ってまいります。","theme":"顧客の最善の利益","section":"監督指針","tags":["比較推奨","意向把握","顧客の最善の利益"]},{"no":252,"location":"Ⅱ－4－2－9(5)","comment":"自動車保険は主要な補償内容が各社で大きく異ならず、特約や保険料にも決定的な差が少ない中、各社の保険料試算に多くの時間と工数をかけても、顧客が期待するほどの商品差異が提供できない場合がある。\nそのような状況で、形式的に比較推奨販売を行うことが、果たして顧客本位といえるのか。","pageStart":152,"pageEnd":152,"answer":"今般の改正の趣旨は保険業法に基づく意向把握を前提として、顧客の意向等に照らし適切な商品選択の機会を確保する点にあります。\n「顧客が期待するほどの商品差異」が何を指しているか明らかではありませんが、たとえ、保障(補償)内容や保険料水準の差異がほとんどない場合であっても、当該差異が、顧客の意向となることは考えられます。したがって、「顧客が期待するほどの商品差異」に基づく提案をできないことを理由に、Ⅱー4ー2ー9(5)に則した適切な販売を行わないことは、不適切であると考えます。\n保障(補償)内容や保険料水準の差異が限定的である場合には、例えば、その点を含めて顧客に説明した上で、顧客の理解や意向に沿い、説明や比較の範囲を工夫するなど、顧客の最善の利益に資するよう実効的な対応を図ることも考えられます。","theme":"顧客の最善の利益","section":"監督指針","tags":["比較推奨","意向把握","顧客の最善の利益"]},{"no":253,"location":"Ⅱ－4－2－9(5)","comment":"比較推奨販売の適正化に係る監督指針の運用については、顧客の意向を十分に踏まえる一方で、顧客と代理店双方に大きな負担を与えないような運用を行うことが必要である。\n152監督指針II－4－2－9(5)B.において「乗合代理店が二以上の比較可能な同種の保険契約の中から、顧客の意向に沿って保険契約を選別することにより、保険契約を提示・推奨しようとする場合には、保険業法施行規則第227条2第3項第4号ロの規程の趣旨を踏まえた上で、保険募集の実務や募集形態等に応じて…」とあるが、顧客が簡素な説明を希望する場合、当該提案・推奨する保険契約の概要や契約内容を説明するものとして、保険会社が作成するパンフレット等を提示して、必要に応じて補償内容や保険料水準等の要点を補足することで足りるか。","pageStart":152,"pageEnd":153,"answer":"今般の改正の趣旨は保険業法に基づく意向把握を前提として、顧客の意向等に照らし適切な商品選択の機会を確保する点にあります。\n「簡素な説明」が何を指しているか明らかではありませんが、顧客の意向に整合的な形で、当該保険契約を選別・推奨する理由が合理的に説明できること、また、顧客の理解と納得を得られる実効的な募集が行われていることが重要であると考えています。","theme":"顧客の最善の利益","section":"監督指針","tags":["比較推奨","意向把握"]},{"no":254,"location":"Ⅱ－4－2－9(5)","comment":"日本損害保険協会の「保険加入に関する消費者アンケート」によれば、自動車保険の商談時間は30分以内が適切と考える消費者が7割近くを占めている。今回の監督指針改正により、保険商品の説明のために顧客を長時間拘束するようなことになれば、顧客の負担も増大し、顧客本位の業務運営とはならない可能性も高い。短時間で簡潔な説明を求めるということも顧客の大切な意向の一つであることに留意すべきである。今回の改正指針の運用により、これまで以上に丁寧に顧客の意向を把握するとしても、全ての顧客に長時間の説明を行うことを求めるようなこととせず、顧客の希望を踏まえた効率的かつ簡潔な比較推奨販売ができるような運用とすべきと考えるが、金融庁の見解をご教示いただきたい。","pageStart":153,"pageEnd":153,"answer":"今般の改正の趣旨は保険業法に基づく意向把握を前提として、顧客の意向等に照らし適切な商品選択の機会を確保する点にあります。\n「簡素な説明」が何を指しているか明らかではありませんが、顧客の意向に整合的な形で、当該保険契約を選別・推奨する理由が合理的に説明できること、また、顧客の理解と納得を得られる実効的な募集が行われていることが重要であると考えています。","theme":"顧客の最善の利益","section":"監督指針","tags":["比較推奨","意向把握"]},{"no":255,"location":"Ⅱ－4－2－9(5)","comment":"保険加入に際し、顧客の意向確認ステップを確実に踏むことを前提としつつ、顧客意向確認に過度に固執すること153により、顧客に課す負担を逆に増大させることは避けるべきと考える。\n一定のステップを踏んだ上で、「最終的に保険会社選択に当たっての明確な顧客意向が無い」というケースも想定した上での社内規則策定が必要であると考える。","pageStart":153,"pageEnd":154,"answer":"比較推奨販売においては、顧客の意向を適切に把握・確認することが前提となりますが、顧客に過度な負担を課すような画一的・網羅的な確認を一律に求めるものではありません。\n顧客の意向が不明確な場合には、保障(補償)内容、保険料水準、特約等、顧客が重視し得る事項を確認するなど、可能な限り意向の形成を促し、又は意向の明確化に努めた上で、把握した顧客の意向に沿って、合理的かつ一定の具体性を有する基準や理由等に基づき、保険契約を選別し、提示・推奨することが重要です。\nその上で、明確な意向がなお確認できない場合の対応について、社内規則等において、追加確認の方法、比較説明への切替え、提示・推奨理由の説明、記録・検証方法等を定めることは有効な取組みと考えられます。\nただし、顧客の意向が不明確であることを理由に、手数料水準、販売目標、保険会社からの便宜供与等の代理店側の都合により、特定の保険会社又は特定の保険契約へ誘導することは適切ではありません。","theme":"意向がない場合","section":"監督指針","tags":["便宜供与","手数料・インセンティブ","比較推奨","意向把握","証跡・記録"]},{"no":256,"location":"Ⅱ－4－2－9(5)","comment":"意向把握義務における当初意向を把握できた顧客に対して、監督指針Ⅱ－4－2－9(5)①B.(a)第1段落に沿って当該顧客の意向を確認した際に、「全て貴社にお任せする」\nという反応を示す顧客(かかる顧客は意向が不明確な顧客と理解している。)は、ごく少数ながら存在する。\nその際、監督指針Ⅱ－4－2－9(5)①B.(b)に沿って、顧客が特に重視すると考えられる事項を例示するなどして、可能な限り顧客の意向を把握することに努めるが、それでもなお、顧客から、例えば「とにかく貴社にお任せするので、何らか具体的な提案をしてほしい」などという反応が示される場合(かかる顧客は意向が不明確な顧客と理解してい154る。)が、さらにごく少数ながら存在する。\nその場合、意向把握義務における当初意向以上に監督指針Ⅱ－4－2－9(5)①B.(a)第1段落に定める顧客の意向に沿った保険契約を選別できないので、監督指針Ⅱ－4－2－9(5)①B.(a)第2段落に定める特定の保険契約を推奨せざるを得ないという理解でよいか。\nなお、顧客の意向が不明確な場合であっても、顧客が特に重視すると考えられる事項の例示を工夫するなどして、できる限り顧客の意向に沿って保険契約を選別できるよう努めることは、当然の前提と理解している。","pageStart":154,"pageEnd":155,"answer":"顧客が「全て任せる」、「具体的な提案をしてほしい」などと述べた場合であっても、その意思表示のみをもって、乗合代理店が任意に特定の保険会社又は特定の保険契約を選別し、提示・推奨することは適切ではありません。\n当該意思表示がされたことを踏まえつつ、保障(補償)内容、保険料水準、特約等、顧客が重視し得る事項を確認するなど、可能な限り意向の形成を促し、又は意向の明確化に努めた上で、把握した顧客の意向に沿って、合理的かつ一定の具体性を有する基準や理由等に基づき、保険契約を選別し、提示・推奨することが重要です。\nその上で、顧客の意向や募集実態に応じて、Ⅱ－4－2－9(5)①A.に基づき複数の保険契約を比較説明すること、又は同①B.に基づき「二以上の比較可能な同種の保険契約」の中から顧客の意向に沿って保険契約を選別し、提示・推奨することが考えられます。\n上記の対応等をしたものの明確な意向がなお確認できない場合に、顧客の意向に沿って保険契約を選別し、提示・推奨するためには、顧客の理解度や負担にも配慮しつつ、それまでに把握した顧客の当初意向、顧客属性、加入目的、既加入契約、保険料水準、必要と考えられる保障(補償)内容等を踏まえて、顧客の最善の利益を勘案し、合理的かつ一定の具体性を有する基準や理由等に基づき、保険契約を提示・推奨することが考えられます。\nただし、手数料水準、販売目標、保険会社からの便宜供与等の代理店側の都合により、特定の保険会社又は特定の保険契約へ誘導することは適切ではありません。また、意向把握、例示、提示・推奨の理由、顧客への説明内容等について、事後的に確認・検証できるよう記録することが重要です。","theme":"意向がない場合","section":"監督指針","tags":["便宜供与","手数料・インセンティブ","比較推奨","意向把握","顧客の最善の利益","証跡・記録"]},{"no":257,"location":"－","comment":"意向確認について、顧客が代理店に一任するとの意向の場合、比較推奨を行う必要はないと考えてよいか。","pageStart":155,"pageEnd":155,"answer":"顧客が「全て任せる」、「具体的な提案をしてほしい」などと述べた場合であっても、その意思表示のみをもって、乗合代理店が任意に特定の保険会社又は特定の保険契約を選別し、提示・推奨することは適切ではありません。\n当該意思表示がされたことを踏まえつつ、保障(補償)内容、保険料水準、特約等、顧客が重視し得る事項を確認するなど、可能な限り意向の形成を促し、又は意向の明確化に努めた上で、把握した顧客の意向に沿って、合理的かつ一定の具体性を有する基準や理由等に基づき、保険契約を選別し、提示・推奨することが重要です。\nその上で、顧客の意向や募集実態に応じて、Ⅱ－4－2－9(5)①A.に基づき複数の保険契約を比較説明すること、又は同①B.に基づき「二以上の比較可能な同種の保険契約」の 険契約を選別し、提示・推奨することが重要です。\nその上で、顧客の意向や募集実態に応じて、Ⅱ－4－2－9(5)①A.に基づき複数の保険契約を比較説明すること、又は同①B.に基づき「二以上の比較可能な同種の保険契約」の中から顧客の意向に沿って保険契約を選別し、提示・推奨することが考えられます。\n上記の対応等をしたものの明確な意向がなお確認できない場合に、顧客の意向に沿って保険契約を選別し、提示・推奨するためには、顧客の理解度や負担にも配慮しつつ、それまでに把握した顧客の当初意向、顧客属性、加入目的、既加入契約、保険料水準、必要と考えられる保障(補償)内容等を踏まえて、顧客の最善の利益を勘案し、合理的かつ一定の具体性を有する基準や理由等に基づき、保険契約を提示・推奨することが考えられます。\nただし、手数料水準、販売目標、保険会社からの便宜供与等の代理店側の都合により、特定の保険会社又は特定の保険契約へ誘導することは適切ではありません。また、意向把握、例示、提示・推奨の理由、顧客への説明内容等について、事後的に確認・検証できるよう記録することが重要です。","theme":"意向がない場合","section":"監督指針","tags":["便宜供与","手数料・インセンティブ","比較推奨","意向把握","顧客の最善の利益","証跡・記録"]},{"no":262,"location":"Ⅱ－4－2－9(5)","comment":"監督指針Ⅱ－4－2－9(5)①B.(b)に記載のように努めたものの、それでもなお顧客から「よくわからないから、おすすめをしてもらいたい」などと言われるなど、顧客の意向が不明確な場合(それ以上は顧客の意向に基づいて絞り込むことが難しく、あえて質問をして絞り込もうとすると誘導になりかねない場合)には、それまでに確認した顧客の意向との対応関係や顧客の最善利益を十分考慮のうえ、監督指針Ⅱ－4－2－9(5)①B.(a)により、保険募集人や乗合代理店の都合によることなく、合理的かつ一定の具体性を有する説明(補償内容などの商品特性等に関する説明)\nを行うことによって、提示・推奨する保険契約を絞り込むという理解でよいか。","pageStart":156,"pageEnd":156,"answer":"顧客が「全て任せる」、「具体的な提案をしてほしい」などと述べた場合であっても、その意思表示のみをもって、乗合代理店が任意に特定の保険会社又は特定の保険契約を選別し、提示・推奨することは適切ではありません。\n当該意思表示がされたことを踏まえつつ、保障(補償)内容、保険料水準、特約等、顧客が重視し得る事項を確認するなど、可能な限り意向の形成を促し、又は意向の明確化に努めた上で、把握した顧客の意向に沿って、合理的かつ一定の具体性を有する基準や理由等に基づき、保険契約を選別し、提示・推奨することが重要です。\nその上で、顧客の意向や募集実態に応じて、Ⅱ－4－2－9(5)①A.に基づき複数の保険契約を比較説明すること、又は同①B.に基づき「二以上の比較可能な同種の保険契約」の中から顧客の意向に沿って保険契約を選別し、提示・推奨することが考えられます。\n上記の対応等をしたものの明確な意向がなお確認できない場合に、顧客の意向に沿って保険契約を選別し、提示・推奨するためには、顧客の理解度や負担にも配慮しつつ、それまでに把握した顧客の当初意向、顧客属性、加入目的、既加入契約、保険料水準、必要と考えられる保障(補償)内容等を踏まえて、顧客の最善の利益を勘案し、合理的かつ一定の具体性を有する基準や理由等に基づき、保険契約を提示・推奨することが考えられます。\nただし、手数料水準、販売目標、保険会社からの便宜供与等の代理店側の都合により、特定の保険会社又は特定の保険契約へ誘導することは適切ではありません。また、意向把握、例示、提示・推奨の理由、顧客への説明内容等について、事後的に確認・検証できるよう記録することが重要です。","theme":"意向がない場合","section":"監督指針","tags":["便宜供与","手数料・インセンティブ","比較推奨","意向把握","顧客の最善の利益","証跡・記録"]},{"no":263,"location":"Ⅱ－4－2－9(5)","comment":"「顧客の求めに応じて契約内容並びに当該提示・推奨する基準や理由等を説明しているか」とあるが、顧客の求めが無い場合、つまり顧客がはっきりと「代理店に任せる」\n156と申し出た場合等、には提示・推奨の理由の説明は不要という理解でよいか。","pageStart":156,"pageEnd":157,"answer":"「顧客の求めに応じて」とは、主として契約内容の詳細説明についての記載であり、特定の保険契約を提示・推奨する基準や理由等の説明まで、顧客の求めがある場合に限る趣旨ではありません。\nしたがって、乗合代理店が「二以上の比較可能な同種の保険契約」の中から、顧客の意向に沿って保険契約を選別し、提示・推奨する場合には、顧客の求めの有無にかかわらず、当該提示・推奨する基準や理由等を説明する必要があります。\nなお、ご意見を踏まえ、Ⅱ－4－2－9(5)①B.(a)を一部修正しました。\nまた、顧客が「代理店に任せる」と述べた場合であっても、その意思表示のみをもって、意向把握や提示・推奨理由の説明が不要となるものではありません。当該意思表示がされたことを踏まえつつ、保障(補償)内容、保険料水準、特約等、顧客が重視し得る事項を確認するなど、可能な限り意向の形成を促し、又は意向の明確化に努めた上で、把握した顧客の意向に沿って、合理的かつ一定の具体性を有する基準や理由等に基づき、保険契約を選別し、提示・推奨することが重要です。\nなお、手数料水準、販売目標、保険会社からの便宜供与等の代理店側の都合により、特定の保険会社又は特定の保険契約へ誘導することは適切ではありません。","theme":"意向がない場合","section":"監督指針","tags":["便宜供与","手数料・インセンティブ","意向把握"]},{"no":264,"location":"Ⅱ－4－2－9(5)","comment":"「代理店にお任せする」、「募集人のおすすめでよい」\nと言われた場合も、決められたプロセスに則り、顧客の意向を確認し、例外なく推奨販売を行う必要があるのか。重視するポイントの選択肢に、代理店のおすすめ・お任せなどの項目を含め、これを選択された場合は、推奨の理由・根拠を明示したとしても保険業法施行規則第227条の2第3項第4号ロの趣旨に反するのか。\n157","pageStart":157,"pageEnd":158,"answer":"顧客が「代理店に任せる」、「募集人のおすすめでよい」と述べた場合であっても、その意思表示のみをもって、乗合代理店が任意に特定の保険会社又は特定の保険契約を選別し、提示・推奨することは適切ではありません。\n当該意思表示がされたことを踏まえつつ、保障(補償)内容、保険料水準、特約等、顧客が重視し得る事項を確認するなど、可能な限り意向の形成を促し、又は意向の明確化に努めた上で、把握した顧客の意向に沿って、合理的かつ一定の具体性を有する基準や理由等に基づき、保険契約を選別し、提示・推奨することが重要です。\n重視するポイントの選択肢に、保険募集人の主観的又は属人的な判断に基づき「代理店のおすすめ」、「お任せ」等を設けて特定の保険契約へ誘導することは適切ではありません。保険契約の推奨理由は、上記の確認等を通じて把握した顧客の意向との関係で具体的に説明する必要があります。\nまた、手数料水準、販売目標、保険会社からの便宜供与等の代理店側の都合により、特定の保険会社又は特定の保険契約へ誘導することは適切ではありません。","theme":"意向がない場合","section":"監督指針","tags":["便宜供与","手数料・インセンティブ"]},{"no":265,"location":"Ⅱ－4－2－9(5)","comment":"保険業法施行規則第227条の2第3項第4号ロを採用した場合、例えば、顧客が火災保険の加入を希望しながらも細かな意向がなく、代理店へ一任したいとされた場合には、どこまで意向の把握が必要になるのか伺いたい。","pageStart":158,"pageEnd":158,"answer":"顧客が火災保険への加入を希望しつつ、「代理店に一任したい」\nと述べた場合であっても、その意思表示のみをもって、乗合代理店が任意に特定の保険会社又は特定の保険契約を選別し、提示・推奨することは適切ではありません。\n当該意思表示がされたことを踏まえつつ、建物・家財等の保険対象、保障(補償)範囲、保険金額、保険料水準、地震保険の要否等、顧客が重視し得る事項を確認するなど、可能な限り意向の形成を促し、又は意向の明確化に努めた上で、把握した顧客の意向に沿って、合理的かつ一定の具体性を有する基準や理由等に基づき、保険契約を選別し、提示・推奨することが重要です。\nなお、手数料水準、販売目標、保険会社からの便宜供与等の代理店側の都合により、特定の保険会社又は特定の保険契約へ誘導することは適切ではありません。","theme":"意向がない場合","section":"監督指針","tags":["便宜供与","手数料・インセンティブ"]},{"no":266,"location":"Ⅱ－4－2－9(5)","comment":"顧客の意向に沿って複数の保険契約について丁寧に比158較説明したのち、「それぞれの商品の商品特性や保険料水準に有意な差がないので代理店に任せる」という意向の顧客には、保険募集人の判断で特定の保険契約に絞り込み、その理由と商品の内容を説明して推奨できるという理解でよいか。\nその際、例えば、当該代理店店舗で最も多くの顧客に選択されている販売実績の多い商品に絞り込んで、その優位性を説明しつつ推奨することはさしつかえないか。","pageStart":158,"pageEnd":159,"answer":"複数の保険契約について説明した結果、顧客が「有意な差がないので代理店に任せる」と述べた場合であっても、その意思表示のみをもって、乗合代理店が任意に特定の保険会社又は特定の保険契約を選別し、提示・推奨することは適切ではありません。\n当該意思表示がされたことを踏まえつつ、既に把握した顧客の意向、保障(補償)内容、保険料水準等との関係で、合理的かつ一定の具体性を有する基準や理由等に基づき説明する必要があります。\n販売実績は、販売方針、手数料水準、保険会社からの便宜供与、過去の推奨方法等の影響を受け得るため、それのみを主たる理由として特定の保険契約を推奨することは適切ではありません。\n特に、乗合代理店が販売実績等の情報を用いて特定の保険契約を推奨する場合において、当該情報が、例えば、従前、保険業法施行規則第227条の2第3項第4号ハに基づき、乗合代理店の店舗ごとに異なる保険会社の保険契約を取り扱っていたことを前提として、特定の保険契約を推奨するような資料や数値に基づくものであるときは、結果として、恣意的な選別・推奨と評価されるおそれが高いことに留意する必要があります。\n販売実績を用いる場合には、集計期間、対象契約、対象顧客、件数、集計方法・評価方法等の合理性を適切に判断した上で、それらを明確にし、顧客に誤認を与えず、恣意的な誘導とならないよう、事後的に確認・検証できる態勢を整備することも重要です。","theme":"意向がない場合","section":"監督指針","tags":["便宜供与","手数料・インセンティブ","ハ方式"]},{"no":267,"location":"－","comment":"比較推奨販売における「事前の顧客意向確認」の義務化について、保険商品、特に医療保険など第三分野の専門性・複雑性を踏まえると、画一的な運用には課題がある。\n実務では多くの顧客が事前に明確な意向を持たず、専門159家による情報提供を受けて初めて自らのニーズを形成するのが実態であり、形式的な意向確認を強制すると、かえって顧客本位に反する結果となりかねない。\nこのため、商品特性に応じて、専門家が情報提供を行いながら顧客の意向形成を支援するプロセスや、全体像を示した上で段階的に選択肢を絞り込む「アウトライン提示型販売」を明確に容認し、その過程を合理的に記録・検証する柔軟な運用を求める。\nこうした整理により、形式主義を排しつつ、顧客理解に基づく真の意向形成と実効性ある顧客保護、現場実務との整合を両立させることができる。","pageStart":159,"pageEnd":160,"answer":"乗合代理店が比較推奨販売を行う場合には、顧客の意向を適切に把握した上で、当該意向に沿って保険契約を選別し、提示・推奨する必要があります。\n一方で、例えば、医療保険等の商品特性に照らし、顧客の意向が当初から明確でない場合には、保険募集人が、顧客の属性等を踏まえて、想定されるリスクや保険が果たす役割等を説明した上で、顧客が重視し得る事項を確認するなど、可能な限り意向の形成を促し、又は意向の明確化に努めた上で、把握した顧客の意向に沿って、合理的かつ一定の具体性を有する基準や理由等に基づき、保険契約を選別し、提示・推奨することが重要です。\nただし、意向形成支援や選択肢の提示を名目として、比較推奨販売の対象を狭める目的で顧客の意向を恣意的に誘導したり、手数料水準、販売目標、保険会社からの便宜供与等の代理店側の都合により、特定の保険会社又は特定の保険契約へ誘導することは適切ではありません。\nまた、意向把握・意向形成支援の過程、提示・推奨の理由、顧客への説明内容等について、事後的に確認・検証できるよう記録・管理することも重要です。","theme":"意向がない場合","section":"監督指針","tags":["便宜供与","手数料・インセンティブ","比較推奨","意向把握","証跡・記録"]},{"no":268,"location":"－","comment":"推奨販売にあたり、顧客の意向が不明確な場合、保険募集人や乗合代理店は、補償範囲や保険料の違い、事故対応・アフターフォロー等、顧客が重視すると思われる事項を丁寧に例示することによって、顧客自身が加入する契約を選定するサポートをすることが大切であり、その観点から、顧客が選定に至るプロセスは一律に決められるものではないとの理解でよいか。\n160","pageStart":160,"pageEnd":161,"answer":"顧客が保険契約を選定するプロセスの適切性は、募集形態、顧客の理解度・意向等を踏まえ、個別具体的に判断されます。\n顧客の意向が不明確な場合には、保障(補償)内容、保険料水準、特約等、顧客が重視し得る事項を確認するなど、可能な限り意向の形成を促し、又は意向の明確化に努めた上で、把握した顧客の意向に沿って、合理的かつ一定の具体性を有する基準や理由等に基づき、保険契約を選別し、提示・推奨することが重要です。\nなお、上記の確認や意向形成支援に際して、比較推奨販売の対象を狭める目的で顧客を誘導したり、手数料水準、販売目標、保険会社からの便宜供与等の代理店側の都合により、特定の保険会社又は特定の保険契約へ誘導することがないよう留意する必要があります。","theme":"意向がない場合","section":"監督指針","tags":["便宜供与","手数料・インセンティブ","比較推奨"]},{"no":269,"location":"Ⅱ－4－2－9(5)","comment":"新規加入提案の意向確認において、最初から顧客による損害保険会社の指定があった場合や「保険のことはよくわからないからお勧めする損害保険会社でお願いしたい」という意向が示された場合、どのように対応すればよいか。","pageStart":161,"pageEnd":161,"answer":"保険募集人による保険契約の選別・提案が実質的に伴うことなく、顧客の主体的な判断のみにより、顧客から特定の保険会社又は特定の保険契約が指定され、その結果、一の保険契約が選択された場合には、直ちに保険業法施行規則第227条の2第3項第4号ロに係る対応が必要となるものではありません。\nただし、その場合でも、保険業法に基づく権限明示、意向把握・確認、重要事項説明等の保険募集上必要な対応は適切に行う必要があります。\n一方で、顧客が「保険のことは分からないので、おすすめの損害保険会社でよい」と述べた場合には、その意思表示のみをもって、代理店が任意に特定の保険会社又は特定の保険契約を選別し、提示・推奨することは適切ではありません。\nこのような場合には、当該意思表示がされたことを踏まえつつ、保障(補償)内容、保険料水準、特約等、顧客が重視し得る事項を確認するなど、可能な限り意向の形成を促し、又は意向の明確化に努めた上で、把握した顧客の意向に沿って、合理的かつ一定の具体性を有する基準や理由等に基づき、保険契約を選別し、提示・推奨することが重要です。\nなお、手数料水準、販売目標、保険会社からの便宜供与等の代理店側の都合により、特定の保険会社又は特定の保険契約へ誘導することは適切ではありません。","theme":"意向がない場合","section":"監督指針","tags":["便宜供与","手数料・インセンティブ","意向把握"]},{"no":270,"location":"Ⅱ－4－2－9(5)","comment":"監督指針Ⅱ－4－2－9(5)①B.(b)にあるように、顧客の意向が不明確な場合であっても、例えば、顧客が特に重視すると考えられる事項を例示するなど、可能な限り顧客の161意向を把握する。\nその上で、監督指針Ⅱ－4－2－9(5)①A.複数の保険契約の内容を比較して説明する、もしくは監督指針Ⅱ－4－2－9(5)①B.二以上の比較可能な同種の保険契約の中から顧客の意向に沿って保険契約を選別し、提示・推奨する、という対応を実施することが考えられる、という理解でよいか。","pageStart":161,"pageEnd":162,"answer":"ご理解のとおりです。\n顧客の意向が不明確な場合には、顧客が重視し得る事項を確認するなど、可能な限り意向の形成を促し、又は意向の明確化に努めた上で、把握した顧客の意向に沿って、合理的かつ一定の具体性を有する基準や理由等に基づき、保険契約を選別し、提示・推奨することが重要です。\nその上で、顧客の意向や募集実態に応じて、Ⅱ－4－2－9(5)①A.に基づき複数の保険契約を比較説明すること、又は同①B.に基づき「二以上の比較可能な同種の保険契約」の中から顧客の意向に沿って保険契約を選別し、提示・推奨することが考えられます。\nなお、顧客の意向の内容や変化に応じて、保険契約の選別が複数回行われることもあり得ます。その場合でも、各段階において、把握した顧客の意向に沿って、合理的かつ一定の具体性を有する基準や理由等に基づき説明する必要があります。\nまた、比較推奨販売の対象を狭める目的で顧客の意向を恣意的に誘導し、又は手数料水準、販売目標、保険会社からの便宜供与等の代理店側の都合により、特定の保険会社又は特定の保険契約へ誘導することは適切ではありません。","theme":"意向がない場合","section":"監督指針","tags":["便宜供与","手数料・インセンティブ","比較推奨"]},{"no":271,"location":"Ⅱ－4－2－9(5)","comment":"顧客が特に重視すると考えられる事項とは、どのようなものがあるか例示いただきたい。","pageStart":162,"pageEnd":162,"answer":"Ⅱ－4－2－9(5)①B.(b)の「顧客が特に重視すると考えられる事項を例示する」とは、顧客の意向が不明確な場合に、顧客の意向形成又は顧客の意向の明確化を促すための方法の一つです。\nその際には、当初把握した意向、顧客属性、取扱商品、募集形態等を踏まえつつ、商品特性や保険料水準等、顧客の適切な商品選択に資する事項を例示することが考えられます。\nまた、消費者一般又は自社顧客の平均的・一般的傾向を参考に、顧客が重視し得る事項を例示すること自体は否定されませんが、当該例示は、個別顧客の意向把握に代替するものではなく、顧客の意向形成又は明確化を支援するためのものです。","theme":"意向がない場合","section":"監督指針","tags":["意向把握"]},{"no":272,"location":"Ⅱ－4－2－9(5)","comment":"顧客が特に重視すると考えられる事項の例示について、恣意的に特定の保険契約へ誘導する意図なく、消費者や自社顧客の平均的・一般的傾向に基づいて例示することは認められるか。","pageStart":162,"pageEnd":162,"answer":"Ⅱ－4－2－9(5)①B.(b)の「顧客が特に重視すると考えられる事項を例示する」とは、顧客の意向が不明確な場合に、顧客の意向形成又は顧客の意向の明確化を促すための方法の一つです。\nその際には、当初把握した意向、顧客属性、取扱商品、募集形態等を踏まえつつ、商品特性や保険料水準等、顧客の適切な商品選択に資する事項を例示することが考えられます。\nまた、消費者一般又は自社顧客の平均的・一般的傾向を参考に、顧客が重視し得る事項を例示すること自体は否定されませんが、当該例示は、個別顧客の意向把握に代替するものではなく、顧客の意向形成又は明確化を支援するためのものです。","theme":"意向がない場合","section":"監督指針","tags":["意向把握"]},{"no":273,"location":"Ⅱ－4－2－9(5)","comment":"監督指針Ⅱ－4－2－9(5)①B.(b)について、顧客の意向に沿って保険契約を選別する場合、意向が不明確であれば、当初の意向の事項に沿って例示し、特に重視する事項を可能な限り把握するという理解でよいか162","pageStart":162,"pageEnd":162,"answer":"Ⅱ－4－2－9(5)①B.(b)の「顧客が特に重視すると考えられる事項を例示する」とは、顧客の意向が不明確な場合に、顧客の意向形成又は顧客の意向の明確化を促すための方法の一つです。\nその際には、当初把握した意向、顧客属性、取扱商品、募集形態等を踏まえつつ、商品特性や保険料水準等、顧客の適切な商品選択に資する事項を例示することが考えられます。\nまた、消費者一般又は自社顧客の平均的・一般的傾向を参考に、顧客が重視し得る事項を例示すること自体は否定されませんが、当該例示は、個別顧客の意向把握に代替するものではなく、顧客の意向形成又は明確化を支援するためのものです。","theme":"意向がない場合","section":"監督指針","tags":["意向把握"]},{"no":274,"location":"Ⅱ－4－2－9(5)","comment":"顧客に明確な意向がない場合でも、顧客の契約判断において重要と思われる項目を中心に説明し、比較推奨販売を実施すべきと考えるが、その認識で相違ないか。\nまた、重要と思われる項目には「保険料」も含まれる想定であるがその認識で相違ないか。","pageStart":163,"pageEnd":163,"answer":"その上で、把握した顧客の意向に沿って、顧客の最善の利益を勘案しつつ、合理的かつ一定の具体性を有する基準や理由等に基づき、保険契約を選別し、提示・推奨する必要があります。\nなお、例示する事項やその提示方法に関して、顧客の意向を恣意的に誘導したり、手数料水準、販売目標、保険会社からの便宜供与等の代理店側の都合や保険募集人の主観的又は属人的な理由により、特定の保険会社又は特定の保険契約へ誘導することは適切ではありません。","theme":"意向がない場合","section":"監督指針","tags":["便宜供与","手数料・インセンティブ","比較推奨","顧客の最善の利益"]},{"no":275,"location":"Ⅱ－4－2－9(5)","comment":"「顧客が重視する事項」は、顧客の意思が明らかな場合はそれを採用し、顧客の意思が不明確な場合は、一般的に「顧客が重視するであろう」項目をあらかじめ社内ルールで定め(列挙し)、これに基づき提示・推奨すればよいという理解でよいか。\n163","pageStart":163,"pageEnd":163,"answer":"顧客が重視する事項が明確である場合には、当該意向を踏まえて保険契約を選別し、提示・推奨する必要があります。\n一方で、顧客の意向が不明確な場合には、顧客が重視し得る事項を確認するなど、可能な限り顧客の意向の形成を促し、又は意向の明確化に努めることが重要です。\nそのため、社内規則等において、商品特性、保険料水準、保障(補償)内容等、顧客が重視し得る事項をあらかじめ整理しておくことは有効な取組みと考えられます。\nただし、当該項目は、顧客の意向を適切に把握するための補助であり、保険募集人は、把握した顧客の意向に沿って、顧客の最善の利益を勘案しつつ、合理的かつ一定の具体性を有する基準や理由等に基づき、保険契約を選別し、提示・推奨する必要があります。当該項目の定めに基づき機械的に特定の保険契約を提示・推奨することや、手数料水準、販売目標、保険会社からの便宜供与等の代理店側の都合により誘導することは適切ではありません。","theme":"意向がない場合","section":"監督指針","tags":["便宜供与","手数料・インセンティブ","顧客の最善の利益"]},{"no":276,"location":"Ⅱ－4－2－9(5)","comment":"顧客の意向が不明確な場合に例示する、特に重視すると考えられる事項は、社内規則等に定めることも許容され、社内規則等に定めず個々の顧客とのやり取りを踏まえて保険募集人の判断によって例示する事項を決めることも許容されるという理解でよいか。","pageStart":164,"pageEnd":164,"answer":"顧客の意向が不明確な場合に、顧客が特に重視すると考えられる事項や、その例示方法等を社内規則等に定めることは、保険募集人への周知、教育・管理・指導、恣意的な運用を防止する観点から有効な取組みと考えられます。\nまた、取扱商品、募集形態、顧客属性、リスクの状況、顧客とのやり取り等を踏まえ、保険募集人が個別具体的に例示事項を判断することも直ちに否定されるものではありません。\nただし、その場合でも、保険募集人ごとの属人的・恣意的な判断により特定の保険会社又は特定の保険契約へ誘導することのないよう、意向把握の方法、例示事項、説明内容、記録・検証方法等について、乗合代理店として適切に管理する必要があります。\nなお、当該例示や意向形成支援が、比較推奨販売の対象を狭める目的で顧客の意向を恣意的に誘導したり、手数料水準、販売目標、保険会社からの便宜供与等の代理店側の都合により、特定の保険会社又は特定の保険契約へ誘導することは適切ではありません。","theme":"意向がない場合","section":"監督指針","tags":["便宜供与","手数料・インセンティブ","比較推奨","意向把握","証跡・記録"]},{"no":277,"location":"－","comment":"顧客が特に重視すると考えられる事項の例示については、監督指針Ⅱ－4－2－9(5)①B.(b)(注3)に留意しつつ、代理店の判断で例示をするということでよいか。また、この例示については、監督指針Ⅱ－4－2－9(5)②ア.で定める社内規則等に規定する必要があるか。\n164","pageStart":164,"pageEnd":165,"answer":"顧客が特に重視すると考えられる事項の例示については、取扱商品、募集形態、顧客属性、顧客とのやり取り等を踏まえ、顧客の適切な商品選択に資するよう代理店において適切に判断することが考えられます。\nその際には、商品特性、保険料水準、保障(補償)内容等、顧客の適切な商品選択に資する事項を客観的に示し、顧客の意向形成又は意向の明確化を促すことが重要です。\nまた、当該例示が、特定の保険会社又は特定の保険契約への恣意的な誘導とならないよう留意する必要があります。\n社内規則等には、例えば、顧客意向が不明確な場合の対応方法、例示する事項の考え方、追加確認の方法、記録・検証方法等を定め、保険募集人への教育・管理・指導を行うことが有効と考えられます。","theme":"意向がない場合","section":"監督指針","tags":["証跡・記録"]},{"no":278,"location":"－","comment":"販売方針に関して、高騰する保険料を背景に、顧客の主な関心が補償内容よりも保険料にあるケースが多い中、保険料の安い保険を求める意向が示された場合、全取扱保険会社の見積を提示する必要があるのか。\n顧客意向に基づき、例えば「現在契約中の保険会社」、「保険料が高い保険会社」、「保険料が安い保険会社」の3社に絞った提案を行い、意向把握の記録を残すことで足りるのではないか。全社見積は実務的・収支的に困難と考える。\nまた、日本の保険会社がよいといった顧客意向がある場合、より安価な外資系商品をあえて案内しないケースもあり得る点や、顧客意向の判断が社員ごとに曖昧になるケースがあるところ、意向把握の基準について考えを示されたい。\n165","pageStart":165,"pageEnd":166,"answer":"乗合代理店が比較推奨販売を行うに当たり、全ての案件について、全ての取扱保険会社の商品を網羅的に見積り・説明することを一律に求めるものではなく、代理店の規模・業務特性、募集形態、取扱商品、顧客の意向等を踏まえ、実効的な態勢を整備することが重要です。\n適切な意向把握の方法等については募集形態や顧客の属性等を踏まえて個別具体的に判断されるため、一律の基準を示すことは困難です。例えば、「日本の保険会社がよい」といった意思表示のみからは、商品特性や保険料水準等の適切な商品選択の機会の確保に資する事項に係る顧客の合理的な意向を十分に把握することは困難であると考えられます。\nそのため、当該意思表示がされたことを踏まえつつ、保障(補償)内容、保険料水準、特約等、顧客が重視し得る事項を確認するなど、可能な限り意向の形成を促し、又は意向の明確化に努めた上で、把握した顧客の意向に沿って、合理的かつ一定の具体性を有する基準や理由等に基づき、保険契約を選別し、提示・推奨することが重要です。\nなお、保険募集人や乗合代理店が、比較推奨販売の対象を狭める目的で顧客の意向を恣意的に誘導したり、手数料水準、販売目標、保険会社からの便宜供与等の代理店側の都合により、特定の保険会社又は特定の保険契約へ誘導することは適切ではありません。","theme":"意向がない場合","section":"監督指針","tags":["便宜供与","手数料・インセンティブ","比較推奨","意向把握","証跡・記録"]},{"no":279,"location":"Ⅱ－4－2－9(5)","comment":"顧客の意向が不明確な場合でも「顧客が特に重視すると考えられる事項を例示するなど」との記載があるが、以下の様な事項は恣意的な誘導ではなく、顧客意向を確認するための事項の例示として認められるか。\n1.損害保険協会の消費者アンケートの重視するものの上位項目(1)アフターフォローの体制(2)商品に付帯されるサービス(3)保険料水準(4)加入保険手続きの利便性(5)保険会社のイメージ(6)最新の保険の特徴2.上記(1)～(6)以外のアンケート項目も例示として認められるか(例)代理店における取扱い実績【理由】当該代理店における取扱い実績の多い保険会社・保険契約は、契約事務や保険金支払実務に精通しており、顧客に正確かつ迅速なサービス提供が可能であり、顧客にとってメリットがあると考えらえるため166","pageStart":166,"pageEnd":167,"answer":"Ⅱ－4－2－9(5)①B.(b)の「顧客が特に重視すると考えられる事項」を例示するにあたっては、顧客の適切な商品選択に資するよう、主として、商品特性や保険料水準等の事項を示すことにより、顧客の理解を得ながら、顧客の意向の形成を促進し、又は意向の明確化に努めることが求められます。\nまた、顧客の意向が不明確な場合において、顧客が特に重視すると考えられる事項を例示する手段としてアンケートを活用すること自体は否定されま
