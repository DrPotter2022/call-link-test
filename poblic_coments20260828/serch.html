すことができない項目の場合、どのようにすればよいか。","pageStart":65,"pageEnd":66,"answer":"「事故対応が良い保険会社」といった意向については、商品特性や保険料水準についての意向を確認するとともに顧客が重視する内容を具体化することが重要です。\n例えば、事故受付時間、ロードサービス、示談交渉サービスの有無、保険金支払手続、事故後のサポート内容等のうち合理的かつ一定の具体性を有する基準や理由等として説明可能であり、顧客の比較判断に資する事項について顧客の意向を確認し、各保険契約の内容等の商品特性や保険料水準とあわせて分かりやすく説明することが考えられます。\n推奨理由は必ずしも定量的データに限られませんが、保険募集人の主観的評価や属人的な事情を提案理由とすることは不適切と考えます。商品特性や保険料水準について説明するとともに、顧客の最善の利益を勘案したものとして、顧客の意向との関係で合理的かつ具体的に説明する必要があります。なお、合理的な理由が明確でない場合には、複数契約を提示し、比較説明又は追加の意向確認を行うことが適切です。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"保険業法施行規則","tags":["比較推奨","意向把握","顧客の最善の利益"]},{"no":87,"location":"第227条の2第3項第4号","comment":"損害保険において、個々の保険募集人においては、本当に「特定の損害保険会社の事務に精通」しており、他社の事務手続きは不慣れであるケースはあるように思われる。\nこの場合、従来であれば保険業法施行規則第227条の2第3項第4号ハ(以下、ハ方式とする)によって「特定の損害保険会社の事務に精通している」などと当該提案の理由を説明し、顧客が了承したならば、より事務に精通した保険会社の保険契約の提案が可能であったと解釈しているが、今回の改正でそのハ方式がなくなった。\nそこで、同号ロ(以下、ロ方式とする)に従って、顧客意66向に沿って比較推奨販売を行うが、例えば保険会社A～C、を比較可能な同種の保険契約として提示・推奨し、当該提案の理由を説明した後で、「ご提案はさせて頂きましたが、実は保険会社B、C社については事務手続きにあまり精通しておらず、保険会社Aの保険契約の方が、事故が起きた際により迅速な対応が可能です。勿論、B、C社の保険契約をお選び頂いても構いません。」などと説明を加え、顧客側も、「担当者が事務手続きに精通している保険会社の方が、何かあった時に安心出来る」として、顧客が保険会社Aを選んだ場合、保険会社B、Cにおいても、提示・推奨はしている事から、上記のような商談の流れは一般論として法令上問題はないと考えてよいか。","pageStart":66,"pageEnd":67,"answer":"貴見のケースにおいて想定されている場面が必ずしも明確ではありませんが、顧客の意向に沿って複数の保険契約を提案した後であっても、「保険募集人が特定の保険会社の事務手続に精通している」ことを理由に、特定の保険契約を実質的に提案することは適切ではありません。\n保険募集人の事務習熟度は、基本的には代理店の業務都合・属人的事情であり、それを理由として特定の保険会社又は特定の保険契約へ誘導し得る運用を行うことは、比較推奨販売規制の趣旨に照らし問題となり得ます。\n顧客が事故時対応等を重視する場合には、商品特性について説明するとともに、事故受付体制や保険金支払手続等、顧客の比較判断に資する事項に即して、合理的かつ具体的に説明する必要があります。\nまた、形式的にB社・C社の保険契約を提示していても、その後の説明により、実質的にA社へ誘導している場合には、適切な推奨販売とは評価されず、問題となります。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"保険業法施行規則","tags":["比較推奨","ハ方式"]},{"no":88,"location":"－","comment":"乗り合っている保険会社が多数ある中で、顧客に事前アンケートを実施し、ご意向や説明を希望する保険会社をチェック・記入していただき、意向内容と希望保険会社により提案範囲を絞り込んだ上で、偏りのない説明を開始するフローを検討しているが問題ないか。\n67","pageStart":67,"pageEnd":68,"answer":"事前アンケートを活用し、顧客の意向や説明を希望する保険会社を確認すること自体は否定されませんが、アンケートの設問・選択肢・導線等によって、顧客の意向が特定の保険会社又は特定の保険契約へ誘導されることのないよう留意する必要があります。\nまた、アンケートを活用する場合、顧客の意向が重要であることを前提に、顧客が自らのリスクや保険ニーズを適切に認識し、意向を表明できるよう設計される必要があるところ、商品特性や保険料水準といった保険商品に関する事項を含めるとともに、それらが合理的かつ一定の具体性を有する基準や理由等として説明可能であり、他の商品選択肢を不当に排除しないものであることが適切と考えます。\nなお、事前アンケートを活用する場合であっても、各保険募集人においては、形式的・画一的なヒアリングにとどまらず、顧客の具体的な意向、理解度、属性、リスク状況等を踏まえ、必要に応じて追加確認を行うなど適切に意向把握する必要があります。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"保険業法施行規則","tags":["意向把握"]},{"no":89,"location":"－","comment":"自動車保険等、商品間の差異が比較的小さい分野において、僅かな違いを詳細に比較・説明することは、代理店及び顧客双方にとって負担となり、必ずしも有益とは言えない場合がある。\n商品特性に応じた柔軟な対応を認める運用とすることを希望する。","pageStart":68,"pageEnd":68,"answer":"比較推奨販売において求められる基本的な情報提供の内容は、商品分野によって異なるものではありません。\nただし、常に全ての商品差異を網羅的・詳細に説明することを一律に求めるものではなく、顧客の意向、商品特性等を踏まえ、顧客の適切な商品選択に資する重要な事項を分かりやすく説明することが重要です。\nなお、商品差異が小さいことを理由に、手数料水準、販売目標、取引関係、事務都合等の代理店の都合により特定の保険会社又は特定の保険契約へ誘導することは適切ではありません。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"保険業法施行規則","tags":["手数料・インセンティブ","比較推奨"]},{"no":90,"location":"－","comment":"比較推奨販売において、提示・推奨する基準や理由を社内規則等に定めるにあたり、意向を踏まえて商品を絞り込むプロセスは、顧客からヒアリングできる意向等が一様ではなく、以下のとおり一定部分境界線が曖昧な判断とならざるを得ないと考えている。\n法人も含め、顧客ごとに知識・経験・資産状況・目的・環境等も区々であるため、営業社員ごとのコンサルティング経験や感覚等の違い等を生かし、提示する保険契約が一様ではない可能性もある。ただし、当然、手数料の多寡等代理店都合は判断基準としない。\nパソコン等でのデジタル画一的な選択肢により商品を絞り込む手法は、個人保険には有効な部分もあるが、必ずしも法人保険も含めた顧客へのきめ細かな対応とは言えないと考えている。\n68","pageStart":68,"pageEnd":69,"answer":"Ⅱ－4－2－9(5)②ア.に定める社内規則等の具体的内容は、乗合代理店の規模・業務特性、取扱商品、募集形態、顧客属性等を踏まえ、各乗合代理店において適切に定めるものと考えられます。\n比較推奨販売においては、顧客の知識・経験、資産状況、加入目的、事業内容、リスク状況等が異なり得るため、同一の社内規則等に基づく判断枠組みの下でも、顧客ごとに提示・推奨する保険契約が異なることはあり得ます。\n一方で、募集人ごとの経験や感覚のみによる属人的・恣意的な商品選別は適切ではありません。社内規則等には、例えば、顧客意向の把握方法、顧客が重視する事項の確認方法、提示・推奨する基準や理由、顧客への説明方法、記録・検証方法等を定めることが考えられ、募集人への教育・管理・指導を徹底し、組織として一貫性のある運用を確保することが重要です。\nまた、デジタルツール等の活用は否定されませんが、顧客の意向や属性等に応じた意向把握や情報提供が適切に行われるよう留意する必要があります。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"保険業法施行規則","tags":["手数料・インセンティブ","比較推奨","意向把握","証跡・記録"]},{"no":91,"location":"－","comment":"保険業法施行規則第227条の2第3項第4号ハ(代理店独自の推奨理由)を一律に廃止することは、乗合代理店の経営の自由度や自主性を損なうおそれがあり、地域特性や顧客ニーズを踏まえた柔軟な提案を困難にする可能性がある。\n乗合代理店独自の推奨理由についても一定程度尊重しつつ、顧客に対して十分な説明を行った上で、同意・了解を得る前提での運用が、顧客本位の観点からも望ましいと考える。","pageStart":69,"pageEnd":69,"answer":"貴重なご意見として承ります。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"保険業法施行規則","tags":["ハ方式"]},{"no":92,"location":"－","comment":"顧客の意向を確認した結果に対応する複数損害保険の保険契約の提案において、そもそも保険契約に明確な差異がない場合に、合理的かつ一定の具体性を有する基準や理由等をつけることは難しいと考える。\nまた現実的に自動車の販売の流れの中の限られた時間で十分な説明を行うことは難しく、顧客も提示された複数保険契約から選ぶことが出来ずに困る状況も想定される。\nこのようなケースを考慮し、特定の保険契約を推奨する場合においては「保険契約の比較を希望された場合」又は「意向に対して顕著な差異が見られる場合」の運用とすることとされたい。","pageStart":69,"pageEnd":69,"answer":"貴重なご意見として承ります。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"保険業法施行規則","tags":[]},{"no":93,"location":"－","comment":"乗合代理店のため保険業務に従事している人員が限られている中、取扱保険会社全社の見積書を作成することは負担が大きい。\nまた、大型車の自動車保険を多く扱う当社はネット損保69で契約できない車種であることもあり、保険料や商品内容ではなく「代理店」を選択して「代理店」と契約している気持ちが強く、複数社の大差がない保険契約を長々と比較説明する必要性がないと感じる。","pageStart":69,"pageEnd":70,"answer":"貴重なご意見として承ります。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"保険業法施行規則","tags":["比較推奨"]},{"no":94,"location":"－","comment":"自動車保険は生命保険と異なり、車両を保有する方が、自動車保険に加入するニーズが顕在化している。\nまた、各保険会社の自動車保険は特約等に一定の差異はあるものの、根幹をなす基本補償は、ほぼ一律となっている。\n一方で、保険料・特約・補償内容等の細かな改定が頻繁に行われるため、すべての取扱保険会社の商品を常に詳細まで把握し、網羅的に比較説明することは高度な知識・経験を要する。\n細部の特約等の比較に過度な時間を要することで、基本補償等の重要な説明が十分に行えなくなる、いわゆる「木を見て森を見ず」の状態とならないよう、実務に即した、より簡便で実効性のある比較推奨の在り方を要望する。","pageStart":70,"pageEnd":70,"answer":"貴重なご意見として承ります。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"保険業法施行規則","tags":["比較推奨"]},{"no":95,"location":"第227条の2第3項第4号","comment":"保険業法施行規則第227条の2第3項第4号ロは、保険契約の変更の場合にも適用されるのか。\n適用されるとしても、そのような場合にも「意向に沿った絞込み」をする必要はない、あるいは、顧客の推定される「意向」から既契約に絞り込まれているという理解でよいか。\nまた、そのような場合に、「保険契約の概要」として情報提供しなければならないものは何か。\n70","pageStart":70,"pageEnd":71,"answer":"既契約の満期到来に伴う保険募集を行う場合であっても、保険募集人は、顧客が適切な理解に基づき、自主的に既契約の継続の要否や内容を判断できるよう、顧客のリスク特性や意向が変化している可能性にも留意しつつ、既契約の内容・特性等に応じて、顧客の意向を適切に把握し、当該意向に沿った提案・説明を行う必要があります。\nその上で、既契約の満期に伴う保険募集を行う場合における保険業法施行規則第227条の2第3項第4号ロ(推奨販売)に係る対応の要否は、「二以上の比較可能な同種の保険契約」が存在するか、保険契約を選別・提案するものであるかどうかによって個別具体的に判断される必要があります。\nなお、保険募集人による選別・提案が実質的に伴うことなく、顧客の主体的な判断のみにより、既契約と同内容又はこれと大きく異ならない内容の保険契約を希望する旨が表明され、一の保険契約が選択された場合には、直ちに同号ロに係る対応が必要となるものではありません。\nただし、当該判断が顧客の主体的判断に基づくものか、又は保険募集人による恣意的な誘導が行われていないかは、個別具体的に判断されます。一方、同号ロが適用される場合において、変更手続の過程で、「二以上の比較可能な同種の保険契約」の中から保険募集人が顧客の意向に沿って保険契約を選別し、提示・推奨する場合には、当該保険契約の概要及び提示・推奨理由等を説明する必要があります。\n推奨販売を行う場合の「保険契約の概要」としては、顧客の意向に沿って絞り込んだ保険契約の概要を説明することが考えられます。","theme":"情報提供","section":"保険業法施行規則","tags":[]},{"no":96,"location":"－","comment":"顧客の意向を類推し、例えばサイバーリスク等の保険提案の情報提供を行うような場合には、まず保険料水準や補償全体像を示すうえで取扱各社の保険内容をすべて例示することは、顧客の負担感もあると承知している。そのような場合には、顧客になぜその商品を明示したのか証跡を残したうえで提案できることとし、その上で顧客に加入の意思がある場合には、顧客の意向に沿った保険契約を提案71することは可能との理解でよいか。","pageStart":71,"pageEnd":72,"answer":"貴見のケースは、顧客の意向を推定したうえで、特定の保険契約を提案するケースと考えられますが、Ⅱ－4－2－2(3)①ア.(注2)\nで定める意向推定の方法を用いながら、特定の保険契約の選別・推奨をあらかじめ企図し、顧客の意向を恣意的に形成又は解釈するなどの行為により、実質的に従前の保険業法施行規則第227条の2第3項第4号ハと同様の運用を行う場合には、比較推奨販売規制の潜脱に該当し得るため留意する必要があります。\nなお、意向推定の方法は、例えば、保険会社の営業職員が、第一分野又は第三分野の保険契約について、当初は潜在化している顧客の意向を顧客属性や生活環境等に基づき推定した上で、対面で顧客と双方向的なやり取りを通じて意向を説明・明確化しつつ、その変化にも対応する保険募集の場面に用いられることを想定したものです。\nしたがって、Ⅱ－4－2－2(3)①ア.(注2)で定める意向推定の趣旨を踏まえつつ、意向推定が合理性・妥当性を有するか否か、個別具体的に判断するとともに、当該推定が顧客の意向に合致しているかを確認する必要があります。\n仮に適切に顧客の意向を把握した場合、特定の保険契約を提示・推奨するときには、同号ロ及びⅡ－4－2－9(5)①B.に基づいて、当該保険契約の概要及び当該提示・推奨する基準や理由等について、また、顧客の求めに応じて契約内容について適切に説明するとともに、かかる比較推奨販売の適切性について、同法施行規則第227条の14及びⅡ－4－2－9(5)②に基づいて、態勢を整備する必要があります。","theme":"情報提供","section":"保険業法施行規則","tags":["比較推奨","ハ方式","証跡・記録"]},{"no":97,"location":"第227条の2第3項第4号","comment":"「「平成26年改正保険業法(2年以内施行)に係る政府令・監督指針案」に対するパブリックコメント結果等について」における「コメントの概要及びコメントに対する金融庁の考え方」No.83及び84において、「保険契約の概要」とは、「顧客が保険商品を絞り込むための契機となる情報であり、基本的には、保険商品のパンフレットの商品概要に記載している内容を提示することが想定」される旨の回答があるが、改正後の保険業法施行規則第227条の2第3項第472号ロにおける「保険契約の概要」においても考え方の変更は無いという理解でよいか。","pageStart":72,"pageEnd":73,"answer":"保険業法施行規則第227条の2第3項第4号ロにおける「保険契約の概要」については、今般の改正により従前の考え方を変更するものではありません。\n「保険契約の概要」とは、顧客が保険商品を絞り込むための契機となる情報であり、基本的には、保険商品のパンフレットの商品概要に記載される内容を提示することが想定されます。\nただし、具体的に、どの資料・記載内容をもって概要説明として十分かは、顧客の意向、商品特性、募集形態等を踏まえ、個別具体的に判断されます。\nなお、単に商品名や引受保険会社名のみを一覧で示すだけでは、通常、十分とはいえない点に留意が必要です。","theme":"情報提供","section":"保険業法施行規則","tags":[]},{"no":98,"location":"第227条の2第3項第4号","comment":"保険業法施行規則第227条の2第3項第4号ロの「概要」とは、平成26年法改正時に実務上整理された「一覧表」(保険商品のパンフレットの商品概要に記載している内容の提示)という理解は維持してよいか(「「平成26年改正保険業法(2年以内施行)に係る政府令・監督指針案」に対するパブリックコメント結果等について」における「コメントの概要及びコメントに対する金融庁の考え方」No.82参照)。","pageStart":73,"pageEnd":73,"answer":"保険業法施行規則第227条の2第3項第4号ロにおける「保険契約の概要」については、今般の改正により従前の考え方を変更するものではありません。\n「保険契約の概要」とは、顧客が保険商品を絞り込むための契機となる情報であり、基本的には、保険商品のパンフレットの商品概要に記載される内容を提示することが想定されます。\nただし、具体的に、どの資料・記載内容をもって概要説明として十分かは、顧客の意向、商品特性、募集形態等を踏まえ、個別具体的に判断されます。\nなお、単に商品名や引受保険会社名のみを一覧で示すだけでは、通常、十分とはいえない点に留意が必要です。","theme":"情報提供","section":"保険業法施行規則","tags":[]},{"no":99,"location":"－","comment":"ディーラー社員は、基本的な自動車保険に関する知識は有してはいるものの、専業の保険代理店のように、乗合保険会社すべての商品内容や頻繁な改定内容までを網羅的に把握することは容易ではない。そのため、比較推奨販売を行うに当たっては、基本補償や主要な特約等を中心とした一覧表の提示など、簡便で分かりやすい方法により説明を行うことが、顧客の理解・納得を得る上でも有効であると考えるがいかがか。\n73","pageStart":73,"pageEnd":73,"answer":"貴重なご意見として承ります。\n比較推奨販売において、全ての案件において、乗合保険会社全社の商品内容や改定内容を網羅的・詳細に説明することを一律に求めるものではありません。\n顧客の意向、商品特性、募集形態等を踏まえ、基本保障(補償)、主要な特約、保険料水準、免責等、顧客の判断に重要な事項を分かりやすく説明することが重要です。\nそのため、基本保障(補償)や主要な特約等を整理した一覧表等を活用することも考えられます。ただし、比較の前提、対象範囲、保障(補償)内容や保険料水準の差異等について、顧客に誤認を与えないよう留意する必要があります。\nまた、代理店の規模・業務特性等に応じ、実効的な態勢を整備することが重要ですが、募集人の知識不足や業務負担を理由に、顧客の意向に沿わない商品選別や特定の保険会社への誘導を行うことは内容や態様等によっては、保険業法第300条第1項第1号及び第6号に抵触するおそれがあります。","theme":"情報提供","section":"保険業法施行規則","tags":["比較推奨"]},{"no":100,"location":"－","comment":"各社の保険商品そのものに大きな差異がない中で比較推奨販売を厳格化することで、保険会社間の過度な商品競争や価格競争を引き起こすことにならないか懸念している。差別化のために商品が複雑になればその説明も難しくなり、結果的に顧客を置き去りにすることにならないか。","pageStart":74,"pageEnd":74,"answer":"貴重なご意見として承ります。\n今般の保険業法施行規則及び監督指針改正は、乗合代理店における比較推奨販売について、代理店側の都合や保険会社との関係により、顧客の意向に沿わない保険契約が選別され、提示・推奨が行われることを防止し、顧客の適切な商品選択の機会を確保することを目的とするものです。\n今後は、保険業界においては、顧客本位の業務運営を損なわず、商品内容等に基づく健全な競争が行われるよう留意する必要があります。","theme":"情報提供","section":"保険業法施行規則","tags":["比較推奨"]},{"no":101,"location":"第227条の2第3項第4号","comment":"保険業法施行規則第227条の2第3項第4号ロ(以下、ロ方式とする。)の一般的な考え方については、改正府令の条文に反しない限り「「平成26年改正保険業法(2年以内施行)に係る政府令・監督指針案」に対するパブリックコメント結果等について」における「コメントの概要及びコメントに対する金融庁の考え方」No.195を継承しているという理解でよいか。\n例えば、共同募集を行う場合には、両募集人が共通して取り扱う保険契約のみ取り扱うことができると理解している(同パブリックコメントNo.195参照)。乗合代理店は、社内規則により共同募集のみを行う取扱保険契約をあらかじめ絞り込まない限り、実態上取り扱うことができない保険契約であっても情報提供義務の規制がかかり、提案の理由を説明しなければならないという理解でよいか。\nまた、顧客の意向に沿って保険契約を選別し、提示・推奨する保険契約の概要を説明する場合において、「顧客の74意向に沿った絞り込みではなく、共同募集では取り扱うことができない保険契約」についても概要を説明する必要があるのか。\n「社内規則」とは、社内の「規則」類を制定するにあたり、所要の決定手続きを経ていないマニュアル類や当該部署限りでの決定も含まれると理解してよいか。\nロ方式において情報提供すべき「顧客の意向に沿って選別」した保険契約の概要とは、「顧客の意思に適合する形で選別がなされている限り、さらなる選別は許容される」\nという趣旨の理解でよいか。","pageStart":74,"pageEnd":75,"answer":"本改正は、「「平成26年改正保険業法(2年以内施行)に係る政府令・監督指針案」に対するパブリックコメント結果等について」における「コメントの概要及びコメントに対する金融庁の考え方」\nNo.195(4)の解釈を変えるものではありません。\n当該パブリックコメントにおいて示された「金融庁の考え方」\nは、把握した顧客の具体的な意向を踏まえ、共同募集により取り扱う保険契約が選定されたことを前提として、当該共同募集において取り扱うことのできる保険契約は、両代理店において共通して取り扱われる契約に限られることを明らかにしたものであり、比較推奨販売の対象を一律に共同募集に係る保険契約に限定することまでを許容する趣旨ではありません。\nしたがって、共同募集であることや、手数料配分・業務分担等の代理店側の事情を理由として、顧客の意向に先立ち比較推奨販売の対象を共通取扱商品に限定することは適切ではありません。\n比較推奨販売においては、各乗合代理店が取り扱う保険契約の範囲、顧客の意向等を踏まえ、顧客の意向に沿って適切に選別し、提示・推奨を行う必要があります。\n共同募集の枠組みでは取り扱えない保険契約であっても、顧客の意向に照らし重要な選択肢となり得る場合には、その旨を踏まえ、必要に応じて単独募集への切替え、取扱可能な保険募集人への引継ぎ等により、顧客の適切な商品選択の機会を阻害しないように対応することが求められます。\nまた、代理店委託契約上取り扱うこととされている保険契約について、代理店が社内規則等のみで比較推奨販売の対象外とすることは適切ではありません。取扱範囲を限定する場合には、所属保険会社等との代理店委託契約又はこれに基づく覚書等により明確化されている必要があります。なお、社内規則等には、代理店全体として組織的に策定された社内規則やこれに準じるマニュアル類等が含まれ得ますが、一部署限りの決定のみでは足りません。\n把握した顧客の具体的な意向を踏まえて、当該意向に適合する範囲で保険募集人が合理的な絞り込みを行うことは妨げられないものの、保険業法施行規則第227条の2第3項第4号ハの廃止に伴い、顧客の意向に沿わない保険契約の選別は許容されません。","theme":"共同募集","section":"保険業法施行規則","tags":["手数料・インセンティブ","比較推奨","ハ方式","共同募集"]},{"no":102,"location":"－","comment":"監督指針Ⅱ－4－2－9(5)①B.(a)において、「乗合代理店が二以上の比較可能な同種の保険契約の中から顧客の意向に沿って保険契約を選別し、一又は二以上の保険契約を提示・推奨する場合には、当該提示・推奨する保険契約の概要及び顧客の求めに応じて契約内容並びに当該提示・推奨する基準や理由等を説明しているか。特に、顧客の意向に沿って選別した保険契約の中から、商品特性等により、特定の保険契約を推奨する場合には、顧客の最善の利益を75勘案したものとして、保険募集人や乗合代理店の都合によることなく、合理的かつ一定の具体性を有する基準や理由等を説明しているか。」と記載がある。\n今後、他の生命保険取扱代理店と共同募集を実施するにあたり、両社で手数料を按分する都合上、顧客意向を満たし、かつ、両社が乗り合っている保険会社の中から推奨商品を選定する予定である。(当社のみ乗り合っている保険会社の商品は案内しない)\nこの取り扱いは「保険募集人や乗合代理店の都合によることなく」に抵触しない、という理解でよいか。\n他代理店が担当する当初の意向把握時点において、当該募集が共同募集であること、対象保険会社が決められていることは開示する予定である。","pageStart":75,"pageEnd":76,"answer":"前提として、共同募集の方法に関する意向だけでなく、保障(補償)内容、保険料水準等について、顧客が自らのリスクや保険ニーズを適切に認識できるよう、具体的な意向を適切に把握する必要があります。\nその上で、当該顧客の意向が、共同募集により取り扱う特定の保険契約に係るものであることが明確である場合には、その意向に沿った対応が考えられます。\nしたがって、顧客の意向を適切に把握することなく、手数料按分等といった代理店側の都合であらかじめ保険会社を絞り込んでいる場合、保険募集人や乗合代理店の都合による保険契約の選別となるおそれがあります。\nなお、顧客の意向を把握する際に、共同募集であることを理由に、比較・選別対象となる保険会社が決められていることを、あらかじめ顧客に開示することは、恣意的な特定の保険契約への誘導に該当するおそれがあり、問題となり得ます。","theme":"共同募集","section":"保険業法施行規則","tags":["手数料・インセンティブ","意向把握","顧客の最善の利益","共同募集"]},{"no":103,"location":"第227条の2第3項第4号","comment":"保険業法施行規則第227条の2第3項第4号ロについて、いわゆる「共同募集」については、各共同募集人が取り扱うことができる共通の保険契約だけが、「当該二以上の所属保険会社等を有する保険募集人が取り扱う保険契約」であることを確認したい。\n76","pageStart":76,"pageEnd":77,"answer":"共同募集の場合であっても、比較推奨販売に係る規定の適用は、各保険募集人の顧客の意向形成への関与の度合い、顧客への説明・提案の実態等を踏まえて個別具体的に判断されます。\n比較推奨販売を行う乗合代理店において、自ら取り扱う「二以上の比較可能な同種の保険契約」が存在する場合には、これらを前提として、顧客の意向に沿って適切に保険契約を選別し、提示・推奨を行う必要があります。\nしたがって、共同募集に関与する他の代理店が取り扱っていないことのみを理由に、当該保険契約を比較推奨販売の対象外とすることは、顧客の適切な商品選択の機会を実質的に阻害するため、適切とはいえません。\nまた、共同募集の枠組みを用いて比較推奨販売に係る規制を潜脱し得る運用を行うことは、問題となり得ます。","theme":"共同募集","section":"保険業法施行規則","tags":["比較推奨","共同募集"]},{"no":104,"location":"－","comment":"他保険代理店との共同募集(当社は事務のみ)のために代理店委託契約を締結し、顧客に対する直接の募集業務を実施していない保険会社が複数社存在している。当該保険会社と代理店委託契約は締結しているものの、当社としては単独で取り扱う方針ではないため、比較推奨の対象外としたい。\nこのため、以下の方法の可否を検討している。\na.一部保険会社との代理店委託契約を解約する。\nb.保険会社ごとに対応が可能であれば、代理店委託契約により取扱商品・種目・チャネル等を限定する旨の覚書を締結する。\nc.当該代理店と役割分担を明確にした協定を締結し、保険会社に承認してもらうことで取扱範囲を絞る。\nd.グループ会社として別代理店を設立し、共同募集は当該会社へ移管し、当社においては不要な代理店委託契約を解約する。","pageStart":77,"pageEnd":77,"answer":"比較推奨販売を行う乗合代理店においては、保険会社から委託を受け、実際に取り扱うことが可能な保険契約の中に、「二以上の比較可能な同種の保険契約」が存在する場合には、これらを前提として、顧客の意向に沿って適切に保険契約を選別し、提示・推奨を行う必要があります。\nしたがって、代理店委託契約上取り扱うことが可能な保険契約については、共同募集において自社が事務のみを担うことや、単独募集で取り扱う方針がないことを理由に、直ちに比較推奨販売の対象外とすることは適切とはいえません。\n一方で、保険会社との代理店委託契約又はこれに基づく覚書等により、取扱商品・種目等が明確に限定され、当該代理店が実際に取り扱うことができない保険契約については、比較推奨販売の対象とはなりません。\nただし、比較推奨販売規制を潜脱し、又は顧客の適切な商品選択の機会を実質的に阻害する目的・態様で行われる場合には問題となります。","theme":"共同募集","section":"保険業法施行規則","tags":["比較推奨","共同募集"]},{"no":105,"location":"－","comment":"2以上の保険代理店間で共同募集を行う場合、それぞれの委託元保険会社が異なるケースでは、いずれとも委託契約がある保険会社のみを比較推奨する必要があるため、提案する保険会社を絞り込めるとの理解でよいか。\n77","pageStart":77,"pageEnd":78,"answer":"共同募集の場合であっても、比較推奨販売に係る規定の適用は、各保険募集人の顧客の意向形成への関与の度合い、顧客への説明・提案の実態等を踏まえて個別具体的かつ実質的に判断されます。\n比較推奨販売を行う乗合代理店において、自ら取り扱う「二以上の比較可能な同種の保険契約」が存在する場合には、これらを前提として、顧客の意向に沿った適切な選別・提案を行う必要があります。\nしたがって、共同募集に関与する他の保険代理店が取り扱っていないことのみを理由に、当該保険契約を比較推奨の対象外とすることは、顧客の適切な商品選択の機会を実質的に阻害するため、適切とはいえません。\nまた、共同募集の枠組みを用いて比較推奨販売に係る規制を潜脱し得る運用を行うことは、問題となり得ます。","theme":"共同募集","section":"保険業法施行規則","tags":["比較推奨","共同募集"]},{"no":106,"location":"－","comment":"乗合代理店であるが、共同募集している非幹事代理店が専属代理店の場合に、幹事代理店である当社には権限明示で取扱保険会社等についてどこまで求められるのか。\nまた、商工3団体会員向け契約の共同募集の場合は、当社が幹事代理店であるが、非幹事代理店の取引保険会社等の内容をどこまで顧客に伝えることが求められるのか。","pageStart":78,"pageEnd":78,"answer":"共同募集であっても、保険募集を行う各保険代理店は、それぞれ保険業法第294条第3項に基づき、あらかじめ所属保険会社等の商号等を顧客に明らかにする必要があります。これは、非幹事代理店が専属代理店である場合も同様です。幹事代理店であることのみをもって、非幹事代理店が行うべき権限明示まで当然に代替できるものではありません。\nまた、共同募集により取り扱う保険契約の範囲については、各代理店の顧客の意向形成への関与の度合い、顧客への説明・提案の実態等を踏まえ、個別具体的かつ実質的に判断する必要があります。\n貴見の想定している場面が必ずしも明確ではありませんが、共同募集の実態や役割分担に応じ、顧客に誤認を与えない方法で、各代理店の役割分担を分かりやすく説明することが重要と考えます。","theme":"共同募集","section":"保険業法施行規則","tags":["共同募集"]},{"no":107,"location":"－","comment":"自動車保険継続時は、顧客が現在加入中の保険契約(保険会社)で継続希望した場合も他の取扱い保険契約(保険会社)の案内を行う必要があるとすると、顧客の負担になるため柔軟な対応の運用が望ましいと考える。本件に関する正しい対応方法について見解をご教示いただきたい。","pageStart":78,"pageEnd":78,"answer":"既契約の満期到来時においても、保険募集人は、顧客が適切な理解に基づき、自主的に既契約の継続の要否や内容を判断できるよう、顧客のリスク特性や意向が変化している可能性にも留意しつつ、既契約の内容・特性等に応じて、顧客の意向を適切に把握し、当該意向に沿った提案・説明を行う必要があります。\nまた、既契約の満期が到来する場合において、顧客から具体的な意向が示されていない中、乗合代理店が行う案内(保険募集)が既契約と同条件又は同等の補償条件であることのみをもって、当然に比較推奨販売に係る規定の適用対象外となるものではありません。保険業法施行規則第227条の2第3項第4号ロ(推奨販売)に係る対応の要否は、「二以上の比較可能な同種の保険契約」が存在するか、保険契約を選別・提案するものであるかどうかによって個別具体的に判断される必要があります。\nその上で、短期の損害保険契約については、その特性を踏まえると、当該契約の満期が到来することに伴い、乗合代理店において、既契約と同条件又は補償内容がほぼ変わらないプランの案内(保険募集)が行われたとしても、直ちに保険契約者等の保護に欠けるものとは言えず、一概に否定されるものではないと考えます。ただし、その場合であっても、他の保険契約の提案を望む顧客も存在すると考えられることから、乗合代理店として意向把握・確認義務を適切に履行するための対応として、顧客の希望に応じて他の保険契約を提案できることを明示すること、及び顧客のリスク状況や意向を適切に把握できるよう工夫して案内(保険募集)することが求められるものと考えます。\nさらに、保険募集人による選別・提案が実質的に伴うことなく、顧客の主体的な判断のみにより、既契約と同内容又はこれと大きく異ならない内容の保険契約を希望する旨が表明され、一の保険契約が選択された場合には、直ちに同号ロ(推奨販売)に係る対応が必要となるものではありません。\nただし、募集過程において、他の保険契約との比較説明を行う場合には同号イを、「二以上の比較可能な同種の保険契約」の中から保険契約を選別・提案する場合には同号ロを踏まえた対応が必要となります。\nまた、顧客が表明した意向、保険募集人が案内・説明した内容等については、事後的に確認・検証できるよう、適切に記録・保存することが重要です。","theme":"更改・継続契約","section":"保険業法施行規則","tags":["比較推奨","意向把握","証跡・記録"]},{"no":108,"location":"－","comment":"継続手続きの場合に顧客から「前回と同じ保険会社で良い」との申出があった場合(前回契約時は保険業法施行規78則第227条の2第3項第4号ハによる代理店独自の推奨理由により商品推奨)は、この点を顧客意向と捉えて取扱い他社損保との商品比較は不要として良いのか。","pageStart":78,"pageEnd":79,"answer":"既契約の満期到来時においても、保険募集人は、顧客が適切な理解に基づき、自主的に既契約の継続の要否や内容を判断できるよう、顧客のリスク特性や意向が変化している可能性にも留意しつつ、既契約の内容・特性等に応じて、顧客の意向を適切に把握し、当該意向に沿った提案・説明を行う必要があります。\nまた、既契約の満期が到来する場合において、顧客から具体的な意向が示されていない中、乗合代理店が行う案内(保険募集)が既契約と同条件又は同等の補償条件であることのみをもって、当然に比較推奨販売に係る規定の適用対象外となるものではありません。保険業法施行規則第227条の2第3項第4号ロ(推奨販売)に係る対応の要否は、「二以上の比較可能な同種の保険契約」が存在するか、保険契約を選別・提案するものであるかどうかによって個別具体的に判断される必要があります。\nその上で、短期の損害保険契約については、その特性を踏まえると、当該契約の満期が到来することに伴い、乗合代理店において、既契約と同条件又は補償内容がほぼ変わらないプランの案内(保険募集)が行われたとしても、直ちに保険契約者等の保護に欠けるものとは言えず、一概に否定されるものではないと考えます。ただし、その場合であっても、他の保険契約の提案を望む顧客も存在すると考えられることから、乗合代理店として意向把握・確認義務を適切に履行するための対応として、顧客の希望に応じて他の保険契約を提案できることを明示すること、及び顧客のリスク状況や意向を適切に把握できるよう工夫して案内(保険募集)することが求められるものと考えます。\nさらに、保険募集人による選別・提案が実質的に伴うことなく、顧客の主体的な判断のみにより、既契約と同内容又はこれと大きく異ならない内容の保険契約を希望する旨が表明され、一の保険契約が選択された場合には、直ちに同号ロ(推奨販売)に係る対応が必要となるものではありません。\nただし、募集過程において、他の保険契約との比較説明を行う場合には同号イを、「二以上の比較可能な同種の保険契約」の中から保険契約を選別・提案する場合には同号ロを踏まえた対応が必要となります。\nまた、顧客が表明した意向、保険募集人が案内・説明した内容等については、事後的に確認・検証できるよう、適切に記録・保存することが重要です。","theme":"更改・継続契約","section":"保険業法施行規則","tags":["比較推奨","ハ方式","意向把握","証跡・記録"]},{"no":109,"location":"－","comment":"乗合代理店の比較推奨販売における保険募集人の体制整備義務について、顧客が明確に現在契約している保険会社での継続を希望された場合、比較推奨販売は実施しなくてよいか。","pageStart":79,"pageEnd":79,"answer":"既契約の満期到来時においても、保険募集人は、顧客が適切な理解に基づき、自主的に既契約の継続の要否や内容を判断できるよう、顧客のリスク特性や意向が変化している可能性にも留意しつつ、既契約の内容・特性等に応じて、顧客の意向を適切に把握し、当該意向に沿った提案・説明を行う必要があります。\nまた、既契約の満期が到来する場合において、顧客から具体的な意向が示されていない中、乗合代理店が行う案内(保険募集)が既契約と同条件又は同等の補償条件であることのみをもって、当然に比較推奨販売に係る規定の適用対象外となるものではありません。保険業法施行規則第227条の2第3項第4号ロ(推奨販売)に係る対応の要否は、「二以上の比較可能な同種の保険契約」が存在するか、保険契約を選別・提案するものであるかどうかによって個別具体的に判断される必要があります。\nその上で、短期の損害保険契約については、その特性を踏まえると、当該契約の満期が到来することに伴い、乗合代理店において、既契約と同条件又は補償内容がほぼ変わらないプランの案内(保険募集)が行われたとしても、直ちに保険契約者等の保護に欠けるものとは言えず、一概に否定されるものではないと考えます。ただし、その場合であっても、他の保険契約の提案を望む顧客も存在すると考えられることから、乗合代理店として意向把握・確認義務を適切に履行するための対応として、顧客の希望に応じて他の保険契約を提案できることを明示すること、及び顧客のリスク状況や意向を適切に把握できるよう工夫して案内(保険募集)することが求められるものと考えます。\nさらに、保険募集人による選別・提案が実質的に伴うことなく、顧客の主体的な判断のみにより、既契約と同内容又はこれと大きく異ならない内容の保険契約を希望する旨が表明され、一の保険契約が選択された場合には、直ちに同号ロ(推奨販売)に係る対応が必要となるものではありません。\nただし、募集過程において、他の保険契約との比較説明を行う場合には同号イを、「二以上の比較可能な同種の保険契約」の中から保険契約を選別・提案する場合には同号ロを踏まえた対応が必要となります。\nまた、顧客が表明した意向、保険募集人が案内・説明した内容等については、事後的に確認・検証できるよう、適切に記録・保存することが重要です。","theme":"更改・継続契約","section":"保険業法施行規則","tags":["比較推奨","意向把握","証跡・記録"]},{"no":110,"location":"－","comment":"契約の更新時における比較推奨販売について、契約時に意向確認を行っている、かつ、契約期間中に商品改定等補償や保険料に大きな変化がない状況で契約者が現在契約している保険会社にて更新を希望する場合は、比較推奨販売は不要と理解してよいか。また、その際の顧客の意向確認の証跡はどの程度残すべきか。\n79","pageStart":79,"pageEnd":80,"answer":"既契約の満期到来時においても、保険募集人は、顧客が適切な理解に基づき、自主的に既契約の継続の要否や内容を判断できるよう、顧客のリスク特性や意向が変化している可能性にも留意しつつ、既契約の内容・特性等に応じて、顧客の意向を適切に把握し、当該意向に沿った提案・説明を行う必要があります。\nまた、既契約の満期が到来する場合において、顧客から具体的な意向が示されていない中、乗合代理店が行う案内(保険募集)が既契約と同条件又は同等の補償条件であることのみをもって、当然に比較推奨販売に係る規定の適用対象外となるものではありません。保険業法施行規則第227条の2第3項第4号ロ(推奨販売)に係る対応の要否は、「二以上の比較可能な同種の保険契約」が存在するか、保険契約を選別・提案するものであるかどうかによって個別具体的に判断される必要があります。\nその上で、短期の損害保険契約については、その特性を踏まえると、当該契約の満期が到来することに伴い、乗合代理店において、既契約と同条件又は補償内容がほぼ変わらないプランの案内(保険募集)が行われたとしても、直ちに保険契約者等の保護に欠けるものとは言えず、一概に否定されるものではないと考えます。ただし、その場合であっても、他の保険契約の提案を望む顧客も存在すると考えられることから、乗合代理店として意向把握・確認義務を適切に履行するための対応として、顧客の希望に応じて他の保険契約を提案できることを明示すること、及び顧客のリスク状況や意向を適切に把握できるよう工夫して案内(保険募集)することが求められるものと考えます。\nさらに、保険募集人による選別・提案が実質的に伴うことなく、顧客の主体的な判断のみにより、既契約と同内容又はこれと大きく異ならない内容の保険契約を希望する旨が表明され、一の保険契約が選択された場合には、直ちに同号ロ(推奨販売)に係る対応が必要となるものではありません。\nただし、募集過程において、他の保険契約との比較説明を行う場合には同号イを、「二以上の比較可能な同種の保険契約」の中から保険契約を選別・提案する場合には同号ロを踏まえた対応が必要となります。\nまた、顧客が表明した意向、保険募集人が案内・説明した内容等については、事後的に確認・検証できるよう、適切に記録・保存することが重要です。","theme":"更改・継続契約","section":"保険業法施行規則","tags":["比較推奨","意向把握","証跡・記録","更改・継続"]},{"no":111,"location":"－","comment":"比較推奨販売の適用範囲について、既存顧客の継続手続きにおいて、顧客が同条件での継続を希望する場合は比較説明が不要と捉えているが問題ないか伺いたい。\nまた、業務負担増を鑑み、継続時の比較不要ルールの明文化を検討いただきたい。","pageStart":80,"pageEnd":80,"answer":"既契約の満期到来に伴う保険募集を行う場合であっても、保険募集人は、顧客が適切な理解に基づき、自主的に既契約の継続の要否や内容を判断できるよう、顧客のリスク特性や意向が変化している可能性にも留意しつつ、既契約の内容・特性等に応じて、顧客の意向を適切に把握し、当該意向に沿った提案・説明を行う必要があります。\nまた、既契約の満期に伴う保険募集であることのみをもって、当然に比較推奨販売に係る規定の適用対象外となるものではありません。保険業法施行規則第227条の2第3項第4号ロ(推奨販売)に係る対応の要否は、「二以上の比較可能な同種の保険契約」が存在するか、保険契約を選別・提案するものであるかどうかによって個別具体的に判断される必要があります。\nその上で、保険募集人による選別・提案が実質的に伴うことなく、顧客の主体的な判断のみにより、既契約と同内容又はこれと大きく異ならない内容の保険契約を希望する旨が表明され、一の保険契約が選択された場合には、直ちに同号ロに係る対応が必要となるものではありません。\nただし、当該判断が顧客の主体的判断に基づくものか、又は保険募集人による恣意的な誘導が行われていないかは、個別具体的に判断されます。\nまた、継続手続の過程で、他の保険契約との比較説明を行う場合には同号イを、「二以上の比較可能な同種の保険契約」の中から保険契約を選別・提案する場合には同号ロを踏まえた対応が必要です。\n上記のとおり、継続時の取扱いであっても、顧客の意向、契約内容、募集人の関与、比較・推奨の有無等を踏まえて、同号の該否について個別具体的に判断される必要があるため、既契約の満期到来に伴う保険募集に関して一律に比較推奨販売の適用対象外とする規定を設けることは適当ではないと考えます。","theme":"更改・継続契約","section":"保険業法施行規則","tags":["比較推奨"]},{"no":112,"location":"－","comment":"満期を迎える契約についても、顧客意向を反映させた比較推奨販売が必要となるのか伺いたい。\n短時間で契約を終わらせたい顧客や、既契約と同じ保険契約でよいという顧客が多いと思うが、その場合は当該意向を顧客意向として、同じ保険会社を推奨しても問題ないか。\n80","pageStart":80,"pageEnd":81,"answer":"既契約の満期到来に伴う保険募集を行う場合であっても、保険募集人は、顧客が適切な理解に基づき、自主的に既契約の継続の要否や内容を判断できるよう、顧客のリスク特性や意向が変化している可能性にも留意しつつ、既契約の内容・特性等に応じて、顧客の意向を適切に把握し、当該意向に沿った提案・説明を行う必要があります。\nまた、既契約の満期に伴う保険募集であることのみをもって、当然に比較推奨販売に係る規定の適用対象外となるものではありません。保険業法施行規則第227条の2第3項第4号ロ(推奨販売)に係る対応の要否は、「二以上の比較可能な同種の保険契約」が存在するか、保険契約を選別・提案するものであるかどうかによって個別具体的に判断される必要があります。\nその上で、保険募集人による選別・提案が実質的に伴うことなく、顧客の主体的な判断のみにより、既契約と同内容又はこれと大きく異ならない内容の保険契約を希望する旨が表明され、一の保険契約が選択された場合には、直ちに同号ロに係る対応が必要となるものではありません。\nただし、当該判断が顧客の主体的判断に基づくものか、又は保険募集人による恣意的な誘導が行われていないかは、個別具体的に判断されます。\nまた、継続手続の過程で、他の保険契約との比較説明を行う場合には同号イを、「二以上の比較可能な同種の保険契約」の中から保険契約を選別・提案する場合には同号ロを踏まえた対応が必要です。\n上記のとおり、継続時の取扱いであっても、顧客の意向、契約内容、募集人の関与、比較・推奨の有無等を踏まえて、同号の該否について個別具体的に判断される必要があるため、既契約の満期到来に伴う保険募集に関して一律に比較推奨販売の適用対象外とする規定を設けることは適当ではないと考えます。","theme":"更改・継続契約","section":"保険業法施行規則","tags":["比較推奨"]},{"no":113,"location":"－","comment":"監督指針Ⅱ－4－2－9(5)に「保険募集の実務や募集形態等に応じて」との記載があるが、既存契約がある契約者に対する新規契約締結の際の当初意向について、既契約の保険会社の保険契約を優先するかを伺い、顧客の意向を把握することに問題はないか。\n具体的には、「現在ご加入の契約と同一の商品について説明を希望されますか」のような意向の確認方法は問題ないか。\n81","pageStart":81,"pageEnd":82,"answer":"複数の保険契約を取り扱う乗合代理店は、その役割・機能に照らし、顧客のリスク特性や保険ニーズを的確に把握し、複数の保険契約の中から顧客の意向に沿って保険契約の提案・説明を行うことが求められます。\nこのため、顧客からあらかじめ一定の意向が示されている等の合理的な理由が存在する場合を除き、既契約者に対し、既契約とは異なる保険契約の保険募集を行う場合において、単に既契約を引き受けている保険会社であることをもって、当該保険会社の保険契約を優先的に希望するかを確認することは、意向把握・確認義務や比較推奨販売規制の趣旨・目的に照らして適切な対応とは位置付けられず、恣意的に顧客の意向を形成し、又は誘導していると評価される可能性があるものと考えられます。\nなお、Ⅱ－4－2－9(5)①に規定する「保険募集の実務や募集形態等に応じて」とは、比較説明や推奨販売を行う場合において、特定の手法や運用を一律に求める趣旨ではないことを明確化したものであり、当該手法や運用については合理的に判断される必要があります。","theme":"更改・継続契約","section":"保険業法施行規則","tags":["比較推奨","意向把握"]},{"no":114,"location":"－","comment":"談合等の問題は、既存契約の不適切な維持からも生じる。顧客の最善の利益の勘案には、新規提案だけでなく、既契約(既存補償・保険料)との客観的比較分析(重複・不足の明確化)が前提となると解してよいか。これにより、証券分析機能を持たない保険代理店による不十分な比較推奨は抑制されるべきと考える。\nまた、新商品発売時等、前年度と比較して契約内容の前提が変化している場合には、顧客が継続の可否を判断する上で一定の確認が必要となる場面が想定される。\nこの点、監督指針Ⅱ－4－2－9(5)における「顧客の最善の利益を勘案しつつ、適切な比較推奨販売を行う」との趣旨は、必ずしも更改契約全ての比較推奨販売を義務付けるものではなく、顧客の状況に応じた必要最低限の確認・説明(既契約内容の確認、新商品・特約の存在、保険料水準の変動等)を求めるものと理解して差し支えないか。\nその際の説明の程度については、新規加入時と同一の水準で全商品の比較を行うものではなく、顧客が継続の可否を判断できる程度の情報提供で足りるとの理解で相違ないか。\n82","pageStart":82,"pageEnd":83,"answer":"既契約の満期に伴う保険募集においても、保険募集人は、顧客が適切な理解に基づき、自主的に既契約の継続の要否や内容を判断できるよう、顧客のリスク特性や意向が変化している可能性にも留意しつつ、既契約の内容・特性等に応じて、顧客の意向を適切に把握し、当該意向に沿った提案・説明を行う必要があります。\nその際、既契約の保障（補償）内容や保険料水準を確認し、重複・不足、新商品・特約の有無、商品改定や保険料水準の変動等を踏まえ、必要な説明を行うことは、顧客本位の保険募集に資する取組と考えられます。\n一方で、既契約の満期に伴う保険募集を行う場合においても、保険業法施行規則第227条の2第3項第4号ロ(推奨販売)に係る対応の要否は、「二以上の比較可能な同種の保険契約」が存在するか、保険契約を選別・提案するものであるかどうかによって個別具体的に判断される必要があります。\nしたがって、顧客の意向とは無関係に常に新規契約と同一水準で全取扱商品の比較や詳細な分析を行うことまでが一律に求められるものではなく、既契約の内容・特性等に応じて、顧客の意向を適切に把握し、既契約の内容、変更の有無・程度等を踏まえ、顧客が満期後の保険契約の内容を適切に判断できるよう、分かりやすく説明することが重要です。\n加えて、保険募集人による選別・提案が実質的に伴うことなく、顧客の主体的な判断のみにより、既契約と同内容又はこれと大きく異ならない内容の保険契約を希望する旨が表明され、一の保険契約が選択された場合には、直ちに同号ロに係る対応が必要となるものではありません。\n既契約の一部変更を行う場合には、変更部分について、変更内容・程度、商品特性、顧客の理解度等を踏まえ、必要な情報提供及び意向把握・確認を適切に行う必要があります。","theme":"更改・継続契約","section":"保険業法施行規則","tags":["比較推奨","意向把握","顧客の最善の利益","更改・継続"]},{"no":115,"location":"－","comment":"新規契約時は比較説明を行うとして、更新時は顧客の要望がない限り比較説明を行わなくてもよいと考える。更新時においても比較説明が必要となると営業の負担が増え、提案の質が下がったり、ミスに繋がってしまう恐れがある。\nまた、各損害保険の内容が複雑であるため、ある程度の範囲で補償内容や保険料の統一も必要と考える。","pageStart":83,"pageEnd":83,"answer":"貴重なご意見として承ります。\n既契約の満期到来時においても、保険募集人は、顧客が適切な理解に基づき、自主的に既契約の継続の要否や内容を判断できるよう、顧客のリスク特性や意向が変化している可能性にも留意しつつ、既契約の内容・特性等に応じて、顧客の意向を適切に把握し、当該意向に沿った提案・説明を行う必要があります。\nまた、既契約の満期に伴う保険募集であることのみをもって、当然に比較推奨販売に係る規定の適用対象外となるものではありません。保険業法施行規則第227条の2第3項第4号ロ(推奨販売)に係る対応の要否は、「二以上の比較可能な同種の保険契約」が存在するか、保険契約を選別・提案するものであるかどうかによって個別具体的に判断される必要があります。\nなお、顧客から保険会社の変更や他の保険契約との比較を希望する申出がないことのみをもって、直ちに意向把握や比較推奨販売に係る対応が不要となるものではありません。\nその上で、保険募集人による選別・提案が実質的に伴うことなく、顧客の主体的な判断のみにより、既契約と同内容又はこれと大きく異ならない内容の保険契約を希望する旨が表明され、一の保険契約が選択された場合には、直ちに同号ロに係る対応が必要となるものではありません。\nただし、当該判断が顧客の主体的判断に基づくものか、又は保険募集人による恣意的な誘導が行われていないかは、個別具体的に判断されます。\nまた、継続手続の過程で、他の保険契約との比較説明を行う場合には同号イを、「二以上の比較可能な同種の保険契約」の中から保険契約を選別・提案する場合には同号ロを踏まえた対応が必要です。\nこのほか、損害保険商品の補償内容や保険料については、顧客の多様なリスクやニーズに応じた選択肢が提供されることが重要であり、各損害保険会社において、顧客に分かりやすい商品設計や情報提供、保険募集人への教育・管理・指導が行われることが重要です。","theme":"更改・継続契約","section":"保険業法施行規則","tags":["比較推奨","意向把握","更改・継続"]},{"no":116,"location":"－","comment":"継続契約については、顧客から既契約の保険会社の商品での継続を望まない意思表示がない限りは、既契約の保険会社の商品で継続するという運用を認めていただきたい。","pageStart":83,"pageEnd":83,"answer":"貴重なご意見として承ります。\n既契約の満期到来時においても、保険募集人は、顧客が適切な理解に基づき、自主的に既契約の継続の要否や内容を判断できるよう、顧客のリスク特性や意向が変化している可能性にも留意しつつ、既契約の内容・特性等に応じて、顧客の意向を適切に把握し、当該意向に沿った提案・説明を行う必要があります。\nまた、既契約の満期に伴う保険募集であることのみをもって、当然に比較推奨販売に係る規定の適用対象外となるものではありません。保険業法施行規則第227条の2第3項 更改・継続"]},{"no":122,"location":"－","comment":"当社には保険ショップ、企業職域等様々な部署があるが、例えば、保険ショップは当社が取扱い可能な全商品を対象に比較説明する一方で、企業職域はその企業に団体制度として認められている保険契約の範囲内で比較説明するなど、部門ごとに取扱い保険会社を限定するような運用は可能か。\n84","pageStart":84,"pageEnd":85,"answer":"乗合代理店において、比較推奨販売の対象となる「二以上の比較可能な同種の保険契約」は、代理店委託契約又はこれに基づく覚書等により、当該代理店が取り扱うこととされている保険契約を前提に判断されます。\nしたがって、取り扱い保険契約の範囲を限定する場合には、所属保険会社等との間で、その具体的範囲や取扱いについて、当該委託契約又はこれに基づく覚書等により明確化されているときは、当該委託契約等で定められた保険募集の場面において、当該保険契約は「二以上の比較可能な同種の保険契約」に含まれないものと考えられます。また、このとき、取り扱えない当該保険契約が誤って顧客へ提案されないよう、保険会社及び乗合代理店において実態に即して実効的に管理されることが重要と考えます。\nなお、顧客本位の業務運営の確保を目的とする合理的な理由なく、形式的な委託範囲の限定を行うことにより、保険会社からの便宜供与等の見返りとして、顧客に対して特定の保険会社の保険契約を優先的に取り扱うなど、顧客の適切な商品選択の機会を実質的に阻害するおそれのある業務運営を行う場合には、比較推奨販売規制を潜脱するものとして問題となり得ます。\nまた、顧客に対しては、権限明示を適切に実施するとともに、当該限定を行う場合には、取扱保険会社・保険契約の範囲等について、誤認を与えないよう適切に説明する必要があります。","theme":"団体・団体扱い","section":"保険業法施行規則","tags":["便宜供与","比較推奨"]},{"no":123,"location":"第227条の2第3項第4号","comment":"保険業法施行規則第227条の2第3項第4号ロについて、保険契約の中には団体扱自動車保険など、集金事務委託契約を保険会社と団体が締結することで、給与天引きが可能になるなど、契約者メリットが発生する保険契約がある。\n例えば、乗合代理店において、複数の保険会社の取り扱いがあるものの、団体が集金事務委託契約を締結している保険会社が1社である場合の保険募集について、団体扱契約の保険契約者が給与天引きなどの利便性を希望する意向が確認できる場合、当該保険会社1社のみを推奨することは問題ないか。\n監督指針Ⅱ－4－2－9(5)①B.(a)の「乗合代理店が二以上の比較可能な同種の保険契約の中から顧客の意向に沿って保険契約を選別し、一又は二以上の保険契約を提示・推奨する場合には、当該提示・推奨する保険契約の概要及び顧客の求めに応じて契約内容並びに当該提示・推奨する85基準や理由等を説明しているか」を踏まえると、法令に反しない限りにおいて、乗合代理店が顧客に対して、信義則に則って対応する場合には、団体が集金事務委託契約を締結している保険会社を推奨することについて問題はないと考えるが如何か。","pageStart":85,"pageEnd":86,"answer":"団体扱契約についても、保険業法施行規則第227条の2第3項第4号ロの適用対象となるか否かについては、当該契約以外に「二以上の比較可能な同種の保険契約」に該当する保険契約があるかどうかを、顧客の意向との関係で、一般人の合理的な期待を基準として、保険契約の対象リスク、給付・保障(補償)内容、契約の特性・類型等を踏まえ、個別具体的かつ実質的に判断されるべきものです。\nその上で、顧客が給与天引き等の利便性を希望する旨を表明した場合であっても、その意思表示のみをもって選別の理由とするのではなく、当該顧客が表明する他の意向にも照らしつつ、個別具体的に判断される必要があります。\nなお、保険募集人が、あらかじめ特定の保険契約の選別・推奨を前提として、当該保険契約に適合するように顧客の意向を形成し、又は恣意的に誘導する行為は、比較推奨販売規制の潜脱に該当し得ることに留意が必要です。","theme":"団体・団体扱い","section":"保険業法施行規則","tags":["比較推奨"]},{"no":124,"location":"－","comment":"特定の企業Aとは、B損害保険会社との団体扱契約に係る集金事務委託契約に基づく給与天引があるため、B損害保険会社の保険契約のみを推奨し販売している。\n保険業法施行規則第227条の2第3項第4号ハが廃止され、顧客の意向を確認した上で、複数の保険契約を比較することが必須となった場合、分割払割増付加など保険料面で顧客に不利となるB損害保険会社以外の保険契約も推奨しなければならないと理解している。\nこのような保険募集は顧客及び乗合代理店双方にとって非合理的と考えるが如何か。","pageStart":86,"pageEnd":86,"answer":"団体扱契約についても、保険業法施行規則第227条の2第3項第4号ロの適用対象となるか否かについては、当該契約以外に「二以上の比較可能な同種の保険契約」に該当する保険契約があるかどうかを、顧客の意向との関係で、一般人の合理的な期待を基準として、保険契約の対象リスク、給付・保障(補償)内容、契約の特性・類型等を踏まえ、個別具体的かつ実質的に判断されるべきものです。\nその上で、顧客が給与天引き等の利便性を希望する旨を表明した場合であっても、その意思表示のみをもって選別の理由とするのではなく、当該顧客が表明する他の意向にも照らしつつ、個別具体的に判断される必要があります。\nなお、保険募集人が、あらかじめ特定の保険契約の選別・推奨を前提として、当該保険契約に適合するように顧客の意向を形成し、又は恣意的に誘導する行為は、比較推奨販売規制の潜脱に該当し得ることに留意が必要です。","theme":"団体・団体扱い","section":"保険業法施行規則","tags":["比較推奨","ハ方式"]},{"no":125,"location":"第227条の2第3項第4号","comment":"保険業法第294条(情報提供義務)及び第294条の2(意向把握義務)の規定は、保険契約の締結、保険募集及び加入勧奨の場面において適用され、情報提供・意向把握を行う対象は保険契約者及び被保険者と理解している。\nよって、保険募集人は団体保険の場合であっても、被保険者に対して情報提供・意向把握を行う必要があると認識している。\n加えて、団体と加入者が密接な関係を有するケース(適用除外)と関係を有さないケース(適用)があると認識しており、適用団体保険(例：その他団体)の加入勧奨について86は、適用団体保険の引受保険会社・取扱保険募集人は団体保険以外の一般の契約と同様、上記対象条文・監督指針に沿った対応・措置が求められ、自ら情報提供義務、意向把握義務を履行するとともに、これらの義務を適切に果たすための体制整備が必要となると理解している。\nこの場合、乗合代理店が求められる意向把握・比較推奨は、保険契約者のみならず、加入者に対しても果たす必要があると考えるが、その理解で相違ないか。\n監督指針Ⅱ－4－2－9(5)①B.(a)の「乗合代理店が二以上の比較可能な同種の保険契約の中から顧客の意向に沿って保険契約を選別し、一又は二以上の保険契約を提示・推奨する場合には、当該提示・推奨する保険契約の概要及び顧客の求めに応じて契約内容並びに当該提示・推奨する基準や理由等を説明しているか」を踏まえると、法令に反しない限りにおいて、乗合代理店が顧客に対して、信義則に則って対応する場合には、団体保険の募集について、推奨方針を変更することは問題ないと考えるが如何か。","pageStart":86,"pageEnd":87,"answer":"団体保険の保険募集を行う場合においても、顧客の意向を適切に把握し、これに沿った提案・説明を行うことが重要です。また、その際には、保険契約者等の保護の観点から、必要な情報提供が行われることが重要であり、保険業法第294条1項が適用除外となる場合を除き、団体保険の取扱保険募集人に対しては、同法施行規則第227条の2第3項本文において、保険契約者及び被保険者に対し必要な情報提供を行うことが定められているとともに、取扱保険募集人が乗合代理店であり、「二以上の比較可能な同種の保険契約」\nの中から選別・提案を行う場合には、同法施行規則第227条の2第3項第4号ロ(推奨販売)の規定に係る対応が必要となります。\nなお、貴見にある「推奨方針」の意味するところが明らかでないことから、変更の適否についてお答えすることは困難です。","theme":"団体・団体扱い","section":"保険業法施行規則","tags":["比較推奨","意向把握","団体・団体扱い"]},{"no":126,"location":"－","comment":"保険業法施行規則第227条の2第3項第4号ロについて、希望する保障(補償)内容等を聴取した上で、顧客が勤める企業の福利厚生制度の一種である団体保険又は団体扱保険を提案することは、顧客の意向に沿った募集であるという理解でよいか。\nその際、募集を行う乗合代理店では他の保険会社も乗り合っており、かつ、団体扱が可能な商品がある場合であっても、当該勤務先の福利厚生制度に掲載されていることを87推奨理由として保険契約を選定してよいか。\nまた、上記が推奨理由になると判断できる場合、「福利厚生制度に掲載されている」とされる基準はどの程度の対応か。\n「当該企業の人事イントラページに団体扱の制度概要が掲載されている」という状態をもって「福利厚生制度に掲載されている」と考えてよいか。","pageStart":87,"pageEnd":88,"answer":"保険募集人が顧客の意向を把握し、これに沿った保険募集を行うことは、意向把握・確認義務及び情報提供義務において求められる対応となります。\nまた、ある保険契約が比較推奨販売の対象となる「二以上の比較可能な同種の保険契約」に該当するかどうかについては、顧客の意向との関係で、一般人の合理的な期待を基準として、保険契約の対象リスク、給付・保障(補償)内容、保険契約の特性・類型等を踏まえ、個別具体的かつ実質的に判断されることとなります。\nその上で、契約主体ではない団体であったとしても、それが企業や官公庁であり、その従業員の福利厚生のために、団体扱・集団扱契約を制度商品として選定し、その利点とともに、当該団体専用の保険契約として、従業員に適切に認識される態様で提供される場合には、当該契約は団体の都合ではなく団体の構成員の利益のための仕組みとして位置付けられるものと考えられます。\nこの場合には、当該団体により選定されたという事情を「二以上の比較可能な同種の保険契約」の範囲を判断するに当たっての主な考慮要素とすることは、一概に否定されるものではないと考えます。\n一方で、「比較可能な同種の保険契約」が複数存在し、その中から保険契約を選別し、提示・推奨する場合には、貴見のいう「勤務先の福利厚生制度に掲載されている」といった単一の事情のみを勘案するのではなく、顧客の意向や保険契約の内容等を踏まえ、個々の顧客に応じた適切な提案が行われることが重要であり、その選別理由についても、個別具体的に判断される必要があります。","theme":"団体・団体扱い","section":"保険業法施行規則","tags":["比較推奨","意向把握","団体・団体扱い"]},{"no":127,"location":"－","comment":"監督指針Ⅱ－4－2－9(5)①において、団体割引、火災保険における債務者集団割引、住宅購入者割引等の有無(割引適用のメリット)を、保険契約を選ぶ際の判断基準や選定理由として含めることに問題はないか。\n88","pageStart":88,"pageEnd":88,"answer":"保険募集人が保険契約の選別・推奨を行うに当たっては、保険料の多寡のみならず、商品特性その他の要素を含め、顧客が重視する事項に照らして総合的に判断する必要があります。\nしたがって、単に団体割引や各種割引の有無といった保険料に関する要素のみをもって、特定の保険契約を選別・推奨することが一律に適当と評価されるものではなく、保険料以外の事項についても十分に踏まえつつ、当該顧客が重視する事項と当該保険契約の内容との関係に照らし、個別具体的かつ実質的に判断される必要があります。","theme":"団体・団体扱い","section":"保険業法施行規則","tags":[]},{"no":128,"location":"－","comment":"強制保険である自動車損害賠償責任保険(自動車損害賠償保障法第5条)の取扱いについて、すべての保険会社が同一の補償内容を同一の保険料にて提供しているため、保険会社間で差がない商品となっている。この場合においても、比較推奨販売を行い、乗合各社の中からどの保険会社を希望するのか顧客に選定してもらう必要があるのか。商品の特性上、特に代理店の都合による保険会社の選定が行われやすいと考えられるが、比較方法はどのようにすべきか。","pageStart":89,"pageEnd":89,"answer":"自動車損害賠償責任保険は、自動車損害賠償保障法に基づき加入が義務付けられており、補償内容や保険料が法令等により定められているため、一般の任意保険のように商品内容や保険料を比較して選択する性質は限定的です。\nしたがって、複数の保険会社の自動車損害賠償責任保険を取り扱っている場合であっても、保険業法施行規則第227条の2第3項第4号ロに係る対応が必要となるものではないと考えられます。\nなお、顧客から保険会社の指定がある場合には、その希望を踏まえて適切に対応する必要があります。また、指定がない場合であっても、保険代理店において、複数の保険会社の自動車損害賠償責任保険の取り扱いがあるときは、これら保険会社を顧客に明示した上で、例えば、前契約の保険会社、任意保険と同一の保険会社等、顧客が希望する保険会社がないか等を確認することが重要と考えられます。\nいずれにしても、顧客の最善利益を勘案せず、保険会社からの便宜供与、取引関係その他の代理店側の都合により、特定の保険会社の保険契約を恣意的に優先することは適切ではなく、保険代理店においては、顧客の希望に沿った保険契約の販売ができるよう体制を整備することが求められます。","theme":"自賠責保険","section":"保険業法施行規則","tags":["便宜供与","比較推奨"]},{"no":129,"location":"－","comment":"自動車損害賠償責任保険(自動車損害賠償保障法第5条)\nについて、どのように保険会社の選定を行えばよいか。顧客からの指定がなければ代理店で決定して良いのか。","pageStart":89,"pageEnd":89,"answer":"自動車損害賠償責任保険は、自動車損害賠償保障法に基づき加入が義務付けられており、補償内容や保険料が法令等により定められているため、一般の任意保険のように商品内容や保険料を比較して選択する性質は限定的です。\nしたがって、複数の保険会社の自動車損害賠償責任保険を取り扱っている場合であっても、保険業法施行規則第227条の2第3項第4号ロに係る対応が必要となるものではないと考えられます。\nなお、顧客から保険会社の指定がある場合には、その希望を踏まえて適切に対応する必要があります。また、指定がない場合であっても、保険代理店において、複数の保険会社の自動車損害賠償責任保険の取り扱いがあるときは、これら保険会社を顧客に明示した上で、例えば、前契約の保険会社、任意保険と同一の保険会社等、顧客が希望する保険会社がないか等を確認することが重要と考えられます。\nいずれにしても、顧客の最善利益を勘案せず、保険会社からの便宜供与、取引関係その他の代理店側の都合により、特定の保険会社の保険契約を恣意的に優先することは適切ではなく、保険代理店においては、顧客の希望に沿った保険契約の販売ができるよう体制を整備することが求められます。","theme":"自賠責保険","section":"保険業法施行規則","tags":["便宜供与"]},{"no":130,"location":"－","comment":"自動車損害賠償責任保険(自動車損害賠償保障法第5条)\nは比較推奨販売の対象に含まれるのか伺いたい。","pageStart":89,"pageEnd":89,"answer":"自動車損害賠償責任保険は、自動車損害賠償保障法に基づき加入が義務付けられており、補償内容や保険料が法令等により定められているため、一般の任意保険のように商品内容や保険料を比較して選択する性質は限定的です。\nしたがって、複数の保険会社の自動車損害賠償責任保険を取り扱っている場合であっても、保険業法施行規則第227条の2第3項第4号ロに係る対応が必要となるものではないと考えられます。\nなお、顧客から保険会社の指定がある場合には、その希望を踏まえて適切に対応する必要があります。また、指定がない場合であっても、保険代理店において、複数の保険会社の自動車損害賠償責任保険の取り扱いがあるときは、これら保険会社を顧客に明示した上で、例えば、前契約の保険会社、任意保険と同一の保険会社等、顧客が希望する保険会社がないか等を確認することが重要と考えられます。\nいずれにしても、顧客の最善利益を勘案せず、保険会社からの便宜供与、取引関係その他の代理店側の都合により、特定の保険会社の保険契約を恣意的に優先することは適切ではなく、保険代理店においては、顧客の希望に沿った保険契約の販売ができるよう体制を整備することが求められます。","theme":"自賠責保険","section":"保険業法施行規則","tags":["便宜供与","比較推奨"]},{"no":131,"location":"－","comment":"自動車損害賠償責任保険(自動車損害賠償保障法第5条)\nの取り扱いについては、業務の効率化も踏まえ比較推奨の対象外としていただきたい。","pageStart":89,"pageEnd":89,"answer":"自動車損害賠償責任保険は、自動車損害賠償保障法に基づき加入が義務付けられており、補償内容や保険料が法令等により定められているため、一般の任意保険のように商品内容や保険料を比較して選択する性質は限定的です。\nしたがって、複数の保険会社の自動車損害賠償責任保険を取り扱っている場合であっても、保険業法施行規則第227条の2第3項第4号ロに係る対応が必要となるものではないと考えられます。\nなお、顧客から保険会社の指定がある場合には、その希望を踏まえて適切に対応する必要があります。また、指定がない場合であっても、保険代理店において、複数の保険会社の自動車損害賠償責任保険の取り扱いがあるときは、これら保険会社を顧客に明示した上で、例えば、前契約の保険会社、任意保険と同一の保険会社等、顧客が希望する保険会社がないか等を確認することが重要と考えられます。\nいずれにしても、顧客の最善利益を勘案せず、保険会社からの便宜供与、取引関係その他の代理店側の都合により、特定の保険会社の保険契約を恣意的に優先することは適切ではなく、保険代理店においては、顧客の希望に沿った保険契約の販売ができるよう体制を整備することが求められます。","theme":"自賠責保険","section":"保険業法施行規則","tags":["便宜供与","比較推奨"]},{"no":132,"location":"－","comment":"修理工場などの小規模代理店では、比較推奨販売に係る体制整備が大きな負担となり、代理店契約を解消する事例が生じている。\n特に地方では、小規模代理店が地域の車社会を支える重要な役割を担っており、過度な体制整備要請は、サービス網の縮小や顧客利便性の低下につながる懸念がある。\n89今回の制度見直しの背景となった事案は主に大規模事業者に起因するものである一方、その影響を中小規模代理店が受けることは不合理であり、代理店規模や地域性を踏まえた体制水準を再検討して提示してほしい。","pageStart":89,"pageEnd":90,"answer":"今回の法令改正及び監督指針改正は、特定の事業規模を前提とするものではなく、顧客の最善の利益を勘案しつつ、顧客の適切な商品選択の機会を確保することを目的としております。\n乗合代理店においては、自らの規模や業務特性等に加えて、自らの実態(保険募集の実務や募集形態等)も踏まえつつ、適切かつ主体的に業務を遂行することができるよう実効性のある体制を整備することが重要であり、一律に同程度の体制整備を求めるものではありません。","theme":"体制整備","section":"保険業法施行規則","tags":["比較推奨","顧客の最善の利益"]},{"no":133,"location":"－","comment":"大型車(トラック・バス)ディーラー代理店においては、車両特性や法人顧客対応の複雑さから、高度な専門知識を有する人材が不可欠である一方、保険会社からの出向者引き上げや支援縮小により、教育・対応負担が急増している。\nこうした中で、比較推奨販売に係る体制整備を一律に求めることは現実的ではなく、顧客利便性の観点からも、既存取引や顧客の意向を踏まえた柔軟な比較推奨の運用が認められるべきである。中小規模代理店や大型車ディーラーの実態に配慮した、現実的な運用を求めたい。","pageStart":90,"pageEnd":90,"answer":"今回の法令改正及び監督指針改正は、特定の事業規模を前提とするものではなく、顧客の最善の利益を勘案しつつ、顧客の適切な商品選択の機会を確保することを目的としております。\n乗合代理店においては、自らの規模や業務特性等に加えて、自らの実態(保険募集の実務や募集形態等)も踏まえつつ、適切かつ主体的に業務を遂行することができるよう実効性のある体制を整備することが重要であり、一律に同程度の体制整備を求めるものではありません。","theme":"体制整備","section":"保険業法施行規則","tags":["比較推奨","顧客の最善の利益","出向"]},{"no":134,"location":"－","comment":"同一の乗合代理店であっても、営業所・拠点ごとに在籍する保険募集人の構成や経緯が異なる場合がある。例えば、特定の保険会社専属代理店出身者のみで構成される営業所については専属代理店に準じた運用とし、複数社出身者が在籍する営業所については、一定の準備期間を経た上で比較推奨販売を行うなど、営業所や店舗単位の特性に応じて、専属・乗合の区分を柔軟に使い分ける運用を認めることはできないか。","pageStart":90,"pageEnd":90,"answer":"保険募集人(乗合代理店)には、法令に基づき、自らの所属保険会社等の保険商品について、顧客の最善の利益を勘案しつつ、公正な保険募集を行うことが求められています。そのため保険契約者等の保護の観点から、自らの規模や業務特性に見合った体制整備を図ることが必要と考えます。","theme":"体制整備","section":"保険業法施行規則","tags":["比較推奨","顧客の最善の利益"]},{"no":135,"location":"－","comment":"比較推奨販売への対応が厳格化された場合、人員確保や社内体制整備、比較推奨を行うためのシステム導入等により、代理店の業務負荷・コスト負担が大幅に増加するおそれがある。\n90とりわけ、商品内容や保険料に大きな差がない中で、僅かな違いを詳細に説明することが、必ずしも顧客の利益につながるのか疑問があり、比較推奨の進展が価格競争を招き、代理店経営や手数料水準に悪影響を及ぼす可能性について懸念している。","pageStart":90,"pageEnd":91,"answer":"貴重なご意見として承ります。\nなお、今般の比較推奨販売の適正化にあたっては、乗合代理店の負担等にも配慮し、一律かつ画一的な対応や、規模・業務特性等に照らして過度な実務上の負担が生じないよう、乗合代理店の募集実務や募集形態等を考慮したものとなるよう規定しています。\nまた、比較推奨販売に係る体制整備についても、顧客の最善の利益を勘案しつつ、顧客の適切な商品選択の機会を確保することを目的として、乗合代理店の規模や業務特性等を踏まえ、適切かつ主体的に業務を遂行することができるよう実効的な体制が整備されることが重要であり、一律かつ画一的な対応や過度なシステム投資を求める趣旨ではありません。","theme":"体制整備","section":"保険業法施行規則","tags":["手数料・インセンティブ","比較推奨","顧客の最善の利益","システム・比較ツール"]},{"no":136,"location":"－","comment":"保険会社からの出向者引き上げ等により、代理店における専門人材や教育・管理体制が十分に確保できていない中で、保険会社からは自立化のみが求められ、現場の負担が過度に増大している。\nこうした状況下で、比較推奨販売に係る新たな体制整備や細かな対応を求めることは現実的ではなく、現場の実情を踏まえた、実行可能な制度設計が必要である。","pageStart":91,"pageEnd":91,"answer":"貴重なご意見として承ります。\nなお、今般の比較推奨販売の適正化にあたっては、乗合代理店の負担等にも配慮し、一律かつ画一的な対応や、規模・業務特性等に照らして過度な実務上の負担が生じないよう、乗合代理店の募集実務や募集形態等を考慮したものとなるよう規定しています。\nまた、比較推奨販売に係る体制整備についても、顧客の最善の利益を勘案しつつ、顧客の適切な商品選択の機会を確保することを目的として、乗合代理店の規模や業務特性等を踏まえ、適切かつ主体的に業務を遂行することができるよう実効的な体制が整備されることが重要であり、一律かつ画一的な対応や過度なシステム投資を求める趣旨ではありません。","theme":"体制整備","section":"保険業法施行規則","tags":["比較推奨","顧客の最善の利益","出向","システム・比較ツール"]},{"no":137,"location":"－","comment":"4社の損保を取り扱う乗合代理店において、顧客の意向に沿って商品を提案する運用を行う場合、既存社員・新入社員・中途社員いずれについても、複数社商品の理解に相当の研修期間と実務経験が必要となる。特に、経験の浅いスタッフが、入社直後から偏りなく乗合各社の商品を説明することは困難であり、そのような保険募集人に対する現実的な販売方法や運用の考え方を示してほしい。","pageStart":91,"pageEnd":91,"answer":"貴重なご意見として承ります。\nなお、今般の比較推奨販売の適正化にあたっては、乗合代理店の負担等にも配慮し、一律かつ画一的な対応や、規模・業務特性等に照らして過度な実務上の負担が生じないよう、乗合代理店の募集実務や募集形態等を考慮したものとなるよう規定しています。\nまた、比較推奨販売に係る体制整備についても、顧客の最善の利益を勘案しつつ、顧客の適切な商品選択の機会を確保することを目的として、乗合代理店の規模や業務特性等を踏まえ、適切かつ主体的に業務を遂行することができるよう実効的な体制が整備されることが重要であり、一律かつ画一的な対応や過度なシステム投資を求める趣旨ではありません。","theme":"体制整備","section":"保険業法施行規則","tags":["比較推奨","顧客の最善の利益","システム・比較ツール"]},{"no":138,"location":"－","comment":"自動車ディーラーは、車両販売を中心に、点検・修理・保険等を含めたトータルサービスを通じて顧客の安心・安全を支えている。その中で自動車保険は重要な役割を果たす一方、比較推奨販売において過度に詳細な説明や確認を求められる場合、相当の時間と労力を要し、迅速かつ丁寧な顧客対応が困難となるおそれがある。その結果、顧客の91理解や納得がかえって得られなくなるのではないかとの懸念がある。","pageStart":91,"pageEnd":92,"answer":"貴重なご意見として承ります。\nなお、今般の比較推奨販売の適正化にあたっては、乗合代理店の負担等にも配慮し、一律かつ画一的な対応や、規模・業務特性等に照らして過度な実務上の負担が生じないよう、乗合代理店の募集実務や募集形態等を考慮したものとなるよう規定しています。\nまた、比較推奨販売に係る体制整備についても、顧客の最善の利益を勘案しつつ、顧客の適切な商品選択の機会を確保することを目的として、乗合代理店の規模や業務特性等を踏まえ、適切かつ主体的に業務を遂行することができるよう実効的な体制が整備されることが重要であり、一律かつ画一的な対応や過度なシステム投資を求める趣旨ではありません。","theme":"体制整備","section":"保険業法施行規則","tags":["比較推奨","顧客の最善の利益","システム・比較ツール"]},{"no":139,"location":"－","comment":"比較推奨販売が厳格化された場合、取扱保険会社各社のシステム・マニュアルを全店舗に導入しなければならなくなり、当社のような中小規模の代理店の人員体制において、その為の現場教育や実務面での業務負担が増えることにならないか懸念している。負担が増えて、サービスの質が落ちては本末転倒である。","pageStart":92,"pageEnd":92,"answer":"貴重なご意見として承ります。\nなお、今般の比較推奨販売の適正化にあたっては、乗合代理店の負担等にも配慮し、一律かつ画一的な対応や、規模・業務特性等に照らして過度な実務上の負担が生じないよう、乗合代理店の募集実務や募集形態等を考慮したものとなるよう規定しています。\nまた、比較推奨販売に係る体制整備についても、顧客の最善の利益を勘案しつつ、顧客の適切な商品選択の機会を確保することを目的として、乗合代理店の規模や業務特性等を踏まえ、適切かつ主体的に業務を遂行することができるよう実効的な体制が整備されることが重要であり、一律かつ画一的な対応や過度なシステム投資を求める趣旨ではありません。","theme":"体制整備","section":"保険業法施行規則","tags":["比較推奨","顧客の最善の利益","システム・比較ツール"]},{"no":140,"location":"－","comment":"比較推奨販売の厳格化により、体制整備や人員確保、システム対応等に係る実務負担やコストが増加するおそれがある。特に中小規模の代理店においては、その影響が相対的に大きくなることが想定されるため、代理店の実情に配慮した制度運用が必要である。","pageStart":92,"pageEnd":92,"answer":"貴重なご意見として承ります。\nなお、今般の比較推奨販売の適正化にあたっては、乗合代理店の負担等にも配慮し、一律かつ画一的な対応や、規模・業務特性等に照らして過度な実務上の負担が生じないよう、乗合代理店の募集実務や募集形態等を考慮したものとなるよう規定しています。\nまた、比較推奨販売に係る体制整備についても、顧客の最善の利益を勘案しつつ、顧客の適切な商品選択の機会を確保することを目的として、乗合代理店の規模や業務特性等を踏まえ、適切かつ主体的に業務を遂行することができるよう実効的な体制が整備されることが重要であり、一律かつ画一的な対応や過度なシステム投資を求める趣旨ではありません。","theme":"体制整備","section":"保険業法施行規則","tags":["比較推奨","顧客の最善の利益","システム・比較ツール"]},{"no":141,"location":"－","comment":"比較推奨販売への対応が増えることで、人員確保やシステム対応、社内体制整備等の負担やコストが拡大し、代理店経営への影響が懸念される。\n加えて、簡潔な説明や代理店への一任を希望する顧客も多く、一律に比較推奨を行うことが必ずしも顧客ニーズに合致しない場合がある。\n比較推奨への対応負担を背景として取扱保険会社数を減らす動きが進めば、結果として顧客の選択肢が狭まり、顧客本位に反するのではないかとの懸念や、商品差異や僅かな価格差の説明に多大な時間と労力を要する点についても課題がある。\n92","pageStart":92,"pageEnd":92,"answer":"貴重なご意見として承ります。\n簡潔な説明や代理店への一任を希望する顧客に対しても、顧客が特に重視すると考えられる事項を例示するなど、可能な限り顧客の意向を把握したうえで、顧客の適切な商品選択の機会を確保することが求められます。\nまた、保険募集人(乗合代理店)には、法令に基づき、自らの所属保険会社等の保険商品について、顧客の最善の利益を勘案しつつ、公正な保険募集を行うことが求められています。そのため保険契約者等の保護の観点から、自らの規模や業務特性に見合った体制整備を図ることが必要と考えます。","theme":"体制整備","section":"保険業法施行規則","tags":["比較推奨","顧客の最善の利益","システム・比較ツール"]},{"no":142,"location":"－","comment":"保険自由化以降、代理店には業務負担やコスト負担が積み重なってきており、比較推奨販売への対応により、さらに負担が増大することが懸念される。比較推奨の適正化に伴い、乗合保険会社すべての商品を説明することが求められる結果、顧客への説明が長時間化し、必ずしも契約者の真のニーズに沿った改正となっているのか疑問がある。また、人員確保が困難な中で負担軽減のため取扱保険会社を一社に絞らざるを得ない代理店も想定され、その結果、契約者の選択肢が減少し、サービス低下につながるおそれがある。","pageStart":93,"pageEnd":93,"answer":"貴重なご意見として承ります。\n簡潔な説明や代理店への一任を希望する顧客に対しても、顧客が特に重視すると考えられる事項を例示するなど、可能な限り顧客の意向を把握したうえで、顧客の適切な商品選択の機会を確保することが求められます。\nまた、保険募集人(乗合代理店)には、法令に基づき、自らの所属保険会社等の保険商品について、顧客の最善の利益を勘案しつつ、公正な保険募集を行うことが求められています。そのため保険契約者等の保護の観点から、自らの規模や業務特性に見合った体制整備を図ることが必要と考えます。","theme":"体制整備","section":"保険業法施行規則","tags":["比較推奨","顧客の最善の利益"]},{"no":143,"location":"－","comment":"自動車販売スタッフが主に保険募集を担う代理店においては、慢性的な人材不足の中、1社の自動車保険を理解・説明するだけでも多大な教育負担が生じているのが実態である。\nこうした状況で、乗合各社の保険商品を熟知し比較推奨を行うことを求めるのは現実的ではなく、無理な対応を強いれば、現場の疲弊や説明の質の低下を招き、かえって顧客に不利益をもたらすおそれがある。","pageStart":93,"pageEnd":93,"answer":"貴重なご意見として承ります。\n簡潔な説明や代理店への一任を希望する顧客に対しても、顧客が特に重視すると考えられる事項を例示するなど、可能な限り顧客の意向を把握したうえで、顧客の適切な商品選択の機会を確保することが求められます。\nまた、保険募集人(乗合代理店)には、法令に基づき、自らの所属保険会社等の保険商品について、顧客の最善の利益を勘案しつつ、公正な保険募集を行うことが求められています。そのため保険契約者等の保護の観点から、自らの規模や業務特性に見合った体制整備を図ることが必要と考えます。","theme":"体制整備","section":"保険業法施行規則","tags":["比較推奨","顧客の最善の利益"]},{"no":144,"location":"－","comment":"保険業法施行規則第227条の2第3項第4号ハの廃止により、コンプライアンスを確保するためには、乗合代理店が実質的に専属代理店となるか、代理店事業から撤退せざるを得なくなるおそれがある。\nこれは、地域密着で活動してきた代理店の存続を脅かし、結果として地域における相談窓口の減少や顧客利便性の低下につながるのではないか。\n93現場の実情を踏まえ、無理のない制度設計を求めたい。","pageStart":93,"pageEnd":94,"answer":"貴重なご意見として承ります。\n簡潔な説明や代理店への一任を希望する顧客に対しても、顧客が特に重視すると考えられる事項を例示するなど、可能な限り顧客の意向を把握したうえで、顧客の適切な商品選択の機会を確保することが求められます。\nまた、保険募集人(乗合代理店)には、法令に基づき、自らの所属保険会社等の保険商品について、顧客の最善の利益を勘案しつつ、公正な保険募集を行うことが求められています。そのため保険契約者等の保護の観点から、自らの規模や業務特性に見合った体制整備を図ることが必要と考えます。","theme":"体制整備","section":"保険業法施行規則","tags":["ハ方式","顧客の最善の利益"]},{"no":145,"location":"第227条の2第3項第4号","comment":"損害保険会社の代理店集約方針に伴い、専属代理店から移籍してきた保険募集人の多くが、移籍後も従前どおり特定の保険会社商品のみを販売している。\n比較推奨販売が必須となれば、十分な知識を有しない他社商品の説明を行うおそれがあり、それが顧客の最善の利益につながるのか疑問がある。\n十分な説明が可能になるまで募集を制限することや、他の保険募集人へ取次ぐ対応には、収入や報酬体系上の制約があり実務上困難である。\nこうした経緯を踏まえた配慮がなされないまま、保険業法施行規則第227条の2第3項第4号ハの廃止や比較説明の必須化により負担が急増することについて納得できない。","pageStart":94,"pageEnd":94,"answer":"貴重なご意見として承ります。\n簡潔な説明や代理店への一任を希望する顧客に対しても、顧客が特に重視すると考えられる事項を例示するなど、可能な限り顧客の意向を把握したうえで、顧客の適切な商品選択の機会を確保することが求められます。\nまた、保険募集人(乗合代理店)には、法令に基づき、自らの所属保険会社等の保険商品について、顧客の最善の利益を勘案しつつ、公正な保険募集を行うことが求められています。そのため保険契約者等の保護の観点から、自らの規模や業務特性に見合った体制整備を図ることが必要と考えます。","theme":"体制整備","section":"保険業法施行規則","tags":["比較推奨","ハ方式","顧客の最善の利益"]},{"no":146,"location":"－","comment":"比較推奨販売の適正化については、乗合代理店側では実務面、顧客においても商品格差も少なく、時間・心理的な負担が増加する。乗合保険会社を減らすしかなく、一方で、顧客の選択肢が減る事と整合性が取れない。既に各損害保険会社から今後の考え方(対代理店教育、管理、指導)がアナウンスされだしており、すべてを成立させる事は難度大。日本損害保険協会として取りまとめをお願いしたい。","pageStart":94,"pageEnd":94,"answer":"貴重なご意見として承ります。\n簡潔な説明や代理店への一任を希望する顧客に対しても、顧客が特に重視すると考えられる事項を例示するなど、可能な限り顧客の意向を把握したうえで、顧客の適切な商品選択の機会を確保することが求められます。\nまた、保険募集人(乗合代理店)には、法令に基づき、自らの所属保険会社等の保険商品について、顧客の最善の利益を勘案しつつ、公正な保険募集を行うことが求められています。そのため保険契約者等の保護の観点から、自らの規模や業務特性に見合った体制整備を図ることが必要と考えます。","theme":"体制整備","section":"保険業法施行規則","tags":["比較推奨","顧客の最善の利益"]},{"no":147,"location":"－","comment":"比較推奨販売の体制整備や保険会社各社のシステムやマニュアルを全店舗に導入する等負担が増えるため取り扱う保険会社を減らすという代理店が増えれば、お客様の意に反して選択肢を狭めることになってしまうのではないか。\n94","pageStart":94,"pageEnd":94,"answer":"貴重なご意見として承ります。\n簡潔な説明や代理店への一任を希望する顧客に対しても、顧客が特に重視すると考えられる事項を例示するなど、可能な限り顧客の意向を把握したうえで、顧客の適切な商品選択の機会を確保することが求められます。\nまた、保険募集人(乗合代理店)には、法令に基づき、自らの所属保険会社等の保険商品について、顧客の最善の利益を勘案しつつ、公正な保険募集を行うことが求められています。そのため保険契約者等の保護の観点から、自らの規模や業務特性に見合った体制整備を図ることが必要と考えます。","theme":"体制整備","section":"保険業法施行規則","tags":["比較推奨","顧客の最善の利益","システム・比較ツール"]},{"no":148,"location":"－","comment":"大型車の４社乗合代理店ですが、４社の見積りを作って出すのは業務負担が大きく、お客さんもかえって分かりにくくなってしまうのではないか。\nお客さんの要望・意向は聞いた上でこちら側が見繕うかたちでいいのではないか。","pageStart":95,"pageEnd":95,"answer":"貴重なご意見として承ります。\n簡潔な説明や代理店への一任を希望する顧客に対しても、顧客が特に重視すると考えられる事項を例示するなど、可能な限り顧客の意向を把握したうえで、顧客の適切な商品選択の機会を確保することが求められます。\nまた、保険募集人(乗合代理店)には、法令に基づき、自らの所属保険会社等の保険商品について、顧客の最善の利益を勘案しつつ、公正な保険募集を行うことが求められています。そのため保険契約者等の保護の観点から、自らの規模や業務特性に見合った体制整備を図ることが必要と考えます。","theme":"体制整備","section":"保険業法施行規則","tags":["顧客の最善の利益"]},{"no":149,"location":"－","comment":"比較推奨販売への対応負担が増加することを背景に、代理店が取り扱う保険会社数を縮小する動きが進んだ場合、結果として顧客の選択肢が狭まり、顧客利益が損なわれるおそれがあるため、制度設計および運用に当たっては、この点を十分に考慮すべきである。","pageStart":95,"pageEnd":95,"answer":"貴重なご意見として承ります。\n簡潔な説明や代理店への一任を希望する顧客に対しても、顧客が特に重視すると考えられる事項を例示するなど、可能な限り顧客の意向を把握したうえで、顧客の適切な商品選択の機会を確保することが求められます。\nまた、保険募集人(乗合代理店)には、法令に基づき、自らの所属保険会社等の保険商品について、顧客の最善の利益を勘案しつつ、公正な保険募集を行うことが求められています。そのため保険契約者等の保護の観点から、自らの規模や業務特性に見合った体制整備を図ることが必要と考えます。","theme":"体制整備","section":"保険業法施行規則","tags":["比較推奨","顧客の最善の利益"]},{"no":150,"location":"－","comment":"比較推奨販売は、顧客の最善の利益を勘案した説明義務の趣旨に沿い、顧客本位の提案を実現する上で有効である一方、説明内容の記録化や書類作成・保存等により、代理店の実務負担が増加することが想定される。\n今回の改正は一定の負担増を伴うものの、長期的には顧客からの信頼や満足度の向上といった効果も期待されるため、運用に当たっては、実務の実態を踏まえ、顧客・代理店双方に過度な負担が生じない柔軟で現実的な運用を願う。","pageStart":95,"pageEnd":95,"answer":"貴重なご意見として承ります。\n比較推奨販売に係る体制整備については、顧客の最善の利益を勘案しつつ、顧客の適切な商品選択の機会を確保するため、乗合代理店の規模や業務特性等に応じて、自社の募集実務や募集形態等を踏まえた適切な比較推奨販売が実施されるよう実効的な体制を整備することが重要と考えます。","theme":"体制整備","section":"保険業法施行規則","tags":["比較推奨","顧客の最善の利益","証跡・記録"]},{"no":151,"location":"－","comment":"比較推奨販売に関する社内規則等は、代理店の規模や業務特性を踏まえて体制構築することが求められているが、保険代理店業務を兼業するディーラー(兼業ディーラー)において、どのような内容・水準の社内規則を想定すればよいのか、そのイメージを示してほしい。\n95","pageStart":95,"pageEnd":96,"answer":"比較推奨販売に関する社内規則等としては、乗合代理店の規模や業務特性(専業・兼業の別など)等に応じて、自社の募集実務や募集形態等を踏まえつつ、適切な比較推奨販売が実施されるよう、例えば、顧客意向の把握方法、顧客が重視する事項の確認方法、提示・推奨する基準や理由の定め方、顧客への説明方法、記録・検証方法を定めることが考えられます。\nその上で、各店舗又は各保険募集人に対し教育・管理・指導を徹底することが重要であると考えます。\nただ、これら事項を定めるにあたって、手数料水準、販売目標、便宜供与、保険会社との取引関係等の代理店の都合により、顧客の意向に沿わない特定の保険契約へ誘導することのないよう留意する必要があります。","theme":"体制整備","section":"保険業法施行規則","tags":["便宜供与","手数料・インセンティブ","比較推奨","証跡・記録"]},{"no":152,"location":"第227条の2第3項第4号","comment":"2016年施行の改正保険業法において導入された保険業法施行規則第227条の2第3項第4号ハ(以下、ハ方式とする。)が廃止され、顧客の意向に沿った保険契約の提案が義務化されると理解している。\n他方、生命保険・損害保険ともに、ハ方式による保険契約の提案を行う場合であっても、顧客の意向を確認することは既に義務付けられていると理解しており、その過程を乗合代理店の態勢整備として記録することも既に求められていると認識している。\n従前より意向把握のプロセスにおける証跡は必須であったという理解で相違ないか。また、その場合、今般の改正の意図を伺いたい。","pageStart":96,"pageEnd":96,"answer":"ご意見のとおり、これまでも保険募集人においては、保険業法第294条の2に基づき、顧客の意向を把握し、当該意向に沿った保険契約の提案、契約内容の説明及び顧客の意向と契約内容が合致していることを確認する機会の提供が求められてきました。\nまた、監督指針においても、意向把握・確認が適切に行われているかを事後的に確認・検証できるよう、必要な記録・証跡等を保存する態勢整備を求めています。\n今回の見直しは、こうした従前の考え方を前提としつつ、乗合代理店における比較推奨販売について、代理店の都合やあらかじめ定めた推奨方針により保険契約が選別される運用ではなく、顧客の意向に沿って選別し、提示・推奨が適切に行われるよう改正するものです。\nあわせて、比較推奨販売の適切性を事後的に確認・検証し、必要な改善につなげるため、記録・証跡等の保存に係る考え方を監督指針上明確化するものです。したがって、本改正は、従来の意向把握・確認義務や記録保存の考え方を変更するものではなく、比較推奨販売における顧客意向を踏まえた運用と、その実効性確保を明確化する趣旨です。","theme":"証跡保存","section":"保険業法施行規則","tags":["比較推奨","ハ方式","意向把握","証跡・記録"]},{"no":153,"location":"－","comment":"比較推奨販売に係る記録・証跡について、具体的な内容や水準が必ずしも明確でない。\n96実務上は顧客の意向把握の結果、推奨理由の要点、顧客への説明内容の概要等を一定の形式で記録することが求められているが、過度に詳細な記録を求めることは現場負担の増大や説明の形式化につながるおそれがある。実効性と業務効率性のバランスを踏まえ、最低限求められる記録や証跡の考え方、乗合代理店の規模・業務特性に応じた柔軟な運用の可否について考え方や着眼点を示してほしい。","pageStart":96,"pageEnd":97,"answer":"比較推奨販売に係る記録・証跡等は、顧客の意向を踏まえた比較・選別・推奨が適切に行われているかを事後的に確認・検証し、必要な改善につなげるためのものです。\nこのため、全ての案件について詳細かつ網羅的な記録を一律に求めるものではありません。\n乗合代理店においては、自社の規模・業務特性、募集形態等を踏まえ、顧客の主な意向、顧客の属性、比較・選別の対象範囲、提示・推奨の基準や理由、説明内容の概要等について、事後的に確認・検証できる合理的な水準で記録・保存することが重要です。\n記録作成自体が目的化することなく、顧客本位の業務運営の実効性を確保する観点から、実務に即した効率的かつ効果的な体制整備が行われることが求められます。","theme":"証跡保存","section":"保険業法施行規則","tags":["比較推奨","意向把握","証跡・記録"]},{"no":154,"location":"－","comment":"比較推奨販売等に係る証跡保存の必要性は理解しているが、顧客や現場の負担を抑えるため、契約書内で顧客の意思や説明実施の確認ができるようにするなど、証跡管理の負担を最小限にとどめるようお願いしたい。","pageStart":97,"pageEnd":97,"answer":"比較推奨販売に係る記録・証跡等は、顧客の意向を踏まえた適切な募集が行われているかを事後的に確認・検証し、必要な改善につなげるためのものです。\nそのため、証跡の保存方法について、特定の様式や方法を一律に求めるものではありません。契約書その他の書面又は電子的な手続の中で、顧客の主な意向、説明実施の事実、提示・推奨の基準や理由等が事後的に確認できるのであれば、そのような方法も認められるものと考えます。\n乗合代理店においては、募集実態に応じて、比較推奨販売の適切性を確認・検証できる合理的な証跡管理を行うことが重要です。","theme":"証跡保存","section":"保険業法施行規則","tags":["比較推奨","証跡・記録"]},{"no":155,"location":"－","comment":"顧客意向に基づく選別の過程(プロセス)の記録及び客観的基準による絞り込みについて、保険募集人の主観や知識不足は、特定の保険会社への誘導(癒着・談合構造の温存)を招くリスクがある。監督指針Ⅱ－4－2が求める「事後的検証可能性」を、実効性をもって確保するには、定型化・標準化97されたロジックによる選別と、そのログデータの保存が、大規模乗合代理店として不可欠な管理態勢(ガバナンス)であると理解してよいか。\nなお、生命保険分野においては、比較推奨システムなど、複数の事業者において以下のプロセスが既に実装されている。\n・定型化・標準化された意向項目の設定・商品スペックデータの定期更新並びに新商品等データの追加・定型化・標準化されたロジックによる選別・選別理由の画面表示・証跡化・ログによるシステム的な事後検証当該仕組みにより、保険募集人の主観や知識に依存しない選別が実現しており、監督指針が求める「客観性」及び「事後的検証可能性」を実務上確保できている。\nしたがって、損害保険領域においても、比較推奨の質を確保し、制度趣旨である顧客本位の業務運営及び適切な商品選択の機会の提供を、実効性をもって担保する観点からは、生命保険領域で既に検証された同様の枠組みを適用することが可能であり、またそれが顧客の最善の利益に資すると考えるが如何か。","pageStart":97,"pageEnd":98,"answer":"比較推奨販売においては、顧客の意向に沿って、合理的かつ一定の具体性を有する基準や理由等に基づき、保険契約を選別し、提示・推奨が行われることが重要です。\nそのため、意向項目、商品データ、選別ロジック、選別理由、ログ等を標準化・システム化し、事後的に確認・検証可能な態勢を整備することは、保険募集人の主観に過度に依存しない運用を確保する上で、有効な方法の一つと考えられます。\n一方で、監督指針は、特定のシステムや選別ロジックの導入を一律に求めるものではありません。各乗合代理店においては、自社の規模・業務特性、取扱商品、募集形態等を踏まえ、顧客の意向に沿った比較推奨販売が適切に行われ、その適切性を事後的に確認・検証できる実効的な態勢を整備することが求められます。\nまた、システムを利用する場合であっても、商品データの正確性・更新性、選別ロジックの合理性、顧客意向との整合性、特定の保険会社への不当な偏りの有無等について、継続的に確認・検証し、必要に応じて改善することが重要です。","theme":"証跡保存","section":"保険業法施行規則","tags":["比較推奨","顧客の最善の利益","証跡・記録","更改・継続","システム・比較ツール"]},{"no":156,"location":"第227条の2第3項第4号","comment":"顧客の意向確認の証跡はどのように残すべきか。また、非対面募集(電話募集など)の場合は、どのような証跡が必要か。さらに、今後ガイドライン等が作成されることの必要性について見解を伺いたい。\n98","pageStart":98,"pageEnd":98,"answer":"比較推奨販売に係る記録・証跡等については、比較推奨販売の実施状況の適切性を事後的に確認・検証し、必要に応じて改善することが重要であることから、その確認・検証に資する記録や証跡等を作成・保存する体制を整備することを求めたものであり、保存内","theme":"証跡保存","section":"保険業法施行規則","tags":["比較推奨","意向把握","証跡・記録"]},{"no":157,"location":"第227条の2第3項第4号","comment":"意向把握に係る証跡について、保存すべき具体的項目を明確にしてほしい。また、証跡は顧客の署名付き書面である必要があるのか、電子保存でもよいのかを示してほしい。","pageStart":99,"pageEnd":99,"answer":"容、保存媒体、保存方法、保存期間等について、一律の方法や水準を定めるものではありません。\n各乗合代理店において、自社の規模・業務特性、募集形態、取扱商品等を踏まえ、合理的かつ実効的な態勢を整備することが重要です。\n保存内容については、顧客の主な意向、意向把握の方法、比較・選別の対象範囲、提示・推奨した保険契約、提示・推奨の基準や理由、顧客への説明内容の概要等を記録することが考えられます。当該募集が顧客の意向に沿って合理的に行われたかを、事後的に確認できる程度の記録・証跡が必要です。ただし、顧客との全ての発言、応答、反応や、乗合代理店の詳細な判断過程を網羅的に記録することを一律に求めるものではありませんが、顧客の意向が変化した場合など、最終的な提示・推奨又は申込内容との関係を説明する上で重要な事情は、必要な範囲で記録することが望ましいと考えます。\n保存媒体・保存形式については、紙媒体に限りません。電子データ、システム入力記録、音声データ、録画データ等を用いることも考えられます。また、顧客の署名・押印付き書面を一律に求めるものではありません。事後的に客観的な確認・検証が可能な方法で保存されていれば足りるものと考えます。\n保存方法については、比較説明時に使用したパンフレット、見積書、チェックリスト、意向確認シート、推奨判断結果シート等を保存する方法も考えられます。その上で、比較ポイントや提示・推奨理由を要約して記録する方法も、事後検証が可能であれば差し支えありません。また、記録システム等におけるプルダウン方式による記録も活用し得ます。ただし、選択肢のみでは顧客意向や推奨理由との関係を十分に確認できない場合には、必要に応じて補足記録を行うことが重要です。\n保存期間については、法令等に特段の定めがある場合を除き、一律の期間を求めるものではありません。各乗合代理店において、契約の性質、保険期間、募集形態、苦情・紛争対応、顧客保護、個人情報保護、事後検証の必要性等を踏まえ、合理的な保存期間を社内規則等で定め、適切に運用することが重要です。\n非対面募集についても、募集実態に応じた合理的な方法で記録・保存することが重要です。例えば、通話記録、システム入力記録、電子的な意向確認結果等により、顧客の意向確認や説明内容を事後的に確認できる態勢を整備することが考えられます。\n確認・検証方法については、全件確認を一律に求めるものではありません。乗合代理店の規模・業務特性、募集形態、苦情・不祥事の発生状況、特定の保険会社又は特定の保険契約への偏り、保険募集人・拠点ごとの傾向等を踏まえる必要があると考えます。その上で、サンプリングや重点確認を含むリスクベースの方法により、効率的かつ実効的に確認・検証することが考えられます。確認・検証の結果、課題が認められた場合には、保険募集人への教育・管理・指導、社内規則や記録方法の見直し等、必要な業務改善につなげることが求められます。\nなお、意向把握・確認義務に係る体制整備については、Ⅱ－4－2－2(3)④や上記の考え方を踏まえ、自社の規模・業務特性等に応じ、合理的かつ実効的な態勢を整備することが重要です。\n金融庁として、比較推奨販売に係る記録や証跡等の保存について、一律の記録フォーマット、記載項目、保存媒体、保存期間又は確認・検証方法を定めるものではありません。各乗合代理店においては、形式的な記録作成に偏らず、実効的な記録・検証態勢を整備することが重要であり、顧客本位の業務運営が実質的に確保されることが重要と考えます。","theme":"証跡保存","section":"保険業法施行規則","tags":["比較推奨","意向把握","証跡・記録","システム・比較ツール"]},{"no":158,"location":"第227条の2第3項第4号","comment":"監督指針Ⅱ－4－2－9(5)②ウ.について、比較推奨販売に係る記録・証跡は具体的にどの程度の内容を記録・保存すべきか具体的に伺いたい。","pageStart":99,"pageEnd":99,"answer":"容、保存媒体、保存方法、保存期間等について、一律の方法や水準を定めるものではありません。\n各乗合代理店において、自社の規模・業務特性、募集形態、取扱商品等を踏まえ、合理的かつ実効的な態勢を整備することが重要です。\n保存内容については、顧客の主な意向、意向把握の方法、比較・選別の対象範囲、提示・推奨した保険契約、提示・推奨の基準や理由、顧客への説明内容の概要等を記録することが考えられます。当該募集が顧客の意向に沿って合理的に行われたかを、事後的に確認できる程度の記録・証跡が必要です。ただし、顧客との全ての発言、応答、反応や、乗合代理店の詳細な判断過程を網羅的に記録することを一律に求めるものではありませんが、顧客の意向が変化した場合など、最終的な提示・推奨又は申込内容との関係を説明す
