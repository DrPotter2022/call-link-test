グや重点確認を含むリスクベースの方法により、効率的かつ実効的に確認・検証することが考えられます。確認・検証の結果、課題が認められた場合には、保険募集人への教育・管理・指導、社内規則や記録方法の見直し等、必要な業務改善につなげることが求められます。\n金融庁として、比較推奨販売に係る記録や証跡等の保存について、一律の記録フォーマット、記載項目、保存媒体、保存期間又は確認・検証方法を定めるものではありません。各乗合代理店においては、形式的な記録作成に偏らず、実効的な記録・検証態勢を整備することが重要であり、顧客本位の業務運営が実質的に確保されることが重要と考えます。","theme":"証跡保存","section":"監督指針","tags":["比較推奨","ハ方式","意向把握","証跡・記録","システム・比較ツール"]},{"no":695,"location":"Ⅱ－4－2－9(5)","comment":"顧客意向に沿った契約条件によっては、保険料試算に保険会社の承認が必要となり、すぐに試算・加入できない場合がある。顧客がすぐに加入できる保険契約を希望する場合、乗合代理店がその場で試算・加入可能な保険契約に限定して推奨することは許容されるか。\nその場合、保険募集人が選定しなかった理由として、その場ですぐに試算・加入できない保険契約であったこと、顧客が即時加入を希望していたことを記録として残せば、証跡として足りるかを確認したい。\n390","pageStart":390,"pageEnd":391,"answer":"保険会社及び乗合代理店においては、取り扱う保険契約について、顧客の選択に支障を来さないよう必要な説明や保険料試算等を適時・適切に行える態勢を整備することが重要です。\nその上で、顧客が即時加入を希望している場合であっても、即時の試算・加入の可否のみならず、保障(補償)内容、特約等の商品特性や保険料水準等の顧客が重視する事項に関する意向を把握し、当該意向に沿って、合理的かつ一定の具体性を有する基準や理由等に基づき保険契約を選別し、提示・推奨することも重要です。\nこの場合には、即時の試算・加入の可否に係る判断についても、客観的かつ合理的な理由に基づくものであり、代理店の都合のみで特定の保険契約を優先するものとならないよう留意する必要があります。\n証跡としては、商品特性に関する顧客の意向やそれに対応する推奨理由等のほか、顧客が即時加入を希望していたこと、各保険契約の即時の試算・加入可否の判断理由及び当該理由も踏まえて提示・推奨対象を限定した経緯についても事後的に確認・検証できる程度に記録しておくことが重要です。","theme":"証跡保存","section":"監督指針","tags":["証跡・記録"]},{"no":696,"location":"Ⅱ－4－2－9(5)","comment":"保険会社が日常の指導や代理店監査等を通じて、乗合代理店における比較推奨販売に関する体制整備の状況を確認する際には、乗合代理店の管理する資料や証跡・記録等に、当該乗合代理店又は他の保険会社等の機密情報、当該保険会社の顧客でない者の個人情報が含まれ得ることに十分留意し、監督指針Ⅱ－4－2－9(5)②ア.～エ.の遂行状況を確認することも選択肢と考えるが、その理解でよいか。","pageStart":391,"pageEnd":391,"answer":"ご理解のとおり、保険会社が代理店監査等を通じて乗合代理店の比較推奨販売に係る体制整備状況を確認する際には、当該乗合代理店又は他の保険会社等の機密情報、当該保険会社の顧客ではない者の個人情報等が含まれ得ることに留意する必要があります。\nそのため、保険会社においては、確認の目的に照らして必要かつ相当な範囲で、マスキング、匿名化、データの抽出を代理店に指示した上での確認や、体制整備状況を確認する等の方法を用いることも考えられます。\n一方で、機密情報や個人情報に関して適切に配慮しつつ、確認・検証が形骸化しないよう、保険会社は、乗合代理店に対する教育・管理・指導の実効性を確保する観点から、比較推奨販売に係る体制整備状況を適切に確認する必要があります。","theme":"証跡保存","section":"監督指針","tags":["比較推奨","証跡・記録"]},{"no":697,"location":"Ⅱ－4－2－9(5)","comment":"比較推奨販売の適正化に当たっては、現場実務として対応可能な範囲での制度設計が不可欠である。\n全ての案件において画一的な全社比較や詳細な説明・記391録を求めると、形式的対応が増え、制度が形骸化するおそれがある。\n小口案件、更新案件、短時間での来店・電話対応等、実務上の多様なケースを踏まえ、比較の深さや範囲に柔軟性を持たせた運用が必要である。現場で守れない制度とならないよう配慮した設計を求める。","pageStart":391,"pageEnd":392,"answer":"比較推奨販売の適正化については、全ての案件について、取扱保険会社全社の商品を画一的に比較し、又は詳細な説明・記録を一律に求めるものではありません。\n乗合代理店においては、保険業法施行規則第227条の2第3項第4号の趣旨を踏まえ、顧客の意向、属性、理解度、保険商品の性質、募集形態、取引規模等に応じて、顧客の判断に必要な情報を分かりやすく提供することが重要です。\nまた、比較推奨販売に係る記録・証跡は、当該販売の適切性を事後的に確認・検証し、必要な改善につなげるために重要ですが、全件について説明内容や判断過程を網羅的・詳細に記録することを一律に求めるものではありません。乗合代理店においては、自社の規模・業務特性、募集形態等を踏まえ、顧客の主な意向、比較・選別の対象範囲、提示・推奨の基準や理由等を事後的に確認できる程度の記録を、創意工夫のもと合理的な方法で保存する態勢を整備することが重要です。\nまた、顧客の意向や希望を踏まえ、形式的な対応に偏ることなく、顧客の理解と利便性に配慮した効率的かつ実効的な対応が求められます。\n金融庁としても、形式的な書面作成や記録保存にとどまらず、顧客本位の業務運営が実質的に確保されているかという観点から、乗合代理店の規模・業務特性等も踏まえ、適切にモニタリングしてまいります。","theme":"証跡保存","section":"監督指針","tags":["比較推奨","証跡・記録","更改・継続"]},{"no":698,"location":"Ⅱ－4－2－9(5)","comment":"比較推奨販売の説明内容や判断理由を、事後的に検証可能な形で記録すること自体は重要と理解している。一方で、履歴入力や記録義務の強化は現場の業務負担を確実に増加させる。特に中小代理店では、人員・時間に制約がある中で、長時間労働につながる可能性が高まる。制度趣旨を損なわずに定着させるためには、負担増を前提とした配慮や、実務面での支援策と併せて検討されるべきと考える。","pageStart":392,"pageEnd":392,"answer":"比較推奨販売の適正化については、全ての案件について、取扱保険会社全社の商品を画一的に比較し、又は詳細な説明・記録を一律に求めるものではありません。\n乗合代理店においては、保険業法施行規則第227条の2第3項第4号の趣旨を踏まえ、顧客の意向、属性、理解度、保険商品の性質、募集形態、取引規模等に応じて、顧客の判断に必要な情報を分かりやすく提供することが重要です。\nまた、比較推奨販売に係る記録・証跡は、当該販売の適切性を事後的に確認・検証し、必要な改善につなげるために重要ですが、全件について説明内容や判断過程を網羅的・詳細に記録することを一律に求めるものではありません。乗合代理店においては、自社の規模・業務特性、募集形態等を踏まえ、顧客の主な意向、比較・選別の対象範囲、提示・推奨の基準や理由等を事後的に確認できる程度の記録を、創意工夫のもと合理的な方法で保存する態勢を整備することが重要です。\nまた、顧客の意向や希望を踏まえ、形式的な対応に偏ることなく、顧客の理解と利便性に配慮した効率的かつ実効的な対応が求められます。\n金融庁としても、形式的な書面作成や記録保存にとどまらず、顧客本位の業務運営が実質的に確保されているかという観点から、乗合代理店の規模・業務特性等も踏まえ、適切にモニタリングしてまいります。","theme":"証跡保存","section":"監督指針","tags":["比較推奨","証跡・記録"]},{"no":699,"location":"Ⅱ－4－2－9(5)","comment":"比較推奨販売の適切性を確認・検証するため、所属保険会社や契約内容、提案・推奨理由等について、合理的かつ一定の具体性を有する説明や記録を行うことが求められている。\nしかし、このような一連の対応は、顧客を長時間拘束することとなり、顧客の負担増につながるおそれがあると考えられる。顧客負担との関係について、金融庁の考え方を確認したい。","pageStart":392,"pageEnd":392,"answer":"比較推奨販売の適正化については、全ての案件について、取扱保険会社全社の商品を画一的に比較し、又は詳細な説明・記録を一律に求めるものではありません。\n乗合代理店においては、保険業法施行規則第227条の2第3項第4号の趣旨を踏まえ、顧客の意向、属性、理解度、保険商品の性質、募集形態、取引規模等に応じて、顧客の判断に必要な情報を分かりやすく提供することが重要です。\nまた、比較推奨販売に係る記録・証跡は、当該販売の適切性を事後的に確認・検証し、必要な改善につなげるために重要ですが、全件について説明内容や判断過程を網羅的・詳細に記録することを一律に求めるものではありません。乗合代理店においては、自社の規模・業務特性、募集形態等を踏まえ、顧客の主な意向、比較・選別の対象範囲、提示・推奨の基準や理由等を事後的に確認できる程度の記録を、創意工夫のもと合理的な方法で保存する態勢を整備することが重要です。\nまた、顧客の意向や希望を踏まえ、形式的な対応に偏ることなく、顧客の理解と利便性に配慮した効率的かつ実効的な対応が求められます。\n金融庁としても、形式的な書面作成や記録保存にとどまらず、顧客本位の業務運営が実質的に確保されているかという観点から、乗合代理店の規模・業務特性等も踏まえ、適切にモニタリングしてまいります。","theme":"証跡保存","section":"監督指針","tags":["比較推奨","証跡・記録"]},{"no":700,"location":"Ⅱ－4－2－9(5)","comment":"改正案は「顧客本位の業務運営」及び「競争環境の健全化」を目的としており、現場の実務負荷や乗合代理店の実態を十分に踏まえた内容になっていないと考える。保険は392社会生活に不可欠なインフラであり、その提供を担う保険代理店や保険募集人が健全に業務を行える環境が整ってこそ、初めて顧客本位が実現するものと考える。\n意向把握や比較推奨、体制整備に関する書類や証跡の作成業務が大幅に増加することによって、顧客との対話時間の減少、意向把握や説明の形式化、顧客への商品説明が拙速となり理解が不十分となること、更新やアフターフォローの後回しなどかえって顧客本位を損なうおそれがある。\n実務上、達成困難な要件は、形式的な対応となり、実態と乖離した帳票の作成、証跡作成を目的とした書類の作成、内部監査の形骸化、虚偽報告等不正リスクを高める結果につながる。規制強化が不正防止につながるとは限らず、逆効果となる可能性を十分に考慮すべきである。\n保険は任意契約であっても、実質的には社会生活に不可欠なインフラであると考えている。インフラを支える保険代理店・保険募集人が過度な負担を強いられ疲弊すれば、以下のような社会的リスクが高まる。\n・説明不足によるトラブル増加・更新漏れや手続きミスの増加・苦情件数の増加・顧客の保険加入率低下・社会全体のリスク耐性の低下制度設計においては、現場の負荷が社会全体に波及する影響を重く見る必要がある。\nついては、以下のとおり現実的かつ実効性のある制度設393計をお願いしたい。\n(1)書類・証跡の簡素化・証跡は「必要最小限」に限定する・書類の量ではなく、プロセスの実質を評価する(2)代理店規模に応じた段階的な義務設定・大規模代理店と中小代理店を同一基準で縛らない・実務負荷に応じた合理的な要求水準を設定する(3)現場の声を制度設計に反映する仕組みの構築・保険代理店・保険募集人の意見を継続的に吸い上げる仕組み・実務者との対話を通じた制度の改善・書類中心ではなく、顧客との対話を重視する評価軸の導入顧客本位の業務運営を実現するためには、制度の理念だけでなく、現場が健全に働ける環境が不可欠であることから、金融庁には、現場の実態を踏まえた現実的で実効性のある制度設計を強く求める。","pageStart":392,"pageEnd":394,"answer":"比較推奨販売の適正化については、全ての案件について、取扱保険会社全社の商品を画一的に比較し、又は詳細な説明・記録を一律に求めるものではありません。\n乗合代理店においては、保険業法施行規則第227条の2第3項第4号の趣旨を踏まえ、顧客の意向、属性、理解度、保険商品の性質、募集形態、取引規模等に応じて、顧客の判断に必要な情報を分かりやすく提供することが重要です。\nまた、比較推奨販売に係る記録・証跡は、当該販売の適切性を事後的に確認・検証し、必要な改善につなげるために重要ですが、全件について説明内容や判断過程を網羅的・詳細に記録することを一律に求めるものではありません。乗合代理店においては、自社の規模・業務特性、募集形態等を踏まえ、顧客の主な意向、比較・選別の対象範囲、提示・推奨の基準や理由等を事後的に確認できる程度の記録を、創意工夫のもと合理的な方法で保存する態勢を整備することが重要です。\nまた、顧客の意向や希望を踏まえ、形式的な対応に偏ることなく、顧客の理解と利便性に配慮した効率的かつ実効的な対応が求められます。\n金融庁としても、形式的な書面作成や記録保存にとどまらず、顧客本位の業務運営が実質的に確保されているかという観点から、乗合代理店の規模・業務特性等も踏まえ、適切にモニタリングしてまいります。","theme":"証跡保存","section":"監督指針","tags":["比較推奨","意向把握","証跡・記録","更改・継続"]},{"no":701,"location":"Ⅱ－4－2－9(5)","comment":"比較推奨販売の適切性を確認・検証するために保存が求められる記録や証跡について、顧客から明示的な意向が示されない場合に限らず、全てのケースで記録・証跡を残すことが原則と理解してよいかを確認したい。記録・証跡の作成を一部のケースに限定すると、適切な事後検証に支障を来すのではないか、との懸念がある。\n394","pageStart":394,"pageEnd":394,"answer":"比較推奨販売の適切性等の確認・検証に当たっては、顧客の意向が明示されるかどうかに関わらず、比較推奨販売が行われた全ての場合において、事後的な確認・検証が可能となるよう必要な記録や証跡等が整備・保存されていることが必要です。\nただし、全ての案件について詳細かつ網羅的な記録や証跡等を一律に求めるものではなく、募集実務や契約の性質等を踏まえ、事後的な確認・検証が可能となる水準で整理・保存される必要があると考えます。","theme":"証跡保存","section":"監督指針","tags":["比較推奨","証跡・記録"]},{"no":702,"location":"Ⅱ－4－2－9(5)","comment":"比較推奨販売に係る証跡の保存・検証態勢について、保険会社ごとに異なるシステムが提供されている現状は、乗合代理店にとって過度な事務負担と管理の複雑化を招いている。\n業界団体(協会等)主導による標準的なシステムの推奨や保険会社間でのデータ形式の統一化に向けた当局の働きかけが望まれる。\n監督指針Ⅱ－4－2－9(5)②ウ.(注)では「顧客の意向や属性に応じた比較推奨販売に係る説明が適切に行われているか確認・検証できるものであること」と記載されているが、現在の実務では、保険会社ごとに保存形式や検証項目が統一されていないことから、乗合代理店において効率的かつ効果的な確認・検証を行うためには、乗合代理店が複数の保険会社の情報を一元管理できる環境が不可欠であると考える。\n保険会社ごとに異なるシステム対応を強いられることは、乗合代理店の規模や業務特性によっては、本質的な顧客保護に充てるべきリソースを事務作業に充てざるを得ない状況となってしまう。\n保険業法第294条の3の趣旨を真に反映させるためにも、業界標準となるシステム基準の策定や、プラットフォームの共通化に向けた指導を検討いただきたい。","pageStart":395,"pageEnd":395,"answer":"貴重なご意見として承ります。\n今般の監督指針改正は、特定のシステムやデータ形式の統一を一律に求めるものではなく、保険募集人が規模や業務特性等に応じて実効性のある体制を構築することを求めるものです。","theme":"証跡保存","section":"監督指針","tags":["比較推奨","証跡・記録","システム・比較ツール"]},{"no":703,"location":"Ⅱ－4－2－9(5)","comment":"顧客意向の記録・保管について、乗合代理店の実務に過度な負担とならないルール作りが必要である。あわせて、簡便に対応可能なプラットフォームの提示や提供を要望395する。","pageStart":395,"pageEnd":396,"answer":"貴重なご意見として承ります。\n今般の監督指針改正は、特定のシステムやデータ形式の統一を一律に求めるものではなく、保険募集人が規模や業務特性等に応じて実効性のある体制を構築することを求めるものです。","theme":"証跡保存","section":"監督指針","tags":["証跡・記録","システム・比較ツール"]},{"no":704,"location":"Ⅱ－4－2－9(5)","comment":"監督指針の改正案については損害保険会社において幅広く解釈されており、乗合代理店の体制整備に関して異なる対応が求められている。\nまた、現下の人手不足の状況において、取引先も含め全ての乗合代理店が必要な人員を確保出来るかについては、早期の実現可能性に懸念があると考えている。\n体制整備について規模や取扱い保険ごとに基準を示していただきたい。\nまた、損害保険会社を問わず共通して使用可能な意向確認の記録方法について、業界全体での統一的な検討をお願いしたい。","pageStart":396,"pageEnd":396,"answer":"貴重なご意見として承ります。\n今般の監督指針改正は、特定のシステムやデータ形式の統一を一律に求めるものではなく、保険募集人が規模や業務特性等に応じて実効性のある体制を構築することを求めるものです。","theme":"証跡保存","section":"監督指針","tags":["意向把握","証跡・記録","システム・比較ツール"]},{"no":705,"location":"Ⅱ－4－2－9(5)","comment":"比較推奨販売における説明内容を記録として残す重要性は認識しているが、現場では、どのような方法で提案・説明を行った証拠を残せばよいのかが不明確である。\n書面・電子記録など様々な手段が考えられる中で、業界として一定の基準や推奨される方法が示されれば、より適切な対応が可能になる。比較推奨に係る説明の記録方法について、実務を踏まえた共通のガイドライン等の整備を検討いただきたい。","pageStart":396,"pageEnd":396,"answer":"貴重なご意見として承ります。\n今般の監督指針改正は、特定のシステムやデータ形式の統一を一律に求めるものではなく、保険募集人が規模や業務特性等に応じて実効性のある体制を構築することを求めるものです。","theme":"証跡保存","section":"監督指針","tags":["比較推奨","証跡・記録","システム・比較ツール"]},{"no":706,"location":"Ⅱ－4－2－9(5)","comment":"比較推奨販売の適切性を事後的に検証するための記録や証跡の保存期間について、適切な保存期間や保存内容を具体的に示した明確なガイドライン・指針を整備すべきではないか。\n396","pageStart":396,"pageEnd":396,"answer":"貴重なご意見として承ります。\n今般の監督指針改正は、特定のシステムやデータ形式の統一を一律に求めるものではなく、保険募集人が規模や業務特性等に応じて実効性のある体制を構築することを求めるものです。","theme":"証跡保存","section":"監督指針","tags":["比較推奨","証跡・記録","システム・比較ツール"]},{"no":707,"location":"－","comment":"比較推奨販売の見直しにより、代理店独自の基準で推奨する保険業法施行規則第227条の2第3項第4号ハが廃止され、顧客の意向把握に基づき保険契約の絞り込みを行う運用が求められることは理解している。\n一方で複数保険会社における契約整理、推奨理由の記録、社内規程やシステム整備には相当の準備期間が必要であり、準備期間が短い場合には現場混乱や顧客対応品質の低下、取扱保険会社の縮小につながるおそれがある。\nまた、顧客の意向確認と証跡保存がより重要となることから、保険募集人・顧客双方の負担が増大する懸念がある。\n顧客の意向を確認したことを証明することの法令上の根拠や要件が分かりにくく、適切に対応できているかを客観的に証明することが難しいことから、明確なルールや統一的な様式・基準・考え方を提供いただきたい。","pageStart":397,"pageEnd":397,"answer":"貴重なご意見として承ります。\n今般の監督指針改正は、特定のシステムやデータ形式の統一を一律に求めるものではなく、保険募集人が規模や業務特性等に応じて実効性のある体制を構築することを求めるものです。","theme":"証跡保存","section":"監督指針","tags":["比較推奨","ハ方式","意向把握","証跡・記録","システム・比較ツール"]},{"no":708,"location":"－","comment":"比較推奨販売に係る記録・証跡の保存期間などの社内規則等への反映や、それに基づく比較推奨販売の適切性の効果的かつ効率的な確認・検証が検討されているが、記録・証跡のフォーマット、最低限必要となる項目を明確化していただきたい。\n保険会社が乗合代理店にフォーマットを提示することは、乗合代理店が保険会社を選定した記録を残す趣旨に照らし適切でない可能性がある。\n乗合代理店が自社の比較推奨販売方針に基づきフォーマットを策定することが望ましいが、システム構築に時間・労力がかかることが想定され、十分な手当てができな397い懸念がある。","pageStart":397,"pageEnd":398,"answer":"貴重なご意見として承ります。\n今般の監督指針改正は、特定のシステムやデータ形式の統一を一律に求めるものではなく、保険募集人が規模や業務特性等に応じて実効性のある体制を構築することを求めるものです。","theme":"証跡保存","section":"監督指針","tags":["比較推奨","証跡・記録","システム・比較ツール"]},{"no":709,"location":"Ⅱ－4－2－9(5)","comment":"多くの保険会社を取り扱う乗合代理店については、全ての保険会社の試算結果を提示して、それぞれ2つずつ説明するのは現実的ではない。\n例えば、「保険料重視の顧客意向に沿って、一般的な消費者が求めるであろう補償内容を基準として、同等の補償内容で複数保険会社の保険料をあらかじめ比較し、保険料水準において安い上位○社で提案した」というような根拠を示したうえで、その見積書を証跡として顧客へ確認した事実として残すことは認められるか。\n398","pageStart":398,"pageEnd":399,"answer":"顧客が保険料水準を重視する意向を有する場合に、保障(補償)\n内容、特約、保険金額、免責金額、保険期間、対象リスク等の前提条件を可能な限り同一又は近似の条件にした上で、複数保険会社の保険料を比較し、その結果を提示・推奨理由の一つとすることは考えられます。その際は、比較説明及び推奨販売に該当し得ることから、Ⅱ－4－2－9(5)①A.及びB.に照らして、適切に顧客に説明する必要があります。\nただし、当該取扱いに当たっては、比較の前提となる保障(補償)条件、選定方法、対象保険会社の範囲及び保険料算定条件が合理的である必要があります。また、特定の保険会社又は特定の保険契約を恣意的に優先する目的で行われることは適切ではありません。\nあらかじめ設定した保障(補償)条件による試算である場合には、その前提条件、実際の契約条件と異なり得ること、保険料改定等により結果が変動し得ること、前提となる保障(補償)条件に差異がある場合には、その内容や保険料に影響する要素を、顧客に分かりやすく説明する必要があります。\nまた、提示・推奨理由、顧客への説明内容等について、事後的に確認・検証できるよう適切に記録・保存することが重要です。\n比較推奨販売に係る記録・証跡等については、比較推奨販売の実施状況の適切性を事後的に確認・検証し、必要に応じて改善することが重要であることから、その確認・検証に資する記録や証跡等を作成・保存する体制を整備することを求めたものであり、保存内容、保存媒体、保存方法、保存期間等について、一律の方法や水準を定めるものではありませんが、例えばご意見にあるような比較に用いた見積書や資料等を保存する方法も考えられます。","theme":"証跡保存","section":"監督指針","tags":["比較推奨","証跡・記録"]},{"no":710,"location":"Ⅱ－4－2－9(5)","comment":"比較推奨販売に係る記録や証跡の保存に関し、個人情報保護法で求められる個人情報の管理・保管・廃棄の考え方と、金融庁が想定する管理の在り方に乖離があるように思われる。\n記録や証跡の保管ルールや廃棄ルールについて、より明確な考え方を示してほしい。","pageStart":399,"pageEnd":399,"answer":"比較推奨販売に係る記録や証跡等の保存については、比較推奨販売の適切性を事後的に確認・検証することを可能とするために必要となる範囲で、記録や証跡等を作成・保存する体制を整備することを求める趣旨であり、保存期間や廃棄時期を一律に定めるものではありません。\nなお、現行のⅡ－4－2－2(3)④ア.においては、意向把握に係る体制整備の一環として、意向把握に用いた帳票等を保存する措置を講じることを求めているところであり、その際も、注記において、個人情報の取扱いについては、個人情報保護法等の関係法令を遵守する必要がある旨を明記しています。\n今般の比較推奨販売に係る記録や証跡等の保存についても、比較推奨販売の適切性を事後的に確認・検証するために必要となる範囲で、記録や証跡等を作成・保存する体制を整備することを求めるものであり、その管理・保管の取扱いについては、個人情報保護法の趣旨や関係法令、各社の社内規程に基づき、整合的に判断・運用されることが前提となります。","theme":"証跡保存","section":"監督指針","tags":["比較推奨","意向把握","証跡・記録"]},{"no":711,"location":"Ⅱ－4－2－9(5)","comment":"【意見の趣旨】今回の改正は不祥事を受けた顧客保護強化として理解するが、規制アプローチに根本的な問題がある。問題の本質は「便宜供与による販売の歪み」であるにもかかわらず、改正案は「個別販売記録の強化」に偏重しており、実効性と現場負担のバランスを欠いている。\n399問題の根源(便宜供与)を直接規制する「川上規制」への転換を提案する。\n【対象箇所】改正案全般、特に記録・検証義務を課す規定【1.現行改正案の問題点】(1)記録義務の過剰な増加・顧客意向の詳細記録・商品選定理由の記録・説明内容の記録・月次/四半期/年次の検証記録影響:1契約あたり事務処理時間が2~3倍増、記録作成が目的化、顧客対応の質低下(2)実効性への疑問記録上は「顧客の意向を確認し推奨」と記載できても、実際には便宜供与が動機であれば、記録からは発見困難。形式は整っているが本質的問題は解決しない。\n(3)監督の実現可能性全国20万店の代理店、年間数千万件の契約記録を個別確認することは物理的に不可能。結果として形式主義に陥る。\n【2.問題の本質と規制のミスマッチ】不祥事の構造:保険会社→便宜供与(システム提供、研修費用、人材派遣等)→代理店→見返りに特定商品優先販売→顧客被害規制すべき優先順位:第1位:便宜供与(資金の流れ)←問題の根源400第2位:販売実績との相関第3位:販売プロセス現行改正案の優先順位:第1位:販売プロセスの記録←ここに偏重第2位:体制整備第3位:便宜供与の影響←間接的【他業界との比較】医薬品:製薬会社から医師への便宜供与を厳格規制、公開義務建設:贈答・接待禁止、利益供与規制証券:利益供与禁止、透明性確保→保険業界のみ「個別取引記録」に偏重【3.具体的提案】提案1:便宜供与の完全透明化第○条(保険会社から代理店への便宜供与等の報告)\n1.保険会社は便宜供与等について四半期ごとに監督当局に報告2.便宜供与等:金銭提供、物品提供、役務提供、その他経済的利益(通常の代理店手数料、最低限の販促物、業界標準的支援を除く)\n3.報告内容:提供先、内容詳細、時期、金額換算、目的、当該代理店の販売実績(過去3年)\n代理店側報告(年間手数料1億円以上):四半期ごとに受領した便宜供与を報告(クロスチェック401用)\n透明性確保:年間100万円以上の便宜供与をホームページ・開示資料で公開提案2:相関分析の義務化第○条(便宜供与の影響分析)\n保険会社は年次で以下を分析・報告:・便宜供与額と販売実績の相関関係・便宜供与前後の販売実績変化・便宜供与を受けた代理店と受けていない代理店の比較・同規模・同地域代理店との比較監督当局は四半期ごとに統計分析:・便宜供与額上位代理店・伸び率上位代理店・販売シェア変動大の代理店・相関が高い代理店→重点監視対象とし、必要に応じてヒアリング・検査提案3:独立監査制度第○条(便宜供与に関する監査)\n対象:保険会社全社、代理店(年間手数料10億円以上)\n監査内容:記録の正確性、経済的価値の妥当性、販売実績との関係性、顧客本位の阻害有無監査者:公認会計士等結果:監督当局報告、概要開示提案4:上限規制402第○条(便宜供与の上限)\n上限:当該代理店からの年間手数料の20%以内例外(事前届出):・業界全体の研修・教育・災害等緊急支援・長期的業務効率化・その他顧客本位で正当なもの違反時:業務改善命令、重大な場合は業務停止命令提案5:記録義務の見直し(リスクベースアプローチ)\n詳細記録義務の適用対象:・影響分析で異常が認められた代理店・重点監視対象代理店・苦情多発代理店その他の代理店:最小限の記録(契約者基本情報、提案商品、契約商品、保険料・保障概要)\n【4.期待される効果】運用イメージ:【適正な代理店】B社から手数料1億円、便宜供与500万円(5%)、販売シェア30%(取扱15社中)\n→判定:問題なし、詳細記録義務なし【問題のある代理店】D社から手数料1億円、便宜供与5,000万円(50%、上限超過)、販売シェア85%403→詳細ヒアリング、個別記録提出要求、調査、改善命令/業務停止効果:1.実効性のある監督資金の流れをデータ分析→統計的異常検知→問題代理店に監督集中2.不正の抑止便宜供与は全て報告→隠蔽困難→販売実績との相関分析→異常発見→強い抑止効果3.現場負担の大幅軽減全契約の詳細記録(60~90分/件)→便宜供与報告(四半期/年次のみ)、健全な代理店は個別記録不要4.公正な競争環境便宜供与が完全透明化→不当な優遇が困難→公正な競争5.効率的な監督全件検査(不可能)→リスクベースアプローチ(実現可能)\n【5.実現可能性】技術的:既存システム活用、新規大規模投資不要コスト:保険会社・代理店とも限定的(現行の個別記録義務より遥かに小)","pageStart":399,"pageEnd":404,"answer":"貴重なご意見として承ります。\n比較推奨販売に係る記録・証跡等については、顧客の意向を踏まえた適切な比較推奨販売が行われているかを事後的に確認・検証し、必要な改善につなげるための手段であり、記録作成自体を目的とするものではありません。\n金融庁としては、「「平成26年改正保険業法(2年以内施行)に係る政府令・監督指針案」に対するパブリックコメント結果等について」における「コメントの概要及びコメントに対する金融庁の考え方」においても、比較推奨販売の実施状況の適切性を確認・検証し、必要に応じて改善するため、当該確認・検証に資する記録や証跡等の保存が必要である旨を示してきたところであり、今般の監督指針改正は、こうした従前の考え方を踏まえ、比較推奨販売に係る記録・証跡等の保存について明確化したものです。\nただし、ご指摘のとおり、記録作成が形式化し、現場負担のみが過度に増加するような運用は適切ではありません。今般の改正は、全ての案件について画一的かつ詳細な記録を一律に求める趣旨ではなく、各乗合代理店において、自社の規模・業務特性、募集形態等を踏まえ、実効的な確認・検証が可能となる態勢を整備・運用することが重要と考えます。\nまた、保険会社から保険代理店等への過度な便宜供与については、監督指針において防止に向けた態勢整備を求めているほか、保険業法改正により、規模が大きい特定保険募集人に提出が求められる事業報告書の活用等を通じて、実態把握を進めることとしています。\n金融庁としては、形式的な書類整備に偏ることなく、過度な便宜供与の防止、比較推奨販売の適切性、顧客本位の業務運営の確保の観点から、実態を踏まえた監督に努めてまいります。","theme":"証跡保存","section":"監督指針","tags":["便宜供与","手数料・インセンティブ","比較推奨","証跡・記録","システム・比較ツール"]},{"no":712,"location":"－","comment":"大手損害保険会社の自動車保険については、基本的な商品の内容、保険料ともほとんど差がないのが実態であるため、複数の大手損保が乗り合っている代理店においては、比較推奨販売に際して、「どれも大きな差はない」という説明をせざるを得ないものと考えている。\n404こうした状況下で比較推奨を厳格化しても、保険契約の特約の保証範囲の細かな差異や、わずかな保険料水準の差などに多くの時間を割いて顧客に説明することになるが、顧客から見ると極めて付加価値が低く、費用対効果が低いと評価されるものと懸念している。\nこうした中、保険会社に商品の差別化競争を促すことこそ顧客の最善の利益にかなうものと考えられる。\n保険商品の差別化がされていない点は金融審議会・制度等改正WG報告書にも明確に記載があり、複数の委員もそうした点を懸念する指摘をされていたが、金融庁として、各保険会社に対して商品差別化に向けた具体的な働きかけや指導をどのように行っているのかご教示いただきたい。\nまた、今後ともそうした働きかけ等を積極的に行い、随時フォローアップしていくべきと考えるが、見解をご教示いただきたい。","pageStart":404,"pageEnd":405,"answer":"保険商品の開発については、各保険会社が顧客ニーズ、リスクの状況、競争環境等を踏まえ、創意工夫を活かして取り組むことが基本と考えます。\n金融庁としては、Ⅳ「保険商品審査上の留意点等」において、商品内容、保険契約者等への説明事項、団体契約・各種割増引制度等に関する審査上の留意点を示しているほか、「保険商品審査事例集」において、商品審査等の過程で共有された問題認識や先進的な取組事例等を公表しています。\nまた、保険会社においては、顧客が商品内容や保障(補償)内容の差異を理解し、適切に商品選択できるよう、分かりやすい商品設計、情報提供、保険募集人への教育・管理・指導を行うことも重要と考えます。\n金融庁としても、商品開発・商品審査、比較推奨販売の適切性、顧客への分かりやすい情報提供等の観点から、引き続き、保険会社の取組を適切にモニタリングしてまいります。","theme":"ご意見","section":"監督指針","tags":["比較推奨","顧客の最善の利益","団体・団体扱い"]},{"no":713,"location":"－","comment":"監督指針は保険会社向けのものであることに鑑みれば、乗合代理店が本指針に基づいた比較推奨販売を実施することについて、当該代理店が所属する保険会社が教育・管理・指導を行うべく必要な協力・支援を行う責務があるという理解でよいか。\nその際、所属する複数の保険会社の責任の分担はどのようになるのか。\n405","pageStart":405,"pageEnd":406,"answer":"ご指摘の「責任の分担」の具体的内容は必ずしも明らかではありませんが、各保険会社は、保険業法に基づき自らが保険募集を委託する保険代理店に対し、法令等遵守及び適正な保険募集を確保する観点から、必要かつ適切な教育・管理・指導を行う責務を負っています。\nまた、監督指針においても、保険会社による保険代理店に対する指導等の実効性確保や、乗合代理店における比較推奨販売の適切性が監督上の評価項目として整理されています。\nしたがって、乗合代理店が比較推奨販売を適切に行えるよう、各保険会社は、自社商品に関する情報提供、募集人教育、照会対応、保険代理店に対する管理・指導等を適切に行う必要があります。\n一方、比較推奨販売に係る体制整備については、同法第294条の3に基づき乗合代理店自身にも求められるものであり、複数の所属保険会社等の存在により、その責任が一の保険会社に集約されるものではないと考えられます。\n各保険会社は、自らの委託関係及び保険募集を委託した商品に応じて責任を負うとともに、必要に応じて乗合代理店と連携し、顧客に誤認や不利益が生じないよう対応することが重要です。\nなお、保険会社による支援は、適正な保険募集を確保するための教育・管理・指導の範囲で行われるべきであり、特定の保険会社の商品を優先的に取り扱わせることにつながる過度の便宜供与とならないよう留意する必要があり、この点については、監督指針においても、過度の便宜供与の防止や不適切な出向の防止等が整理されています。","theme":"ご意見","section":"監督指針","tags":["便宜供与","比較推奨","出向"]},{"no":714,"location":"－","comment":"令和7年8月28日付の「保険会社向けの総合的な監督指針」の改正により、「Ⅱ－4－2－14代理店手数料の算出方法」において、乗合代理店におけるシェアの拡大・維持や、保険代理店の新設や乗合いの承諾を得るなどの営業上の目的で、他の損害保険会社の代理店手数料の割増引率に追随するなどの例外的な運用が廃止された。\n例外的な運用を廃止する方向性に異論はないが、結果として乗合代理店では委託保険会社ごとの手数料ポイントに大きな差が生じるケースが発生している。\n例えば、A保険会社は110ポイント、B保険会社は90ポイン406ト、C保険会社は50ポイントといった状況である。\nこのような差が生じる主な要因は、各保険会社の手数料ポイント制度において、自社の収保規模をベースに決定するウエイトが未だ高いからであり、この状況が続くと乗合代理店における比較推奨販売に支障をきたすものと考える。\n現状の制度のままで、顧客から手数料ポイントが低い保険会社の商品を選択されると、代理店としては引き受けた時点で赤字が確定する(人件費も賄えない)という事態が生じかねない。\n顧客への最善利益勘案義務は十分承知しているが、赤字を強いられるような事態が生じることは避けたいと考える。\n金融庁におかれては、代理店手数料ポイント制度が比較推奨販売に支障をきたすことがないよう、損保協会との意見交換会で本件について言及いただく等、比較推奨を歪めることのない手数料ポイント制度の実現に向けて、各保険会社における検討を強く促していただきたい。","pageStart":406,"pageEnd":407,"answer":"貴重なご意見として承ります。","theme":"ご意見","section":"監督指針","tags":["手数料・インセンティブ","比較推奨"]},{"no":715,"location":"－","comment":"比較推奨販売について、乗合代理店は、複数の取り扱い保険会社の商品を案内することが義務化されそうな流れであるが、そもそも代理店は顧客の要望を詳細に分析した中から、最適な商品を抽出することによって、その手間賃を得る仕事である。\n損害保険においては、加入条件よりも保険金の支払い品質が重視される商品である。\n407支払いのスタンスにも会社間のスタンスの違いを常に感じている。単に複数の会社を提示する場合、その多くが保険料のみが強調される形となり、これが顧客本位の業務運営とは到底思えない。\n保険業界において不祥事が絶えない原因の本質は、体制整備よりも、過度な手数料の締め付けである。\n損害保険では、お客様本位の比較推奨が行われない原因には、同じ業務をやっても代理店手数料ポイントにより、5倍を超えるような手数料の差が現実にある。\nそれらを守るために、顧客が蔑ろになる点を今一度点検した上で、指針を明示されては如何か。","pageStart":407,"pageEnd":408,"answer":"貴重なご意見として承ります。","theme":"ご意見","section":"監督指針","tags":["手数料・インセンティブ","比較推奨"]},{"no":716,"location":"－","comment":"損害保険会社と生命保険会社は別法人であるにもかかわらず、特定の生命保険の販売実績が損害保険代理店の評価や手数料に影響しており、この構造が比較推奨販売の中立性を損ねており、特定商品を優位に取り扱う動機を生む要因となっている。\n制度趣旨に沿った適正な比較推奨販売を実現するためには、現行の評価・手数料構造との矛盾を解消し、制度全体の整合性を確保する必要がある。","pageStart":408,"pageEnd":408,"answer":"貴重なご意見として承ります。","theme":"ご意見","section":"監督指針","tags":["手数料・インセンティブ","比較推奨"]},{"no":717,"location":"－","comment":"乗合代理店の比較推奨において、保険業法施行規則第227条の2第3項第4号ハの廃止により、乗合代理店にとって経済的なデメリット(手数料差)が生じ、その結果として適正な比較推奨が遂行されなくなる可能性がある。\n保険会社が採用している手数料ポイント制度は、取扱い規模・増収といった保険会社側が優先する項目を評価基準408としており、募集品質が高く、適正な比較推奨を実施できる代理店のうち、取扱量が少ない、いわゆる規模の小さい乗合代理店においては、顧客の意向に沿った保険商品を推奨することで、手数料が半減するなどの保険商品を推奨せざるを得ない状況が生じうる。\n保険会社の手数料体系については民民の問題として金融庁が関与しないのではなく、比較推奨販売が適正にできるよう、代理店の業務品質レベルでの評価ウェイトを高め、保険会社によって差異が生じる評価をしないよう、保険会社への指導等をお願いする。","pageStart":408,"pageEnd":409,"answer":"貴重なご意見として承ります。","theme":"ご意見","section":"監督指針","tags":["手数料・インセンティブ","比較推奨","ハ方式"]},{"no":718,"location":"－","comment":"比較推奨の方法については保険業法施行規則第227条の2第3項第4号ハの廃止で差し支えないものと考えているが、適用にあたり、以下の3点について十分な整理を行った上で進める必要があると考える。\n①比較推奨が可能な乗合代理店について、業務品質を適切に評価する仕組みを整備すること。\n②保険会社が乗合代理店を評価し、代理店手数料を決定する際には、規模・増収といった指標ではなく、適切な比較推奨販売が行われているかどうかなど、業務品質を基準とした評価が行える制度を整備すること。\n③代理店手数料について、金融庁は単なる民民の問題と位置付けるのではなく、保険会社の代理店運営の影響を大きく受けている実態を踏まえ、適切に監視・指導を行うこと。","pageStart":409,"pageEnd":409,"answer":"貴重なご意見として承ります。","theme":"ご意見","section":"監督指針","tags":["手数料・インセンティブ","比較推奨","ハ方式"]},{"no":719,"location":"Ⅱ－4－2－9(5)","comment":"監督指針案では、「乗合代理店が受け取る手数料水準の409高さや乗合代理店への便宜供与等の実績など、乗合代理店の都合による保険契約の選別や提示・推奨を行うことのないよう留意する。」とある。\nこの留意事項における「手数料水準」に関しては、規模・増収率が大きく影響する現行の代理店手数料ポイント制度では、形式的又は実質を伴わない推奨販売が生じるリスクが極めて高いと考えている。\nまた、当該代理店に対して、取扱い収保が大きく手数料率が高い保険会社の監督指導力は、自社の挙績を減らすことになり期待できない。\n比較推奨販売は、規模・増収率が影響しない代理店手数料ポイント制度があって初めて、顧客の最善利益が徹底されると思料する。\n本指針の公表と同時に、保険会社に対して規模・増収率で代理店手数料水準に差が生じない手数料制度を構築するよう、環境の整備をお願いしたい。","pageStart":409,"pageEnd":410,"answer":"貴重なご意見として承ります。","theme":"ご意見","section":"監督指針","tags":["便宜供与","手数料・インセンティブ","比較推奨"]},{"no":720,"location":"Ⅱ－4－2－9(5)","comment":"乗合代理店における比較推奨販売において、顧客サイドから見た場合、今般の改正案がトラブルの防止に十分機能する内容であると考えている。\n一方、代理店サイドから見た場合、保険会社と代理店との間では、「代理店手数料率が各社で統一されていない」、「商品性に差異がない」という二つの問題を抱えている。\nまた、今後、保険仲立人の活用推進(共同取り扱い解禁)\nを考えた場合、本来の競争原理を踏まえ、手数料率は代理店、仲立人で全て統一し、商品性やサービス、保険会社の410対応力、利便性等に基づく保険会社間の競争を促すべきと考えるが如何か。","pageStart":410,"pageEnd":411,"answer":"貴重なご意見として承ります。","theme":"ご意見","section":"監督指針","tags":["手数料・インセンティブ","比較推奨"]},{"no":721,"location":"Ⅱ－4－2－9(5)","comment":"今回の比較推奨販売に関する規制強化の方向性については、顧客保護及び保険募集の透明性向上の観点から、基本的には賛同する立場である。\n一方で、実務に携わる乗合代理店の立場から見ると、保険会社ごとの代理店手数料率の在り方が、比較推奨販売の実効性や顧客利益に重大な影響を与えている点について、十分な議論が行われていないと感じる。\n保険募集を本業とする代理店においては、引受可否に関する事前照会、補償内容や約款解釈を含む説明、契約後の変更手続や更新管理、事故発生時の初動対応及び保険会社との調整など、募集から契約後まで一貫した関与が求められる。\nこうした業務を前提とする以上、一定水準の収益構造がなければ、継続的かつ責任ある募集・管理を行うことは現実的に困難である。\n特に、以下の代理店収益構造について議論が必要と思料する。\n【代理店手数料率商商品代理店手数料率代代理店手数料ポイント/100】で決定される仕組みである。\n代理店手数料ポイントは、どの損害保険会社も、規模、増収で決定するポイントが、全体のおよそ50％を占めており、ポイントは110～30と大きな開きがある。\n同一の商品であっても、前年の獲得ポイントにより、収411益に大きな差が生じる仕組みでは、顧客に最善の提案ができるとは思えない。\n代理店運営のための収入が、80％も変わってしまっては、組織の維持が出来ない。\n代理店手数料率が著しく低く設定されている場合、比較推奨販売において求められる丁寧な説明、複数商品の比較、契約後の継続管理や事故対応といった業務を十分に行うことが難しくなる。\n本来であれば顧客にとって適合性の高い商品が存在していたとしても、代理店組織維持のため、代理店手数料の高い商品が優先されるなど、意図せず顧客利益に反する提案につながりかねないと思う。\nこの点を代理店側の倫理や努力の問題として片付けるのではなく、制度設計上の問題として正面から捉える必要があると考える。\n代理店ごとに110％から30％まで大きな幅をもって設定される代理店手数料率の構造そのものが、比較推奨販売における中立性や顧客利益の最大化を阻害する要因となっている以上、代理店にのみ高度な説明義務や推奨理由の合理性を求めることには限界がある。\n比較推奨販売を真に顧客本位のものとするためには、代理店の規模や募集形態の違いに応じた役割分担を踏まえつつ、代理店手数料率についても、議論する必要があると思う。","pageStart":411,"pageEnd":412,"answer":"貴重なご意見として承ります。\nなお、代理店手数料は、保険会社・保険代理店間の委託契約において取り決められているものであり、その額等の決定について金融庁が直接的に関与することは困難です。\nこのため、金融庁では、代理店手数料が保険募集に関する不適切なインセンティブとならないよう、損害保険会社に対し、監督指針において、規模・増収率に偏ることなく、業務品質を重視しているか等の代理店手数料の算出に係る留意点を示しています。\n各損害保険会社においては、こうした監督指針等を踏まえ、手数料体系の見直しを検討・実施しているものと承知しています。\n比較推奨販売との関係においても、代理店手数料の多寡やその算出方法等が、顧客の意向に沿わない商品選別や特定の保険会社への不適切な誘導につながらないよう留意する必要があります。","theme":"ご意見","section":"監督指針","tags":["手数料・インセンティブ","比較推奨","更改・継続"]},{"no":722,"location":"Ⅱ－4－2－9(5)","comment":"顧客利益の最優先という改定趣旨は十分理解している412が、保険業法施行規則第227条の2第3項第4号ハを廃止し、同号ロを採用した場合、代理店の業務負荷が相当増加することが見込まれる。\nそのため現状の代理店手数料体系では代理店の経営が立ち行かない可能性があり、代理店廃業による保険会社の業務量増加又は代理店手数料の引き上げによるコスト増につながる。\n結果として、契約者の保険料負担増となりかねない。\nつまり顧客の最善の利益と反する結果となることから、具体的なルール策定においては代理店の業務効率も勘案して頂きたい。","pageStart":412,"pageEnd":413,"answer":"貴重なご意見として承ります。\n今般の監督指針改正は、乗合代理店における比較推奨販売について、代理店側の都合や保険会社との関係により、顧客の意向に沿わない保険契約が選別され、提示・推奨が行われることを防止し、顧客本位の保険募集を確保することを目的とするものです。\n一方で、全ての案件について、全ての取扱保険会社の商品を網羅的に比較・説明し、又は詳細な記録作成を一律に求めるものではありません。顧客の意向、商品特性、募集形態、代理店の規模・業務特性等を踏まえて、顧客の理解に資する実効的な対応が重要です。","theme":"ご意見","section":"監督指針","tags":["手数料・インセンティブ","比較推奨","ハ方式","顧客の最善の利益","証跡・記録"]},{"no":723,"location":"Ⅱ－4－2－9(5)","comment":"本改正は、保険募集の適正化及び顧客保護の強化を目的とするものとして理解しており、その趣旨には賛同する。\n一方で、本改正が特定大規模乗合代理店を主な対象としているにもかかわらず、その解釈・運用次第では、人員の限られた小規模代理店に対しても実質的に過度な業務負担が生じるおそれがあるため、現場実務の観点から意見を述べる。\n当社では、契約変更、照会対応、書類作成等の日常的な業務全般に加え、保険会社のシステム仕様やシステム障害に起因する追加対応により、保険会社ごとに必要となる時間や事務負担に大きな差が生じる事例を継続的に多数経験している。\nこれらの差異は代理店側の努力のみで解消することが困難であり、実務上の負担として継続的に発生している。\n413実務上、保険会社によって見積作成等の初期対応に要する時間や事務負担に大きな差が生じる場合がある。\n仮に、事務負担の極めて大きい保険会社の商品が保険料面で一定程度有利であったとしても、その差異は代理店側の労務負担や業務提供可能性に直接影響する要素であり、必ずしも顧客に対して合理的な比較説明が可能な事項とは言い難い。\nこうした内部的な業務負担の差異を考慮した取扱方針の判断まで否定されることのないよう、制度運用上の整理を求めたい。\nまた、比較推奨販売の適正化の趣旨には賛同するが、保険会社ごとの事務負担やシステム対応といった内部的要素まで説明・記録の対象とする運用となった場合、代理店業務が過度に形式化し、かえって実質的な顧客対応の質を低下させるおそれがある。\n商品内容や顧客意向に係る説明を主眼とし、代理店の業務提供可能性を踏まえた取扱方針の判断が否定されないよう、監督指針等での明確な整理をお願いしたい。\n本改正が、形式的な体制整備にとどまることなく、顧客本位の業務運営と代理店の持続可能な経営の両立につながる制度となるよう、規模や実態に応じた柔軟な運用が図られるようお願いしたい。","pageStart":413,"pageEnd":414,"answer":"貴重なご意見として承ります。\nなお、比較推奨販売に係る体制整備については、顧客の最善の利益を勘案しつつ、適切な商品選択の機会を確保するため、乗合代理店の規模や業務特性等に応じて、自社の募集実務や募集形態等を踏まえた適切な比較推奨販売が実施されるよう実効的な体制が整備されることが重要であり、監督指針は、一律かつ画一的な対応や、規模・業務特性等に照らして過度な実務上の負担を求める趣旨ではありません。","theme":"ご意見","section":"監督指針","tags":["比較推奨","顧客の最善の利益","証跡・記録","システム・比較ツール"]},{"no":724,"location":"Ⅱ－4－2－9(5)","comment":"比較推奨販売への対応は、代理店にとって業務量の大幅な増加を招き、人員の確保やシステム導入など、新たな対応が必要となることが考えられ、コスト面の負担増加も考414えられる。\nこうした実務上・経済上の負担増について、当局としてどのように考えているか。","pageStart":414,"pageEnd":415,"answer":"貴重なご意見として承ります。\nなお、比較推奨販売に係る体制整備については、顧客の最善の利益を勘案しつつ、適切な商品選択の機会を確保するため、乗合代理店の規模や業務特性等に応じて、自社の募集実務や募集形態等を踏まえた適切な比較推奨販売が実施されるよう実効的な体制が整備されることが重要であり、監督指針は、一律かつ画一的な対応や、規模・業務特性等に照らして過度な実務上の負担を求める趣旨ではありません。","theme":"ご意見","section":"監督指針","tags":["比較推奨","顧客の最善の利益","システム・比較ツール"]},{"no":725,"location":"－","comment":"比較推奨についての対応が厳格化された場合、人員や社内体制など実務面での負担やコストが増えると考えている。\n特に中小規模の代理店への配慮をお願いしたい。","pageStart":415,"pageEnd":415,"answer":"貴重なご意見として承ります。\nなお、比較推奨販売に係る体制整備については、顧客の最善の利益を勘案しつつ、適切な商品選択の機会を確保するため、乗合代理店の規模や業務特性等に応じて、自社の募集実務や募集形態等を踏まえた適切な比較推奨販売が実施されるよう実効的な体制が整備されることが重要であり、監督指針は、一律かつ画一的な対応や、規模・業務特性等に照らして過度な実務上の負担を求める趣旨ではありません。","theme":"ご意見","section":"監督指針","tags":["比較推奨","顧客の最善の利益"]},{"no":726,"location":"Ⅱ－4－2－9(5)","comment":"保険業法施行規則第227条の2第3項第4号ロの運用にあたり、下記のような対応を行った場合には、要件を充足したものとして取り扱う旨を、指針やQ＆Aにて明確化いただきたい。\n(1)顧客が重視する事項の確認に関するセーフハーバー・商品特性(補償範囲、免責、特約の有無等)\n・保険料水準(価格重視か否か)\n・最低限必要と考える補償内容といった基本的事項について、口頭又は簡易な書面により確認し、その結果を記録している場合には、「丁寧かつ明確に確認した」ものと評価すること。\nまた、顧客が「代理店に任せる」「詳細な説明は不要」\nと意思表示した場合には、その旨を確認・記録することで、追加的な詳細確認を不要とする取扱いを認めること。\n(2)顧客の意向把握に関するセーフハーバー顧客の意向が抽象的又は不明確な場合において、・一般的に多くの顧客が重視すると考えられる事項を例示した上で確認していること415・顧客から特段の追加要望が示されなかったことを記録している場合には、「可能な限り顧客の意向を把握した」ものとして取り扱うこと。","pageStart":415,"pageEnd":416,"answer":"貴重なご意見として承ります。\n今般の監督指針改正は、乗合代理店における比較推奨販売について、顧客の意向に沿った選別・提示・推奨が適切に行われることを明確化するものです。\n顧客の意向把握・確認に当たっては、全ての案件について詳細かつ網羅的な確認を一律に求めるものではなく、顧客の意向、商品特性、募集形態、代理店の規模・業務特性等を踏まえ、合理的かつ実効的な方法により行うことが重要です。\n例えば、商品特性、保険料水準、保障(補償)内容、免責、特約等、顧客が重視すると考えられる事項を例示し、顧客の意向や追加要望の有無を確認・記録することは、意向把握の方法の一つと考えられます。\nまた、顧客が「代理店に任せる」、「詳細な説明は不要」と述べた場合であっても、その趣旨や前提となる意向を可能な範囲で確認し、記録することが重要ですが、これにより、意向把握・確認や情報提供が当然に不要となるものではありません。\nなお、金融庁として、現時点で一律のセーフハーバーや標準様式を定めるものではありません。","theme":"ご意見","section":"監督指針","tags":["比較推奨","意向把握","証跡・記録"]},{"no":727,"location":"－","comment":"保険業法施行規則第227条の2第3項第4号ロ(以下、ロ方式とする。)を適切に行うことについては、以下のとおり実務上の課題があると考えられる。\n(1)お客様の意向が抽象的である場合の対応の難しさ実務においては、「保険料が安ければよい」、「内容はよく分からないので任せたい」など、お客様の意向が抽象的であり、かつ代理店に一定の裁量を委ねる形で示されるケースが少なくない。このような場合であっても、形式的には詳細な意向確認や比較理由の整理が求められ、結果として、実態とかけ離れた書面作成や説明が行われるおそれがある。\n(2)\n「代理店に任せる」という意向の位置づけの不明確さお客様から明確に「代理店に任せる」と意思表示があった場合においても、それをどのように意向として確認・記録すべきかについて、現行のロ方式では判断基準が曖昧である。そのため、代理店側が過度に慎重な対応を取らざるを得ず、説明や書面が煩雑化し、かえってお客様の理解を妨げる結果となる可能性がある。\n(3)全取扱損害保険会社の試算に伴う工数増大ロ方式を厳格に適用した場合、原則として全取扱損害保険会社の商品について試算・比較を行う必要が生じるが、これは代理店の事務負担を大幅に増加させる要因となっ416ている。特に中小代理店においては人的・時間的制約が大きく、結果として対応品質の低下や、顧客対応に割く時間の減少につながる懸念がある。","pageStart":416,"pageEnd":417,"answer":"貴重なご意見として承ります。\n今般の監督指針改正は、乗合代理店における比較推奨販売について、代理店側の都合やあらかじめ定めた推奨方針による商品選別ではなく、顧客の意向に沿った選別・提示・推奨が適切に行われることを明確化するものです。\n一方で、全ての案件について、全ての取扱保険会社の商品を網羅的に試算・比較し、詳細な説明や記録を一律に求めるものではありません。\n顧客の意向把握・確認に当たっては、顧客の意向、商品特性、募集形態、代理店の規模・業務特性等を踏まえ、合理的かつ実効的な方法により対応することが重要です。\n顧客の意向が抽象的又は不明確な場合には、保障(補償)内容、保険料水準、免責、特約等、顧客が重視すると考えられる事項を例示するなどして、可能な限り意向を把握することが求められます。\nまた、顧客が「代理店に任せる」と述べた場合であっても、それにより意向把握・確認や情報提供が当然に不要となるものではなく、その趣旨や前提となる意向を可能な範囲で確認し、顧客の意向に沿って、合理的かつ一定の具体性を有する基準や理由等に基づき保険契約を提示・推奨する必要があります。\n金融庁としては、形式的な書面作成や過度な事務負担に偏ることなく、顧客本位の業務運営が実質的に確保されるよう、実務や実態も踏まえつつ、引き続き、適切にモニタリングしてまいります。","theme":"ご意見","section":"監督指針","tags":["比較推奨","意向把握","証跡・記録"]},{"no":728,"location":"Ⅱ－4－2－9(5)","comment":"今般の改正においては、以下のとおり中小代理店・地方代理店への影響が大きいと考えられることから、一定の運用緩和を求めたい。\n(1)人的・時間的制約が大きい中小代理店への影響多くの中小代理店、とりわけ地方に所在する代理店においては、少人数で多数の顧客対応・事故対応・事務処理を担っているのが実情である。\n保険業法施行規則第227条の2第3項第4号ロを厳格に適用し、全取扱損害保険会社の商品について詳細な試算・比較・説明を行うことは、人的・時間的負担の面で現実的とは言えず、結果として募集業務そのものの継続性に影響を及ぼすおそれがある。\n(2)地方における顧客特性とのミスマッチ地方においては、長年の取引関係や信頼関係を前提として「細かい比較よりも、いつもの代理店に任せたい」という顧客ニーズが多く見られる。\nこうした地域特性を踏まえず、形式的な比較手続きを一律に求めることは、顧客の実際の意向とかえって乖離する結果となり、顧客満足度の低下を招く懸念があります。","pageStart":417,"pageEnd":417,"answer":"貴重なご意見として承ります。\n今般の監督指針改正は、乗合代理店における比較推奨販売について、代理店側の都合や、あらかじめ定めた推奨方針による商品選別ではなく、顧客の意向に沿った選別・提示・推奨が適切に行われることを明確化するものです。\n一方で、全ての案件について、全ての取扱保険会社の商品を網羅的に試算・比較し、詳細な説明や記録を一律に求めるものではありません。\n顧客の意向把握・確認にあたっては、顧客の意向、代理店の規模・業務特性、募集形態、取扱商品等を踏まえ、合理的かつ実効的な方法により対応することが重要です。\n顧客が「代理店に任せたい」と述べた場合であっても、それにより意向把握・確認や情報提供が当然に不要となるものではなく、その趣旨や前提となる意向を可能な範囲で確認し、顧客の意向に沿って、合理的かつ一定の具体性を有する基準や理由等に基づき保険契約を提示・推奨する必要があります。\n金融庁としては、形式的な書面作成や過度な事務負担に偏ることなく、中小・地方代理店を含む実務実態も踏まえ、顧客本位の業務運営が実質的に確保されるよう、引き続き、適切にモニタリングしてまいります。","theme":"ご意見","section":"監督指針","tags":["比較推奨","意向把握","証跡・記録"]},{"no":729,"location":"Ⅱ－4－2－9(5)","comment":"「あらかじめ所属保険会社等の商号等を明らかにした上で」について、「あらかじめ」とは、保険募集がどこから417始まるのか定義が難しいこともあり、様々な工夫がなされてきた。\n引き続き、募集開始に伴い必要事項をご提示することで、誤解等を防止することが重要であり、物理的に瞬時に提示が難しい(所属保険会社が多数となる場合等)ケースでも、速やかに提示する努力や工夫が求められると考える。","pageStart":417,"pageEnd":418,"answer":"貴重なご意見として承ります。\n保険募集人は、保険業法第294条第3項に基づき、保険募集に当たり、あらかじめ所属保険会社等の商号等を明らかにする必要があります。\n「あらかじめ」とは、顧客が保険募集人の立場や取扱保険会社等について誤認することなく保険加入を検討できるよう、保険募集の開始前に、必要な事項を示すことを求める趣旨です。\nどの時点の行為が保険募集に該当するかは、Ⅱ－4－2－1(1)(2)を踏まえ、個別具体的に判断されます。\n所属保険会社等が多数ある場合や、非対面・オンライン募集等で物理的に全てを即時に表示することが困難な場合であっても、一覧表、書面、電子的表示、リンク、QRコード等の方法により、顧客が容易に確認できるよう工夫することが重要です。\nいずれの場合も、事後的・形式的な表示にとどまらず、顧客に誤認を与えない時期・方法で権限明示が行われる必要があります。","theme":"ご意見","section":"監督指針","tags":[]},{"no":730,"location":"－","comment":"ディーラー代理店において、顧客は自動車の購入と同時に必要な任意保険を契約しており、万が一に備える保険本来の姿を実現することができていることが評価され、ディーラー代理店におけるシェアは高くなっていると認識している。\nまた、ディーラー代理店にとっては、大切な顧客とのトータルな付き合いを深める中で、自動車保険の業務は必須であると認識している。\n以下に記載した5点のとおり、保険業法施行規則第227条の2第3項第4号ハ(以下、ハ方式とする。)は非常に効率的かつ合理的な制度であった。\n418①ディーラー代理店では、顧客との信頼関係が既に築かれているケースがほとんどで、複数の保険商品の中からディーラー代理店が自信を持って選択した商品をお奨めすることができ、それが顧客にも喜ばれている②相乗りの保険会社のそれぞれと緊密な関係を保つ中、それぞれの保険会社から営業に有用な提案があり、自社の保険実績の向上に役立てているところ③顧客との関係性が強いので、条件変更等の新たなご希望があってもすぐに対応可能④新商品等への顧客からのご要望に対しても、乗り合いのため複数の保険会社の商品でもすぐに対応可能⑤ディーラー代理店に複数の保険会社が乗り合うことで、万が一の保険トラブル時におけるリスクに対応することできる今般の損害保険業界の不祥事の真因は「テリトリー制」\nではなく、当該大規模代理店と、該当保険会社の悪質なコンプライアンス違反であり、「テリトリー制」がなくなっても、詐欺まがいの刑事事件が発生しうる余地は残るものと考えている。\n今般の改正は、長年培ってきた「テリトリー制」の長所を全く無視した対応と言わざるを得ない。\nまた、代理店からの推奨を期待している契約者から、推奨する保険会社を選定するための意向を引き出すことは全く必要ないのではないか。\nさらに、継続率が90％を超える実績がある代理店におい419て、顧客に改めて保険会社を選択していただく必要はない。\n顧客のパートナーを目指す自動車販売を主たる事業とするディーラー代理店こそ保険事業の健全な運営において不可欠であり、代理店に対して厳格な募集行為を求めることにより、契約に関する諸手続きが繁多となり、結果的に顧客の実情にそぐわないネット販売の推奨につながりかねない。\n以上より、以下の内容を要望する。\n①ハ方式での募集行為の復活・容認②顧客からの要望聴取の簡素化代理店を規模(大・中・小程度)、板金部門の有無等により層別し、より現実的な募集方法となるようお願いしたい。","pageStart":418,"pageEnd":420,"answer":"貴重なご意見として承ります。\n今般の監督指針改正は、乗合代理店における比較推奨販売について、代理店側の都合や保険会社との関係により、顧客の意向に沿わない保険契約が選別され、提示・推奨が行われることを防止し、顧客本位の保険募集を確保することを目的とするものです。\nこれまでも、保険募集人には、保険業法第294条第3項に基づき、保険募集に当たり、顧客に対して所属保険会社等の商号等を明らかにする権限明示義務が課されています。乗合代理店においても、顧客に対し、どの保険会社の商品を取り扱い、どの範囲で提案するのかについて誤認を与えないよう、適切に説明する必要があります。\nまた、保険募集人には、自らの所属保険会社等の商品について、顧客の最善の利益を勘案しつつ、公正な保険募集を行うことが求められます。そのため、保険契約者等の保護の観点から、自らの規模や業務特性に見合った教育・管理・指導、募集人配置、業務の引継ぎ体制、取扱範囲の明確化等の体制整備を図る必要があります。","theme":"ご意見","section":"監督指針","tags":["比較推奨","ハ方式","顧客の最善の利益"]},{"no":731,"location":"Ⅱ－4－2－9(5)","comment":"当社は自動車ディーラーにて17拠点、3損保の乗合代理店として保険業務を担当している。各拠点が広域であること、人数の分布により1拠点を1損保が担当するテリトリー制としている。\n各損保の教育体制や営業推進などが現在効率よく回っているが、これを3損保とも知識を全部修得し、均等に説明することになれば、これまでより非効率となり、大変業務に負担がかかる。\n保険業法施行規則第227条の2第3項第4号ハがいかにも悪と決めつけた今回の決定は全く現場を理解していない決定である。\n420顧客にとって意向を捻じ曲げたように捉えられているが、顧客にとっても、担当者がより深い知識を持っている保険会社を選ぶことは優位なことではないか。再度廃止の撤廃を望みます。","pageStart":420,"pageEnd":421,"answer":"貴重なご意見として承ります。\n今般の監督指針改正は、乗合代理店における比較推奨販売について、代理店側の都合や保険会社との関係により、顧客の意向に沿わない保険契約が選別され、提示・推奨が行われることを防止し、顧客本位の保険募集を確保することを目的とするものです。\nこれまでも、保険募集人には、保険業法第294条第3項に基づき、保険募集に当たり、顧客に対して所属保険会社等の商号等を明らかにする権限明示義務が課されています。乗合代理店においても、顧客に対し、どの保険会社の商品を取り扱うかについて誤認を与えないよう、適切に説明する必要があります。\nまた、保険募集人には、自らの所属保険会社等の商品について、顧客の最善の利益を勘案しつつ、公正な保険募集を行うことが求められます。そのため、保険契約者等の保護の観点から、自らの規模や業務特性に見合った教育・管理・指導、募集人配置、業務の引継ぎ体制、取扱範囲の明確化等の体制整備を図る必要があります。\n金融庁としては、形式的な対応に偏ることなく、代理店の実務に与える影響にも留意しつつ、権限明示、比較推奨販売、体制整備義務等が実効的に履行され、顧客本位の業務運営が確保されているかという観点から、引き続き、適切にモニタリングしてまいります。","theme":"ご意見","section":"監督指針","tags":["比較推奨","ハ方式","顧客の最善の利益"]},{"no":732,"location":"Ⅱ－4－2－9(5)","comment":"自動車販売併設型の代理店では、車両販売スタッフが保険募集を兼務している。\n昨今の人手不足により、多様な人材が現場を支えているが、複雑化する損害保険商品のすべてを完璧に把握し、比較・説明することには物理的・教育的な限界がある。1社の商品に限定して教育・研修を徹底しても、なお説明不足によるトラブルリスクをゼロにできないのが現場の苦悩である。\n複数社の全商品を熟知した上での意向把握・比較提案の義務化は、現場の保険募集人の許容範囲を大きく超えており、結果として消費者に誤った情報を与えるリスクを高め、消費者保護に逆行する懸念がある。\nまた、現在の自動車保険は各社による商品性の差異が小さく、明確な優劣を客観的に示すことが困難である。\n「事故対応の良さ」を意向として確認しても、対応品質421は個別事案に左右されるため、特定の1社を推奨することには高い賠償リスクが伴う。\nまた、低価格を求める顧客にはダイレクト型保険が適しているが、代理店としてそれらを推奨することは現実的な経営として成立しない。\n顧客の「お任せしたい」というニーズも一つの重要な意向であり、それを否定し無理に比較を強いることは、かえって顧客に負担を強いる結果となる。\n現行の保険業法施行規則第227条の2第3項第4号ハ(以下、ハ方式とする。)の廃止は、地域密着型で運営している多くの代理店にとって死活問題である。\nコンプライアンス遵守のためには「1社専属化」や「代理店廃業」を選択せざるを得ず、結果として地域の消費者が対面で保険相談を受けられる拠点が減少している。\nこれは金融庁が掲げる「顧客本位の業務運営」及び「消費者の利便性向上」という目的と矛盾するのではないか。\n現場の募集実態や人材確保の困難さに鑑み、一律の義務化ではなく、代理店の規模や業態に応じた柔軟な運用、あるいは現在の「ハ方式」に代わる現実的な比較・説明基準の策定を強く要望する。","pageStart":421,"pageEnd":422,"answer":"貴重なご意見として承ります。\n今般の監督指針改正は、乗合代理店における比較推奨販売について、代理店側の都合やあらかじめ定めた推奨方針による商品選別ではなく、顧客の意向に沿った選別・提示・推奨が適切に行われることを明確化するものです。\nまた、保険募集人には、自らの所属保険会社等の商品について、顧客の最善の利益を勘案しつつ、公正な保険募集を行うことが求められます。そのため、保険契約者等の保護の観点から、自らの規模や業務特性に見合った教育・管理・指導、募集人配置、業務の引継ぎ体制、取扱範囲の明確化等の体制整備を図る必要があります。\n金融庁としては、代理店の実務に与える影響や地域における顧客利便にも留意しつつ、顧客本位の業務運営が実質的に確保されているかという観点から、引き続き、適切にモニタリングしてまいります。","theme":"ご意見","section":"監督指針","tags":["比較推奨","ハ方式","意向把握","顧客の最善の利益"]},{"no":733,"location":"Ⅱ－4－2－9(5)","comment":"今回の業法改正について、あまりにも現場感覚を欠いたものと思わざるを得ない。\n損害保険、生命保険とも、一般の方々は情報弱者であることから、より丁寧に顧客のご意向を確認した上で、最適な商品を選択し、ご納得いただいた上でご加入いただくプ422ロセスが大切であることは論を俟たない。\nしかしながら、予定利率や特約が保険会社ごとに異なる生命保険と異なり、損害保険、特に自動車保険については、保険料には多少の差があるものの、ある1社が新商品、特約を開発・販売したらすぐに他社が追随する構図となっており、商品内容的にほとんど差がない。\nそのため、顧客は「保険会社」で商品を選ぶのではなく、「保険募集人(自動車販売業界においては主に営業スタッフ)を信頼して募集人の勧める保険会社」を選ばれる。\n当社では現在保険業法施行規則第227条の2第3項第4号ハ(以下、ハ方式とする。)を採用しており、店舗ごとに推奨販売する保険会社を決めている。\n保険募集人が顧客のニーズを確認し、それに合った補償内容、契約条件を、自店舗で取り扱っている保険商品のなかから設計してご提案する、その内容でご納得いただけたらご加入いただく、この方式で問題となったことは一度もない。\n顧客にとってみれば、信頼している営業スタッフが勧めてくれる保険商品に自ら納得して加入する、営業スタッフは自身が精通している保険商品について丁寧に説明し、お客様に納得していただいた上でご加入いただく、このプロセスが成り立っている現状のハ方式は、顧客、保険募集人にとって一定程度合理的な方式であるといえるのではないか。\nハ方式を廃止するのがやむを得ないのであれば、代理店423に一方的な負担を強いるのではなく、以下2点について保険会社側も大きく変わるべき。\n①商品内容について、保険料収入を増やしたい、他社と差別化を図りたいとの考えから、商品を複雑化しすぎである。\nそのため、顧客に説明する代理店の負担が著しく増え、またそういう商品、特約は顧客にも認識されにくいため、保険金未請求を惹起する。\nもっとシンプルに、顧客に分かりやすくすべきである。\n②システムについて、申込書作成に至るまでの工程が多く、かつ複雑すぎで、不備のない申込書を作成するために膨大な時間を必要とする。\n特に、某保険会社のシステムは注意喚起のためのチェック項目が多すぎて、著しく無駄な時間を費やさなければならない。\nこの2つの改善なくして同号イ又は同号ロへの移行は有り得ないと思料する。\n可能であればハ方式を存続させていただき、そのためにどう法律、指針を整備するかをご検討いただきたい。","pageStart":422,"pageEnd":424,"answer":"貴重なご意見として承ります。\n今般の監督指針改正は、乗合代理店における比較推奨販売について、代理店側の都合や保険会社との関係により、顧客の意向に沿わない保険契約が選別され、提示・推奨が行われることを防止し、顧客本位の保険募集を確保することを目的とするものです。\nまた、保険会社においても、保険商品の分かりやすさ、募集システムの利便性、代理店への教育・管理・指導等について、保険募集の適切性や顧客保護の観点から、実効的な対応を行うことが重要です。\n金融庁としては、形式的な記録・規程整備に偏ることなく、保険会社による代理店指導の実効性、過度の便宜供与の防止、代理店手数料体系の影響等も含め、顧客本位の業務運営が実質的に確保されているかという観点から、引き続き、適切にモニタリングしてまいります。","theme":"ご意見","section":"監督指針","tags":["便宜供与","手数料・インセンティブ","比較推奨","ハ方式","証跡・記録","システム・比較ツール"]},{"no":734,"location":"Ⅱ－4－2－9(5)","comment":"【意見の趣旨(結論)】本改正案は、顧客本位や健全な競争という大義に賛同する一方、現場の保険募集(とくに自動車ディーラー代理店)\nでの提案機能を弱め、結果として加入者の補償不足や価格偏重を招く懸念が大きいため、抜本的見直しを求める。\n改正前に、監督手法の再設計と「異常な代理店へのピン424ポイント是正」を優先すべきである。\n【理由(現場からの具体的懸念)】提案力の萎縮→加入者の補償不足リスク比較推奨販売の細則が過度に厳格になると、忙しい現場の保険募集人は“説明コスト”増により提案を避けがちになる。\nとりわけディーラー代理店では、「顧客が気づいていない潜在ニーズ」まで引き出して補償を整える実務が減り、価格だけで決める契約が増えるおそれがある。\n“過度の便宜供与”の解釈が広すぎると、正当な教育・研修まで萎縮してしまう。\n改正案は代理店への過度な便宜供与の抑止を掲げているが、定義や境界が不明確なままでは、保険会社による有用な勉強会・実務研修・事故対応ノウハウ共有まで「便宜供与」と受け取られ、現場の力量向上が止まる懸念がある。\nディーラーは修理・事故対応の即応性を活かし、顧客に“任せて安心”の体験を提供してきた。\nここを弱めると、地方や非デジタル層での加入者が行き場を失い、ネット保険未経験者の補償ギャップが広がる。\n仲立人(ブローカー)活用の活用促進は競争面で一定の意義があるものの、契約締結機能の所在や責任分界が利用者に分かりづらく、募集の仕組みが複雑化する懸念がある。\n【代替案】A.ピンポイント監督・是正の強化425B.“教育支援商便宜供与”の線引き明確化C.比較推奨販売は“深度の可変制”でD.地方・非デジタル層の配慮E.仲立人の説明義務を強化【補足：現場経験から】ディーラー代理店は、車の販売やアフターサービスでの顧客との接点の濃さを活かし、意向把握と潜在ニーズの提案、事故即応で顧客を守ってきた。\n募集人試験は容易でも、現場は継続的な勉強とロープレで品質を高めている。\n一律の萎縮を招く改正ではなく、不正・不適切な一部事例に的を絞る監督に切り替えるべきである。","pageStart":424,"pageEnd":426,"answer":"貴重なご意見として承ります。\n今般の監督指針改正は、乗合代理店における比較推奨販売について、代理店側の都合や保険会社との関係により、顧客の意向に沿わない保険契約が選別され、提示・推奨が行われることを防止し、顧客本位の保険募集を確保することを目的とするものです。\n一方で、全ての案件について画一的・過度に詳細な比較説明や記録を一律に求めるものではありません。顧客の意向、商品特性、募集形態、代理店の規模・業務特性等を踏まえ、顧客の理解に資する実効的な対応が重要です。\nまた、過度の便宜供与は防止される必要がありますが、保険募集の適切性を確保するために必要な教育・研修、商品知識、事務手続、事故対応等に関する支援を一律に否定するものではありません。監督指針においても、Ⅱ－4－2－1(4)\n「適正な保険募集管理態勢の確立」中の保険会社による保険代理店に対する指導等の実効性の確保、Ⅱ－4－2－9(6)\n「保険募集人の体制整備義務」中の過度の便宜供与の防止、Ⅱ－4－2－12「保険代理店等に対する便宜供与」等を通じ、保険会社と代理店の適切な関係性の構築を求めています。\n金融庁としては、形式的な記録・規程整備に偏ることなく、顧客本位の業務運営が実質的に確保されているか、代理店の実務負担や地域・顧客特性にも留意しつつ、引き続き、適切にモニタリングしてまいります。","theme":"ご意見","section":"監督指針","tags":["便宜供与","比較推奨","意向把握","証跡・記録"]},{"no":735,"location":"－","comment":"複数の保険商品を取り扱う代理店において、顧客の意向に基づいた適切な比較推奨が行われることは、保険業界全体の信頼性向上に不可欠であると考える。\nまた、車検・整備の無償提供や過度な割引等が、実質的に保険契約の誘因となっている事例が存在することも事実であり、こうした行為が是正される方向性は妥当である。\n制度の趣旨そのものには全面的に賛同しており、形式的な規制ではなく、実効性を伴う形での制度設計を期待する。","pageStart":426,"pageEnd":426,"answer":"貴重なご意見として承ります。\n今般の監督指針改正は、乗合代理店における比較推奨販売について、顧客の意向に沿わない保険契約の選別・提案や、保険会社との関係に基づく不適切な誘導を防止し、顧客本位の保険募集を確保することを目的とするものです。\n金融庁としては、形式的な規程整備にとどまらず、比較推奨販売の適切性が実効的に確保されているかという観点から、引き続き、適切にモニタリングしてまいります。\nなお、保険代理店による車検・整備の無償提供や割引等については、保険業法第300条第1項第5号等に抵触しないよう留意する必要があります。","theme":"ご意見","section":"監督指針","tags":["比較推奨"]},{"no":736,"location":"－","comment":"損害保険業界で発生した不適切事案を踏まえた法令改正等の趣旨や必要性は理解できるものの、実際に保険会社426へ影響力を持つのは一部の大規模代理店であり、多くの中小代理店は従来から法令遵守と顧客の意向把握に努めてきた。\n今回の改正で「比較推奨販売」だけに焦点があたり、殊更厳格に運用すると、現場に過度な負担をかけ、かえって顧客が混乱しご不便・ご不安をおかけすることに繋がる。\n全体として顧客の利益に資するように、代理店の実務が運用継続可能なフローになるような制度にしていただきたい。","pageStart":426,"pageEnd":427,"answer":"貴重なご意見として承ります。\n今般の監督指針改正は、乗合代理店における比較推奨販売について、代理店側の都合や保険会社との関係により、顧客の意向に沿わない保険契約が選別され、提示・推奨が行われることを防止し、顧客本位の保険募集を確保することを目的とするものです。\n一方で、全ての代理店・全ての案件について、画一的・過度に詳細な比較説明や記録を一律に求めるものではありません。顧客の意向、商品特性、募集形態、代理店の規模・業務特性等を踏まえ、顧客の理解に資する実効的な対応を行うことが重要です。\nまた、中小代理店を含め、各代理店においては、自らの規模や業務特性に見合った態勢整備を行い、過度な形式対応に偏ることなく、保険契約者等の保護に資する募集管理態勢を構築することが求められます。\n金融庁としても、形式的な記録・規程整備にとどまらず、顧客本位の業務運営が実質的に確保されているか、代理店の実務負担や顧客利便にも留意しつつ、引き続き、適切にモニタリングしてまいります。","theme":"ご意見","section":"監督指針","tags":["比較推奨","意向把握","証跡・記録"]},{"no":737,"location":"－","comment":"顧客の意向やニーズは実に多様であり、現場において保険募集人・代理店が柔軟にこれに対応し、顧客のより良い選択をサポートしていくことが求められる。\n今回の監督指針の運用に当たっては、保険募集の現場の実情に応じて柔軟に運用されるべきであり、必要以上に厳格な運用や硬直的な運用がなされ、代理店の大きな負担になることのないよう十分に配慮していただきたい。\nまた、今回の改正監督指針は、全ての乗合代理店に大きな影響があるものであることから、その運用に当たっては、金融庁、財務局の担当者によって指針の解釈にばらつ427きが出ることのないよう配慮をされたい。\nあわせて、改正監督指針の運用に際しては、金融庁の担当者等により代理店の募集人向けの研修などを積極的に開催していただくなど、十分な準備をお願いしたい。","pageStart":427,"pageEnd":428,"answer":"貴重なご意見として承ります。\n今般の監督指針改正は、乗合代理店における比較推奨販売について、顧客の意向に沿った選別をし、提示・推奨が適切に行われることを明確化するものです。\nその運用に当たっては、全ての案件について画一的・過度に詳細な比較説明や記録を一律に求めるものではなく、顧客の意向、商品特性、募集形態、代理店の規模・業務特性等を踏まえた実効的な対応が重要です。\nまた、監督指針の解釈・運用については、形式的・機械的な対応に偏ることなく、顧客本位の業務運営が実質的に確保されるよう、平仄のとれた監督に努めてまいります。\n金融庁としては、保険会社及び保険代理店における円滑な態勢整備に資するよう、必要に応じて、監督上の考え方の周知等を行うとともに、引き続き、適切にモニタリングしてまいります。","theme":"ご意見","section":"監督指針","tags":["比較推奨","証跡・記録"]},{"no":738,"location":"Ⅱ－4－2－9(5)","comment":"保険業法施行規則第227条の2第3項第4号ロ(以下、ロ方式とする。)における要件の不明確性と実務上の判断困難性今回、ロ方式において遵守事項が明確化されたこと自体は、比較推奨販売の透明性向上という点で一定の意義があるが、「丁寧かつ明確に確認する」「可能な限り顧客の意向を把握する」といった要件の判断基準が不明確であり、実務上は過度な確認や形式的対応を招くおそれがある。\n(1)「丁寧かつ明確に確認する」の判断基準の不明確さ顧客が重視する事項を「丁寧かつ明確に確認する」ことが求められているが、どの程度の確認をもって「丁寧」かつ「明確」と評価されるのかについて、具体的な基準が示されていない。\n実務においては、顧客が簡潔な回答や代理店への一任を希望するケースも多く、そのような場合にまで詳細なヒアリングや確認を重ねることは、顧客の意向そのものに反する結果となりかねない。\n結果として、形式的に質問項目を増やす対応が助長され、実質的な顧客理解よりも書面上の整合性が優先されるおそれがある。\n(2)「可能な限り顧客の意向を把握する」の範囲の曖昧さ428顧客の意向が不明確な場合であっても「可能な限り顧客の意向を把握する」ことが求められているが、「可能な限り」\nがどこまでを指すのかについて明確な線引きがない。\nこの点が曖昧なままでは、事後的に過不足を問われるリスクを恐れ、代理店側が過剰な確認や比較を行わざるを得なくなり、結果として顧客対応の効率性や分かりやすさが損なわれる懸念がある。","pageStart":428,"pageEnd":429,"answer":"貴重なご意見として承ります。\n今般の監督指針改正は、乗合代理店における比較推奨販売について、顧客の意向に沿った保険契約の選別・提示・推奨が適切に行われることを明確化するものです。\n「丁寧かつ明確に確認する」又は「可能な限り顧客の意向を把握する」とは、全ての顧客に対して一律に詳細な質問や網羅的な確認を求める趣旨ではありません。\n顧客の意向、理解度、商品特性、募集形態等を踏まえ、顧客が重視する事項を適切に把握できる方法で対応することが重要です。\n顧客が簡潔な説明や代理店への一任を希望する場合であっても、その趣旨や重視事項を可能な範囲で確認し、顧客の意向に沿って、合理的かつ一定の具体性を有する基準や理由等に基づき保険契約を提示・推奨する必要があります。\nなお、形式的な質問項目の追加や書面作成自体が目的化することは適切ではなく、顧客の理解に資する実効的な意向把握・確認を行うことが求められます。","theme":"ご意見","section":"監督指針","tags":["比較推奨","意向把握"]},{"no":739,"location":"－","comment":"今回の改正は不祥事を受けた顧客保護強化として理解しているが、規制アプローチに根本的な問題がある。\n問題の本質は「便宜供与による販売の歪み」であるにもかかわらず、改正案は「個別販売記録の強化」に偏重しており、実効性と現場負担のバランスを欠いている。\n問題の根源(便宜供与)を直接規制する「川上規制」への転換を提案する。\n【対象箇所】改正案全般、特に記録・検証義務を課す規定【1.現行改正案の問題点】(1)記録義務の過剰な増加・顧客意向の詳細記録・商品選定理由の記録・説明内容の記録・月次/四半期/年次の検証記録(影響：1契約あたり事務処理時間が2～3倍増、記録作成が目的化、顧客対応の質低下)\n(2)実効性への疑問429記録上は「顧客の意向を確認し推奨」と記載できても、実際には便宜供与が動機であれば、記録からは発見困難。形式は整っているが本質的問題は解決しない。\n(3)監督の実現可能性全国20万店の代理店、年間数千万件の契約記録を個別確認することは物理的に不可能。結果として形式主義に陥る。\n【2.問題の本質と規制のミスマッチ】不祥事の構造:保険会社→便宜供与(システム提供、研修費用、人材派遣等)→代理店→見返りに特定商品優先販売→顧客被害規制すべき優先順位:第1位:便宜供与(資金の流れ)←問題の根源第2位:販売実績との相関第3位:販売プロセス現行改正案の優先順位:第1位:販売プロセスの記録←ここに偏重第2位:体制整備第3位:便宜供与の影響←間接的<他業界との比較>医薬品:製薬会社から医師への便宜供与を厳格規制、公開義務建設:贈答・接待禁止、利益供与規制証券:利益供与禁止、透明性確保→保険業界のみ「個別取引記録」に偏重【3.具体的提案】430≪提案1:便宜供与の完全透明化≫第○条(保険会社から代理店への便宜供与等の報告)\n1.保険会社は便宜供与等について四半期ごとに監督当局に報告2.便宜供与等:金銭提供、物品提供、役務提供、その他経済的利益(通常の代理店手数料、最低限の販促物、業界標準的支援を除く)\n3.報告内容:提供先、内容詳細、時期、金額換算、目的、当該代理店の販売実績(過去3年)\n代理店側報告(年間手数料1億円以上):四半期ごとに受領した便宜供与を報告(クロスチェック用)\n透明性確保:年間100万円以上の便宜供与をホームページ・開示資料で公開≪提案2:相関分析の義務化≫第○条(便宜供与の影響分析)\n保険会社は年次で以下を分析・報告:・便宜供与額と販売実績の相関関係・便宜供与前後の販売実績変化・便宜供与を受けた代理店と受けていない代理店の比較・同規模・同地域代理店との比較監督当局は四半期ごとに統計分析:・便宜供与額上位代理店431・伸び率上位代理店・販売シェア変動大の代理店・相関が高い代理店→重点監視対象とし、必要に応じてヒアリング・検査≪提案3:独立監査制度≫第○条(便宜供与に関する監査)\n対象:保険会社全社、代理店(年間手数料10億円以上)\n監査内容:記録の正確性、経済的価値の妥当性、販売実績との関係性、顧客本位の阻害有無監査者:公認会計士等結果:監督当局報告、概要開示≪提案4:上限規制≫第○条(便宜供与の上限)\n上限:当該代理店からの年間手数料の20%以内例外(事前届出):・業界全体の研修・教育・災害等緊急支援・長期的業務効率化・その他顧客本位で正当なもの違反時:業務改善命令、重大な場合は業務停止命令≪提案5:記録義務の見直し(リスクベースアプローチ)≫詳細記録義務の適用対象:・影響分析で異常が認められた代理店・重点監視対象代理店・苦情多発代理店432その他の代理店:最小限の記録(契約者基本情報、提案商品、契約商品、保険料・保障概要)\n【4.期待される効果】○運用イメージ<適正な代理店>B社から手数料1億円、便宜供与500万円(5%)、販売シェア30%(取扱15社中)\n→判定:問題なし、詳細記録義務なし<問題のある代理店>D社から手数料1億円、便宜供与5,000万円(50%、上限超過)、販売シェア85%→詳細ヒアリング、個別記録提出要求、調査、改善命令/業務停止○効果1.実効性のある監督資金の流れをデータ分析→統計的異常検知→問題代理店に監督集中2.不正の抑止便宜供与は全て報告→隠蔽困難→販売実績との相関分析→異常発見→強い抑止効果3.現場負担の大幅軽減全契約の詳細記録(60～90分/件)→便宜供与報告(四半期/年次のみ)、健全な代理店は個別記録不要4.公正な競争環境433便宜供与が完全透明化→不当な優遇が困難→公正な競争5.効率的な監督全件検査(不可能)→リスクベースアプローチ(実現可能)\n【5.実現可能性】技術的:既存システム活用、新規大規模投資不要コスト:保険会社・代理店とも限定的(現行の個別記録義務より遥かに小)\n段階的導入:年1:便宜供与報告開始(半期)\n年2:四半期報告、統計分析開始、上限規制導入年3:外部監査、リスクベース記録適用、完全実施【結論】問題の本質(便宜供与)に対し、間接的アプローチ(個別販売記録)\n代現場の過度な負担代実効性への疑問代形式主義の蔓延直接的アプローチ(便宜供与の透明化・監視)\n○問題の根源に直接対処○実効性のある監督○現場負担の軽減○公正な競争環境真の顧客本位実現のため、規制アプローチの根本的見直しを強く要望する。","pageStart":429,"pageEnd":434,"answer":"貴重なご意見として承ります。\nなお、今般の監督指針改正は、乗合代理店における比較推奨販売について、代理店側の都合や保険会社との関係により、顧客の意向に沿わない保険契約が選別され、提示・推奨が行われることを防止し、顧客本位の保険募集を確保することを目的とするものです。\nまた、金融庁としては、保険会社と保険代理店との関係性に起因する不適切な誘導リスクにも対応するため、監督指針において、例えば、Ⅱ－4－2－1(4)「適正な保険募集管理態勢の確立」\n中の保険会社による保険代理店に対する指導等の実効性の確保、Ⅱ－4－2－9(6)\n「保険募集人の体制整備義務」中の過度の便宜供与の防止、Ⅱ－4－2－12「保険代理店等に対する便宜供与」、Ⅱ－4－2－13「保険代理店に対する出向」、Ⅱ－4－2－14「代理店手数料の算出方法」等を整備するなど、保険会社と保険代理店の適切な関係性の構築を求めています。","theme":"ご意見","section":"監督指針","tags":["便宜供与","手数料・インセンティブ","比較推奨","証跡・記録","出向","システム・比較ツール"]},{"no":740,"location":"Ⅱ－4－2－9(5)","comment":"改正案では推奨販売に先立ち「顧客の意向を丁寧かつ明434確に確認」することが求められるが、実際には「専門家の判断に委ねたい」という明確な意向を持つ顧客が一定数存在する。\nこのような顧客に形式的な意向確認を繰り返すことは、かえって顧客の真のニーズに反し、「顧客本位」とは言えない。\n「専門家判断委任型」顧客ニーズを適切に扱う規定の追加を提案する。\n【対象箇所】Ⅱ－4－2－9(5)比較推奨販売、特に「顧客意向確認」規定全般【1.「専門家判断委任型」顧客の存在】(1)典型的な顧客の声<パターン1:全面委任型>顧客「入院保険に入りたいけど、よく分からないから○○さんのオススメでいいよ。プロなんだから、いいやつ選んでよ」\n<パターン2:判断回避型>顧客「60日型とか120日型とか、その違いもよく分からないし...普通の人はどれ選んでるの?平均的なやつでいい。\n細かいことはいいから、プロから見て必要なやつ入れといてよ」\n<パターン3:時間制約型>顧客「仕事が忙しくて細かく考える時間ない。必要なもの、サクッと提案してくれる?○○さんを信頼してるから任435せるよ」\n<パターン4:高齢者型>高齢顧客「もう年だから細かいことは分からない。長い付き合いだし、あなたに任せるわ」\n→このような顧客が相当数存在(2)顧客がこのような態度を取る理由<理由1:専門家への信頼に基づく合理的判断>・保険は専門的で複雑→自分で判断するより専門家に任せた方が確実・代理店との信頼関係→この人なら適切に選んでくれる・自分で勉強する時間コスト>専門家に任せる→合理的判断<理由2:情報処理能力・時間的制約>・仕事や家事で忙しく保険の勉強時間がない・専門知識を習得する能力や意欲がない・多数の選択肢から選ぶこと自体がストレス・高齢等により判断力に不安<理由3:「選択の自由」には「選択を委ねる自由」も含まれる>・自ら選択する権利・専門家に選択を委ねる権利←これも重要な自己決定後者を否定し形式的に「自ら選択」を強制するのは、かえって顧客の自己決定権を侵害。\n【2.形式的な意向確認の問題点】(1)不合理な会話の強制436顧客「何でもいいからオススメ教えてよ」\n代理店「ご意向を確認させて...」\n顧客「だから分からないって。プロでしょ?任せるよ」\n代理店「規制上、意向確認しないと提案できないんです」\n顧客「じゃあ適当に...安いのがいい?」\n代理店「最も安い商品を...」\n顧客「え、でも保障薄いのは困る」\n代理店「では保障重視ですか?」\n顧客「だーかーらー!そういうバランスをプロが判断してよ!」\n→顧客イライラ、代理店困惑、誰も幸せにならない(2)「顧客本位」との矛盾【ケースA:形式重視】顧客「任せたい」→規制上形式的に意向確認→顧客は仕方なく適当に「意向」→形式的意向に基づき提案→顧客の真のニーズと乖離【ケースB:実質重視】顧客「任せたい」→その意向を尊重→専門家として総合的に判断→顧客の属性・リスク・予算を踏まえた提案→商品選定理由を丁寧に説明→専門家判断に基づく適切な提案明らかにケースBの方が「顧客本位」\n【3.他の専門家サービスとの整合性】医師の診療:患者「先生、お腹が痛い」\n医師「どのような治療を希望?」\n437患者「分かりません。先生にお任せします」\n医師「検査して、適切と判断する治療を行います」\n→完全に正当な医療行為、「患者本位」に反しない弁護士の法律サービス:依頼人「訴訟を起こしたい」\n弁護士「どのような戦略を希望?」\n依頼人「法律は分かりません。先生にお任せします」\n弁護士「最善の戦略を検討します」\n→通常の「委任契約」、完全に正当建築士の設計サービス:施主「家を建てたい」\n建築士「どのような設計を希望?」\n施主「プロにお任せします。予算は3,000万円で」\n建築士「最適なプランを作成します」\n→正当な専門家サービス保険販売だけが特別扱いされる理由はない。\nむしろ保険という専門的商品だからこそ、適切な「委任関係」を認めるべき。\n【4.具体的提案】提案:「専門家判断委任型」販売の明確な容認(b)－4顧客が自らの意向を明確に形成することが困難であり、かつ、乗合代理店の専門的判断に委ねる旨の意思表示をした場合、以下の要件を満たすことにより、当該委任を受けて推奨販売を行うことができる。\n【要件】438(ア)\n顧客が専門家判断に委ねる意思を有することの確認(口頭、書面、録音等)\n(イ)顧客の基本的情報の把握・年齢、家族構成、職業等の属性・予算(保険料の許容範囲)\n・既加入保険の有無・内容・特に重視する/しない事項(ある場合)\n(ウ)専門家としての判断根拠の明確化・顧客の属性・リスクに基づく商品選定理由・選定した商品の特徴・メリット・他の選択肢との比較(簡潔なもので可)\n・なぜこの商品が顧客に適していると判断したか(エ)顧客への説明と確認・選定した商品の内容の説明・選定理由の説明・顧客の理解と納得の確認(オ)記録の保存・(ア)から(エ)のプロセスの記録・委任を受けた経緯と判断根拠の文書化【禁止事項】委任を受けた場合でも、以下の基準で商品選定してはならない:・乗合代理店が受領する手数料の水準・保険会社からの便宜供与の有無・内容・乗合代理店の販売目標・ノルマ達成状況439・保険会社との資本関係・取引関係【事後検証】委任を受けた販売は通常の推奨販売以上に厳格な事後検証を行う:・委任の経緯が真正か(形式的でないか)\n・選定理由が顧客の利益に基づくか・特定商品への偏りがないか・手数料等の代理店都合が介在していないか【記録例】専門家判断委任による提案記録委任の経緯:顧客発言(録音)「保険は分からないし勉強する時間もない。○○さんを信頼しているから、私に合う保険を選んでほしい」\n確認した事項:年齢45歳、家族(配偶者・子2人)、会社員、年収600万円、予算月5,000円程度、既加入なし、「がんが心配」との発言専門家判断:・45歳男性→三大疾病リスク上昇年齢・子供未成年→長期療養時の家計影響大・初めての医療保険→基本保障充実を重視・「がんが心配」→がん特約重視・予算月5,000円以内商品選定:A社4,200円:保険料安いががん特約弱い440B社4,800円:がん特約充実、バランス良好○選定C社5,500円:がん特約最充実だが予算超過D社3,800円:保険料最安だが基本保障薄い手数料状況:A社12%、B社10%←選定、C社15%、D社8%→手数料最高のC社でなく顧客最適のB社を選定顧客への説明:「お客様の年齢・家族構成、『がんが心配』とのお話を踏まえ、B生命をご提案します。がん保障が特に手厚く、予算内で最も充実した内容です」\n顧客反応:「それでお願いします」\n【5.期待される効果】(1)顧客の多様性の尊重・自分で選びたい顧客→十分な情報提供と選択肢提示・専門家に任せたい顧客→適切な委任関係と責任ある提案→顧客一人ひとりの真のニーズに対応(2)実効性のある不正防止形式的意向確認:後付けで記録作成可能、便宜供与の影響見えにくい委任の明確化:委任を記録、選定理由を詳細記録、手数料目的等の悪用が発見しやすい(3)専門家サービスとしての適切な位置づけ医師・弁護士・建築士等で「委任」が認められており、保険販売も同様に扱うべき441【結論】「顧客本位」とは、顧客を画一的な型にはめることではなく、顧客一人ひとりの多様なニーズに応えることである。\nすべての顧客に「自分で意向を述べよ」と強制することは、かえって顧客の自己決定権を侵害し「顧客本位」に反する。\n「専門家判断委任型」の販売を適切に認めることこそが、真の顧客本位であると確信している。","pageStart":434,"pageEnd":442,"answer":"貴重なご意見として承ります。\n顧客が「専門家に任せたい」などと述べる場合であっても、それにより意向把握・確認や情報提供が当然に不要となるものではありません。\nそのような意思表示がされたことを踏まえつつ、保障(補償)内容、保険料水準、特約等、顧客が重視し得る事項を確認するなど、可能な限り意向の形成を促し、又は意向の明確化に努めた上で、把握した顧客の意向に沿って、合理的かつ一定の具体性を有する基準や理由等に基づき、保険契約を選別し、提示・推奨することが重要です。\nまた、顧客が詳細な比較説明を希望しない場合であっても、提示・推奨する保険契約の概要及び推奨理由等について、顧客が理解できるよう説明することが重要です。\nなお、顧客から委ねられたことを理由として、手数料水準、保険会社からの便宜供与、販売目標その他の代理店側の都合により特定の保険会社又は特定の保険契約へ誘導することは適切ではありません。\n各保険代理店においては、意向把握、推奨理由及び顧客への説明内容を事後的に確認・検証できる態勢を整備する必要があります。","theme":"ご意見","section":"監督指針","tags":["便宜供与","手数料・インセンティブ","比較推奨","意向把握","証跡・記録"]},{"no":741,"location":"－","comment":"乗合代理店で多数の保険会社の比較推奨を行うことは困難であるため、簡単な仕組みにしていただきたい。","pageStart":442,"pageEnd":442,"answer":"貴重なご意見として承ります。","theme":"ご意見","section":"監督指針","tags":["比較推奨"]},{"no":742,"location":"Ⅱ－4－2－9(5)","comment":"当社はディーラー販売店であるため、本業との兼ね合いから、保険業務のみに十分な人的・時間的リソースを割くことが難しい状況にある。\n現在、複数社(3社)の保険商品を取り扱っているが、各社それぞれの商品内容や制度の違いについてスタッフに理解してもらい、丁寧に説明するためには相応の時間が必要となる。\nそのため、日常業務と並行して対応することは容易ではなく、業務効率の面から、現実的ではない。","pageStart":442,"pageEnd":442,"answer":"貴重なご意見として承ります。\n保険募集人には、自らの所属保険会社等の商品について、顧客の最善の利益を勘案しつつ、公正な保険募集を行うことが求められます。そのため、保険契約者等の保護の観点から、自らの規模や業務特性に見合った教育・管理・指導、募集人配置、業務の引継ぎ体制、取扱範囲の明確化等の体制整備を図る必要があります。","theme":"ご意見","section":"監督指針","tags":["顧客の最善の利益"]},{"no":743,"location":"Ⅱ－4－2－9(5)","comment":"監督指針Ⅱ－4－2－9(5)①について、法令上は、保険業法施行規則第227条の2第3項第4号は「顧客の意向に沿って当該二以上の所属保険会社等を有する保険募集人が選別した比較可能な同種の保険契約の概要」の説明が求められているのだから、「商品特性等により、特定の保険契約を推奨」する前の、顧客の意向に沿って選別した範囲の保険契約の概要等を情報提供する法的義務があるという理解442でよいか。\nもしそのような情報提供を不要とするのであれば、法令の記載範囲を超えるので、但し書き等を追記すべきである。\n保険業法施行規則第227条の2第3項第4号ハ(以下、ハ方式とする。)は廃止されたが、その趣旨は実際には同号ロに読み込まれているのであり、「顧客の意向に沿って・・・選別」には、顧客の意向と具体的に関係がない(顧客の意向に沿っただけでは絞り込みができないものをさらに絞り込む。)さらなる「絞り込み」が含まれる、という解釈理解でよいということをこのパブコメで明示していただきたい。\n個人的には、今まで、法令上は具体的な根拠がない、指針独自の体制整備事項として規定されていた監督指針Ⅱ－4－2－9(5)②の「顧客に対し、特定の商品を提示・推奨する際には、当該提示・推奨理由を分かりやすく説明することとしているか。\n特に、自らの取扱商品のうち顧客の意向に合致している商品の中から、二以上の所属保険会社等を有する保険募集人の判断により、さらに絞込みを行った上で、商品を提示・推奨する場合には、商品特性や保険料水準などの客観的な基準や理由等について、説明を行っているか」を、無理に法令上の情報提供義務の内容としようとして、無理が生じているようにも思う。\n解釈上無理がある技巧を凝らさずに、ハ方式を法令規定443として一部存続させることが正当と思う。","pageStart":442,"pageEnd":444,"answer":"貴重なご意見として承ります。","theme":"ご意見","section":"監督指針","tags":["ハ方式"]},{"no":744,"location":"Ⅱ－4－2－9(5)","comment":"監督指針の改正によって、保険代理店としての業務を兼務している自動車販売店においては、どちらが本業なのか疑問視する声が多くなるのではないか。","pageStart":444,"pageEnd":444,"answer":"貴重なご意見として承ります。","theme":"ご意見","section":"監督指針","tags":[]},{"no":745,"location":"Ⅱ－4－2－9(5)","comment":"募集人資格は、比較的短期間の学習で多くの人が取得可能な制度である一方、今回の改正案で求められている比較推奨販売の水準は、対応が難しい高度な内容となっている。\n登録した瞬間から、このレベルの対応を求める制度設計は、人材育成の現実や、経験を積み重ねて成長するというプロセスを十分に踏まえていないように感じる。","pageStart":444,"pageEnd":444,"answer":"貴重なご意見として承ります。\n乗合代理店においては、取扱商品、募集形態、顧客属性、募集人の経験・知識等を踏まえ、顧客の意向に沿った適切な選別・提示・推奨が行われるよう、保険募集人に対する教育・管理・指導、経験に応じた役割分担、上席者による確認、相談・引継ぎ体制等を整備することが重要です。\nまた、保険会社においても、保険代理店における保険募集の適切性が確保されるよう、保険代理店に対する教育・管理・指導等を実効的に行うことが求められます。\n金融庁としては、実際の募集実務において顧客本位の業務運営が確保されているかという観点から、引き続き、適切にモニタリングしてまいります。","theme":"ご意見","section":"監督指針","tags":["比較推奨"]},{"no":746,"location":"－","comment":"現在、損害保険の実務においては、保険会社がディーラー系代理店など一部の販売チャネルに対してのみ、いわゆる「等級据え置き型」の長期自動車保険契約等、「メリットの高い保険商品」を提供し、その他チャネルの代理店には同様の商品を取り扱わせないという事象がある。\nこうした商品提供格差は、代理店から顧客に案内できる商品内容の違いを引き起こし、結果として、顧客が比較する選択肢を十分に得られないという問題が生じている。\n比較推奨販売方式の改善に当たっては、まずこうした問444題を解消することを優先し、保険会社がどの販売チャネルの代理店にも公平に保険商品を提供し、顧客が常に適切な判断を行える環境を整えることが必要である。","pageStart":444,"pageEnd":445,"answer":"貴重なご意見として承ります。","theme":"ご意見","section":"監督指針","tags":["比較推奨"]},{"no":747,"location":"－","comment":"保険業法施行規則第227条の2第3項第4号ハの廃止について、タイムパフォーマンスを重視する若年層の新規加入者に対して、長時間の保険商品に関する対面説明を行うことはハードルが高い。\nこれが保険離れ、車離れを加速させる可能性があると考える。","pageStart":445,"pageEnd":445,"answer":"貴重なご意見として承ります。","theme":"ご意見","section":"監督指針","tags":["ハ方式"]},{"no":748,"location":"－","comment":"顧客が求めるのは「自動車保険の迅速な付保と正確で早い事故対応」ではないかと考える。\n説明プロセスの肥大化がそれを妨げないよう実務に即した柔軟な運用基準を強く求める。","pageStart":445,"pageEnd":445,"answer":"貴重なご意見として承ります。","theme":"ご意見","section":"監督指針","tags":[]},{"no":749,"location":"－","comment":"比較推奨販売に関する改正は、意向把握義務に関する監督指針の内容や過去に公表されている金融庁の考え方に影響を及ぼすものではないという理解でよいか。","pageStart":445,"pageEnd":445,"answer":"今般の比較推奨販売に関する改正については、顧客の最善の利益を勘案した公正な保険募集を確保する観点から、乗合代理店における比較推奨販売の在り方を明確化したものであり、意向把握・確認義務の対象や把握方法そのものを変更する趣旨ではなく、従来から求められている意向把握・確認を前提として、比較推奨販売を行う場合の考え方や留意点を明確化したものです。","theme":"その他","section":"監督指針","tags":["比較推奨","意向把握","顧客の最善の利益"]},{"no":750,"location":"－","comment":"保険業法施行規則第227条の2第3項第4号で用いている「顧客の意向」は、保険業法第294条の2に基づく意向把握義務における「顧客の意向」と同義であるとの理解でよいか。\nまた、今般の比較推奨販売に関する改正により、意向把445握義務の対象や方法に変更が生じるものではないとの理解でよいかを確認したい。","pageStart":445,"pageEnd":446,"answer":"保険業法施行規則第227条の2第3項第4号における「顧客の意向」については、同法第294条の2に基づく意向把握・確認義務において把握すべき「顧客の意向」と同義です。\nまた、今般の比較推奨販売に関する改正は、意向把握・確認義務の対象や把握方法そのものを変更する趣旨ではなく、従来から求められている意向把握・確認を前提として、比較推奨販売を行う場合の考え方や留意点を明確化したものです。","theme":"その他","section":"監督指針","tags":["比較推奨","意向把握"]},{"no":751,"location":"－","comment":"監督指針Ⅱ－4－2－9(5)①A.及びB.で用いられている「保険募集の実務や募集形態等に応じて」との表現について、具体的にどのような募集実態や形態を想定しているのかを明らかにしてほしい。","pageStart":446,"pageEnd":446,"answer":"Ⅱ－4－2－9(5)①A.に規定する「乗合代理店が取り扱う複数の保険契約の契約内容を比較して説明する場合には、保険業法施行規則第227条の2第3項第4号イの規定の趣旨を踏まえた上で、保険募集の実務や募集形態等に応じて」とは、例えば、使用する募集手段(システム等)の違い、対面募集か非対面募集(WEB完結型募集を含む)かの別、取扱商品の内容・特性などを踏まえることを想定しています。(同①B.も同様)\n比較推奨販売の具体的な方法については、こうした実態に応じて合理的に判断されるべきものであり、特定の手法や運用を一律に求める趣旨ではありません。顧客の最善の利益を確保しつつ、実務上、実効性のある方法が選択されることが重要と考えます。","theme":"その他","section":"監督指針","tags":["比較推奨","顧客の最善の利益","システム・比較ツール"]},{"no":752,"location":"－","comment":"監督指針Ⅱ－4－2－9(5)①A.及びB.における「保険募集の実務や募集形態等に応じて」が具体的に意味するところについてご教示いただきたい。","pageStart":446,"pageEnd":446,"answer":"Ⅱ－4－2－9(5)①A.に規定する「乗合代理店が取り扱う複数の保険契約の契約内容を比較して説明する場合には、保険業法施行規則第227条の2第3項第4号イの規定の趣旨を踏まえた上で、保険募集の実務や募集形態等に応じて」とは、例えば、使用する募集手段(システム等)の違い、対面募集か非対面募集(WEB完結型募集を含む)かの別、取扱商品の内容・特性などを踏まえることを想定しています。(同①B.も同様)\n比較推奨販売の具体的な方法については、こうした実態に応じて合理的に判断されるべきものであり、特定の手法や運用を一律に求める趣旨ではありません。顧客の最善の利益を確保しつつ、実務上、実効性のある方法が選択されることが重要と考えます。","theme":"その他","section":"監督指針","tags":["比較推奨","顧客の最善の利益","システム・比較ツール"]},{"no":753,"location":"－","comment":"比較推奨販売に係る監督指針が厳格化され、乗合代理店の現場の負担が相当程度増えるようになると、代理店としては新たな人材の採用や社内システムの構築など追加的な支出が不可避となり、代理店の経営を大きく圧迫することになり、特に中小代理店についてはそうした影響が甚大になるものと考える。\nこうした懸念については金融審議会・制度等改正WGにおける検討の過程でも指摘があり、WG報告書においても記述があったものと理解しているが、今回の監督指針改正案においてはそうした懸念につきどのような配慮がされているのか。具体的にご教示いただきたい。\n446","pageStart":446,"pageEnd":447,"answer":"比較推奨販売に係る今般の監督指針改正については、顧客の最善の利益を勘案した適切な保険募集を確保することを目的とするものであり、乗合代理店に一律かつ過度な人員増強やシステム投資を求める趣旨ではありません。\n金融審議会等において指摘された中小規模代理店を含む現場の負担への懸念も踏まえ、監督指針では、体制整備の具体的な内容や方法については、代理店の規模や業務特性等に応じて合理的に判断されるべきものとしております。\nしたがって、比較推奨販売への対応にあたっては、形式的な対応や過度なコスト負担に陥ることなく、既存の人材や仕組みを活用しながら、実効性のある体制を整備することが重要であり、金融庁としても、顧客保護と代理店経営の持続可能性との両立が図られるよう、実態に即した運用が行われることを重視しております。","theme":"その他","section":"監督指針","tags":["比較推奨","顧客の最善の利益","システム・比較ツール"]},{"no":754,"location":"－","comment":"保険ショップ内に保険商品のパンフレットを陳列するスペースがあるが、全ての取扱保険商品を陳列することは物理的に不可能な場合がある。\n保険商品のパンフレットを陳列する行為は保険募集に該当しないと理解しているため、全ての取扱保険商品を陳列できていなくても比較推奨販売規制に違反するものではないという理解でよいか。\nなお、保険ショップ内での募集は監督指針Ⅱ－4－2－9(5)①B.に定める方法によることとし、パンフレットを陳列していることを理由として保険商品を推奨することはないという前提である。","pageStart":447,"pageEnd":447,"answer":"貴見のとおりです。\nただし、保険募集に当たっては、保険業法第294条第3項に基づき、あらかじめ、顧客に対し所属保険会社等の商号等を明らかにしなければならないことに留意する必要があります。\nなお、「パンフレットを陳列する行為は保険募集に該当しない」\nかどうかはその後の一連の流れで判断する必要がある点にも留意が必要です。","theme":"その他","section":"監督指針","tags":["比較推奨"]},{"no":755,"location":"Ⅱ－4－2－9(5)","comment":"改正案が比較推奨販売の適正化を重視している点は評価できるが、Web完結型募集を含む乗合代理店の比較サイトについては、比較範囲やランキング・おすすめ表示の根拠が不明確な事例が多く、消費者が誤認するおそれがある。\nそのため、Web上の比較表示が「推奨」に該当する基準や、取扱商品範囲の明示、表示根拠の開示方法、並びにWeb環境に即した顧客意向把握の方法を監督指針で明確化するとともに、Q&Aの公表や猶予期間の設定を求める。\n447","pageStart":447,"pageEnd":448,"answer":"比較対象範囲や取扱商品範囲、ランキングやおすすめ表示の根拠等については、保険業法第300条第1項第6号の規定に基づき、顧客に誤認を与えることのないよう分かりやすく情報提供を行う必要があります。\n乗合代理店においては、保険募集の実務や募集形態等に応じて、比較表示が顧客に与える影響を十分考慮した上で、関係法令及び監督指針の趣旨に即した適切な募集・表示を行うことが求められます。\nとりわけランキングやおすすめ表示については、提示するタイミングによっては、顧客意向の恣意的な誘導に繋がりかねず、顧客の適切な商品選択の機会が確保されない可能性があり得るため、Ⅱー4ー2－9(5)に則り、乗合代理店の規模や業務特性等に応じて、自社の募集実務や募集形態等を踏まえた適切な比較推奨販売が実施されるよう実効的な体制が整備されることが重要となります。","theme":"その他","section":"監督指針","tags":["比較推奨","意向把握"]},{"no":756,"location":"Ⅱ－4－2－9(5)","comment":"監督指針Ⅱ－4－2－9(5)柱書には、「乗合代理店(略)は、金融サービス提供法(略)に基づく顧客等に対する誠実公正義務の趣旨も踏まえ、顧客の最善の利益を勘案しつつ、適切な比較推奨販売(略)を行わなければならない」とある。\n一方で、保険業法施行規則第227条の2第3項第4号は、あくまで「比較推奨販売をしようとする場合」のみを規定しており、施行規則と監督指針の記載が整合していないように思われるがどうか。","pageStart":448,"pageEnd":448,"answer":"Ⅱ－4－2－9(5)の柱書は、乗合代理店が比較推奨販売を行う場合において、金融サービス提供法に基づく誠実公正義務の趣旨を踏まえ、顧客の最善の利益を勘案した対応が求められることを総論的に示したものです。\nそのため、保険業法施行規則第227条の2第3項第4号が「比較推奨販売をしようとする場合」に限定して規定している点と矛盾するものではなく、監督指針は、法令の規定を前提として、その具体的な考え方や運用上の留意点を明らかにする趣旨で記載しているものです。\nしたがって、比較推奨販売を行わない場合にまで、当該条項に基づく義務を一律に課す趣旨ではなく、相互に整合的な関係にあると考えます。","theme":"その他","section":"監督指針","tags":["比較推奨","顧客の最善の利益"]},{"no":757,"location":"Ⅱ－4－2－9(5)","comment":"監督指針Ⅱ－4－2－9(5)①A.において、「複数の保険契約の契約内容を比較して説明する場合(比較説明)」について、監督指針Ⅱ－4－2－2(9)②が参照されているが、乗合代理店は、同②の情報提供義務を遵守することに加えて、別途監督指針Ⅱ－4－2－9(5)①A.の内容も重ねて遵守する必要があるのか、その関係性を明確にしてほしい。\n448","pageStart":448,"pageEnd":449,"answer":"Ⅱ－4－2－9(5)①A.において、Ⅱ－4－2－2(9)②を参照している趣旨については、比較説明を行う場合における情報提供の基本的な考え方として、既存の顧客保護に関する規定を前提とすることを明確化したものです。\n乗合代理店においては、比較説明を行う場面において、Ⅱ－4－2－2(9)②を遵守することが基本となります。その上で、Ⅱ－4－2－9(5)①A.は、乗合代理店が比較推奨販売を行う場合に求められる考え方を示すものであり、Ⅱ－4－2－2(9)②とは別に新たな情報提供義務を重ねて課す趣旨ではありません。\n両者は、相互に補完関係にあり、比較説明を行う実務において、顧客の最善の利益を確保する観点から適切に対応することが重要であると考えます。","theme":"その他","section":"監督指針","tags":["比較推奨","顧客の最善の利益"]},{"no":758,"location":"Ⅱ－4－2－9(5)","comment":"監督指針Ⅱ－4－2－9(5)②ウ.(注)には、「顧客の意向や属性に応じた比較推奨販売に係る説明」とあるが、監督指針Ⅱ－4－2－9(5)①には、「属性に応じた比較推奨販売」\nの記載がない。どのような推奨販売の分類・方法を想定しているか。","pageStart":449,"pageEnd":449,"answer":"Ⅱ－4－2－9(5)②ウ.(注)における「顧客の意向や属性」とは、顧客の年齢、職業、保険に関する知識・経験、契約目的、リスクの性質等、募集の実務において、通常、把握される顧客の状況を総合的に指すものです。\nこれは、Ⅱ－4－4(顧客保護等)において求められている、顧客の知識・経験等に応じた分かりやすい説明や、顧客に不利益が生じないよう配慮した対応を求めたものです。\n一方、Ⅱ－4－2－9(5)①において、「属性」という文言を明示していないのは、比較推奨販売の基本的な枠組みを示す趣旨によるものであり、②ウ.(注)は、その具体的な説明に当たり、顧客の状況に応じた説明の在り方を補足的に示したものです。\n顧客の属性ごとに画一的な推奨販売の分類や方法を定めることを意図するものではなく、顧客の意向と併せて、理解度や状況に応じた合理的で分かりやすい説明が行われることが重要と考えます。","theme":"その他","section":"監督指針","tags":["比較推奨"]},{"no":759,"location":"Ⅱ－4－2－9(5)","comment":"所属保険会社のうち、特定の契約者からの要請などにより、当該契約者に関する新規または更新のみを扱っている保険会社については、他顧客への提示・推奨にあたり、これをあらかじめ除外してよいか。\n449450","pageStart":449,"pageEnd":450,"answer":"ご質問の趣旨が明らかではありませんが、乗合代理店は、自らが取り扱う所属保険会社等の保険商品について、Ⅱー4ー2－9(5)\nに則して、顧客の最善の利益を勘案しつつ、公正な保険募集を行うことが求められています。\nしたがって、代理店委託契約において定められた取扱い対象となる保険契約の中から、乗合代理店が独自の判断(理由等)のみにより、あらかじめ、比較推奨販売の対象とする保険契約を選定・決定することは適当ではありません。","theme":"その他","section":"監督指針","tags":["比較推奨","顧客の最善の利益","更改・継続"]}]</script>
<script>

const K={fav:'fsa20260828_fav_v2',read:'fsa20260828_read_v2',note:'fsa20260828_note_v2',hist:'fsa20260828_hist_v2',saved:'fsa20260828_saved_v2',pref:'fsa20260828_pref_v2'};let fav=new Set(JSON.parse(localStorage.getItem(K.fav)||'[]')),read=new Set(JSON.parse(localStorage.getItem(K.read)||'[]')),notes=JSON.parse(localStorage.getItem(K.note)||'{}'),hist=JSON.parse(localStorage.getItem(K.hist)||'[]'),saved=JSON.parse(localStorage.getItem(K.saved)||'[]'),compare=new Set(),page=1;const themes=[...new Set(DATA.map(x=>x.theme))],tags=[...new Set(DATA.flatMap(x=>x.tags))].sort((a,b)=>a.localeCompare(b,'ja'));themes.forEach(x=>$('theme').insertAdjacentHTML('beforeend',`<option>${esc(x)}</option>`));tags.forEach(x=>$('tag').insertAdjacentHTML('beforeend',`<option>${esc(x)}</option>`));
