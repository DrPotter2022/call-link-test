せんが、アンケート項目の妥当性等については、募集形態や顧客の属性等を踏まえつつ、個別具体的に判断されるため、一概に回答することは困難です。\n取扱実績は、販売方針、手数料水準、便宜供与、過去の推奨方法等の影響を受け得るため、それのみを主たる理由として、特定の保険契約を提示・推奨することは適切ではありません。\n特に、乗合代理店が独自に作成したアンケートや取扱実績等の情報を用いて特定の保険契約を推奨する場合において、それらが、例えば、従前、保険業法施行規則第227条の2第3項第4号ハに基づき、乗合代理店の店舗ごとに異なる保険会社の保険契約を取り扱っていたことを前提として、特定の保険契約を推奨するような資料や数値に基づくものであるときは、結果として、恣意的な選別・推奨と評価されるおそれが高いことに留意する必要があります。\nアンケートや取扱実績等を用いる場合には、集計期間、対象契約、対象顧客、件数、集計方法・評価方法等の合理性を適切に判断した上で、それらを明確にし、顧客に誤認を与えず、恣意的な誘導とならないよう、事後的に確認・検証できる態勢を整備することも重要です。","theme":"意向がない場合","section":"監督指針","tags":["便宜供与","手数料・インセンティブ","ハ方式"]},{"no":280,"location":"－","comment":"乗合代理店において、保険ニーズがまだ明確ではない顧客に対して、アンケートを通じて「保険契約において重視する項目」を事前に把握・提示し、ある程度商品を絞り込んで提案する取組を検討している。\nまた、代理店が有する独自情報(例：新規契約数ランキング等)を用いた説明についても検討している。\nこれらに関して、(1)顧客から独自のアンケート等により収集した項目を例示し、一定の選択肢に絞り込んだ上で提案する行為は、顧客意向の事前聞き取りによる提案(保険業法施行規則第227条の2第3項第4号ロ)となり、監督指針上問題ない認識だが相違ないか。\n(2)\n「売れ筋であるか」も顧客の意向の一つと考えているが、代理店独自で作成した情報(例:契約数ランキング等ファクトが存在する情報)で順位をつけることについて問題はないか。\n167","pageStart":167,"pageEnd":168,"answer":"アンケート等を用いて、顧客が保険契約において重視する事項を確認し、その意向に沿って保険契約を選別し、提示・推奨すること自体は否定されません。ただし、設問、選択肢、表示順、導線等により、顧客の意向が特定の保険会社又は特定の保険契約へ誘導されることのないよう留意する必要があります。\nまた、顧客の意向に沿って保険契約を選別し、提示・推奨する場合には、合理的かつ一定の具体性を有する基準や理由等を分かりやすく説明する必要があります。\n代理店独自の契約数ランキング等についても、顧客が「売れ筋」\nや他の顧客の契約動向を参考にしたいとの意向を示す場合には、参考情報として提示することは考えられます。\nただし、ランキング等は、販売方針、手数料水準、保険会社からの便宜供与、過去の推奨方法等の影響を受け得るため、それのみを主たる理由として特定の保険契約を推奨することは適切ではありません。\n特に、乗合代理店が独自に作成したランキング等の情報を用いて特定の保険契約を推奨する場合において、当該ランキング等が、例えば、従前、保険業法施行規則第227条の2第3項第4号ハに基づき、乗合代理店の店舗ごとに異なる保険会社の保険契約を取り扱っていたことを前提として、特定の保険契約を推奨するような資料や数値に基づくものであるときは、結果として、恣意的な選別・推奨と評価されるおそれが高いことに留意する必要があります。\nランキング等を用いる場合には、集計期間、対象契約、対象顧客、件数、集計方法・評価方法等の合理性を適切に判断した上で、それらを明確にし、顧客に誤認を与えず、恣意的な誘導とならないよう、事後的に確認・検証できる態勢を整備することも重要です。","theme":"意向がない場合","section":"監督指針","tags":["便宜供与","手数料・インセンティブ","ハ方式"]},{"no":281,"location":"－","comment":"商品の内容や保険料に大きな差がない中で、保険商品の僅かな違いを突き詰めて説明する事は、時間と労力が必要となり、代理店への負担、ビジネスへの影響が大きいと考える。\nまた、意向が明確となっていない顧客にとっても分かりにくくならないか懸念している。","pageStart":168,"pageEnd":168,"answer":"貴重なご意見として承ります。\n乗合代理店が比較推奨販売を行うに当たり、全ての案件について、全ての取扱保険会社の商品を網羅的に見積り・説明し、又は商品の細部の差異まで一律に説明することを求めるものではありません。\n商品内容や保険料水準に大きな差異がない場合には、その旨を説明した上で、顧客が重視する事項に照らし、保障（補償）内容、保険料水準、特約等、顧客の判断に資する事項を分かりやすく説明することが重要です。\nまた、顧客の意向が不明確な場合には、顧客が重視し得る事項を確認するなど、可能な限り意向の形成を促し、又は意向の明確化に努めた上で、把握した顧客の意向に沿って、合理的かつ一定の具体性を有する基準や理由に基づき、保険契約を選別・提示・推奨することが重要です。\nなお、手数料水準、販売目標、保険会社からの便宜供与等の代理店側の都合により、特定の保険会社又は特定の保険契約へ誘導することは適切ではありません。","theme":"意向がない場合","section":"監督指針","tags":["便宜供与","手数料・インセンティブ","比較推奨"]},{"no":282,"location":"－","comment":"保険業法施行規則第227条の2第3項第4号ハが廃止され、同号ロへ一本化される方向性には賛同するが、顧客の意向168把握の深度や範囲が不明確なまま運用されることに強い懸念がある。\n意向把握を画一的・網羅的に求めると、顧客の理解度や関心度に関わらず過度な負担を与え、混乱や意思決定の遅延を招きかねない。\n顧客が「担当従業員に任せる」と明確に意思表示した場合には、その意思を一つの顧客意向として尊重し、合理的な範囲で保険会社を選別・推奨する実務は顧客本位に適うと考える。全取扱保険会社の見積提示を一概に求める運用は、時間やコストを徒に増大させ、顧客が求めていない形式的な比較を強いる結果となり、顧客利便性や顧客本位の趣旨を損なうおそれがある。\n今後の監督指針やガイドラインの策定に当たっては、意向把握を形式的・画一的に求めるのではなく、顧客の意思表示の内容や明確性に応じた柔軟な運用が可能となるよう、実務実態を踏まえた整理を求めたい。","pageStart":168,"pageEnd":169,"answer":"貴重なご意見として承ります。\n乗合代理店が比較推奨販売を行うに当たり、全ての案件について、全ての取扱保険会社の商品を網羅的に見積り・説明することを一律に求めるものではありません。\n顧客の意向、理解度、商品特性、募集形態等を踏まえ、顧客の理解に資する実効的な対応を行うことが重要です。\nまた、顧客が「担当従業員に任せる」と明確に述べた場合においても、その意思表示のみをもって、乗合代理店が任意に特定の保険会社又は特定の保険契約を選別し、提示・推奨することは適切ではありません。\nその場合でも、当該意思表示がされたことを踏まえつつ、保障(補償)内容、保険料水準、特約等、顧客が重視し得る事項を可能な限り確認し、把握した顧客の意向に沿って、合理的かつ一定の具体性を有する基準や理由等に基づき説明する必要があります。\nなお、手数料水準、販売目標、便宜供与等の代理店側の都合により、特定の保険会社又は特定の保険契約へ誘導することは適切ではありません。","theme":"意向がない場合","section":"監督指針","tags":["便宜供与","手数料・インセンティブ","比較推奨","ハ方式","意向把握"]},{"no":283,"location":"Ⅱ－4－2－9(5)","comment":"意向把握や比較推奨の改正そのものには賛成であり、保険代理店が顧客に最適な提案を行うのは本来当然の役割だと考える。\n一方で、これまで国や保険会社が容認してきた乗合代理店制度の問題点について、その責任や負担が代理店側に一方的に押し付けられている点に強い違和感がある。\n多くのプロ代理店にとって意向把握や比較推奨は既に実践している業務であるが、乗合代理店の中には保険を本業と捉えていない意識が残っており、資格・知識水準や覚169悟の面で課題があると感じる。そのため、まず業界全体で意識改革やマインドセットの徹底が必要である。\nまた、改正内容は従来と大きく変わらない一方で、具体的な意向把握の方法や「ベストな提案」を誰がどのように判断するのかが不明確である。苦情が発生した場合においても、対応の基準が曖昧である点に不満がある。\nさらに、比較販売が困難な代理店が保険会社の絞り込みに走ることで、新たな便宜供与が生じる懸念もある。\n総じて、改正の方向性自体は妥当だが、現状是正のための運用が不十分であり、本気で是正するのであれば、明確なルールと当局として強いトーンでの実施姿勢が必要だと考えている。","pageStart":169,"pageEnd":170,"answer":"貴重なご意見として承ります。\n今般の改正は、乗合代理店における比較推奨販売について、代理店側の都合ではなく、顧客の意向に沿って保険契約を選別し、提示・推奨することにより、顧客の適切な商品選択の機会を確保する趣旨のものです。\n一方で、全ての案件について、全ての取扱保険会社の商品を網羅的に見積り・説明することを一律に求めるものではありません。顧客の意向、理解度、商品特性、募集形態等を踏まえ、顧客の理解に資する実効的な対応を行うことが重要です。\nまた、顧客の意向が不明確な場合には、顧客が重視し得る事項を確認するなど、可能な限り意向の形成を促し、又は意向の明確化に努めた上で、把握した顧客の意向に沿って、合理的かつ一定の具体性を有する基準や理由等に基づき保険契約を選別し、提示・推奨することが重要です。\n保険会社及び保険代理店においては、保険募集人への教育・管理・指導、比較推奨販売に係る社内規則・記録・検証態勢の整備、募集品質の維持・向上に取り組むことが重要です。また、保険会社による代理店支援についても、顧客保護や募集品質向上に資する範囲で適切に行われることが必要です。\nなお、手数料水準、販売目標、保険会社からの便宜供与等の代理店側の都合により、特定の保険会社又は特定の保険契約へ誘導することは適切ではありません。\n金融庁としても、乗合代理店を含め、比較推奨販売の適切性、過度の便宜供与の防止、保険会社による代理店管理の実効性、顧客本位の業務運営が実質的に確保されているかについて、引き続き、適切にモニタリングしてまいります。","theme":"意向がない場合","section":"監督指針","tags":["便宜供与","手数料・インセンティブ","比較推奨","意向把握","証跡・記録"]},{"no":284,"location":"Ⅱ－4－2－9(5)","comment":"比較推奨販売では、保険業法施行規則第227条の2第3項第4号ハが廃止されるが、ディーラーのような兼業代理店では、顧客の意向によって乗合保険会社全社の見積もり作成や比較説明の対応が求められるとのことだが、顧客自身が比較内容を理解できていない、または求めていないケースも多い。車両購入とセットで任意保険を加入する顧客は、セールスから勧めてもらう内容で判断することも多い。\n170また、車両販売も保険も本業であるゆえ、顧客にあった商品を提案するのであれば、絞り込んだ提案が顧客本位と言えるのではないか。やみくもに多くの保険会社を提示して比較することが正しいとは思えない。\nさらに、乗合保険会社の全商品知識を習得するのは難しく、結果的に曖昧な提案になる可能性があることに加え、セールスの負担も多大となる。\n顧客への提案時間や知識習得にかかる時間を踏まえると、難しくしすぎであり、顧客もそこまで求めていないのではないか。せめて乗合保険会社の中での2社は、最低としたラインが顧客にもセールスにも望ましいのではないか。","pageStart":170,"pageEnd":171,"answer":"貴重なご意見として承ります。\n乗合代理店が比較推奨販売を行うに当たり、全ての案件について、全ての取扱保険会社の商品を網羅的に見積り、説明することを一律に求めるものではありません。\n顧客の意向、商品特性、募集形態等を踏まえつつ、顧客の理解に資する実効的な方法により、保険契約を選別し、提示・推奨することが重要です。\n一方で、所属保険会社等の中からあらかじめ「2社に限る」など、代理店側の都合により比較対象を固定的に限定することは、顧客の意向に沿った選別とはいえません。\n顧客が代理店による提案を希望する場合であっても、保障(補償)内容、保険料水準、特約等、顧客が重視し得る事項を可能な限り確認し、把握した意向に沿って合理的かつ一定の具体性を有する基準や理由等に基づき提示・推奨する必要があります。\nまた、手数料水準、販売目標、保険会社からの便宜供与等の代理店側の都合により、特定の保険会社又は特定の保険契約へ誘導することは適切ではありません。","theme":"意向がない場合","section":"監督指針","tags":["便宜供与","手数料・インセンティブ","比較推奨","ハ方式"]},{"no":285,"location":"Ⅱ－4－2－9(5)","comment":"顧客が特定の保険会社のオフィシャルWEBサイト等の情報により当該保険会社の保険契約への加入意向を有するに至った後に、当該保険会社から当該顧客の対応を依頼された乗合代理店が保険募集を行う場合、当該顧客の判断のみにより、当該顧客から当該特定の保険会社の保険契約が指定されたと理解できるため、比較推奨販売の対象外であるという理解でよいか。\nなお、保険会社から乗合代理店に対して提供される顧客情報は、保険会社にとっての個人情報の利用目的を前提として取得したものであり、乗合代理店にとっての個人情報の利用目的を前提として取得していないため、乗合代理店が当該保険会社以外の保険会社の保険契約を案内することはできないと考えている。\n171","pageStart":171,"pageEnd":172,"answer":"「顧客の判断のみにより、当該顧客から特定の保険会社の保険契約が指定された」といえるか否かについては、当該指定が保険募集人による選別・提案が実質的に伴わず、顧客の主体的な判断のみに基づくものといえるかなど、個別具体的に判断される必要があります。\n貴見のケースについては、保険会社と乗合代理店の役割分担が必ずしも明確ではなく、様々な役割分担が想定されるため、一律の見解を示すことは困難です。\nなお、当該役割分担を定める場合には、比較推奨販売に係る規定の潜脱とならないよう留意するとともに、乗合代理店として一般に求められる機能・役割等を踏まえた上で、顧客の意向把握や保険契約の選別・提案が実質的かつ確実に行われるよう、当該役割分担が合理的かつ適切に定められることが望ましいと考えます。\nまた、保険会社から顧客対応の依頼を受けた場合であっても、乗合代理店が保険募集を行う過程において、顧客の意向を把握し、他の保険契約との比較説明や当該意向に沿った選別・提案を行う場合には、比較推奨販売に係る対応が求められます。\nこのほか、他の保険契約の案内を行う場合には、個人情報保護法等の関係法令を踏まえ、適切な対応を行う必要があります。","theme":"指名買い","section":"監督指針","tags":["比較推奨","意向把握"]},{"no":286,"location":"－","comment":"監督指針Ⅱ－4－2－9(5)①B.について、保険グループ内の乗合保険代理店が、グループ内の保険会社と共同で運営するウェブサイトにおいて募集を行う場合、当該サイトが実質的に当該保険会社のウェブサイトの一部として機能しており、かつ、サイト上の表示において「当該保険会社の商品のみを取り扱う旨」、「他の保険を希望される場合の導線」が顧客に明確に明示されているのであれば、顧客は「ここは特定の保険会社の商品を申し込む場である」と認識して手続きを進めているといえる。\nこのようなスキームにおいては、顧客の誤認を招くおそれはなく、かつ、顧客自身が特定社の商品を求めて来訪していることから当該グループ内保険商品を優先的に検討する明確な意向(実質的に指名買いと同等のもの)として合理的に評価し得ると考える。\nしたがって、当該ページにおいては、比較推奨義務の対象外(又は、当該一社を推奨する合理的理由がある)と整理し、改めて網羅的な比較推奨を行わずとも許容されるという理解で差し支えないか。\nまた、上記が共同募集であり、その旨、明示している場172合はどうか。","pageStart":172,"pageEnd":173,"answer":"ご指摘のようなウェブサイト等を通じた保険募集であっても、当該来訪経路やサイト構成等のみをもって、直ちに比較推奨販売の対象外となるものではありません。\n今般の改正の趣旨を踏まえ、保険募集の一連の過程を通じて、その意向形成過程や募集態様が、実質的に特定の保険契約(群)への誘導を図るものとなっていないか、また、その結果として、顧客の適切な商品選択の機会が実質的に阻害されていないかについて、個別具体的かつ慎重に判断される必要があります。\nこのため、当該サイトにおいて乗合代理店として保険募集を行う場合には、上記の点に留意しつつ、Ⅱ－4－2－9(5)①B.に照らし、顧客が重視する事項を丁寧かつ明確に把握した上で、顧客にとって適切な商品選択が行われるよう、意向把握の方法や情報提供の在り方を含め、適切な対応を行うことが求められます。","theme":"指名買い","section":"監督指針","tags":["比較推奨","意向把握","共同募集"]},{"no":287,"location":"－","comment":"デジタル乗合代理店がWEBサイトやアプリなどでお客様に対して商品を比較できる情報を提供している場合、お客様の利便性の観点からお客様が自ら特定の商品を選択した後に、改めてその他の商品との比較表示をすることは必須ではないとの理解でよいか。","pageStart":173,"pageEnd":173,"answer":"ご指摘のようなウェブサイト等を通じた保険募集であっても、当該来訪経路やサイト構成等のみをもって、直ちに比較推奨販売の対象外となるものではありません。\n今般の改正の趣旨を踏まえ、保険募集の一連の過程を通じて、その意向形成過程や募集態様が、実質的に特定の保険契約(群)への誘導を図るものとなっていないか、また、その結果として、顧客の適切な商品選択の機会が実質的に阻害されていないかについて、個別具体的かつ慎重に判断される必要があります。\nこのため、当該サイトにおいて乗合代理店として保険募集を行う場合には、上記の点に留意しつつ、Ⅱ－4－2－9(5)①B.に照らし、顧客が重視する事項を丁寧かつ明確に把握した上で、顧客にとって適切な商品選択が行われるよう、意向把握の方法や情報提供の在り方を含め、適切な対応を行うことが求められます。","theme":"指名買い","section":"監督指針","tags":["比較推奨","意向把握"]},{"no":288,"location":"Ⅱ－4－2－9(5)","comment":"顧客の意向には、単なる保障ニーズに留まらず、特定の企業グループのブランドやポイント付与等のメリットの享受を目的とする合理的な選択が存在する。\nそのような企業グループ内の保険代理店の場合、そのような顧客の意向を踏まえ、顧客が期待するメリット(グループサービスとの親和性、ポイント付与等)を前提にグループ内保険商品を優先的に検討することが、顧客にとっての最善の利益に資する場合があると理解している。\n例えば、そのような企業グループの場合、WEB完結型募集において、「他社比較を希望する入口」と「グループ内商品を希望する入口」を明確に区分し、顧客の誤認防止に努めるとともに、相互に案内導線(他社比較を希望する場合の遷移導線等)を確保している場合、顧客が自発的に後者を選択して来訪した行為は、当該グループ内保険商品を優先的に検討する明確な意向表明であり、実質的に指名買いと同等と評価し得ると考える。\nしたがって、当該ページにおいては顧客の明確な意向に基づき、不要な情報提供による混乱を避け、効率的な手続きを可能とする観点から、改めて網羅的な他社比較を行わ173ずとも許容されるという理解で差し支えないか。","pageStart":173,"pageEnd":174,"answer":"顧客がブランド等の要素を希望する意思を表示した場合であっても、来訪経路や画面構成その他の募集態様のみをもって、直ちに顧客が特定の保険契約(群)を主体的に選択したものと評価できるものではなく、その意向形成過程や募集態様が、実質的に特定の保険契約(群)への誘導となるものとなっていないか、また、その結果として、顧客の適切な商品選択の機会が実質的に阻害されていないかについて、個別具体的に判断される必要があります。\nこのため、乗合代理店として保険募集を行うに当たっては、上記の点に留意しつつ、Ⅱ－4－2－9(5)①B.に照らし、顧客が重視する事項を丁寧かつ明確に把握した上で、顧客にとって適切な商品選択が行われるよう、意向把握の方法や情報提供の在り方を含め、適切な対応を行うことが求められます。","theme":"指名買い","section":"監督指針","tags":["意向把握"]},{"no":289,"location":"Ⅱ－4－2－9(5)","comment":"令和7年8月28日に公表された「「保険会社向けの総合的な監督指針」等の一部改正(案)に対するパブリックコメントの結果等の公表について」における「コメントの概要」\n及び「金融庁の考え方」No.30において、「顧客が特定の商品を指定してきた場合は比較推奨販売の対象外である」との見解が示されているが、この場合であっても、指定商品以外の保険会社の保険契約もある旨や、それらの保険契約の概要または契約内容の説明が必要となるのか。","pageStart":174,"pageEnd":174,"answer":"保険募集人による保険契約の選別・提案が実質的に伴わず、顧客の主体的な判断のみにより、顧客から特定の保険会社又は特定の保険契約が指定され、その結果、加入の対象となる一の保険契約が選択された場合には、保険業法施行規則第227条の2第3項第4号ロの適用対象とならないことから、Ⅱ－4－2－9(5)①B.において定める対応が直ちに求められるものではありません。\nただし、この場合であっても、法令に基づく権限明示等の基本的な説明義務が適用される点に留意が必要です。","theme":"指名買い","section":"監督指針","tags":["比較推奨"]},{"no":290,"location":"Ⅱ－4－2－9(5)","comment":"乗合代理店がA生命保険会社の保険契約(生保既契約)を取り扱っている場合に、当該生保既契約の保険契約者(既契約者)に対して当該生保既契約の内容確認を行うとともにA生命保険会社の新商品の案内を行うことがある。その際、当該乗合代理店がかかる内容確認及び案内を保険募集に該当しない範囲で行う限り、比較推奨販売規制は適用されないと理解している。\nかかる案内実施後、当該既契約者が当該新商品の案内を希望したため、当該乗合代理店が当該新商品の保険募集を行う場合は、当該既契約者の判断のみにより当該新商品が指定されたと考えられるため、比較推奨販売が求められないという理解になるのか、それとも、当該既契約者に対して当該新商品以外の同種の保険契約の案内を希望するか否かを確認した上で、その意向に沿って対応することが求められるという理解になるのか。\nなお、当該乗合代理店が適切に権限明示を行うことを前174提としている。","pageStart":174,"pageEnd":175,"answer":"新商品の案内等が保険募集に該当しないかどうかは内容や態様等に照らして個別具体的に判断される必要があります。保険募集に該当しない行為が行われる場合においては、情報提供義務が直ちに適用されないため、比較推奨販売に係る規定も同様に適用されません。\nしかしながら、その後、保険募集が行われる場合には、顧客の意向を適切に把握する必要があります。\n乗合代理店における情報提供は、顧客が適切な理解に基づき、複数の保険契約の中から顧客が自主的な判断により保険契約を選択するために行われるものです。顧客が抱えるリスクの中でどの部分を保険によってカバーするのかは顧客ごとに異なるとともに、顧客の理解度合いも様々であることを踏まえつつ、取り扱う保険契約や募集形態に応じて、顧客の意向を実質的に把握し、これに沿った情報提供を行うことが求められます。\nその上で、保険募集人による選別・提案が実質的に伴わず、顧客の主体的な判断のみにより特定の保険契約が選択された場合には、直ちに保険業法施行規則第227条の2第3項第4号ロ(推奨販売)に係る対応が必要となるものではありません。\nただし、通常の意向把握プロセスを経る過程において、乗合代理店が他の保険契約との比較説明を行う場合には同号イに係る対応が求められるとともに、顧客の状況や意向の内容に照らし、他の保険契約についても検討の余地が認められる場合には、意向把握・確認義務や比較推奨販売に係る規制の趣旨・目的を踏まえた適切な対応が求められます。\n乗合代理店においては、顧客の最善の利益を勘案する観点からも、規制の趣旨・目的を十分に踏まえ、比較推奨販売に係る規制の潜脱とならないよう、実効的な対応を行う必要があります。","theme":"指名買い","section":"監督指針","tags":["比較推奨","意向把握","顧客の最善の利益"]},{"no":291,"location":"Ⅱ－4－2－9(5)","comment":"企業グループ内の保険代理店が、同グループ内の事業会社を契約者とする保険契約の募集を行う場合において、契約者である事業会社が「グループ内の連携強化・シナジー発揮のため、グループ内の保険会社と契約したい」という明確な意向を示した場合について、当該意向を適切に記録した上で、グループ内保険会社の商品を中心に提案することは、顧客の意向に基づく選別として許容されるという理解でよいか。\n175","pageStart":175,"pageEnd":175,"answer":"顧客が自発的に示した意向に沿って保険契約の提案・説明を行うことは、基本的には保険業法第294条の2に基づく意向把握・確認義務に沿った対応と考えられます。\nただし、貴見のような意思が示された場合であっても、その意思表示がされるまでの過程や募集態様について、顧客の主体的な判断のみに基づくものといえるか、実質的に特定の保険契約(群)\nへの誘導を図るものとなっていないか、また顧客のリスク特性等を踏まえた適切な意向把握・確認が行われる態様となっているかについては、個別具体的に判断される必要があります。\nこのため、乗合代理店が同一企業グループ内の事業会社に対して保険募集を行う場合であっても、グループ内の取引関係等に係る事情のみに着目するのではなく、顧客のリスク特性等を適切に踏まえた提案が行われるよう、適切な意向把握・確認を行うことが求められると考えます。","theme":"指名買い","section":"監督指針","tags":["意向把握","証跡・記録"]},{"no":292,"location":"Ⅱ－4－2－9(5)","comment":"監督指針Ⅱ－4－2－9(5)①B.について、WEBマーケティングにおいて、特定の保険会社名・商品名等を明示した広告(バナー、検索連動型広告、メールマガジン、埋め込み型広告、ダイレクトメッセージ等)やWEB埋め込み型のクリック型のシステム等を通じ、顧客が当該広告等を能動的に押下して募集ページに来訪した場合や、保険会社が実施するキャンペーン広告から来訪した場合、当該商品を希望する顧客の意向は明確に表明されており、実質的に指名買いと同等であると考える。\nこのような顧客の明確な意向が確認できる状況において、改めて網羅的な比較推奨を行うことは、顧客意向にそぐわないだけでなく、情報過多による顧客の混乱を招き、結果として顧客の利便性を害し、最善の利益を阻害する結果になりかねない。\nしたがって、上記のような広告から流入したことが記録上明らかな場合は、比較推奨販売の対象外と整理して差し支えないか。","pageStart":176,"pageEnd":176,"answer":"貴見のいう乗合代理店によるWEBマーケティングといった個々の行為が保険募集に該当しないか否かについては、個別具体的かつ慎重に判断される必要があります。\nまた、一般に、複数の保険契約を取り扱う乗合代理店においては、顧客が抱えるリスクを的確に把握し、顧客が複数の保険契約の中から自主的な判断により保険契約を選択できるよう、顧客の意向を丁寧かつ適切に把握するとともに、必要な情報提供が行われることが重要です。乗合代理店においては、こうした一般に求められる機能・役割等を踏まえた上で、規制の趣旨・目的を十分に踏まえ、比較推奨販売に係る規定の潜脱とならないよう、実効的な対応を行う必要があります。\nその上で、保険募集に該当しない広告等を契機として特定の保険契約に関心を有する顧客が来訪した場合であっても、当該顧客による当該保険契約の選択が、保険募集人による選別・提案が実質的に伴っていないものであるか、顧客の主体的な判断のみによりなされたものといえるかについては、その態様等を踏まえ、個別具体的に判断される必要があります。\nしたがって、当該来訪経路のみをもって一律に規則第227条の2第3項第4号ロ(推奨販売)に係る対応が不要と整理されるものではありません。意向把握を含めた一連の保険募集の過程において、保険募集人が比較・推奨に実質的に関与する態様が認められるときには、その内容に応じた対応が求められます。\nまた、乗合代理店が行う広告の内容や表示方法については、実質的に特定の保険契約の優先的な取扱いを誘引するものとなっていないか、必要性・合理性・相当性の観点から慎重に検討することが重要です。","theme":"指名買い","section":"監督指針","tags":["比較推奨","意向把握","証跡・記録","システム・比較ツール"]},{"no":293,"location":"－","comment":"当社のホームページにあるインターネット上のリンク(システム環境の整った提携保険会社の一部のみ対応可能)により、お客さまが、直接保険申し込みを行う場合は、比較推奨不要であることを確認したい。\n176","pageStart":176,"pageEnd":177,"answer":"貴見のいう乗合代理店によるWEBマーケティングといった個々の行為が保険募集に該当しないか否かについては、個別具体的かつ慎重に判断される必要があります。\nまた、一般に、複数の保険契約を取り扱う乗合代理店においては、顧客が抱えるリスクを的確に把握し、顧客が複数の保険契約の中から自主的な判断により保険契約を選択できるよう、顧客の意向を丁寧かつ適切に把握するとともに、必要な情報提供が行われることが重要です。乗合代理店においては、こうした一般に求められる機能・役割等を踏まえた上で、規制の趣旨・目的を十分に踏まえ、比較推奨販売に係る規定の潜脱とならないよう、実効的な対応を行う必要があります。\nその上で、保険募集に該当しない広告等を契機として特定の保険契約に関心を有する顧客が来訪した場合であっても、当該顧客による当該保険契約の選択が、保険募集人による選別・提案が実質的に伴っていないものであるか、顧客の主体的な判断のみによりなされたものといえるかについては、その態様等を踏まえ、個別具体的に判断される必要があります。\nしたがって、当該来訪経路のみをもって一律に規則第227条の2第3項第4号ロ(推奨販売)に係る対応が不要と整理されるものではありません。意向把握を含めた一連の保険募集の過程において、保険募集人が比較・推奨に実質的に関与する態様が認められるときには、その内容に応じた対応が求められます。\nまた、乗合代理店が行う広告の内容や表示方法については、実質的に特定の保険契約の優先的な取扱いを誘引するものとなっていないか、必要性・合理性・相当性の観点から慎重に検討することが重要です。","theme":"指名買い","section":"監督指針","tags":["比較推奨","意向把握","システム・比較ツール"]},{"no":294,"location":"Ⅱ－4－2－9(5)","comment":"乗合代理店において、特定の保険会社の保険契約の取扱数が非常に多いなどの理由から、当該保険会社の保険商品について説明できる保険募集人をオペレーターとして配置するコールセンターを設ける場合がある。\nその際、乗合代理店において、ホームページ等で当該保険会社の保険商品の資料請求を受け付け(資料請求画面は当該保険会社以外の保険会社の保険商品も選択できるようになっている前提である。)、当該商品のパンフレット等を郵送した後(この段階で適切に権限明示を行う前提である。)に、当該保険商品について説明できるオペレーターから架電をする場合がある。\nその際、当該オペレーターにおいて当該保険商品の募集を行う場合は、当該資料請求者の判断のみにより当該保険商品が指定されたと考えられるため、比較推奨販売が求められないという理解でよいか。\n177","pageStart":177,"pageEnd":178,"answer":"資料請求を契機として特定の保険商品への関心が示された場合であっても、その後の電話対応において保険募集が行われる場合には、意向把握・確認義務を適切に履行する必要があることから、資料請求が特定の保険契約のみを対象として行われたことをもって、直ちに比較推奨販売に係る規定の適用対象外となるものではありません。\n意向把握を行うに当たっては、顧客の保険商品に対する理解度合いにも留意しつつ、顧客が抱えるリスクを的確に把握し、顧客が複数の保険契約の中から自主的な判断により保険契約を選択できるよう、顧客の意向を丁寧かつ適切に把握するとともに、必要な情報提供が行われることが重要です。\nその上で、一連の保険募集の過程において、当該保険契約の特定が保険募集人による選別・提案を実質的に伴わず、顧客の主体的な判断のみにより特定の保険契約が選択されているといえるかについては、個別具体的に判断される必要があります。\nまた、通常の意向把握プロセスを経る過程において、乗合代理店が他の保険契約との比較説明を行う場合には、保険業法施行規則第227条の2第3項第4号イに係る対応が求められるとともに、顧客の状況や意向の内容に照らし、他の保険契約についても検討の余地が認められる場合には、意向把握・確認義務や比較推奨販売に係る規制の趣旨・目的を踏まえた適切な対応が求められます。\nそうした募集過程において、顧客が他の保険契約の説明を希望した場合には、当該希望に沿って適切な対応を行う必要があります。\n乗合代理店においては、顧客の最善の利益を勘案する観点からも、規制の趣旨・目的を十分に踏まえ、比較推奨販売に係る規制の潜脱とならないよう、実効的な対応を行う必要があります。","theme":"指名買い","section":"監督指針","tags":["比較推奨","意向把握","顧客の最善の利益"]},{"no":295,"location":"Ⅱ－4－2－9(5)","comment":"「「平成26年改正保険業法(2年以内施行)に係る政府令・監督指針案」に対するパブリックコメント結果等について」における「コメントの概要及びコメントに対する金融庁の考え方」No.508において、顧客が特定の保険会社・特定商品を指定し、その範囲内で保険募集が行われている場合には、改正前監督指針Ⅱ－4－2－9(5)の対象外である旨の見解が示されている。\n例えば、空港の海外旅行保険の発券機は特定社のみを扱う販売機として設置され、顧客が自ら、当該販売機を選択し、加入できるようになっているが、顧客が特定の保険会社の販売機であることが認識できる状況下において、当該発券機を自ら選択して加入している場合においては、顧客が特定の保険会社・特定商品を指定していることが明らかであり、比較推奨販売の対象外であると考えてよいか。","pageStart":178,"pageEnd":178,"answer":"一般論として、保険募集人による選別・提案が実質的に伴わず、顧客の主体的な判断のみにより特定の保険契約が選択された場合は、保険業法施行規則第227条の2第3項第4号ロの適用対象とならないと考えられます。\nご指摘のような海外旅行保険の販売機による加入についても、海外旅行保険という商品特性や販売機による保険募集という態様のもとで、顧客が当該販売機の性質を理解した上で主体的に特定の保険契約を選択している場合には、当該考え方に該当し得ます。ただし、最終的には、保険募集の態様等を踏まえ、個別具体的に判断される必要があります。","theme":"指名買い","section":"監督指針","tags":["比較推奨"]},{"no":296,"location":"－","comment":"比較可能な同種の保険契約の中から、一又は二以上の保険契約の提案をしようとすることなく、顧客の判断のみによって加入する保険契約が特定された場合には、提示・推奨理由の説明は求められない、との理解でよいか。","pageStart":178,"pageEnd":178,"answer":"保険募集人による選別・提案が実質的に伴わず、顧客の主体的な判断のみにより一の保険契約が選択された場合には、直ちに保険業法施行規則第227条の2第3項第4号ロ(推奨販売)に係る対応が必要となるものではありません。\nただし、当該選択が顧客の主体的判断に基づくものであるか、又はその過程において保険募集人による恣意的な誘導が行われていないかについては、個別具体的に判断される必要があります。\nなお、顧客の判断過程において、保険募集人が営業上の理由等により恣意的に誘導する行為は、内容や態様等によっては、同法第300条第1項第1号及び第6号に抵触するおそれがあることから、厳に慎む必要があると考えます。","theme":"指名買い","section":"監督指針","tags":[]},{"no":297,"location":"Ⅱ－4－2－9(5)","comment":"「「平成26年改正保険業法(2年以内施行)に係る政府令・監督指針案」に対するパブリックコメント結果等について」における「コメントの概要及びコメントに対する金融庁の考え方」No.508においては、顧客が特定の保険会社・178特定商品を指定し、その範囲内で保険募集が行われている場合には、改正前監督指針Ⅱ－4－2－9(5)の対象外になる旨見解が示されており、改正後も顧客が特定の保険会社・特定商品を指定する場合は、顧客の意向が明確であり、比較推奨販売の対象外と考えるが、顧客が特定保険会社・特定商品を指定するように恣意的に誘導する行為は不適切となるとの理解でよいか。","pageStart":178,"pageEnd":179,"answer":"保険募集人による選別・提案が実質的に伴わず、顧客の主体的な判断のみにより一の保険契約が選択された場合には、直ちに保険業法施行規則第227条の2第3項第4号ロ(推奨販売)に係る対応が必要となるものではありません。\nただし、当該選択が顧客の主体的判断に基づくものであるか、又はその過程において保険募集人による恣意的な誘導が行われていないかについては、個別具体的に判断される必要があります。\nなお、顧客の判断過程において、保険募集人が営業上の理由等により恣意的に誘導する行為は、内容や態様等によっては、同法第300条第1項第1号及び第6号に抵触するおそれがあることから、厳に慎む必要があると考えます。","theme":"指名買い","section":"監督指針","tags":["比較推奨"]},{"no":298,"location":"Ⅱ－4－2－9(5)","comment":"顧客が特定の保険会社の商品を指定し、その範囲内で保険募集が行われている場合には、監督指針Ⅱ－4－2－9(5)(乗合代理店における比較推奨販売)の対象外であるという理解でよいか。","pageStart":179,"pageEnd":179,"answer":"保険募集人による選別・提案が実質的に伴わず、顧客の主体的な判断のみにより一の保険契約が選択された場合には、直ちに保険業法施行規則第227条の2第3項第4号ロ(推奨販売)に係る対応が必要となるものではありません。\nただし、当該選択が顧客の主体的判断に基づくものであるか、又はその過程において保険募集人による恣意的な誘導が行われていないかについては、個別具体的に判断される必要があります。\nなお、顧客の判断過程において、保険募集人が営業上の理由等により恣意的に誘導する行為は、内容や態様等によっては、同法第300条第1項第1号及び第6号に抵触するおそれがあることから、厳に慎む必要があると考えます。","theme":"指名買い","section":"監督指針","tags":["比較推奨"]},{"no":299,"location":"Ⅱ－4－2－9(5)","comment":"当初から顧客が募集人の所属保険会社のうち特定の保険会社との契約を明確に希望し、募集人が顧客の意向に沿って当該保険会社の商品を販売する場合には、今回の改正監督指針案における比較推奨販売に該当せず、同指針案の適用がないという理解でよいか。\n179","pageStart":179,"pageEnd":180,"answer":"保険業法施行規則第227条の2第3項第4号ロ(推奨販売)に係る対応の要否は、顧客の意向に照らし、「二以上の比較可能な同種の保険契約」が存在するか、当該意向に沿って選別・提案を行うか否かによって定まります。\nこのとき、顧客が特定の保険会社の保険加入を希望した場合であっても、顧客の意向に照らした結果、同一保険会社内において、「二以上の比較可能な同種の保険契約」が存在し、選別・提案を行う場合には、同号ロに係る対応が必要となります。\nその上で、保険募集人による選別・提案が実質的に伴わず、顧客の主体的な判断のみにより一の保険契約が選択された場合には、直ちに同号ロに係る対応が必要となるものではありません。\nただし、当該選択が顧客の主体的判断に基づくものであるか、又はその過程において保険募集人による恣意的な誘導が行われていないかについては、個別具体的に判断される必要があります。\nまた、顧客の判断過程において、保険募集人が営業上の理由等により恣意的に誘導する行為は、内容や態様等によっては、同法第300条第1項第1号及び第6号に抵触するおそれがあることから、厳に慎む必要があると考えます。","theme":"指名買い","section":"監督指針","tags":["比較推奨"]},{"no":300,"location":"－","comment":"商用車ディーラーが扱う商用車は生産財であり、顧客の多くは複数台数の車両を保有している。\nその一方で、自動車保険については、事故対応や事務効率等の観点から、特定の保険会社1社に集約して契約されているケースが多く見受けられ、顧客からは保険会社を明確に指名されることが一般的である。\n商用車ディーラー代理店としては保険契約上「新規取引」\nとなる場合でも、顧客の視点から見れば、保険会社は従前と同一であり、あくまで「契約の継続」と認識されている。\nこのように、顧客が特定の保険会社との契約継続を明確に希望している場合の比較推奨販売の取扱いについて、形式的に新規契約として比較推奨販売を行うことは、顧客の負担増や利便性の低下を招き、顧客本位の業務運営の趣旨と乖離するおそれがある。\n保険会社を明確に指名される場合は「継続取引」として取り扱うことを要望する。","pageStart":180,"pageEnd":180,"answer":"ご指摘のような場合であっても、新規契約か既契約の継続かにかかわらず、意向把握・確認義務に基づく対応が必要となります。\nその上で、保険募集人による選別・提案が実質的に伴わず、顧客の主体的な判断のみにより特定の保険契約が選択された場合には、直ちに保険業法施行規則第227条の2第3項第4号ロ(推奨販売)\nに係る対応が必要となるものではありません。\nただし、当該選択が顧客の主体的判断に基づくものであるか、又はその過程において保険募集人による恣意的な誘導が行われていないかについては、個別具体的に判断される必要があります。\nなお、顧客の判断過程において、保険募集人が営業上の理由等により恣意的に誘導する行為は、内容や態様等によっては、同法第300条第1項第1号及び第6号に抵触するおそれがあることから、厳に慎む必要があると考えます。","theme":"指名買い","section":"監督指針","tags":["比較推奨","意向把握"]},{"no":301,"location":"Ⅱ－4－2－9(5)","comment":"保険業法施行規則第227条の2第3項第4号ハの廃止及び同号ロの改正に対する監督指針の改正に対し、下記の意見を表明する。\n現状、各損害保険会社の代理店に対する規模や増収率に180偏った代理店手数料格差が生じた状態において、今回の代理店に課された比較推奨販売を遂行するには、営利企業として特定の保険契約を推奨する場合に、監督指針Ⅱ－4－2－9(5)①B.(a)に記載の「乗合代理店の都合によることなく、合理的かつ一定の具体性を有する基準や理由等を説明」\nする事は現実的ではないと考える。\nまた、乗合代理店における顧客の意向として、迅速な保険契約の締結が第一である場合等、監督指針Ⅱ－4－2－9(5)\n①B.(b)(注3)\n「顧客の意向を顧みず営業上の理由から、恣意的に特定の保険契約へ誘導する事のないよう留意する」\nとあるが、顧客の意向を顧みた上で、営業上の理由(特定の保険会社の事務手続き・経営方針上の理由)を説明した上で、特定の保険会社の保険契約を提示・推奨する事は許容されるべきであると考える。\n企業の従業員の借り上げ社宅契約における火災保険や、建設業における現場事務所等に対する火災保険の契約において、顧客企業が求める一定の要件に合致した特定の保険会社の保険契約条件が企業から提示されている場合、比較推奨販売の対象外という理解でよいか。","pageStart":180,"pageEnd":181,"answer":"貴重なご意見として承ります。\nなお、比較推奨販売の要否や方法については、顧客の意向を起点としつつ、保険募集人による選別・提案の有無や内容などを踏まえ、保険業法施行規則第227条の2第3項第4号に照らし個別具体的に判断される必要があります。","theme":"指名買い","section":"監督指針","tags":["手数料・インセンティブ","比較推奨","ハ方式"]},{"no":302,"location":"－","comment":"乗合代理店において、意向推定型を用いて、顧客の意向の誘導を恣意的に行い、実質的に保険業法施行規則第227条の2第3項第4号ハを維持するような行為は、潜脱行為に当たり得るという理解でよいか。","pageStart":181,"pageEnd":181,"answer":"ご指摘のように、Ⅱ－4－2－2(3)①ア.(注2)で定める意向推定の方法を用いながら、特定の保険契約の選別・推奨をあらかじめ企図し、顧客の意向を恣意的に形成又は解釈するなどの行為により、実質的に従前の保険業法施行規則第227条の2第3項第4号ハと同様の運用を行っているものと評価され得る場合には、比較推奨販売規制の潜脱に該当し得ます。\nその該当性については、保険募集の態様や意向形成の過程、顧客の適切な商品選択の機会が実質的に確保されているかといった観点から、個別具体的に判断されます。\nなお、意向推定の方法は、例えば、保険会社の営業職員が、第一分野又は第三分野の保険契約について、当初は潜在化している顧客の意向を顧客属性や生活環境等に基づき推定した上で、対面で顧客と双方向的なやり取りを通じて意向を説明・明確化しつつ、その変化にも対応する保険募集の場面に用いられることを想定したものです。\n特に、乗合代理店において意向推定の方法を用いるとした場合には、推定した顧客の意向に基づき、複数の保険契約の中から選別・推奨が行われることとなるため、意向推定の合理性・妥当性が推奨販売(同号ロ)の適切性に直結し得ることとなります。乗合代理店が当該方法を用いる場合には、こうした観点を十分に踏まえ、推定の確度を含め、その合理性・妥当性の確保について特に慎重な検討・判断が求められるとともに、その後の保険募集の過程において、顧客の意向を丁寧かつ明確に確認し、その結果に基づく適切な選別・推奨を行う必要があります。\nなお、募集主体の如何に関わらず、郵送募集等、顧客との書類等のやり取りが一度に限定される手法により保険募集を行う場合には、顧客との双方向的なやり取りが乏しくなることから、結果として恣意的な意向把握につながるおそれがあると考えられます。したがって、この場合には、意向推定の方法を用いる対象を既契約者に限定するなど、推定の確度に十分留意しつつ、合理性・妥当性を確保した上で、意向推定が行われるよう慎重に対応することが求められます。加えて、顧客の実際の状況や意向とは異なる推定が行われている可能性があることを十分に踏まえ、例えば、顧客が自らの状況に照らした意向を改めて確認できるよう工夫することや、顧客の理解度にも配慮して保障の内容や変更点等を分かりやすく表示するなど、実効的な意向把握が行われ、保険契約の加入要否が判断できるようにすることが重要です。","theme":"意向推定","section":"監督指針","tags":["比較推奨","ハ方式","意向把握"]},{"no":303,"location":"Ⅱ－4－2－9(5)","comment":"監督指針Ⅱ－4－2－9(5)①B.「また、顧客の意向に沿って保険契約を選別する場合には、事前に商品特性や保険料水181準などの顧客が重視する事項を丁寧かつ明確に確認する必要があることに留意する」に関し、顧客が重視する事項を「丁寧かつ明確に」確認する必要があると規定されている。\n複数の所属保険会社を有し、「顧客の意向に沿って保険契約を選別する」ことで顧客の商品選択の機会を確保することが求められる乗合代理店において、監督指針Ⅱ－4－2－2(3)①ア.(注2)に記載される意向を推定する方法のみ(意向推定型)を用いて保険募集を行うことは、代理店自身が顧客の意向を推定し、ひいては特定の保険契約を推奨することも可能となってしまうことから、適切な意向把握の方法とは言い難い、との理解でよいか。","pageStart":181,"pageEnd":182,"answer":"ご指摘のように、Ⅱ－4－2－2(3)①ア.(注2)で定める意向推定の方法を用いながら、特定の保険契約の選別・推奨をあらかじめ企図し、顧客の意向を恣意的に形成又は解釈するなどの行為により、実質的に従前の保険業法施行規則第227条の2第3項第4号ハと同様の運用を行っているものと評価され得る場合には、比較推奨販売規制の潜脱に該当し得ます。\nその該当性については、保険募集の態様や意向形成の過程、顧客の適切な商品選択の機会が実質的に確保されているかといった観点から、個別具体的に判断されます。\nなお、意向推定の方法は、例えば、保険会社の営業職員が、第一分野又は第三分野の保険契約について、当初は潜在化している顧客の意向を顧客属性や生活環境等に基づき推定した上で、対面で顧客と双方向的なやり取りを通じて意向を説明・明確化しつつ、その変化にも対応する保険募集の場面に用いられることを想定したものです。\n特に、乗合代理店において意向推定の方法を用いるとした場合には、推定した顧客の意向に基づき、複数の保険契約の中から選別・推奨が行われることとなるため、意向推定の合理性・妥当性が推奨販売(同号ロ)の適切性に直結し得ることとなります。乗合代理店が当該方法を用いる場合には、こうした観点を十分に踏まえ、推定の確度を含め、その合理性・妥当性の確保について特に慎重な検討・判断が求められるとともに、その後の保険募集の過程において、顧客の意向を丁寧かつ明確に確認し、その結果に基づく適切な選別・推奨を行う必要があります。\nなお、募集主体の如何に関わらず、郵送募集等、顧客との書類等のやり取りが一度に限定される手法により保険募集を行う場合には、顧客との双方向的なやり取りが乏しくなることから、結果として恣意的な意向把握につながるおそれがあると考えられます。したがって、この場合には、意向推定の方法を用いる対象を既契約者に限定するなど、推定の確度に十分留意しつつ、合理性・妥当性を確保した上で、意向推定が行われるよう慎重に対応することが求められます。加えて、顧客の実際の状況や意向とは異なる推定が行われている可能性があることを十分に踏まえ、例えば、顧客が自らの状況に照らした意向を改めて確認できるよう工夫することや、顧客の理解度にも配慮して保障の内容や変更点等を分かりやすく表示するなど、実効的な意向把握が行われ、保険契約の加入要否が判断できるようにすることが重要です。","theme":"意向推定","section":"監督指針","tags":["比較推奨","ハ方式","意向把握"]},{"no":304,"location":"Ⅱ－4－2－9(5)","comment":"比較推奨販売において、監督指針Ⅱ－4－2－2(3)①ア.(注2)に記載される意向を推定する方法(意向推定型)で募集を行った場合、特定の保険会社の特定の商品を設計し、見込み顧客に提示することとなるが、もし、提示した保険がそのまま契約に至った場合、今回の改正保険業法及び改正保険業法施行規則に抵触、もしくは違反することになるか。","pageStart":182,"pageEnd":182,"answer":"ご指摘のように、Ⅱ－4－2－2(3)①ア.(注2)で定める意向推定の方法を用いながら、特定の保険契約の選別・推奨をあらかじめ企図し、顧客の意向を恣意的に形成又は解釈するなどの行為により、実質的に従前の保険業法施行規則第227条の2第3項第4号ハと同様の運用を行っているものと評価され得る場合には、比較推奨販売規制の潜脱に該当し得ます。\nその該当性については、保険募集の態様や意向形成の過程、顧客の適切な商品選択の機会が実質的に確保されているかといった観点から、個別具体的に判断されます。\nなお、意向推定の方法は、例えば、保険会社の営業職員が、第一分野又は第三分野の保険契約について、当初は潜在化している顧客の意向を顧客属性や生活環境等に基づき推定した上で、対面で顧客と双方向的なやり取りを通じて意向を説明・明確化しつつ、その変化にも対応する保険募集の場面に用いられることを想定したものです。\n特に、乗合代理店において意向推定の方法を用いるとした場合には、推定した顧客の意向に基づき、複数の保険契約の中から選別・推奨が行われることとなるため、意向推定の合理性・妥当性が推奨販売(同号ロ)の適切性に直結し得ることとなります。乗合代理店が当該方法を用いる場合には、こうした観点を十分に踏まえ、推定の確度を含め、その合理性・妥当性の確保について特に慎重な検討・判断が求められるとともに、その後の保険募集の過程において、顧客の意向を丁寧かつ明確に確認し、その結果に基づく適切な選別・推奨を行う必要があります。\nなお、募集主体の如何に関わらず、郵送募集等、顧客との書類等のやり取りが一度に限定される手法により保険募集を行う場合には、顧客との双方向的なやり取りが乏しくなることから、結果として恣意的な意向把握につながるおそれがあると考えられます。したがって、この場合には、意向推定の方法を用いる対象を既契約者に限定するなど、推定の確度に十分留意しつつ、合理性・妥当性を確保した上で、意向推定が行われるよう慎重に対応することが求められます。加えて、顧客の実際の状況や意向とは異なる推定が行われている可能性があることを十分に踏まえ、例えば、顧客が自らの状況に照らした意向を改めて確認できるよう工夫することや、顧客の理解度にも配慮して保障の内容や変更点等を分かりやすく表示するなど、実効的な意向把握が行われ、保険契約の加入要否が判断できるようにすることが重要です。","theme":"意向推定","section":"監督指針","tags":["比較推奨","ハ方式","意向把握"]},{"no":305,"location":"Ⅱ－4－2－9(5)","comment":"意向把握については、代理店による初動段階における「顧客の意向(重視する点)の推定」が一定程度認められるべきであると考える。\nこれは、顧客が代理店に期待する役割の一部でもあると考えられるためである。\nその場合、代理店は「意向の推定」に基づき、「1社の商品のみを初期提示する」こともあり得ると考えられ、それが認められるべきである。\n182なお、その場合であっても、「最終的な意向」の確認は当然ながら必須である。","pageStart":182,"pageEnd":183,"answer":"ご指摘のように、Ⅱ－4－2－2(3)①ア.(注2)で定める意向推定の方法を用いながら、特定の保険契約の選別・推奨をあらかじめ企図し、顧客の意向を恣意的に形成又は解釈するなどの行為により、実質的に従前の保険業法施行規則第227条の2第3項第4号ハと同様の運用を行っているものと評価され得る場合には、比較推奨販売規制の潜脱に該当し得ます。\nその該当性については、保険募集の態様や意向形成の過程、顧客の適切な商品選択の機会が実質的に確保されているかといった観点から、個別具体的に判断されます。\nなお、意向推定の方法は、例えば、保険会社の営業職員が、第一分野又は第三分野の保険契約について、当初は潜在化している顧客の意向を顧客属性や生活環境等に基づき推定した上で、対面で顧客と双方向的なやり取りを通じて意向を説明・明確化しつつ、その変化にも対応する保険募集の場面に用いられることを想定したものです。\n特に、乗合代理店において意向推定の方法を用いるとした場合には、推定した顧客の意向に基づき、複数の保険契約の中から選別・推奨が行われることとなるため、意向推定の合理性・妥当性が推奨販売(同号ロ)の適切性に直結し得ることとなります。乗合代理店が当該方法を用いる場合には、こうした観点を十分に踏まえ、推定の確度を含め、その合理性・妥当性の確保について特に慎重な検討・判断が求められるとともに、その後の保険募集の過程において、顧客の意向を丁寧かつ明確に確認し、その結果に基づく適切な選別・推奨を行う必要があります。\nなお、募集主体の如何に関わらず、郵送募集等、顧客との書類等のやり取りが一度に限定される手法により保険募集を行う場合には、顧客との双方向的なやり取りが乏しくなることから、結果として恣意的な意向把握につながるおそれがあると考えられます。したがって、この場合には、意向推定の方法を用いる対象を既契約者に限定するなど、推定の確度に十分留意しつつ、合理性・妥当性を確保した上で、意向推定が行われるよう慎重に対応することが求められます。加えて、顧客の実際の状況や意向とは異なる推定が行われている可能性があることを十分に踏まえ、例えば、顧客が自らの状況に照らした意向を改めて確認できるよう工夫することや、顧客の理解度にも配慮して保障の内容や変更点等を分かりやすく表示するなど、実効的な意向把握が行われ、保険契約の加入要否が判断できるようにすることが重要です。","theme":"意向推定","section":"監督指針","tags":["比較推奨","ハ方式","意向把握"]},{"no":306,"location":"－","comment":"乗合代理店が意向把握義務に関する監督指針Ⅱ－4－2－2(3)①ア.(注2)に記載される意向を推定する方法(意向推定型)によって既契約者に対して保険設計書や保険申込書を送付できるケースでは、意向把握義務に関して推定される顧客の意向に照らして、他に「比較可能な同種の保険契約」がなければ既契約の引受保険会社のみの保険商品の保険設計書や保険申込書を送付することができるという理解でよいか。\nなお、当該代理店は、募集に当たり保険業法が定める権限明示を適切に行うことを前提としている。","pageStart":183,"pageEnd":183,"answer":"意向推定の方法を用いる場合であっても、当該推定が合理性・妥当性を有することが前提であり、その適切性は個別具体的に判断されます。\nまた、「二以上の比較可能な同種の保険契約」の有無についても実質的に判断されるものであり、その結果として、特定の保険契約の他に比較対象が存在しないと合理的に認められる場合には、当該保険契約に係る資料のみを提示することが排除されるものではありません。\nただし、当該判断が形式的又は恣意的に行われることにより、実質的に顧客の適切な商品選択の機会を損なうことのないよう、その合理性・妥当性の判断に当たっては、慎重かつ適切な対応が求められます。","theme":"意向推定","section":"監督指針","tags":["意向把握"]},{"no":307,"location":"Ⅱ－4－2－9(5)","comment":"「意向の推定」が「代理店による誘導」とならないようにすべきであると認識しているが、「誘導」に該当する具体例を示していただきたい。\n183","pageStart":183,"pageEnd":184,"answer":"ご指摘のとおり、「意向の推定」が保険募集人による特定の保険契約への誘導とならないよう留意することは重要です。\n個別具体的な事例を提示することは困難ですが、例えば、特定の保険契約の提案を前提として当該契約に適合するよう意向を推定する場合や、形式的に意向推定の手法を用いながら実質的に特定の保険契約の選別・推奨を行う場合には、一般的には、誘導又は比較推奨販売規制の潜脱に該当し得ます。\n意向推定の方法は、例えば、保険会社の営業職員が顧客の自宅や職場などを訪問し、当初は潜在化している顧客の意向を顧客属性や生活環境等に基づき推定した上で、どのような意向を推定して個別プランを設計したのか、当該プランが当該意向とどのように対応しているのか等を説明しつつ、顧客との双方向的なやり取りを通じて、意向の明確化やその変化への対応を図る保険募集の場面に用いられることを想定したものです。\n乗合代理店において意向推定の方法を用いるとした場合には、複数の保険契約の中から選別・推奨が行われることとなるため、意向推定の合理性・妥当性が推奨販売の適切性に直結し得ることとなります。乗合代理店が当該方法を用いる場合には、こうした観点を十分に踏まえ、推定の確度を含め、その合理性・妥当性の確保について特に慎重な検討・判断が求められるとともに、その後の保険募集の過程において、顧客の意向を丁寧かつ明確に確認し、その結果に基づく適切な選別・推奨を行う必要があります。\n乗合代理店においては、このように比較推奨販売に係る規定の趣旨・目的に沿った対応を行うことが重要であり、この点を明確化するために、「顧客の意向を把握することには、Ⅱ－4－2－2(3)①ア.(注2)のとおり、例えば、顧客属性や生活環境等に基づき推定するといった方法が含まれるが、当該方法を用いて、比較推奨販売に係る規定の趣旨・目的に反する対応が行われないよう留意する。」\nとの記載を追記いたします。","theme":"意向推定","section":"監督指針","tags":["比較推奨"]},{"no":308,"location":"Ⅱ－4－2－9(5)","comment":"顧客が特に重視すると考えられる事項を例示すると同時に、例示した事項を顧客の意向と推定して保険会社・商品を184選別・推奨することは、監督指針Ⅱ－4－2－2(3)①ア.(注2)\nに記載される意向を推定する方法(意向推定型)として認められるとの理解でよいか。","pageStart":184,"pageEnd":185,"answer":"顧客が特に重視すると考えられる事項を例示する行為は、顧客の意向が不明確な場合に、その意向の形成を促すための手法として位置付けられるものです。\nしたがって、当該例示を行ったことのみをもって、Ⅱ－4－2－2(3)①ア.(注2)に定める意向の推定(把握)を行ったものと評価されるものではありません。\nまた、当該例示に基づき特定の保険契約を選別・推奨する場合には、当該推奨があらかじめ特定の保険契約の選別・推奨を企図した上で、これに適合するように意向を推定するものとなっていないか、顧客の主体的な意向の形成を経たものとなっているか、保険募集人による恣意的な誘導となっていないかに留意し、適切に対応する必要があります。","theme":"意向推定","section":"監督指針","tags":[]},{"no":309,"location":"Ⅱ－4－2－9(5)","comment":"例えば、建設工事保険などのスポット契約(契約更新を前提としていない保険契約)の加入を検討する顧客に対して、過去の引受保険会社・商品と同一の保険会社・商品で加入することを顧客が特に重視すると考えて、過去の引受保険会社と同一保険会社・商品を選別・推奨することも認められるとの理解でよいか。","pageStart":185,"pageEnd":185,"answer":"顧客が過去の契約と同一の保険会社又は保険契約での加入を重視する意向を有する場合には、その意向に基づき当該保険契約を選別・推奨することは否定されるものではありません。\n一方で、保険契約に係る顧客の意向は契約ごとに異なり得ることから、過去の契約内容や他の契約状況のみをもってこれを推定するのではなく、当該契約に係る具体的な意向を適切に確認した上で対応することが必要です。\nまた、Ⅱ－4－2－9(5)に照らして、顧客の意向を把握するに当たり、事前に顧客が重視する事項を丁寧かつ明確に確認し、当該意向に沿って選別・推奨することが求められるものと考えられます。","theme":"意向推定","section":"監督指針","tags":["更改・継続"]},{"no":310,"location":"Ⅱ－4－2－9(5)","comment":"顧客が新たに保険契約に加入する際、顧客が他に加入する保険契約の引受保険会社と同一にすることを特に重視すると考えて、顧客が加入する他の保険契約の引受保険会社を選別・推奨することも認められるとの理解でよいか。","pageStart":185,"pageEnd":185,"answer":"顧客が過去の契約と同一の保険会社又は保険契約での加入を重視する意向を有する場合には、その意向に基づき当該保険契約を選別・推奨することは否定されるものではありません。\n一方で、保険契約に係る顧客の意向は契約ごとに異なり得ることから、過去の契約内容や他の契約状況のみをもってこれを推定するのではなく、当該契約に係る具体的な意向を適切に確認した上で対応することが必要です。\nまた、Ⅱ－4－2－9(5)に照らして、顧客の意向を把握するに当たり、事前に顧客が重視する事項を丁寧かつ明確に確認し、当該意向に沿って選別・推奨することが求められるものと考えられます。","theme":"意向推定","section":"監督指針","tags":[]},{"no":311,"location":"Ⅱ－4－2－9(5)","comment":"複数の保険会社の商品を比較推奨する際に、各社のパンフレットや多数の見積書を用いて個別に説明する方法は、顧客・保険募集人双方にとって大きな負担となり、顧客にとっての正しい選択に支障が生じ本末転倒となる危険性がある。\n185そこで、同一条件で複数社の保険料を一覧で比較できる資料を活用することで顧客にとっても解りやすく負担軽減も図れると考えるが、損害保険では募集文書登録という制度があり、募集文書として使用するには、その都度申請が必要なため柔軟な対応が困難である。\nこのため、保険業法施行規則第227条の2第3項第4号における特例措置として募集文書登録制度の簡略化を行い、商品説明は各社パンフレットを用いつつ、保険料比較については代理店が簡易な比較資料を作成・使用できる仕組みを検討すべき(ただし、見積内容は各損害保険会社所定のシステムを使用した正規のものであることが前提)である。また、パンフレットの説明については、1社目は項目をもれなく説明し、2社目以降は相違点のみ説明することで顧客と保険募集人の双方が過度な負担なく、適切な説明と選択が可能になると考えられる。","pageStart":185,"pageEnd":186,"answer":"募集文書の作成や使用方法については、法令に基づき保険代理店への教育・管理・指導を担う立場である所属保険会社等が、保険募集管理態勢の一環として、保険代理店との委託契約等に基づき実務上定めているものであり、法令等において一律に定める性格のものではないと考えます。\n顧客が保険契約の説明を受ける際には、その内容を適切に理解し、誤認することのないよう、保険会社及び保険代理店においては、顧客にとって分かりやすい説明が行われるための適切な取組を行うことが重要です。","theme":"比較ツール","section":"監督指針","tags":["比較推奨","システム・比較ツール"]},{"no":312,"location":"Ⅱ－4－2－9(5)","comment":"監督指針Ⅱ－4－2－9(5)①B.において、乗合代理店として顧客の意向を確認した上で保険商品を提示する際、現状では紹介に値する「保険商品の比較表」を各代理店において個別に作成して顧客に掲示や手交することを保険会社から認められておらず、顧客に適切に推奨できる状態にないと考えている。\n今回の監督指針の改正の方向性として、顧客への正しい保険商品の比較推奨が重要であることを考えた場合、乗合代理店独自の比較表の作成及び顧客への説明資料として利用できるようにすべきと考えるがどうか。\n186また、他の方法として、保険商品種類ごとの特定項目や保険料例などについて保険会社から同一のフォーマットで顧客へ説明できる資料を乗合代理店に提供されるべきであり、これらを用いた比較表を乗合代理店が利用できることが顧客の利益に資するものと考えるがどうか。","pageStart":186,"pageEnd":187,"answer":"募集文書の作成や使用方法については、法令に基づき保険代理店への教育・管理・指導を担う立場である所属保険会社等が、保険募集管理態勢の一環として、保険代理店との委託契約等に基づき実務上定めているものであり、法令等において一律に定める性格のものではないと考えます。\n顧客が保険契約の説明を受ける際には、その内容を適切に理解し、誤認することのないよう、保険会社及び保険代理店においては、顧客にとって分かりやすい説明が行われるための適切な取組を行うことが重要です。","theme":"比較ツール","section":"監督指針","tags":["比較推奨"]},{"no":313,"location":"Ⅱ－4－2－9(5)","comment":"保険商品の円滑な比較を行うために、「顧客が特に重視すると考えられる事項」を一定程度定型化(標準化)したツールを活用し、その回答結果をもって適切な意向把握プロセスを履行したとみなすことは可能か。","pageStart":187,"pageEnd":187,"answer":"貴見のようなツールを活用して意向把握を行う手法も選択肢の一つと考えられますが、顧客の意向は多様であることを踏まえ、保険業法第294条の2に基づく意向把握・確認義務が適切に履行されたか否かについては、Ⅱ－4－2－2(3)に照らして、個別具体的に判断される必要があります。","theme":"比較ツール","section":"監督指針","tags":["意向把握"]},{"no":314,"location":"－","comment":"顧客の意向を把握するための代理店内共通のツール作成は必須条件であるか。","pageStart":187,"pageEnd":187,"answer":"顧客の意向を適切に把握し、これに沿った保険契約の提案・説明等を求める意向把握・確認義務(保険業法第294条の2)の履行方法については、Ⅱ－4－2－2(3)に掲げる方法などにより適切に行うこととされており、特定のツール作成を必須条件として求めてはおりません。","theme":"比較ツール","section":"監督指針","tags":["意向把握"]},{"no":315,"location":"Ⅱ－4－2－9(5)","comment":"比較説明を行う場合、比較する事項については、顧客の特性に応じて代理店が独自に設定することでよいか。\nまた、比較説明を行う際に、比較表の作成は必須ではないという理解でよいか。\n187","pageStart":187,"pageEnd":187,"answer":"比較説明に当たっては、Ⅱ－4－2－9(5)に基づき適切に行う必要がありますが、同指針において参照されるⅡ－4－2－2(9)②に定める事項は保険業法第300条第1項第6号に抵触する行為の類型を示したものであることに留意し、同号に抵触することのないよう適切に対応する必要があります。\n乗合代理店においては、こうした点を踏まえ、保険会社による教育・管理・指導の下、保険募集の実務や募集形態等に応じて、顧客の理解が十分に得られるよう、適切に比較説明を行う必要があると考えられます。","theme":"比較ツール","section":"監督指針","tags":["比較推奨"]},{"no":316,"location":"Ⅱ－4－2－9(5)","comment":"乗合代理店における比較推奨販売を実効性あるものとするためには、顧客が理解しやすい比較資料の活用が不可欠であり、募集文書の位置付けや作成主体について、より明確な考え方が必要である。\n乗合代理店は、複数の保険会社の商品を比較・推奨することが求められているが、顧客の立場から見れば、複数社の補償内容や保険料を一枚の資料等で一覧的に比較できることは、理解促進の観点から有効であると考える。\nしかしながら、現状では、代理店が独自に作成した比較資料は募集文書として認められておらず、比較説明は各保険会社が定めた募集文書の範囲内に限定されている。\nその結果、顧客にとって分かりやすい比較説明を行いたくとも、実務上の制約が大きい状況にある。\nまた、生命保険分野では既に導入されているような民間システム会社等による比較ツールの活用についても、損害保険分野では保険会社からのデータ開示がなければ実現が困難であり、生命保険分野との間で環境差が生じている。\n比較推奨の形式的な遵守にとどまらず、顧客が納得して商品選択を行える環境を整えることが、顧客本位の業務運営の実質化につながると考えるため、今回の改正により比較推奨販売の徹底を求めるのであれば、・代理店独自作成の比較資料の取扱い・外部システムを活用した比較説明の可否・募集文書として求められる要件について、顧客理解の向上を軸とした明確な整理・方向性188を示していただきたい。","pageStart":188,"pageEnd":189,"answer":"募集文書の作成や使用方法については、法令により保険代理店への教育・管理・指導を担う立場とされている所属保険会社等が、保険募集管理態勢の一環として、保険代理店との委託契約等に基づき実務上定めているものであり、法令等において一律に定める性格のものではないと考えます。\nまた、外部システムの活用による顧客への情報提供等についても、顧客の理解促進のための選択肢の一つになり得るものと考えられます。ただし、こうしたシステムを活用する場合であっても、顧客の適切な商品選択の機会が確保され、乗合代理店において比較推奨販売の適切性が確保されるよう、保険募集人に対する教育等を含む体制整備が実効的に行われることが重要です。","theme":"比較ツール","section":"監督指針","tags":["比較推奨","システム・比較ツール"]},{"no":317,"location":"－","comment":"代理店としてもAIやDXを活用した業務効率化により制度対応を進めていく意思はあるものの、システム導入や運用にはコストが伴う。\n制度対応が新たなコスト増となる以上、補助金・助成金・導入支援等とセットで進めることが制度定着に有効であると考えている。\n単なる規制強化に留まらず、現場の対応力を高める施策もご検討いただきたい。","pageStart":189,"pageEnd":189,"answer":"貴重なご意見として承ります。","theme":"比較ツール","section":"監督指針","tags":["システム・比較ツール"]},{"no":318,"location":"－","comment":"比較推奨内容・条件を乗合代理店任せにすると、乗合代理店ごとの推奨内容にばらつきが生じたり、断片的な比較に陥るおそれが生じる。したがって、業界統一の比較ツールの作成・公開が必要である。\nこれにより、保険会社各社の商品内容や事故査定方針等がシンプルかつ明確に比較可能となり、正確な推奨販売ができるよう整理できる。\nまた、従来、約款に記載がない査定運用についても正確な比較手段を求める。","pageStart":189,"pageEnd":189,"answer":"貴重なご意見として承ります。","theme":"比較ツール","section":"監督指針","tags":["比較推奨","システム・比較ツール"]},{"no":319,"location":"Ⅱ－4－2－9(5)","comment":"乗合代理店において、取り扱う保険会社や商品を、代理店の社内規則等により顧客の属性等に応じて店舗ごとに限定するといった対応は、不適切と考える。\n加えて、保険会社と代理店の間で代理店委託契約書や覚書を締結し、取り扱う商品を限定する場合であっても、保険会社から当該代理店への便宜供与の見返り等として特定の保険会社の商品を推奨すること等を目的に、例えば、代理店189の店舗ごとに保険会社との約定を行うといった対応は、不適切と考えるがどうか。","pageStart":189,"pageEnd":190,"answer":"貴見のとおりです。\nご指摘のように、乗合代理店が社内規則等のみにより、顧客属性等を理由として店舗ごとに取扱保険会社や保険契約を恣意的に限定し、実質的に顧客の適切な商品選択の機会を阻害するような運用は適切ではありません。\nなお、保険会社と乗合代理店との間で代理店委託契約又はこれに基づく覚書等により取り扱う保険契約を限定する場合であっても、顧客本位の業務運営の確保を目的とする合理的な理由なく、形式的な委託範囲の限定を行うことにより、保険会社からの便宜供与等の見返りとして、顧客に対して特定の保険会社の保険契約を優先的に取り扱うなど、顧客の適切な商品選択の機会を実質的に阻害するおそれのある業務運営を行うときには、比較推奨販売規制を潜脱するものとして問題となり得ます。","theme":"比較可能な同種の保険契約","section":"監督指針","tags":["便宜供与","比較推奨"]},{"no":320,"location":"Ⅱ－4－2－9(5)","comment":"乗合解消予定の保険会社に係る比較推奨の取扱いについて監督指針Ⅱ－4－2－9(5)①B.(a)(注1)(注2)\n乗合代理店が特定の保険会社との委託契約を解消(乗合解消)する方針を決定している場合において、当該保険会社の商品を比較推奨販売の対象から除外することを、「合理的かつ一定の具体性を有する基準や理由」として明示的に認めるよう、規定の整備又は解釈を明確化していただきたい。\n○顧客に対する長期的責任とアフターフォローの維持保険契約は長期間にわたるものが多く、契約締結後の保全手続き、給付金請求のサポート、事故対応等において、代理店による継続的な関与は顧客にとって極めて重要である。\n近いうちに乗合解消(委託契約の終了)を予定している保険会社の商品を、現時点で登録があるという理由だけで比較推奨販売の対象とし、新規契約を締結させることは、将来的に十分なサポートを提供できなくなる可能性が高く、結果として顧客の利益を損なうことにつながる。\n改正案の(注1)では、代理店の手数料水準等の「代理店の190都合」による選別を禁じているが、「アフターフォロー体制の維持が困難になるため、取扱い終了予定の商品を推奨から外す」という判断は、代理店側の利得を目的としたものではなく、顧客に不利益を与えないための「合理的理由」に基づいたものである。\n登録抹消の手続きには一定の期間を要するため、契約解消の意思決定から実際の登録抹消までの「移行期間」において、無理に販売を継続させることは、適正な募集管理態勢の構築を阻害する恐れがある。\n○募集現場における予見可能性の確保現在の改正案の表現では、登録がある全ての保険会社を画一的に比較対象に含めるべきとの誤解を招く懸念がある。\nもし、解消予定の商品を除外したことが「恣意的な誘導」\nや「不適切な比較」と判断されるリスクがあれば、代理店は顧客にとって望ましくない選択肢を提示せざるを得なくなる。\nあらかじめ「取扱い終了予定であるため、比較推奨から除外している」旨を顧客に説明することを条件に、除外を認めるべきと考える。\n具体的な修正・追記案(要望)\n(注1)又は(注2)に関連する留意事項として、以下の趣旨の内容を追記することを提案する。\n「なお、特定の保険会社との委託契約の終了を決定している場合など、顧客に対する継続的なサービス提供や保全態191勢の維持に支障が生じる合理的な理由がある場合には、その理由をあらかじめ顧客に説明することを条件に、当該保険会社の商品を比較推奨販売の対象から除外して差し支えない。この場合、当該除外は『代理店の都合による選別』には該当しないものとする。」","pageStart":190,"pageEnd":192,"answer":"委託契約の終了予定があることや、既契約者対応のために代理店委託契約を継続していることのみをもって、当該保険会社の保険契約を当然に比較推奨販売の対象外とすることは適切ではありません。\n比較推奨販売の対象となる「二以上の比較可能な同種の保険契約」は、代理店委託契約又はこれに基づく覚書等により、当該代理店が取り扱うこととされている保険契約を前提に判断されます。\nしたがって、乗合解消や既契約者対応のみへの移行に伴い、新規募集を停止する場合において、乗合代理店の判断のみではなく、所属保険会社等との間で、例えば、新規募集停止の対象となる保険契約、停止時期、既契約の保全・更改対応の範囲等について、代理店委託契約又はこれに基づく覚書等により明確化されているときには、新規募集の場面において、当該保険契約は「二以上の比較可能な同種の保険契約」に含まれないものと考えられます。また、このとき、取り扱えない保険契約が誤って顧客へ提案されないよう、保険会社及び乗合代理店において実態に即して実効的に管理されることが重要と考えます。\n加えて、顧客に対しては、取扱保険会社・保険契約の範囲や、当該保険契約を新規に保険募集しない理由について、誤認を与えないよう適切に説明することが重要です。","theme":"比較可能な同種の保険契約","section":"監督指針","tags":["手数料・インセンティブ","比較推奨","更改・継続"]},{"no":321,"location":"Ⅱ－4－2－9(5)","comment":"乗合代理店において、過去にA保険会社の保険契約を募集していたため、現在も有効なA保険会社の保険契約が若干残っている場合に、既契約者の利便性を考慮してA保険会社との代理店業務委託契約を解除できないケースがある。\nそのような場合、A保険会社と乗合代理店の間でA保険会社の保険商品について新規募集を行わず、既契約者の希望に応じた更改手続のみを行う旨を合意すれば、乗合代理店による新規募集の場面ではA保険会社の保険商品は「二以上の比較可能な同種の保険契約」に含まれないという理解でよいか。","pageStart":192,"pageEnd":192,"answer":"委託契約の終了予定があることや、既契約者対応のために代理店委託契約を継続していることのみをもって、当該保険会社の保険契約を当然に比較推奨販売の対象外とすることは適切ではありません。\n比較推奨販売の対象となる「二以上の比較可能な同種の保険契約」は、代理店委託契約又はこれに基づく覚書等により、当該代理店が取り扱うこととされている保険契約を前提に判断されます。\nしたがって、乗合解消や既契約者対応のみへの移行に伴い、新規募集を停止する場合において、乗合代理店の判断のみではなく、所属保険会社等との間で、例えば、新規募集停止の対象となる保険契約、停止時期、既契約の保全・更改対応の範囲等について、代理店委託契約又はこれに基づく覚書等により明確化されているときには、新規募集の場面において、当該保険契約は「二以上の比較可能な同種の保険契約」に含まれないものと考えられます。また、このとき、取り扱えない保険契約が誤って顧客へ提案されないよう、保険会社及び乗合代理店において実態に即して実効的に管理されることが重要と考えます。\n加えて、顧客に対しては、取扱保険会社・保険契約の範囲や、当該保険契約を新規に保険募集しない理由について、誤認を与えないよう適切に説明することが重要です。","theme":"比較可能な同種の保険契約","section":"監督指針","tags":["比較推奨","更改・継続"]},{"no":322,"location":"Ⅱ－4－2－9(5)","comment":"比較推奨販売に関する改正監督指針は、乗合代理店に対して生命保険会社との代理店業務委託契約に違反することを求めている訳ではないという理解でよいか。\n具体的にいえば、まず、乗合代理店とA生命保険会社の間では、「本件契約に関して知り得た乙及び乙の顧客に関する情報を秘密として保持するものとし、第三者に開示、漏洩してはならず、本契約の目的以外に利用してはならない。」(乙はA生命保険会社を指す)旨の条項を含む代理店業務委託契約を締結している。\nその状況において、A生命保険会社とB生命保険会社を取192り扱う乗合代理店がA生命保険会社の保険契約(既契約)を締結済みの顧客を担当している場合に、乗合代理店がA生命保険会社の当該既契約の情報(顧客に関する情報を含む)を利用してB生命保険会社の保険契約を募集することは、A生命保険会社との代理店業務委託契約においてA生命保険会社の代理店業務を遂行する過程で得られた情報(顧客に関する情報を含む。)について目的外利用が禁止されている以上、A生命保険会社が承諾しない限り認められないという理解でよいか。\nなお、現行監督指針においても、個人情報に関して「保険募集人が、個人情報を乗合他社の保険募集や兼業部門での営業活動等に利用する場合、目的外利用が行われることのないよう、法令等に基づく適切な取扱いが行われなければならない点に十分に留意する必要がある。」と定めており、乗合他社の保険募集に利用する場合に目的外利用とならないよう注意喚起がなされていることも踏まえなければならないと考えている。","pageStart":192,"pageEnd":193,"answer":"今般の改正については、乗合代理店に対して、所属保険会社等との代理店委託契約や関係法令に違反する行為を求めるものではありません。\n乗合代理店が、ある所属保険会社等の代理店業務を通じて取得した顧客情報や契約情報を、他の所属保険会社等の保険募集に利用する場合には、個人情報保護法その他の関係法令、代理店委託契約上の秘密保持義務・目的外利用禁止等を踏まえ、適切に取り扱う必要があります。\nしたがって、当該情報を乗合他社の保険募集に利用することが、所属保険会社等との契約や関係法令上認められない場合には、当該情報を利用して保険募集を行うことは適切ではありません。\nなお、比較推奨販売にあたっても、顧客の意向把握・確認や情報提供等については、法令等に基づき適正に取得・利用できる情報を前提として行われる必要があります。","theme":"比較可能な同種の保険契約","section":"監督指針","tags":["比較推奨","意向把握"]},{"no":323,"location":"Ⅱ－4－2－9(5)","comment":"二以上の比較可能な「同種の」保険契約について、「一時払終身保険」等の商品類型のみではなく、解約返戻金に市場価格調整(MVA)が入っているか否かなどでも顧客意向の分岐があると考える。\n例えば、MVAが無い商品を望むという意向が把握できていれば、一時払終身保険のMVA無しの商品が「同種の」保険契約であり比較可能な商品であるという認識でよいか。\n193","pageStart":193,"pageEnd":194,"answer":"「二以上の比較可能な同種の保険契約」の考え方については、「「平成26年改正保険業法(2年以内施行)に係る政府令・監督指針案」に対するパブリックコメント結果等について」における「コメントの概要及びコメントに対する金融庁の考え方」No.74～77のとおり、商品類型のみで形式的に判断されるものではなく、顧客の具体的な意向との関係で、個別具体的かつ実質的に判断される必要があります。\nその上で、顧客の意向は多様であることを踏まえつつ、顧客が市場価格調整(MVA)のない商品を希望する意向を明確に示している場合には、同じ一時払終身保険であっても、MVAの有無を踏まえて「比較可能な同種の保険契約」の範囲を判断することには一定の合理性があると考えられます。\nなお、特定の保険契約(群)の提案を前提として当該契約(群)に適合するよう、恣意的に顧客の意向を誘導することのないよう留意する必要があります。","theme":"比較可能な同種の保険契約","section":"監督指針","tags":[]},{"no":324,"location":"Ⅱ－4－2－9(5)","comment":"「比較可能な同種の保険契約」について、顧客の意向や顧客が重視する事項は考慮せず、単に、商品特徴・特性等(例.定額・変額保険の別、保険料払込方法・決済方法、保障(補償)内容、保障(補償)期間、体況上の保険加入の容易さ、付帯サービス)に応じ、事前に保険代理店が保険商品を分類し、保険代理店内で保険代理店共通の「比較可能な同種の保険契約」を定めておくという理解でよいか。","pageStart":194,"pageEnd":194,"answer":"「二以上の比較可能な同種の保険契約」の考え方については、「「平成26年改正保険業法(2年以内施行)に係る政府令・監督指針案」に対するパブリックコメント結果等について」における「コメントの概要及びコメントに対する金融庁の考え方」No.74～77のとおり、保険募集人等が顧客の意向の把握過程において把握しようとする顧客の意向との関係で、一般人の合理的な期待を基準として、当該保険契約が「比較可能な同種」のものと言えるかについて、個別具体的かつ実質的に判断されるべきものと考えます。","theme":"比較可能な同種の保険契約","section":"監督指針","tags":[]},{"no":325,"location":"Ⅱ－4－2－9(5)","comment":"「比較可能な同種の保険契約」は、主契約同士で比較可能かどうかを考えるのではなく、特約も含めて比較可能かどうかを判断するという理解でよいか(例.医療保険と医療保険以外の保険種類・種目に付加可能な入院・手術・通院等の特約)。","pageStart":194,"pageEnd":194,"answer":"「二以上の比較可能な同種の保険契約」の考え方については、「「平成26年改正保険業法(2年以内施行)に係る政府令・監督指針案」に対するパブリックコメント結果等について」における「コメントの概要及びコメントに対する金融庁の考え方」No.74～77のとおり、主契約程度の意向の共通性が手がかりとなり得ますが、最終的には、顧客の具体的な意向、保険契約の対象となるリスクの種類及び保険給付の内容、保険契約の特性・類型等を踏まえつつ、実質的に判断されるべきものと考えます。","theme":"比較可能な同種の保険契約","section":"監督指針","tags":[]},{"no":326,"location":"Ⅱ－4－2－9(5)","comment":"銀行等、金融機関における窓販保険商品の取扱いについて、現在、銀行等では保険商品の窓販において、保険会社か194ら業界制度商品(専用商品)の提供がなされている。\nただし、業界制度商品として確立されている保険商品には種類・数ともに限りがあり、保険種目にもよるが当該金融機関が代理店委託を行う保険会社が複数あるにもかかわらず、業界制度商品の取り扱いを行う保険会社はそのうち数社または1社のみとなっている実態がある。\nなお、業界制度商品については、保険料収納方法や商品設計の面で特徴がある。\nある特定の種目において業界制度商品の提供が1社からしか行われていない場合において、代理店委託契約は複数の保険会社と交わしてある場合であっても、二以上の比較可能な同種の保険契約が存在しない場合と理解することは問題ないか。","pageStart":194,"pageEnd":195,"answer":"「二以上の比較可能な同種の保険契約」の考え方については、「「平成26年改正保険業法(2年以内施行)に係る政府令・監督指針案」に対するパブリックコメント結果等について」における「コメントの概要及びコメントに対する金融庁の考え方」No.74～77のとおり、顧客の具体的な意向、保険契約の対象となるリスクの種類及び保険給付の内容、保険契約の特性・類型等を踏まえつつ、実質的に判断されるべきものと考えます。\n貴見にある「業界制度商品」の具体的内容については必ずしも明らかではありませんが、「二以上の比較可能な同種の保険契約」の該否を判断するに当たっては、貴見にある「業界制度商品」であることのみをもって判断すべきではなく、上記で示される考え方を踏まえ、個別具体的かつ実質的に判断されるべきものと考えます。","theme":"比較可能な同種の保険契約","section":"監督指針","tags":[]},{"no":327,"location":"Ⅱ－4－2－9(5)","comment":"比較推奨販売の対象が「比較可能な同種の保険契約」とされているが、商品の特性上、比較説明時に提供すべき情報の範囲が不明確なものが存在する。\n自社開発したオリジナルのリースパッケージ商品(リース専用自動車保険)に付帯して提供されるリース保険が存在する。\n当該リース保険の保険契約者は自社の関連会社であるリース会社であり、引受損保会社が異なっても補償内容や契約条件に実質的な差異はなく、顧客が享受する提供価値にも差は生じない。\n一方、顧客と損保会社間の既存契約状況等により、リース料金(保険料相当額を含む)が変動する場合がある。\n195また、当該保険料はリース月額料金に内包されており、顧客に対して保険料相当額を個別に開示していない。\n自社開発のリースパッケージ商品に付帯するリース保険(引受損保会社は、自社と代理店契約を有する会社の中から選択可能)は、比較推奨販売の対象となるのか。\n当該リース保険は、引受損保会社の違いによりリース料金が変動し得るものの、商品としての提供価値に差異は生じない。この場合、比較情報としては「損保会社の違いによるリース月額料金の差異」を提示すべきとの理解でよいか。\nもっとも、取扱いのある損保会社すべてについて毎回リース料金を算定するには、顧客の既存契約の確認等が必要となり、代理店の実務負担が極めて大きい。\nこのため、当該リース保険を付帯する場合の比較説明について、以下の運用で足りるか、実務上の取扱いについて伺いたい。\n(1)引受損保会社を選択できること、および損保会社の違いによりリース料金に差異が生じる可能性があることを説明する。\n(2)\n顧客の意向として、選定条件にリース料金を含めるかを確認する(3)\n選定条件にリース料金を含める場合には、引受損保会社を2社程度に絞るため、リース料金以外の比較情報を提示する。\n(4)\n選定した損保会社ごとにリース料金を算定した見積書を提示し、最終的な引受損保会社を決定する。\n196","pageStart":195,"pageEnd":196,"answer":"ご指摘のケースについては、保険業法第294条(情報提供義務)に基づく被保険者に対する情報提供の在り方を含め、リース契約と一体で提供される保険契約の内容、被保険者の属性や意向、補償内容、保険料相当額、又は、リース料金の算定方法等、引受保険会社ごとの差異等により判断が異なり得るため、個別具体的かつ実質的に判断する必要があることから、一律の見解を示すことは困難です。","theme":"比較可能な同種の保険契約","section":"監督指針","tags":["比較推奨"]},{"no":328,"location":"Ⅱ－4－2－9(5)","comment":"監督指針Ⅱ－4－2－9(5)①B.(a)の「二以上の比較可能な同種」の商品か否かの判断において、主契約の共通性だけでなく、特約の内容や解約返戻金の推移など、詳細な商品特性と顧客の意向が合致しているかを実質的に判断すべきと理解する。\nこの点、顧客の具体的意向を確認していく中で、顧客が特定のニーズ(例：特定の疾病保障、特定の解約返戻率の推移、特定の付帯サービス等)を強く有しており、それが特定の商品特性(独自の特約等)とのみ合致していることが確認できた場合、説明の際には他商品の概要説明の機会も提供(顧客の求めに応じ説明する旨を表示)した上で、そのプロセスを適切に記録・保存することを前提に、一つの保険商品のみ説明することは可能か。","pageStart":197,"pageEnd":197,"answer":"「二以上の比較可能な同種の保険契約」に該当するか否かは、主契約の共通性のみで判断されるものではなく、顧客の具体的な意向、対象となるリスク、保険給付の内容等を踏まえ、個別具体的かつ実質的に判断される必要があります。\n適切な意向把握の結果、例えば、顧客が特定の保障(補償)内容等を特に重視しており、その意向に合致する保険契約が一つに特定される場合には、当該保険契約のみを提示・推奨することはあり得ると考えられます。\nただし、その場合であっても、当該意向が顧客の主体的な判断に基づくものであり、保険募集人による恣意的な誘導によるものではないこと、及び当該保険契約を選別した基準や理由等が合理的かつ一定の具体性を有することが必要です。\nまた、顧客から他の保険契約について説明を求められた場合には、適切に対応するとともに意向把握や選別理由、説明内容等について、事後的に確認・検証できるよう、記録・証跡を保存することが重要です。","theme":"比較可能な同種の保険契約","section":"監督指針","tags":["意向把握","証跡・記録"]},{"no":329,"location":"Ⅱ－4－2－9(5)","comment":"ある商品が「二以上の比較可能な同種の保険契約」に該当するかどうかは、顧客の具体的な意向、カバーするリスクの種類及び保険給付の内容、商品の特性・類型等を踏まえつつ、個別具体的かつ実質的に判断する必要がある、との理解でよいか","pageStart":197,"pageEnd":197,"answer":"貴見のとおりです。","theme":"比較可能な同種の保険契約","section":"監督指針","tags":[]},{"no":330,"location":"Ⅱ－4－2－9(5)","comment":"監督指針Ⅱ－4－2－9(5)①B.の「比較可能な同種の保険契約」は、保険会社から保険募集の委託を受けた保険商品のみが対象との理解でよいか。\nまた、保険代理店によっては、保険代理店の諸事情等を理197由に保険会社から委託を受ける保険商品を委託契約書等により事前に絞り込んでいるケースもある。\n今回の監督指針改正後においても、保険会社から委託を受ける保険商品を事前に絞り込むことは許容されるか。","pageStart":197,"pageEnd":198,"answer":"「二以上の比較可能な同種の保険契約」は、代理店委託契約又はこれに基づく覚書等により、当該乗合代理店が取り扱うこととされている保険契約を前提に判断されます。したがって、保険会社から委託を受けておらず、又は代理店委託契約若しくはこれに基づく覚書等により取扱範囲が限定されているため、当該代理店において、実際に取扱いが認められていない保険契約は、当該代理店における推奨販売の対象には含まれません。\nまた、法人向け保険契約に限って委託を受けている場合の個人向け保険契約や、保険会社側の販売方針・情報提供の制約等により実際に取り扱えない保険契約についても、当該制約に係る取扱いが当該委託契約又は覚書等により明確化されている場合には、「二以上の比較可能な同種の保険契約」の対象には含まれないものと考えられます。また、このとき、取り扱えない保険契約が誤って顧客へ提案されないよう、保険会社及び乗合代理店において実態に即して実効的に管理されることが重要と考えます。\nなお、顧客本位の業務運営の確保を目的とする合理的な理由なく、形式的な委託範囲の限定を行うことにより、保険会社からの便宜供与等の見返りとして、特定の保険会社の保険契約を優先的に取り扱うなど、顧客の適切な商品選択の機会を実質的に阻害するおそれのある業務運営を行う場合には、比較推奨販売規制を潜脱するものとして問題となり得ます。\nまた、顧客に対しては、権限明示を適切に実施するとともに、当該限定を行う場合には、当該代理店が取り扱う保険契約の範囲について誤認を与えないよう、適切に説明することが重要です。","theme":"比較可能な同種の保険契約","section":"監督指針","tags":["便宜供与","比較推奨"]},{"no":331,"location":"Ⅱ－4－2－9(5)","comment":"乗合代理店が保険会社から委託を受ける保険契約の範囲を保険会社との間で明確に合意して、範囲外の保険契約を募集できない状態とした場合、募集できない保険契約は保険業法施行規則第227条の2第3項第4号ロに定める「二以上の比較可能な同種の保険契約」に含まれないという理解でよいか。\nなお、当該合意に合理性が認められ、かつ、乗合代理店や保険会社において当該合意を担保する体制を整備することを前提としている。","pageStart":198,"pageEnd":198,"answer":"「二以上の比較可能な同種の保険契約」は、代理店委託契約又はこれに基づく覚書等により、当該乗合代理店が取り扱うこととされている保険契約を前提に判断されます。したがって、保険会社から委託を受けておらず、又は代理店委託契約若しくはこれに基づく覚書等により取扱範囲が限定されているため、当該代理店において、実際に取扱いが認められていない保険契約は、当該代理店における推奨販売の対象には含まれません。\nまた、法人向け保険契約に限って委託を受けている場合の個人向け保険契約や、保険会社側の販売方針・情報提供の制約等により実際に取り扱えない保険契約についても、当該制約に係る取扱いが当該委託契約又は覚書等により明確化されている場合には、「二以上の比較可能な同種の保険契約」の対象には含まれないものと考えられます。また、このとき、取り扱えない保険契約が誤って顧客へ提案されないよう、保険会社及び乗合代理店において実態に即して実効的に管理されることが重要と考えます。\nなお、顧客本位の業務運営の確保を目的とする合理的な理由なく、形式的な委託範囲の限定を行うことにより、保険会社からの便宜供与等の見返りとして、特定の保険会社の保険契約を優先的に取り扱うなど、顧客の適切な商品選択の機会を実質的に阻害するおそれのある業務運営を行う場合には、比較推奨販売規制を潜脱するものとして問題となり得ます。\nまた、顧客に対しては、権限明示を適切に実施するとともに、当該限定を行う場合には、当該代理店が取り扱う保険契約の範囲について誤認を与えないよう、適切に説明することが重要です。","theme":"比較可能な同種の保険契約","section":"監督指針","tags":["便宜供与","比較推奨"]},{"no":332,"location":"Ⅱ－4－2－9(5)","comment":"保険会社の中には、例えば、代理店チャネルにおいて、法人向けに特色ある保険商品を積極的に展開する一方、個人向け保険商品の展開に消極的なところもある。\nそうしたケースにおいて、当該保険会社と乗合代理店が委託対象商品の範囲を法人向け保険商品のみに限定する旨を覚書等の締結により合意した場合、当該乗合代理店にとって、当該保険会社の個人向け保険商品を募集できない以上、当該商品は「比較可能な同種の保険契約」に含まれないという理解でよいか。","pageStart":198,"pageEnd":198,"answer":"「二以上の比較可能な同種の保険契約」は、代理店委託契約又はこれに基づく覚書等により、当該乗合代理店が取り扱うこととされている保険契約を前提に判断されます。したがって、保険会社から委託を受けておらず、又は代理店委託契約若しくはこれに基づく覚書等により取扱範囲が限定されているため、当該代理店において、実際に取扱いが認められていない保険契約は、当該代理店における推奨販売の対象には含まれません。\nまた、法人向け保険契約に限って委託を受けている場合の個人向け保険契約や、保険会社側の販売方針・情報提供の制約等により実際に取り扱えない保険契約についても、当該制約に係る取扱いが当該委託契約又は覚書等により明確化されている場合には、「二以上の比較可能な同種の保険契約」の対象には含まれないものと考えられます。また、このとき、取り扱えない保険契約が誤って顧客へ提案されないよう、保険会社及び乗合代理店において実態に即して実効的に管理されることが重要と考えます。\nなお、顧客本位の業務運営の確保を目的とする合理的な理由なく、形式的な委託範囲の限定を行うことにより、保険会社からの便宜供与等の見返りとして、特定の保険会社の保険契約を優先的に取り扱うなど、顧客の適切な商品選択の機会を実質的に阻害するおそれのある業務運営を行う場合には、比較推奨販売規制を潜脱するものとして問題となり得ます。\nまた、顧客に対しては、権限明示を適切に実施するとともに、当該限定を行う場合には、当該代理店が取り扱う保険契約の範囲について誤認を与えないよう、適切に説明することが重要です。","theme":"比較可能な同種の保険契約","section":"監督指針","tags":["便宜供与","比較推奨"]},{"no":333,"location":"Ⅱ－4－2－9(5)","comment":"Web完結型の比較サイトや対面募集において、保険会社側のシステム制約、販売方針又は当該代理店への委託範囲の限定等、保険会社側の制約により、取扱いが不可能な保険商198品や当該代理店への情報提供が限定される商品(以下、「取扱い制約商品」とする。)が存在する場合がある。\n比較推奨販売においては、「比較可能な同種の保険契約」\nを示すことが求められるが、上記のような代理店の責に帰さない取扱い制約商品については、顧客に対して、掲載商品が取扱可能商品の全部ではない旨及びその選定基準を適切に説明する限りにおいて、比較対象から除外することに合理的な理由(正当な理由)があると認められるという理解でよいか。","pageStart":198,"pageEnd":199,"answer":"「二以上の比較可能な同種の保険契約」は、代理店委託契約又はこれに基づく覚書等により、当該乗合代理店が取り扱うこととされている保険契約を前提に判断されます。したがって、保険会社から委託を受けておらず、又は代理店委託契約若しくはこれに基づく覚書等により取扱範囲が限定されているため、当該代理店において、実際に取扱いが認められていない保険契約は、当該代理店における推奨販売の対象には含まれません。\nまた、法人向け保険契約に限って委託を受けている場合の個人向け保険契約や、保険会社側の販売方針・情報提供の制約等により実際に取り扱えない保険契約についても、当該制約に係る取扱いが当該委託契約又は覚書等により明確化されている場合には、「二以上の比較可能な同種の保険契約」の対象には含まれないものと考えられます。また、このとき、取り扱えない保険契約が誤って顧客へ提案されないよう、保険会社及び乗合代理店において実態に即して実効的に管理されることが重要と考えます。\nなお、顧客本位の業務運営の確保を目的とする合理的な理由なく、形式的な委託範囲の限定を行うことにより、保険会社からの便宜供与等の見返りとして、特定の保険会社の保険契約を優先的に取り扱うなど、顧客の適切な商品選択の機会を実質的に阻害するおそれのある業務運営を行う場合には、比較推奨販売規制を潜脱するものとして問題となり得ます。\nまた、顧客に対しては、権限明示を適切に実施するとともに、当該限定を行う場合には、当該代理店が取り扱う保険契約の範囲について誤認を与えないよう、適切に説明することが重要です。","theme":"比較可能な同種の保険契約","section":"監督指針","tags":["便宜供与","比較推奨","システム・比較ツール"]},{"no":334,"location":"Ⅱ－4－2－9(5)","comment":"監督指針Ⅱ－4－2－9(5)B.の「乗合代理店が二以上の比較可能な同種の保険契約の中から、顧客の意向に沿って保険契約を選別することにより、保険契約を提示・推奨しようとする場合には、規則第227条の2第3項第4号ロの規定の趣旨を踏まえた上で、保険募集の実務や募集形態等に応じて、以下の事項を遵守しているか。」に関して、「二以上の比較可能な同種の保険契約」とは、保険会社から委託契約書に基づき販売を委託され代理店が取り扱うことができる商品のうち、比較可能な同種の保険契約を指す、という理解でよいか。","pageStart":199,"pageEnd":199,"answer":"「二以上の比較可能な同種の保険契約」は、代理店委託契約又はこれに基づく覚書等により、当該乗合代理店が取り扱うこととされている保険契約を前提に判断されます。したがって、保険会社から委託を受けておらず、又は代理店委託契約若しくはこれに基づく覚書等により取扱範囲が限定されているため、当該代理店において、実際に取扱いが認められていない保険契約は、当該代理店における推奨販売の対象には含まれません。\nまた、法人向け保険契約に限って委託を受けている場合の個人向け保険契約や、保険会社側の販売方針・情報提供の制約等により実際に取り扱えない保険契約についても、当該制約に係る取扱いが当該委託契約又は覚書等により明確化されている場合には、「二以上の比較可能な同種の保険契約」の対象には含まれないものと考えられます。また、このとき、取り扱えない保険契約が誤って顧客へ提案されないよう、保険会社及び乗合代理店において実態に即して実効的に管理されることが重要と考えます。\nなお、顧客本位の業務運営の確保を目的とする合理的な理由なく、形式的な委託範囲の限定を行うことにより、保険会社からの便宜供与等の見返りとして、特定の保険会社の保険契約を優先的に取り扱うなど、顧客の適切な商品選択の機会を実質的に阻害するおそれのある業務運営を行う場合には、比較推奨販売規制を潜脱するものとして問題となり得ます。\nまた、顧客に対しては、権限明示を適切に実施するとともに、当該限定を行う場合には、当該代理店が取り扱う保険契約の範囲について誤認を与えないよう、適切に説明することが重要です。","theme":"比較可能な同種の保険契約","section":"監督指針","tags":["便宜供与","比較推奨"]},{"no":335,"location":"－","comment":"保険会社と乗合代理店の合意によって保険会社が乗合代理店に対して委託する保険商品が限定される場合は、乗合代理店が委託を受けていない保険商品(非委託商品)を募集できない以上、乗合代理店にとって非委託商品は「二以上の比較可能な同種の保険契約」に含まれないと理解している。\nかかる合意の証跡として、例えば、保険会社が乗合代理店199に対して委託する保険商品の範囲が限定されていることが理解できるメールのやり取りを保管しておくことも許容されるという理解でよいか。","pageStart":199,"pageEnd":200,"answer":"「二以上の比較可能な同種の保険契約」は、代理店委託契約又はこれに基づく覚書等において、当該代理店が取り扱うこととされている保険契約を前提に判断されます。\nしたがって、保険会社と乗合代理店との間で、委託対象の保険契約の範囲が明確化されている場合には、当該委託されない保険契約は、当該代理店における推奨販売の対象には含まれないものと考えられます。\n貴見にある「合意の証跡」等、当該委託契約等に係る具体的な手続き等に関する事項については、委託対象の保険契約の範囲が明確に確認できるよう、契約当事者間において定められるべきものと考えます。\nまた、上記の場合において、取り扱えない保険契約が誤って顧客へ提案されないよう、保険会社及び乗合代理店において実態に即して実効的に管理されることが重要と考えます。\nなお、顧客本位の業務運営の確保を目的とする合理的な理由なく、形式的な委託範囲の限定を行うことにより、保険会社からの便宜供与等の見返りとして、特定の保険会社の保険契約を優先的に取り扱うなど、顧客の適切な商品選択の機会を実質的に阻害するおそれのある業務運営を行う場合には、比較推奨販売規制を潜脱するものとして問題となり得ます。\nこのほか、顧客に対しては、権限明示を適切に実施するとともに、当該限定を行う場合には、当該代理店が取り扱う保険契約の範囲について誤認を与えないよう、適切に説明することが重要です。","theme":"比較可能な同種の保険契約","section":"監督指針","tags":["便宜供与","比較推奨","証跡・記録"]},{"no":336,"location":"Ⅱ－4－2－9(5)","comment":"保険業法第98条第2項に基づく認可を得て、他の保険会社の業務の代理又は事務の代行を行う保険会社についても、比較可能な同種の保険契約がある場合、監督指針Ⅱ－4－2－9(5)(乗合代理店における比較推奨販売)の対象となり得る、との理解でよいか。","pageStart":200,"pageEnd":200,"answer":"貴見のとおりです。","theme":"比較可能な同種の保険契約","section":"監督指針","tags":["比較推奨"]},{"no":337,"location":"Ⅱ－4－2－9(5)","comment":"代理店は保険会社との委託契約により保険契約の締結権を代理することができるが、委託契約において保険会社の規定等を遵守すべき旨の条項が含まれている。\n200そのため、保険会社が定める規定等により引受が制限される場合(例えば、恒常的に損害率が高い特定の物件や、モラルリスクが懸念される高額の保険金額での引受け等)、保険会社からの委託を受けている種目においても、一部の商品について募集ができないケースがある。このケースにおいて、顧客が当該補償を希望するときは、当該保険会社の商品は比較可能な同種の保険契約とは言えず、比較推奨販売の対象外と考えてよいか。","pageStart":200,"pageEnd":201,"answer":"代理店委託契約上の取扱範囲に係る規定等により、特定の条件に該当し、保険募集又は引受けができない保険契約が存在する場合には、当該保険契約は当該保険募集において「比較可能な同種の保険契約」には含まれないものと考えられます。","theme":"比較可能な同種の保険契約","section":"監督指針","tags":["比較推奨"]},{"no":338,"location":"Ⅱ－4－2－9(5)","comment":"ECサイト等で募集を行う場合において、保険会社のシステム的な都合により、代理店のサイトからの募集導線が確保できないケースがある。\nこうしたケースにおいては、募集導線が確保できていないために販売することができない保険会社の商品と、募集導線が確保できている保険会社の商品は比較可能な同種の保険とは言えず、比較推奨販売の対象外と考えるがどうか。\nなお、この場合においても、取扱保険会社に関する権限明示を適切に実施する必要がある。","pageStart":201,"pageEnd":201,"answer":"権限明示を適切に実施するとしつつ、一部の所属保険会社等の保険契約を取り扱えないとする貴見のケースの具体的状況が必ずしも明らかではなく一律の回答は困難ですが、一般論として、保険会社都合によるシステム設計上の制約又は技術的制約により、募集導線を確保できず、特定の保険契約について保険募集を行うことが不可能となる場合には、当該保険契約は取り扱う保険契約から除外され、比較推奨販売の対象外になるものと考えます。\nただし、その場合であっても、当該取扱いが乗合代理店における恣意的な運用につながらないよう、代理店委託契約又はこれに基づく覚書等によりあらかじめ明確化されていることが望ましいと考えます。","theme":"比較可能な同種の保険契約","section":"監督指針","tags":["比較推奨","システム・比較ツール"]},{"no":339,"location":"Ⅱ－4－2－9(5)","comment":"生保・損保ともに複数社乗合している代理店において、顧客の意向に沿って比較推奨販売を行うに当たり、特定保険会社の特定商品について販売実績や経験不足、商品知識等に課題を感じた場合には、顧客本位の業務運営の観点から会社として当該商品を販売しない旨、お客さまに明示し、その上で、比較推奨販売における説明商品から除外してもよ201いか。","pageStart":201,"pageEnd":202,"answer":"乗合代理店において、比較推奨販売の対象となる保険契約は、代理店委託契約又はこれに基づく覚書等により、当該代理店が取り扱うこととされている保険契約を前提に判断されます。\nしたがって、顧客本位の業務運営の確保を目的とする合理的な理由により取扱範囲を限定する場合であっても、代理店単独の社内判断や顧客への説明のみでは足りず、所属保険会社等との間で、対象となる保険契約・保険種類等の具体的範囲や取扱いを代理店委託契約又は覚書等により明確化される必要があります。\nなお、当該限定により、保険会社からの便宜供与等の見返りとして、顧客に対して特定の保険会社の保険契約を優先的に取り扱うなど、顧客の適切な商品選択の機会を実質的に阻害するおそれのある業務運営を行う場合には、比較推奨販売規制を潜脱するものとして問題となり得ます。\n顧客に対しては、権限明示を適切に実施するとともに、当該限定を行う場合には、当該代理店が取り扱う保険契約の範囲について誤認を与えないよう、適切に説明することが重要です。","theme":"比較可能な同種の保険契約","section":"監督指針","tags":["便宜供与","比較推奨"]},{"no":340,"location":"－","comment":"顧客意向に沿った保険契約の選別を行う事を前提とするが、所属保険会社が相当数ある乗合代理店については、全ての所属保険会社の全ての保険契約の内容を把握する事は難しく、現実的では無いと思われる。\nまた、選別された結果、取扱いの少ない保険契約を説明する事は、誤った情報を顧客に伝えるリスクも増え、顧客との間でトラブルを生じる可能性も考えられる。\nそこで、当該乗合代理店における顧客属性等を踏まえた上で、所属保険会社との間で以下の様な事を取り決める事は容認されるか。\nもしくは、所属保険会社との取り決めによらず、当該乗合代理店において機関決定することで限定することは容認されるか。\n・当該乗合代理店で取り扱う保険契約を限定する。\n・当該乗合代理店で取り扱う保険種類(例えば、A損保会社とは、火災保険・傷害保険・自動車保険・賠償責任保険。\nB保険会社とは、火災保険・賠償責任保険のみなど)を限定する。","pageStart":202,"pageEnd":202,"answer":"乗合代理店において、比較推奨販売の対象となる保険契約は、代理店委託契約又はこれに基づく覚書等により、当該代理店が取り扱うこととされている保険契約を前提に判断されます。\nしたがって、顧客本位の業務運営の確保を目的とする合理的な理由により取扱範囲を限定する場合であっても、代理店単独の社内判断や顧客への説明のみでは足りず、所属保険会社等との間で、対象となる保険契約・保険種類等の具体的範囲や取扱いを代理店委託契約又は覚書等により明確化される必要があります。\nなお、当該限定により、保険会社からの便宜供与等の見返りとして、顧客に対して特定の保険会社の保険契約を優先的に取り扱うなど、顧客の適切な商品選択の機会を実質的に阻害するおそれのある業務運営を行う場合には、比較推奨販売規制を潜脱するものとして問題となり得ます。\n顧客に対しては、権限明示を適切に実施するとともに、当該限定を行う場合には、当該代理店が取り扱う保険契約の範囲について誤認を与えないよう、適切に説明することが重要です。","theme":"比較可能な同種の保険契約","section":"監督指針","tags":["便宜供与","比較推奨"]},{"no":341,"location":"Ⅱ－4－2－9(5)","comment":"乗合代理店は、自身の判断(社内規則等)のみで、取り扱う商品を限定することは適切ではなく、乗合代理店が保険会社から委託契約書に基づき販売を委託され取り扱うことができる商品の中から取り扱う商品を限定する場合においては、取り扱う商品を限定する合理的な理由が認められること、かつ、乗合代理店の判断(社内規則等)のみではなく、保202険会社と乗合代理店の委託契約書(委託契約書に基づく覚書を含む)で定めること、かつ、限定された商品以外は乗合代理店が取り扱えないよう措置(例えば、代理店がシステムにおいて当該商品の申込を出来なくする対応等や、保険会社が帳票・募集書類一式を代理店に送付しない対応、保険会社によるシステム対応等が考えられる。)を講じることが必要である、という理解でよいか。","pageStart":202,"pageEnd":203,"answer":"貴見のとおりです。\n乗合代理店が取り扱う保険契約の範囲を限定する場合には、比較推奨販売の適正化の観点からは、乗合代理店が社内規則等のみにより、取扱保険契約や保険種類、営業所・店舗ごとの取扱保険契約を恣意的に限定し、顧客の適切な商品選択の機会を実質的に阻害するような運用は適切ではありません。\nまた、顧客本位の業務運営の確保を目的とする合理的な理由により取扱範囲を限定する場合であっても、所属保険会社等との間で当該委託契約又はこれに基づく覚書等により明確化される必要があります。また、このとき、取り扱えない保険契約が誤って顧客へ提案されないよう、例えば、システム制御、募集書類・帳票の管理、保険会社による取扱制限等、保険会社及び乗合代理店において実態に即して実効的に管理されることが重要と考えます。\nなお、顧客本位の業務運営の確保を目的とする合理的な理由なく、形式的な委託範囲の限定を行うことにより、保険会社からの便宜供与等の見返りとして、特定の保険会社の保険契約を優先的に取り扱うなど、顧客の適切な商品選択の機会を実質的に阻害するおそれのある業務運営を行う場合には、比較推奨販売規制を潜脱するものとして問題となり得ます。\nまた、顧客に対しては、権限明示を適切に実施するとともに、当該限定を行う場合には、当該代理店が取り扱う保険契約の範囲について誤認を与えないよう、適切に説明することが重要です。","theme":"比較可能な同種の保険契約","section":"監督指針","tags":["便宜供与","比較推奨","システム・比較ツール"]},{"no":342,"location":"－","comment":"いわゆる「テリトリー制」の弊害を念頭にした議論があると思料するが、代理店が勝手な判断で商品選定をすること、さらに営業所ごとに扱う保険商品を制約することは望ましくないと認識している。\nよって、取り扱い商品の採用自体を代理店が選択する場合や、店によって取り扱う商品を変える場合には、委託契約書(それに紐づく各種書類(例えば覚書等)を含む。)によって、保険会社と合意することが適当と考えるが如何か。","pageStart":203,"pageEnd":203,"answer":"貴見のとおりです。\n乗合代理店が取り扱う保険契約の範囲を限定する場合には、比較推奨販売の適正化の観点からは、乗合代理店が社内規則等のみにより、取扱保険契約や保険種類、営業所・店舗ごとの取扱保険契約を恣意的に限定し、顧客の適切な商品選択の機会を実質的に阻害するような運用は適切ではありません。\nまた、顧客本位の業務運営の確保を目的とする合理的な理由により取扱範囲を限定する場合であっても、所属保険会社等との間で当該委託契約又はこれに基づく覚書等により明確化される必要があります。また、このとき、取り扱えない保険契約が誤って顧客へ提案されないよう、例えば、システム制御、募集書類・帳票の管理、保険会社による取扱制限等、保険会社及び乗合代理店において実態に即して実効的に管理されることが重要と考えます。\nなお、顧客本位の業務運営の確保を目的とする合理的な理由なく、形式的な委託範囲の限定を行うことにより、保険会社からの便宜供与等の見返りとして、特定の保険会社の保険契約を優先的に取り扱うなど、顧客の適切な商品選択の機会を実質的に阻害するおそれのある業務運営を行う場合には、比較推奨販売規制を潜脱するものとして問題となり得ます。\nまた、顧客に対しては、権限明示を適切に実施するとともに、当該限定を行う場合には、当該代理店が取り扱う保険契約の範囲について誤認を与えないよう、適切に説明することが重要です。","theme":"比較可能な同種の保険契約","section":"監督指針","tags":["便宜供与","比較推奨","システム・比較ツール"]},{"no":343,"location":"Ⅱ－4－2－9(5)","comment":"乗合代理店において、変額保険及び外貨建保険を販売している所属生命保険会社のうち、一部の所属生命保険会社についてのみ保険募集人の変額保険販売資格者登録及び外貨建保険販売資格者登録を行っている場合、顧客の意向により変額保険・外貨建保険を提案する際に当該登録を行っている所属生命保険会社のみを対象に変額保険・外貨建保険を選別・推奨することは「保険募集人や乗合代理店の都合による」ものではないとの理解でよいか。\n203","pageStart":203,"pageEnd":204,"answer":"所属保険会社等との代理店委託契約又はこれに基づく覚書等において、貴見のケースに係る取扱いが具体的に定められている場合には、取り扱う保険契約にはならず、「二以上の比較可能な同種の保険契約」の対象にはならないものと考えます。\nただし、その場合であっても、顧客に対しては、乗合代理店全体として当該保険契約を取り扱うことが可能であり、顧客が当該保険契約の説明又は提案を希望する場合には、必要な資格等を有する他拠点の保険募集人に引き継ぐなど、顧客の適切な商品選択の機会を不当に狭めない対応が重要です。\nなお、合理的な理由なく、当該取扱いを形式的に利用して、顧客の適切な商品選択の機会を実質的に阻害するおそれのある業務運営を行う場合には、比較推奨販売規制を潜脱するものとして問題となり得ます。","theme":"比較可能な同種の保険契約","section":"監督指針","tags":["比較推奨"]},{"no":344,"location":"Ⅱ－4－2－9(5)","comment":"拠点毎に配置された保険募集人の販売資格や届出・登録状況が異なる乗合代理店において、例えば少額短期保険募集人が在籍していない拠点や変額保険販売資格者登録・外貨建保険販売資格者登録された保険募集人が在籍していない拠点で、顧客の要望に応じて必要な資格を有する他拠点の保険募集人にて対応することもできることを明示しておくことで、当該拠点としては在籍する保険募集人にて販売できる範囲を比較可能な同種の保険契約として提示・推奨することは認められるとの理解でよいか。\n204","pageStart":204,"pageEnd":205,"answer":"比較推奨販売の対象となる「二以上の比較可能な同種の保険契約」は、原則として、代理店委託契約又はこれに基づく覚書等により、当該代理店が取り扱うこととされている保険契約を前提に判断されます。\n一方、少額短期保険募集人や変額保険・外貨建保険の販売資格登録を有する募集人が特定拠点に在籍していない場合など、当該拠点の保険募集人が、法令上又は制度上、保険募集ができない保険契約については、提示・推奨し得ない場合があると考えられます。\nただし、乗合代理店のみの判断により、取り扱う保険契約が限定されることは適当ではなく、所属保険会社等との間で、その具体的な範囲や取扱いについて、代理店委託契約又はこれに基づく覚書等により合意が形成される必要があると考えます。\n顧客に対しては、乗合代理店全体として当該保険契約を取り扱うことが可能であり、顧客が当該保険契約の説明又は提案を希望する場合には、必要な資格等を有する他の保険募集人に引き継ぐなど、顧客の適切な商品選択の機会を不当に狭めない対応が重要です。\nまた、こうした取扱いを行う場合には、顧客の適切な商品選択の機会の実質的な阻害とならないよう留意するとともに、取り扱えない保険契約が誤って顧客へ提案されないよう、保険会社及び乗合代理店において実態に即して実効的に管理し、顧客に誤認を与えないよう適切に説明することが重要と考えます。","theme":"比較可能な同種の保険契約","section":"監督指針","tags":["比較推奨"]},{"no":345,"location":"Ⅱ－4－2－9(5)","comment":"各乗合保険会社との協議により、委託契約書や覚書等の内容を変更し、取り扱い種目・商品をあらかじめ限定することにより事前に推奨商品を絞り込む手法は、潜脱行為とみなされるのか。","pageStart":205,"pageEnd":205,"answer":"代理店委託契約又はこれに基づく覚書等により、取扱種目や保険契約を限定すること自体が、直ちに比較推奨販売規制の潜脱となるものではありません。\n顧客本位の業務運営の確保を目的とする合理的な理由により、取扱範囲を限定する場合には、所属保険会社等との間で当該委託契約又はこれに基づく覚書等により明確化される必要があります。また、このとき、取り扱えない保険契約が誤って顧客へ提案されないよう、保険会社及び乗合代理店において実態に即して実効的に管理されることが重要と考えます。\nなお、顧客本位の業務運営の確保を目的とする合理的な理由なく、形式的な委託範囲の限定を行うことにより、保険会社からの便宜供与等の見返りとして、特定の保険会社の保険契約を優先的に取り扱うなど、顧客の適切な商品選択の機会を実質的に阻害するおそれのある業務運営を行う場合には、比較推奨販売規制を潜脱するものとして問題となり得ます。\nまた、顧客に対しては、権限明示を適切に実施するとともに、当該限定を行う場合には、当該代理店が取り扱う保険契約の範囲について誤認を与えないよう、適切に説明することが重要です。","theme":"比較可能な同種の保険契約","section":"監督指針","tags":["便宜供与","比較推奨"]},{"no":346,"location":"Ⅱ－4－2－9(5)","comment":"監督指針改正案Ⅱ－4－2－9(5)に関連し、乗合代理店(A・B・C社の乗合代理店)とA保険会社との合意で、ある店舗ではA保険会社の保険契約を取り扱わないという合意をした場合、当該店舗においては、例えば医療保険(当該代理店においてA・B・C社の医療保険の取扱いはある。)を募集するにあたり、「二以上の比較可能な同種の保険契約」にはA社の医205療保険は含まれない(B・C社のみが比較の対象となる。)という理解でよいか。","pageStart":205,"pageEnd":206,"answer":"保険会社との合意に至る具体的な事情・背景が必ずしも明らかでありませんが、比較推奨販売の対象となる「二以上の比較可能な同種の保険契約」は、代理店委託契約又はこれに基づく覚書等により、当該代理店が取り扱うこととされている保険契約を前提に判断されます。\n一方で、顧客本位の業務運営の確保を目的とする合理的な理由なく、形式的な委託範囲の限定を行うことにより、保険会社からの便宜供与等の見返りとして、顧客に対して特定の保険会社の保険契約を優先的に取り扱うなど、顧客の適切な商品選択の機会を実質的に阻害するおそれのある業務運営を行う場合には、比較推奨販売規制を潜脱するものとして問題となり得ます。","theme":"比較可能な同種の保険契約","section":"監督指針","tags":["便宜供与","比較推奨"]},{"no":347,"location":"－","comment":"乗合代理店が特定の商品を一部の組織(支店・営業部等)\n・保険募集人に限定して取り扱わせる場合においては、委託契約の在り方によっては、所謂、「テリトリー制」を実質的に存続させ、権限明示や比較推奨販売の形骸化にも繋がり得るため、取扱いを限定するより合理的な理由が認められること(特定の商品を取り扱う場合には資格取得が必要である等)、かつ、乗合代理店の判断(社内規則等)のみではなく、保険会社と乗合代理店の委託契約書(委託契約書に基づく覚書を含む。)で定めること、かつ、特定の商品の取り扱いが認められない他の組織(支店・営業部等)\n・保険募集人が当該商品を取り扱うことがないような措置を講じることが必要である、という理解でよいか。\nなお、保険会社から乗合代理店への便宜供与の見返り等として特定の保険会社の商品を推奨するために、乗合代理店が取り扱う商品を限定することは、顧客の適切な商品選択の機会を確保する観点から適切ではない、という理解でよいか。","pageStart":206,"pageEnd":206,"answer":"貴見のとおりです。\n顧客本位の業務運営の確保を目的とする合理的な理由により乗合代理店が特定の保険契約を一部の組織又は保険募集人に限定して取り扱わせる場合であっても、当該限定を行うことにより、保険会社からの便宜供与等の見返りとして、顧客に対して特定の保険会社の保険契約を優先的に取り扱うなど、顧客の適切な商品選択の機会を実質的に阻害するおそれのある業務運営が行われ、比較推奨販売規制の潜脱とならないよう留意する必要があります。\nその上で、資格要件、専門性、管理態勢等の合理的な理由により、取扱範囲を限定する場合には、所属保険会社等との代理店委託契約又はこれに基づく覚書等により、その具体的範囲を明確に定めることが必要です。\nまた、取扱いが認められない組織又は保険募集人が当該保険契約を誤って募集しないよう、システム制御、資格管理、募集書類の管理等により、保険会社及び乗合代理店において実態に即して実効的に管理することが重要と考えます。","theme":"比較可能な同種の保険契約","section":"監督指針","tags":["便宜供与","比較推奨","システム・比較ツール"]},{"no":348,"location":"－","comment":"乗合代理店は、保険会社から委託を受け、顧客に対してあらかじめ権限明示を行う義務が課されている中、乗合代理店が独自の理由で社内規則等において、「特定の店舗は、特206定の保険会社の商品しか取り扱わない」旨を定めて販売することは、所謂、「テリトリー制」を惹起させるものであり、顧客の適切な商品選択の機会を阻害し得るものであると考えられることから、こうした対応は許容されない、という理解でよいか。\n(理由)\n乗合代理店が保険会社からの便宜供与等の見返りとして、顧客に対して特定の保険会社の商品を優先的に推奨することは問題であるところ、保険会社からの便宜供与等の見返りとして、乗合代理店が、特定の店舗ごとに単独の所属保険会社を設定するおそれがあり、当該おそれを払拭することができないと考えられるため。","pageStart":206,"pageEnd":207,"answer":"貴見のとおりです。\nご指摘のように、乗合代理店が独自の判断で社内規則等により「特定の店舗では特定の保険会社の商品しか取り扱わない」などと定め、実質的に顧客の適切な商品選択の機会を阻害するような運用は適切ではありません。\n特に、保険会社からの便宜供与等の見返りとして、特定の保険会社の保険契約を優先的に取り扱う目的で取り扱う保険契約を代理店委託契約又はこれに基づく覚書等で限定して業務運営を行うことは、顧客の適切な商品選択の機会を実質的に阻害し得るものとして問題となり得ます。","theme":"比較可能な同種の保険契約","section":"監督指針","tags":["便宜供与"]},{"no":349,"location":"－","comment":"監督指針Ⅱ－4－2－9(5)に関して、乗合代理店が比較推奨販売を行う際に、新商品の教育・研修の実施が必要となるため、一時的に販売態勢が整っていない新商品の提示まで求められるものではないが、例えば、顧客からの照会等があった場合には、当該商品を提示しない理由を説明することが望ましいとの理解でよいか。\n207","pageStart":207,"pageEnd":208,"answer":"貴見のとおりです。\nなお、新商品については、保険募集人への教育・研修、システム対応、募集資料の整備等が完了しておらず、当該代理店において適切な説明・募集を行う態勢が整っていない場合には、当該商品を直ちに提示・推奨することまで求められるものではありません。\nただし、当該取扱いは、代理店の恣意的な判断により比較対象を限定するものとならないよう、所属保険会社等との間で、販売開始時期、取扱範囲、必要な教育・管理態勢等について、明確に整理されていることが重要です。\nまた、顧客から当該商品について照会があった場合には、現時点で提示・推奨できない理由や、必要に応じて今後の取扱予定等を分かりやすく説明すること、代理店のホームページ等で取扱開始時期を予め公表するなどの対応を行うことが望ましいと考えます。\nなお、販売態勢未整備を理由として、恒常的に特定の商品を比較推奨販売の対象から除外し、顧客の適切な商品選択の機会を実質的に阻害し得る業務運営を行う場合には、比較推奨販売規制を潜脱するものとして問題となり得ます。","theme":"比較可能な同種の保険契約","section":"監督指針","tags":["比較推奨","システム・比較ツール"]},{"no":350,"location":"－","comment":"監督指針Ⅱ－4－2－9(5)について、複数の意向を組み合わせて絞りこんだ「比較軸」を事前に確定した上で提示する試算的サンプル見積は、改正後も許容されるか。\n試算的なサンプル見積の提示は慎重であるべき、又は原則として許容されないとの整理が示された場合、顧客の意向に沿った比較軸を具体化するためには、より多くの保険会社又は保険契約の見積を提示せざるを得ない運用が生じる可能性がある。\nしかしながら、実際の保険料はリスク細分後の条件により大きく変動するため、当該顧客の条件を反映しない多数社の見積提示は、顧客にとって理解しやすい比較とは言い難く、かえって判断を困難にし、形式的な比較に陥るおそれがある。\nこれに対し、顧客の「比較軸」に基づいた顧客の意向範囲に含まれる代表的な数社を選定し、当該顧客の条件を前提とした試算的な保険料例を提示することは、顧客が自身の価値判断と保険料水準との関係を具体的に理解し、比較軸を明確化する上で、実務上合理的であり、顧客が自己の意向に基づき商品選択を行うことを可能とする点で、顧客本位の業務運営の趣旨にも合致する方法と考えられる。\nしたがって、試算的サンプル見積の提示を一律に否定す208るのではなく、その目的が「比較対象商品の選別」ではなく「顧客の意向及び比較軸の理解促進」(詳細意向の把握に貢献)にある場合には、一定の範囲で許容されるとの整理が、改正趣旨と実務運用の両立の観点から望ましいと考える。\nなお、比較軸は、単一(例：保険料のみ)又は複合(例：保険料＋補償範囲＋付帯サービス等)となり得るため、事前に顧客意向に応じて適切に設定する必要がある。","pageStart":208,"pageEnd":209,"answer":"貴見にある「比較軸」の意味するところが必ずしも明らかではありませんが、一般に、保険料水準、保障(補償)内容、付帯サービス等の比較項目を整理し、顧客の意向に応じて、保険料の試算情報を参考情報として提示すること自体は直ちに否定されるものではありません。\nただし、当該試算情報は、意向形成を促し、又は意向の明確化のためのものであり、あらかじめ特定の保険会社又は特定の保険契約へ誘導するものであってはなりません。\nまた、当該試算情報を提示する場合には、Ⅱ－4－2－2(9)④などに留意しつつ、可能な限り同一又は近似の条件にした上で、その条件の違いが保険料や保障(補償)内容に与える影響について、顧客に誤認を与えないよう留意することが重要です。\nその上で、特定の保険契約を選別し、推奨する場合には、顧客の意向に照らし、合理的かつ一定の具体性を有する基準や理由等に基づき説明する必要があります。その場合、推奨する特定の保険契約以外の保険契約もある旨及び顧客の求めに応じてそれらの保険契約の概要又は契約内容を説明する必要があります。\nなお、保険料の試算情報を提示する行為が保険契約の選別に当たり得るか否かについては、当該試算情報の名称や形式のみで一律に判断されるものではなく、実質的に特定の保険契約への誘導となっていないか等を個別具体的に判断する必要があります。","theme":"比較可能な同種の保険契約","section":"監督指針","tags":[]},{"no":351,"location":"－","comment":"保険会社との委託契約が継続しており、かつ当該保険会社の商品(特定種目)の既契約を保有している場合であっても、代理店の経営判断(体制整備上の理由等)により、法改正後の「新規の推奨・販売」の対象から当該商品を除外することは許容されるか。\n■理由過去に販売した商品の契約(既契約)が積み上がっている一方で、昨今の法改正、現在の人員体制や専門性の変化により、当該商品の新規販売を行うには十分な知識・体制を維持できないケースが発生する可能性がある。\nこのような場合、無理に全商品の販売を継続することは、説明不足等により顧客の利益を損なう恐れがあるため、以下の運用が法令上問題ないことを確認したい。\n1.既契約の保護と新規募集の分離既存の契約者に対する保全・更新業務は継続しつつ、新規の顧客(あるいは既契約者の追加契約)に対する推奨商品ラインナップからは、当該商品(または種目)を除外すること。\n2092.推奨除外の正当性上記のような「体制不備を理由とした取扱い商品の縮小」\nは、いわゆる「代理店都合による恣意的な絞り込み」には該当せず、顧客に対する責任ある販売体制の構築として認められること。","pageStart":209,"pageEnd":210,"answer":"取扱商品一覧などといったものから特定の保険契約又は保険種目を除外することのみをもって、当該保険会社の保険契約が当然に保険募集時の比較推奨販売の対象外となるものではありません。\n比較推奨販売の対象となる「二以上の比較可能な同種の保険契約」は、代理店委託契約又はこれに基づく覚書等により、当該代理店が取り扱うこととされている保険契約を前提に判断されます。\nしたがって、特定の保険契約・種目について、既契約の保全・異動対応のみを継続し、新規募集を行わない取扱いとする場合において、所属保険会社等との間で、例えば、新規募集停止の対象となる保険契約・保険種目、停止時期、既契約対応の範囲や取扱い等について、代理店委託契約又はこれに基づく覚書等により明確化されているときには、新規募集時において、当該保険契約は「二以上の比較可能な同種の保険契約」に含まれないものと考えられます。\nまた、このとき、取り扱えない保険契約が誤って顧客へ提案されないよう、保険会社及び乗合代理店において実態に即して実効的に管理されることが重要と考えます。\nまた、顧客に対しては、権限明示を適切に実施するとともに、当該保険会社について、「新規募集は行わず、既契約の保全・異動対応のみを行う」旨など、取扱範囲について誤認を与えないよう適切に説明することが重要です。","theme":"比較可能な同種の保険契約","section":"監督指針","tags":["比較推奨","更改・継続"]},{"no":352,"location":"Ⅱ－4－2－9(5)","comment":"更新のみしか行っていない保険会社の商品について、「新規募集は行わないが、既存契約の更新は対応する」旨をホームページに記載した上で、比較推奨販売の対象から除外することは可能か。","pageStart":210,"pageEnd":210,"answer":"取扱商品一覧などといったものから特定の保険契約又は保険種目を除外することのみをもって、当該保険会社の保険契約が当然に保険募集時の比較推奨販売の対象外となるものではありません。\n比較推奨販売の対象となる「二以上の比較可能な同種の保険契約」は、代理店委託契約又はこれに基づく覚書等により、当該代理店が取り扱うこととされている保険契約を前提に判断されます。\nしたがって、特定の保険契約・種目について、既契約の保全・異動対応のみを継続し、新規募集を行わない取扱いとする場合において、所属保険会社等との間で、例えば、新規募集停止の対象となる保険契約・保険種目、停止時期、既契約対応の範囲や取扱い等について、代理店委託契約又はこれに基づく覚書等により明確化されているときには、新規募集時において、当該保険契約は「二以上の比較可能な同種の保険契約」に含まれないものと考えられます。\nまた、このとき、取り扱えない保険契約が誤って顧客へ提案されないよう、保険会社及び乗合代理店において実態に即して実効的に管理されることが重要と考えます。\nまた、顧客に対しては、権限明示を適切に実施するとともに、当該保険会社について、「新規募集は行わず、既契約の保全・異動対応のみを行う」旨など、取扱範囲について誤認を与えないよう適切に説明することが重要です。","theme":"比較可能な同種の保険契約","section":"監督指針","tags":["比較推奨","更改・継続"]},{"no":353,"location":"Ⅱ－4－2－9(5)","comment":"新規契約の取扱いを停止(既契約の異動対応のみ実施)している保険会社は、「新規募集は行わず既存契約の異動対応のみ実施している」旨を取扱い保険会社一覧に記載した上で、比較推奨販売の対象から除外することは問題ないか。","pageStart":210,"pageEnd":210,"answer":"取扱商品一覧などといったものから特定の保険契約又は保険種目を除外することのみをもって、当該保険会社の保険契約が当然に保険募集時の比較推奨販売の対象外となるものではありません。\n比較推奨販売の対象となる「二以上の比較可能な同種の保険契約」は、代理店委託契約又はこれに基づく覚書等により、当該代理店が取り扱うこととされている保険契約を前提に判断されます。\nしたがって、特定の保険契約・種目について、既契約の保全・異動対応のみを継続し、新規募集を行わない取扱いとする場合において、所属保険会社等との間で、例えば、新規募集停止の対象となる保険契約・保険種目、停止時期、既契約対応の範囲や取扱い等について、代理店委託契約又はこれに基づく覚書等により明確化されているときには、新規募集時において、当該保険契約は「二以上の比較可能な同種の保険契約」に含まれないものと考えられます。\nまた、このとき、取り扱えない保険契約が誤って顧客へ提案されないよう、保険会社及び乗合代理店において実態に即して実効的に管理されることが重要と考えます。\nまた、顧客に対しては、権限明示を適切に実施するとともに、当該保険会社について、「新規募集は行わず、既契約の保全・異動対応のみを行う」旨など、取扱範囲について誤認を与えないよう適切に説明することが重要です。","theme":"比較可能な同種の保険契約","section":"監督指針","tags":["比較推奨"]},{"no":354,"location":"Ⅱ－4－2－9(5)","comment":"損害保険1社専属化に向けた移行期間(乗合解除予定の損保と取引があるものの、既契約の更新を迎える都度、専属1社に契約を切り替えていくための期間)であれば、乗合解除予定損保は比較推奨販売の対象外とすることができるとの理解でよいか。\n210","pageStart":210,"pageEnd":211,"answer":"専属化に向けた移行期間中であることのみをもって、代理店委託契約の解除予定の保険会社の保険契約が比較推奨販売の対象外となるものではありません。\n比較推奨販売の対象となる「二以上の比較可能な同種の保険契約」は、代理店委託契約又はこれに基づく覚書等により、当該代理店が取り扱うこととされている保険契約を前提に判断されます。\nしたがって、乗合解除予定の保険会社の保険契約について、新規募集又は更新時における具体的な範囲や取扱い等が、所属保険会社等との間で代理店委託契約又はこれに基づく覚書等により明確化されている場合には、当該募集時において、当該保険契約は「二以上の比較可能な同種の保険契約」に含まれないものと考えられます。また、このとき、取り扱えない保険契約が誤って顧客へ提案されないよう、保険会社及び代理店において実態に即して実効的に管理されることが重要と考えます。\nこのほか、顧客に対しては、権限明示を適切に実施するとともに、取扱保険会社・保険契約の範囲について誤認を与えないよう適切に説明することが重要です。","theme":"比較可能な同種の保険契約","section":"監督指針","tags":["比較推奨","更改・継続"]},{"no":355,"location":"Ⅱ－4－2－9(5)","comment":"代理店においては、代理店に対する業務フォロー等サービス体制の不足、所属保険会社にて現行商品の新規・更新契約を停止している等の理由などで、既契約の維持・保全のみのために代理店契約を継続しており、実務的に当該保険会社の商品の提示・推奨を行っていないケースが存在する。\nその場合において、代理店契約があるからという理由のみで、比較推奨の対象とする事は不合理と考える。\nそこで、「あらかじめ所属保険会社等の商号等を明らかにした上で」を踏まえ、顧客宛て説明資料に所属保険会社の一覧等には当該保険会社名を記載するが、「新規・満期更新時の商品提示・推奨は行っていない」等を補記する事は、妨げられないと考えるがその理解でよいか。\n211","pageStart":211,"pageEnd":211,"answer":"比較推奨販売の対象となる「二以上の比較可能な同種の保険契約」は、代理店委託契約又はこれに基づく覚書等により、当該代理店が取り扱うこととされている保険契約を前提に判断されます。\nしたがって、既契約の維持・保全のみを目的として代理店委託契約を継続し、新規募集や満期更新時に特定の保険契約の提示・推奨を行わない場合において、乗合代理店の判断のみではなく、所属保険会社等との間で、その具体的範囲や取扱いについて、代理店委託契約又はこれに基づく覚書等により明確化されているときには、新規募集の場面において、当該保険契約は「二以上の比較可能な同種の保険契約」に含まれないものと考えられます。また、このとき、取り扱えない保険契約が誤って顧客へ提案されないよう、保険会社及び乗合代理店において実態に即して実効的に管理されることが重要と考えます。\nその上で、顧客向け説明資料等に所属保険会社名を記載しつつ、「新規募集・満期更新時の商品提示又は推奨は行っていない」等の旨を補記することは、顧客に誤認を与えないための対応として考えられます。\nなお、当該取扱いによって、顧客の適切な商品選択の機会を実質的に阻害するおそれのある業務運営を行う場合には、比較推奨販売規制を潜脱するものとして問題となり得ます。","theme":"比較可能な同種の保険契約","section":"監督指針","tags":["比較推奨","更改・継続"]},{"no":356,"location":"Ⅱ－4－2－9(5)","comment":"例えば、A保険会社、B保険会社及びC保険会社と乗り合う代理店が、新規募集についてA保険会社及びB保険会社の保険契約とし、C保険会社の保険契約は既契約者対応のみの取扱いとしたいというケースがある(例えば、乗合代理店が取り扱うC保険会社の既契約数が非常に少ないが、C保険会社との代理店業務委託契約を全て解除してしまうと、既契約者の利益を損なうような場合に、かかるケースが生じることになる。)。\nかかるケースにおいて、乗合代理店とC保険会社が「C保険会社の保険契約は既契約対応のみとする」旨を覚書締結等によって合意すれば、乗合代理店による新規募集においてC保険会社の保険契約は「二以上の比較可能な同種の保険契約」に含まれないと考えられるが、C保険会社が合意を拒否するケースがあると懸念している。\nこの点、C保険会社が覚書締結等による合意を拒否する場合、乗合代理店は、C保険会社の既契約者の利益を損なわないようにするため、乗合代理店からの事前通知により代理店業務委託契約の一部を解除することによってC保険会社との代理店業務委託契約の委託業務を既契約者対応のみの範囲とすれば(代理店業務委託契約書上、乗合代理店からも例えば60日前予告により当該契約を一部解除できる旨が定められているケースがある。)、C保険会社との合意が成立しなかったとしても、乗合代理店による新規募集においてC保険会社の保険契約は「二以上の比較可能な同種の保険契約」\nに含まれないという理解でよいか。\n212また、代理店業務委託契約の一部解除の効力が生じるのは厳密にいえば事前通知期間経過後になるが、当該契約の一部解除の意思表示を行った以上、それ以降は、乗合代理店による新規募集においてC保険会社の保険契約は「二以上の比較可能な同種の保険契約」に含まれないという理解でよいか。\nなお、乗合代理店がC保険会社との代理店業務委託契約の一部解除の意思表示を行った場合に、それに対抗してC保険会社が乗合代理店との代理店業務委託契約の全部解除を行うことは、乗合代理店が取り扱うC保険会社の保険契約の既契約者の利益を損なうものであると思料する。","pageStart":212,"pageEnd":213,"answer":"ご指摘のケースは、代理店委託契約の内容、一部解除の可否・効力発生時期、当事者間の合意状況等に関わるものであるため、一律にお答えすることは困難です。\n一般論として、比較推奨販売の対象となる「二以上の比較可能な同種の保険契約」は、代理店委託契約又はこれに基づく覚書等により、当該代理店が取り扱うこととされている保険契約を前提に判断されます。\nしたがって、保険会社との合意又は有効な契約変更・一部解除等により、特定保険会社の保険契約について新規募集を行わず、既契約者対応のみを行う取扱いが明確化されている場合には、新規募集の場面において、当該保険契約は「二以上の比較可能な同種の保険契約」に含まれないものと考えられます。\n一方で、一部解除の効力が発生していない段階で、乗合代理店の一方的判断のみをもって、直ちに「二以上の比較可能な同種の保険契約」から除外できると判断されるものではないと考えます。\nまた、上記の場合において、取り扱えない保険契約が誤って顧客へ提案されないよう、保険会社及び乗合代理店において実態に即して実効的に管理されることが重要と考えます。\nなお、当該取扱いによって、顧客の適切な商品選択の機会を実質的に阻害するおそれのある業務運営を行う場合には、比較推奨販売規制を潜脱するものとして問題となり得ます。\n顧客に対しては、権限明示を適切に実施するとともに、新規募集を行う保険会社・保険契約と、既契約者対応に限る保険会社・保険契約との違いについて、誤認を与えないよう適切に説明することが重要です。","theme":"比較可能な同種の保険契約","section":"監督指針","tags":["比較推奨"]},{"no":357,"location":"Ⅱ－4－2－9(5)","comment":"乗合保険会社を減らす検討をする場合、契約者への案内や契約移管、委託契約解消の事務処理などで一定の準備期間を必要とするが、その間、当該保険会社については見込み客等への告知等を行った上で、比較推奨販売から除外する運用をしても差し支えないか。\n213","pageStart":213,"pageEnd":214,"answer":"所属保険会社等を減らす方針を検討又は決定していることや、見込み客等へ告知することのみをもって、当該保険会社の保険契約を当然に比較推奨販売の対象外とすることは適切ではありません。\n比較推奨販売の対象となる「二以上の比較可能な同種の保険契約」は、代理店委託契約又はこれに基づく覚書等により、当該代理店が取り扱うこととされている保険契約を前提に判断されます。\nしたがって、委託契約の解消又は取扱停止に向けた準備期間中であっても、例えば、新規募集停止の対象となる保険契約、停止時期、既契約の保全対応等について、所属保険会社等との間で代理店委託契約又は覚書等により明確化されている場合には、新規募集の場面において、当該保険契約は「二以上の比較可能な同種の保険契約」に含まれないものと考えられます。また、このとき、取り扱えない保険契約が誤って顧客へ提案されないよう、保険会社及び乗合代理店において実態に即して実効的に管理されることが重要と考えます。\n顧客に対しては、権限明示を適切に実施するとともに、新規募集を行う保険会社・保険契約と、既契約者対応に限る保険会社・保険契約との違いについて、誤認を与えないよう適切に説明することが重要です。","theme":"比較可能な同種の保険契約","section":"監督指針","tags":["比較推奨"]},{"no":358,"location":"Ⅱ－4－2－9(5)","comment":"乗合代理店が、取引保険会社を見直し、一部の保険会社の委託契約を解除する際、当該保険会社と代理店委託契約書や覚書を締結し、顧客の意向に沿うための当面の対応として、当該保険会社について継続契約のみ取り扱うものとすることがある。\nこのようなケースにおいて、当該保険会社の保険商品に関しては継続契約に限定され新規販売しないことから、「比較可能な同種の保険契約」には含まれないと解するという理解でよいか。\nその際、取扱い可能な商品については保険会社の教育・管理・指導のもと、乗合代理店が、取扱い可能な所属保険会社として、当該保険会社は継続契約に限定されることを明らかにするとともに、代理店のホームページ上にも事前に公表等することによることが望ましいとの理解でよいか。","pageStart":214,"pageEnd":214,"answer":"貴見のとおりです。\n乗合代理店が顧客本位の業務運営の確保を目的として一部の保険会社との委託関係を見直すにあたり、当該保険会社との代理店委託契約又はこれに基づく覚書等により、当該保険会社の保険契約について新規募集を行わず、継続契約のみ取り扱う旨が明確に定められている場合には、新規募集の場面において、当該保険契約は「二以上の比較可能な同種の保険契約」に含まれないものと考えられます。\nなお、当該取扱いが実態としても確実に確保されるよう留意するとともに、保険会社からの便宜供与等の見返りとして、特定の保険会社の保険契約を優先的に取り扱うなど、顧客の適切な商品選択の機会を実質的に阻害するおそれのある業務運営が行われ、比較推奨販売規制の潜脱とならないよう留意する必要があります。\nまた、顧客に対しては、権限明示を適切に実施するとともに、当該保険会社の保険契約は継続契約に限り取り扱う旨を分かりやすく説明し、必要に応じてホームページ等でも公表するなど、取扱範囲について誤認を与えない対応を行うことが重要です。","theme":"比較可能な同種の保険契約","section":"監督指針","tags":["便宜供与","比較推奨","更改・継続"]},{"no":359,"location":"Ⅱ－4－2－9(5)","comment":"「比較可能な同種の保険契約」について、乗合代理店が顧客へ提案可能な保険商品において、「対面販売商品」や「保214険会社側のシステムで重要事項説明や申込手続き等を行うインターネット完結型商品」、「通販商品」が「比較可能な同種の保険契約」といえる場合、これらの販売商品のすべてが比較推奨販売の対象になるのか確認したい。\n例えば、対面販売の際に、インターネット完結型商品や通販商品は「比較可能な同種の保険契約」として考慮する必要はないという整理になるのか確認したい。\nこの場合、インターネット完結型商品や通販商品も取り扱っている旨を情報提供する対応が必須となるのか確認したい。","pageStart":214,"pageEnd":215,"answer":"比較推奨販売の対象となる「二以上の比較可能な同種の保険契約」は、代理店委託契約又はこれに基づく覚書等により、当該代理店が取り扱うこととされている保険契約を前提に判断されます。\nしたがって、乗合代理店が取り扱う保険契約が「対面販売商品」、「インターネット完結型商品」又は「通販商品」といった販売形態ごとに区分できる場合であっても、当該区分が異なることのみを理由として、異なる区分に属する保険契約が「二以上の比較可能な同種の保険契約」に該当しないと直ちに判断されるものではありません。\n当該判断に当たっては、顧客の具体的な意向や保険契約の対象となるリスクの種類及び保険給付の内容等を踏まえつつ、個別具体的かつ実質的に判断される必要があるため、一律の見解を示すことは困難です。","theme":"比較可能な同種の保険契約","section":"監督指針","tags":["比較推奨","システム・比較ツール"]},{"no":360,"location":"Ⅱ－4－2－9(5)","comment":"ダイレクトメッセージ(以下、DMとする。)の送付をきっかけに代理店の店舗窓口へお誘いするケースは多いが、全商品(100商品程度)の情報は掲載できないため、新商品など、新しい情報のみを提示することになる。\nこのような場合、顧客は少ない商品情報で来店してくることになり、意向把握自体が未了と解釈されると考えているが、例えば、来店後に通常の意向把握を行い、DMで情報提供した商品以外に興味が移った場合、当該商品の比較推奨提案に切り替えることが必要との理解でよいか。","pageStart":215,"pageEnd":215,"answer":"ダイレクトメッセージ(DM)により一部の保険契約の情報を提供したことのみをもって、顧客の意向把握が完了したものとはいえず、顧客が乗合代理店に来店した際には、顧客が示した関心事項等も踏まえつつ、アンケートや対話等の通常の意向把握プロセスに則り、顧客の具体的な意向を把握する必要があります。\nその結果、DMで案内した保険契約以外の保険契約又は保険種類について、「比較可能な同種の保険契約」が複数存在する場合には、当該意向に沿って、保険業法施行規則第227条の2第3項第4号ロ(推奨販売)の規定に係る対応を適切に行う必要があります。","theme":"比較可能な同種の保険契約","section":"監督指針","tags":["比較推奨","意向把握"]},{"no":361,"location":"Ⅱ－4－2－9(5)","comment":"現在、ホームページに特定の保険会社のネット募集が可能な保険種目(種類)のバナーを掲載している。保険業法施行規則第227条の2第3項第4号ハが廃止された場合、乗合保険会社すべてのバナー(取扱い実績がある場合)をホームページに掲載する必要があるのか、それとも従前どおり特定215の保険会社のバナーのみを掲載すればよいのか確認したい。","pageStart":215,"pageEnd":216,"answer":"貴見のケースにおける「バナー」の具体的な表示内容や掲載方法等が必ずしも明らかでないため、一律の見解をお示しすることは困難です。\n一般論として、バナーの表示内容、掲載方法、掲載位置、遷移先の内容等により、特定の保険会社又は特定の保険契約を選別し、提示・推奨していると評価され得る場合には、比較推奨販売に係る規定の適用関係を検討する必要があります。\nまた、特定の保険会社のバナーのみを掲載する場合には、顧客に対して、当該代理店が取り扱う保険会社又は保険契約全体を表示しているかのような誤認を与えないよう留意する必要があります。\n加えて、当該掲載が、保険会社からの便宜供与等の見返りとして、特定の保険会社の保険契約を優先的に取り扱う目的又は効果を有するなど、実質的に特定の保険契約の優先的な取扱いを誘引し得るものとなっている場合には、顧客の適切な商品選択の機会を実質的に阻害するものとして問題となり得ます。\nしたがって、掲載するバナーの範囲や選定理由については、必要性・合理性・相当性を踏まえ、顧客に誤認を与えない表示となるよう適切に管理することが重要です。","theme":"比較可能な同種の保険契約","section":"監督指針","tags":["便宜供与","比較推奨","ハ方式"]},{"no":362,"location":"Ⅱ－4－2－9(5)","comment":"インターネットによる保険募集においても、監督指針Ⅱ－4－2－9(5)を踏まえた対応・体制整備を行う必要があるとの理解でよいか。","pageStart":216,"pageEnd":216,"answer":"貴見のとおりです。\nインターネットによる保険募集であっても、乗合代理店が「二以上の比較可能な同種の保険契約」の中から、顧客の意向に沿って保険契約を選別・提案する場合には、Ⅱ－4－2－9(5)を踏まえた対応及び体制整備が必要です。","theme":"比較可能な同種の保険契約","section":"監督指針","tags":[]},{"no":363,"location":"Ⅱ－4－2－9(5)","comment":"監督指針Ⅱ－4－2－9(5)①B.(a)の「特定の保険契約を推奨する場合」に関し、「特定の保険契約」は1つに限らず、複数の「特定の保険契約」があっても問題ないと考えてよいか。","pageStart":216,"pageEnd":216,"answer":"貴見のとおりです。","theme":"比較可能な同種の保険契約","section":"監督指針","tags":[]},{"no":364,"location":"Ⅱ－4－2－9(5)","comment":"監督指針Ⅱ－4－2－9(5)①B.(a)の「推奨する特定の保険契約以外の保険契約」とは、どの程度の範囲の保険契約につ216いて説明すれば足りるか。\n(例.「乗合代理店が取扱い可能な全ての保険契約」、「比較可能な同種の保険契約」、「顧客の意向に沿って選別し、提示・推奨した保険契約」)","pageStart":216,"pageEnd":217,"answer":"「推奨する特定の保険契約以外の保険契約」とは、乗合代理店が取り扱う全ての保険契約を指すものではなく、「二以上の比較可能な同種の保険契約」のうち、顧客の意向に沿って選別された保険契約の中で、最終的に推奨する特定の保険契約以外のものを指します。\nしたがって、顧客の意向に照らして選別対象とならない保険契約についてまで、一律に説明を求めるものではありません。","theme":"比較可能な同種の保険契約","section":"監督指針","tags":[]},{"no":365,"location":"Ⅱ－4－2－9(5)","comment":"改正後の比較推奨販売ルールにおいて、特定保険会社の特定の商品パンフレットを用いてニーズ喚起を行い、顧客が当該商品の契約を希望した場合であっても、他に比較可能な同種の保険契約が存在するにもかかわらず、その存在や、顧客の要望に応じて説明可能である旨を告げずに契約に至った場合、改正保険業法又は施行規則に抵触・違反するか。","pageStart":217,"pageEnd":217,"answer":"ご指摘のケースが法令に抵触するか否かは、意向把握・確認、情報提供、比較推奨販売に係る説明等の具体的な募集実態を踏まえて、個別具体的に判断されます。\n一般的に、特定の保険契約のパンフレット等により顧客の関心を喚起した場合であっても、乗合代理店は、通常の意向把握プロセスに則り顧客の意向を適切に把握することが求められ、その結果、「二以上の比較可能な同種の保険契約」の中から保険契約を選別し推奨する場合には、当該意向に沿った合理的かつ一定の具体性を有する基準や理由等に基づき推奨を行う必要があります。\nまた、推奨する保険契約以外にも、顧客の意向に照らして比較可能な同種の保険契約がある場合には、当該契約もある旨や、顧客の求めに応じて、その概要又は契約内容等を説明できる態勢を整備することが重要です。\nしたがって、顧客が特定の保険契約に関心を示したことのみをもって、意向把握や比較推奨販売に係る説明を省略し、他の保険契約の選択の機会を実質的に阻害し得る運用が行われた場合には、問題となり得ます。","theme":"比較可能な同種の保険契約","section":"監督指針","tags":["比較推奨","意向把握"]},{"no":366,"location":"Ⅱ－4－2－9(5)","comment":"代理店が同種目の商品をすべて顧客に提示した際、比較説明（保険業法施行規則第227条の2第3項第4号イ）を行うのは必須ではなく、全ての商品を説明は行うが、「比較」はし217ない、という販売手法もありうるという解釈でよいか。","pageStart":217,"pageEnd":218,"answer":"保険業法施行規則第227条の2第3項第4号イについては、保険募集人が、一の保険契約の契約内容について、他の保険契約の契約内容と比較した事項を提供しようとする場合に適用されるものです。\nただし、全ての商品を提示している場合であっても、掲載順、説明の強弱、申込導線等により、実質的に特定の保険契約を推奨していると評価される場合には、その実態に応じて比較推奨販売に係る対応が必要となります。","theme":"比較可能な同種の保険契約","section":"監督指針","tags":["比較推奨"]},{"no":367,"location":"Ⅱ－4－2－9(5)","comment":"乗合代理店において、顧客の意向に合致する保険契約もしくは顧客の意向に沿って選定される保険契約が1商品のみであり、比較説明を行わない場合であっても、推奨販売する上で当該商品の概要明示は必要との理解でよいか。","pageStart":218,"pageEnd":218,"answer":"貴見のとおりです。\n乗合代理店が、顧客の意向に沿って保険契約を選別した結果、提示・推奨する保険契約が1商品となる場合であっても、当該保険契約の概要及び提示・推奨する理由等を説明する必要があります。","theme":"比較可能な同種の保険契約","section":"監督指針","tags":["比較推奨"]},{"no":368,"location":"Ⅱ－4－2－9(5)","comment":"「B.二以上の比較可能な同種の保険契約の中から顧客の意向に沿って保険契約を選別し、提示・推奨する場合(推奨販売)の情報提供義務」の(a)のプロセスについて確認させていただきたい。\n(a)について、例えば、乗合代理店が取り扱う保険契約を「20契約(死亡保障、医療、年金等様々な種別をあわせて20契約)」としたとき、顧客の意向に沿って(例えば、顧客が医療を希望)、保険契約を「医療の10契約」に選別した場合、当該10契約については、以下の3パターンに区分した対応が考えられる。\n1.(a)に基づき、保険契約の概要及び顧客の求めに応じて契約内容並びに当該提示・推奨する理由や基準等を説明し、顧客自身が加入する1契約を選定する。\n2.(a)に基づき、顧客の意向に沿って保険契約を選別した上で、続けて(a)\n「特に」以下の対応に進む(顧客の意向により選別した医療10契約の中から、更に先進医療特約付き218を顧客が希望したため、3契約(X・Y・Z契約)に絞り、その中から、乗合代理店側が商品特性等により特定の保険契約(例えば、X契約)を推奨する。)。\n3.(a)に基づき、顧客の意向に沿って保険契約を選別した上で、更に先進医療特約付きを顧客が希望したため、3契約(X・Y・Z契約)に絞り、その全て(X・Y・Z契約)について、保険契約の概要及び顧客の求めに応じて契約内容並びに当該提示・推奨する理由や基準等を説明し、その上で、(a)\n「特に」以下の対応に進む。\n上記2のケースにおいて、「推奨する特定の保険契約(X契約)以外の保険契約もある旨(Y・Z契約※がある旨)」並びに「顧客の求めに応じて、推奨する特定の保険契約(X契約)以外の保険契約(Y・Z契約※)の概要又は契約内容を説明する旨」を説明する必要がある、との理解でよいか。\n上記3のケースにおいて、選別した全ての保険契約(X・Y・Z契約)についての説明を行っていることから、改めて「推奨する特定の保険契約(X契約)以外の保険契約もある旨(Y・Z契約※がある旨)」並びに「顧客の求めに応じて、推奨する特定の保険契約(X契約)以外の保険契約(Y・Z契約※)を説明する旨」を説明することは必ずしも求められない、との理解でよいか。\n※「推奨する特定の保険契約以外の保険契約」は、上記の例でいえば医療3契約(X・Y・Z契約)のうち、推奨がX契約だった場合、残りの2契約(Y・Z契約)、という理解でよいか。","pageStart":218,"pageEnd":219,"answer":"貴見のとおりです。\n乗合代理店が、「二以上の比較可能な同種の保険契約」の中から、顧客の意向に沿って複数の保険契約を選別し提案する場合には、保険業法施行規則第227条の2第3項第4号ロ及びⅡ－4－2－9(5)に基づき、提案する保険契約の概要及び提示・推奨する基準や理由等を説明するとともに、顧客の求めに応じて契約内容を説明する必要があります。\nその上で、顧客の意向に沿って選別した複数の保険契約の中から、乗合代理店が商品特性等により単一又は複数の保険契約を特に推奨する場合には、その基準や理由等を、合理的かつ一定の具体性をもって、分かりやすく説明する必要があります。\nこの場合、顧客の意向に沿ってX・Y・Z契約が選別され、X契約を特に推奨するのであれば、X契約以外にも、顧客の意向に沿って選別されたY契約・Z契約がある旨、及び顧客の求めに応じてそれらの概要又は契約内容を説明する旨を伝える必要があります。\nただし、既にX・Y・Z契約全てについて概要又は契約内容を説明している場合には、Y・Z契約がある旨や顧客の求めに応じて説明する旨を、改めて重ねて説明することまでは求められません。\nなお、「推奨する特定の保険契約以外の保険契約」とは、ご指摘の例では、顧客の意向に沿って比較・選別対象となったX・Y・Z契約のうち、特に推奨するX契約を除くY・Z契約を指すものと考えられます。","theme":"比較可能な同種の保険契約","section":"監督指針","tags":[]},{"no":369,"location":"Ⅱ－4－2－9(5)","comment":"監督指針Ⅱ－4－2－9(5)に関して、比較可能な同種の保219険契約の取扱いがない場合にまで、比較推奨販売を行うことを求めるものではない、との理解でよいか。","pageStart":219,"pageEnd":220,"answer":"貴見のとおりです。\n乗合代理店において、顧客の意向に照らして、「二以上の比較可能な同種の保険契約」が存在しない場合には、比較推奨販売を行うことまで求められるものではありません。","theme":"比較可能な同種の保険契約","section":"監督指針","tags":["比較推奨"]},{"no":370,"location":"Ⅱ－4－2－9(5)","comment":"乗合代理店は、監督指針Ⅱ－4－2－9(5)①B.による場合、当該代理店が取り扱う保険商品の中から顧客の意向に沿って保険契約を選別しなければならないと理解しているが、当該代理店が「取り扱う保険商品」とは、保険会社との契約上、当該代理店として取り扱うことが可能な全ての保険商品を意味するのか、それとも、当該代理店として取り扱う意思やスキルのない保険商品を除いた範囲の保険商品を意味するのか、確認させていただきたい。\nなお、仮に後者を意味するという場合、顧客に対して当該代理店として取り扱わない範囲を明示・説明する必要があるという理解でよいか。","pageStart":220,"pageEnd":220,"answer":"保険業法施行規則第227条の2第3項第4号ロにおける「取り扱う保険契約」とは、所属保険会社等との代理店委託契約又はこれに基づく覚書等により、当該代理店が取り扱うこととされている保険契約を指すものと考えます。\nしたがって、乗合代理店のみの判断により、代理店の意思、販売実績、商品知識、又はスキルの有無のみを理由として、当該保険契約を比較推奨販売の対象から除外することは適切とは言えません。","theme":"比較可能な同種の保険契約","section":"監督指針","tags":["比較推奨"]},{"no":371,"location":"－","comment":"顧客と最初に接点を持つA代理店(X・Y保険会社の乗合代理店)とA代理店から顧客の連携を受けるB代理店(X・Y・Z保険会社の乗合代理店)が共同で保険募集を行う場合に、まず、A代理店が顧客の意向に沿ってX・Y保険会社の範囲で保険契約の選別を行った上で、B代理店に対して当該顧客の意向を連携し、その後にB代理店が権限明示を行った上で当該顧客に対して保険募集を行うことがある。\nその際、B代理店としては、A代理店が先行して行った保険募集を引き継ぐため、基本的にはX・Y保険会社の範囲で比較推奨販売を行うことになると理解している。もっとも、権限明示によって、B代理店の乗合範囲を認識した顧客からX・Y220保険会社の商品案内に加えてZ保険会社の商品案内も受けたい旨の申し出を受けた場合には、B代理店としては、A代理店との共同募集としてX・Y保険会社の商品案内を行うとともに、単独募集としてZ保険会社の商品案内を行うことが求められるという理解でよいか。\nなお、前提として、当該顧客の意向によれば、B代理店がX・Y・Z保険会社の比較可能な同種の保険契約を取り扱っていることとする。","pageStart":220,"pageEnd":221,"answer":"両代理店の役割分担が必ずしも明確ではありませんが、共同募集における比較推奨販売の対象範囲は、顧客の意向形成への関与の度合い、顧客への説明・提案の実態等を踏まえて個別具体的に判断されます。\nまた、保険募集人が、保険会社の管理下において、共同募集を行う場合においても、顧客の意向は募集過程において変わり得ることを踏まえつつ、共同かつ一連の保険募集の中で適切に意向把握・確認が行われる形で、共同募集が行われる必要があります。\nしたがって、例えば、A乗合代理店が先行して顧客対応を行ったことのみで当然に比較推奨販売の対象となる保険契約の範囲が決まるものではなく、意向形成への関与の度合いや顧客への説明・提案の実態に照らし判断される必要があり、B乗合代理店が実質的にこれらを担う場合には、B乗合代理店は顧客の意向を適切に把握し、自代理店が取り扱う「二以上の比較可能な同種の保険契約」の中から、顧客の意向に沿った選別・提案を適切に行う必要があります。\nなお、各乗合代理店が実質的に担う保険募集の実態とは無関係に、形式的な役割分担等を定め、比較推奨販売に係る規定の適用関係を判断する場合には、顧客の適切な商品選択の機会を阻害し得るものとして問題となり得ます。\nまた、A乗合代理店及びB乗合代理店のいずれも、保険募集を行う場合には、保険業法第294条第3項に基づく権限明示等の義務を適切に履行する必要があります。","theme":"比較可能な同種の保険契約","section":"監督指針","tags":["比較推奨","意向把握","共同募集"]},{"no":372,"location":"－","comment":"乗合代理店において、特定の保険会社の保険契約の取扱数が非常に多い場合がある。\nそのような場合に、経営効率の観点から、例えば、特定の保険会社のみの委託を受ける専属代理店と、それ以外の保険会社の委託を受ける乗合代理店に分社化するという経営判断を行うことは、今回の比較推奨販売規制の改正によって制約されないという理解でよいか。\n221","pageStart":221,"pageEnd":221,"answer":"ご指摘のような分社化等の経営判断自体を、今回の比較推奨販売に係る監督指針改正により、直ちに制約するものではありません。\n一方で、分社化後においても、各保険募集人は、保険業法及び監督指針上求められる権限明示、意向把握・確認、情報提供、比較推奨販売に係る説明等の義務を適切に履行する必要があります。\nしたがって、分社化後の募集態勢、顧客への説明、役割分担等について、顧客に誤認を与えないよう適切に整備・運用することが重要です。\nなお、専属代理店と乗合代理店の分社化後における保険募集の実態が、実質的に顧客の適切な商品選択の機会を阻害する業務運営が行われるものと評価され得る場合には、比較推奨販売規制を潜脱するものとして問題となり得ます。","theme":"比較可能な同種の保険契約","section":"監督指針","tags":["比較推奨","意向把握"]},{"no":373,"location":"Ⅱ－4－2－9(5)","comment":"例えば、A社が幹事保険会社、B社・C社が非幹事保険会社である共同保険契約を締結している企業から、「継続時には補償内容等に関して見直した上で提案いただきたい。」との要請を乗合代理店が受けたとする。\nこの場合、当該企業の意向は、「様々な選択肢の中から自社に最適な補償内容等に見直して提案して欲しい。」と示されているものと考えられる。\nこのようなケースにおいて、乗合代理店が当該企業のために補償内容等の見直しを検討する場合、A～C社の保険契約を含めた複数の「比較可能な同種の保険契約」が存在するにもかかわらず、現在、A社が幹事会社である共同保険契約を締結していることを理由として、A社以外の(非幹事会社であるB社・C社等の)保険契約を除外して、A社の保険契約のみを企業に提案すること(A社が共同保険の幹事保険会社となる前提で提案する場合を含む)は、監督指針の比較推奨販売の規定に照らして認められないとの理解でよいか。","pageStart":222,"pageEnd":222,"answer":"貴見のとおりです。\n乗合代理店においては、「二以上の比較可能な同種の保険契約」\nの中から、顧客の意向に沿って保険契約を選別し、提示・推奨する必要があります。\nしたがって、顧客が補償内容等の見直しを求めているにもかかわらず、現在の共同保険契約において、A社が幹事保険会社であることのみを理由として、B社・C社等を選別対象から除外し、A社の保険契約のみを提示・推奨することは、保険業法施行規則第227条の2第3項第4号ロの趣旨に照らし、適切とはいえません。","theme":"比較可能な同種の保険契約","section":"監督指針","tags":["比較推奨"]},{"no":374,"location":"Ⅱ－4－2－9(5)","comment":"監督指針Ⅱ－4－2－9(5)の「乗合代理店」とは、生保・損保・少短の内訳を問わず、二以上の所属保険会社等を有する保険募
