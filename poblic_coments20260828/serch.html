必要があるという理解でよ338いか。あるいは新規契約と同様に意向把握プロセスを踏む必要があるのか確認したい。","pageStart":338,"pageEnd":339,"answer":"既契約が満期を迎える場合において、顧客が「現在と同じ会社の商品でよい」と述べた場合であっても、商品改定や重要事項の変更等により契約内容に実質的な変更が生じる場合には、その変更内容及び程度に応じて、必要な情報提供及び意向把握・確認を適切に行う必要があります。\n例えば、保険金額、保険期間、補償範囲、特約、免責、保険料水準、主な不利益事項等に実質的な変更がある場合には、顧客が当該変更を理解した上で契約継続の要否を判断できるよう、分かりやすく説明するとともに、当該変更内容を踏まえた顧客の意向を適切に把握する必要があります。\nしたがって、常に新規契約と同一の意向把握プロセスを一律に求めるものではありません。既契約の内容、変更の有無・程度、顧客の具体的な意向等を踏まえ、変更内容に応じた適切な方法により情報提供及び意向把握・確認を行うことが重要です。","theme":"更改・継続契約","section":"監督指針","tags":["意向把握","更改・継続"]},{"no":579,"location":"Ⅱ－4－2－9(5)","comment":"監督指針Ⅱ－4－2－9－(5)においては、複数の保険契約を比較し、特定の保険契約を推奨する場合の説明の在り方が示されているが、ここでいう「比較推奨販売」には、既存契約の更新(更改)時において、同一の保険契約又は複数の保険契約を比較した上で契約継続を勧奨する場合も含まれるのかについて、ご教示いただきたい。\n特に、契約更新時において、以下の2点について、「比較推奨販売」として本指針の対象となるのかご教示いただきたい。\n・従前の契約内容と更新後の契約内容を比較した上で継続を勧奨する場合・同一保険会社内の保険契約や、他社の保険契約との比較を行った上で更新又は切替を勧奨する場合また、更新時の比較が形式的なものにとどまる場合や、339顧客から特段の比較要請がない場合においても、本監督指針の趣旨を踏まえた説明が求められるのかについて、併せてご教示いただきたい。","pageStart":339,"pageEnd":340,"answer":"既契約の満期到来に伴う保険募集であることのみをもって、当然に比較推奨販売に係る規定の適用対象外となるものではありません。\n乗合代理店が保険募集を行う場合において、保険契約の契約内容を他の保険契約と比較して説明する場合には、保険業法施行規則第227条の2第3項第4号イ(比較説明)を踏まえ、顧客が正確に判断できるよう適切に説明する必要があります。\nしたがって、提案する満期後の保険契約の内容と既契約の内容とを比較して説明する場合、又は同一保険会社の保険契約若しくは他の保険会社の保険契約と比較して更新・切替を勧奨する場合には、更新時であったとしても同号イの適用対象となります。\nまた、更新時に、「二以上の比較可能な同種の保険契約」の中から、顧客の意向に沿って単一又は複数の保険契約を選別・提案する場合には、同号ロ(推奨販売)に基づき、当該保険契約の概要及び提案する基準や理由等を説明する必要があります。\nなお、同号イ又はロの規定は、更新時の比較が形式的なものである場合や、顧客から特段の比較要請がない場合であっても、比較説明又は選別・提案が行われるときには適用されます。","theme":"更改・継続契約","section":"監督指針","tags":["比較推奨","更改・継続"]},{"no":580,"location":"Ⅱ－4－2－9(5)","comment":"継続契約については、乗合代理店として、あらかじめ所属保険会社等の商号などを明らかにしたうえで、「昨年契約した保険会社で更改することを希望しているか」を顧客に確認し、前契約の保険会社での継続の意向が確認できたようなケースにおいては、顧客の保険会社選択の意思が明確なケースとして、比較推奨販売の対象外と理解してよいか。","pageStart":340,"pageEnd":340,"answer":"既契約の満期到来時においても、保険募集人は、顧客が適切な理解に基づき、自主的に既契約の継続の要否や内容を判断できるよう、顧客のリスク特性や意向が変化している可能性にも留意しつつ、既契約の内容・特性等に応じて、顧客の意向を適切に把握し、当該意向に沿った提案・説明を行う必要があります。\nまた、既契約の満期が到来する場合において、顧客から具体的な意向が示されていない中、乗合代理店が行う案内(保険募集)が既契約と同条件又は同等の補償条件であることのみをもって、当然に比較推奨販売に係る規定の適用対象外となるものではありません。保険業法施行規則第227条の2第3項第4号ロ(推奨販売)に係る対応の要否は、「二以上の比較可能な同種の保険契約」が存在するか、保険契約を選別・提案するものであるかどうかによって個別具体的に判断される必要があります。\nその上で、短期の損害保険契約については、その特性を踏まえると、当該契約の満期が到来することに伴い、乗合代理店において、既契約と同条件又は補償内容がほぼ変わらないプランの案内(保険募集)が行われたとしても、直ちに保険契約者等の保護に欠けるものとは言えず、一概に否定されるものではないと考えます。ただし、その場合であっても、他の保険契約の提案を望む顧客も存在すると考えられることから、乗合代理店として意向把握・確認義務を適切に履行するための対応として、顧客の希望に応じて他の保険契約を提案できることを明示すること、及び顧客のリスク状況や意向を適切に把握できるよう工夫して案内(保険募集)することが求められると考えます。\nこの場合において、保険募集人による選別・提案を実質的に伴うことなく、顧客の主体的な判断のみにより、既契約と同内容又はこれと大きく異ならない内容の保険契約を希望する旨が表明され、一の保険契約が選択された場合には、直ちに同号ロに係る対応が必要となるものではありません。\nただし、保険募集の過程において、他の保険契約との比較説明を行う場合には同号イを、「二以上の比較可能な同種の保険契約」\nの中から保険契約を選別・提案する場合には同号ロを踏まえた対応が必要となります。\nまた、顧客が表明した意向や保険募集人が案内・説明した内容等については、事後的に確認・検証できるよう、適切に記録・保存することが重要です。","theme":"更改・継続契約","section":"監督指針","tags":["比較推奨","意向把握","証跡・記録","更改・継続"]},{"no":581,"location":"Ⅱ－4－2－9(5)","comment":"損害保険における比較推奨販売について、更改契約は今まで通り契約意思の確認ができれば、比較推奨販売の対象外と理解してよいか。","pageStart":340,"pageEnd":340,"answer":"既契約の満期到来時においても、保険募集人は、顧客が適切な理解に基づき、自主的に既契約の継続の要否や内容を判断できるよう、顧客のリスク特性や意向が変化している可能性にも留意しつつ、既契約の内容・特性等に応じて、顧客の意向を適切に把握し、当該意向に沿った提案・説明を行う必要があります。\nまた、既契約の満期が到来する場合において、顧客から具体的な意向が示されていない中、乗合代理店が行う案内(保険募集)が既契約と同条件又は同等の補償条件であることのみをもって、当然に比較推奨販売に係る規定の適用対象外となるものではありません。保険業法施行規則第227条の2第3項第4号ロ(推奨販売)に係る対応の要否は、「二以上の比較可能な同種の保険契約」が存在するか、保険契約を選別・提案するものであるかどうかによって個別具体的に判断される必要があります。\nその上で、短期の損害保険契約については、その特性を踏まえると、当該契約の満期が到来することに伴い、乗合代理店において、既契約と同条件又は補償内容がほぼ変わらないプランの案内(保険募集)が行われたとしても、直ちに保険契約者等の保護に欠けるものとは言えず、一概に否定されるものではないと考えます。ただし、その場合であっても、他の保険契約の提案を望む顧客も存在すると考えられることから、乗合代理店として意向把握・確認義務を適切に履行するための対応として、顧客の希望に応じて他の保険契約を提案できることを明示すること、及び顧客のリスク状況や意向を適切に把握できるよう工夫して案内(保険募集)することが求められると考えます。\nこの場合において、保険募集人による選別・提案を実質的に伴うことなく、顧客の主体的な判断のみにより、既契約と同内容又はこれと大きく異ならない内容の保険契約を希望する旨が表明され、一の保険契約が選択された場合には、直ちに同号ロに係る対応が必要となるものではありません。\nただし、保険募集の過程において、他の保険契約との比較説明を行う場合には同号イを、「二以上の比較可能な同種の保険契約」\nの中から保険契約を選別・提案する場合には同号ロを踏まえた対応が必要となります。\nまた、顧客が表明した意向や保険募集人が案内・説明した内容等については、事後的に確認・検証できるよう、適切に記録・保存することが重要です。","theme":"更改・継 :590,"location":"Ⅱ－4－2－9(5)","comment":"監督指針Ⅱ－4－2について、既存契約の更新/更改や追加契約の提案の際の情報提供義務についてはどの程度詳細な説明が必要か伺いたい。\n既存契約を持つ顧客に対しては、既存契約の更新/更改、もしくは既存契約と同様の引受保険会社の商品を提案することが実務上の通例であったと考えるが、今後の監督指針改正後の情報提供義務においても同様に、既存契約を基準に推奨を行うことは問題ないか。既存契約を持たない顧客への新契約の提案と同様に、既存契約とは異なる他の保険会社の同等のプランと比較したうえで推奨を行うことが求められるのか。\n後者の場合、各契約の更新/更改の都度、同様の業務負荷が全顧客に発生するため、実務上は困難であると考える。","pageStart":342,"pageEnd":342,"answer":"既契約の満期到来時においても、保険募集人は、顧客が適切な理解に基づき、自主的に既契約の継続の要否や内容を判断できるよう、顧客のリスク特性や意向が変化している可能性にも留意しつつ、既契約の内容・特性等に応じて、顧客の意向を適切に把握し、当該意向に沿った提案・説明を行う必要があります。\nまた、既契約の満期が到来する場合において、顧客から具体的な意向が示されていない中、乗合代理店が行う案内(保険募集)が既契約と同条件又は同等の補償条件であることのみをもって、当然に比較推奨販売に係る規定の適用対象外となるものではありません。保険業法施行規則第227条の2第3項第4号ロ(推奨販売)に係る対応の要否は、「二以上の比較可能な同種の保険契約」が存在するか、保険契約を選別・提案するものであるかどうかによって個別具体的に判断される必要があります。\nその上で、短期の損害保険契約については、その特性を踏まえると、当該契約の満期が到来することに伴い、乗合代理店において、既契約と同条件又は補償内容がほぼ変わらないプランの案内(保険募集)が行われたとしても、直ちに保険契約者等の保護に欠けるものとは言えず、一概に否定されるものではないと考えます。ただし、その場合であっても、他の保険契約の提案を望む顧客も存在すると考えられることから、乗合代理店として意向把握・確認義務を適切に履行するための対応として、顧客の希望に応じて他の保険契約を提案できることを明示すること、及び顧客のリスク状況や意向を適切に把握できるよう工夫して案内(保険募集)することが求められると考えます。\nこの場合において、保険募集人による選別・提案を実質的に伴うことなく、顧客の主体的な判断のみにより、既契約と同内容又はこれと大きく異ならない内容の保険契約を希望する旨が表明され、一の保険契約が選択された場合には、直ちに同号ロに係る対応が必要となるものではありません。\nただし、保険募集の過程において、他の保険契約との比較説明を行う場合には同号イを、「二以上の比較可能な同種の保険契約」\nの中から保険契約を選別・提案する場合には同号ロを踏まえた対応が必要となります。\nまた、顧客が表明した意向や保険募集人が案内・説明した内容等については、事後的に確認・検証できるよう、適切に記録・保存することが重要です。","theme":"更改・継続契約","section":"監督指針","tags":["比較推奨","意向把握","証跡・記録","更改・継続"]},{"no":591,"location":"Ⅱ－4－2－9(5)","comment":"満期更新時においては、既に商品選択が行われており、同一の保険会社を選択する意向が高いと推定されることから、同じ保険会社の保険契約を単独で推奨することで問題ないか。\nまた、満期更新時においては、商品選択の余地がなく保険契約を提示・推奨することになると考えられることから、「顧客の求めに応じて」行う「当該提示・推奨する基準や理由等」については、「商品選択の余地がない」という理由を説明することで問題ないか。\nなお、別の保険会社の保険契約の提示を求める等の顧客意向が示された場合は、当然にそれら保険契約の概要又は342保険契約の内容の説明をすることを前提とする。","pageStart":342,"pageEnd":343,"answer":"既契約の満期到来時においても、保険募集人は、顧客が適切な理解に基づき、自主的に既契約の継続の要否や内容を判断できるよう、顧客のリスク特性や意向が変化している可能性にも留意しつつ、既契約の内容・特性等に応じて、顧客の意向を適切に把握し、当該意向に沿った提案・説明を行う必要があります。\nまた、既契約の満期が到来する場合において、顧客から具体的な意向が示されていない まえた対応が必要となります。\nまた、顧客が表明した意向や保険募集人が案内・説明した内容等については、事後的に確認・検証できるよう、適切に記録・保存することが重要です。","theme":"更改・継続契約","section":"監督指針","tags":["比較推奨","意向把握","証跡・記録","更改・継続"]},{"no":593,"location":"－","comment":"既存契約の更新手続きの際、顧客に既存契約に不満がない場合は、比較推奨販売は不要と考えてよいか。その場合、顧客に既存契約に不満がないこと、契約内容を理解していることの確認は乗合代理店側で記録にとどめることで足りると考えてよいか。","pageStart":343,"pageEnd":343,"answer":"既契約の満期到来時においても、保険募集人は、顧客が適切な理解に基づき、自主的に既契約の継続の要否や内容を判断できるよう、顧客のリスク特性や意向が変化している可能性にも留意しつつ、既契約の内容・特性等に応じて、顧客の意向を適切に把握し、当該意向に沿った提案・説明を行う必要があります。\nまた、既契約の満期が到来する場合において、顧客から具体的な意向が示されていない中、乗合代理店が行う案内(保険募集)が既契約と同条件又は同等の補償条件であることのみをもって、当然に比較推奨販売に係る規定の適用対象外となるものではありません。保険業法施行規則第227条の2第3項第4号ロ(推奨販売)に係る対応の要否は、「二以上の比較可能な同種の保険契約」が存在するか、保険契約を選別・提案するものであるかどうかによって個別具体的に判断される必要があります。\nその上で、短期の損害保険契約については、その特性を踏まえると、当該契約の満期が到来することに伴い、乗合代理店において、既契約と同条件又は補償内容がほぼ変わらないプランの案内(保険募集)が行われたとしても、直ちに保険契約者等の保護に欠けるものとは言えず、一概に否定されるものではないと考えます。ただし、その場合であっても、他の保険契約の提案を望む顧客も存在すると考えられることから、乗合代理店として意向把握・確認義務を適切に履行するための対応として、顧客の希望に応じて他の保険契約を提案できることを明示すること、及び顧客のリスク状況や意向を適切に把握できるよう工夫して案内(保険募集)することが求められると考えます。\nこの場合において、保険募集人による選別・提案を実質的に伴うことなく、顧客の主体的な判断のみにより、既契約と同内容又はこれと大きく異ならない内容の保険契約を希望する旨が表明され、一の保険契約が選択された場合には、直ちに同号ロに係る対応が必要となるものではありません。\nただし、保険募集の過程において、他の保険契約との比較説明を行う場合には同号イを、「二以上の比較可能な同種の保険契約」\nの中から保険契約を選別・提案する場合には同号ロを踏まえた対応が必要となります。\nまた、顧客が表明した意向や保険募集人が案内・説明した内容等については、事後的に確認・検証できるよう、適切に記録・保存することが重要です。","theme":"更改・継続契約","section":"監督指針","tags":["比較推奨","意向把握","証跡・記録","更改・継続"]},{"no":594,"location":"Ⅱ－4－2－9(5)","comment":"契約更新にあたり顧客が同一の保険会社において同一条件での更新を希望する場合や、一時的に自動車を手放していた顧客が再度自動車を取得し、過去に契約していた保険会社での新規契約を希望する場合には、顧客の意向が明確に示されているものと解釈し、比較推奨販売の対象外と考えてよいか。","pageStart":343,"pageEnd":343,"answer":"既契約の満期到来時においても、保険募集人は、顧客が適切な理解に基づき、自主的に既契約の継続の要否や内容を判断できるよう、顧客のリスク特性や意向が変化している可能性にも留意しつつ、既契約の内容・特性等に応じて、顧客の意向を適切に把握し、当該意向に沿った提案・説明を行う必要があります。\nまた、既契約の満期が到来する場合において、顧客から具体的な意向が示されていない中、乗合代理店が行う案内(保険募集)が既契約と同条件又は同等の補償条件であることのみをもって、当然に比較推奨販売に係る規定の適用対象外となるものではありません。保険業法施行規則第227条の2第3項第4号ロ(推奨販売)に係る対応の要否は、「二以上の比較可能な同種の保険契約」が存在するか、保険契約を選別・提案するものであるかどうかによって個別具体的に判断される必要があります。\nその上で、短期の損害保険契約については、その特性を踏まえると、当該契約の満期が到来することに伴い、乗合代理店において、既契約と同条件又は補償内容がほぼ変わらないプランの案内(保険募集)が行われたとしても、直ちに保険契約者等の保護に欠けるものとは言えず、一概に否定されるものではないと考えます。ただし、その場合であっても、他の保険契約の提案を望む顧客も存在すると考えられることから、乗合代理店として意向把握・確認義務を適切に履行するための対応として、顧客の希望に応じて他の保険契約を提案できることを明示すること、及び顧客のリスク状況や意向を適切に把握できるよう工夫して案内(保険募集)することが求められると考えます。\nこの場合において、保険募集人による選別・提案を実質的に伴うことなく、顧客の主体的な判断のみにより、既契約と同内容又はこれと大きく異ならない内容の保険契約を希望する旨が表明され、一の保険契約が選択された場合には、直ちに同号ロに係る対応が必要となるものではありません。\nただし、保険募集の過程において、他の保険契約との比較説明を行う場合には同号イを、「二以上の比較可能な同種の保険契約」\nの中から保険契約を選別・提案する場合には同号ロを踏まえた対応が必要となります。\nまた、顧客が表明した意向や保険募集人が案内・説明した内容等については、事後的に確認・検証できるよう、適切に記録・保存することが重要です。","theme":"更改・継続契約","section":"監督指針","tags":["比較推奨","意向把握","証跡・記録","更改・継続"]},{"no":595,"location":"Ⅱ－4－2－9(5)","comment":"今回の改正が行われた後においても、契約の更新について、監督指針Ⅱ－4－2－2(3)③で示されている「意向把握・確認の適用除外」に変更はないとの認識でよいか。","pageStart":343,"pageEnd":343,"answer":"Ⅱ－4－2－2(3)③については、今般の改正により変更するものではありません。","theme":"更改・継続契約","section":"監督指針","tags":["意向把握","更改・継続"]},{"no":596,"location":"Ⅱ－4－2－9(5)","comment":"継続契約に関して、前回の募集時以降に新たな所属保険会社が追加された場合において、権限明示の中で委託保険会社が追加されたことを説明した上で、前契約の保険会社343での継続の意向が確認できたようなケースにおいては、顧客の意思が明確なケースとして比較推奨販売の対象外と考えてよいか。","pageStart":343,"pageEnd":344,"answer":"既契約の満期が到来することに伴う保険募集を行うときにおいて、新たな所属保険会社等が追加されている場合には、保険業法第294条第3項に基づく権限明示を適切に行い、所属保険会社等が追加されたことについても顧客が適切に理解した上で保険募集が行われる必要があります。\nこの際、新たな所属保険会社等が追加された場合には、ご指摘のように、権限明示を適切に行うとともに、所属保険会社等が追加されたことを説明した上で、意向把握を適切に行うことが、顧客の適切な商品選択の機会を確保することに資する取組であると考えられます。\nその上で、保険募集人による選別・提案が実質的に伴うことなく、顧客の主体的な判断のみにより、既契約の継続を希望する旨が表明され、一の保険契約が選択された場合には、直ちに同法施行規則第227条の2第3項第4号ロ(推奨販売)に係る対応が必要となるものではありません。\nただし、保険募集の過程において、他の保険契約との比較説明を行う場合には同号イを、「二以上の比較可能な同種の保険契約」\nの中から保険契約を選別・提案する場合には同号ロを踏まえた対応が必要となります。","theme":"更改・継続契約","section":"監督指針","tags":["比較推奨","意向把握","更改・継続"]},{"no":597,"location":"Ⅱ－4－2－9(5)","comment":"保険代理店が廃業し他の保険代理店に保険契約が継承され、顧客が更改時に保険会社の変更を希望せず、継続契約を締結する際に、保険代理店のみが変更となる場合、既に締結している保険契約の実質的な変更に当たらないと考えられることから、当該保険会社による更改を希望することが明確な場合においては、比較推奨販売を求められるものではないとの理解でよいか。","pageStart":344,"pageEnd":344,"answer":"既契約の取扱代理店が変更されたとしても、そのことのみをもって、既契約の内容に実質的な変更があったことにはなりません。\nしたがって、保険募集人による選別・提案が実質的に伴うことなく、顧客の主体的な判断のみにより、既契約と同内容又はこれと大きく異ならない内容の保険契約を希望する旨が表明され、一の保険契約が選択された場合には、直ちに保険業法施行規則第227条の2第3項第4号ロ(推奨販売)に係る対応が必要となるものではありません。\nなお、承継先の代理店が乗合代理店である場合には、保険募集時において、同法第294条第3項に基づく権限明示を適切に行うとともに、顧客が既契約の継続の要否や内容を適切に判断できるよう、必要な情報提供及び意向確認を行う必要があります。\nまた、保険募集の過程で、他の保険契約との比較説明を行う場合には同号イを、「二以上の比較可能な同種の保険契約」の中から保険契約を選別・提案する場合には同号ロを踏まえた対応が必要です。","theme":"更改・継続契約","section":"監督指針","tags":["比較推奨","意向把握","更改・継続"]},{"no":598,"location":"Ⅱ－4－2－9(5)","comment":"乗合代理店が別の代理店において取り扱う短期の損害保険契約(以下「既存契約」という。)が満期を迎えた既存344契約の更改を扱うケースにおいて、保険契約者が既存契約の更改(既存契約と同じ引受保険会社での更改)を希望する場合は、比較推奨販売の対象外になるという理解でよいか。","pageStart":344,"pageEnd":345,"answer":"既契約の取扱代理店が変更されたとしても、そのことのみをもって、既契約の内容に実質的な変更があったことにはなりません。\nしたがって、保険募集人による選別・提案が実質的に伴うことなく、顧客の主体的な判断のみにより、既契約と同内容又はこれと大きく異ならない内容の保険契約を希望する旨が表明され、一の保険契約が選択された場合には、直ちに保険業法施行規則第227条の2第3項第4号ロ(推奨販売)に係る対応が必要となるものではありません。\nなお、承継先の代理店が乗合代理店である場合には、保険募集時において、同法第294条第3項に基づく権限明示を適切に行うとともに、顧客が既契約の継続の要否や内容を適切に判断できるよう、必要な情報提供及び意向確認を行う必要があります。\nまた、保険募集の過程で、他の保険契約との比較説明を行う場合には同号イを、「二以上の比較可能な同種の保険契約」の中から保険契約を選別・提案する場合には同号ロを踏まえた対応が必要です。","theme":"更改・継続契約","section":"監督指針","tags":["比較推奨","意向把握","更改・継続"]},{"no":599,"location":"Ⅱ－4－2－9(5)","comment":"既契約の特約追加や乗換え提案においては、既に商品選択が行われており、同一の保険会社を選択する意向が高いと推定されることから、同じ保険会社を単独で推奨することで問題ないか。\nまた、既契約の特約追加や乗り換え提案においては、商品選択の余地がなく保険契約を提示・推奨することになると考えられることから、「顧客の求めに応じて」行う「当該提示・推奨する基準や理由等」については、「商品選択の余地がない」という理由を説明することで問題ないか。\nなお、別の保険会社の保険契約の提示を求める等の顧客意向が示された場合は、当然にそれら保険契約の概要又は契約内容の説明をすることを前提とする。\n345","pageStart":345,"pageEnd":346,"answer":"既契約者に対する特約追加や乗換え提案であっても、既契約があることのみをもって、当然に「選択の余地がない」と整理して同一の保険会社の保険契約を提案することは適切ではありません。\n顧客の意向やリスク状況は変化し得るため、保険募集人は、既契約の内容・特性を踏まえつつ、顧客の意向を適切に確認し、保険業法施行規則第227条の2第3項第4号ロ(推奨販売)に係る対応の要否を個別具体的に判断する必要があります。\n特に、乗合代理店が、「二以上の比較可能な同種の保険契約」\nの中から同一保険会社の保険契約を選別・提案する場合には、単に「既契約と同じ保険会社であること」や「選択の余地がないこと」を説明するだけでは足りません。顧客のリスク状況や意向、既契約の内容、追加する特約又は乗換え後の保障(補償)内容、保険料水準、主な留意点等を踏まえ、合理的かつ一定の具体性をもって提案する基準や理由等を説明する必要があります。\nまた、顧客が他の保険会社の保険契約を希望する場合や、他の保険契約との比較説明を行う場合には、その意向又は説明内容に応じて、同号イ又はロを踏まえた対応が必要です。","theme":"更改・継続契約","section":"監督指針","tags":["比較推奨"]},{"no":600,"location":"Ⅱ－4－2－9(5)","comment":"更改契約に関して、以下の3点について伺いたい。\n(1)\n「「平成26年改正保険業法(2年以内施行)に係る政府令・監督指針案」に対するパブリックコメント結果等について」における「コメントの概要及びコメントに対する金融庁の考え方」No.534では「顧客が既契約の更改を希望している場合には、比較推奨を行う必要はありません」と記載されているが、この考え方は今回の改正を経ても変わらないという認識で相違ないか。\n(2)顧客が既契約の更改を希望しているかどうかの判断は、何によってなされるべきか。\n(3)更改契約のタイミングにおいて、既契約の更改希望の有無を確認し、確認した結果を証跡として残す必要はあるか。","pageStart":346,"pageEnd":346,"answer":"保険募集人は、顧客が適切な理解に基づき、自主的に満期時における既契約の継続の要否や内容を判断できるよう、意向把握や必要に応じた説明を行う必要があります。その際には、顧客のリスク特性や意向が変化している可能性にも留意しつつ、既契約の内容・特性等に応じて、顧客の意向を適切に把握し、当該意向に沿った提案・説明を行う必要があります。\nその上で、保険募集人による選別・提案が実質的に伴うことなく、顧客の主体的な判断のみにより、既契約と同内容又はこれと大きく異ならない内容の保険契約を希望する旨が表明され、一の保険契約が選択された場合には、直ちに保険業法施行規則第227条の2第3項第4号ロ(推奨販売)に係る対応が必要となるものではありません。\n上記の考え方は、「「平成26年改正保険業法(2年以内施行)に係る政府令・監督指針案」に対するパブリックコメント結果等について」における「コメントの概要及びコメントに対する金融庁の考え方」No.89及びNo.534の考え方を変更するものではありません。\nなお、当該判断が顧客の主体的判断に基づくものであるか、又はその過程において保険募集人による恣意的な誘導が行われていないかについては、個別具体的に判断される必要があります。\nまた、顧客の判断過程において、保険募集人が営業上の理由等により恣意的に誘導する行為は適切とはいえず、厳に慎む必要があると考えます。\nこのほか、保険募集の実務や保険契約の性質等を踏まえつつ、保険募集人によって適切な意向把握や情報提供が行われたことの事後確認や検証が可能となるよう、顧客への案内又は説明内容や、顧客が表明した意向を適切に証跡等として記録・保存することが必要と考えます。","theme":"更改・継続契約","section":"監督指針","tags":["比較推奨","意向把握","証跡・記録","更改・継続"]},{"no":601,"location":"－","comment":"「「平成26年改正保険業法(2年以内施行)に係る政府令・監督指針案」に対するパブリックコメント結果等について」における「コメントの概要及びコメントに対する金融庁の考え方」No.534の考え方は、権限明示等をきちんと行う前提で引き続き踏襲されるとの理解で良いか。","pageStart":346,"pageEnd":346,"answer":"保険募集人は、顧客が適切な理解に基づき、自主的に満期時における既契約の継続の要否や内容を判断できるよう、意向把握や必要に応じた説明を行う必要があります。その際には、顧客のリスク特性や意向が変化している可能性にも留意しつつ、既契約の内容・特性等に応じて、顧客の意向を適切に把握し、当該意向に沿った提案・説明を行う必要があります。\nその上で、保険募集人による選別・提案が実質的に伴うことなく、顧客の主体的な判断のみにより、既契約と同内容又はこれと大きく異ならない内容の保険契約を希望する旨が表明され、一の保険契約が選択された場合には、直ちに保険業法施行規則第227条の2第3項第4号ロ(推奨販売)に係る対応が必要となるものではありません。\n上記の考え方は、「「平成26年改正保険業法(2年以内施行)に係る政府令・監督指針案」に対するパブリックコメント結果等について」における「コメントの概要及びコメントに対する金融庁の考え方」No.89及びNo.534の考え方を変更するものではありません。\nなお、当該判断が顧客の主体的判断に基づくものであるか、又はその過程において保険募集人による恣意的な誘導が行われていないかについては、個別具体的に判断される必要があります。\nまた、顧客の判断過程において、保険募集人が営業上の理由等により恣意的に誘導する行為は適切とはいえず、厳に慎む必要があると考えます。\nこのほか、保険募集の実務や保険契約の性質等を踏まえつつ、保険募集人によって適切な意向把握や情報提供が行われたことの事後確認や検証が可能となるよう、顧客への案内又は説明内容や、顧客が表明した意向を適切に証跡等として記録・保存することが必要と考えます。","theme":"更改・継続契約","section":"監督指針","tags":["意向把握","証跡・記録"]},{"no":602,"location":"－","comment":"継続契約の取扱いについては、「「平成26年改正保険業法(2年以内施行)に係る政府令・監督指針案」に対するパブリックコメント結果等について」における「コメントの概要及びコメントに対する金融庁の考え方」での回答の通り、顧客が既契約の更改を希望する場合は、保険契約(保険会社)を選別するための意向把握も不要という理解で変更346がないか確認したい。","pageStart":346,"pageEnd":347,"answer":"保険募集人は、顧客が適切な理解に基づき、自主的に満期時における既契約の継続の要否や内容を判断できるよう、意向把握や必要に応じた説明を行う必要があります。その際には、顧客のリスク特性や意向が変化している可能性にも留意しつつ、既契約の内容・特性等に応じて、顧客の意向を適切に把握し、当該意向に沿った提案・説明を行う必要があります。\nその上で、保険募集人による選別・提案が実質的に伴うことなく、顧客の主体的な判断のみにより、既契約と同内容又はこれと大きく異ならない内容の保険契約を希望する旨が表明され、一の保険契約が選択された場合には、直ちに保険業法施行規則第227条の2第3項第4号ロ(推奨販売)に係る対応が必要となるものではありません。\n上記の考え方は、「「平成26年改正保険業法(2年以内施行)に係る政府令・監督指針案」に対するパブリックコメント結果等について」における「コメントの概要及びコメントに対する金融庁の考え方」No.89及びNo.534の考え方を変更するものではありません。\nなお、当該判断が顧客の主体的判断に基づくものであるか、又はその過程において保険募集人による恣意的な誘導が行われていないかについては、個別具体的に判断される必要があります。\nまた、顧客の判断過程において、保険募集人が営業上の理由等により恣意的に誘導する行為は適切とはいえず、厳に慎む必要があると考えます。\nこのほか、保険募集の実務や保険契約の性質等を踏まえつつ、保険募集人によって適切な意向把握や情報提供が行われたことの事後確認や検証が可能となるよう、顧客への案内又は説明内容や、顧客が表明した意向を適切に証跡等として記録・保存することが必要と考えます。","theme":"更改・継続契約","section":"監督指針","tags":["意向把握","証跡・記録","更改・継続"]},{"no":603,"location":"Ⅱ－4－2－9(5)","comment":"監督指針II－4－2－9(5)において、現在の保険会社の商品の継続で良い(既契約の更改を希望する)という意向の顧客には、「「平成26年改正保険業法(2年以内施行)に係る政府令・監督指針案」に対するパブリックコメント結果等について」における「コメントの概要及びコメントに対する金融庁の考え方」No.534で記載されたとおり、比較推奨を行う必要がないということで良いか。","pageStart":347,"pageEnd":347,"answer":"保険募集人は、顧客が適切な理解に基づき、自主的に満期時における既契約の継続の要否や内容を判断できるよう、意向把握や必要に応じた説明を行う必要があります。その際には、顧客のリスク特性や意向が変化している可能性にも留意しつつ、既契約の内容・特性等に応じて、顧客の意向を適切に把握し、当該意向に沿った提案・説明を行う必要があります。\nその上で、保険募集人による選別・提案が実質的に伴うことなく、顧客の主体的な判断のみにより、既契約と同内容又はこれと大きく異ならない内容の保険契約を希望する旨が表明され、一の保険契約が選択された場合には、直ちに保険業法施行規則第227条の2第3項第4号ロ(推奨販売)に係る対応が必要となるものではありません。\n上記の考え方は、「「平成26年改正保険業法(2年以内施行)に係る政府令・監督指針案」に対するパブリックコメント結果等について」における「コメントの概要及びコメントに対する金融庁の考え方」No.89及びNo.534の考え方を変更するものではありません。\nなお、当該判断が顧客の主体的判断に基づくものであるか、又はその過程において保険募集人による恣意的な誘導が行われていないかについては、個別具体的に判断される必要があります。\nまた、顧客の判断過程において、保険募集人が営業上の理由等により恣意的に誘導する行為は適切とはいえず、厳に慎む必要があると考えます。\nこのほか、保険募集の実務や保険契約の性質等を踏まえつつ、保険募集人によって適切な意向把握や情報提供が行われたことの事後確認や検証が可能となるよう、顧客への案内又は説明内容や、顧客が表明した意向を適切に証跡等として記録・保存することが必要と考えます。","theme":"更改・継続契約","section":"監督指針","tags":["比較推奨","意向把握","証跡・記録","更改・継続"]},{"no":604,"location":"Ⅱ－4－2－9(5)","comment":"保険契約の満期を迎える顧客への提案は、新規契約ではないため既存引受保険会社1社のみを提案すれば足りるという理解でよいか。\n347","pageStart":347,"pageEnd":348,"answer":"保険契約の満期を迎える顧客への提案であることのみをもって、当然に既存引受保険会社1社のみの提案で足りると判断されるものではありません。\n顧客の意向やリスク状況は変化し得るため、保険募集人は、既契約の内容・特性を踏まえつつ、顧客の意向を適切に把握し、保険業法施行規則第227条の2第3項第4号ロ(推奨販売)に係る対応の要否を個別具体的に判断する必要があります。\n一方、保険募集人による選別・提案が実質的に伴うことなく、顧客の主体的な判断のみにより、既契約と同内容又はこれと大きく異ならない内容の保険契約を希望する旨が表明され、一の保険契約が選択された場合には、直ちに同法施行規則第227条の2第3項第4号ロ(推奨販売)に係る対応が必要となるものではありません。\nただし、保険募集の過程において、他の保険契約との比較説明を行う場合には同号イを、「二以上の比較可能な同種の保険契約」\nの中から保険契約を選別・提案する場合には同号ロを踏まえた対応が必要となります。\nまた、顧客が既契約の継続の要否や内容を適切に判断できるよう、必要な情報提供及び意向確認を行う必要があります。","theme":"更改・継続契約","section":"監督指針","tags":["比較推奨","意向把握"]},{"no":605,"location":"Ⅱ－4－2－9(5)","comment":"保険会社から満期を迎える顧客へ更改契約の提案書が郵送されていた(自動継続特約等)場合、保険代理店から既契約保険会社以外の提案を行う必要はあるか。","pageStart":348,"pageEnd":348,"answer":"既契約の満期到来時において、既契約を引き受けている保険会社から、既契約者に対して既契約の継続に係る案内(保険募集)が行われている場合であって、乗合代理店が当該保険募集に関与していないときは、当該乗合代理店が既契約者に対して既契約を引き受ける保険会社以外の保険契約を提案することまでは法令上求められておりません。\nなお、乗合代理店が顧客から既契約や満期後の保険契約に関する問合せを受けて保険募集を行う場合において、保険募集人による選別・提案が実質的に伴うことなく、顧客の主体的な判断のみにより、既契約と同内容又はこれと大きく異ならない内容の保険契約を希望する旨が表明され、一の保険契約が選択された場合には、直ちに保険業法施行規則第227条の2第3項第4号ロ(推奨販売)\nに係る対応が必要となるものではありません。\nこの場合には、保険契約の性質等を踏まえつつ、保険募集人によって適切な意向把握や情報提供が行われたことの事後確認や検証が可能となるよう、顧客への案内又は説明内容や、顧客が表明した意向を適切に証跡等として記録・保存することが必要と考えます。\nなお、顧客の意向を把握するに当たっては、特定の保険会社又は特定の保険契約を前提として顧客の意向を形成し、又は恣意的に誘導することのないよう留意する必要があります。","theme":"更改・継続契約","section":"監督指針","tags":["意向把握","証跡・記録","更改・継続"]},{"no":606,"location":"Ⅱ－4－2－9(5)","comment":"保険会社から満期を迎える顧客へ更改契約の提案書が郵送されていた(自動継続特約等)場合において、顧客から乗合代理店に対して当該更改契約について問い合わせがあったが、他社検討の意思は示されなかった。乗合代理店は問い合わせがあった際に、既契約保険会社以外の提案を行う必要はあるか。","pageStart":348,"pageEnd":348,"answer":"既契約の満期到来時において、既契約を引き受けている保険会社から、既契約者に対して既契約の継続に係る案内(保険募集)が行われている場合であって、乗合代理店が当該保険募集に関与していないときは、当該乗合代理店が既契約者に対して既契約を引き受ける保険会社以外の保険契約を提案することまでは法令上求められておりません。\nなお、乗合代理店が顧客から既契約や満期後の保険契約に関する問合せを受けて保険募集を行う場合において、保険募集人による選別・提案が実質的に伴うことなく、顧客の主体的な判断のみにより、既契約と同内容又はこれと大きく異ならない内容の保険契約を希望する旨が表明され、一の保険契約が選択された場合には、直ちに保険業法施行規則第227条の2第3項第4号ロ(推奨販売)\nに係る対応が必要となるものではありません。\nこの場合には、保険契約の性質等を踏まえつつ、保険募集人によって適切な意向把握や情報提供が行われたことの事後確認や検証が可能となるよう、顧客への案内又は説明内容や、顧客が表明した意向を適切に証跡等として記録・保存することが必要と考えます。\nなお、顧客の意向を把握するに当たっては、特定の保険会社又は特定の保険契約を前提として顧客の意向を形成し、又は恣意的に誘導することのないよう留意する必要があります。","theme":"更改・継続契約","section":"監督指針","tags":["意向把握","証跡・記録","更改・継続"]},{"no":607,"location":"－","comment":"自動継続される旨の条項が定められた保険契約を締結している場合において、保険契約者と保険会社の双方から348満期前に何らの申し出がなく、乗合代理店が既存の保険契約の自動継続を案内するだけであれば、保険募集を行うことにはならないため、比較推奨販売が求められないという理解でよいか。","pageStart":348,"pageEnd":349,"answer":"保険会社又は保険募集人が、既存の保険契約が自動継続される旨を案内するにとどまり、保険募集に該当する行為を伴わない場合には、保険業法施行規則第227条の2第3項第4号に係る対応は求められません。\nただし、当該案内の内容・態様が、契約内容の変更提案、保障(補償)拡充プランの提示、他契約との比較説明、又は特定の保険契約の選別・提案を伴う場合には、その実態に応じて、同号イ又はロを踏まえた対応が必要となり得ます。\nまた、自動継続となる場合であっても、保険契約の内容に重要な変更がある場合には、顧客が契約内容を適切に理解できるよう、必要な情報提供を行うことが重要です。","theme":"更改・継続契約","section":"監督指針","tags":["比較推奨"]},{"no":608,"location":"Ⅱ－4－2－9(5)","comment":"保険契約者から特段の意思表示がない場合に、前契約と同条件で更改することを前提とした特約(自動継続特約)\nを契約者に確認した上で契約手続時に付帯した保険契約については、保険会社が満期案内等を送付し、契約者から契約更改をしない旨や条件変更をする旨の意思表示がない限りにおいて、更改手続きを完了させることがある。この場合、取扱代理店は保険募集に関与しないと考えられることから、当該代理店は情報提供義務・意向把握義務の対象外と考えてよいか。","pageStart":349,"pageEnd":349,"answer":"貴見のとおり、取扱代理店が当該自動継続に係る保険募集に関与していない場合には、当該代理店に保険業法上の情報提供義務及び意向把握・確認義務が課されるものではありません。\nただし、保険代理店が満期案内後の問い合わせ対応、条件変更の提案、継続手続の案内等を行う場合には、これらの行為が保険募集に該当するかをその内容・態様に応じて個別具体的に判断する必要があります。\nその上で、保険代理店が継続手続に関与し、他の保険契約との比較説明を行う場合には同法施行規則第227条の2第3項第4号イを、「二以上の比較可能な同種の保険契約」の中から保険契約を選別・提案する場合には同号ロを踏まえた対応が必要となります。\nまた、自動継続となる場合であっても、保険契約の内容に変更がある場合には、顧客が契約内容を適切に理解できるよう、必要な情報提供を行うことが重要です。","theme":"更改・継続契約","section":"監督指針","tags":["比較推奨","意向把握","更改・継続"]},{"no":609,"location":"Ⅱ－4－2－9(5)","comment":"自動車保険においては、更改手続き漏れによる無保険状349態の回避や等級の継承(前契約に基づく保険料の割引率の適用)を目的として、取扱代理店が満期までに契約者と連絡が取れなかった場合などに、その後、一定期間内に契約者が継続手続きの申込みを行い、取扱代理店が更新意思確認書により契約者の契約更改意思を確認できた場合に限り、前契約の満期日に遡及して前契約と同一の契約条件で契約が締結されたものとみなす特約が存在する。\nこのケースにおいては、契約者が前契約の保険契約での更改を希望していることが明らかであるため、当該代理店が申込みの受領(保険募集)を行うにあたっては、比較推奨販売の対象外と考えてよいか。","pageStart":349,"pageEnd":350,"answer":"貴見のとおりです。","theme":"更改・継続契約","section":"監督指針","tags":["比較推奨","更改・継続"]},{"no":610,"location":"－","comment":"現在加入中の保険証券を預かった時点で顧客のご意向を確認した場合、仮に満期日が1年後の場合は、満期時において証券を預かった時点の意向に基づいて保険契約を提案することでよいか。ただし、満期までに顧客の意向が変更された場合は、この限りではない。","pageStart":350,"pageEnd":350,"answer":"既契約に係る顧客の意向を把握した場合に、その後の保険募集に当たり、当該意向を参考とすること自体は否定されません。\nもっとも、満期までの間に、顧客のリスク状況や意向が変化している可能性はあるものと考えられます。\nしたがって、既契約の満期到来に伴う保険募集を行う際には、既契約の契約締結時における顧客意向のみをもって満期到来時の意向が確定しているものとして取り扱うのではなく、顧客のリスク状況や意向が変化している可能性にも留意しつつ、既契約の内容・特性等に応じて、顧客の意向を適切に把握し、提案・説明を行う必要があります。\nまた、顧客が表明した意向、保険募集人が案内・説明した内容等については、事後的に確認・検証できるよう、適切に記録・保存することが重要です。","theme":"更改・継続契約","section":"監督指針","tags":["証跡・記録"]},{"no":611,"location":"－","comment":"既に加入している損害保険について、満期継続案内の際350にも改めて意向を確認しなければならないのか。","pageStart":350,"pageEnd":351,"answer":"新規契約か否かに関わらず、保険募集を行う場合には、意向把握・確認義務が課せられることから、満期継続案内時に提案を行う場合には、保険契約者の意向を適切に確認する必要があります。\nもっとも、過去の保険募集時に把握した意向を参考とすること自体は否定されません。ただし、満期までの間に顧客の生活環境、リスク状況、保険ニーズ等が変化している可能性があるため、既契約の契約締結時の意向のみをもって、満期到来時の意向が確定しているものとして取り扱うことは適切ではありません。\nしたがって、契約継続に係る保険募集を行う場合には、既契約の内容・特性、商品改定の有無、補償内容・保険料等の変更の有無を踏まえ、顧客が満期時における既契約の継続の要否及び内容を適切に判断できるよう、必要な情報提供及び意向確認を行う必要があります。\nなお、保険募集人による選別・提案が実質的に伴うことなく、顧客の主体的な判断のみにより、既契約と同内容又はこれと大きく異ならない内容の保険契約を希望する旨が表明され、一の保険契約が選択された場合には、直ちに保険業法施行規則第227条の2第3項第4号ロ(推奨販売)に係る対応が必要となるものではありません。","theme":"更改・継続契約","section":"監督指針","tags":["意向把握"]},{"no":612,"location":"Ⅱ－4－2－9(5)","comment":"乗合代理店が、既にA保険会社との間で保険契約を締結している顧客に対して、A保険会社の保険契約の提案を希望するかどうかという意向をフラットに確認することは、監督指針Ⅱ－4－2－9(5)①B.(a)第1段落に定める「顧客の意向に沿って保険契約を選別」することになるという理解でよいか。\n351","pageStart":351,"pageEnd":352,"answer":"ご指摘の確認については、既契約の継続に関する内容なのか等、具体的な募集状況が必ずしも明らかでないことから、一律にお答えすることは困難です。\n顧客のリスク特性、保険ニーズ、既契約の状況その他の事情を踏まえ、保険契約の内容・特性に応じて、意向把握が適切に行われることが重要であり、顧客の意向に沿った選別・提案が行われる場合には、保険業法施行規則第227条の2第3項第4号ロ(推奨販売)の規定及びⅡ－4－2－9(5)①B.(a)に基づく対応が求められますが、推奨販売に係る対応の要否については、個別具体的かつ実質的に判断される必要があります。","theme":"更改・継続契約","section":"監督指針","tags":["意向把握"]},{"no":613,"location":"Ⅱ－4－2－9(5)","comment":"保険業法施行規則第227条の2第3項第4号ロにおいて、更新の意思確認を行った時点で従来と同条件での更新を希望した顧客に対しても、商品特性や保険料水準などについて希望がないかを改めて確認する必要があるか。","pageStart":352,"pageEnd":352,"answer":"保険募集人による選別・提案が実質的に伴うことなく、顧客の主体的な判断のみにより、既契約と同内容又はこれと大きく異ならない内容の保険契約を希望する旨が表明され、一の保険契約が選択された場合には、直ちに保険業法施行規則第227条の2第3項第4号ロ(推奨販売)に係る対応が必要となるものではありません。\nこの場合、保険契約を選別することを目的とした商品特性や保険料水準等に係る追加的な意向把握を行うことまでは一律には求められません。\nただし、保障(補償)内容、保険金額、保険期間、特約、免責、保険料水準、主な不利益事項等に実質的な変更がある場合には、既契約の継続の要否及び内容を適切に判断できるよう、変更内容及び程度に応じて、適切に意向把握・確認義務及び情報提供義務が履行されることが必要となります。\nなお、更新手続の過程で、他の保険契約との比較説明を行う場合には同号イを、「二以上の比較可能な同種の保険契約」の中から保険契約を選別・提案する場合には同号ロを踏まえた対応が必要となります。","theme":"更改・継続契約","section":"監督指針","tags":["比較推奨","意向把握","更改・継続"]},{"no":614,"location":"－","comment":"損害保険契約は単年度契約が主であるものの、長期間の損害率が良好であることが現実的な引受に影響する。\n今般の改正で毎年の契約更改のタイミングで比較推奨352販売を行うことが必須となれば、顧客が単年の優劣によって保険会社を渡り歩くことを惹起し、長年の契約による保険会社・保険代理店・顧客の関係構築が軽視され、長期の良好な関係が構築されない状況が生まれることが懸念される。長年の取引継続の効果がアンダーライティングに影響する場合は、比較推奨販売においてはどのように明示すべきか。","pageStart":352,"pageEnd":353,"answer":"一部の損害保険契約において、長期間の損害率実績が、将来の引受条件、割引率、保険料水準等に影響し得る仕組みがある場合に、その仕組みや客観的事実を顧客に説明すること自体は否定されません。\nただし、当該仕組みのみをもって直ちに特定の保険会社又は特定の保険契約を提示・推奨するのではなく、顧客のリスク状況、補償内容、保険料水準、特約、免責等も踏まえ、顧客の意向に沿って総合的に判断する必要があります。\nしたがって、長期継続による引受上の効果を説明する場合には、その内容や将来の取扱いが確定的でないこと、他の保険契約との比較上の位置付け等を、顧客に誤認を与えないよう分かりやすく説明することが重要です。\nなお、最終的には個別具体的に判断される必要がありますが、当該仕組み等が存在することのみをもって、直ちに特定の保険契約を選別・提案することは、恣意的な特定の保険契約への誘導と評価され得ることにご留意ください。","theme":"更改・継続契約","section":"監督指針","tags":["比較推奨","更改・継続"]},{"no":615,"location":"Ⅱ－4－2－9(5)","comment":"監督指針Ⅱ－4－2－9(5)の比較推奨販売の方法に関し、損害保険契約の更改手続き(満期更新)時においては、前契約と同一内容又は軽微な変更のみで更改手続き(満期更新)を行うことも一定割合以上存在する現状認識のもと、画一的に保険業法施行規則第227条の2第3項第4号イ又はロに基づく比較説明・推奨販売を求める場合、以下の課題が顕在化するおそれがあると考えられる。\n・顧客の利便性の低下更改時に複数社比較を形式的に行うことは、顧客にとって過剰・また意向にそぐわない情報提供となり、顧客にかえって負担感を与え、理解を阻害する。\n・保険募集実務負担の過度な増大353事故対応履歴や補償内容の継続性を重視する顧客に対し、形式的な比較資料作成業務負荷が増加し、本来注力すべき募集品質向上に資する時間が制限を受ける。\n・「顧客本位の業務運営原則」との整合性顧客が「現行契約(内容)の継続」を強く要望される場合、比較説明・推奨販売の義務が顧客意向と乖離する可能性がある。\n以上を踏まえ、損害保険契約の更改手続き時における実務運営上の次の整理について、ご検討いただきたい。\n・顧客に「現行契約(内容)の継続を希望する」という明確な意向がある場合の比較説明・推奨販売の簡素化「更改前契約との相違点(差分)」や「最新の補償内容への変更の有無」に焦点をあてた説明をもって、比較推奨販売プロセスを充足したものとみなす運用・事故対応履歴・補償継続性を考慮した推奨理由の明示損害保険の特性として、事故対応の品質や補償の継続性が顧客価値に直結するため、これらを適切な推奨理由と位置づけること・比較推奨販売の対象範囲の合理化損害保険の更改契約においては、補償内容が大きく変わる場合や保険料が大幅に変更となる場合に限定して比較推奨を求めるなど、リスクベースの運用を可能とすること","pageStart":353,"pageEnd":354,"answer":"既契約の満期到来に伴う保険募集を行う場合において、保険募集人による選別・提案が実質的に伴うことなく、顧客の主体的な判断のみにより、既契約と同内容又はこれと大きく異ならない内容の保険契約を希望する旨が表明され、一の保険契約が選択された場合には、直ちに保険業法施行規則第227条の2第3項第4号ロ(推奨販売)に係る対応が必要となるものではありません。\nまた、顧客へ推奨する基準や理由等については、合理的かつ一定の具体性を有することが求められます。したがって、事故対応の品質等について、保険募集人の経験や主観を根拠に、特定の保険会社又は特定の保険契約を推奨することは適切ではありません。他方で、把握した顧客の意向に沿うことを前提としつつ、客観的な事実に基づき、合理的に説明することが可能である場合には、事故対応の品質等を当該推奨基準や理由等の一要素とすることも一概に否定されないものと考えられます。\nなお、顧客の適切な商品選択の機会を実質的に阻害し、又は保険契約者の意向を恣意的に誘導していると評価され得る場合には、問題となり得ます。\nこのほか、新規契約か否かに関わらず、情報提供義務が適用される場合には、把握した顧客の意向に沿った対応が求められることから、当該意向に照らし、「二以上の比較可能な同種の保険契約」が存在し、顧客の意向に沿って単一又は複数の保険契約の提案をしようとする場合には、同号ロに基づく説明が必要となります。\nしたがって、保険契約者等の保護の観点から、補償内容等の変更が大幅でないことのみをもって、一律に比較推奨販売に係る規制の適用対象外とすることは適当ではないと考えられます。","theme":"更改・継続契約","section":"監督指針","tags":["比較推奨","更改・継続"]},{"no":616,"location":"Ⅱ－4－2－9(5)","comment":"更改契約は比較推奨販売の対象外であるという認識が保険会社を含め保険業界内において一般的となっている。\n本来は更改契約についても比較推奨販売の対象外にし354ていないはずであるため、今般の改正においては、更改契約についても乗合代理店における比較推奨販売の対象である旨、明確に公表していただきたい。","pageStart":354,"pageEnd":355,"answer":"貴重なご意見として承ります。\n既契約の満期が到来する場合において、顧客から具体的な意向が示されていない中、乗合代理店が行う案内(保険募集)が既契約と同条件又は同等の補償条件であることのみをもって、当然に比較推奨販売に係る規定の適用対象外となるものではありません。\n保険業法施行規則第227条の2第3項第4号ロ(推奨販売)に係る対応の要否は、「二以上の比較可能な同種の保険契約」が存在するか、保険契約を選別・提案するものであるかどうかによって個別具体的に判断される必要があります。\nその上で、短期の損害保険契約については、その特性を踏まえると、当該契約の満期が到来することに伴い、乗合代理店において、既契約と同条件又は補償内容がほぼ変わらないプランの案内(保険募集)が行われたとしても、直ちに保険契約者等の保護に欠けるものとは言えず、一概に否定されるものではないと考えます。ただし、その場合であっても、他の保険契約の提案を望む顧客も存在すると考えられることから、乗合代理店として意向把握・確認義務を適切に履行するための対応として、顧客の希望に応じて他の保険契約を提案できることを明示すること、及び顧客のリスク状況や意向を適切に把握できるよう工夫して案内(保険募集)することが求められると考えます。\nまた、保険募集人による選別・提案を実質的に伴うことなく、顧客の主体的な判断のみにより、既契約と同内容又はこれと大きく異ならない内容の保険契約を希望する旨が表明され、一の保険契約が選択された場合には、直ちに同号ロに係る対応が必要となるものではありません。","theme":"更改・継続契約","section":"監督指針","tags":["比較推奨","意向把握","更改・継続"]},{"no":617,"location":"－","comment":"保険業法施行規則第227条の2第3項第4号ロを実施するにあたっては、顧客の意向をしっかりと確認しなければならないが、損害保険における保険契約を選定する項目から355「保険料水準」を除くことは考えられない。\n現在一店舗一損害保険制を前提とした教育を実施してきたディーラーが大半であるため、複数損害保険の見積もりを作成するための態勢整備(システム手当、保険募集人スキルの向上)には相当程度の時間を要すると考える。\nよって以下の2点を提案させていただく。\n・対象契約を新規契約のみとし更新契約は対象外とする。\n・2026年6月から1年間程度の試行期間を経て本格運用を開始する。","pageStart":355,"pageEnd":356,"answer":"貴重なご意見として承ります。\n保険料水準については、顧客が重視する事項の一つになり得るものであり、比較推奨販売における保険契約の選別・提案の基準や理由となり得ます。ただし、保険料水準のみならず、補償内容、特約、免責等も含め、顧客の意向に沿って総合的に判断することが重要です。\n今回の改正案の施行までの期間については、乗合代理店の実務や経営に与える影響等も考慮し、社内規程の改正や業務フローの整備、システム対応、募集人教育等の体制整備に要する期間として、円滑な対応が可能となるよう適当と考えられる期間を設定しています。\nまた、比較推奨販売に係る規定の適用は、新規契約の保険募集時に限られるものではありません。既契約の満期到来に伴う保険募集時であっても、保険募集人が顧客の意向に沿って「二以上の比較可能な同種の保険契約」の中から保険契約を選別・提案する場合には、保険業法施行規則第227条の2第3項第4号ロを踏まえた対応が必要となります。\nしたがって、既契約の満期到来に伴う保険募集を一律に比較推奨販売の適用対象外とすることは適当ではなく、顧客の意向、契約内容、保険募集人の関与、比較又は推奨の有無等を踏まえ、個別具体的かつ実質的に判断する必要があります。\nなお、満期到来時において、保険募集人による選別・提案が実質的に伴うことなく、顧客の主体的な判断のみにより、既契約と同内容又はこれと大きく異ならない内容の保険契約を希望する旨が表明され、一の保険契約が選択された場合には、直ちに同号ロに係る対応が必要となるものではありません。","theme":"更改・継続契約","section":"監督指針","tags":["比較推奨","更改・継続","システム・比較ツール"]},{"no":618,"location":"－","comment":"乗合代理店が団体から特定の保険会社の商品の加入勧奨の委託を受けて、当該団体の構成員に対して、団体契約356(団体が保険契約者となる保険契約)の被保険者に当該契約内容の案内を行う場合(加入勧奨を行う場合)は、募集人に情報提供義務が課されるか否かを問わず団体から提供される構成員リストの提供を受けて、加入勧奨行為を行っているなど、当該団体(契約者)の委託であると考えられることから、比較推奨販売の対象外であるという理解でよいか。","pageStart":356,"pageEnd":357,"answer":"団体契約の取扱保険募集人が団体からの委託に基づき加入勧奨を行う場合であっても、保険業法第294条に基づく情報提供義務等が当該募集人に課される場合には、当該義務を適切に履行する必要があります。\nしたがって、取扱保険募集人が団体から受託した加入勧奨を行うことのみをもって、直ちに比較推奨販売に係る規定の対象外となるものではありません。取扱保険募集人が乗合代理店であり、「二以上の比較可能な同種の保険契約」がある場合で、それらの保険契約の中から選別・提案を行うときには、同法施行規則第227条の2第3項第4号ロ(推奨販売)の規定に係る対応が必要となります。","theme":"団体・団体扱い","section":"監督指針","tags":["比較推奨","団体・団体扱い"]},{"no":619,"location":"Ⅱ－4－2－9(5)","comment":"団体契約の比較推奨について、意見を伺いたい。\n一般的に団体契約は、保険代理店(保険会社等を含む)が契約者となる団体(企業・団体等)に対して募集(制度の創設や内容の決定など)を行い、その制度について団体契約者が団体構成員へ案内する構図であると認識している。\nそのため、団体構成員への保険の案内は一般的に加入勧奨と呼ばれており、加入者が自分の意思で保険へ加入するかどうかを決定するものであり、一般的な募集とは異なると考えている。\nこの場合、団体構成員に対して加入勧奨をする場合は、当然ながら比較推奨の対象外であるという認識でよいか。\nまた、本ケースで団体構成員に対して乗合代理店が当該団体契約の募集をする場合(制度説明会や職場での案内など)にも、当該団体制度以外の商品(団体契約の引受保険外や以外の乗合保険会社の一般商品など)との比較推奨が必要となるか。\n357","pageStart":357,"pageEnd":357,"answer":"保険業法第294条第1項に定める団体保険について、保険契約者としての団体は、同法第294条の適用主体ではないことから、直接的な情報提供義務は課されず、同法施行規則第227条の2第3項第4号(比較推奨販売)についても適用対象外となります。\n一方で、同法施行規則第227条の2第2項に該当しない団体が被保険者となる者に対し加入勧奨を行う場合など、保険募集人に同法第294条第1項の情報提供義務が適用される場合には、団体保険の取扱保険募集人が自ら情報提供義務を負うこととなります。このため、取扱保険募集人に対しては、保険契約者及び被保険者に対する情報提供の方法を定める同法施行規則第227条の2第3項本文が適用されるとともに、当該募集人が乗合代理店であり、「二以上の比較可能な同種の保険契約」が存在し、それらの中から選別・提案を行う場合には、同条第3項第4号ロ(推奨販売)の規定に係る対応が必要となります。\nなお、「二以上の比較可能な同種の保険契約」の有無については、個別具体的かつ実質的に判断される必要があるところ、契約","theme":"団体・団体扱い","section":"監督指針","tags":["比較推奨","団体・団体扱い"]},{"no":620,"location":"Ⅱ－4－2－9(5)","comment":"福利厚生の一環として団体が契約者となり募集を行う団体契約保険は、契約者が保険会社を選定しており、乗合代理店で保険会社を選定することが困難である。そのため、乗合代理店で他の保険会社を提案することが実質的に不可能であることから、比較推奨販売の対象外となる認識でよいか。","pageStart":358,"pageEnd":358,"answer":"当事者である団体の意向を踏まえることはあり得ると考えます。\nただし、同法施行規則第227条の2第2項に該当しない団体が、保険契約者であるとともに、乗合代理店として当該団体保険を取り扱う場合には、保険募集人の立場で特定の保険契約が恣意的に選別・提案されることのないよう、「二以上の比較可能な同種の保険契約」の有無については、特に慎重に判断される必要があります。","theme":"団体・団体扱い","section":"監督指針","tags":["比較推奨","団体・団体扱い"]},{"no":621,"location":"Ⅱ－4－2－9(5)","comment":"団体契約においては、契約者が団体であるため、団体制度にラインナップされた商品のみを加入者に提示すれば足り、比較推奨の必要はないとの認識でよいか。","pageStart":358,"pageEnd":358,"answer":"当事者である団体の意向を踏まえることはあり得ると考えます。\nただし、同法施行規則第227条の2第2項に該当しない団体が、保険契約者であるとともに、乗合代理店として当該団体保険を取り扱う場合には、保険募集人の立場で特定の保険契約が恣意的に選別・提案されることのないよう、「二以上の比較可能な同種の保険契約」の有無については、特に慎重に判断される必要があります。","theme":"団体・団体扱い","section":"監督指針","tags":["比較推奨","団体・団体扱い"]},{"no":622,"location":"Ⅱ－4－2－9(5)","comment":"団体契約・団体募集(生命保険・損害保険とも)は、以下のような特性を有することから、画一的に保険業法施行規則第227条の2第3項第4号イ及びロに基づく比較説明・推奨販売を求める場合、制度の趣旨と整合しない可能性があると考えられる。\n・団体募集の場合、制度導入時に団体(企業等)が幹事代理店等と協議し、補償内容・保険会社・保険料水準を基に、あらかじめ特定の保険会社やプランを選定するケースが多い。\n・団体構成員は、団体が選定した契約条件を前提に加入を検討する仕組みである。\n・団体の福利厚生制度としての性格が強く、団体募集における推奨理由は「団体割引の適用」や「給与天引きによる利便性」等に集約される。\n以上を踏まえ、団体契約・団体募集時における実務運営上の次の整理について、検討いただきたい。\n358・団体側の選定プロセスを比較説明・推奨販売の代替と位置づける：団体が複数の保険会社比較・条件等の調整を行った上で、保険会社・保険商品を選定している場合、団体構成員への個別比較説明・推奨販売を不要とする旨の明示・団体構成員への説明は「団体としての選定理由」等を明示することで代替する：乗合代理店が個々の団体構成員(加入者)に対して比較説明・推奨販売を行うのではなく、団体として当該保険会社・商品・補償内容を選定した理由を説明することをもって、要件を満たすと整理すること・団体募集の実務に即した合理的な運用：団体保険における加入手続きは、効率性・簡素化も求められることから、過度な比較資料の作成義務による形骸化、ひいては「制度そのものが顧客にとっての利益であること」を侵害することにならないよう、配慮いただきたい。","pageStart":358,"pageEnd":359,"answer":"当事者である団体の意向を踏まえることはあり得ると考えます。\nただし、同法施行規則第227条の2第2項に該当しない団体が、保険契約者であるとともに、乗合代理店として当該団体保険を取り扱う場合には、保険募集人の立場で特定の保険契約が恣意的に選別・提案されることのないよう、「二以上の比較可能な同種の保険契約」の有無については、特に慎重に判断される必要があります。","theme":"団体・団体扱い","section":"監督指針","tags":["比較推奨","団体・団体扱い"]},{"no":623,"location":"Ⅱ－4－2－9(5)","comment":"保険業法施行規則第227条の2第3項第4号ロ(以下、ロ方式とする。)の準用範囲(団体契約の扱い)について福利厚生制度等で案内される団体契約については、団体契約者自身にロ方式による募集プロセスを踏んでいれば、団体契約の団体所属員(加入者)に対しては、ロ方式は適用されない考え方となるのか伺いたい。","pageStart":359,"pageEnd":359,"answer":"当事者である団体の意向を踏まえることはあり得ると考えます。\nただし、同法施行規則第227条の2第2項に該当しない団体が、保険契約者であるとともに、乗合代理店として当該団体保険を取り扱う場合には、保険募集人の立場で特定の保険契約が恣意的に選別・提案されることのないよう、「二以上の比較可能な同種の保険契約」の有無については、特に慎重に判断される必要があります。","theme":"団体・団体扱い","section":"監督指針","tags":["団体・団体扱い"]},{"no":624,"location":"Ⅱ－4－2－9(5)","comment":"団体契約(団体が保険契約者となり、団体構成員が被保険者となる契約形態)の被保険者に対する加入勧奨であったとしても、例えば、カード会社を契約者としてカード会員を被保険者とする団体傷害保険契約であれば、保険募集359人に情報提供義務が課されると理解している。\nかかる保険募集人に情報提供義務が課されるケースにおける被保険者に対する加入勧奨を乗合代理店が行う場合は、保険業法施行規則第227条の2第3項第4号に定める比較推奨販売規制の対象になるという理解でよいか。\nそのような理解でよい場合、当該乗合代理店にとって「二以上の比較可能な同種の保険契約」の範囲は、団体契約の範囲のみ(上記例でいえば、他にカード会社が契約者となる団体傷害保険契約があるか否か)で考えれば足りるのか、それとも、個人契約(団体構成員が保険契約者兼被保険者となる契約形態)も含めて(上記例でいえば、カード会員が個人で契約できる傷害保険契約もあるか否かで)考える必要があるのか。","pageStart":359,"pageEnd":360,"answer":"当事者である団体の意向を踏まえることはあり得ると考えます。\nただし、同法施行規則第227条の2第2項に該当しない団体が、保険契約者であるとともに、乗合代理店として当該団体保険を取り扱う場合には、保険募集人の立場で特定の保険契約が恣意的に選別・提案されることのないよう、「二以上の比較可能な同種の保険契約」の有無については、特に慎重に判断される必要があります。","theme":"団体・団体扱い","section":"監督指針","tags":["比較推奨","団体・団体扱い"]},{"no":625,"location":"Ⅱ－4－2－9(5)","comment":"職域の団体保険や割引のある団体契約等で、制度上他の選択肢がないものは、選択可能な範囲で比較推奨を実施することになるため、提案する保険会社を絞り込めるという理解でよいか。","pageStart":360,"pageEnd":360,"answer":"当事者である団体の意向を踏まえることはあり得ると考えます。\nただし、同法施行規則第227条の2第2項に該当しない団体が、保険契約者であるとともに、乗合代理店として当該団体保険を取り扱う場合には、保険募集人の立場で特定の保険契約が恣意的に選別・提案されることのないよう、「二以上の比較可能な同種の保険契約」の有無については、特に慎重に判断される必要があります。","theme":"団体・団体扱い","section":"監督指針","tags":["比較推奨","団体・団体扱い"]},{"no":626,"location":"－","comment":"監督指針Ⅱ－4－2－9(5)\nの趣旨は、顧客が最善の利益を確保できる商品選択を行えるよう、乗合代理店が独自の理由により特定の保険会社の商品を推奨することを防止する点にあると理解している。\n一方、企業内代理店においては、親会社グループが福利厚生制度として団体保険等を設けている場合がある。\n当該制度は団体割引等により保険料が低廉で、補償内容も手厚いなど、従業員にとって合理的な選択肢となり得る360ものである。\n乗合代理店として当該商品を代理店独自理由で「推奨」\nすることは避けるべきと考えているが、福利厚生制度として存在する団体保険の内容を従業員に案内することは、むしろ顧客の最善利益に資する情報提供と考えている。\n上記を踏まえ、乗合代理店として①お客さまの意向(当初意向)をお聞きする②お客さまに中立的な基準に基づき商品を比較提示する③お客さまの意向を踏まえ、保険料・補償内容で優位性のあるグループ制度商品を推奨するという案内プロセスは監督指針上問題ないと理解してよいか。","pageStart":360,"pageEnd":361,"answer":"当事者である団体の意向を踏まえることはあり得ると考えます。\nただし、同法施行規則第227条の2第2項に該当しない団体が、保険契約者であるとともに、乗合代理店として当該団体保険を取り扱う場合には、保険募集人の立場で特定の保険契約が恣意的に選別・提案されることのないよう、「二以上の比較可能な同種の保険契約」の有無については、特に慎重に判断される必要があります。","theme":"団体・団体扱い","section":"監督指針","tags":["企業内代理店","団体・団体扱い"]},{"no":627,"location":"Ⅱ－4－2－9(5)","comment":"団体契約において、保険業法施行規則第227条の2第2項に該当しない団体については、情報提供義務が乗合代理店に課されているが、ここでいう情報提供義務の内容は、あくまで本来団体が行う加入勧奨と同程度の情報提供義務であって、団体の加入勧奨には比較推奨が含まれていないことから、乗合代理店であるからといって、比較推奨義務が課されるものではないと理解してよいか。\n361","pageStart":361,"pageEnd":362,"answer":"保険契約者としての団体は、保険業法第294条の適用主体ではないことから、直接的な情報提供義務は課されず、同法施行規則第227条の2第3項第4号(比較推奨販売)についても適用対象外となります。\n一方で、同法施行規則第227条の2第2項に該当しない団体が被保険者となる者に対し加入勧奨を行う場合、団体保険の取扱保険募集人が自ら情報提供義務を負うこととされています。このため、取扱保険募集人に対しては、保険契約者及び被保険者に対する情報提供の方法を定める同法施行規則第227条の2第3項本文が適用されるとともに、当該募集人が乗合代理店であり、「二以上の比較可能な同種の保険契約」が存在し、それらの中から保険募集人が選別・提案を行う場合には、同項第4号ロ(推奨販売)の規定に係る対応が求められます。\nしたがって、団体が行う加入勧奨には比較推奨販売に係る規定が直接的に適用されないことをもって、取扱保険募集人である乗合代理店に比較推奨販売に係る規定が適用されないものではありません。\nなお、同法施行規則第227条の2第2項に該当しない団体における加入勧奨については、Ⅱ－4－2－2(4)①のとおり、例えば、同法第300条第1項に規定する禁止行為の防止など、募集規制に準じた取扱いが求められ、募集規制の潜脱が行われないような適切な措置が講じられている必要があります。さらに、取扱保険募集人が乗合代理店である場合には、同法第294条の3において、団体保険の加入勧奨に係る体制整備義務が課されていることに留意が必要です。","theme":"団体・団体扱い","section":"監督指針","tags":["比較推奨","団体・団体扱い"]},{"no":628,"location":"Ⅱ－4－2－9(5)","comment":"監督指針Ⅱ－4－2－9(5)後段に「所属保険会社等の商号等を明らかにした上で」と記載されているが、乗合代理店が実際に販売している保険種目などを勘案した上で所属保険会社等の商号等を明らかにする方法でもよいか。","pageStart":362,"pageEnd":362,"answer":"Ⅱ－4－2－9(5)における「所属保険会社等の商号等を明らかにした上で」とは、保険業法第294条第3項に基づく権限明示を適切に行うことを指します。\nしたがって、権限明示に当たっては、乗合代理店が実際に販売している保険種目などを勘案した上で一部の所属保険会社等に限定して商号等を明らかにする方法は許容されないものと考えます。","theme":"団体・団体扱い","section":"監督指針","tags":[]},{"no":629,"location":"Ⅱ－4－2－9(5)","comment":"監督指針Ⅱ－4－2－9(5)後段に「所属保険会社等の商号等を明らかにした上で」と記載されているが、例えば、D代理店ではA損保、B損保、C損保の3社と代理店委託契約(全種目委託)を結んでいる場合を考える。\nD代理店が実際に販売している商品は、団体医療保険及び団体扱自動車保険のみであることを前提とし、さらに団体医療保険はA損保、団体扱自動車保険はB損保又はC損保の商品選択制としている。\n362この場合、団体医療保険への加入を検討している顧客に対しては団体契約を組成している「A損保の商号」を、また団体扱自動車保険の加入を検討している顧客に対しては、選択制として制度展開している「B損保及びC損保の商号」\nを明らかにすることでよいか。","pageStart":362,"pageEnd":363,"answer":"Ⅱ－4－2－9(5)における「所属保険会社等の商号等を明らかにした上で」とは、保険業法第294条第3項に基づく権限明示を適切に行うことを指します。\nしたがって、権限明示に当たっては、乗合代理店が実際に販売している保険種目などを勘案した上で一部の所属保険会社等に限定して商号等を明らかにする方法は許容されないものと考えます。","theme":"団体・団体扱い","section":"監督指針","tags":["団体・団体扱い"]},{"no":630,"location":"Ⅱ－4－2－9(5)","comment":"企業や官公庁などの団体では、構成員の福利厚生の一環等として、以下の3点の要件を全て満たす団体扱契約(団体の構成員を保険契約者とする契約形態)の保険商品(以下「制度商品」という)を採用することがある。\n＜制度商品の要件＞①団体が構成員全体の便益を考慮していること(団体料率や集金事務委託契約の有無のみではなく、構成員の保険の加入状況やアフターフォローの手厚さ等の便益を総合的に考慮)\n②団体が採用した保険商品であること③団体が制度商品の加入機会を構成員に提供していること乗合代理店は、団体に対し必要な情報を提供し、当該団体は、上記要件に照らし特定の保険商品を採用することとなる。\nその場合、乗合代理店は、団体料率を適用するなどして当該団体専用の保険商品として差別化された制度商品を構成員に対して明示し、募集することとなる。\nこの場合、当該団体の構成員は、当該制度商品を、団体料率を適用しない通常の保険商品とは異なるものである363ことを前提に、当該団体専用の保険商品として認知し、保険加入の要否を検討することが一般的であることから、「一般人の合理的な期待を基準」として考えた場合、複数の制度商品が採用されている場合を除き、「二以上の比較可能な同種の保険契約」は存在しないと判断することは支障ないと考えられるが、その理解でよいか。\n※「二以上の比較可能な同種の保険契約」とは、「「平成26年改正保険業法(2年以内施行)に係る政府令・監督指針案」に対するパブリックコメント結果等について」における「コメントの概要及びコメントに対する金融庁の考え方」No.74～77において、「ある保険契約が、「二以上の比較可能な同種の保険契約」に該当するかどうかは、保険募集人等が顧客の意向の把握過程において把握しようとする顧客の意向との関係で、一般人の合理的な期待を基準として、当該保険契約が「比較可能な同種」のものといえるかについて、個別具体的かつ実質的に判断されるべきもの」という考え方が示されている。\nまた、当該団体が複数の制度商品を採用しており、それらが「二以上の比較可能な同種の保険契約」と判断される場合には、保険業法施行規則第227条の2第3項第4号ロの規定に基づき、制度商品の中から顧客の意向に沿った保険契約を選別することになると考えるが、そのような理解でよいか。\nなお、乗合代理店による上記のような制度商品の募集が顧客である団体の構成員との書類等の受渡しが一度に限364定される非対面募集である場合には、乗合代理店は、団体の人事部門等との協議を通じて、監督指針Ⅱ－4－2－2(3)\n①ア.(注2)に基づき、構成員の意向を推定した上で、構成員に対する制度商品の募集を行う必要があるが、意向を推定するに際しては、推定の確度に十分留意し、合理性・妥当性のある意向推定を行う必要があると理解している。","pageStart":363,"pageEnd":365,"answer":"団体扱・集団扱契約についても、保険業法施行規則第227条の2第3項第4号ロの適用対象となるか否かについては、当該契約以外に「二以上の比較可能な同種の保険契約」に該当する保険契約があるか否かについて、顧客の意向との関係で、一般人の合理的な期待を基準として、保険契約の対象リスク、給付・保障(補償)内容、保険契約の特性・類型等を踏まえ、個別具体的かつ実質的に判断されるべきものです。\nその上で、契約主体ではない団体であったとしても、それが企業や官公庁であり、従業員の福利厚生のために、団体扱・集団扱契約を制度商品として選定し、その利点とともに、当該団体専用の保険契約として、従業員に適切に認識される態様で提供される場合には、当該契約は団体の都合ではなく団体の構成員の利益のための仕組みとして位置付けられるものと考えられます。\nこの場合には、当該団体において選定された保険契約の中から保険契約の提案・説明が保険募集人によって行われたとしても、保険契約者等の保護に欠けるおそれは少ないものと考えられることから、当該団体により選定されたという事情を「比較可能な同種の保険契約」の範囲を判断するに当たっての主な考慮要素とすることは、一概に否定されるものではないと考えます。","theme":"団体・団体扱い","section":"監督指針","tags":[]},{"no":631,"location":"Ⅱ－4－2－9(5)","comment":"団体扱・集団扱契約は、企業の従業員等を契約者とする保険契約である。\n保険料の集金を当該企業等に委託して給与天引きにする等、保険会社や代理店の事務コストが削減されることから、一時払の保険料を一定割り引くなど、契約者にもメリットがあり、企業の福利厚生制度のメニュー等として活用されている。\n「「平成26年改正保険業法(2年以内施行)に係る政府令・監督指針案」に対するパブリックコメント結果等について」における「コメントの概要及びコメントに対する金融庁の考え方」No.74～77に記載の「二以上の比較可能な同種の保険契約」の意義に照らし、団体扱・集団扱の契約と割引等の無い一般の契約は、割引率や収納方法が異なることから、「二以上の比較可能な同種の保険契約」に該当しないとの理解でよいか。","pageStart":365,"pageEnd":365,"answer":"団体扱・集団扱契約についても、保険業法施行規則第227条の2第3項第4号ロの適用対象となるか否かについては、当該契約以外に「二以上の比較可能な同種の保険契約」に該当する保険契約があるか否かについて、顧客の意向との関係で、一般人の合理的な期待を基準として、保険契約の対象リスク、給付・保障(補償)内容、保険契約の特性・類型等を踏まえ、個別具体的かつ実質的に判断されるべきものです。\nその上で、契約主体ではない団体であったとしても、それが企業や官公庁であり、従業員の福利厚生のために、団体扱・集団扱契約を制度商品として選定し、その利点とともに、当該団体専用の保険契約として、従業員に適切に認識される態様で提供される場合には、当該契約は団体の都合ではなく団体の構成員の利益のための仕組みとして位置付けられるものと考えられます。\nこの場合には、当該団体において選定された保険契約の中から保険契約の提案・説明が保険募集人によって行われたとしても、保険契約者等の保護に欠けるおそれは少ないものと考えられることから、当該団体により選定されたという事情を「比較可能な同種の保険契約」の範囲を判断するに当たっての主な考慮要素とすることは、一概に否定されるものではないと考えます。","theme":"団体・団体扱い","section":"監督指針","tags":[]},{"no":632,"location":"Ⅱ－4－2－9(5)","comment":"団体扱契約においては、契約者は加入者であるが、あらかじめ団体において構成員(加入者)のメリットを考慮して商品群を選定し制度化しているため、比較可能な商品は団体の意思により選定された商品に限定されるとして、加365入者への比較推奨もその範囲内に限定してよいか。","pageStart":365,"pageEnd":366,"answer":"団体扱・集団扱契約についても、保険業法施行規則第227条の2第3項第4号ロの適用対象となるか否かについては、当該契約以外に「二以上の比較可能な同種の保険契約」に該当する保険契約があるか否かについて、顧客の意向との関係で、一般人の合理的な期待を基準として、保険契約の対象リスク、給付・保障(補償)内容、保険契約の特性・類型等を踏まえ、個別具体的かつ実質的に判断されるべきものです。\nその上で、契約主体ではない団体であったとしても、それが企業や官公庁であり、従業員の福利厚生のために、団体扱・集団扱契約を制度商品として選定し、その利点とともに、当該団体専用の保険契約として、従業員に適切に認識される態様で提供される場合には、当該契約は団体の都合ではなく団体の構成員の利益のための仕組みとして位置付けられるものと考えられます。\nこの場合には、当該団体において選定された保険契約の中から保険契約の提案・説明が保険募集人によって行われたとしても、保険契約者等の保護に欠けるおそれは少ないものと考えられることから、当該団体により選定されたという事情を「比較可能な同種の保険契約」の範囲を判断するに当たっての主な考慮要素とすることは、一概に否定されるものではないと考えます。","theme":"団体・団体扱い","section":"監督指針","tags":["比較推奨"]},{"no":633,"location":"Ⅱ－4－2－9(5)","comment":"団体が福利厚生制度として団体扱契約の保険会社を選別・指定している場合、保険代理店は当該団体の意向を受けて、契約者となる当該団体の構成員に対して「団体が福利厚生制度として保険会社を指定している」旨を説明することは、「保険募集人や乗合代理店の都合によることなく、合理的かつ一定の具体性を有する基準や理由等を説明している」との理解でよいか。","pageStart":366,"pageEnd":366,"answer":"団体扱・集団扱契約についても、保険業法施行規則第227条の2第3項第4号ロの適用対象となるか否かについては、当該契約以外に「二以上の比較可能な同種の保険契約」に該当する保険契約があるか否かについて、顧客の意向との関係で、一般人の合理的な期待を基準として、保険契約の対象リスク、給付・保障(補償)内容、保険契約の特性・類型等を踏まえ、個別具体的かつ実質的に判断されるべきものです。\nその上で、契約主体ではない団体であったとしても、それが企業や官公庁であり、従業員の福利厚生のために、団体扱・集団扱契約を制度商品として選定し、その利点とともに、当該団体専用の保険契約として、従業員に適切に認識される態様で提供される場合には、当該契約は団体の都合ではなく団体の構成員の利益のための仕組みとして位置付けられるものと考えられます。\nこの場合には、当該団体において選定された保険契約の中から保険契約の提案・説明が保険募集人によって行われたとしても、保険契約者等の保護に欠けるおそれは少ないものと考えられることから、当該団体により選定されたという事情を「比較可能な同種の保険契約」の範囲を判断するに当たっての主な考慮要素とすることは、一概に否定されるものではないと考えます。","theme":"団体・団体扱い","section":"監督指針","tags":[]},{"no":634,"location":"Ⅱ－4－2－9(5)","comment":"企業等がA保険会社及びB保険会社の団体扱火災保険(企業等の役職員を保険契約者とする火災保険)について集金事務委託契約を締結している中でA保険会社の団体扱火災保険のみを制度商品として指定している場合がある(両社の団体扱火災保険とも保険料は通常の火災保険より割引されるものの、それ以外の企業等の役職員にとってのメリットがA保険会社の団体扱火災保険の方が大きいなどの理由から、企業等によってA保険会社の団体扱火災保険のみが制度商品として指定される場合がある。)。\nこの場合、企業等は役職員に対して、A保険会社の団体扱火災保険のみを制度商品として提供していることになるため、A保険会社とB保険会社の乗合代理店(企業等とは異なる法人格である。)としては、当該企業等の指定を踏まえ当該企業等内ではA保険会社の団体扱火災保険のみを案内せざるを得ない状況にある。\nそのため、当該乗合代理店は、当該企業等内における団体扱火災保険の募集との関係では、A保険会社の団体扱火366災保険以外に「比較可能な同種の保険契約」がないと解されるという理解でよいか。\nなお、前提として、当該乗合代理店は、A保険会社の団体扱火災保険の募集に際して、適切に、保険業法が規定する権限明示を行うものとする。","pageStart":366,"pageEnd":367,"answer":"団体扱・集団扱契約についても、保険業法施行規則第227条の2第3項第4号ロの適用対象となるか否かについては、当該契約以外に「二以上の比較可能な同種の保険契約」に該当する保険契約があるか否かについて、顧客の意向との関係で、一般人の合理的な期待を基準として、保険契約の対象リスク、給付・保障(補償)内容、保険契約の特性・類型等を踏まえ、個別具体的かつ実質的に判断されるべきものです。\nその上で、契約主体ではない団体であったとしても、それが企業や官公庁であり、従業員の福利厚生のために、団体扱・集団扱契約を制度商品として選定し、その利点とともに、当該団体専用の保険契約として、従業員に適切に認識される態様で提供される場合には、当該契約は団体の都合ではなく団体の構成員の利益のための仕組みとして位置付けられるものと考えられます。\nこの場合には、当該団体において選定された保険契約の中から保険契約の提案・説明が保険募集人によって行われたとしても、保険契約者等の保護に欠けるおそれは少ないものと考えられることから、当該団体により選定されたという事情を「比較可能な同種の保険契約」の範囲を判断するに当たっての主な考慮要素とすることは、一概に否定されるものではないと考えます。","theme":"団体・団体扱い","section":"監督指針","tags":[]},{"no":635,"location":"Ⅱ－4－2－9(5)","comment":"団体(A社)においては、団体扱契約としてはB損保しか取り扱っていない(A社はB損保とのみ集金事務委託契約を締結していない。)が、当該団体扱契約を扱う代理店はB損保に加え、C損保も乗り合っている場合、新規契約時に代理店としてはC損保も扱っている旨を表明しなければならないと理解している。\n団体扱契約はB損保のみしか取り扱っていないということをもってB損保1社に絞り込み、推奨するということは許容されるか。\n契約者から「保険料が安い保険契約」という意向が顧客から示された場合に、団体扱割引があることをもって、保険料の多寡を示す証跡を提示せずにB損保のみを提示することは許容されるか伺いたい。\nまた、団体(A社)の意向はどの程度、勘案されるべきか。","pageStart":367,"pageEnd":367,"answer":"団体扱・集団扱契約についても、保険業法施行規則第227条の2第3項第4号ロの適用対象となるか否かについては、当該契約以外に「二以上の比較可能な同種の保険契約」に該当する保険契約があるか否かについて、顧客の意向との関係で、一般人の合理的な期待を基準として、保険契約の対象リスク、給付・保障(補償)内容、保険契約の特性・類型等を踏まえ、個別具体的かつ実質的に判断されるべきものです。\nその上で、契約主体ではない団体であったとしても、それが企業や官公庁であり、従業員の福利厚生のために、団体扱・集団扱契約を制度商品として選定し、その利点とともに、当該団体専用の保険契約として、従業員に適切に認識される態様で提供される場合には、当該契約は団体の都合ではなく団体の構成員の利益のための仕組みとして位置付けられるものと考えられます。\nこの場合には、当該団体において選定された保険契約の中から保険契約の提案・説明が保険募集人によって行われたとしても、保険契約者等の保護に欠けるおそれは少ないものと考えられることから、当該団体により選定されたという事情を「比較可能な同種の保険契約」の範囲を判断するに当たっての主な考慮要素とすることは、一概に否定されるものではないと考えます。","theme":"団体・団体扱い","section":"監督指針","tags":["証跡・記録"]},{"no":636,"location":"Ⅱ－4－2－9(5)","comment":"企業等の従業員が加入できる団体扱自動車保険において、代理店の意向ではなく、企業等の意向で提案できる保険会社が限定される場合、顧客の商品選択の機会が阻害されていると考えられるが、代理店ではなく企業等も規制の対象となるのか。\n例：企業等の意向により、団体扱契約において乗合代理367店が取り扱うことのできる3社のうち特定の1社のみの見積りを提示することになっている。","pageStart":367,"pageEnd":368,"answer":"団体扱・集団扱契約についても、保険業法施行規則第227条の2第3項第4号ロの適用対象となるか否かについては、当該契約以外に「二以上の比較可能な同種の保険契約」に該当する保険契約があるか否かについて、顧客の意向との関係で、一般人の合理的な期待を基準として、保険契約の対象リスク、給付・保障(補償)内容、保険契約の特性・類型等を踏まえ、個別具体的かつ実質的に判断されるべきものです。\nその上で、契約主体ではない団体であったとしても、それが企業や官公庁であり、従業員の福利厚生のために、団体扱・集団扱契約を制度商品として選定し、その利点とともに、当該団体専用の保険契約として、従業員に適切に認識される態様で提供される場合には、当該契約は団体の都合ではなく団体の構成員の利益のための仕組みとして位置付けられるものと考えられます。\nこの場合には、当該団体において選定された保険契約の中から保険契約の提案・説明が保険募集人によって行われたとしても、保険契約者等の保護に欠けるおそれは少ないものと考えられることから、当該団体により選定されたという事情を「比較可能な同種の保険契約」の範囲を判断するに当たっての主な考慮要素とすることは、一概に否定されるものではないと考えます。","theme":"団体・団体扱い","section":"監督指針","tags":[]},{"no":637,"location":"－","comment":"企業団体扱契約を販売する際、乗合保険会社各社に対象商品があっても、全ての保険会社を対象に比較推奨販売を行うことは困難である。\nまた、企業従業員向けの団体扱個人契約を取扱う際に、主に法人契約の引受のために取引している十数社の損害保険会社全社を対象に、従業員に対して比較推奨販売を行うことは現実的ではない。\nチェックオフ(給与天引き)する企業側の事情もあり、企業と協議を行った上で、乗合代理店が責任を持って説明や事故対応が可能な数社に絞り込んで比較推奨販売を行うことは、問題がないと考えてよいか。","pageStart":368,"pageEnd":368,"answer":"団体扱契約についても、集金事務委託契約の締結の有無に関わらず、「二以上の比較可能な同種の保険契約」がある場合で、それらの保険契約の中から顧客の意向に沿って選別・提案をするときには、保険業法施行規則第227条の2第3項第4号ロ(推奨販売)の適用対象となります。\n貴見にある「乗合代理店が責任を持って説明や事故対応が可能な数社に絞り込んで比較推奨販売を行う」といった対応は、顧客の意向把握の内容等が必ずしも明らかではないものの、同号ロの趣旨に鑑みれば、適切な対応とはいえないものと考えられます。","theme":"団体・団体扱い","section":"監督指針","tags":["比較推奨","意向把握"]},{"no":638,"location":"Ⅱ－4－2－9(5)","comment":"例えば、保険会社と集金事務委託契約を締結する団体であり、かつ、乗合代理店でもある金融機関の意向によって住宅ローン火災保険(住宅ローン債務者を保険契約者とする保険契約である。)に関して、複数の保険会社を引受保険会社とする共同保険が組成され、その引受保険会社の中から幹事保険会社が指定される場合がある。\n乗合代理店である金融機関は、かかる共同保険を募集する際に、共同保険の非幹事保険会社が単独で引き受ける住宅ローン火災保険(共同保険の住宅ローン火災保険と少しだけ商品特性が異なる)の委託を受けている場合であっても、共同保険が集金事務委託契約の締結によって単独引受保険と異なり保険料が割り引かれており、かつ、団体であ368る金融機関の意向により指定されて共同保険が組成されている以上、当該共同保険以外に「比較可能な同種の保険契約」はないと解されるという理解でよいか。","pageStart":368,"pageEnd":369,"answer":"団体扱契約においても、「二以上の比較可能な同種の保険契約」\nに該当するか否かは、顧客の意向との関係で、一般人の合理的な期待を基準として、保険契約の対象リスク、給付・保障(補償)内容、保険契約の特性・類型等を踏まえ、個別具体的かつ実質的に判断されるものです。\nその上で、金融機関が乗合代理店として保険募集を行う場合には、住宅ローン債務者である顧客の意向や利益を踏まえた対応が求められます。\nしたがって、金融機関が保険募集を行う場合に、保険料の割引の有無や、契約主体とならない金融機関の経営上の判断により共同保険の住宅ローン火災保険が用意されていることのみをもって、直ちに当該共同保険契約以外に「二以上の比較可能な同種の保険契約」が存在しないと判断することは適切ではなく、非幹事保険会社が単独で引き受ける住宅ローン火災保険についても、比較可能な同種の保険契約に該当するかどうかを上記の観点に照らし、個別具体的かつ実質的に判断される必要があると考えられます。","theme":"団体・団体扱い","section":"監督指針","tags":[]},{"no":639,"location":"Ⅱ－4－2－9(5)","comment":"団体扱契約を締結する旨の顧客意向があり、取り扱うことが可能な保険会社と不可能な保険会社がある場合、その時点で団体が取り扱うことが可能な保険会社商品に絞り込み、その中でさらに意向を踏まえた絞込を行うべきか。\nそれとも団体扱契約とそれ以外の両方を踏まえて意向把握をしなくてはならないのか。","pageStart":369,"pageEnd":369,"answer":"貴見にある「取り扱うことが可能な保険会社と不可能な保険会社がある場合」の具体的状況が明らかではありませんが、団体扱契約については、個人契約と同様、当該契約以外に「二以上の比較可能な同種の保険契約」に該当する保険契約があるかどうか、顧客の意向との関係で、一般人の合理的な期待を基準として、保険契約の対象リスク、給付・保障(補償)内容、保険契約の特性、契約類型等を踏まえ、個別具体的かつ実質的に判断される必要があります。\nなお、集金事務委託契約が締結されていることや団体が選定したことのみをもって、直ちに個人契約が比較可能な同種の保険契約から除外されるものではないことに留意が必要です。","theme":"団体・団体扱い","section":"監督指針","tags":["意向把握"]},{"no":640,"location":"Ⅱ－4－2－9(5)","comment":"団体扱契約は、団体の意向により保険商品が絞られているため、団体の意向を顧客の意向と捉えた上で、当該団体内で保険募集可能な団体扱契約の範囲内で比較推奨販売ルールを適用するとの考え方でよいか。\n369","pageStart":369,"pageEnd":370,"answer":"契約主体とならない団体の意向が当然に加入者の意向と同一になるものではありませんが、企業や官公庁が従業員の福利厚生のために、団体扱・集団扱契約を制度商品として選定し、その利点とともに、当該団体専用の保険契約として、構成員に適切に認識される態様で提供される場合には、当該契約は団体の都合ではなく団体の構成員の利益のための仕組みとして位置付けられるものと考えられます。\nこの場合には、当該団体において選定された保険契約の中から保険契約の提案・説明が保険募集人によって行われたとしても、保険契約者等の保護に欠けるおそれは少ないものと考えられることから、当該団体により選定されたという事情を「二以上の比較可能な同種の保険契約」の範囲を判断するに当たっての主要な考慮要素とすることは、一概に否定されるものではないと考えます。\nなお、集金事務委託契約が締結されていることや契約主体とはならない団体が選定したことのみをもって、直ちに個人契約が比較可能な同種の保険契約から除外されるものではないことに留意が必要です。","theme":"団体・団体扱い","section":"監督指針","tags":["比較推奨"]},{"no":641,"location":"Ⅱ－4－2－9(5)","comment":"監督指針Ⅱ－4－2－9(5)①B.について、団体扱契約の個人保険で、団体割引率の適用並びに保険料の領収を給与天引きで行っている場合、これらを理由に特定の保険会社の商品を推奨提案することについては、当該規定の提示・推奨する基準に即しているという理解で問題ないか。","pageStart":370,"pageEnd":370,"answer":"保険業法施行規則第227条の2第3項第4号ロの適用対象となるか否かについては、当該契約以外に「二以上の比較可能な同種の保険契約」に該当する保険契約があるかどうかを、顧客の意向との関係で、一般人の合理的な期待を基準として、保険契約の対象リスク、給付・保障(補償)内容、保険契約の特性・類型等を踏まえ、個別具体的かつ実質的に判断される必要があります。\nその上で、Ⅱ－4－2－9(5)①B.を満たすかどうかは、顧客が重視する意向と、「二以上の比較可能な同種の保険契約」とされた個々の保険契約の商品特性、保険料水準等との関係に照らし、選別や提示・推奨が行われているかについて、個別具体的に判断されるべきものと考えます。\nなお、保険料の割引があることや給与天引きが可能であること等のみをもって、常に特定の保険契約だけを提示・推奨できるものではなく、当該保険契約を提示・推奨する理由等が、顧客の意向に照らして合理的かつ一定の具体性を有する必要があります。\nまた、保険募集人による恣意的な誘導を伴う態様で意向把握や推奨販売が行われないよう留意する必要があります。","theme":"団体・団体扱い","section":"監督指針","tags":["意向把握"]},{"no":642,"location":"Ⅱ－4－2－9(5)","comment":"乗合代理店において、A保険会社は団体扱割引があり、B保険会社及びC保険会社は団体扱割引がない状況において、割引ありの保険料は割引なしの保険料よりも保険料が約10%安い。\nこの場合、合理的かつ一定の具体性を有する基準として団体扱割引ありのA社のみを推奨することは可能か。\n370","pageStart":370,"pageEnd":371,"answer":"保険業法施行規則第227条の2第3項第4号ロの適用対象となるか否かについては、当該契約以外に「二以上の比較可能な同種の保険契約」に該当する保険契約があるかどうかを、顧客の意向との関係で、一般人の合理的な期待を基準として、保険契約の対象リスク、給付・保障(補償)内容、保険契約の特性・類型等を踏まえ、個別具体的かつ実質的に判断される必要があります。\nその上で、Ⅱ－4－2－9(5)①B.を満たすかどうかは、顧客が重視する意向と、「二以上の比較可能な同種の保険契約」とされた個々の保険契約の商品特性、保険料水準等との関係に照らし、選別や提示・推奨が行われているかについて、個別具体的に判断されるべきものと考えます。\nなお、保険料の割引があることや給与天引きが可能であること等のみをもって、常に特定の保険契約だけを提示・推奨できるものではなく、当該保険契約を提示・推奨する理由等が、顧客の意向に照らして合理的かつ一定の具体性を有する必要があります。\nまた、保険募集人による恣意的な誘導を伴う態様で意向把握や推奨販売が行われないよう留意する必要があります。","theme":"団体・団体扱い","section":"監督指針","tags":["意向把握"]},{"no":643,"location":"－","comment":"保険業法施行規則第227条の2第3項第4号ハの廃止及び同号ロの改正に対する監督指針の改正に係る以下のような保険契約に関しては比較推奨販売のための情報提供は必要ではないものと考える。\n団体保険に関し、企業や組合などの団体が保険契約者として保険会社と契約している為、今回の監督指針である比較推奨販売から除外されるものと解釈するが、団体扱契約に関しても、「顧客自身が団体扱契約の割引や給与控除を望まない場合」、若しくは「団体扱契約以外の保険契約を希望した場合」以外には、比較推奨販売から除外することを求める。","pageStart":371,"pageEnd":371,"answer":"団体契約や団体扱契約であることのみをもって、比較推奨販売に係る規定の適用対象外となるものではありません。\n団体契約については、保険契約者である団体が、保険募集を受けた結果として一の保険契約を選択していること等を考慮要素として、当該契約以外に「比較可能な同種の保険契約」が存在しないと判断し得る場合があると考えられます。\nただし、取扱保険募集人が、被保険者となる者に対して、団体契約以外の保険契約を含めて独自に保険契約を選別・提案する場合には、その態様に応じて比較推奨販売に係る規定の適用関係を判断する必要があります。\n一方、団体扱契約については、単に保険料の割引があることや給与控除等があること、団体が選定したことのみをもって、比較推奨販売に係る規定の対象外となるものではありません。当該契約以外に「二以上の比較可能な同種の保険契約」がないかについては、顧客の意向との関係で、一般人の合理的な期待を基準として、保険契約の対象リスク、給付・保障(補償)内容、保険契約の特性・類型等を踏まえ、個別具体的かつ実質的に判断される必要があります。\nいずれにせよ、募集規制の潜脱とならないよう、保険契約者等の保護の観点から適切な体制整備を行うことが重要です。","theme":"団体・団体扱い","section":"監督指針","tags":["比較推奨","ハ方式","団体・団体扱い"]},{"no":644,"location":"Ⅱ－4－2－9(5)","comment":"次のようなケースでは選択の余地がなく保険契約を提示・推奨することになると考えられるが問題ないか。\nその場合に「顧客の求めに応じて」行う「当該提示・推奨する基準や理由等」については、選択の余地がない理由を説明することでよいか。\n団体扱となっている特定の保険会社の特定の商品を、当該団体の所属員に一括して提示・推奨する(団体との集団取扱契約・合意等に基づく募集のため)。\n団体との合意により、団体扱以外の特定の保険会社の特定の商品を、当該団体の所属員に一括して提示・推奨する(団体との合意の範囲で実施するため)。\n集団扱のため保険料割引のある、特定の保険会社の特定371の商品を、当該集団扱の対象顧客に対して提示・推奨する(割引により一般より有利となるため)。\nなお、別の保険会社の商品の提示を求める等の顧客意向が示された場合は、当然にそれら保険契約の概要又は契約内容を説明することを前提とする。","pageStart":371,"pageEnd":372,"answer":"団体契約や団体扱契約であることのみをもって、比較推奨販売に係る規定の適用対象外となるものではありません。\n団体契約については、保険契約者である団体が、保険募集を受けた結果として一の保険契約を選択していること等を考慮要素として、当該契約以外に「比較可能な同種の保険契約」が存在しないと判断し得る場合があると考えられます。\nただし、取扱保険募集人が、被保険者となる者に対して、団体契約以外の保険契約を含めて独自に保険契約を選別・提案する場合には、その態様に応じて比較推奨販売に係る規定の適用関係を判断する必要があります。\n一方、団体扱契約については、単に保険料の割引があることや給与控除等があること、団体が選定したことのみをもって、比較推奨販売に係る規定の対象外となるものではありません。当該契約以外に「二以上の比較可能な同種の保険契約」がないかについては、顧客の意向との関係で、一般人の合理的な期待を基準として、保険契約の対象リスク、給付・保障(補償)内容、保険契約の特性・類型等を踏まえ、個別具体的かつ実質的に判断される必要があります。\nいずれにせよ、募集規制の潜脱とならないよう、保険契約者等の保護の観点から適切な体制整備を行うことが重要です。","theme":"団体・団体扱い","section":"監督指針","tags":["比較推奨","団体・団体扱い"]},{"no":645,"location":"Ⅱ－4－2－9(5)","comment":"職域内及び共通した属性を持つ個人の集った集団等、特定環境下での団体扱商品を案内する場合、福利厚生制度などを鑑みた推定意向を入り口とした団体扱商品の案内を行った上で、その他の商品を希望するか確認することを想定しているが、監督指針Ⅱ－4－2－9(5)\n①B.(b)「顧客の意向が不明確な場合であっても、保険契約の選別に当たっては、例えば、顧客が特に重視すると考えられる事項を例示するなど、可能な限り顧客の意向を把握」に適応しているという理解でよいか。\nなお、「その他の商品を希望する」と回答があった場合には、改めて個別に意向把握の上、比較推奨・商品選定を行う想定でいる。","pageStart":372,"pageEnd":372,"answer":"Ⅱ－4－2－2(3)①ア.(注2)に記載される意向を推定する方法(意向推定型)は、例えば既契約者など、保険募集人が把握している顧客属性や生活環境等に基づき、推定の確度に十分留意しつつ、合理性・妥当性のある推定をもって意向把握を行う方法です。\n一方、Ⅱ－4－2－9(5)①B.(b)の「顧客が特に重視すると考えられる事項を例示する」行為は、保険募集人が顧客の意向把握を行ったものの顧客の意向が不明確な場合において、顧客が特に重視すると考えられる事項を例示することを通じ、顧客の意向形成を促すといった態様を「可能な限り顧客の意向を把握するための方法」の一つとして例示したものです。\nしたがって、両者は趣旨を異にするほか、保険契約者等の保護の観点から、意向推定は慎重に行われる必要があることから、団体や集団に対して意向推定の方法を用いた意向把握を行ったことのみをもって、顧客意向に沿うものとしてⅡ－4－2－9(5)①B.(b)を満たすと一律に判断されることは適当ではありません。\nその適切性については個別具体的に判断される必要があり、合理性・妥当性に欠ける意向推定が行われた場合には、意向把握・確認義務や情報提供義務が適切に履行されたことにはならない点に留意が必要となります。","theme":"団体・団体扱い","section":"監督指針","tags":["比較推奨","意向把握"]},{"no":646,"location":"Ⅱ－4－2－9(5)","comment":"同一法人内に複数の別個登録代理店が存在する場合に372おいて、別個登録代理店間での顧客紹介等を前提としつつ、合理的な理由がないにもかかわらず、恣意的に特定の保険会社を推奨する目的で、別個登録代理店ごとに特定保険会社の専属代理店とする、あるいは所属保険会社を意図的に絞り込むといった対応は、実質的に保険業法施行規則第227条の2第3項第4号ハを維持するものとして、比較推奨販売規制の潜脱と評価される理解でよいか。","pageStart":372,"pageEnd":373,"answer":"貴見のとおりです。\nなお、Ⅲ－2－1(1)④ウ.に規定される保険代理店の主たる事務所とは別に損害保険会社と取引を行う従たる事務所として別個に登録するといったものについては、今日的な意義等に照らし、今後廃止する予定です。","theme":"別個登録","section":"監督指針","tags":["比較推奨","ハ方式"]},{"no":647,"location":"Ⅱ－4－2－9(5)","comment":"別個登録代理店について、店舗ごとの業容・業態、経営管理上の理由等により、所属保険会社が異なり、結果として、同一法人内で異なる推奨方針を策定するケースがあり得る。\nしかし、異なる推奨方針を策定する合理的理由がなく、例えば、比較推奨販売規制の潜脱を目的とするおそれがある場合には、これは容認されないと考えてよいか。","pageStart":373,"pageEnd":373,"answer":"Ⅲ－2－1(1)④ウ.の規定に基づき、保険代理店の主たる事務所と同じく、独立して損害保険会社と取引を行う従たる事務所について、主たる事務所とは別個に登録した場合に、同一代理店内で、業容・業態等の違いに応じて異なる推奨方針を策定することは、直ちに否定されるものではありませんが、合理的な理由がなく、比較推奨販売規制を潜脱するおそれがあると評価される場合は適切ではありません。\nなお、当該監督指針の規定については、今日的な意義等に照らし、今後廃止する予定です。","theme":"別個登録","section":"監督指針","tags":["比較推奨"]},{"no":648,"location":"Ⅱ－4－2－9(5)","comment":"専属代理店AがM&A等により乗合代理店Bを吸収合併した場合、Bの既存契約者が、更新の都度、本人の意向によらず保険会社変更を余儀なくされるおそれがある。その顧客不利益を回避するため、Bを別個登録代理店として存続させ、従前の保険会社との契約継続・保全を可能とすることが考えられる。別個登録代理店として、独自マニュアルの整備等、必要な体制整備が講じられている場合、同一法人内で所属保険会社が異なることのみをもって、比較推奨販売規制の潜脱とみなされるものではないとの理解でよいか。\n373","pageStart":373,"pageEnd":373,"answer":"貴見のケースについては、現行のⅢ－2－1(1)④ウ.の規定に基づき保険代理店の主たる事務所とは別に損害保険会社と取引を行う従たる事務所として別個に登録するといったものを想定したものと考えられるため、業務上、合理的な理由があれば直ちに否定されるものではありません。\nただし、当該規定については、今日的な意義等に照らし、今後、廃止する予定であることから、これに留意した対応が必要と考えます。","theme":"別個登録","section":"監督指針","tags":["比較推奨","更改・継続"]},{"no":649,"location":"－","comment":"比較推奨販売を現行の乗合代理店の運営形態のままで一律に求めることは、実務上きわめて困難であると考える。\nそのため、無理に形式的な比較推奨を求めるのではなく、これまで認められていた代理店の別個登録・店舗単位運営のような専業代理店に近い形で、店舗ごとに取り扱う損害保険会社を明確に決定する運営方法も、現実的な選択肢として検討されるべきではないか。\n具体的には、店舗ごとに取扱損保をあらかじめ決定し、当該店舗で取り扱わない損害保険会社を希望する顧客については、該当損保を扱う他の店舗を案内する方法や、一定の移行期間(例えば1年程度)を設け、店舗単位で段階的に専属化を進めていく方法が考えられる。\nこのような形であれば、比較推奨を形式的に行う必要がなくなり、指導・監督の明確化や現場の混乱抑制にもつながると考える。","pageStart":374,"pageEnd":374,"answer":"貴重なご意見として承ります。\nなお、監督指針Ⅲ－2－1(1)④ウ.に規定される保険代理店の主たる事務所とは別に損害保険会社と取引を行う従たる事務所として別個に登録するといったものについては、今日的な意義等に照らし、今後廃止する予定です。","theme":"別個登録","section":"監督指針","tags":["比較推奨"]},{"no":650,"location":"Ⅱ－4－2－9(5)","comment":"自動車損害賠償責任保険(自動車損害賠償保障法第5条)\nは強制保険であり商品性や保険料に差がなく、比較推奨販売の対象外と理解している。\n代理店都合による保険会社選定等が行われることは、顧客の最善の利益を勘案して誠実かつ公正に業務を遂行する義務を果たす観点からは適切な対応とは言えないため、任意保険同様に代理店方針のみで加入保険会社を選定することは認められないとの理解でよいか。\n代理店方針のみで加入保険会社を選定しない方法とし374て、例えば、・前契約の保険会社で加入する・任意保険と同様の保険会社で加入する等の顧客意向を確認することが考えられる。\n一方で、顧客意向に基づいた保険会社を取り扱っていない等の場合であっても、当該代理店での加入を顧客が希望している場合には、顧客に加入保険会社の選択を促す前提で、顧客の理解を得ながら保険会社を決定するという理解でよいか。","pageStart":374,"pageEnd":375,"answer":"自動車損害賠償責任保険は、自動車損害賠償保障法に基づき加入が義務付けられており、補償内容や保険料が法令等により定められているため、一般の任意保険のように商品内容や保険料を比較して選択する性質は限定的です。\nしたがって、複数の保険会社の自動車損害賠償責任保険を取り扱っている場合であっても、保険業法施行規則第227条の2第3項第4号ロに係る対応が必要となるものではないと考えられます。\nなお、顧客から保険会社の指定がある場合には、その希望を踏まえて適切に対応する必要があります。また、指定がない場合であっても、保険代理店において、複数の保険会社の自動車損害賠償責任保険の取扱いがある場合、これら保険会社を顧客に明示した上で、例えば、前契約の保険会社、任意保険と同一の保険会社等、顧客が希望する保険会社がないか等を確認することが重要と考えられます。\nいずれにしても、顧客の最善利益を勘案せず、保険会社からの便宜供与、取引関係その他の代理店側の都合により、特定の保険会社の保険契約を恣意的に優先することは適切ではなく、保険代理店においては、顧客の希望に沿った保険契約の販売ができるよう体制を整備することが求められます。\nまた、顧客が希望する保険会社を当該代理店が取り扱っていない場合には、取扱可能な保険会社の範囲を説明し、顧客の理解を得た上で対応することが重要です。","theme":"自賠責保険","section":"監督指針","tags":["便宜供与","比較推奨","顧客の最善の利益"]},{"no":651,"location":"Ⅱ－4－2－9(5)","comment":"自動車損害賠償責任保険(自動車損害賠償保障法第5条)\nについて、商品性に差異はないと認識している。このため、顧客に特段の意向がない場合、代理店都合による選定も許容されるという理解でよいか。","pageStart":375,"pageEnd":375,"answer":"自動車損害賠償責任保険は、自動車損害賠償保障法に基づき加入が義務付けられており、補償内容や保険料が法令等により定められているため、一般の任意保険のように商品内容や保険料を比較して選択する性質は限定的です。\nしたがって、複数の保険会社の自動車損害賠償責任保険を取り扱っている場合であっても、保険業法施行規則第227条の2第3項第4号ロに係る対応が必要となるものではないと考えられます。\nなお、顧客から保険会社の指定がある場合には、その希望を踏まえて適切に対応する必要があります。また、指定がない場合であっても、保険代理店において、複数の保険会社の自動車損害賠償責任保険の取扱いがある場合、これら保険会社を顧客に明示した上で、例えば、前契約の保険会社、任意保険と同一の保険会社等、顧客が希望する保険会社がないか等を確認することが重要と考えられます。\nいずれにしても、顧客の最善利益を勘案せず、保険会社からの便宜供与、取引関係その他の代理店側の都合により、特定の保険会社の保険契約を恣意的に優先することは適切ではなく、保険代理店においては、顧客の希望に沿った保険契約の販売ができるよう体制を整備することが求められます。\nまた、顧客が希望する保険会社を当該代理店が取り扱っていない場合には、取扱可能な保険会社の範囲を説明し、顧客の理解を得た上で対応することが重要です。","theme":"自賠責保険","section":"監督指針","tags":["便宜供与"]},{"no":652,"location":"Ⅱ－4－2－9(5)","comment":"自動車損害賠償責任保険(自動車損害賠償保障法第5条)\nについては、保険商品としての補償内容が各保険会社で同一であるが、保険契約者に対する意向確認として、加入を希望する保険会社の確認まで必要か。","pageStart":375,"pageEnd":375,"answer":"自動車損害賠償責任保険は、自動車損害賠償保障法に基づき加入が義務付けられており、補償内容や保険料が法令等により定められているため、一般の任意保険のように商品内容や保険料を比較して選択する性質は限定的です。\nしたがって、複数の保険会社の自動車損害賠償責任保険を取り扱っている場合であっても、保険業法施行規則第227条の2第3項第4号ロに係る対応が必要となるものではないと考えられます。\nなお、顧客から保険会社の指定がある場合には、その希望を踏まえて適切に対応する必要があります。また、指定がない場合であっても、保険代理店において、複数の保険会社の自動車損害賠償責任保険の取扱いがある場合、これら保険会社を顧客に明示した上で、例えば、前契約の保険会社、任意保険と同一の保険会社等、顧客が希望する保険会社がないか等を確認することが重要と考えられます。\nいずれにしても、顧客の最善利益を勘案せず、保険会社からの便宜供与、取引関係その他の代理店側の都合により、特定の保険会社の保険契約を恣意的に優先することは適切ではなく、保険代理店においては、顧客の希望に沿った保険契約の販売ができるよう体制を整備することが求められます。\nまた、顧客が希望する保険会社を当該代理店が取り扱っていない場合には、取扱可能な保険会社の範囲を説明し、顧客の理解を得た上で対応することが重要です。","theme":"自賠責保険","section":"監督指針","tags":["便宜供与","意向把握"]},{"no":653,"location":"Ⅱ－4－2－9(5)","comment":"自動車損害賠償責任保険(自動車損害賠償保障法第5条)\nについては、補償内容及び保険料が法令により定められており、いずれの保険会社においても同一であることから、実質的に比較可能な商品とは言い難いと考えられる。\nこの点を踏まえ、・自動車損害賠償責任保険が「比較可能な同種の保険契約」に該当し、比較推奨販売の対象となるのか・対象となる場合、顧客の意向確認や比較説明として、375合理的に求められる内容・範囲について、考え方を明確にしていただきたい。","pageStart":375,"pageEnd":376,"answer":"自動車損害賠償責任保険は、自動車損害賠償保障法に基づき加入が義務付けられており、補償内容や保険料が法令等により定められているため、一般の任意保険のように商品内容や保険料を比較して選択する性質は限定的です。\nしたがって、複数の保険会社の自動車損害賠償責任保険を取り扱っている場合であっても、保険業法施行規則第227条の2第3項第4号ロに係る対応が必要となるものではないと考えられます。\nなお、顧客から保険会社の指定がある場合には、その希望を踏まえて適切に対応する必要があります。また、指定がない場合であっても、保険代理店において、複数の保険会社の自動車損害賠償責任保険の取扱いがある場合、これら保険会社を顧客に明示した上で、例えば、前契約の保険会社、任意保険と同一の保険会社等、顧客が希望する保険会社がないか等を確認することが重要と考えられます。\nいずれにしても、顧客の最善利益を勘案せず、保険会社からの便宜供与、取引関係その他の代理店側の都合により、特定の保険会社の保険契約を恣意的に優先することは適切ではなく、保険代理店においては、顧客の希望に沿った保険契約の販売ができるよう体制を整備することが求められます。\nまた、顧客が希望する保険会社を当該代理店が取り扱っていない場合には、取扱可能な保険会社の範囲を説明し、顧客の理解を得た上で対応することが重要です。","theme":"自賠責保険","section":"監督指針","tags":["便宜供与","比較推奨","意向把握"]},{"no":654,"location":"Ⅱ－4－2－9(5)","comment":"監督指針Ⅱ－4－2－9(5)に規定されている保険募集人の体制整備義務については、一般的な乗合代理店だけでなく、他の保険会社から委託を受けて保険募集を行う保険会社についても対象となるとの理解でよいかを確認したい。","pageStart":376,"pageEnd":376,"answer":"ご理解の通りです。\nⅡ－4－2－9(5)の「乗合代理店における比較推奨販売」については、保険業法施行規則第227条の2第3項第4号及び規則第234条の21の2第1項第2号に規定する二以上の所属保険会社等を有する保険募集人(乗合代理店)を対象とした規定です。\n他の保険会社から委託を受け保険募集を行う保険会社についても、業務特性や自らの実態(保険募集の実務や募集形態等)も踏まえつつ、適切かつ主体的に業務を遂行することができるよう実効性のある体制を整備することが重要と考えます。","theme":"体制整備","section":"監督指針","tags":["比較推奨"]},{"no":655,"location":"Ⅱ－4－2－9(5)","comment":"乗合代理店における比較推奨販売に関する体制整備については、代理店自らが、その戦略をふまえて、主体的に構築すべきである。\n例えば、比較推奨販売に関する提示・推奨する基準や理由は、顧客の最善利益を勘案した上で、所属保険会社の意向によらず、代理店自ら主体的に定めるべきであり、保険会社は、代理店における適切な商品選択の機会が阻害されないよう、その主体性を尊重しつつ、監督指針Ⅱ－4－2－1(4)に定める教育・管理・指導を行うことが求められているとの理解でよいか。","pageStart":376,"pageEnd":376,"answer":"貴見のとおりです。","theme":"体制整備","section":"監督指針","tags":["比較推奨"]},{"no":656,"location":"Ⅱ－4－2－9(5)","comment":"比較推奨販売に係る体制整備について、個人代理店や小規模の法人代理店において、独自の体制整備が難しい場合でも、法令や監督指針を踏まえて、適切かつ主体的に業務を遂行する体制を整備する必要がある、との理解でよい376か。","pageStart":376,"pageEnd":377,"answer":"貴見のとおりです。\nなお、保険募集人の体制整備義務については、個人・法人の別や保険代理店の規模を問わず課されます。\n乗合代理店においては、自らの規模・業務特性、募集形態、取扱商品等を踏まえ、法令及び監督指針に沿って、比較推奨販売を適切かつ主体的に行うための実効的な体制を整備する必要があります。","theme":"体制整備","section":"監督指針","tags":["比較推奨"]},{"no":657,"location":"Ⅱ－4－2－9(5)","comment":"改正案について、保険会社ごとに体制整備や意向確認に関する解釈・要請が異なり、代理店側で対応が困難となっている。\n特に人手不足の状況下において、すべての代理店が各社ごとに求められる体制を整備できるか懸念があるため、体制整備については代理店の規模や取扱保険等に応じた基準を示してほしい。\nまた、意向確認の記録方法についても、保険会社ごとに異なる対応が求められているため、業界全体で共通して使用可能な統一的な方法を検討してほしい。","pageStart":377,"pageEnd":377,"answer":"保険代理店における体制整備については、保険業法施行規則第227条の14に基づき、業務の健全かつ適切な運営を確保するため、その規模の大小を問わず求められます。\nまた、顧客の最善の利益を勘案しつつ、適切な商品選択の機会を確保するため、乗合代理店の規模や業務特性等に応じて、自社の募集実務や募集形態等を踏まえた適切な比較推奨販売が実施されるよう実効的な体制を整備することが重要と考えます。\nなお、意向確認の記録方法、部門設置や人員配置、管理手法等についても、一律の対応を求めるものではありません。","theme":"体制整備","section":"監督指針","tags":["比較推奨","意向把握","顧客の最善の利益","証跡・記録"]},{"no":658,"location":"Ⅱ－4－2－9(5)","comment":"比較推奨販売に係る体制整備は代理店規模を問わず義務付けられていると理解しているが、代理店の規模や業務実態に応じた運用とすること、または規模別の運用例を示してほしい。","pageStart":377,"pageEnd":377,"answer":"保険代理店における体制整備については、保険業法施行規則第227条の14に基づき、業務の健全かつ適切な運営を確保するため、その規模の大小を問わず求められます。\nまた、顧客の最善の利益を勘案しつつ、適切な商品選択の機会を確保するため、乗合代理店の規模や業務特性等に応じて、自社の募集実務や募集形態等を踏まえた適切な比較推奨販売が実施されるよう実効的な体制を整備することが重要と考えます。\nなお、意向確認の記録方法、部門設置や人員配置、管理手法等についても、一律の対応を求めるものではありません。","theme":"体制整備","section":"監督指針","tags":["比較推奨","意向把握","顧客の最善の利益","証跡・記録"]},{"no":659,"location":"Ⅱ－4－2－9(5)","comment":"比較推奨販売が適正に実施されているかを確認・検証する態勢については、代理店の規模や特性に応じた態勢と考えてよいか。\nまた、必ずしも営業部門から独立した内部監査部門を設置する必要はなく、小規模代理店(例：10名程度)においては、代理店主やコンプライアンス担当者による確認・監査も許容されるとの理解でよいかを確認したい。\n377","pageStart":377,"pageEnd":377,"answer":"保険代理店における体制整備については、保険業法施行規則第227条の14に基づき、業務の健全かつ適切な運営を確保するため、その規模の大小を問わず求められます。\nまた、顧客の最善の利益を勘案しつつ、適切な商品選択の機会を確保するため、乗合代理店の規模や業務特性等に応じて、自社の募集実務や募集形態等を踏まえた適切な比較推奨販売が実施されるよう実効的な体制を整備することが重要と考えます。\nなお、意向確認の記録方法、部門設置や人員配置、管理手法等についても、一律の対応を求めるものではありません。","theme":"体制整備","section":"監督指針","tags":["比較推奨","意向把握","顧客の最善の利益","証跡・記録"]},{"no":660,"location":"Ⅱ－4－2－9(5)","comment":"比較推奨販売に係る体制整備は、当該販売方法を用いた保険募集を行う乗合代理店に対して求められるものであるが、保険会社においても、乗合代理店に対する教育・指導・管理のなかで、適切な比較推奨販売を行うよう求め、問題があれば改善策を指示した上で、なお改善が認められない場合は毅然とした対応(当該保険会社の新規販売の停止や委託解除等)を行うべきである。\nまた、保険会社においては、監督指針Ⅱ－4－2－12(保険代理店等に対する便宜供与)、監督指針Ⅱ－4－2－13(保険代理店に対する出向)に則した対応・体制整備が必要であることに留意する必要がある、との理解でよいか。","pageStart":378,"pageEnd":378,"answer":"貴見のとおりです。\nなお、ご意見にある「改善が認められない場合」の対応については、各保険会社の経営判断の下、代理店委託契約に基づき適時・適切に実施されるべきものと考えます。","theme":"体制整備","section":"監督指針","tags":["便宜供与","比較推奨","出向","委託解除"]},{"no":661,"location":"－","comment":"乗合代理店における比較推奨販売に関する体制整備については、顧客の最善利益を勘案した上で、顧客の適切な商品選択の機会が阻害されないよう、また、代理店が主体的に定める前提で、保険会社が、代理店の規模や業務特性に応じて、関連する参考ツールや雛形等を参考として提供することは、監督指針Ⅱ－4－2－1(4)に定める教育・管理・指導に含まれるとの理解でよいか。","pageStart":378,"pageEnd":378,"answer":"貴見のとおりです。\nなお、ご意見にある「ツールや雛形等を提供する」に当たっては、Ⅱ－4－2－12に基づき、本来は保険代理店等が負担すべき費用を保険会社が負担する行為、又は保険代理店等が自らの責任において行うべき業務に対し保険会社が役務を提供する行為に該当しないかなど、顧客の適切な商品選択の機会を阻害するおそれがないかという観点から留意する必要があると考えます。","theme":"体制整備","section":"監督指針","tags":["比較推奨"]},{"no":662,"location":"Ⅱ－4－2－9(5)","comment":"比較推奨販売が適切に実施されているかを確認・検証するための実施頻度について、どの程度の頻度を想定しているのかを明らかにして欲しい。","pageStart":378,"pageEnd":378,"answer":"比較推奨販売の実施状況の確認・検証については、乗合代理店における募集実態やリスクの程度等を踏まえたうえで、合理的かつ実効的に行われる必要があるほか、確認・検証が形骸化することのないよう、その方法や頻度についても、自ら検討し、継続的に見直すことも必要と考えます。","theme":"体制整備","section":"監督指針","tags":["比較推奨"]},{"no":663,"location":"Ⅱ－4－2－9(5)","comment":"乗合代理店が策定する提示・推奨する基準や理由等に関する社内規則等は、想定される顧客の意向ごとに選別され378る保険契約を定めておき(その選別が合理的なものであるという前提)、その中から特定の保険契約を推奨する場合は、その推奨する基準や理由等を定めておくという理解でよいか。","pageStart":378,"pageEnd":379,"answer":"比較推奨販売に係る社内規則については、例えば、基本的な考え方や比較推奨販売に関する事項(提示・推奨する基準や理由等)、記録・証跡保存に関する事項(保存期間や保存方法な)を規定する必要があると考えます。\nなお、顧客の意向を一定類型化し、類型化された意向に対応する商品をツール等を用いて顧客の意向の特定に活用すること、及び基本的な考え方として当該取組を社内規則に定めることは否定されませんが、類型化された意向に対応する商品は流動的と考えられるため、特定の商品をあらかじめ社内規則等に定めることは不適切と考えます。","theme":"体制整備","section":"監督指針","tags":["比較推奨","証跡・記録"]},{"no":664,"location":"－","comment":"比較推奨販売の厳格化による実務負担の増加を見越し、乗合保険会社数の削減や専属化を検討する代理店が既に存在しており、今回の監督指針改正により、その動きが一層加速することが懸念される。\nこうした結果、顧客の選択肢が縮小し、顧客本位の業務運営に逆行するのみならず、顧客からの批判を招くおそれがあるため、現場実態を踏まえた柔軟な指針運用を行うべきではないか。","pageStart":379,"pageEnd":379,"answer":"貴重なご意見として承ります。\n比較推奨販売に係る体制整備については、顧客の最善の利益を勘案しつつ、適切な商品選択の機会を確保するため、乗合代理店の規模や業務特性等に応じて、自社の募集実務や募集形態等を踏まえた適切な比較推奨販売が実施されるよう実効的な体制が整備されることが重要であり、監督指針は、一律かつ画一的な対応や、規模・業務特性等に照らして過度な実務上の負担を求める趣旨ではありません。\nまた、保険募集人(乗合代理店)には、法令に基づき、自らの所属保険会社等の保険商品について、顧客の最善の利益を勘案しつつ、公正な保険募集を行うことが求められています。そのため、保険契約者等の保護の観点から、自らの規模や業務特性に見合った体制整備を図ることが必要と考えます。","theme":"体制整備","section":"監督指針","tags":["比較推奨","顧客の最善の利益"]},{"no":665,"location":"－","comment":"比較推奨販売に係る実務負担が大きくなることで、同業他社を含め、乗合として取り扱う保険会社数を減らす動きが広がっている。今後、比較推奨の負担が一層重くなれば、この傾向が加速し、結果として顧客の選択肢が狭まり、顧客利益を損なうおそれがあるのではないか。","pageStart":379,"pageEnd":379,"answer":"貴重なご意見として承ります。\n比較推奨販売に係る体制整備については、顧客の最善の利益を勘案しつつ、適切な商品選択の機会を確保するため、乗合代理店の規模や業務特性等に応じて、自社の募集実務や募集形態等を踏まえた適切な比較推奨販売が実施されるよう実効的な体制が整備されることが重要であり、監督指針は、一律かつ画一的な対応や、規模・業務特性等に照らして過度な実務上の負担を求める趣旨ではありません。\nまた、保険募集人(乗合代理店)には、法令に基づき、自らの所属保険会社等の保険商品について、顧客の最善の利益を勘案しつつ、公正な保険募集を行うことが求められています。そのため、保険契約者等の保護の観点から、自らの規模や業務特性に見合った体制整備を図ることが必要と考えます。","theme":"体制整備","section":"監督指針","tags":["比較推奨","顧客の最善の利益"]},{"no":666,"location":"－","comment":"比較推奨販売に伴う実務負担が増加することで、乗合代理店が負担軽減を目的として取り扱う保険会社数を減らす動きが生じ、その結果、顧客が選択できる保険会社や商品が減少し、顧客利益が損なわれる可能性があるのではな379いか。","pageStart":379,"pageEnd":380,"answer":"貴重なご意見として承ります。\n比較推奨販売に係る体制整備については、顧客の最善の利益を勘案しつつ、適切な商品選択の機会を確保するため、乗合代理店の規模や業務特性等に応じて、自社の募集実務や募集形態等を踏まえた適切な比較推奨販売が実施されるよう実効的な体制が整備されることが重要であり、監督指針は、一律かつ画一的な対応や、規模・業務特性等に照らして過度な実務上の負担を求める趣旨ではありません。\nまた、保険募集人(乗合代理店)には、法令に基づき、自らの所属保険会社等の保険商品について、顧客の最善の利益を勘案しつつ、公正な保険募集を行うことが求められています。そのため、保険契約者等の保護の観点から、自らの規模や業務特性に見合った体制整備を図ることが必要と考えます。","theme":"体制整備","section":"監督指針","tags":["比較推奨","顧客の最善の利益"]},{"no":667,"location":"－","comment":"乗合代理店が取り扱う保険会社数が増えることで、商品説明や比較に要する工数が増加し、また、保険会社ごとに異なるシステムへの対応が煩雑化することにより、事務ミスが生じやすくなるおそれがある。その結果、加入漏れや再契約といった顧客不利益や負担増加につながる可能性があるのではないか。","pageStart":380,"pageEnd":380,"answer":"貴重なご意見として承ります。\n比較推奨販売に係る体制整備については、顧客の最善の利益を勘案しつつ、適切な商品選択の機会を確保するため、乗合代理店の規模や業務特性等に応じて、自社の募集実務や募集形態等を踏まえた適切な比較推奨販売が実施されるよう実効的な体制が整備されることが重要であり、監督指針は、一律かつ画一的な対応や、規模・業務特性等に照らして過度な実務上の負担を求める趣旨ではありません。\nまた、保険募集人(乗合代理店)には、法令に基づき、自らの所属保険会社等の保険商品について、顧客の最善の利益を勘案しつつ、公正な保険募集を行うことが求められています。そのため、保険契約者等の保護の観点から、自らの規模や業務特性に見合った体制整備を図ることが必要と考えます。","theme":"体制整備","section":"監督指針","tags":["比較推奨","顧客の最善の利益","システム・比較ツール"]},{"no":668,"location":"Ⅱ－4－2－9(5)","comment":"顧客の中には、限られた時間の中で、簡潔かつ要点を押さえた説明を希望する者も多い。比較推奨への対応が形式的に長時間の説明を求める運用となるのではなく、説明内容や範囲について、顧客の意向や状況に応じて柔軟に対応できる運用が望ましいと考えられる。","pageStart":380,"pageEnd":380,"answer":"貴重なご意見として承ります。\n比較推奨販売に係る体制整備については、顧客の最善の利益を勘案しつつ、適切な商品選択の機会を確保するため、乗合代理店の規模や業務特性等に応じて、自社の募集実務や募集形態等を踏まえた適切な比較推奨販売が実施されるよう実効的な体制が整備されることが重要であり、監督指針は、一律かつ画一的な対応や、規模・業務特性等に照らして過度な実務上の負担を求める趣旨ではありません。\nまた、保険募集人(乗合代理店)には、法令に基づき、自らの所属保険会社等の保険商品について、顧客の最善の利益を勘案しつつ、公正な保険募集を行うことが求められています。そのため、保険契約者等の保護の観点から、自らの規模や業務特性に見合った体制整備を図ることが必要と考えます。","theme":"体制整備","section":"監督指針","tags":["比較推奨","顧客の最善の利益"]},{"no":669,"location":"－","comment":"規則第227条の2第3項第4号ハの廃止及び同号ロの改正に関連した監督指針の改正に対し、下記の意見を表明する。\n現状、各損害保険会社の代理店に対する規模や増収率に偏った代理店手数料格差が生じた状態において、今回の代理店に課された比較推奨販売を遂行するには、営利企業として特定の保険契約を推奨する場合に、監督指針案Ⅱ－4－2－9(5)①B.(a)に記載の「乗合代理店の都合によることなく、合理的かつ一定の具体性を有する基準や理由等を説明」する事は現実的ではないと考える。\nまた、乗合代理店における顧客の意向として、迅速な保険契約の締結が第一である場合等、(b)\n顧客の意向が不明確な場合(注3)\n「顧客の意向を顧みず、営業上の理由から380恣意的に特定の保険契約へ誘導する事のないよう留意する」とあるが、顧客の意向を顧みた上で、営業上の理由(特定の保険会社の事務手続き・経営方針上の理由)を説明した上で、特定の保険会社の保険契約を提示・推奨する事は許容されるべきであると考える。\n現状のまま、乗り合い代理店の比較推奨販売の確保の為の情報提供に係る規定を改正、施行した場合、多くの乗合代理店は保険商品毎の乗合の解消、若しくは専属代理店への移行に繋がり、それにより、結果的には顧客の選択肢が減少し、顧客本位ではない改正になりかねないと考える。","pageStart":380,"pageEnd":381,"answer":"貴重なご意見として承ります。\n比較推奨販売に係る体制整備については、顧客の最善の利益を勘案しつつ、適切な商品選択の機会を確保するため、乗合代理店の規模や業務特性等に応じて、自社の募集実務や募集形態等を踏まえた適切な比較推奨販売が実施されるよう実効的な体制が整備されることが重要であり、監督指針は、一律かつ画一的な対応や、規模・業務特性等に照らして過度な実務上の負担を求める趣旨ではありません。\nまた、保険募集人(乗合代理店)には、法令に基づき、自らの所属保険会社等の保険商品について、顧客の最善の利益を勘案しつつ、公正な保険募集を行うことが求められています。そのため、保険契約者等の保護の観点から、自らの規模や業務特性に見合った体制整備を図ることが必要と考えます。","theme":"体制整備","section":"監督指針","tags":["手数料・インセンティブ","比較推奨","ハ方式","顧客の最善の利益"]},{"no":670,"location":"Ⅱ－4－2－9(5)","comment":"顧客に対してカーライフ全般をサポートする中で、とりわけ保険については時間をかけた過度な説明を求めない顧客も多く、比較推奨の対応について、顧客の希望に沿った柔軟な運用となるよう定めていただきたい。","pageStart":381,"pageEnd":381,"answer":"貴重なご意見として承ります。\n比較推奨販売に係る体制整備については、顧客の最善の利益を勘案しつつ、適切な商品選択の機会を確保するため、乗合代理店の規模や業務特性等に応じて、自社の募集実務や募集形態等を踏まえた適切な比較推奨販売が実施されるよう実効的な体制が整備されることが重要であり、監督指針は、一律かつ画一的な対応や、規模・業務特性等に照らして過度な実務上の負担を求める趣旨ではありません。\nまた、保険募集人(乗合代理店)には、法令に基づき、自らの所属保険会社等の保険商品について、顧客の最善の利益を勘案しつつ、公正な保険募集を行うことが求められています。そのため、保険契約者等の保護の観点から、自らの規模や業務特性に見合った体制整備を図ることが必要と考えます。","theme":"体制整備","section":"監督指針","tags":["比較推奨","顧客の最善の利益"]},{"no":671,"location":"Ⅱ－4－2－9(5)","comment":"比較推奨販売に係る体制整備の一環として言及されている「保険代理店等に対する便宜供与」について、保険募集に関連するシステム費用を保険会社が負担する場合、その費用水準の適切性を検証することが難しく、過度の便宜供与の抜け道となるおそれがある。\nこのため、保険会社においては、細かなガイドラインの整備や検証体制の構築により、過度の便宜供与を防止すべきである。\n381","pageStart":381,"pageEnd":382,"answer":"貴重なご意見として承ります。\n保険代理店等に対する便宜供与については、Ⅱ－4－2－12に基づき、顧客の適切な商品選択の機会を阻害するおそれがないかという観点から、その適切性を確認することが重要です。\nその内容や水準等が過度の便宜供与(本来は保険代理店等が負担すべき費用を保険会社が負担する行為、又は保険代理店等が自らの責任において行うべき業務に対し保険会社が役務を提供する行為)に該当しないかについては、個別具体的に判断されるべきものです。\n各保険会社においては、監督指針の趣旨を踏まえ必要に応じて内部ルールや検証態勢を整備するなど、便宜供与が顧客本位の業務運営を損なうことのないよう、適切に対応していくことが求められます。","theme":"体制整備","section":"監督指針","tags":["便宜供与","比較推奨","システム・比較ツール"]},{"no":672,"location":"Ⅱ－4－2－9(5)","comment":"比較推奨販売への負担増に伴い、乗合代理店から専属代理店への移行を検討する代理店も出てくると想定されるが、保険会社と代理店の今後の関係性について、貴庁の見解を伺いたい。","pageStart":382,"pageEnd":382,"answer":"保険募集人(乗合代理店)には、法令に基づき、自らの所属保険会社等の保険商品について、顧客の最善の利益を勘案しつつ、公正な保険募集を行うことが求められています。そのため、保険契約者等の保護の観点から、自らの規模や業務特性に見合った体制整備を図ることが必要と考えます。\nまた、保険会社と保険代理店の関係については、過度の便宜供与や不適切な出向によって、顧客の適切な商品選択の機会が阻害されないよう留意しつつ、法令に基づく教育・管理・指導を通じて、公正な保険募集と顧客本位の業務運営を確保することが重要と考えます。","theme":"体制整備","section":"監督指針","tags":["便宜供与","比較推奨","顧客の最善の利益","出向"]},{"no":673,"location":"Ⅱ－4－2－9(5)","comment":"監督指針Ⅱ－4－2－9(5)②ウ.(注)において、「顧客の意向や属性に応じた比較推奨販売に係る説明が適切に行われているか確認・検証できるものであること」とされているが、これは、「顧客の属性」に応じて保険契約を選別・推奨することを意図したものではなく、顧客保護等(Ⅱ－4－4)の規定に照らし、顧客の年齢等の属性を踏まえた説明が適切に行われているかを確認・検証する趣旨との理解でよいか。","pageStart":382,"pageEnd":382,"answer":"貴見のとおりです。\nⅡ－4－2－9(5)②ウ.(注)における「顧客の意向や属性に応じた比較推奨販売に係る説明」とは、Ⅱ－4－4における「顧客保護等」の趣旨を踏まえ、顧客の年齢、知識、経験等に応じて、比較推奨販売に係る説明が分かりやすく適切に行われているかを事後的に確認・検証できる状態を求めるものです。\nしたがって、当該記載は、顧客の属性のみを理由として保険契約を選別・推奨することを求める趣旨ではありません。\n一方で、顧客の属性が顧客の意向や理解度、説明方法に影響する場合には、その点を踏まえた適切な説明が行われる必要があります。","theme":"証跡保存","section":"監督指針","tags":["比較推奨"]},{"no":674,"location":"Ⅱ－4－2－9(5)","comment":"比較推奨販売に係る記録や証跡の保存については、法令等で特段の定めがある場合を除き、乗合代理店が、事後検382証の実行可能性や顧客保護の観点を踏まえて、合理的な保存期間を社内規則等で定め、その規則に従って運用・保存していれば、適切な態勢整備が図られていると理解してよいか。","pageStart":382,"pageEnd":383,"answer":"貴見のとおりです。\n比較推奨販売に係る記録・証跡等の保存期間については、法令等で特段の定めがある場合を除き、一律の期間を求めるものではありません。\n各乗合代理店において、自社の規模・業務特性、募集形態等を踏まえ、比較推奨販売の適切性を事後的に確認・検証し、必要な改善につなげることが可能となる合理的な保存期間を社内規則等で定め、それに従って適切に運用することが重要です。","theme":"証跡保存","section":"監督指針","tags":["比較推奨","証跡・記録"]},{"no":675,"location":"Ⅱ－4－2－9(5)","comment":"監督指針にいう「比較推奨販売の適切性に関して、効率的かつ効果的に確認・検証しているか」とは、どのような状態を指すのか。\n効率的・効果的と評価されるための具体的な基準や考え方を明らかにしてほしい。","pageStart":383,"pageEnd":383,"answer":"効率的かつ効果的に確認・検証している状態とは、乗合代理店の規模・業務特性、募集形態等を踏まえ、比較推奨販売の適切性について、リスクに応じた合理的な方法により確認・検証が行われている状態をいうものです。\n例えば、全件確認を一律に求めるものではなく、苦情・不祥事の発生状況、保険募集人・拠点ごとの傾向、特定の保険会社又は特定の保険契約への偏り等を踏まえたサンプリング調査や重点確認を行うことも考えられます。\nまた、確認・検証の結果、問題や改善点が認められた場合には、保険募集人への教育・管理・指導、社内規則や記録方法の見直し等、必要な業務改善につなげることも重要です。","theme":"証跡保存","section":"監督指針","tags":["比較推奨","証跡・記録"]},{"no":676,"location":"－","comment":"適切な比較推奨販売とは、どのような観点・基準で判断するのか。具体的な基準や考え方を示してほしい。\n383","pageStart":383,"pageEnd":384,"answer":"適切な比較推奨販売が行われているかは、画一的な基準への形式的な適合のみで判断されるものではありません。\n例えば、顧客の意向や属性が適切に把握されているか、当該意向に沿って比較可能な同種の保険契約から合理的に選別・推奨されているか、提示・推奨の基準や理由が顧客に分かりやすく説明されているか、特定の保険会社又は特定の保険契約を不当に誘引していないか等を踏まえ、総合的に判断されるものと考えます。\nまた、これらの対応が事後的に確認・検証できるよう、必要な記録・証跡を保存し、確認・検証結果を必要に応じて業務改善に活用する体制が整備されていることも重要です。","theme":"証跡保存","section":"監督指針","tags":["比較推奨","証跡・記録"]},{"no":677,"location":"Ⅱ－4－2－9(5)","comment":"「証跡等の保存に当たっては、顧客保護等(Ⅱ－4－4)の規定も踏まえつつ、顧客の意向や属性に応じた比較推奨販売に係る説明が適切に行われているか確認・検証できるもの」とされているが、乗合代理店の規模・特性に応じて、確認・検証が可能な形で、乗合代理店が顧客に説明、確認した事実を証跡等により保存する体制が求められているものであり、その証跡等については、必ずしも、顧客による署名等を要するものではないという理解でよいか。","pageStart":384,"pageEnd":384,"answer":"貴見のとおりです。\nⅡ－4－2－9(5)②ウ.は、乗合代理店の規模や業務特性を踏まえ、顧客の意向や属性に応じた比較推奨販売に係る説明が適切に行われているかを、事後的に確認・検証できる体制を求めるものです。\nしたがって、説明・確認を行った事実や内容が客観的に確認できる形で保存されていれば足り、証跡等について、顧客の署名・押印等を一律に求める趣旨ではありません。","theme":"証跡保存","section":"監督指針","tags":["比較推奨","証跡・記録"]},{"no":678,"location":"Ⅱ－4－2－9(5)","comment":"比較推奨販売の適切性に関する記録・証跡の効率的な確認・検証方法として、乗合代理店が実施するモニタリング等において、顧客の意向と保険募集人が選別した保険契約の対応関係の適切性について、提示・推奨理由が、顧客の最善利益を踏まえたものかどうか、あるいは、合理的かつ一定の具体性を有しているか、といった観点から、サンプリング調査を実施することも選択肢として考えられるかを確認したい。","pageStart":384,"pageEnd":384,"answer":"比較推奨販売の実施状況に係る確認・検証について、金融庁として、一定の頻度、一律の方法又は確認水準を定めるものではありません。\n各乗合代理店においては、自社の規模・業務特性、募集形態、苦情・不祥事の発生状況、特定の保険会社又は特定の保険契約への偏り等のリスク等を踏まえ、合理的な頻度・方法により確認・検証を行うことが重要です。\n確認・検証の方法としては、全件確認を一律に求めるものではなく、例えば、顧客の利益に照らして不適切な偏りがないか等の観点から、サンプリング調査を行うことも、効率的かつ効果的な確認・検証方法の一つと考えられます。\nただし、サンプリング調査を行う場合においては、サンプリングの対象や抽出方法等において、実効的な検証が出来るよう、慎重に検討する必要があります。\nまた、確認・検証の結果、課題が認められた場合には、保険募集人への教育・管理・指導、社内規則や記録方法の見直し等、必要な業務改善につなげることも重要と考えられます。","theme":"証跡保存","section":"監督指針","tags":["比較推奨","証跡・記録"]},{"no":679,"location":"Ⅱ－4－2－9(5)","comment":"監督指針Ⅱ－4－2－9(5)②について、「定期的かつ必要に応じて、その実施状況を確認・検証する態勢が構築されているか」とあるが、確認・検証の頻度や厳格さがどの程度求められるのか。また、規模や業務特性に応じた柔軟な対応がどこまで許容されるのか伺いたい。\n384","pageStart":384,"pageEnd":385,"answer":"比較推奨販売の実施状況に係る確認・検証について、金融庁として、一定の頻度、一律の方法又は確認水準を定めるものではありません。\n各乗合代理店においては、自社の規模・業務特性、募集形態、苦情・不祥事の発生状況、特定の保険会社又は特定の保険契約への偏り等のリスク等を踏まえ、合理的な頻度・方法により確認・検証を行うことが重要です。\n確認・検証の方法としては、全件確認を一律に求めるものではなく、例えば、顧客の利益に照らして不適切な偏りがないか等の観点から、サンプリング調査を行うことも、効率的かつ効果的な確認・検証方法の一つと考えられます。\nただし、サンプリング調査を行う場合においては、サンプリングの対象や抽出方法等において、実効的な検証が出来るよう、慎重に検討する必要があります。\nまた、確認・検証の結果、課題が認められた場合には、保険募集人への教育・管理・指導、社内規則や記録方法の見直し等、必要な業務改善につなげることも重要と考えられます。","theme":"証跡保存","section":"監督指針","tags":["比較推奨","証跡・記録"]},{"no":680,"location":"Ⅱ－4－2－9(5)","comment":"監督指針Ⅱ－4－2－9(5)②に関し、更新契約については、保険会社から更新案内が送付され、そのまま顧客がWEB上で手続きを完結する場合がある。このような場合には、乗合代理店の都合による保険契約の選別や提示・推奨が行われないため、販売の適切性等の確認・検証に必要となる記録や証跡は不要との理解で問題ないか。","pageStart":385,"pageEnd":385,"answer":"比較推奨販売に係る記録・証跡等は、乗合代理店が保険契約の比較・選別・提示・推奨に関与した場合に、その適切性を事後的に確認・検証するためのものです。\nしたがって、更新契約において、保険会社からの更新案内に基づき顧客が自らWEB上で手続きを完結し、乗合代理店による新たな比較・選別・提示・推奨が行われていない場合には、当該乗合代理店において比較推奨販売に係る記録・証跡を、その都度保存することが一律に求められるものではありません。\n一方で、WEB上での手続きの過程において、乗合代理店が更新時に商品内容の変更提案、他社保険契約との比較、特定の保険契約の推奨等に実質的に関与する場合には、その態様に応じて、比較推奨販売に係る説明及び記録・証跡の保存が必要となります。","theme":"証跡保存","section":"監督指針","tags":["比較推奨","証跡・記録","更改・継続"]},{"no":681,"location":"Ⅱ－4－2－9(5)","comment":"比較推奨販売の適切性の確認・検証のために記録や証跡等の保存を求めているが、満期更新において、同一の保険会社・同一の保険種目で更新し、かつ、補償内容が縮小しない場合であっても、都度、比較推奨を行い、その記録を残す必要があるのか。","pageStart":385,"pageEnd":385,"answer":"顧客が既契約の更新を主体的に希望し、乗合代理店による新たな比較・選別・提示・推奨が実質的に伴わない場合には、比較推奨販売に係る記録・証跡等の保存を一律に求めるものではありません。\n一方、乗合代理店が他の保険契約との比較説明又は特定の保険契約の選別・提示・推奨を行う場合には、その内容に応じた説明を行い、適切性を事後検証できる記録・証跡等を保存する必要があります。","theme":"証跡保存","section":"監督指針","tags":["比較推奨","証跡・記録","更改・継続"]},{"no":682,"location":"－","comment":"他保険代理店から契約が移管された契約で、引受保険会社や引受割合が変更される場合には、移管先乗合代理店の全ての乗合保険会社を示し、前契約の保険会社へ恣意的に385誘導することなく、比較推奨販売方針に従って契約者の意向を確認し、その証跡を残す必要があるとの理解でよいか。\nまた、過去の移管契約についても、意向確認が十分でなかった場合には、改めて意向確認・証跡保存が必要との理解でよいか。","pageStart":385,"pageEnd":386,"answer":"他の保険代理店から契約が移管された後の契約であっても、移管先の乗合代理店が、引受保険会社の変更又は引受割合の変更を含め、保険契約を選別し、提示・推奨を行う場合には、比較推奨販売に係る規定の適用関係を踏まえた対応が必要となります。\nその場合、移管先代理店においては、顧客の意向を適切に把握・確認し、当該意向に沿って合理的に保険契約を選別・推奨するとともに、その内容を事後的に確認・検証できるよう、必要な記録・証跡を保存することが重要です。\n一方で、過去に移管された契約について、今回の監督指針改正を理由として、遡って顧客意向の確認や記録・証跡の再作成を一律に求めるものではありません。\nただし、今後の更新・更改等に際して、保険契約を選別し、提示・推奨を行う場合には、その時点で顧客の意向を適切に確認し、必要な対応を行うことが求められます。","theme":"証跡保存","section":"監督指針","tags":["比較推奨","意向把握","証跡・記録","更改・継続"]},{"no":683,"location":"Ⅱ－4－2－9(5)","comment":"DMにアンケート要素を盛り込むなどして、来店前に一定の意向把握が行われた上で顧客が来店するケースも想定される。その場合であっても、他の保険契約を取り扱っている旨の説明を行い、顧客が他の保険契約や保険種目の紹介を望まなかったことが、事後的に確認できるような体制整備が必要と考えるが如何か。","pageStart":386,"pageEnd":386,"answer":"DM等にアンケートを盛り込むなどして、来店前に一定の意向把握を行うこと自体は否定されるものではありません。\nただし、DMについて、アンケートと称して、特定の保険契約の推奨・提案を意図した意向把握を行うことは比較推奨販売に係る規制を潜脱するものとなり、不適切となります。\nまた、当該アンケートのみで顧客の意向把握が常に完結するものではなく、来店時の募集実態に応じて、顧客の意向を適切に確認し、必要な情報提供や比較推奨販売に係る対応を行う必要があります。\nなお、証跡については、画一的・詳細な記録を一律に求めるものではなく、顧客の主な意向、説明内容、他保険契約の案内を希望しない旨等を、募集実態に即して合理的な方法で確認できる程度で足りるものと考えます。","theme":"証跡保存","section":"監督指針","tags":["比較推奨","意向把握","証跡・記録"]},{"no":684,"location":"Ⅱ－4－2－9(5)","comment":"保険会社からは、意向把握に関する記録として、保険会386社又は保険契約選別に至った証跡の保存が必須との指導を受けているが、金融庁としても同様の考えか。\nまた、当初の意向に基づいて保険会社又は保険契約を選別して提案した後、提案過程で顧客の意向が具体化・変化し、結果的に当初選定とは異なる保険契約を選択した場合、保存している証跡と異なる申込みとなるが、それ自体が問題となるのか。","pageStart":386,"pageEnd":387,"answer":"意向把握や比較推奨販売に係る記録・証跡は、顧客の意向を踏まえた合理的な提案が行われているかを事後的に確認・検証するためのものであり、保険会社又は保険契約の選別に至る判断過程を網羅的に保存することを一律に求めるものではありません。\n一方で、顧客の意向に基づきどのような比較・選別・推奨が行われたかを、事後的に確認できる程度の記録・証跡を保存することは必要です。\nまた、提案過程において顧客の意向が明確化又は変化し、当初選定した保険契約とは異なる保険契約を選択すること自体が直ちに問題となるものではありません。その場合には、意向の変化や最終的な選択理由が合理的に説明できるよう、必要な範囲で記録・証跡を整備することが重要です。","theme":"証跡保存","section":"監督指針","tags":["比較推奨","意向把握","証跡・記録"]},{"no":685,"location":"－","comment":"比較推奨販売に関し、乗合代理店としての推奨に関する全体的な考え方(方針)を示すだけでは足りず、全ての案件について、全ての項目を契約者に説明し、かつ、その説明を行った証跡を残す必要があるのか(生命保険における意向確認のような運用が必要になるのか)を確認したい。","pageStart":387,"pageEnd":387,"answer":"比較推奨販売においては、全ての案件について、全ての項目を契約者に網羅的に説明し、その全てについて証跡を残すことを一律に求めるものではありません。\n重要なのは、保険業法施行規則第227条の2第3項第4号の趣旨を踏まえ、顧客の意向や商品特性、募集形態等に応じて、顧客の判断に必要な事項が分かりやすく説明されていることです。\nまた、記録・証跡についても、当該募集において、顧客の意向に沿った比較・選別・推奨が合理的に行われていたかを事後的に確認・検証できる内容である必要があります。\nなお、保険代理店として推奨方針や判断基準を定める場合であっても、それが個別の顧客意向に照らして適切に運用されていることが重要です。","theme":"証跡保存","section":"監督指針","tags":["比較推奨","意向把握","証跡・記録"]},{"no":686,"location":"Ⅱ－4－2－9(5)","comment":"比較推奨販売に係る記録や証跡について、どのような記録方法が認められるのか、保存期間はどの程度か、保存す387べき内容(項目)は何か、を明確にしてほしい。","pageStart":387,"pageEnd":388,"answer":"比較推奨販売に係る記録・証跡等については、比較推奨販売の実施状況の適切性を事後的に確認・検証し、必要に応じて改善することが重要であることから、その確認・検証に資する記録や証跡等を作成・保存する体制を整備することを求めたものであり、保存内容、保存媒体、保存方法、保存期間等について、一律の方法や水準を定めるものではありません。\n各乗合代理店において、自社の規模・業務特性、募集形態、取扱商品、苦情・不祥事の発生状況、特定の保険会社又は特定の保険契約への偏り等のリスク等を踏まえ、合理的な頻度・方法により確認・検証を行うことが重要です。\n保存内容については、顧客の主な意向、顧客の属性、意向把握の方法、比較・選別の対象範囲、提示・推奨した保険契約、提示・推奨の基準や理由、顧客への説明内容の概要等を記録することが考えられます。当該募集が顧客の意向に沿って合理的に行われたかを、事後的に確認できる程度の記録・証跡が必要です。ただし、顧客との全ての発言、応答、反応や、乗合代理店の詳細な判断過程を網羅的に記録することを一律に求めるものではありませんが、顧客の意向が変化した場合など、最終的な提示・推奨又は申込内容との関係を説明する上で重要な事情は、必要な範囲で記録することが望ましいと考えます。\n保存媒体・保存形式については、紙媒体に限りません。電子データ、システム入力記録、音声データ、録画データ等を用いることも考えられます。また、顧客の署名・押印付き書面を一律に求めるものではありません。事後的に客観的な確認・検証が可能な方法で保存されていれば足りるものと考えます。\n保存方法については、比較説明時に使用したパンフレット、見積書、チェックリスト、意向確認シート、推奨判断結果シート等を保存する方法も考えられます。その上で、比較ポイントや提示・推奨理由を要約して記録する方法も、事後検証が可能であれば差し支えありません。また、記録システム等におけるプルダウン方式による記録も活用し得ます。ただし、選択肢のみでは顧客意向や推奨理由との関係を十分に確認できない場合には、必要に応じて補足記録を行うことが重要です。\n保存期間については、法令等に特段の定めがある場合を除き、一律の期間を求めるものではありません。各乗合代理店において、契約の性質、保険期間、募集形態、苦情・紛争対応、顧客保護、個人情報保護、事後検証の必要性等を踏まえ、合理的な保存期間を社内規則等で定め、適切に運用することが重要です。\n非対面募集についても、募集実態に応じた合理的な方法で記録・保存することが重要です。例えば、通話記録、システム入力記録、電子的な意向確認結果等により、顧客の意向確認や説明内容を事後的に確認できる態勢を整備することが考えられます。\n確認・検証方法については、全件確認を一律に求めるものではありません。乗合代理店の規模・業務特性、募集形態、苦情・不祥事の発生状況、特定の保険会社又は特定の保険契約への偏り、保険募集人ごとの傾向の確認に加え、保険業法施行規則第227条の2第3項第4号ハが廃止されているかについて、拠点ごとの傾向等を踏まえた確認・検証をする必要があると考えます。その上で、サンプリングや重点確認を含むリスクベースの方法により、効率的かつ実効的に確認・検証することが考えられます。確認・検証の結果、課題が認められた場合には、保険募集人への教育・管理・指導、社内規則や記録方法の見直し等、必要な業務改善につなげることが求められます。\n金融庁として、比較推奨販売に係る記録や証跡等の保存について、一律の記録フォーマット、記載項目、保存媒体、保存期間又は確認・検証方法を定めるものではありません。各乗合代理店においては、形式的な記録作成に偏らず、実効的な記録・検証態勢を整備することが重要であり、顧客本位の業務運営が実質的に確保されることが重要と考えます。","theme":"証跡保存","section":"監督指針","tags":["比較推奨","ハ方式","意向把握","証跡・記録","システム・比較ツール"]},{"no":687,"location":"Ⅱ－4－2－9(5)","comment":"比較推奨販売に係る記録・保管方法について、施行に向けて準備に着手したいものの、具体的にどのような手段で、どのような記録を管理すべきか、実務上のイメージが描きにくい。\n記録や管理方法が過度に煩雑な場合、対応が一時的なものにとどまり、制度として定着しないおそれがある。\n比較推奨販売の記録・保管方法について、監督当局等からの要請に対し、内容を再現・提示できるものであれば、紙媒体、電子データ(PDF等)など、保存形式は問わないとの理解でよいか。\n比較説明時に使用したパンフレット、見積書等をエビデンスとして保管し、記録については説明時の比較ポイント等を要約して残す運用でも差し支えないか。\n実務対応の統一を図る観点から、推奨される記録フォーマットや記載項目について、参考例を示していただきたい。","pageStart":388,"pageEnd":388,"answer":"比較推奨販売に係る記録・証跡等については、比較推奨販売の実施状況の適切性を事後的に確認・検証し、必要に応じて改善することが重要であることから、その確認・検証に資する記録や証跡等を作成・保存する体制を整備することを求めたものであり、保存内容、保存媒体、保存方法、保存期間等について、一律の方法や水準を定めるものではありません。\n各乗合代理店において、自社の規模・業務特性、募集形態、取扱商品、苦情・不祥事の発生状況、特定の保険会社又は特定の保険契約への偏り等のリスク等を踏まえ、合理的な頻度・方法により確認・検証を行うことが重要です。\n保存内容については、顧客の主な意向、顧客の属性、意向把握の方法、比較・選別の対象範囲、提示・推奨した保険契約、提示・推奨の基準や理由、顧客への説明内容の概要等を記録することが考えられます。当該募集が顧客の意向に沿って合理的に行われたかを、事後的に確認できる程度の記録・証跡が必要です。ただし、顧客との全ての発言、応答、反応や、乗合代理店の詳細な判断過程を網羅的に記録することを一律に求めるものではありませんが、顧客の意向が変化した場合など、最終的な提示・推奨又は申込内容との関係を説明する上で重要な事情は、必要な範囲で記録することが望ましいと考えます。\n保存媒体・保存形式については、紙媒体に限りません。電子データ、システム入力記録、音声データ、録画データ等を用いることも考えられます。また、顧客の署名・押印付き書面を一律に求めるものではありません。事後的に客観的な確認・検証が可能な方法で保存されていれば足りるものと考えます。\n保存方法については、比較説明時に使用したパンフレット、見積書、チェックリスト、意向確認シート、推奨判断結果シート等を保存する方法も考えられます。その上で、比較ポイントや提示・推奨理由を要約して記録する方法も、事後検証が可能であれば差し支えありません。また、記録システム等におけるプルダウン方式による記録も活用し得ます。ただし、選択肢のみでは顧客意向や推奨理由との関係を十分に確認できない場合には、必要に応じて補足記録を行うことが重要です。\n保存期間については、法令等に特段の定めがある場合を除き、一律の期間を求めるものではありません。各乗合代理店において、契約の性質、保険期間、募集形態、苦情・紛争対応、顧客保護、個人情報保護、事後検証の必要性等を踏まえ、合理的な保存期間を社内規則等で定め、適切に運用することが重要です。\n非対面募集についても、募集実態に応じた合理的な方法で記録・保存することが重要です。例えば、通話記録、システム入力記録、電子的な意向確認結果等により、顧客の意向確認や説明内容を事後的に確認できる態勢を整備することが考えられます。\n確認・検証方法については、全件確認を一律に求めるものではありません。乗合代理店の規模・業務特性、募集形態、苦情・不祥事の発生状況、特定の保険会社又は特定の保険契約への偏り、保険募集人ごとの傾向の確認に加え、保険業法施行規則第227条の2第3項第4号ハが廃止されているかについて、拠点ごとの傾向等を踏まえた確認・検証をする必要があると考えます。その上で、サンプリングや重点確認を含むリスクベースの方法により、効率的かつ実効的に確認・検証することが考えられます。確認・検証の結果、課題が認められた場合には、保険募集人への教育・管理・指導、社内規則や記録方法の見直し等、必要な業務改善につなげることが求められます。\n金融庁として、比較推奨販売に係る記録や証跡等の保存について、一律の記録フォーマット、記載項目、保存媒体、保存期間又は確認・検証方法を定めるものではありません。各乗合代理店においては、形式的な記録作成に偏らず、実効的な記録・検証態勢を整備することが重要であり、顧客本位の業務運営が実質的に確保されることが重要と考えます。","theme":"証跡保存","section":"監督指針","tags":["比較推奨","ハ方式","意向把握","証跡・記録","システム・比較ツール"]},{"no":688,"location":"Ⅱ－4－2－9(5)","comment":"監督指針Ⅱ－4－2－9(5)②ウ.について、以下の点を確認させていただきたい。\n➀比較推奨販売の適切性を確認・検証するための記録・証跡の残し方について、想定している具体的な基準や考え方はあるか。\n例えば、顧客とのやり取りを音声データとして保存する方法、文書として保存する方法、チェックリスト等により要点のみを記録する方法などが考えられるが、これらの取388扱いについての考え方があれば伺いたい。\n②当該記録や証跡等の保存期間について、監督上想定している期間や考え方はあるか。\n記録内容には、個人情報や、必要に応じてセンシティブな情報が含まれる可能性もあることから、念のため確認させていただきたい。\n終身契約が多い生命保険や退職後も長く契約をいただいている自動車保険等を勘案すると、記録の保存は長期間必要ではないかと考えている。\n③「効率的かつ効果的」な確認・検証について、確認・検証の頻度や実施方法(全件確認かサンプリング等)に関し、想定している水準や考え方があれば伺いたい。","pageStart":388,"pageEnd":389,"answer":"比較推奨販売に係る記録・証跡等については、比較推奨販売の実施状況の適切性を事後的に確認・検証し、必要に応じて改善することが重要であることから、その確認・検証に資する記録や証跡等を作成・保存する体制を整備することを求めたものであり、保存内容、保存媒体、保存方法、保存期間等について、一律の方法や水準を定めるものではありません。\n各乗合代理店において、自社の規模・業務特性、募集形態、取扱商品、苦情・不祥事の発生状況、特定の保険会社又は特定の保険契約への偏り等のリスク等を踏まえ、合理的な頻度・方法により確認・検証を行うことが重要です。\n保存内容については、顧客の主な意向、顧客の属性、意向把握の方法、比較・選別の対象範囲、提示・推奨した保険契約、提示・推奨の基準や理由、顧客への説明内容の概要等を記録することが考えられます。当該募集が顧客の意向に沿って合理的に行われたかを、事後的に確認できる程度の記録・証跡が必要です。ただし、顧客との全ての発言、応答、反応や、乗合代理店の詳細な判断過程を網羅的に記録することを一律に求めるものではありませんが、顧客の意向が変化した場合など、最終的な提示・推奨又は申込内容との関係を説明する上で重要な事情は、必要な範囲で記録することが望ましいと考えます。\n保存媒体・保存形式については、紙媒体に限りません。電子データ、システム入力記録、音声データ、録画データ等を用いることも考えられます。また、顧客の署名・押印付き書面を一律に求めるものではありません。事後的に客観的な確認・検証が可能な方法で保存されていれば足りるものと考えます。\n保存方法については、比較説明時に使用したパンフレット、見積書、チェックリスト、意向確認シート、推奨判断結果シート等を保存する方法も考えられます。
