売の一例としてあり得るものと考えます。\n個別具体的に判断すべき事項であり一概に回答することは困難ですが、一般論として、乗合代理店が未契約の顧客に対し、顧客が提案を希望する保険会社について、恣意性を排除して確認し、顧客が自ら選択した保険契約を提示することは、顧客の意向に沿った選別に該当し得ます。\nただし、顧客の意向を確認する際、顧客が自らのリスクや保険ニーズを適切に認識し、意向を表明できるようにする必要があり、商品特性や保険料水準といった保険商品に関する事項を含めることが重要と考えます。\nなお、保険会社名の提示方法、表示順、選択肢、説明内容等により、特定の保険会社又は特定の保険契約へ誘導するものとなっていないか留意する必要があります。また、顧客が保険会社名ではなく、補償内容、保険料水準、事故対応、付帯サービス等を重視する意向を示した場合には、当該意向に沿って適切に選別し、提示・推奨する必要があります。\nいずれの場合も、顧客の意向、選別理由及び説明内容を事後的に確認・検証できる態勢を整備することも重要です。\n貴見において想定されている場面が必ずしも明確ではありませんが、特定の保険契約を提示・推奨する場合には、Ⅱ－4－2－9(5)①B.(a)に基づき、顧客の意向に沿って、合理的かつ一定の具体性を有する基準や理由等を説明する必要があります。\nまた、乗合代理店においては、同(5)②ア.に基づき、代理店自身の規模や業務特性を踏まえつつ、提示・推奨する基準や理由等について、社内規則等に定め、保険募集人ごとに恣意的・属人的な運用とならないよう管理することも重要です。\nなお、社内規則等を定める場合も、あらかじめ特定保険会社を推奨するための方針ではなく、顧客意向に沿って保険契約を選別し、提示・推奨を行うための判断の枠組み、記録・検証態勢等を定めた上で、保険募集人への教育・管理・指導を徹底することが重要であると考えます。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["意向把握","証跡・記録"]},{"no":478,"location":"Ⅱ－4－2－9(5)","comment":"監督指針Ⅱ－4－2－9(5)①B.(a)に記載されている「特定の保険契約を推奨する場合には、顧客の最善の利益を勘278案したものとして、保険募集人や乗合代理店の都合によることなく、合理的かつ一定の具体性を有する基準や理由等を説明しているか」を踏まえ、乗合代理店の社内ルールに募集ルール基準を明文化し、場合によっては顧客に署名をもらうことも検討した上で募集活動を行う必要があるという理解でよいか。\nまた、今後、保険会社の不祥事が発生した場合などにおいて、募集ルール基準の変更を行う際は、乗合代理店におけるルール変更として都度変更・整備を行うという理解でよいか。","pageStart":278,"pageEnd":279,"answer":"ご意見にあるプロセスは、顧客の意向把握及び推奨販売の一例としてあり得るものと考えます。\n個別具体的に判断すべき事項であり一概に回答することは困難ですが、一般論として、乗合代理店が未契約の顧客に対し、顧客が提案を希望する保険会社について、恣意性を排除して確認し、顧客が自ら選択した保険契約を提示することは、顧客の意向に沿った選別に該当し得ます。\nただし、顧客の意向を確認する際、顧客が自らのリスクや保険ニーズを適切に認識し、意向を表明できるようにする必要があり、商品特性や保険料水準といった保険商品に関する事項を含めることが重要と考えます。\nなお、保険会社名の提示方法、表示順、選択肢、説明内容等により、特定の保険会社又は特定の保険契約へ誘導するものとなっていないか留意する必要があります。また、顧客が保険会社名ではなく、補償内容、保険料水準、事故対応、付帯サービス等を重視する意向を示した場合には、当該意向に沿って適切に選別し、提示・推奨する必要があります。\nいずれの場合も、顧客の意向、選別理由及び説明内容を事後的に確認・検証できる態勢を整備することも重要です。\n貴見において想定されている場面が必ずしも明確ではありませんが、特定の保険契約を提示・推奨する場合には、Ⅱ－4－2－9(5)①B.(a)に基づき、顧客の意向に沿って、合理的かつ一定の具体性を有する基準や理由等を説明する必要があります。\nまた、乗合代理店においては、同(5)②ア.に基づき、代理店自身の規模や業務特性を踏まえつつ、提示・推奨する基準や理由等について、社内規則等に定め、保険募集人ごとに恣意的・属人的な運用とならないよう管理することも重要です。\nなお、社内規則等を定める場合も、あらかじめ特定保険会社を推奨するための方針ではなく、顧客意向に沿って保険契約を選別し、提示・推奨を行うための判断の枠組み、記録・検証態勢等を定めた上で、保険募集人への教育・管理・指導を徹底することが重要であると考えます。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["意向把握","顧客の最善の利益","証跡・記録"]},{"no":479,"location":"Ⅱ－4－2－9(5)","comment":"乗合代理店において顧客が特に重視する事項を丁寧かつ明確に確認した際、例えば、「事故発生時に迅速な対応をしてくれる保険会社」といった意向が示された場合、保険募集人の経験による主観で推奨することは保険業法第300条第1項第6号(監督指針Ⅱ－4－2－2(9))に抵触するため不可と考えるがこの認識に相違ないか。\n279","pageStart":279,"pageEnd":280,"answer":"個別具体的に判断されますが、保険募集人の経験や主観を根拠として、特定の保険会社又は特定の保険契約を推奨することは適切ではありません。\n特に、客観的根拠なく、他社より優良であるかのように説明する場合や、顧客に誤認を与える態様で説明する場合には、保険業法第300条第1項第1号又は第6号に抵触するおそれがあります。\nなお、顧客が商品特性に直結しない事項を重視している場合においては、顧客の意向に沿った補償内容等の保険商品に関係する事項について提示・推奨する理由として情報提供をするとともに、合理性・具体性や顧客の比較判断に資する客観的事項か否かに留意して説明する場合には、推奨理由の一要素とすることまで否定されるものではありません。\nその場合でも、顧客の意向との関係で合理的かつ一定の具体性を有する説明を行い、事後的に確認・検証できる態勢を整備することも重要です。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":[]},{"no":480,"location":"Ⅱ－4－2－9(5)","comment":"比較推奨販売を適切に行うための措置として、監督指針Ⅱ－4－2－9(5)②ア.において、乗合代理店は、「上記①における提示・推奨する基準や理由等について、社内規則等に規定しているか。」とされており、乗合代理店が監督指針Ⅱ－4－2－9(5)①B.に基づき提示・推奨する理由は、顧客の意向に照らして、当該乗合代理店が社内規則等で定めるものに基づくものであり、所属保険募集人ごと各々の事情に応じた基準・理由等による提示・推奨が許容されるものではない、との理解でよいか。\n一方で、同じ乗合代理店に所属する複数の保険募集人が、監督指針Ⅱ－4－2－9(5)に基づき、比較推奨販売を行う場合において、顧客の意向に沿って適切に保険契約を選別した上で提示・推奨する際、必ずしも保険募集人の間で同一商品が提示・推奨されるとは限らないことが考えられるが、こうしたこともあり得るとの理解でよいか。","pageStart":280,"pageEnd":280,"answer":"貴見のとおりです。\n同一乗合代理店内であっても、顧客の意向、属性、既加入契約、重視する事項等が異なれば、社内規則等に基づく同一の判断枠組みを用いた結果として、保険募集人ごと又は案件ごとに提示・推奨される保険契約が異なることはあり得ると考えます。ただし、保険募集人ごとの属人的・恣意的な判断により異なる保険契約を提示・推奨することは適切ではありません。\nなお、特定の保険契約を提示・推奨する基準や理由等についての社内規則等は、乗合代理店自身の規模や業務特性を踏まえつつ、保険募集人ごとに恣意的な運用とならないよう、例えば、顧客意向の把握方法、顧客が重視する事項の確認方法、提示・推奨する基準や理由、顧客への説明方法、記録・検証方法などを組織的に適切に定めたうえで、各店舗又は各保険募集人に対し教育・管理・指導を徹底することが重要であると考えます。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["比較推奨","証跡・記録"]},{"no":481,"location":"Ⅱ－4－2－9(5)","comment":"「合理的かつ一定の具体性を有する」とは、商品特性等について「合理的かつ一定の具体性」を有している必要があると考えてよいか。例えば、「人気のある商品である」\n等という説明ではなく、保障(補償)内容、保険料、保障(補償)期間、付帯サービス等の点で合理的かつ一定の具体性が必要という意味と考えてよいか。","pageStart":280,"pageEnd":280,"answer":"貴見のとおりです。\n「合理的かつ一定の具体性を有する基準や理由」とは、単に「人気商品である」や「販売実績が多い」等の抽象的な説明では足りず、顧客が重視する事項との関係で、保障(補償)内容、保障(補償)\n期間、特約等の商品特性や保険料水準を踏まえた合理的かつ具体的な説明であり、顧客の比較判断に資する事項である必要があります。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":[]},{"no":482,"location":"－","comment":"保険業法施行規則第227条の2第3項第4号ハの廃止について、確かに代理店都合による推奨保険会社の選定につい280ては問題事案が発生したものの、一方で、保険募集人個人または店舗単位で顧客本位の業務運営に即した推奨販売方針を定めていれば問題はなかったものと考えている。\n例えば、損害サービスの拠点数や要員数という形だけの選定基準ではなく、保険募集人が顧客と接する中で事故対応の良い保険会社であると顧客満足を間近で感じた保険会社を推奨保険会社とする。また、保険募集人で引受が完結できない照会に対する保険会社の回答の速さは顧客満足度に繋がる。\n保険募集人個人又は店舗単位(保険募集人ごとに推奨保険会社を選定し集計等)で選定基準及び選定結果を記録に残し、一定のサイクルで定期的に推奨保険会社の選定を行う社内規則を定めることで代理店都合を排除し、形式的ではない顧客の声を反映した推奨販売方針を策定できる。\n上記運用により本質的な顧客本位の業務運営を実現できるものと考えるため、本運用による新たな(ニ)方式を提案する。","pageStart":280,"pageEnd":281,"answer":"貴重なご意見として承ります。\n今般の改正は、顧客の意向に基づかず、乗合代理店があらかじめ定めた推奨方針により、特定の保険契約を提示・推奨するなど、顧客の意向に沿わない保険契約の提示・推奨する方式(保険業法施行規則第227条の2第3項第4号ハ)を廃止し、顧客の意向に沿った比較推奨販売を確保する趣旨のものです。\nしたがって、保険募集人個人又は店舗単位で、あらかじめ推奨保険会社を選定し、その方針に基づき保険契約を提示・推奨する運用は、顧客の意向に基づく選別とはいえず、適切ではありません。\nまた、社内規則等を定める場合も、あらかじめ特定保険会社を推奨するための方針ではなく、顧客意向に沿って保険契約を選別し、提示・推奨するための判断の枠組み、記録・検証態勢等を定めた上で、保険募集人への教育・管理・指導を徹底することも重要であると考えます。\nなお、特定の保険契約を提示・推奨する場合、保険会社からの便宜供与、資本・取引関係など代理店側の都合に基づく事項を基準や理由等とすることは、不適切と考えます。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["便宜供与","比較推奨","ハ方式","証跡・記録"]},{"no":483,"location":"－","comment":"過度な便宜供与や利益相反は、顧客に不利益を与えるため本来あってはならないものであることから、法令の厳格化は必要と考えているものの、保険業法施行規則第227条の2第3項第4号ハは、顧客の確認・了承を得たうえで実施しているものであるため、存置しても良いと考える。","pageStart":281,"pageEnd":281,"answer":"貴重なご意見として承ります。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["便宜供与","ハ方式"]},{"no":484,"location":"－","comment":"顧客の意向に沿った保険契約の推奨を行う際に、顧客から示された意向及び顧客への推奨理由について記録を残したとしても、顧客と保険募集人とでは知識の差があるこ281とから、比較する内容・商品の特性等の説明を行ったとしても代理店有利となってしまい、保険募集人単位で、認識にばらつきが生じてしまうのではないか。ある程度顧客へ宣言した上で商品説明を行う保険業法施行規則第227条の2第3項第4号ハは残した方がよいのではないか。","pageStart":281,"pageEnd":282,"answer":"貴重なご意見として承ります。\n比較推奨販売においては、保険募集人の恣意的な判断により特定の保険契約への誘導や提示・推奨することがないよう、社内規則等において提示・推奨の基準や理由等について定め、当該枠組みに基づき運用することが重要です。\n一方で、顧客の意向、属性、既加入契約、重視する事項等が異なれば、同一の判断枠組みに基づいても、保険募集人又は案件ごとに提示・推奨される保険契約が異なることはあり得ると考えられます。\nその場合でも、Ⅱ－4－2－9(5)①に基づき、合理的かつ一定の具体性を有する提示・推奨する基準や理由等を、顧客に分かりやすく説明するとともに、事後的に比較推奨販売の適切性を確認・検証できる態勢を整備する必要があります。\nなお、顧客にあらかじめ推奨方針を説明したとしても、顧客意向に基づかず代理店の都合で保険契約を絞り込む運用は、今般の改正の趣旨に照らし適切ではありません。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["比較推奨","ハ方式","証跡・記録"]},{"no":485,"location":"Ⅱ－4－2－9(5)","comment":"顧客のことを第一に考えると比較説明の保険業法施行規則第227条の2第3項第4号イ(以下、イ方式とする。)がベストだと思うが、実際に保険募集を行っている立場からすると、多くの顧客は取扱保険契約すべての説明を求めていないように感じる。\n現在、同号ハ(以下、ハ方式とする。)を採用している当社からすれば、イ方式に変更することで保険募集に要する時間が推奨販売よりも格段に増加することになり、顧客、乗合代理店双方にとって合理的な募集形態ではないように感じる。\n推奨販売であっても取扱保険契約すべての説明、保険料の試算を求める顧客もいるため、推奨商品を受け入れるか282否かは顧客次第であるため、ハ方式の問題点を是正して復活させることを検討いただきたい。\nハ方式を悪と考えて廃止するのであれば、推奨販売を禁止して、比較説明のイ方式のみにするという考えもあると思う。\n乗合代理店は、多くの顧客のニーズに応えるために取扱保険契約を増やしてきたため、乗り合っていることが乗合代理店だけでなく顧客にとっても負担にならないよう、制度構築していただきたい。","pageStart":282,"pageEnd":283,"answer":"貴重なご意見として承ります。\n今般の監督指針改正は、乗合代理店における比較推奨販売について、代理店の都合や、あらかじめ定めた推奨方針による商品選別ではなく、顧客の意向に沿った保険契約の選別・提案を適切に行い、顧客の適切な商品選択の機会を確保することを明確化するものです。\n一方で、全ての案件について、全取扱保険契約を網羅的に説明・試算することや、比較説明のみの方法に限定することを一律に求めるものではありません。顧客の意向、商品特性、募集形態、代理店の規模・業務特性等を踏まえ、顧客の理解に資する実効的な対応を行うことが重要です。\n金融庁としては、乗合代理店において、顧客の適切な商品選択の機会を確保しつつ、形式的・過度な負担に偏ることなく、顧客本位の業務運営が実質的に確保されるよう、引き続き、適切にモニタリングしてまいります。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["比較推奨","ハ方式"]},{"no":486,"location":"－","comment":"大手損保会社の保険契約には、特約、金額も含めてほとんど差がないため、そもそも比較する必要があるのかと考えている。\n募集フローの煩雑化により顧客と乗合代理店の時間と労力だけが増えており、顧客もそこまで求めているのか疑問である。","pageStart":283,"pageEnd":283,"answer":"貴重なご意見として承ります。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":[]},{"no":487,"location":"Ⅱ－4－2－9(5)","comment":"顧客が複数の乗合代理店で保険加入の検討を行う場合、乗合代理店ごとに推奨する保険契約が異なる場合、顧客はどの保険契約を選ぶべきか混乱してしまうことが想定される。\nこのような事態を防ぐため、各保険会社の商品特性など公平性の観点から公共機関(第三者機関)による選定システム又は基準等が必要ではないか。判断基準の統一性がないと乗合代理店によって選定基準の偏りがでることを懸念している。\n283","pageStart":283,"pageEnd":284,"answer":"貴重なご意見として承ります。\n比較推奨販売において、顧客の意向、顧客属性、リスク許容度、商品内容等を踏まえた結果として、乗合代理店ごとに提示・推奨する保険会社や保険契約が異なること自体が、直ちに不適切となるものではありません。\n一方で、提示・推奨理由が乗合代理店ごとに恣意的・属人的なものとなり、手数料水準、販売実績、便宜供与等の乗合代理店の都合により特定の保険会社又は特定の保険契約へ誘導することは適切ではありません。\nそのため、乗合代理店においては、社内規則等において提示・推奨する基準や理由等について定め、顧客の意向に沿って合理的かつ一定の具体性を有する説明を行うとともに、事後的に検証できる態勢を整備することが重要です。\nいずれにしても、顧客に分かりやすく比較可能な情報提供が行われるよう、各保険会社及び乗合代理店において適切な取組みが求められます。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["便宜供与","手数料・インセンティブ","比較推奨","システム・比較ツール"]},{"no":488,"location":"－","comment":"対面で丁寧に説明しようとする乗合代理店ほど工数が増え、意向把握がシステム化されているネット完結型乗合代理店との間で不公平な競争条件(イコールフィッティング)が生じる懸念があると考える。","pageStart":284,"pageEnd":284,"answer":"貴重なご意見として承ります。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["意向把握","システム・比較ツール"]},{"no":489,"location":"－","comment":"顧客の中には、短時間で簡潔な説明を希望される方も多いため、比較推奨に係る対応が長時間とならないよう、顧客の希望に応じた柔軟な対応を可能とする運用が必要と考える。\nまた、契約を希望する保険会社を決めている顧客に対して、保険代理店による比較推奨の対応が負担とならないよう配慮をお願いしたい。","pageStart":284,"pageEnd":284,"answer":"貴重なご意見として承ります。\n比較推奨販売においては、全ての顧客に対し、画一的・長時間の説明や網羅的な比較説明を一律に求めるものではありません。\n顧客の意向、理解度、商品特性等を踏まえ、顧客の理解に資する範囲で、分かりやすく実効的に説明することが重要です。\nまた、顧客の主体的な判断のみで特定の保険契約を自ら選択し、保険募集人による保険契約の選別・提案を実質的に伴わないと認められるときは、直ちに保険業法施行規則第227条の2第3項第4号ロ(推奨販売)に係る対応が必要となるものではありません。\nなお、その場合であっても、意向把握・確認、重要事項説明、権限明示等、保険募集に係る法令上必要な対応は適切に行う必要があります。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["比較推奨","意向把握"]},{"no":490,"location":"Ⅱ－4－2－9(5)","comment":"保険募集人に対する教育や実務工数の増加など、比較推奨への対応負担が大きくなった場合には、取扱保険会社数284の見直しも検討せざるを得ないと考える。一方で、既契約がある顧客に不利益が生じないように配慮する必要があるため、これまでの保険会社数を取り扱う保険募集人(募集拠点)と、限定した保険会社数を取り扱う保険募集人(募集拠点)を分けて運用することが可能となるなど、柔軟な制度設計・運用が認められることが実務の実態や顧客利益の観点から有用であると考える。","pageStart":284,"pageEnd":285,"answer":"貴重なご意見として承ります。\n比較推奨販売の対象となる保険契約は、代理店委託契約又はこれに基づく覚書等により、当該代理店が取り扱うこととされている保険契約を前提に判断されます。\nしたがって、取扱範囲を限定する場合には、代理店の内部判断のみではなく、所属保険会社等との間で、対象となる保険契約、保険種類、既契約対応の範囲等を代理店委託契約又はこれに基づく覚書等により明確にし、実効的に管理する必要があります。\n一方で、当該限定が、比較推奨販売規制の潜脱や、保険会社からの便宜供与等の見返りとして、顧客に対して特定の保険会社の保険契約を優先的に取り扱うといった運用の実質的存続、顧客の適切な商品選択の機会を阻害するものと評価され得る場合には問題となり得ます。\nなお、顧客に対しては、権限明示を適切に行うとともに、顧客の誤認防止の観点から、取り扱う保険会社・保険契約の範囲について誤認を与えないよう、適切に対応する必要があります。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["便宜供与","比較推奨"]},{"no":491,"location":"Ⅱ－4－2－9(5)","comment":"監督指針Ⅱ－4－2－9(5)①B.(a)の「保険募集人や乗合代理店の都合によることなく」並びに(注1)の「乗合代理店の都合」を削除すべきである。\n「都合」という言葉が曖昧であり、一切の都合を認めないのは、言い換えれば、一切の権利が認められないこと、ととれるが、乗合代理店のみが、そのような差別的な扱いをされる法的根拠がない。\n285","pageStart":285,"pageEnd":285,"answer":"貴重なご意見として承ります。\nⅡ－4－2－9(5)①B.(a)及び(注1)における「保険募集人や乗合代理店の都合」とは、手数料水準、販売目標、便宜供与、保険会社との取引関係等、代理店の都合を理由として、特定の保険契約を選別し、提示・推奨することを防止する趣旨です。\n今般の改正は、顧客の意向に基づかない保険契約の選別を前提とする保険業法施行規則第227条の2第3項第4号ハの削除を踏まえ、顧客の意向に沿った適切な比較推奨販売を確保する観点から行うものであり、比較推奨販売においては、顧客の意向に沿った合理的かつ一定の具体性を有する基準や理由等に基づき、保険契約を提示・推奨することが重要です。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["便宜供与","手数料・インセンティブ","比較推奨","ハ方式"]},{"no":492,"location":"－","comment":"比較推奨に偏重すると顧客の精神的・時間的負担が増え、場合によっては不快な思いをする顧客もいる。\n現在、保険商品は各損保で大きな差異はなく、似通った商品を扱っており、顧客の中には金銭ではなく担当している販売員への信頼で商品を選んでいる方も多数いると考えている。顧客本位の観点から顧客が希望するような柔軟な対応が必要と考える。","pageStart":286,"pageEnd":286,"answer":"貴重なご意見として承ります。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["比較推奨"]},{"no":493,"location":"Ⅱ－4－2－9(5)","comment":"現在の比較推奨販売においては、顧客の意向把握が義務付けられているが、初期段階での過度な個人情報の取得は、顧客の心理的ハードルを高め、広範な比較機会を奪っている側面がある。そこで、以下の仕組みを導入する乗合代理店やプラットフォームに対し、適切な比較推奨プロセスとして認めるべきであると考える。\n1.プライバシーに配慮したデータ入力：氏名・住所等の個人を特定する情報を入力せず、家族構成、使用目的、ライフプラン等の「属性・ニーズデータ」\nのみをAIに入力する形式。\n2.AIによる客観的スクリーニング：乗合代理店が取り扱う全保険契約の中から、手数料の多寡によらず、入力データに基づき機械的に適合性の高い保険契約を抽出する。\n3.透明性の確保：「なぜその保険契約が選ばれたのか」という選定ロジック(例：保険料重視、保障範囲重視等)をAIが明示し、顧客が自身の属性と照らし合わせて納得できる仕組みを設け286る。","pageStart":286,"pageEnd":287,"answer":"貴重なご意見として承ります。\nなお、保険募集人が、保険募集を行うにあたり、AIを活用すること自体は一律には否定されませんが、AIの課題や特性等を踏まえたうえで態勢を整備するなど、当該募集人にAIを活用して行う保険募集に関する責任があることに留意する必要があると考えます。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["手数料・インセンティブ","比較推奨","意向把握"]},{"no":494,"location":"Ⅱ－4－2－9(5)","comment":"ノンフリート自動車保険、火災保険、傷害保険といった定型商品については、実質的な商品差が限定的であるのが実態である。その中で、複数社の保険契約を横断的に比較し、顧客意向を把握したうえで、合理的かつ具体的な理由をもって推奨することを、すべての乗合代理店及び保険募集人に一律に求めることは非現実的と考える。","pageStart":287,"pageEnd":287,"answer":"貴重なご意見として承ります。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":[]},{"no":495,"location":"－","comment":"現行の生命保険及び損害保険の手数料体系や委託基準によって比較推奨販売の実践が不利に働く構造について、制度的な整理と改善が必要である。\n各保険会社の料率改定や商品改定の影響により、保険契約が特定の会社に偏る、あるいは分散する傾向が生じる。\nその結果、損害保険分野においては代理店全体の手数料収入が減少するケースが見られる。また、生命保険分野では、年間契約件数等を基準とする委託基準が存在し、比較推奨を適切に行った結果、基準未達となり、委託解除等の不利益が乗合代理店に生じる制度構造がある。\n金融庁が比較推奨販売を制度として求める一方で、手数料体系や委託基準がその実践を阻害する要因となっている点について、どのように認識しているか。\nまた、比較推奨を行った結果として生じる乗合代理店への不利益が、制度の趣旨と整合しているのかについても、検証が必要ではないかと考える。比較推奨を真摯に実践する乗合代理店ほど経営上の不利益を被る構造は、制度の実効性を損ない、結果として顧客本位の業務運営を形骸化さ287せるおそれがある。","pageStart":287,"pageEnd":288,"answer":"貴重なご意見として承ります。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["手数料・インセンティブ","比較推奨","委託解除"]},{"no":496,"location":"Ⅱ－4－2－9(5)","comment":"手数料ポイント制度が、比較推奨販売の判断に過度な影響を及ぼしている現状について、制度趣旨との整合性を確認・検証する必要がある。\n比較推奨は、本来、商品性・サービス・品質等が類似する商品を一定の基準で比較することで成立するものである。しかし現場では、品質等に大きな差がないにもかかわらず、保険会社ごとに評価基準が異なる手数料ポイント制度が存在し、商品提案の判断に影響を与えている実態がある。\nこのような状況は、販売現場において恣意的な商品提案を誘発し、結果として保険販売の歪みや、適切な業務品質の確保を困難にするおそれがある。\n比較推奨販売を実効性あるものにするためにも、手数料ポイント制度のあり方についても、保険代理店と保険会社間での定期的かつ必要に応じて確認・検証がなされているかを、当局として注視して頂きたい。\n手数料評価制度が比較推奨の判断を左右する状況が続けば、制度の本来目的である顧客本位の業務運営が損なわれるおそれがある。","pageStart":288,"pageEnd":288,"answer":"貴重なご意見として承ります。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["手数料・インセンティブ","比較推奨"]},{"no":497,"location":"Ⅱ－4－2－9(5)","comment":"顧客の意向把握に当たっては、「業界統一の保険種目別意向把握シート(仮称)」を作成し、共通の基準で対応する方式を要望する。","pageStart":288,"pageEnd":288,"answer":"貴重なご意見として承ります。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["意向把握"]},{"no":498,"location":"－","comment":"法人契約においては、本社が推奨方針・推奨保険会社を定めているケース、事業所が契約主体となり一定の決裁権288限を有しているケースが混在している。この点に関し、本社の意向を把握することで足りるのか、それとも契約主体である事業所ごとの意向把握まで求められるのか確認したい。\nなお、契約主体である事業所ごとの意向把握まで求められる場合、すべての事業所に対し同一水準の比較説明・意向把握を求めることは実務的に困難であるため、本社が定めた推奨方針を前提に事業所に対しては「当該方針に基づく手配で問題ないか」を確認し、その確認結果を証跡として残す、という運用をもって「事業所の意向把握」と評価されるかについて考え方を示していただきたい。","pageStart":288,"pageEnd":289,"answer":"貴見にあるケースがどのような場合を想定したものか、必ずしも明確ではないため、一概に回答することは困難です。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["比較推奨","意向把握","証跡・記録"]},{"no":499,"location":"Ⅱ－4－2－9(5)","comment":"建設工事保険において工事発注者と契約者が異なる場合や賠償責任保険において施設管理者(契約者)と施設所有者が異なる場合、工事発注者や施設所有者の意向に沿って保険契約を選別し提示・推奨することは、その旨を提示・推奨する基準や理由等として説明することで、「保険募集人や乗合代理店の都合によることなく、合理的かつ一定の具体性を有する基準や理由等を説明している」との理解でよいか。","pageStart":289,"pageEnd":289,"answer":"貴見のようなケースにおいて、工事発注者や施設所有者が被保険者に該当するか否か等必ずしも明確ではないため回答することが困難ですが、一般論として、顧客の意向把握・確認義務の「顧客」とは、保険契約者、また、場合によって被保険者を指し得ると考えられます。\n顧客の意向把握を行うに当たっては、顧客が抱えるリスク等を把握し、その上で、特定の保険契約を提示・推奨する場合には、当該保険契約が顧客の意向にどのように沿うのかについて、合理的かつ一定の具体性をもって説明する必要があります。\nなお、手数料水準、販売目標、便宜供与、保険会社との取引関係等の代理店の都合により特定の保険契約へ誘導することは適切ではないため留意が必要です。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["便宜供与","手数料・インセンティブ","意向把握"]},{"no":500,"location":"Ⅱ－4－2－9(5)","comment":"入札保証保険、履行保証保険、公共工事履行保証保険等においては、銀行融資と同様、各保険会社から事前審査に289よる「与信枠(引受限度額)」の設定が必要であるのと同時に、保険商品としての各社の差異はない。乗合代理店は顧客企業の入札及び履行保証保険の加入依頼に際し、与信枠の残額等を照らし合わせて、特定の保険会社の保険契約を推奨しているため、比較推奨販売から除外しても問題ないと考えるが如何か。","pageStart":289,"pageEnd":290,"answer":"「二以上の比較可能な同種の保険契約」の考え方については、「「平成26年改正保険業法(2年以内施行)に係る政府令・監督指針案」に対するパブリックコメント結果等について」における「コメントの概要及びコメントに対する金融庁の考え方」No.74～77のとおり、保険募集人等が顧客の意向の把握過程において把握しようとする顧客の意向との関係で、一般人の合理的な期待を基準として、個別具体的かつ実質的に判断されるべきものです。\n最終的には、顧客の具体的な意向、保険契約の対象となるリスクの種類及び保険給付の内容、保険契約の特性・類型等を踏まえつつ、実質的に判断されるべきものと考えられます。\nなお、比較推奨販売においては、手数料水準、規模・増収率、販売目標、便宜供与、事務手続・経営方針上の理由等の代理店の都合を理由として、顧客の意向に沿わない特定の保険商品・保険会社へ誘導することは適切ではありません。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["便宜供与","手数料・インセンティブ","比較推奨"]},{"no":501,"location":"Ⅱ－4－2－9(5)","comment":"「比較可能な同種の保険契約」は、顧客のニーズがどの程度具体的なのか等によって、必ずしも一律ではないと考えられる。かなり具体的なニーズであれば、推奨販売により提示する保険契約も1～2個に限定され、保険募集人と顧客の負担も減るため、極力細部のニーズ把握に注力することが望ましいと考えられるがどうか。なお、効率重視でニーズが歪められ過ぎることは問題であると認識している。","pageStart":290,"pageEnd":290,"answer":"貴見における顧客のニーズの内容は多種多様であるため一律に整理することは困難ですが、一般論として、「二以上の比較可能な同種の保険契約」に該当するかは、顧客の具体的な意向、保険契約の対象となるリスクの種類及び保険給付の内容、保険契約の特性・類型等を踏まえ、個別具体的かつ実質的に判断されます。\nしたがって、顧客の意向が具体的に把握された結果、比較・選別対象となる保険契約が限定されることはあり得ます。そのため、顧客のニーズを適切かつ十分に把握することは否定されるものではありません。\n一方で、保険募集人が、比較・選別対象を狭める目的で顧客のニーズを恣意的に誘導し、特定の保険契約へ導くことは適切ではありません。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":[]},{"no":502,"location":"Ⅱ－4－2－9(5)","comment":"法人向け自動車保険における基本補償(対人賠償、対物290賠償、人身傷害、車両保険)については、保険会社間で補償範囲や水準に大きな差異がないケースが多く、補償内容そのものを軸とした比較推奨は、実務上必ずしも実効性が高いとは言い難いと考えている。\n他方、法人顧客においては、事故発生時の事業継続性や車両稼働への影響が極めて重要であり、以下のような項目については、比較推奨が有効かつ合理的に機能すると考えている。\n・保険料(事業コストへの影響が明確であること)\n・ロードサービスの内容(商用車の稼働停止リスクへの対応)\n・代車特約の有無及び内容(業務継続性への影響)\nこのため、基本補償については各社で大きな差異がない旨を顧客に説明した上で共通性を理解いただき、上記のような項目に限定して比較推奨を行う運用を認めていただくことが、実務上合理的であると考える。\nこのような運用により、・顧客にとって理解・納得しやすい説明が可能となること・保険募集人による対応のばらつきを抑え、現場で一貫した運用が可能となること・比較推奨販売の実効性を確保できることが期待できる。\n法人向け自動車保険の特性を踏まえた上で、比較推奨の対象項目や運用の柔軟性についてご検討いただきたい。\n291","pageStart":290,"pageEnd":291,"answer":"比較推奨販売においては、全ての案件について、全ての商品項目を網羅的・画一的に比較することを一律に求めるものではなく、顧客の意向、商品特性等を踏まえ、顧客の判断に資する事項を分かりやすく説明することが重要です。\nただし、基本補償の差異が小さいことを理由として、顧客の意向に関係する他の重要な事項を比較対象から除外することは適切ではなく、ご指摘のようなケースでも、顧客が重視する事項に照らし、補償内容等の商品特性、保険料水準といった保険商品に直接関係する事項等、顧客の比較判断に資する事項を分かりやすく説明することが重要です。\nなお、手数料水準、販売目標、便宜供与等の代理店の都合により、特定の保険会社又は特定の保険契約へ誘導することは認められないため留意が必要です。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["便宜供与","手数料・インセンティブ","比較推奨"]},{"no":503,"location":"Ⅱ－4－2－9(5)","comment":"乗合代理店と顧客双方に負担をかけない比較推奨販売を実現する観点からは、乗合の対象となる各損害保険会社の自動車保険の内容や保険料水準を簡単に比較できるようなシステムを日本損害保険協会ないし各損害保険会社にて構築し、これを乗合代理店とネットワークでつなぐべきであると考える。そうしたシステムの構築を金融庁から日本損害保険協会ないし各損害保険会社に指導すべきと考えるがどうか。","pageStart":292,"pageEnd":292,"answer":"貴重なご意見として承ります。\n金融庁として、特定の共通システムの構築や利用を日本損害保険協会又は各損害保険会社に一律に求めるものではありませんが、乗合代理店において、比較推奨販売に係る実務負担を軽減し、顧客に分かりやすい情報提供を行う観点から、複数保険会社の商品内容や保険料水準を効率的に比較できる仕組みを導入することは、有用な取組みの一つと考えられます。\nいずれにしても、各保険会社及び乗合代理店においては、取扱保険契約、募集形態、顧客の意向、情報管理・システム安全性等を踏まえ、比較推奨販売が適切な方法で行われるよう、規模や業務特性を踏まえつつ、実効的な態勢整備を行うことが重要です。\nなお、業界団体等においても、比較推奨販売の適切性確保に向けて取組みが進められることは有意義であり、金融庁としても、引き続きその動向を注視してまいります。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["比較推奨","システム・比較ツール"]},{"no":504,"location":"－","comment":"企業リスクマネジメントの結果として保険手配を行う際、監督指針Ⅱ－4－2－9(5)①B.だけでは、対応に問題が生じるケースが発生する。\n企業のリスクは業態に応じて様々であり、リスク回避の手段として提供する保険は、そのリスクに精通した保険会社と緻密に設計したオーダーメイド的な要素が強い。また、保険以外に提供するサービスとの微妙な住み分けは、特定の保険会社とのみ実現させることができる。\n企業リスクマネジメントを本業とする乗合代理店は、保険会社及び推奨商品の観点として、中長期的に安定した引受が可能か、ロス安定のための協力が得られるか等を重視292する必要があり、個人顧客の一般的な関心事項とは異なる次元での対応が求められている。\n複数保険契約の提示が困難な場合が多く、顧客と当方のそれぞれの意向について、十分に協議を行い記録にとどめるが、結局単一の保険契約を推奨することになるケースが多いと思われる。このようなケースは、比較推奨販売の要件を満たしていると考えてよいか。","pageStart":292,"pageEnd":293,"answer":"「二以上の比較可能な同種の保険契約」に該当するかは、顧客の意向との関係で、一般人の合理的な期待を基準として、対象リスク、保障(補償)内容、商品特性、引受条件、契約類型等を踏まえ、個別具体的かつ実質的に判断されるものです。\n企業リスクマネジメントに基づく保険手配において、顧客の意向、業態・リスク特性、必要な保障(補償)等を踏まえた結果、実質的に比較可能な同種の保険契約が一つに限られる場合には、二以上の比較可能な同種契約を前提とする比較推奨販売には該当しない場合もあり得ると考えられます。\n一方で、乗合代理店が二以上の比較可能な同種の保険契約の中から、顧客の意向に沿って特定の保険契約を選別し、提示・推奨する場合には、Ⅱ－4－2－9(5)に基づき、当該契約を推奨する基準や理由を、合理的かつ一定の具体性をもって説明するなど適切に対応する必要があります。代理店の都合を理由とする選別・推奨は適切ではありません。\nなお、顧客との協議内容、把握したリスク・意向、比較可能性の判断、単一商品を推奨する理由等について、事後的に確認・検証できるよう記録しておくことが重要です。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["比較推奨","証跡・記録"]},{"no":505,"location":"－","comment":"顧客が保険料例の提示を求めた場合において、顧客が保険会社を選定するための参考資料として、例えば、自動車保険において、対人・対物賠償保険金額無制限、人身傷害3,000万円、車両保険付き、といった代表的な契約条件を定め、各社の補償内容を揃えた上で、車種やノンフリート等級ごとの各社の保険料水準表をあらかじめ記載した資料を手交し、保険契約の選別に活用したうえで、最終的に決定した保険契約について顧客の意向に従って当該保険会社の保険契約に各種特約を付帯する等し、最終的な保険契約を締結する手法は、比較推奨販売規制の趣旨に照らして妥当と言えるか。\nなお、結果として、最終的に加入する際の保険料が当初提示した保険料と異なる可能性があることをあらかじめ明示し、説明する必要がある","pageStart":293,"pageEnd":293,"answer":"個別具体的に判断されますが、一般論として、顧客が保険料水準を重視し、又は保険料例の提示を求める場合に、代表的な契約条件を設定し、各社の保障(補償)内容を可能な限り同一又は近似の条件にした上で、保険料水準表を用いて説明すること自体は否定されるものではありません。\nただし、その場合には、当該契約条件が顧客の意向に照らして適切な前提であること、各社で保障(補償)内容・特約・免責金額等に差異がある場合には、その内容及び最終的な保険料が顧客の個別条件や付帯特約等により変動し得ることを、顧客に分かりやすく説明する必要があります。\nまた、当該資料を用いる場合であっても、保険料水準のみで機械的に選別するのではなく、顧客の意向に沿って、保障(補償)内容、特約等も踏まえ、合理的かつ一定の具体性を有する基準や理由等に基づき提示・推奨する必要があります。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["比較推奨"]},{"no":506,"location":"Ⅱ－4－2－9(5)","comment":"自動車保険のように、業界全体で標準化が進み、保険会社ごとの商品性(補償内容・保険料)に大きな差がない種目において、「保険募集人が保険募集を行う際において、顧客が商品選択をするために必要な情報を合理的・具体的に293十分に説明した」と判断される基準や条件について伺いたい。","pageStart":293,"pageEnd":294,"answer":"個別具体的に判断されるべき事項であり、一概にお答えすることは困難です。\n一般論として、商品性に大きな差がないと考えられる場合であっても、比較推奨販売においては、顧客の意向に照らし、保険料水準、保障(補償)内容、特約、免責金額等のうち、顧客の比較判断に資する事項を分かりやすく説明することが重要です。\n一方で、全ての案件について、各社の保険契約の細部まで網羅的に説明することを一律に求めるものではありません。\nなお、商品差が小さいことを理由として、手数料水準、販売目標、保険会社からの便宜供与等の代理店の都合により、特定の保険会社又は特定の保険契約へ誘導することは認められないため留意が必要です。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["便宜供与","手数料・インセンティブ","比較推奨"]},{"no":507,"location":"Ⅱ－4－2－9(5)","comment":"ChatGPT(クローズ型)などAIに全取扱保険契約の情報を学習させた上で、以下のようなプロセスを経た場合、適切に保険業法施行規則第227条の2第3項第4号ロを実施したものと認められるか。\n・顧客の意向把握ヒアリングシートの情報も読み込ませて、最も意向にマッチする保険契約を判定・推奨保険契約としてその推奨理由とともに提示させ、再度顧客の意向を確認・再度AIに情報を読み込ませることで、最終提案294","pageStart":294,"pageEnd":295,"answer":"個別具体的に判断されるべき事項ですが、AI等のシステムを用いて、顧客の意向に沿った商品選別・提案を行うこと自体が直ちに否定されるものではありませんが、AIに読み込ませる顧客情報や商品情報については、個人情報保護、情報管理、最新性・正確性の確保に留意が必要です。\nその上で、AIを用いる場合であっても、Ⅱ－4－2－9(5)①B.に基づき、顧客の意向を適切に把握し、当該意向に沿って、合理的かつ一定の具体性を有する基準や理由等により保険契約を選別し、提示・推奨する必要があります。\nまた、商品選別・提案を行うにあたっては、AIが提示した推奨結果を機械的に採用するのではなく、使用データ、比較対象商品の範囲、選定ロジック、推奨理由、手数料水準・販売実績等による不適切な影響の有無について、保険代理店において確認・検証し、顧客に分かりやすく説明できる態勢を整備する必要があります。\nなお、特定の保険商品を選別・提案する場面に当たるか否かに関わらず、保険募集人は、保険募集の公正を確保する観点から、AIを活用して行う保険募集に関する責任が保険募集人にあることに照らし、AIの課題や特性等を踏まえ、態勢整備を構築するなど、措置を講じる必要があります。","theme":"合理的かつ一定の具体性を有する基準や理由","section":"監督指針","tags":["手数料・インセンティブ","意向把握","システム・比較ツール"]},{"no":508,"location":"Ⅱ－4－2－9(5)","comment":"「顧客の意向」には、保障(補償)内容、保障(補償)期間、保険料等の保険契約に係る意向だけでなく、例えば、顧客が希望する保険会社に関する意向(外資・内資の別、収入保険料等の規模、健全性・格付等)も含まれると考えてよいか。","pageStart":295,"pageEnd":295,"answer":"保険募集に関し、把握や確認を求める「顧客の意向」とは、保障(補償)内容、保険料水準、保険期間等の商品特性などといった意向を指していると考えます。\nただし、保険募集人が保険契約を選別し、提示・推奨する場合には、顧客が重視する意向を丁寧に確認し、提示・推奨する保険契約が顧客の適切な商品選択にどのように関係するかを合理的かつ具体的に説明する必要があります。\nまた、保険会社の規模や格付等のみをもって直ちに特定の保険契約を選別し、提示・推奨することや、代理店側の都合により特定の保険会社へ誘導することは適切ではありません。","theme":"情報提供","section":"監督指針","tags":[]},{"no":509,"location":"Ⅱ－4－2－9(5)","comment":"保険業法施行規則第227条の2第3項第4号ハの廃止に伴い、同号イに沿って比較説明を行う場合の手順は、以下の流れで問題ないか確認させていただきたい。\n1.顧客の意向把握に基づいて乗合保険会社の比較説明を行う。\n2.1.に基づき、顧客に保険会社を選択頂く。\n3.顧客に選択頂いた保険会社にてご契約の詳細条件を詰めていく。\n4.詳細条件確定後、契約手続きを行う。\n295","pageStart":295,"pageEnd":296,"answer":"顧客の意向内容や具体的な説明態様等によるため、手順の適否については、個別具体的に判断されるべき事項ですが、一般的には、保険募集人は、募集に先立ち所属保険会社等の商号などを明らかにした上で、顧客の意向を適切に把握し、比較説明を行う場合には、比較の前提、保障(補償)内容、保険料水準、特約、免責等について、顧客に誤認を与えないよう適切に説明する必要があります。\nまた、乗合代理店が、取扱保険契約の中から顧客の意向に沿って保険契約を選別して一又は二以上の保険契約を提示・推奨する場合には、当該保険契約の概要及び合理的かつ一定の具体性を有する推奨する基準や理由等を分かりやすく説明する必要があります。\nその上で、顧客が比較説明を踏まえて保険会社又は保険契約を選択し、詳細条件を確認した上で契約手続を行うことは考えられますが、最終的な申込み前に、顧客の意向と契約内容が合致していることを確認する必要があります。","theme":"情報提供","section":"監督指針","tags":["比較推奨","ハ方式","意向把握"]},{"no":510,"location":"Ⅱ－4－2－9(5)","comment":"セカンドオピニオン等の商品付帯サービス、自動車保険のドライブレコーダー特約、リスク診断サービス、経営課題解決サービスは、「商品特性等」に含まれるのか。また、記述の内容は情報提供義務の対象となる情報か。","pageStart":296,"pageEnd":296,"answer":"商品特性等により、特定の保険契約を推奨する場合の「商品特性等」とは、主に保険の種別や保険の保障(補償)内容などを指すところ、サービスの種類や内容は多種多様であり、「商品特性等」\nに当たるか否かについては一概に回答をお示しすることが困難です。\n情報提供する内容次第であり、個別具体的に判断すべき事項ですが、例えば、これらサービスの内容が、特定の保険契約の提示・推奨理由にあたるなど法令上説明が求められる事項にあたる場合には、情報提供義務の対象として顧客に説明する必要があります。","theme":"情報提供","section":"監督指針","tags":[]},{"no":511,"location":"Ⅱ－4－2－9(5)","comment":"監督指針Ⅱ－4－2－9(5)頭書の「法第294条第3項に基づき、あらかじめ所属保険会社等の商号等を明らかにした上で」については、乗合代理店は、全ての所属保険会社等の商号等を明らかにする必要はなく、絞り込み後の保険会社についてのみ明らかにすればよいということを確認したい。\nそれか、保険業法第294条第3項の「明らかにする」というのは、店舗内に掲示等していれば足りるということを明確にしてもらいたい。","pageStart":296,"pageEnd":296,"answer":"保険募集人が保険募集を行おうとするときは、保険業法第294条第3項に基づき、あらかじめ、絞込み後の保険会社など特定の保険会社に限らず、取り扱う全ての所属保険会社等の商号等を明らかにする必要があります。\nその方法については、募集形態等に応じて個別具体的に判断されますが、単に店舗内やホームページに掲示しておくなど顧客の確認に委ねるだけでは足りず、顧客が保険募集人の説明により、募集開始前に所属保険会社等を認識できるよう、分かりやすく明示する必要があります。\nなお、どの時点の行為が保険募集に該当するかは、Ⅱ－4－2－1(1)(2)を踏まえ、個別具体的に判断されます。","theme":"情報提供","section":"監督指針","tags":[]},{"no":512,"location":"－","comment":"あらかじめ明らかにする所属保険会社等の商号等について、顧客に案内する商品が特定分野(火災など)に限られ296ている場合、明らかにする商号等はその特定分野を取り扱う保険会社のみで問題ないか。","pageStart":296,"pageEnd":297,"answer":"保険募集人が保険募集を行おうとするときは、保険業法第294条第3項に基づき、あらかじめ、絞込み後の保険会社など特定の保険会社に限らず、取り扱う全ての所属保険会社等の商号等を明らかにする必要があります。\nその方法については、募集形態等に応じて個別具体的に判断されますが、単に店舗内やホームページに掲示しておくなど顧客の確認に委ねるだけでは足りず、顧客が保険募集人の説明により、募集開始前に所属保険会社等を認識できるよう、分かりやすく明示する必要があります。\nなお、どの時点の行為が保険募集に該当するかは、Ⅱ－4－2－1(1)(2)を踏まえ、個別具体的に判断されます。","theme":"情報提供","section":"監督指針","tags":[]},{"no":513,"location":"Ⅱ－4－2－9(5)","comment":"監督指針に、保険業法第294条第3項に基づく「あらかじめ所属保険会社等の商号等を明らかにした上で」という記載が引用されています。法で「保険募集を行おうとするとき、あらかじめ」とされているものの、ある行為が保険募集に当たるかどうかは、一連の行為の中で総合的に判断されるものであり、必ずしも明確な基準はありません。しかしながら、実務上は、少なくとも募集の初期段階で提示する事務書面やパンフレット等に明示事項を記載し、記載できない情報は口頭でホームページを参照することを指導するなど、顧客に誤解を与えないように努めることが必要と考えているがいかがか。","pageStart":297,"pageEnd":297,"answer":"保険募集人が保険募集を行おうとするときは、保険業法第294条第3項に基づき、あらかじめ、絞込み後の保険会社など特定の保険会社に限らず、取り扱う全ての所属保険会社等の商号等を明らかにする必要があります。\nその方法については、募集形態等に応じて個別具体的に判断されますが、単に店舗内やホームページに掲示しておくなど顧客の確認に委ねるだけでは足りず、顧客が保険募集人の説明により、募集開始前に所属保険会社等を認識できるよう、分かりやすく明示する必要があります。\nなお、どの時点の行為が保険募集に該当するかは、Ⅱ－4－2－1(1)(2)を踏まえ、個別具体的に判断されます。","theme":"情報提供","section":"監督指針","tags":[]},{"no":514,"location":"Ⅱ－4－2－9(5)","comment":"「あらかじめ所属保険会社等の称号等を明らかにした上で」とは、権限明示と同義であるか。","pageStart":297,"pageEnd":297,"answer":"貴見のとおり、Ⅱ－4－2－9(5)の「事前に所属保険会社等の商号等を明らかにした上で」とは、保険業法第294条第3項に基づく、いわゆる権限明示を指すものです。\n保険募集人が保険募集を行おうとするときは、あらかじめ、取り扱う所属保険会社等の商号等を顧客に明らかにする必要があります。","theme":"情報提供","section":"監督指針","tags":[]},{"no":515,"location":"Ⅱ－4－2－9(5)","comment":"監督指針Ⅱ－4－2－9(5)\n①について、監督指針Ⅱ－4－2－2(9)の規制内容は従前と変わらず、その範囲内で、適法にできる範囲での情報提供という理解でよいか。\n297","pageStart":297,"pageEnd":298,"answer":"貴見のとおり、Ⅱ－4－2－9(5)①は、比較推奨販売に関する考え方を示すものであり、Ⅱ－4－2－2(9)の規制内容を変更するものではありません。\n比較説明を行う場合には、Ⅱ－4－2－2(9)も踏まえ、顧客に誤認を与える表示・説明とならないよう適切に対応する必要があります。\nなお、Ⅱ－4－2－9(5)①は、乗合代理店が比較推奨販売を行う場合の留意点を示すものであり、Ⅱ－4－2－2(9)とは相互に補完関係にあるものです。","theme":"情報提供","section":"監督指針","tags":["比較推奨"]},{"no":516,"location":"Ⅱ－4－2－9(5)","comment":"保険の既契約者には継続的な情報提供が必要である。近年は、医療保険の最新化情報や、健康関連の商品・サービス情報等のニーズが高いので、そういったものに限定して情報提供することがあるが、結果として当該取組の期間中、情報提供に取り組んだ商品の販売占率が一定高まるとしても、意向把握義務や情報提供義務を満たす創意工夫はむしろ推進されるべきであり、直ちに問題とはならないとの理解でよいか。","pageStart":298,"pageEnd":298,"answer":"既契約者に対して、保険契約の内容確認や関連する保険商品・サービスに関する情報提供を行うこと自体は一律に否定されません。\nただし、その過程で保険募集に該当する行為を行う場合には、意向把握・確認義務、情報提供義務を確実に履行するとともに、比較推奨販売に係る規定等を踏まえた適切な対応を行う必要があります。\nまた、上記の場合において、特定の保険商品・サービスについて訴求する場合には、顧客の属性、既契約内容、想定されるニーズ等に照らして合理性があり、特定の保険会社又は特定の保険契約への恣意的な誘導とならないよう留意する必要があります。","theme":"情報提供","section":"監督指針","tags":["比較推奨","意向把握"]},{"no":517,"location":"Ⅱ－4－2－9(5)","comment":"保険業法施行規則第227条の2第3項第4号ハが削除となるが、同号イは、意意向把握によって確認した顧客ニーズによって提案すべきと判断した「同種の保険種目であるラインナップ群」\nについて、推奨販売(絞り込み)をせずに、全商品を提示するもの〕かつ、意一部のみの不適切な比較にならないように、保険会社の審査を経た契約概要または商品概要書など、監督指針に基づく比較ルールを基本的に満たす書面を活用するもの〕として、引き続き維持されると理解してよいか。\n298","pageStart":298,"pageEnd":298,"answer":"保険業法施行規則第227条の2第3項第4号イの具体的な運用の適否については、個別具体的に判断されるべきであり、一概に回答をすることが困難です。\nなお、顧客の意向に基づき一定の保険契約のラインナップを設定する場合には、当該ラインナップの設定自体が顧客の意向に沿った保険契約の選別に当たる可能性があることから、推奨販売(同号ロ)に該当し得るものと考えられます。\n他方、推奨販売に該当する場合であっても、他の保険契約との比較を行う際には、Ⅱ－4－2－9(5)①A.やⅡ－4－2－2(9)②に照らし、顧客の理解に資するよう適切に情報提供義務が果たされることが必要となります。","theme":"情報提供","section":"監督指針","tags":["ハ方式","意向把握"]},{"no":518,"location":"Ⅱ－4－2－9(5)","comment":"監督指針案に、「比較説明を行う際に、顧客が契約内容について、正確な判断ができるように、必要事項を包括的に示しているか」とある。乗合代理店が顧客に、包括的に示す要件として、当該商品に関わる各保険会社のパンフレット、保険料見積を提示して説明を行うことで足りると考えてよいか。","pageStart":299,"pageEnd":299,"answer":"個別具体的に判断されますが、各保険会社のパンフレットや保険料見積りを提示すること自体は、比較説明の方法として否定されるものではありません。\nただし、それらを単に交付・提示するだけで足りるものではなく、比較の前提条件、保障(補償)内容、保険料水準、特約、免責、主な留意点等について、顧客が正確に判断できるよう分かりやすく説明する必要があります。\nまた、保険料見積りを比較する場合には、可能な限り同一又は近似の算定条件とすることが望ましく、その条件の違いが保険料や保障(補償)内容に与える影響について、顧客に誤認を与えないよう留意する必要があります。","theme":"情報提供","section":"監督指針","tags":["比較推奨"]},{"no":519,"location":"Ⅱ－4－2－9(5)","comment":"他の商品との比較を行う場合には、契約概要など、顧客の正確な判断を行うために必要な事項を表示した書面を利用し、保険業法第300条第1項第6号および監督指針Ⅱ－4－2－2(9)を踏まえて適切に説明を行う必要があるとの理解でよいか。","pageStart":299,"pageEnd":299,"answer":"貴見のとおりです。","theme":"情報提供","section":"監督指針","tags":[]},{"no":520,"location":"Ⅱ－4－2－9(5)","comment":"監督指針Ⅱ－4－2－9(5)①B.(a)第2段落の「推奨する特定の保険契約以外の保険契約」の範囲を正確に理解したい。\n例えば、当初意向の把握によってA・B・C・D・E・Fの6つの保険契約が候補になりうる際に、同B.(a)第1段落に定める顧客の意向に沿った保険契約の選別によりA・B・Cの3つの保険契約が残ったケースにおいて、同B.(a)第2段落に定める特定の保険契約としてA保険契約を推奨する場合は、B・Cの2つの保険契約を指すことになり、B・C・D・E・Fの2995つの保険商品を指す訳ではないという理解でよいか。","pageStart":299,"pageEnd":300,"answer":"貴見のとおりです。\nⅡ－4－2－9(5)①B.(a)第2段落の「推奨する特定の保険契約以外の保険契約」とは、「二以上の比較可能な同種の保険契約」\nのうち、顧客の意向に沿って選別の対象とした保険契約であって、最終的に推奨しなかったものを指します。\nしたがって、ご意見の例では、顧客の意向に沿ってA・B・Cが選別され、その中からAを推奨する場合、「推奨する特定の保険契約以外の保険契約」はB・Cを指し、D・E・Fまで含むものではありません。\nただし、D・E・Fを選別対象外とした判断が、顧客の意向に沿った合理的なものである必要があります。代理店側の都合により不当に除外することは適切ではありません。","theme":"情報提供","section":"監督指針","tags":[]},{"no":521,"location":"Ⅱ－4－2－9(5)","comment":"監督指針Ⅱ－4－2－9(5)①B.(b)(注3)において、非対面募集(通販型)では、以下のプロセスを経て契約に至るケースがある。\n・情報提供:メルマガ等で特定の保険契約の概要を送付する。\n・顧客の能動的選択:顧客が自らの意思でメルマガに記載されているリンクをクリックし、詳細ページを閲覧する。\n・意向確認・申込:Webサイト上で改めて顧客の意向を確認し、重要事項説明等を経て申込みを行う。\nメルマガ等の媒体は掲載スペースが極めて限定的であり、対面募集のように詳細な選別プロセスや複数商品の比較を、代理店側の管理するメルマガ等で個別具体的に掲載することは困難である。\nそのため、今般の改正を踏まえ、メルマガ内に「他にも取扱商品がある旨」や「ウェブサイトから申し込みできる全商品の確認ページへのリンク」を明記した上で特定の保険契約の情報を提供する場合、顧客の適切な商品選択の機会を阻害するものとは評価されないと考えてよいか。","pageStart":300,"pageEnd":300,"answer":"個別具体的に判断される事項ですが、メールマガジン等で特定の保険契約の情報を提供する場合であっても、その内容・表示方法・配信対象・導線等により、特定の保険契約の提示・推奨に該当し得ます。\nメールマガジン内に「他にも取扱商品がある旨」や「全商品の確認ページへのリンク」を明記することは、顧客の適切な商品選択の機会を確保するための対応の一つと考えられますが、それのみをもって直ちに十分とはいえません。\n特定の保険契約への誘導とならないよう、表示内容や導線に留意するとともに、申込過程において、顧客の意向を適切に確認し、当該意向に沿った情報提供・提示・推奨が行われる必要があります。具体的には、例えば、導線上や申込過程において、顧客の重視する事項を確認し、メルマガ等で情報提供された特定の保険契約の商品特性が顧客ニーズに合致するかを確認するプロセスや、合致しない場合に他の保険契約の検討を促すような機会を確保することが考えられます。\nまた、乗合代理店が保険募集を行う場合には、非対面募集であっても、あらかじめ所属保険会社等の商号等を明らかにするなど、関係法令・監督指針を踏まえた対応が必要です。","theme":"情報提供","section":"監督指針","tags":["意向把握"]},{"no":522,"location":"Ⅱ－4－2－9(5)","comment":"比較可能な同種の保険契約の概要説明に当たっては、「商品名・引受保険会社名」が記載された一覧のみでは不十分であり、商品案内パンフレットにおける商品概要のペ300ージ等を用いて、商品内容の全体像が理解できる程度の情報を説明する必要がある、との理解でよいか。","pageStart":300,"pageEnd":301,"answer":"貴見のとおり、保険契約の概要としては、顧客が商品内容の全体像を理解し、商品選択を行うために必要な範囲で、主な保障(補償)内容、保険料水準、特約、免責、保険期間、主な不利益事項・留意点等を分かりやすく説明する必要があります。\nその際、商品パンフレットにおける商品概要のページ、契約概要等を用いることは考えられますが、資料を単に交付するだけではなく、顧客の意向や理解度に応じて適切に説明することが重要です。","theme":"情報提供","section":"監督指針","tags":[]},{"no":523,"location":"－","comment":"二以上の比較可能な同種の保険契約の中から顧客の意向に沿って保険契約を選別し、顧客へ保険契約の概要を説明したものについて、更なる顧客の意向に基づいて選別を行った場合、情報提供義務で求められる概要の説明は履行済であり、改めての概要の説明は必ずしも要しない、との理解でよいか。","pageStart":301,"pageEnd":301,"answer":"貴見のとおり、既に顧客の意向に沿って選別した保険契約の概要を適切に説明している場合には、その後、追加の意向把握に基づき更に選別を行ったとしても、同一内容の概要説明を形式的に繰り返すことまでは必ずしも求められません。\nただし、更なる選別後に特定の保険契約を提示・推奨する場合には、顧客の意向に照らして、当該提示・推奨する基準や理由等を、合理的かつ一定の具体性をもって、分かりやすく説明する必要があります。\nなお、顧客の追加意向により説明済みの内容に変更・補足が必要となる場合や、顧客の理解確保の観点から必要な場合には、改めて又は補足的に説明することが重要です。","theme":"情報提供","section":"監督指針","tags":["意向把握"]},{"no":524,"location":"Ⅱ－4－2－9(5)","comment":"顧客の求めに応じていつでも全商品の提示が可能である旨を顧客へ説明することは、比較可能な同種の保険契約の概要説明の代替手段とはならないことに留意する必要がある、との理解でよいか。","pageStart":301,"pageEnd":301,"answer":"貴見のとおりです。\n「顧客の求めに応じて、全商品又は他の商品を提示・説明できる」旨を説明することのみでは、提示・推奨する保険契約の概要説明に代えることはできません。","theme":"情報提供","section":"監督指針","tags":[]},{"no":525,"location":"－","comment":"個別具体的な事例に即して判断する必要があるものの、比較推奨販売を適切に行った上で保険契約の申込みに至り、申込後に、結果として他の保険契約も比較可能な同種の保険契約に該当することになった場合(例えば、引受基準緩和型ではない医療保険に保険料割増の条件が付加さ301れた結果、引受基準緩和型医療保険が比較可能な同種の保険契約となった場合など)でも、遡って情報提供義務の不履行があったとはみなされない(比較可能な同種の保険契約の概要説明等の不履行があったとはみなされない)、との理解でよいか。","pageStart":301,"pageEnd":302,"answer":"貴見のとおり、比較推奨販売を行った時点で、顧客の意向や把握可能な商品・引受条件等を踏まえ、適切に情報提供義務を果たしていた場合には、申込後に引受条件等が判明したことのみをもって、直ちに遡って情報提供義務違反となるものではないと考えられます。\n「二以上の比較可能な同種の保険契約」に該当するか否かは、提示・推奨時点における顧客の具体的な意向、対象となるリスク、保険給付の内容等を踏まえ、個別具体的かつ実質的に判断される必要があります。\nしたがって、特定の保険契約に申込後、当該保険に保険料割増、条件付加、引受不可等が判明し、当初説明した内容や顧客の意向との関係で重要な変更が生じる場合には、その時点で顧客に適切に説明し、必要に応じて意向確認や他の保険契約の提示・説明を行う必要があります。","theme":"情報提供","section":"監督指針","tags":["比較推奨","意向把握"]},{"no":526,"location":"Ⅱ－4－2－9(5)","comment":"監督指針Ⅱ－4－2－9(5)\n①B.について、例えば、「医療保険に加入したい」という顧客の意向が示された後、追加的に明らかになった顧客の意向(保険料重視なのか保障内容重視なのか等)に沿って更なる選別を行うケースにおいては、必ずしも取り扱う全ての医療保険の概要を説明する必要はなく、当該選別後の保険契約について概要を説明することで足りる、との理解でよいか。","pageStart":302,"pageEnd":302,"answer":"貴見のとおり、顧客の当初意向が「医療保険に加入したい」という程度にとどまる場合でも、その後、保険料水準、保障(補償)\n内容、特約、保険期間、払込方法等、顧客が重視する事項を確認し、その追加的な意向に沿って保険契約を選別することは考えられます。\nこの場合、常に取り扱う全ての医療保険の概要を説明することを一律に求めるものではなく、顧客の意向に沿って選別した保険契約について、概要及び提示・推奨する基準や理由等を説明することで足りるものと考えられます。\nただし、選別の過程が顧客の意向に沿った合理的なものである必要があり、代理店側の都合により、一部の商品を不当に除外することは適切ではありません。また、顧客の意向把握、選別理由、説明内容等について、事後的に確認できるよう適切に記録することが重要です。","theme":"情報提供","section":"監督指針","tags":["意向把握","証跡・記録"]},{"no":527,"location":"Ⅱ－4－2－9(5)","comment":"比較可能な同種の保険契約の概要説明について、適切な概要説明ができることを前提として、他の書面と一体の書302面を用いて行うことも認められる、との理解でよいか。","pageStart":302,"pageEnd":303,"answer":"個別具体的に判断されるべき事項ですが、一般論として、比較可能な同種の保険契約の概要説明については、顧客が当該保険契約の全体像を理解し、適切な商品選択が可能となる内容となっていれば、他の説明書面や比較資料と一体の書面を用いることも考えられます。\nただし、一体の書面とする場合でも、顧客が保険商品を絞り込むための契機となる程度の情報、概要説明の対象範囲、主な保障(補償)内容、保険料水準、特約、免責、主な留意点等が顧客に分かりやすく示され、誤認を与えないものである必要があります。","theme":"情報提供","section":"監督指針","tags":[]},{"no":528,"location":"－","comment":"乗合代理店のホームページに単にバナーを掲載することは、募集関連行為もしくは広告であり、比較推奨販売規制の対象外であると理解している。一方で、掲載されているバナーを顧客の意思で選択して、顧客自身の指名により特定の保険会社の申込手続の画面へ遷移するケースもあることから、バナーに客観性の欠ける情報を掲載し、恣意的に特定の保険会社に誘導する行為は、顧客の適切な商品選択の機会を阻害するおそれがあることから、不適切と考えるがどうか。","pageStart":303,"pageEnd":303,"answer":"バナー掲載が保険募集、募集関連行為又は単なる広告のいずれに該当するかは、表示内容、掲載態様、申込画面への導線、顧客への働きかけの程度等を踏まえ、Ⅱ－4－2－1(1)(2)に照らして、個別具体的に判断されます。\nその上で、客観性を欠く表示や誤認を招く表示により、特定の保険会社又は特定の保険契約へ恣意的に誘導することは、顧客の適切な商品選択の機会を阻害するおそれがあり、適切ではありません。\nまた、バナー表示が実質的に特定の保険契約の提示・推奨に当たる場合には、保険業法施行規則第227条の2第3項第4号ロ及びⅡ－4－2－9(5)を踏まえ、顧客の意向に沿った理由説明等を適切に行う必要があります。","theme":"情報提供","section":"監督指針","tags":["比較推奨"]},{"no":529,"location":"Ⅱ－4－2－9(5)","comment":"ウェブ募集のみを行う乗合代理店においても、顧客の意向を把握した上で比較推奨を実施する必要があると理解している。当該代理店において、一般的に顧客が重視する項目ごとの推奨商品をウェブサイト上に表示(例えば、「保険料水準を重視する方はこちら」といった見出しごとに推奨する商品の内容を掲載)し、顧客が自身の意向に従って303自ら選択した項目の中から商品を選定するというプロセスを確保することで、当該代理店は、適切な比較推奨販売を行ったものと考えられるがどうか。","pageStart":303,"pageEnd":304,"answer":"一般的に顧客が重視し得る項目をウェブサイト上で示し、顧客が自ら選択できる仕組みを設けること自体は否定されません。\nただし、項目の内容、表示順、導線、商品の掲載方法等により、特定の保険会社又は特定の保険契約へ恣意的に誘導するものとならないよう留意する必要があります。\nまた、項目ごとに商品を掲載する場合であっても、特定の保険契約の提示・推奨に該当し得るため、当該保険契約の概要及び提示・推奨する基準や理由等を、顧客に分かりやすく説明する必要があります。\nなお、ウェブ募集は対面募集に比べ情報の双方向性が乏しい場合があるため、意向確認、比較対象の範囲、他の商品選択の機会、表示内容の分かりやすさ等を含め、募集プロセス全体として顧客の適切な商品選択の機会が確保されているか、より慎重に対応することが重要です。","theme":"情報提供","section":"監督指針","tags":["比較推奨","意向把握"]},{"no":530,"location":"－","comment":"顧客の意向を確認するプロセスにおいて、商品の概要を説明しながら確認する場面が想定され得るが、例えば、この際に特定の保険会社のパンフレット等を使用して説明することをもって、直ちに当該保険会社を推奨している(誘導している)とみなされるわけではないと考えるがどうか。","pageStart":304,"pageEnd":304,"answer":"個別具体的に判断されるべき事項であり一概に回答することが困難ですが、一般論として、例えば、顧客の意向を確認する過程において、商品の概要を説明するために特定の保険会社のパンフレット等を使用すること自体が、直ちに当該保険会社又は保険契約の推奨・誘導に当たるものではないと考えられます。\nただし、当該資料の使用方法、説明内容、提示順序や提示基準等により、顧客の意向確認に先立って特定の保険契約へ誘導するものとなっていないかについては留意が必要です。","theme":"情報提供","section":"監督指針","tags":["意向把握"]},{"no":531,"location":"－","comment":"保険料水準を判断する参考として保険料表やWEB上で試算やプラン選択ができる環境を提供し、結果として、最終的に加入する際の保険料が当初提示した保険料と異なる可能性がある場合においては、顧客の誤認を招かないよう、その旨を明示し、説明やWEB上で補足説明する必要があると考えるがどうか。\n304","pageStart":304,"pageEnd":305,"answer":"貴見のとおりです。\n保険料表やウェブ試算等により保険料水準を示す場合において、最終的な申込時の条件、引受審査、保障(補償)内容、特約、割引適用等により保険料が変動し得るときは、顧客に誤認を与えないよう、その旨をあらかじめ分かりやすく説明する必要があります。\n特に、概算保険料、参考保険料等を提示する場合には、算定条件、前提、適用範囲、最終保険料と異なる可能性を明示するとともに、正式な見積りや申込時の条件確認等を通じて最終的な契約条件が確定する旨を説明し、顧客が実際の契約条件を正しく理解できるよう対応することが重要です。\nウェブサイト上で試算・プラン選択を行う場合も同様に、画面表示、注記、確認画面等により、顧客が誤認しないよう適切に情報提供義務が果たされることが必要となります。","theme":"情報提供","section":"監督指針","tags":[]},{"no":532,"location":"Ⅱ－4－2－9(5)","comment":"監督指針Ⅱ－4－2－9(5)①B.(a)は、顧客の意向に沿って選別された保険契約については、全てを提示・推奨の対象とし、保険契約の概要及び顧客の求めに応じて契約内容を説明する必要があるという理解でよいか。","pageStart":305,"pageEnd":305,"answer":"Ⅱ－4－2－9(5)①B.(a)については、顧客の意向に沿って選別された保険契約が、提示・推奨の対象となります。\n貴見のとおりです。\n「推奨する特定の保険契約以外の保険契約もある旨」については、その事実を顧客に説明する必要があります。\n顧客から求めがない場合には、当該他の保険契約の概要又は契約内容まで説明することを一律に求めるものではありません。\nただし、顧客の求めに応じて、それらの保険契約の概要又は契約内容を説明する旨も、あわせて説明する必要があります。","theme":"情報提供","section":"監督指針","tags":[]},{"no":533,"location":"Ⅱ－4－2－9(5)","comment":"監督指針Ⅱ－4－2－9(5)①B.(a)にある「推奨する特定の保険契約以外の保険契約もある旨及び顧客の求めに応じて、それらの保険契約の概要又は契約内容を説明する旨を説明しているか」について、ここでいう「推奨する特定の保険契約以外の保険契約がある旨」というのは、その事実を告げればよく、顧客の求めがない場合は保険契約の概要や保険契約の内容まで説明する必要はないとの理解でよいか。","pageStart":305,"pageEnd":305,"answer":"Ⅱ－4－2－9(5)①B.(a)については、顧客の意向に沿って選別された保険契約が、提示・推奨の対象となります。\n貴見のとおりです。\n「推奨する特定の保険契約以外の保険契約もある旨」については、その事実を顧客に説明する必要があります。\n顧客から求めがない場合には、当該他の保険契約の概要又は契約内容まで説明することを一律に求めるものではありません。\nただし、顧客の求めに応じて、それらの保険契約の概要又は契約内容を説明する旨も、あわせて説明する必要があります。","theme":"情報提供","section":"監督指針","tags":[]},{"no":534,"location":"Ⅱ－4－2－9(5)","comment":"監督指針Ⅱ－4－2－9(5)①B.(a)にある「当該提示・推奨する保険契約の概要及び顧客の求めに応じて契約内容並びに当該提示・推奨する基準や理由等を説明しているか」\nについては、以下の①の理解でよいか。\n①「当該提示・推奨する保険契約の概要及び顧客の求めに応じて契約内容」並びに「当該提示・推奨する基準や理由等」を説明しているか(「顧客の求めに応じて」は「基準や理由等」には掛からず、「基準や理由等」は保険契約の305概要と共に常に説明が必要)\n②「当該提示・推奨する保険契約の概要」及び「顧客の求めに応じて契約内容並びに当該提示・推奨する基準や理由等」を説明しているか(「顧客の求めに応じて」は「基準や理由等」に掛かっており、「基準や理由等」は顧客の求めがある場合にのみ説明が求められる)","pageStart":305,"pageEnd":306,"answer":"貴見のとおり、ご意見にある文言は、「当該提示・推奨する保険契約の概要及び顧客の求めに応じて契約内容」及び「当該提示・推奨する基準や理由等」の説明を求める趣旨です。\nしたがって、「顧客の求めに応じて」は「契約内容」にかかるものであり、「提示・推奨する保険契約の概要」及び「提示・推奨する基準や理由等」については、顧客の求めの有無にかかわらず説明する必要があります。\nなお、ご意見を踏まえ、Ⅱ－4－2－9(5)①B.(a)を一部修正しました。","theme":"情報提供","section":"監督指針","tags":[]},{"no":535,"location":"Ⅱ－4－2－9(5)","comment":"乗合代理店が「二以上の比較可能な同種の保険契約」の中から顧客の意向に沿って保険契約を選別し、一又は二以上の保険契約を提示・推奨する場合には、当該提示・推奨する保険契約の概要及び【顧客の求めに応じて】契約内容並びに【当該提示・推奨する基準や理由等】を説明しているか。\nとあるが、顧客の求めに応じて説明せよ、ならば、もし顧客が求めなければ、【当該提示・推奨する基準や理由等】は説明しなくてもよいのか。\nもしくは、監督指針における【顧客の求めに応じて】という副詞句は【契約内容】までを指しており、並びに以降の【当該提示・推奨する基準や理由等】については修飾していないのか。\n(つまり、【当該提示・推奨する基準や理由等】については、顧客の求めがなくとも説明する必要があるのか。)\n日本語としては後者の意味だとは思うが、少なからず誤解を生む可能性があるため、もっと分かりやすい表現にしてみてはどうか。","pageStart":306,"pageEnd":306,"answer":"貴見のとおり、ご意見にある文言は、「当該提示・推奨する保険契約の概要及び顧客の求めに応じて契約内容」及び「当該提示・推奨する基準や理由等」の説明を求める趣旨です。\nしたがって、「顧客の求めに応じて」は「契約内容」にかかるものであり、「提示・推奨する保険契約の概要」及び「提示・推奨する基準や理由等」については、顧客の求めの有無にかかわらず説明する必要があります。\nなお、ご意見を踏まえ、Ⅱ－4－2－9(5)①B.(a)を一部修正しました。","theme":"情報提供","section":"監督指針","tags":[]},{"no":536,"location":"Ⅱ－4－2－9(5)","comment":"保険契約の「概要」は、必ず説明、保険契約の「内容」\n306は顧客の求めがあった場合に説明が求められるものと認識しているが、顧客に対する保険料の提示は、後者の「内容」に含まれるという理解でよいか。","pageStart":306,"pageEnd":307,"answer":"特定の保険契約を提示・推奨する場合には、Ⅱ－4－2－9(5)①B.(a)前段に基づいて、当該保険契約の概要は必ず説明する必要があり、当該保険契約の内容については顧客の求めに応じて説明する必要があります。\n「保険契約の概要」とは、顧客が保険商品を絞り込むための契機となる情報を指し、保険料については、その提示の態様や内容により、顧客の比較検討に資する基礎的な情報として保険契約の概要に含まれる場合もあれば、個別具体的な条件に依拠する詳細情報としての内容に該当する場合もあり、個別具体的な事情を踏まえて判断されるものと考えられます。","theme":"情報提供","section":"監督指針","tags":[]},{"no":537,"location":"Ⅱ－4－2－9(5)","comment":"監督指針Ⅱ－4－2－9－(5)において、「顧客が保険契約の契約内容について、正確な判断を行うに必要な事項を包括的に示しているか。」とされていますが、ここでいう「正確な判断を行うに必要な事項」とは、具体的にどのような内容を想定しているのかご教示いただきたい。\nまた、当該「必要な事項」について、・すべての顧客に対して一律に示すことが求められる事項・顧客の属性、理解度、意向等に応じて、説明内容の省略・簡素化や重点化が許容される事項の整理について、どのように考えているのか、可能な範囲でご教示いただきたい。\n307","pageStart":307,"pageEnd":308,"answer":"個別具体的に判断されるべき事項であり、一概に回答することが困難ですが、一般的には、「正確な判断を行うに必要な事項」\nとは、比較する保険契約について、顧客が契約内容の相違点や留意点を理解し、合理的に選択できるために必要な情報を指すものと考えられます。\n具体的には、比較の前提条件、主な保障(補償)内容、保険料水準、特約、免責金額、保険期間、主な不利益事項・留意点等が考えられます。\nもっとも、全ての案件において、これらを全ての顧客に対して一律・網羅的に詳細説明することを求めるものではありません。\n顧客の意向、属性、理解度、商品特性、募集形態等を踏まえ、判断に重要な事項を過不足なく、分かりやすく説明することが重要です。\nなお、資料の提示や説明の簡素化を行う場合であっても、比較条件や重要な相違点について顧客に誤認を与えないよう、保険業法第300条第1項第6号及びⅡ－4－2－2(9)②を踏まえ、適切に対応する必要があります。\n特定の保険契約を提示・推奨する場合には、提示・推奨する基準や理由等を、顧客の求めの有無にかかわらず説明する必要があります。\nご指摘のようなバナー、URLリンク、QRコード等による導線であっても、その仕様のみをもって、当然に「選択の余地がない」とはいえません。乗合代理店が特定の保険会社又は特定の保険契約の申込ページへ誘導する場合には、当該導線や表示内容が、顧客の意向に沿わない特定の契約への優先的取扱い又は誘導となっていないか、個別具体的に判断されます。\nまた、提示・推奨する理由としては、単に「当該ページに遷移する仕様である」と説明するだけでは足りず、当該保険契約が顧客のどのような意向に対応するものかを合理的かつ一定の具体性を有する基準や理由等に基づき説明する必要があります。\nなお、他の保険会社又は保険契約の提示を求める顧客意向が示された場合には、当該意向に応じて適切に対応する必要があります。","theme":"情報提供","section":"監督指針","tags":[]},{"no":538,"location":"Ⅱ－4－2－9(5)","comment":"次のようなケースでは選択の余地がなく保険契約を提示・推奨することになると考えられるが問題ないか。その場合に「顧客の求めに応じて」行う「当該提示・推奨する基準や理由等」については、選択の余地がない理由を説明することでよいか。\nインターネット(自社のホームページのバナー等)や、商品チラシに掲載されたURLリンク(QRコード等)から、特定の保険会社の特定の商品申込ページにランディングする仕様となっているため、これを提示・推奨する。\nなお、別の保険会社の商品の提示を求める等の顧客意向が示された場合は、当然にそれら保険契約の概要又は契約内容の説明することを前提とする。","pageStart":308,"pageEnd":308,"answer":"個別具体的に判断されるべき事項であり、一概に回答することが困難ですが、一般的には、「正確な判断を行うに必要な事項」\nとは、比較する保険契約について、顧客が契約内容の相違点や留意点を理解し、合理的に選択できるために必要な情報を指すものと考えられます。\n具体的には、比較の前提条件、主な保障(補償)内容、保険料水準、特約、免責金額、保険期間、主な不利益事項・留意点等が考えられます。\nもっとも、全ての案件において、これらを全ての顧客に対して一律・網羅的に詳細説明することを求めるものではありません。\n顧客の意向、属性、理解度、商品特性、募集形態等を踏まえ、判断に重要な事項を過不足なく、分かりやすく説明することが重要です。\nなお、資料の提示や説明の簡素化を行う場合であっても、比較条件や重要な相違点について顧客に誤認を与えないよう、保険業法第300条第1項第6号及びⅡ－4－2－2(9)②を踏まえ、適切に対応する必要があります。\n特定の保険契約を提示・推奨する場合には、提示・推奨する基準や理由等を、顧客の求めの有無にかかわらず説明する必要があります。\nご指摘のようなバナー、URLリンク、QRコード等による導線であっても、その仕様のみをもって、当然に「選択の余地がない」とはいえません。乗合代理店が特定の保険会社又は特定の保険契約の申込ページへ誘導する場合には、当該導線や表示内容が、顧客の意向に沿わない特定の契約への優先的取扱い又は誘導となっていないか、個別具体的に判断されます。\nまた、提示・推奨する理由としては、単に「当該ページに遷移する仕様である」と説明するだけでは足りず、当該保険契約が顧客のどのような意向に対応するものかを合理的かつ一定の具体性を有する基準や理由等に基づき説明する必要があります。\nなお、他の保険会社又は保険契約の提示を求める顧客意向が示された場合には、当該意向に応じて適切に対応する必要があります。","theme":"情報提供","section":"監督指針","tags":[]},{"no":539,"location":"Ⅱ－4－2－9(5)","comment":"次のようなケースでは選択の余地がなく保険契約を提示・推奨することになると考えられるが問題ないか。その場合に「顧客の求めに応じて」行う「当該提示・推奨する基準や理由等」については、選択の余地がない理由を説明することでよいか。\n特定の保険会社が主導し、乗合代理店のために企画される、既契約者向けの一括DM郵送募集のため、当該保険会社の特定の保険契約を提示・推奨する。\n308なお、別の保険会社の商品の提示を求める等の顧客意向が示された場合は、当然にそれら保険契約の概要又は契約内容の説明をすることを前提とする。","pageStart":308,"pageEnd":309,"answer":"特定の保険契約を提示・推奨する場合には、当該提示・推奨する基準や理由等について、顧客の求めの有無に関わらず、必ず説明する必要があります。\nここでいう基準や理由等とは、当該特定の保険契約が顧客のいかなる意向に対応したものであるかについて説明を求めるものであり、選択の余地がない理由の説明をもって足りるものではありません。\nなお、貴見のケースにおいては、乗合代理店が、既契約者の意向を一定程度推定したうえで、特定の保険会社の保険契約を提示・推奨していると考えられるところ、Ⅱ－4－2－2(3)①ア.(注2)で定める意向推定の方法を用いながら、特定の保険契約の選別・推奨をあらかじめ企図し、顧客の意向を恣意的に形成又は解釈するなどの行為により、実質的に従前の保険業法施行規則第227条の2第3項第4号ハと同様の運用を行う場合には、比較推奨販売規制の潜脱に該当し得ます。\nその該当性については、保険募集の態様や意向形成の過程、顧客の適切な商品選択の機会が実質的に確保されているかといった観点から、個別具体的に判断する必要があります。","theme":"情報提供","section":"監督指針","tags":["比較推奨","ハ方式"]},{"no":540,"location":"－","comment":"乗合代理店が、オンライン広告やメール等において、特定の保険契約を訴求すること自体を制限するものではないという理解でよいか。(広告の遷移先となる乗合代理店サイトにて意向の把握や比較推奨に基づく保険募集を実施する前提)","pageStart":309,"pageEnd":309,"answer":"乗合代理店がオンライン広告やメール等において特定の保険契約を訴求すること自体が、直ちに禁止されるものではありません。\nただし、広告・メールの内容、表示方法、遷移先の導線等により、特定の保険会社又は特定の保険契約へ恣意的に誘導するものとならないよう留意する必要があります。\nまた、上記の訴求行為が、実質的に特定の保険契約の提示・推奨に当たる場合には、顧客の意向を適切に把握し、当該意向に沿った合理的かつ一定の具体性を有する基準や理由等に基づき説明する必要があります。\nいずれにせよ、遷移先の乗合代理店サイトにおいて、顧客の意向把握その他法令等で求められる募集手続や情報提供を適切に行うことが前提となります。","theme":"情報提供","section":"監督指針","tags":["比較推奨","意向把握"]},{"no":541,"location":"Ⅱ－4－2－9(5)","comment":"デジタル募集と対面での保険募集では商品概要の説明方法が異なることが想定される。\n309対面ではパンフレット、商品概要資料を用いるが、デジタル完結での保険募集では、画面表示(商品情報へのリンクを含む)にゆだねる想定であるが問題ないか確認したい。その他留意すべき事項があればご教示いただきたい。\nデジタル募集の場合は、パンフレットや商品概要を手交することができないため、画面表示させることでその代替とする想定である。デジタル募集は顧客が画面上で入力・選択した意向を電子的にすべて取得できる等DX化によるメリットがある。逆に対面と異なる手続が必要となるとUIが複雑となりかえって顧客の正しい選択を阻害してしまう。対面、デジタルそれぞれの特性を理解して、顧客に誤認のない比較推奨販売を実現すべきと考えている。","pageStart":309,"pageEnd":310,"answer":"貴見にある「デジタル募集」や「デジタル完結型の募集」が具体的に何を指すのかが必ずしも明確ではありませんが、商品概要等を紙のパンフレット等ではなく、画面表示により提供すること自体は否定されません。\nただし、特定の保険契約を提示・推奨する場合には、顧客が商品内容の全体像を理解できるよう、当該保険契約の概要及び提示・推奨する基準や理由等を、画面上で分かりやすく表示・説明する必要があります。\nなお、画面表示等による情報提供に当たっては、顧客の入力・選択内容や説明画面の表示履歴等を活用し、意向把握、提示・推奨理由、顧客への情報提供内容を適切に履行したことが事後的に確認できる態勢を整備することが有効と考えられます。","theme":"情報提供","section":"監督指針","tags":["比較推奨","意向把握"]},{"no":542,"location":"Ⅱ－4－2－9(5)","comment":"各保険会社に関する基本的な情報(規模、経営状況などIR情報として公表されているようなもの)については必要に応じて顧客に提供すべきと考えるがそうした理解でよいか。","pageStart":310,"pageEnd":310,"answer":"貴見のようなケースは具体的にどのような場面を想定しているか必ずしも明確ではございませんが、顧客から問われた際、顧客に誤認を与えないよう正確性が担保された情報を提供することが必要と考えられます。","theme":"情報提供","section":"監督指針","tags":[]},{"no":543,"location":"Ⅱ－4－2－9(5)","comment":"従前の監督指針では一緒くたに説明がなされていた、【比較説明】と【推奨販売】について、改正案においてはそれぞれ個別に説明が加えられているが、乗合代理店における一連の募集プロセスの中で、【比較】と【推奨】という言葉は非常にややこしいため、【比較説明の情報提供義務】及び【推奨販売の情報提供義務】について、改めて確認したい。\n例えば、募集プロセスの中で、AからJ社まで計10社の比較可能な同種の保険契約を取り扱っている乗合代理店の310保険募集人が、顧客の意向(例えば、がんの自由診療にも備えられるがん保険)に沿って、10社のうち、がん自由診療特約を付帯できるAからC社に絞って顧客に提案したとする。\n顧客から「AからC社の中でおすすめはどの会社か」と聞かれた場合、「診断一時金の2回目以降の支払い要件が他の2社より範囲が広いため、A社がおすすめです」などと追加の説明を加え、A社の保険を推奨したとする。\n上記商談プロセスの中では、AからC社を【提示・推奨】した上で、当該3社の中からA社を推奨する説明自体はあくまでも監督指針で言う所の【比較説明】である、という理解でよいか。\n【推奨販売の情報提供義務】を遵守し、AからC社に絞った理由を顧客に情報提供し、その後、追加の説明を加える行為において、【比較説明の情報提供義務】を遵守し、比較する事項やその内容を適切に説明し、自らが勧める保険契約の優位性の根拠を説明すれば良い、という理解でよいか。\n上記理解が正しい場合、一連の募集プロセスの中では、3社の中から比較説明の中でA社を推奨する行為を、【推奨販売】であると誤認している保険募集人や代理店が多くあるため確認したい。","pageStart":310,"pageEnd":311,"answer":"貴見のケースにおいて、AからC社に絞り込んだ上で、これら3社から更にA社に絞り込んだ場合、Ⅱ－4－2－9(5)①B.の推奨販売に該当します。\nまた、3社からA社に絞り込む際、他のB社及びC社と保障(補償)\n内容について比較していることから、Ⅱ－4－2－9(5)①A.比較説明にも該当すると考えます。","theme":"情報提供","section":"監督指針","tags":["比較推奨"]},{"no":544,"location":"Ⅱ－4－2－9(5)","comment":"1.取り扱い保険会社数が異なる代理店同士による共同募集について複数の代理店が共同して保険募集を行う場合、各代理店が取り扱う保険会社数に差異があるケースが想定される。\n311例えば、A代理店が10社を取り扱い、B代理店が3社を取り扱う場合、共同募集においては「共通して取り扱う3社の商品しか提示できない」という運用になると理解している。この場合、A代理店が本来提供可能であった7社分の選択肢が提示されないこととなり、顧客の最善利益義務との関係で問題が生じないかについて、金融庁としてどのように整理されているかご教示いただきたい。\n2.共同募集における責任の所在について上記のように、共同募集により顧客の選択肢が実質的に制限される場合、その責任はどの代理店に帰属するものと整理されているのか、また、保険会社による代理店管理義務の観点から、どのような対応が求められるのかについて確認したい。\n3.募集関連行為従事者(紹介者)の活用について10社取り扱いのA代理店が代理店登録を外れ、募集関連行為従事者として、顧客の氏名・連絡先のみを本人同意のもとでB代理店に提供するというスキームは、監督指針の範囲内で適法と理解している。\nこの場合、・紹介者は募集行為を一切行わない・B代理店が募集行為を一元的に担う・保険会社はB代理店を通じて紹介者の行為を管理するという整理で問題ないか、また、紹介者の行為が募集行為に該当しないための具体的な留意点について、追加の指針があればご教示いただきたい。\n3124.共同募集と紹介スキームの併存について共同募集において取り扱い会社数の差異が顧客の選択肢を狭める場合、A代理店が共同募集ではなく紹介スキームを選択することは、顧客本位の観点から許容されると理解している。\nこの点について、共同募集と紹介スキームの選択基準について金融庁としての考え方があればご教示いただきたい。","pageStart":311,"pageEnd":313,"answer":"共同募集については、保険業法上、独立した募集形態として特別に規定されているものではなく、複数の保険募集人が関与する実務上の募集形態であると考えられます。\nしたがって、共同募集を行う場合であっても、各保険募集人において、権限明示、意向把握・確認、情報提供、比較推奨販売に係る説明等、関係法令及び監督指針上求められる義務を適時・適切に履行する必要があります。\nこのうち、意向把握を行う場合は、顧客の意向は募集過程において変わり得ることを踏まえつつ、共同かつ一連の保険募集の中で適切かつ丁寧に意向把握を行う必要があります。\nこれらを踏まえ、共同募集における比較推奨販売の対象範囲や責任の所在については、各保険募集人の顧客の意向形成への関与の度合い、顧客への説明・提案の実態等に照らし、個別具体的に判断されます。\n乗合代理店が比較推奨販売を行う場合には、当該代理店が取り扱う二以上の比較可能な同種の保険契約を前提に、顧客の意向に沿った適切な選別・推奨を行う必要があります。よって、共同募集であることのみを理由に、比較対象を共同募集に関与する代理店間で共通して取り扱う保険契約に固定する運用は、顧客の適切な商品選択の機会を実質的に阻害するため、適切とはいえません。\nなお、乗合代理店が、他の乗合代理店との共同募集形態を採用するか、募集関連行為従事者と乗合代理店による募集形態を採用するかについては各社の判断に委ねられますが、募集関連行為従事者については、Ⅱ－4－2「保険募集管理態勢」の「(1)保険募集の意義」や「(2)\n「募集関連行為」について」に照らして、当該行為が保険募集に該当しないように留意する必要があります。","theme":"共同募集","section":"監督指針","tags":["比較推奨","意向把握","共同募集"]},{"no":545,"location":"Ⅱ－4－2－9(5)","comment":"乗合代理店であっても、保険業法施行規則に規定する「二以上の所属保険会社等が引き受ける保険に係る二以上の比較可能な同種の保険契約」がない場合には、推奨販売を行うことは求められないと理解している。「「平成26年改正保険業法(2年以内施行)に係る政府令・監督指針案」\nに対するパブリックコメント結果等について」における「コメントの概要及びコメントに対する金融庁の考え方」\nNo.195(4)において示されているとおり、共同募集において取り扱うことのできる商品は、両代理店に共通するもののみであるとの考え方が示されているが、比較推奨販売規制を潜脱する目的で乗合代理店が他の代理店と共同で保険募集を行うことは不適切であるとの理解でよいか。","pageStart":313,"pageEnd":313,"answer":"ご指摘のとおり、比較推奨販売規制を潜脱する目的で、乗合代理店が他の代理店との共同募集を利用することは適切ではありません。\n「「平成26年改正保険業法(2年以内施行)に係る政府令・監督指針案」に対するパブリックコメント結果等について」における「コメントの概要及びコメントに対する金融庁の考え方」No.195(4)\nは、把握した顧客の具体的な意向を踏まえ、共同募集により取り扱う保険契約が選定されたことを前提として、当該共同募集において取り扱うことのできる保険契約は、両代理店において共通して取り扱われる契約に限られることを明らかにしたものであって、比較推奨販売の対象を一律に共同募集に係る保険契約に限定することまでを許容する趣旨ではありません。","theme":"共同募集","section":"監督指針","tags":["比較推奨","共同募集"]},{"no":546,"location":"Ⅱ－4－2－9(5)","comment":"複数の代理店が共同で保険募集(代理店分担)を行う場合の「乗合代理店における比較推奨販売」について考え方を整理していただきたい。\nA代理店(ア保険会社専属代理店)とB代理店(ア保険会社・イ保険会社・ウ保険会社の3社乗合代理店)が代理店分313担で共同で顧客に保険募集を行う場合、A代理店が1社専属代理店であることをもって「乗合代理店における比較推奨販売」の対象外とみなすとの理解でよいか。\nまた、この考え方・判断基準は幹事代理店・非幹事代理店如何で変わるか。\n加えてこの場合、A代理店(1社専属代理店)が保険会社のグループ会社等、保険会社直資代理店等である場合、B代理店に対し実質的に自社(ア保険会社)の優先的な取り扱いを促すものであり過度の便宜供与になると考えるが、如何か。\nB代理店(ア保険会社・イ保険会社・ウ保険会社の3社乗合代理店)とC代理店(ア保険会社・イ保険会社の2社乗合代理店)が代理店分担で共同で顧客に保険募集を行う場合、「乗合代理店における比較推奨販売」の考え方として、B代理店・C代理店共通で取り扱いのあるア保険会社・イ保険会社の2社を比較・推奨販売すれば良いという理解でよいか。","pageStart":313,"pageEnd":314,"answer":"共同募集については、保険業法上、独立した募集形態として特別に規定されているものではなく、複数の保険募集人が関与する実務上の募集形態であると考えられます。したがって、共同募集を行う場合であっても、各保険募集人において、権限明示、意向把握・確認、情報提供、比較推奨販売に係る説明等、関係法令及び監督指針上求められる義務を適時・適切に履行する必要があります。\nこのうち、意向把握を行う場合は、顧客の意向が募集過程において変わり得ることを踏まえつつ、共同かつ一連の保険募集の中で適切かつ丁寧に意向把握を行う必要があります。\n比較推奨販売に係る規定の適用については、共同募集に専属代理店が関与していることのみをもって、乗合代理店における当該規定の適用が当然に排除されるものではありません。また、幹事代理店・非幹事代理店の別によって直ちに判断が異なるものでもなく、顧客への説明・提案の実態、顧客の意向形成への関与等を踏まえて個別具体的に判断されます。なお、各乗合代理店が実質的に担う保険募集の実態とは無関係に、形式的な役割分担等を定め、比較推奨販売に係る規定の適用関係を判断する場合には、顧客の適切な商品選択の機会を阻害し得るものとして問題となり得ます。\n乗合代理店が推奨販売を行う場合には、当該代理店が取り扱う「二以上の比較可能な同種の保険契約」を前提に、顧客の意向に沿った適切な提示・推奨を行う必要があります。よって、共同募集に関与する代理店間で共通して取り扱う保険契約のみに比較対象を限定することが、顧客の適切な商品選択の機会を実質的に阻害し得る場合には、比較推奨販売規制の趣旨に照らし問題となり得ます。\nまた、保険会社のグループ会社等であるかを問わず、代理店との共同募集が、特定の保険会社の商品を優先的に取り扱わせる目的又はその効果を有する場合には、比較推奨販売規制の潜脱や顧客の適切な商品選択の機会を実質的に阻害する行為に該当し得るかについて、個別具体的に検証される必要があります。","theme":"共同募集","section":"監督指針","tags":["便宜供与","比較推奨","意向把握","共同募集"]},{"no":547,"location":"－","comment":"比較推奨販売に関し、現在集団募集を実施する際は1社推奨で実施している。A代理店(1社専属)とB代理店(乗合代理店)で共同募集を行う場合、B代理店はA代理店と共通する保険会社1社のみの販売でもよいのか確認したい。","pageStart":314,"pageEnd":314,"answer":"共同募集については、保険業法上、独立した募集形態として特別に規定されているものではなく、複数の保険募集人が関与する実務上の募集形態であると考えられます。したがって、共同募集を行う場合であっても、各保険募集人において、権限明示、意向把握・確認、情報提供、比較推奨販売に係る説明等、関係法令及び監督指針上求められる義務を適時・適切に履行する必要があります。\nこのうち、意向把握を行う場合は、顧客の意向が募集過程において変わり得ることを踏まえつつ、共同かつ一連の保険募集の中で適切かつ丁寧に意向把握を行う必要があります。\n比較推奨販売に係る規定の適用については、共同募集に専属代理店が関与していることのみをもって、乗合代理店における当該規定の適用が当然に排除されるものではありません。また、幹事代理店・非幹事代理店の別によって直ちに判断が異なるものでもなく、顧客への説明・提案の実態、顧客の意向形成への関与等を踏まえて個別具体的に判断されます。なお、各乗合代理店が実質的に担う保険募集の実態とは無関係に、形式的な役割分担等を定め、比較推奨販売に係る規定の適用関係を判断する場合には、顧客の適切な商品選択の機会を阻害し得るものとして問題となり得ます。\n乗合代理店が推奨販売を行う場合には、当該代理店が取り扱う「二以上の比較可能な同種の保険契約」を前提に、顧客の意向に沿った適切な提示・推奨を行う必要があります。よって、共同募集に関与する代理店間で共通して取り扱う保険契約のみに比較対象を限定することが、顧客の適切な商品選択の機会を実質的に阻害し得る場合には、比較推奨販売規制の趣旨に照らし問題となり得ます。\nまた、保険会社のグループ会社等であるかを問わず、代理店との共同募集が、特定の保険会社の商品を優先的に取り扱わせる目的又はその効果を有する場合には、比較推奨販売規制の潜脱や顧客の適切な商品選択の機会を実質的に阻害する行為に該当し得るかについて、個別具体的に検証される必要があります。","theme":"共同募集","section":"監督指針","tags":["比較推奨","意向把握","共同募集"]},{"no":548,"location":"Ⅱ－4－2－9(5)","comment":"二以上の保険募集人にて共同募集を行う場合、共同募集に関する顧客意向(同意)を確認し、保険募集人が共通で取り扱う保険会社商品以外の指定がなければ、保険募集人が共通で取扱う保険会社商品の範囲における比較可能な同種の保険商品の中から提示・推奨することは認められると314の理解でよいか。","pageStart":314,"pageEnd":315,"answer":"共同募集については、保険業法上、独立した募集形態として特別に規定されているものではなく、複数の保険募集人が関与する実務上の募集形態であると考えられます。したがって、共同募集を行う場合であっても、各保険募集人において、権限明示、意向把握・確認、情報提供、比較推奨販売に係る説明等、関係法令及び監督指針上求められる義務を適時・適切に履行する必要があります。\nこのうち、意向把握を行う場合は、顧客の意向が募集過程において変わり得ることを踏まえつつ、共同かつ一連の保険募集の中で適切かつ丁寧に意向把握を行う必要があります。\n比較推奨販売に係る規定の適用については、共同募集に専属代理店が関与していることのみをもって、乗合代理店における当該規定の適用が当然に排除されるものではありません。また、幹事代理店・非幹事代理店の別によって直ちに判断が異なるものでもなく、顧客への説明・提案の実態、顧客の意向形成への関与等を踏まえて個別具体的に判断されます。なお、各乗合代理店が実質的に担う保険募集の実態とは無関係に、形式的な役割分担等を定め、比較推奨販売に係る規定の適用関係を判断する場合には、顧客の適切な商品選択の機会を阻害し得るものとして問題となり得ます。\n乗合代理店が推奨販売を行う場合には、当該代理店が取り扱う「二以上の比較可能な同種の保険契約」を前提に、顧客の意向に沿った適切な提示・推奨を行う必要があります。よって、共同募集に関与する代理店間で共通して取り扱う保険契約のみに比較対象を限定することが、顧客の適切な商品選択の機会を実質的に阻害し得る場合には、比較推奨販売規制の趣旨に照らし問題となり得ます。\nまた、保険会社のグループ会社等であるかを問わず、代理店との共同募集が、特定の保険会社の商品を優先的に取り扱わせる目的又はその効果を有する場合には、比較推奨販売規制の潜脱や顧客の適切な商品選択の機会を実質的に阻害する行為に該当し得るかについて、個別具体的に検証される必要があります。","theme":"共同募集","section":"監督指針","tags":["比較推奨","意向把握","共同募集"]},{"no":549,"location":"Ⅱ－4－2－9(5)","comment":"所属保険会社が必ずしも同一ではない乗合代理店間における共同募集の場合は、所属保険会社が異なることから、代理店分担ができない保険会社商品が発生する可能性がある。\n共同募集における比較推奨販売の方法においては、他の共同募集代理店の取り扱いができない(乗り合っていない)保険会社の商品は比較推奨販売の対象外としてよいか。","pageStart":315,"pageEnd":315,"answer":"共同募集の場合であっても、比較推奨販売に係る規定の適用の有無は、各代理店の顧客の意向形成への関与の度合い、顧客への説明・提案の実態等を踏まえて個別具体的に判断されます。\n比較推奨販売を行う乗合代理店において、自ら取り扱う二以上の比較可能な同種の保険契約が存在する場合には、これらを前提として、顧客の意向に沿った適切な選別・推奨を行う必要があります。\nしたがって、共同募集に関与する他の代理店が取り扱っていないことを理由に、当該保険契約を比較推奨販売の対象外とすることは、顧客の適切な商品選択の機会を実質的に阻害するため、適切とはいえません。\nまた、共同募集の枠組みそのものを用いて比較推奨販売に係る規制を潜脱し得る運用を行う場合には、問題となり得ます。","theme":"共同募集","section":"監督指針","tags":["比較推奨","共同募集"]},{"no":550,"location":"Ⅱ－4－2－9(5)","comment":"2以上の代理店間で共同募集を行う場合に、それぞれの提携保険会社が異なるケースでは、いずれとも提携のある保険会社のみを比較推奨する場合、提案する保険会社を絞り込めるとの認識でよいか。","pageStart":315,"pageEnd":315,"answer":"共同募集の場合であっても、比較推奨販売に係る規定の適用の有無は、各代理店の顧客の意向形成への関与の度合い、顧客への説明・提案の実態等を踏まえて個別具体的に判断されます。\n比較推奨販売を行う乗合代理店において、自ら取り扱う二以上の比較可能な同種の保険契約が存在する場合には、これらを前提として、顧客の意向に沿った適切な選別・推奨を行う必要があります。\nしたがって、共同募集に関与する他の代理店が取り扱っていないことを理由に、当該保険契約を比較推奨販売の対象外とすることは、顧客の適切な商品選択の機会を実質的に阻害するため、適切とはいえません。\nまた、共同募集の枠組みそのものを用いて比較推奨販売に係る規制を潜脱し得る運用を行う場合には、問題となり得ます。","theme":"共同募集","section":"監督指針","tags":["比較推奨","共同募集"]},{"no":551,"location":"Ⅱ－4－2－9(5)","comment":"代理店と保険会社が既契約者(当該乗合代理店が取り扱う当該保険会社又はそのグループ企業である保険会社の既契約の保険契約者)に対して同時に保険募集を行う場合(例えば、乗合代理店に所属する保険募集人と保険会社に所属する保険募集人が同行募集を行う場合や、乗合代理店と保険会社が連名で郵送等の非対面方式によって保険募集を行う場合)は、当該乗合代理店と当該保険会社、またはそのグループ企業である保険会社が共通して取り扱う保315険契約の範囲によって「比較可能な同種の保険契約」の有無・範囲を判断することになるという理解でよいか。\nなお、保険会社が自らの既契約者ではなくグループ企業の保険会社の既契約者に関する情報を利用できるのは、個人情報保護法第27条第5項第3号に定める特定共同利用の措置が講じられているためである。","pageStart":315,"pageEnd":316,"answer":"ご指摘のような保険会社と乗合代理店による共同募集においても、比較推奨販売に係る規定の適用は、各主体の顧客の意向形成への関与の度合い、顧客への説明・提案の実態等を踏まえて個別具体的に判断されます。\n乗合代理店が推奨販売を行う場合には、当該乗合代理店が取り扱う二以上の比較可能な同種の保険契約を前提に、顧客の意向に沿った適切な選別・推奨を行う必要があります。\nしたがって、保険会社と乗合代理店が共通して取り扱う保険契約のみに比較推奨販売の対象を限定することが、顧客の適切な商品選択の機会を実質的に狭める場合には、適切とはいえません。\nなお、顧客が当該保険会社又はそのグループ会社の商品を明確に希望している場合には、その具体的な意向に即して対応することが考えられます。また、当該意向が顧客の主体的な判断に基づくものか、個別具体的に確認する必要があるほか、顧客の判断が恣意的なものとならないよう留意が必要です。","theme":"共同募集","section":"監督指針","tags":["比較推奨","共同募集"]},{"no":552,"location":"Ⅱ－4－2－9(5)","comment":"次のようなケースでは選択の余地がなく保険契約を提示・推奨することになると考えられるが問題ないか。その場合に「顧客の求めに応じて」行う「当該提示・推奨する基準や理由等」については、それぞれ選択の余地がない理由を説明することでよいか。\n特定の代理店と保険会社における特定の保険商品に関する共同募集契約に基づき、当該特定の代理店から顧客紹介を受け、業務分担により保険商品を提示・推奨するため、当該特定の保険会社の特定の商品のみを提示・推奨する。\nなお、別の保険会社の商品の提示を求める等の顧客意向が示された場合は、当然にそれら保険契約の概要又は契約内容の説明することを前提とする。","pageStart":316,"pageEnd":316,"answer":"ご意見にあるケースについては、共同募集契約や業務分担の内容のみをもって、直ちに特定の保険会社・商品だけを提示・推奨することが許容されるものではありません。\n比較推奨販売を行う乗合代理店において、自ら取り扱う「二以上の比較可能な同種の保険契約」が存在する場合には、顧客の意向に沿って適切に選別・推奨し、その基準や理由を合理的に説明する必要があります。\n共同募集や顧客紹介の枠組みを通じて、実質的に比較対象を限定し、顧客の適切な商品選択の機会を狭めるおそれのある運用が行われる場合には、比較推奨販売規制の趣旨に照らし問題となり得ます。\nなお、顧客が特定の商品を明確に希望している場合や、他の商品説明を求めた場合には、当該意向が顧客の主体的判断に基づくものか、個別具体的に確認する必要があるほか、その意向に応じて適切に対応する必要があります。\n保険会社と乗合代理店が共同で保険募集を行う場合であっても、比較推奨販売に係る規定の適用は、各主体の顧客の意向形成への関与の度合い、顧客への説明・提案の実態等を踏まえて個別具体的に判断されます。\n乗合代理店が推奨販売を行う場合には、当該乗合代理店が取り扱う二以上の比較可能な同種の保険契約を前提に、顧客の意向に沿った適切な提示・推奨を行う必要があります。\nしたがって、保険会社と乗合代理店が共通して取り扱う保険契約のみに比較推奨販売の対象を限定することを通じて、顧客の適切な商品選択の機会を実質的に狭めるおそれのある運用が行われる場合には、比較推奨販売規制の趣旨に照らし問題となり得ます。","theme":"共同募集","section":"監督指針","tags":["比較推奨","共同募集"]},{"no":553,"location":"Ⅱ－4－2－9(5)","comment":"乗合代理店と保険会社が既契約者(当該乗合代理店が取り扱う当該保険会社の既契約の保険契約者)に対して共同で保険募集を行う場合は、当該乗合代理店と当該保険会社316が共通して取り扱う保険契約の範囲によって「比較可能な同種の保険契約」の有無・範囲を判断することになるという理解でよいか。","pageStart":316,"pageEnd":317,"answer":"ご意見にあるケースについては、共同募集契約や業務分担の内容のみをもって、直ちに特定の保険会社・商品だけを提示・推奨することが許容されるものではありません。\n比較推奨販売を行う乗合代理店において、自ら取り扱う「二以上の比較可能な同種の保険契約」が存在する場合には、顧客の意向に沿って適切に選別・推奨し、その基準や理由を合理的に説明する必要があります。\n共同募集や顧客紹介の枠組みを通じて、実質的に比較対象を限定し、顧客の適切な商品選択の機会を狭めるおそれのある運用が行われる場合には、比較推奨販売規制の趣旨に照らし問題となり得ます。\nなお、顧客が特定の商品を明確に希望している場合や、他の商品説明を求めた場合には、当該意向が顧客の主体的判断に基づくものか、個別具体的に確認する必要があるほか、その意向に応じて適切に対応する必要があります。\n保険会社と乗合代理店が共同で保険募集を行う場合であっても、比較推奨販売に係る規定の適用は、各主体の顧客の意向形成への関与の度合い、顧客への説明・提案の実態等を踏まえて個別具体的に判断されます。\n乗合代理店が推奨販売を行う場合には、当該乗合代理店が取り扱う二以上の比較可能な同種の保険契約を前提に、顧客の意向に沿った適切な提示・推奨を行う必要があります。\nしたがって、保険会社と乗合代理店が共通して取り扱う保険契約のみに比較推奨販売の対象を限定することを通じて、顧客の適切な商品選択の機会を実質的に狭めるおそれのある運用が行われる場合には、比較推奨販売規制の趣旨に照らし問題となり得ます。","theme":"共同募集","section":"監督指針","tags":["比較推奨","共同募集"]},{"no":554,"location":"Ⅱ－4－2－9(5)","comment":"A代理店(乗合5社)とB代理店(乗合20社)が共同募集を行う場合、両代理店が共通して取り扱う5社の商品だけを比較・提案する運用は、保険業法施行規則第227条の2第3項第4号ロおよび最善利益勘案義務の観点から適切といえるか。顧客意向に沿った商品選定を行うためには、B代理店が取り扱う20社の中に比較対象を広げる必要があるか。\n共同募集を行う場合、比較推奨販売の責任はどちらの代理店に帰属すると考えるべきか。役割分担(例：一方が提案主体、他方が手続補助)を明示すれば、法令上問題ないと考えてよいか。\n「共同募集の場合は共通取扱社のみを比較対象とする」\nという固定ルールは、監督指針の趣旨に反する不適切な運用と考えられるか。顧客意向に基づく比較結果として共通社に絞られる場合は適切と考えてよいか。\n共同募集において、比較推奨販売の適正性を担保するために必要な証跡(比較表、推奨理由、非提示理由等)の範囲317や保存期間について、金融庁として標準的なガイドラインを示す予定はあるか。","pageStart":317,"pageEnd":318,"answer":"共同募集については、保険業法上、独立した募集形態として特別に規定されているものではなく、複数の保険募集人が関与する実務上の募集形態であると考えられます。したがって、共同募集を行う場合であっても、各保険募集人において、権限明示、意向把握・確認、情報提供、比較推奨販売に係る説明等、関係法令及び監督指針上求められる義務を適時・適切に履行する必要があります。\nこのうち、意向把握を行う場合は、顧客の意向が募集過程において変わり得ることを踏まえつつ、共同かつ一連の保険募集の中で適切かつ丁寧に意向把握を行う必要があります。\n共同募集における比較推奨販売の対象範囲や責任の所在については、各保険募集人の顧客の意向形成への関与の度合い、顧客への説明・提案の実態等を踏まえて個別具体的に判断されるものと考えられます。\n乗合代理店が比較推奨販売を行う場合には、当該代理店が取り扱う二以上の比較可能な同種の保険契約を前提に、顧客の意向に沿った適切な選別・推奨を行う必要があります。よって、共同募集であることのみを理由に、比較対象を共同募集に関与する代理店間で共通して取り扱う保険契約に固定する運用は、顧客の適切な商品選択の機会を実質的に阻害するため、適切とはいえません。一方、顧客の意向に基づく選別の結果として、共通取扱社の商品が提示・推奨されることまで否定されるものではありません。\n比較推奨販売に係る証跡管理については、金融庁として一律の様式や保存期間を定めるものではなく、各保険募集人において、意向把握、比較対象の範囲、推奨理由等について、事後的に検証可能な形で適切に管理することが重要です。","theme":"共同募集","section":"監督指針","tags":["比較推奨","意向把握","証跡・記録","共同募集"]},{"no":555,"location":"Ⅱ－4－2－9(5)","comment":"2社と乗り合うA代理店と当該2社を含む5社と乗り合うB代理店が共同募集を行う場合に、まずA代理店のみが顧客に対して募集を行い、顧客の同意を得た上で、その後にB代理店も当該顧客に対してA代理店とともに募集を行う場合は、A代理店とB代理店が共通して乗り合う2社の範囲で比較推奨販売を行うことになるという理解でよいか。\nなお、前提として、いずれの代理店も、募集に当たり保険業法が定める権限明示を適切に行うこととする。\nこの場合、B代理店にとって、監督指針Ⅱ－4－2－9(5)①B.(a)第2段落に基づいて5社の保険契約の中からA代理店と共通して乗り合う2社の保険契約を推奨する訳ではなく、A代理店と共同募集を行う2社の保険契約の範囲内で「二以上の比較可能な同種の保険契約」を考えることになるため、残り3社の保険契約は同①B.(a)第2段落に定める318「推奨する特定の保険契約以外の保険契約」に該当しないという理解でよいか。","pageStart":318,"pageEnd":319,"answer":"乗合代理店が比較推奨販売を行う場合においては、当該代理店が取り扱う二以上の比較可能な同種の保険契約を前提として、顧客の意向に沿った適切な選別・推奨を行う必要があります。\nしたがって、ご意見にあるケースにおいて、B代理店が5社の商品を取り扱っているにもかかわらず、共同募集であることやA代理店と共通して取り扱うことのみを理由に、比較対象を2社に限定することは、顧客の適切な商品選択の機会を実質的に阻害すると考えられ、適切とはいえません。","theme":"共同募集","section":"監督指針","tags":["比較推奨","共同募集"]},{"no":556,"location":"Ⅱ－4－2－9(5)","comment":"比較推奨販売(保険業法施行規則第227条の2第3項第4号ロ(以下、ロ方式とする。))における取扱い実績のない委託保険会社の取扱いについて確認したい。\n当社は生保において22社の代理店委託があるが、当社が単独募集で取り扱い実績があるのは13社のみであり、他は共同募集(当社は非幹事で、幹事代理店が意向把握の対応を行う業務分担)での取扱実績の保険会社である。\nその中、当社は現在、会社方針により、第一分野で7社、第三分野で2社の推奨会社を設定している。今後、比較推奨販売についてロ方式で対応する場合、単独での募集実績のある13社の範囲でのみ顧客意向に沿った推奨保険会社・商品のご提案を行うことで問題ないか。","pageStart":319,"pageEnd":319,"answer":"比較推奨販売を行う乗合代理店においては、代理店委託契約(当該委託契約に基づき、覚書等によりその内容が定められる場合を含む。)に基づき取り扱うことが可能な保険契約の中に、二以上の比較可能な同種の保険契約が存在する場合には、これらを前提として、顧客の意向に沿った適切な選別・推奨を行う必要があります。\nしたがって、単独募集での取扱実績がないことや、共同募集での取扱実績にとどまることを理由として、当該保険契約を一律に比較推奨の対象外とすることは適切とはいえません。\nなお、「二以上の比較可能な同種の保険契約」の意義に照らして、乗合代理店が独自の判断で、推奨する特定の保険契約をあらかじめ設定することは許容されません。","theme":"共同募集","section":"監督指針","tags":["比較推奨","意向把握","共同募集"]},{"no":557,"location":"－","comment":"他代理店との共同募集(当社は事務のみ)のために代理店委託契約を締結し、お客さまに対する直接の募集業務を実施していない保険会社が複数社存在している。\nこの場合、これら提携保険会社の保険商品は、代理店委託契約はあるものの、当社としては単独で取り扱う方針ではないため、比較推奨の対象外としたいと考えている。\nこのため、以下の方法の可否を検討している。\na.一部保険会社との代理店委託契約を解約する。\nb.保険会社ごとに対応が可能であれば、代理店委託契約により取扱商品・種目・チャネル等を限定する旨の覚書を締結する。\n319c.当該代理店と役割分担を明確にした協定を締結し、保険会社に承認してもらうことで取扱範囲を絞る。\nd.グループ会社として別代理店を設立し、共同募集は当該会社へ移管し、当社においては不要な代理店委託契約を解約する。","pageStart":319,"pageEnd":320,"answer":"比較推奨販売を行う乗合代理店においては、保険会社から委託を受け、実際に取り扱うことが可能な保険契約の中に、「二以上の比較可能な同種の保険契約」が存在する場合には、これらを前提として、顧客の意向に沿った適切な提示・推奨を行う必要があります。\nしたがって、代理店委託契約上取り扱うことが可能な保険契約については、共同募集において自社が事務のみを担うことや、単独募集で取り扱う方針がないことを理由に、直ちに比較推奨販売の対象外とすることは適切ではありません。\n一方、保険会社との代理店委託契約や覚書等により、取扱商品・種目等が明確に限定され、当該代理店が実際に取り扱うことができない保険契約については、比較推奨販売の対象とはなりません。\nただし、比較推奨販売に係る規定を潜脱し、又は、顧客の適切な商品選択の機会を実質的に狭める目的・態様で行われる場合には問題となるため留意が必要です。","theme":"共同募集","section":"監督指針","tags":["比較推奨","共同募集"]},{"no":558,"location":"Ⅱ－4－2－9(5)","comment":"乗合代理店と保険会社又は当該保険会社の専属代理店(以下「専属代理店」という。)が乗合代理店の顧客(乗合代理店が案内する時点では保険会社や専属代理店の顧客ではない前提)に対して、共同で保険募集を行うことを想定しているケースにおいて、まず、乗合代理店が当該顧客に対して共同募集による案内の意向の有無を確認し(適切に権限明示を行う前提)、当該顧客から、その意向が確認できた場合には、当該乗合代理店と当該保険会社又は当該専属代理店が共通して取り扱う保険契約を募集することができるという理解でよいか。","pageStart":320,"pageEnd":320,"answer":"共同募集を希望する旨の顧客の意向が確認された場合であっても、そのことのみをもって、比較推奨販売の対象を共同募集により取り扱う保険契約に限定できるものではありません。\n顧客の意向把握に当たっては、共同募集の方法に関する意向だけでなく、保障(補償)内容、保険料水準等、保険契約の選択に関する顧客の具体的な意向を把握する必要があります。\nその上で、当該顧客の意向が、保険会社又は専属代理店との共同募集により取り扱う特定の保険契約に係るものであることが明確である場合には、その意向に沿った対応が考えられます。\n一方、比較推奨販売を行う乗合代理店において二以上の比較可能な同種の保険契約が存在する場合には、共同募集の形式により比較対象を不当に限定することなく、顧客の意向に沿った適切な選別・提案を行う必要があります。","theme":"共同募集","section":"監督指針","tags":["比較推奨","意向把握","共同募集"]},{"no":559,"location":"Ⅱ－4－2－9(5)","comment":"該当箇所：監督指針Ⅱ－4－2－9(5)①B意見：保険会社と乗合代理店、または保険代理店同士(専属代理店と乗合代理店、または乗合代理店同士)が、いずれも募集当事者として名称を示して一の顧客に対して共同で保険募集(以下「共同募集」という。)を行うことがある。共同募集については、「「平成26年改正保険業法(2年以内施320行)に係る政府令・監督指針案」に対するパブリックコメント結果等について」における「コメントの概要及びコメントに対する金融庁の考え方」No.195(4)において、「共同募集において取り扱うことのできるのは、両代理店に共通する商品のみ」という考え方が示されていることを踏まえると、①各保険募集人が担う役務について、その必要性を客観的かつ合理的に説明できるものであり、共同募集が比較推奨販売規制等の募集規制を潜脱する意図を有するものではなく(例えば、以下のようなケース)、かつ②各保険募集人に支払われる保険募集手数料の配分の設定について、各保険募集人が担う役務の対価性に照らして相応のものとなっており、役務やサービスの提供を受ける顧客にもきちんと説明できる合理的なものとなっていることを考慮した適切な設定としている場合には、推奨販売を行うことができる保険商品は、共同募集を行う各保険募集人が共通して取り扱う保険商品のみであり、その範囲内で適切に推奨販売が履行される必要があるとの理解でよいか。\n＜共同募集が実施されるケース＞(1)保険会社と乗合代理店による共同募集保険代理店チャネルを主軸とする保険会社が主体となり、多数の既契約者に対し、一括して最新の保障内容に関する情報提供やアフターフォローを企画する場合において、当該保険会社の特性上、全ての顧客対応を保険会社の321みで行うことが困難であることから、保険会社と担当代理店(乗合代理店)が各々の役割を書面で定め、共同募集を実施するケース(2)保険代理店同士(専属代理店と乗合代理店、または乗合代理店同士)による共同募集非対面での保険募集やアフターフォローを行うことを基本とする保険代理店で加入した既契約者に対し、当該代理店が最新の保障内容に関する情報提供やアフターフォローを行おうとする場合において、顧客から対面での対応を希望される場合があることから、当該ニーズに応えるため、当該代理店と保険会社が協議し、当該顧客の居住地域の近隣にある別の保険代理店と共同募集を実施するケース※共同募集を行う場合は、顧客に対して共同募集を行う旨をあらかじめ案内した上で、顧客が共同募集を望まない意向を示した場合には、共同募集を行わないものとする。","pageStart":320,"pageEnd":322,"answer":"共同募集を行うことの是非に関しても、乗合代理店が関与する場合、共同募集を行う当事者間において、当該方法を用いることにより、顧客の適切な商品選択の機会を不当に狭めないか、比較推奨販売規制の潜脱となるおそれはないか、顧客の意向を踏まえた対応が可能であるか等の観点から、個別具体的に判断される必要があり、これらに反するおそれのある業務運営が行われた場合には問題となり得ます。貴見が示されるような点についても、最終的には個別具体的に判断される必要がありますが、既契約者に対するアフターフォローの一環として、顧客の最善の利益を勘案し、これらの観点から十分に検討された上で実施されることが重要です。","theme":"共同募集","section":"監督指針","tags":["手数料・インセンティブ","比較推奨","顧客の最善の利益","共同募集"]},{"no":560,"location":"Ⅱ－4－2－9(5)","comment":"今回の改正において、下記のような事案は適切な比較推奨販売を行っているとは言えないと考えてよいか。\n生命保険募集においては、乗合代理店は自力で営業先を開拓出来ない実力不足の所属募集人に対し、リーズ提供会社を通して見込客の提供を行うことがある。一例として、乗合代理店に対し、クレジットカード会社の会員や運送会社の社員等を見込客として紹介することがある。このような行為を行う会社をリーズ提供会社と呼んでおり、リーズ提供自体は問題無いと考えているが、下記のような事案は322問題があると考えている。\n【事例】甲：リーズ提供会社。取扱いが可能な生命保険会社数は3～10社程度。\n乙：甲からリーズ提供を受ける乗合代理店。取扱いが可能な生命保険会社数は30社前後。\n乙は甲から提供された見込客と商談を行うが、商談冒頭で見込客に対して渡す名刺には「取扱い保険会社数30社」\nと記載しているにもかかわらず、実際に商談で提示するのは甲が乗り合っている3～10社のみである。\n乙は見込客に対し、実際はリーズ提供会社の都合で3～10社しか提案できないにもかかわらず、30社取り扱うことができると虚偽の内容が記載された名刺を渡していることになる。\n乙が甲に対して忖度をし、提案保険会社数を絞り込んでいることから、見込客にとっては「複数社の比較検討した上での契約」とは言えないのではないか。\n今後、上記のようなリーズ提供会社による見込客供給の形は全て「顧客の適切な商品選択の阻害」になることから、適切な比較推奨販売を行ったことにならず、保険業法違反になるという認識でよいか。\nリーズ提供を受けた見込客に対して、30社取り扱うことができないにもかかわらず、取り扱うことができると誤認させるような記載がなされた名刺を渡している乗合代理店は、比較推奨販売に係る態勢整備という観点から金融庁323として改めるべきとの考えか。\nまた、現状では乗合代理店の大半が、「リーズ提供会社から提供された見込み客に対しては、特定の保険会社しか取り扱えない」ことが記載されたExcelファイルを社内で共有している。このようなファイルが存在していること自体が複数商品を比較推奨しているとは言えないと考えており、金融庁として今後は許すわけにはいかないと考えていると認識してよいか。","pageStart":322,"pageEnd":324,"answer":"貴見において想定されているケースは、必ずしも明らかではございませんが、保険募集人が保険募集を行おうとする時は、保険業法第294条第3項に基づき、あらかじめ所属保険会社等の商号等を明示する必要があります。\nまた、乗合代理店において、所属保険会社等から委託を受ける保険商品のうち、「二以上の比較可能な同種の保険契約」について、適切に比較推奨販売を行う必要があります。\n比較推奨販売においては、顧客の意向を適切に把握することを前提に、提示・推奨の範囲や理由について、顧客に対して合理的かつ分かりやすく説明されることが重要です。\nいずれにせよ、営業上の都合により推奨範囲が不当に限定されるような形態については、顧客本位の業務運営の観点から問題となり得るものであり、引き続き、実態を踏まえたモニタリングを行うとともに、必要に応じて適切な対応を求めていきます。","theme":"共同募集","section":"監督指針","tags":["比較推奨"]},{"no":561,"location":"－","comment":"複数の保険代理店が共同して一つの保険販売を取扱う共同募集(A代理店：所属保険会社一社の専属代理店、B代理店：所属保険会社二以上の乗合代理店)において、比較推奨販売の要否は以下の理解でよいか。\n1.顧客に初めに保険募集を行うのがA代理店(専属)である場合、専属代理店であることを権限明示することにより、当該所属保険会社で加入する顧客の意思が明確となるため、共同募集を行うB代理店が乗合代理店であっても比較推奨販売は不要。\n2.顧客に初めに保険募集を行うのがB代理店(乗合)である場合、B代理店が複数の所属保険会社を有することを権限明示するとともに、比較可能な同種の保険契約がある限りにおいては、A代理店との共同募集を前提として比較推奨販売を行わないことは認められず、比較推奨販売が必要であり、その結果、A代理店の所属保険会社が選定された場合に限って共同募集を行うこととなる。\n324","pageStart":324,"pageEnd":325,"answer":"共同募集における比較推奨販売の要否については、専属代理店、又は乗合代理店のいずれが先に顧客対応を行ったかのみで決まるものではなく、各代理店の顧客の意向形成への関与の度合い、顧客への説明・提案の実態等を踏まえて個別具体的に判断されます。\n顧客が専属代理店から説明を受けたことのみをもって、直ちに当該保険会社の商品を希望する意思が明確になったとはいえず、その後、乗合代理店が比較推奨販売に関与する場合には、当該乗合代理店が取り扱う比較可能な同種の保険契約を前提に、顧客の意向に沿った適切な選別・提案を行う必要があります。\nしたがって、専属代理店を先行させることにより、乗合代理店に係る比較推奨販売規制を回避し得る運用が行われる場合には、規制の潜脱として問題となり得ます。\n一方、乗合代理店が先に顧客対応を行い、比較可能な同種の保険契約が存在する場合には、顧客の意向に沿って適切に比較推奨販売を行う必要があります。その結果、専属代理店の所属保険会社等の商品が選別・提案され、共同募集を行うこと自体は否定されるものではありません。","theme":"共同募集","section":"監督指針","tags":["比較推奨","共同募集"]},{"no":562,"location":"Ⅱ－4－2－9(5)","comment":"現在、共同募集における非幹事会社として複数保険会社に乗り合っている。今後、保険業法施行規則第227条の2第3項第4号ハの撤廃に伴い、非幹事分の保険商品についてもエンドユーザーである顧客に対してご案内する義務が発生するのか。\n義務が発生する場合、非幹事分の商品内容について現状募集人が精通していないとき、・商品が多すぎる場合にお客様へ混乱を招くリスク(CS低下リスク、募集時の事故リスク)\n・商品管理が煩雑、教育訓練の手間暇(経営リスク)\nなどのリスクも想定される。\n非幹事を解消したくとも、形態上困難な場合もある。","pageStart":325,"pageEnd":325,"answer":"保険募集人(乗合代理店)には、法令に基づき、自らの所属保険会社等の保険商品について、顧客の最善の利益を勘案しつつ、公正な保険募集を行うことが求められており、この点は幹事代理店・非幹事代理店の別によって変わるものではありません。そのため、現在の体制整備の状況において、保険契約者等の保護の観点から、自らの規模や業務特性に見合った体制整備を見直すことが必要と考えます。","theme":"共同募集","section":"監督指針","tags":["ハ方式","顧客の最善の利益","共同募集"]},{"no":563,"location":"Ⅱ－4－2－9(5)","comment":"共同募集を行う場合に双方が乗り合っている保険会社の提案を行おうとしたが、非幹事代理店が乗り合っていない保険会社を提案した方が顧客の利益になることが判明した。その場合、非幹事代理店が取扱っていない保険会社を提案する必要があるのか。\nまた、提案する必要がある場合、代理店分担をかけることができないが、共同募集先へ分担相当額の手数料を金員で支払うことは可能か。\n325","pageStart":325,"pageEnd":326,"answer":"共同募集については、保険業法上、独立した募集形態として特別に規定されているものではなく、複数の保険募集人が関与する実務上の募集形態であると考えられます。したがって、共同募集を行う場合であっても、各保険募集人において、権限明示、意向把握・確認、情報提供、比較推奨販売に係る説明等、同法及び監督指針上で求められる義務を適時・適切に履行する必要があります。\nこのうち、意向把握を行う場合は、顧客の意向が募集過程において変わり得ることを踏まえつつ、共同かつ一連の保険募集の中で適切かつ丁寧に意向把握を行う必要があります。\n比較推奨販売を行う乗合代理店において、自ら取り扱う比較可能な同種の保険契約の中に、顧客の意向に適合すると判断される商品がある場合には、共同募集先が当該商品を取り扱っていないことのみを理由に、当該商品を比較・推奨の対象から除外することは適切とはいえません。\nまた、共同募集先が取り扱わない保険契約を提案する場合における金員の支払いについては、当事者間において判断されるべき事項であり回答することは困難です。\nいずれにしても、共同募集の枠組みを用いて顧客の適切な商品選択の機会を阻害し、又は比較推奨販売規制を潜脱するようなものであってはならないと考えます。また、関係法令及び監督指針を遵守し、公正な保険募集を確保することが重要であると考えます。","theme":"共同募集","section":"監督指針","tags":["手数料・インセンティブ","比較推奨","意向把握","共同募集"]},{"no":564,"location":"Ⅱ－4－2－9(5)","comment":"1.取り扱い会社数の多い代理店の説明責任について複数の代理店が共同募集を行う場合、各代理店が取り扱う保険会社数に差異があるケースが想定される。\n例えば、A代理店が10社を取り扱い、B代理店が3社を取り扱う場合、A代理店はより多くの選択肢を顧客に提供できる立場にある。\nこのような状況においては、取扱会社数の多い代理店が、代理店登録者としての責任に基づき、自ら顧客に対して直接商品説明を行うべきであると考える。\n顧客本位の原則に照らすと、最も広い選択肢を提供できる代理店が説明を行うことが、顧客の最善利益に最も適うためである。\n2.取り扱い会社数の少ない代理店の位置づけについて一方で、取扱会社数が少ない代理店が共同募集に参加す326る場合、その代理店が提供できる選択肢は限定的であり、顧客にとって最適な商品が含まれない可能性がある。\nその結果として契約に至らない場合は、市場競争の結果として当該代理店が甘受すべきものと考える。\n顧客本位の原則は、代理店間の収益機会の均等よりも、顧客に最適な選択肢が提示されることを優先すべきであるためである。\n3.共同募集における説明主体の明確化について共同募集において、取扱会社数の少ない代理店が説明主体となることで、本来提示できたはずの選択肢が顧客に届かない場合、顧客の最善利益義務に反する可能性がある。\nしたがって、共同募集における説明主体は、取扱会社数の多い代理店が担うべきであるという点を、監督指針またはQ&A等で明確化いただきたい。","pageStart":326,"pageEnd":327,"answer":"貴重なご意見として承ります。\n共同募集については、保険業法上、独立した募集形態として特別に規定されているものではなく、複数の保険募集人が関与する実務上の募集形態であると考えられます。したがって、共同募集を行う場合であっても、各保険募集人において、権限明示、意向把握・確認、情報提供、比較推奨販売に係る説明等、関係法令及び監督指針上求められる義務を適時・適切に履行する必要があります。\nこのうち、意向把握を行う場合は、顧客の意向が募集過程において変わり得ることを踏まえつつ、共同かつ一連の保険募集の中で適切かつ丁寧に意向把握を行う必要があります。\n共同募集における説明責任の所在については、取扱保険会社数の多寡のみで決まるものではなく、各保険募集人の顧客の意向形成への関与の度合い、顧客への説明・提案の実態等を踏まえて個別具体的に判断されます。\nいずれにせよ、共同募集においても、顧客の適切な商品選択の機会が実質的に確保されるよう、各保険募集人の役割分担を明確にし、顧客に分かりやすく説明することが重要です。","theme":"共同募集","section":"監督指針","tags":["比較推奨","意向把握","共同募集"]},{"no":565,"location":"－","comment":"金融機関本体代理店における火災保険の販売について、比較推奨販売ルールの実務上の取扱いに関する考え方を整理したい。\n一部の金融機関代理店においては、複数の保険会社(A～D社とする)と代理店委託契約を締結しているものの、そのうち一社(A社)を引受幹事保険会社とする共同保険スキーム(B～D社は非幹事保険会社)を採用しており、幹事社及び引受割合はいずれも当該金融機関が定めている。また、当該共同保険スキームは業界において一定程度確立した制度である。\n当該金融機関では、実際に販売対象とする保険契約につ327いて、取扱商品一覧の作成や販売マニュアル等の整備を行っている。\nこのような実態を踏まえ、以下の点について確認したい。\n1.代理店委託契約を締結していることと、実際に金融機関の取扱商品ラインナップに当該保険商品を含めるか否かとを、切り離して考える取扱いは可能か。\n2.仮に1.が認められない場合であっても、特定の保険契約を取扱商品ラインナップに含めないことについて、当該保険会社との間で合意がなされている場合には、委託契約書に縛られることなく、当該保険契約を「取扱いを行わない保険契約」として整理することは可能か。\n3.仮に1.が認められる場合において、当該取扱商品ラインナップの中に「二以上の比較可能な同種の保険契約」が存在しない場合には、結果として一社分(幹事社を引受保険会社とする契約)のみを提案する取扱いとしても、比較推奨販売ルール上問題は生じないと理解してよいか。","pageStart":327,"pageEnd":328,"answer":"乗合代理店における比較推奨販売の対象となる保険契約の範囲は、代理店委託契約又はこれに基づく覚書等により決定されるものであり、乗合代理店自身の判断(理由等)により、あらかじめ、代理店委託契約と切り離して取扱商品ラインナップを定め、販売対象となる保険契約を選定・決定することは適切ではありません。\nしたがって、代理店が社内の取扱商品ラインナップを独自に定めることのみをもって、代理店委託契約上取り扱うことが可能な保険契約を比較推奨販売の対象外とすることは適切ではありません。\nなお、乗合代理店において推奨販売が必要か否かは、代理店委託契約又はこれに基づく覚書等において取り扱うこととされている保険契約の中に「二以上の比較可能な同種の保険契約」が存在するか否かで判断するものであり、顧客の意向の把握過程において把握しようとする顧客の意向との関係で、一般人の合理的な期待を基準として、当該保険契約が「比較可能な同種」のものと言えるかについて、個別具体的に判断される必要があります。\nいずれにせよ、顧客の適切な商品選択の機会を阻害することがないよう留意し、顧客に対しては、取扱保険会社・保険契約の範囲について誤認を与えないよう適切に説明するなど留意する必要があります。","theme":"共同保険","section":"監督指針","tags":["比較推奨"]},{"no":566,"location":"Ⅱ－4－2－9(5)","comment":"代理店が特定種目の共同保険を販売するためだけに複数の保険会社に乗り合っているケースにおいて、保険会社と共同保険における非幹事会社としてしか取り扱わないことについて、代理店委託契約書や覚書を締結しているケースがある。\nこのようなケースにおいて、取扱可能な保険契約についての保険会社の教育・管理・指導のもと、代理店として当該保険会社の保険契約を共同保険における非幹事会社と328してのみ取り扱うことを保険募集人に徹底する等体制を整備する等の対応を行っている限りにおいては、当該保険会社の保険契約を比較可能な同種の保険契約から除外することが可能との理解でよいか。","pageStart":328,"pageEnd":329,"answer":"特定の保険会社間で共同保険を組成していることをもって、これらの保険会社を所属保険会社等とする保険代理店が直ちに比較推奨販売規制の対象外となるものではありません。比較推奨販売の対象となるか否かは、代理店委託契約又はこれに基づく覚書等において定める取扱契約や取扱範囲等によって判断する必要があります。\nなお、代理店委託契約で取り扱う保険契約の範囲を明確にした上で、貴見にある体制整備や措置も重要であると考えます。\nまた、乗合代理店において推奨販売の要否を判断するに当たっては、保険募集人が顧客の意向の把握過程において把握しようとする顧客の意向との関係で、一般人の合理的な期待を基準として、当該保険契約が「比較可能な同種」のものと言えるかについて、個別具体的に判断される必要があります。具体的には、顧客の具体的な意向、保険契約の対象となるリスクの種類及び保険給付の内容、保険契約の特性・類型等を踏まえつつ、個別具体的かつ実質的に判断されるべきものと考えられます。\n加えて、保険会社との代理店委託契約又はこれに基づく覚書等により、当該保険契約を共同保険の非幹事会社としてのみ取り扱う旨を明確に定め、結果として二以上の比較可能な同種の保険契約が存在しない場合には、推奨販売の対象外となり得ると考えられます。","theme":"共同保険","section":"監督指針","tags":["比較推奨"]},{"no":567,"location":"Ⅱ－4－2－9(5)","comment":"銀行等における保険販売に際し、複数の保険会社が共同保険として保険を引き受ける場合であって、あらかじめ幹事保険会社、非幹事保険会社及び当該銀行等(代理店)との間で、引受形態について合意が形成されている場合には、非幹事保険会社の保険契約について、当該銀行等においては商品提供を受けていないものと整理しても差し支えないとの理解でよいか。","pageStart":329,"pageEnd":329,"answer":"特定の保険会社間で共同保険を組成していることをもって、これらの保険会社を所属保険会社等とする保険代理店が直ちに比較推奨販売規制の対象外となるものではありません。比較推奨販売の対象となるか否かは、代理店委託契約又はこれに基づく覚書等において定める取扱契約や取扱範囲等によって判断する必要があります。\nなお、代理店委託契約で取り扱う保険契約の範囲を明確にした上で、貴見にある体制整備や措置も重要であると考えます。\nまた、乗合代理店において推奨販売の要否を判断するに当たっては、保険募集人が顧客の意向の把握過程において把握しようとする顧客の意向との関係で、一般人の合理的な期待を基準として、当該保険契約が「比較可能な同種」のものと言えるかについて、個別具体的に判断される必要があります。具体的には、顧客の具体的な意向、保険契約の対象となるリスクの種類及び保険給付の内容、保険契約の特性・類型等を踏まえつつ、個別具体的かつ実質的に判断されるべきものと考えられます。\n加えて、保険会社との代理店委託契約又はこれに基づく覚書等により、当該保険契約を共同保険の非幹事会社としてのみ取り扱う旨を明確に定め、結果として二以上の比較可能な同種の保険契約が存在しない場合には、推奨販売の対象外となり得ると考えられます。","theme":"共同保険","section":"監督指針","tags":["比較推奨"]},{"no":568,"location":"Ⅱ－4－2－9(5)","comment":"保険業法施行規則第227条の2第3項第4号ハの廃止に伴い、同号ロに係る監督指針が改正されることを踏まえ、比較推奨販売における情報提供の要否について考え方を整理させていただきたい。\n例えば、企業包括保険等の共同引受保険においては、企業が求める一定の要件に基づき設計された特定の保険契約を、複数の損害保険会社が分担して引き受けるものであり、比較推奨販売には馴染まないものと考える。\nこのような共同保険については、比較推奨販売を前提とした情報提供の対象外と理解してよいか。","pageStart":329,"pageEnd":329,"answer":"一般論として、企業向け保険の共同保険は個別性が高いものの、共同保険であることのみをもって、直ちに比較推奨販売の対象外となるものではありません。\n当該保険について、推奨販売の要否を判断するにあたっては、保険募集人が、顧客の意向の把握過程において、把握しようとする顧客の意向との関係で、一般人の合理的な期待を基準として、当該保険契約が「比較可能な同種」のものと言えるかについて、個別具体的に判断される必要があります。具体的には、顧客の具体的な意向、保険契約の対象となるリスクの種類及び保険給付の内容、保険契約の特性・類型等を踏まえつつ、個別具体的かつ実質的に判断されるべきものと考えられます。\n顧客の意向や保険契約の特性等によって、比較推奨販売の適用除外となるか否かは異なるため、一律にガイドライン等において定めることは困難です。","theme":"共同保険","section":"監督指針","tags":["比較推奨","ハ方式"]},{"no":569,"location":"Ⅱ－4－2－9(5)","comment":"新種保険やスペシャリティ保険(例：工事保険、保証保329険、企業向け火災保険)については、専門性が高く、各保険会社の引受方針(特定リスクの引受不可、共同保険幹事としての引受不可等)や提供可能なキャパシティ、承認に要する期間等に大きな差異が存在する。このため、全ての保険会社が一律かつ同時に引受可否の判断を行うことが困難な保険種目がある。\nこのような保険について、個人向け保険契約と同様の意向把握プロセスを一律に求めることは、実務の実態との乖離が生じるおそれがある。\nまた、キャパシティ確保の観点から共同保険による引受けを行う場合には、各保険会社の特性や案件ごとの引受条件を踏まえて保険料率や補償内容が決定されるが、このような場合においても、比較推奨販売を前提とした意向把握プロセスに沿った対応が求められるという理解でよいか。\nこれらの新種保険・スペシャリティ保険について、比較推奨販売の適用除外とする特例や、ガイドライン等が示される予定はないのか。","pageStart":329,"pageEnd":330,"answer":"一般論として、企業向け保険の共同保険は個別性が高いものの、共同保険であることのみをもって、直ちに比較推奨販売の対象外となるものではありません。\n当該保険について、推奨販売の要否を判断するにあたっては、保険募集人が、顧客の意向の把握過程において、把握しようとする顧客の意向との関係で、一般人の合理的な期待を基準として、当該保険契約が「比較可能な同種」のものと言えるかについて、個別具体的に判断される必要があります。具体的には、顧客の具体的な意向、保険契約の対象となるリスクの種類及び保険給付の内容、保険契約の特性・類型等を踏まえつつ、個別具体的かつ実質的に判断されるべきものと考えられます。\n顧客の意向や保険契約の特性等によって、比較推奨販売の適用除外となるか否かは異なるため、一律にガイドライン等において定めることは困難です。","theme":"共同保険","section":"監督指針","tags":["比較推奨","意向把握"]},{"no":570,"location":"Ⅱ－4－2－9(5)","comment":"今回予定されている「乗合代理店における比較説明・推奨販売に係る保険業法施行規則の改正」は、新規契約に限らず、更改契約についても適用されるのか確認したい。\nいずれにも適用される場合、新規契約と更改契約では、顧客の当初の意向や顧客が乗合代理店に求める対応が全く異なるため、監督指針の項目を別にする等明確化していただきたい。\n330","pageStart":330,"pageEnd":331,"answer":"新規契約の保険募集か否かに関わらず、保険業法施行規則第227条の2第3項第4号ロ(推奨販売)に係る対応の要否は、顧客の意向に照らしつつ、「二以上の比較可能な同種の保険契約」が存在するか、保険契約を選別・提案するものであるかどうかによって個別具体的に判断される必要があります。\nⅡ－4－2－9(5)についても、このような考え方を前提として、様々な保険募集の場面において満たすべき基本的な考え方を示したものであり、監督指針に満期到来時における保険募集のための別途の項目を設けることは予定しておりません。","theme":"更改・継続契約","section":"監督指針","tags":["比較推奨","更改・継続"]},{"no":571,"location":"Ⅱ－4－2－9(5)","comment":"更改手続きにおいて、手続き漏れによる無保険状態の回避等を目的として、保険会社から契約者宛てに直接満期案内を行っている。\n当該満期案内に更改手続きの具体的な方法が掲載されており、契約者は自らの意思でその案内に従い、更改手続きを完了させることがある。この場合において、取扱代理店が保険募集に関与しないときは、当該代理店における情報提供義務・意向把握義務の対象外と考えてよいか。\n一方、取扱代理店が保険募集に関与するときであっても、満期案内に基づく更改手続時において、顧客が既契約の更改を希望する場合には、契約者自らが当該保険契約を指定したと考えられることから、顧客の保険会社選択の意思が明確なケースとして、比較推奨販売の対象外と考えてよいか。","pageStart":331,"pageEnd":331,"answer":"保険会社が保険契約者に対し、無保険状態の回避等を目的として満期案内を直接送付し、取扱代理店が継続手続に係る保険募集に関与しない場合には、当該代理店に保険業法上の情報提供義務及び意向把握・確認義務が課されるものではありません。\n一方、取扱代理店が継続手続に関与する場合には、その関与の内容・態様に応じて、情報提供義務及び意向把握・確認義務等を適切に履行する必要があります。\nその上で、保険募集人による選別・提案が実質的に伴うことなく、顧客の主体的な判断のみにより、既契約と同内容又はこれと大きく異ならない内容の保険契約を希望する旨が表明され、一の保険契約が選択された場合には、直ちに同法施行規則第227条の2第3項第4号ロ(推奨販売)に係る対応が必要となるものではありません。\nただし、当該判断が顧客の主体的判断に基づくものか、又は保険募集人による恣意的な誘導が行われていないかは、個別具体的に判断されます。\nまた、乗合代理店が継続手続に関与する過程で、他の保険契約との比較説明を行う場合には同号イを、「二以上の比較可能な同種の保険契約」の中から保険契約を選別・提案する場合には同号ロを踏まえた対応が必要です。\nなお、顧客が表明した意向、保険募集人が案内・説明した内容等については、事後的に確認・検証できるよう、適切に記録・保存することが重要です。","theme":"更改・継続契約","section":"監督指針","tags":["比較推奨","意向把握","証跡・記録","更改・継続"]},{"no":572,"location":"Ⅱ－4－2－9(5)","comment":"「「平成26年改正保険業法(2年以内施行)に係る政府令・331監督指針案」に対するパブリックコメント結果等について」における「コメントの概要及びコメントに対する金融庁の考え方」No.64によれば、保険業法施行規則第227条の2第3項第3号ニ・同条の2第11項第2号との関係で、満期を迎えた保険契約の更改契約について、「例えば、短期の損害保険契約について、当該契約が満期を迎えたことにより、当該契約を更改する場合には、基本的には「既契約の一部の変更をすることを内容とする保険契約」に該当するものと考えられます。」との考え方が明らかにされているが、今般の改正によって上記各規則は改正されない以上、当該考え方に変わりはないという理解でよいか。\nその場合、乗合代理店による短期の損害保険契約の更改時の募集が「既契約の一部の変更をすることを内容とする保険契約」の範囲内のものであれば、比較推奨販売を行う必要がないという理解でよいか。\n332","pageStart":331,"pageEnd":333,"answer":"「「平成26年改正保険業法(2年以内施行)に係る政府令・監督指針案」に対するパブリックコメント結果等について」における「コメントの概要及びコメントに対する金融庁の考え方」No.64については、考え方に変更はありません。\nすなわち、短期の損害保険契約の満期が到来した場合において、その時点における顧客の意向が適切に把握・確認された結果として、「当該契約を更改する」という判断に至ったことにより締結される保険契約は、基本的には「既契約の一部の変更をすることを内容とする保険契約」に該当すると考えられます。\nただし、既契約の満期が到来する場合において、顧客から具体的な意向が示されていない中、乗合代理店が案内(保険募集)を行う時点においては、既契約と同条件又は同等の補償条件であることのみをもって、当然に比較推奨販売に係る規定の適用対象外となるものではありません。保険業法施行規則第227条の2第3項第4号ロ(推奨販売)に係る対応の要否は、「二以上の比較可能な同種の保険契約」が存在するか、保険契約を選別・提案するものであるかどうかによって個別具体的に判断される必要があります。\nその上で、短期の損害保険契約については、その特性を踏まえると、当該契約の満期が到来することに伴い、乗合代理店において、既契約と同条件又は補償内容がほぼ変わらないプランの案内(保険募集)が行われたとしても、直ちに保険契約者等の保護に欠けるものとは言えず、一概に否定されるものではないと考えます。ただし、その場合であっても、他の保険契約の提案を望む顧客も存在すると考えられることから、乗合代理店として意向把握・確認義務を適切に履行するための対応として、顧客の希望に応じて他の保険契約を提案できることを明示すること、及び顧客のリスク状況や意向を適切に把握できるよう工夫して案内(保険募集)することが求められると考えます。","theme":"更改・継続契約","section":"監督指針","tags":["比較推奨","意向把握","更改・継続"]},{"no":573,"location":"Ⅱ－4－2－9(5)","comment":"「「平成26年改正保険業法(2年以内施行)に係る政府令・監督指針案」に対するパブリックコメント結果等について」における「コメントの概要及びコメントに対する金融庁の考え方」No.64によれば、保険業法施行規則第227条の2第3項第3号ニ・同条の2第11項第2号との関係で、満期を迎えた保険契約の更改契約について、「例えば、短期の損害保険契約について、当該契約が満期を迎えたことにより、当該契約を更改する場合には、基本的には「既契約の一部の変更をすることを内容とする保険契約」に該当するものと考えられます。」との考え方が明らかにされているが、「既契約の一部の変更をすることを内容とする保険契約」\nには、必ずしも前年同条件でなくても、例えば既契約の補償条件や保険料が大きく変わらない程度の保険契約も含まれるという理解でよいか。\n333","pageStart":333,"pageEnd":334,"answer":"「「平成26年改正保険業法(2年以内施行)に係る政府令・監督指針案」に対するパブリックコメント結果等について」における「コメントの概要及びコメントに対する金融庁の考え方」No.64については、今般の改正により考え方を変更するものではありません。\nすなわち、短期の損害保険契約の満期が到来した場合において、その時点における顧客の意向が適切に把握・確認された結果として、「当該契約を更改する」という判断に至ったことにより締結される保険契約は、基本的には「既契約の一部の変更をすることを内容とする保険契約」に該当すると考えられます。\nまた、前年同条件でない場合であっても、既契約の補償内容、保険料水準、保険期間、保険金額、特約等の変更内容・程度に照らし、既契約の一部変更と評価できる程度の変更であるときには、「既契約の一部の変更をすることを内容とする保険契約」に該当します。一方、補償内容その他の契約条件が大幅に変更され、実質的に新契約と評価される場合には、「既契約の一部の変更をすることを内容とする保険契約」には該当しないものと考えられます。\nなお、「既契約の一部の変更をすることを内容とする保険契約」\nに該当するかどうかについては、満期を迎える保険募集時に把握した顧客の意向や契約内容等を踏まえ、個別具体的に判断されます。また、変更部分については、適切な情報提供が必要であり、実質的な変更がある場合には、変更内容・程度に応じて意向把握・確認を適切に行う必要があります。","theme":"更改・継続契約","section":"監督指針","tags":["意向把握","更改・継続"]},{"no":574,"location":"－","comment":"乗合代理店による短期の損害保険契約の更改時には、(1)前年同条件ないしほぼ補償内容が変わらないプランに加えて、(2)補償内容を充実させるプランも、同時案内を行う場合がある。\nその際、(2)が「既契約の一部を変更することを内容とする保険契約」の範囲内のものであれば、そもそも比較推奨販売を行う必要がないと理解している。\nこれに対して、(2)が「既契約の一部を変更することを内容とする保険契約」の範囲内と言えないものであったとしても、単なる更改案内時点では未だ保険募集を行っていないのであれば、その段階では比較推奨販売が求められないという理解でよいか。\nまた、上記案内後に既契約者から(2)を希望するという意向が確認された場合は、既契約者の判断のみにより既契約の引受保険会社の保険契約が指定されたと考えられるため、それ以降も比較推奨販売が求められないという理解でよいか。\n334","pageStart":334,"pageEnd":335,"answer":"既契約の満期が到来する場合において、顧客から具体的な意向が示されていない中、乗合代理店が行う案内(保険募集)が既契約と同条件又は同等の補償条件であることのみをもって、当然に比較推奨販売に係る規定の適用対象外となるものではありません。\n保険業法施行規則第227条の2第3項第4号ロ(推奨販売)に係る対応の要否は、「二以上の比較可能な同種の保険契約」が存在するか、保険契約を選別・提案するものであるかどうかによって個別具体的に判断される必要があります。\nその上で、短期の損害保険契約については、その特性を踏まえると、当該契約の満期が到来することに伴い、乗合代理店において既契約と同条件又は補償内容がほぼ変わらないプランの案内(保険募集)が行われたとしても、直ちに保険契約者等の保護に欠けるものとは言えず、一概に否定されるものではないと考えます。ただし、その場合であっても、他の保険契約の提案を望む顧客も存在すると考えられることから、乗合代理店として意向把握・確認義務を適切に履行するための対応として、顧客の希望に応じて他の保険契約を提案できることを明示すること、及び顧客のリスク状況や意向を適切に把握できるよう工夫して案内(保険募集)することが求められると考えます。\nなお、上記の案内(保険募集)時に「補償内容を充実させるプラン」を含め得るかどうかについては、既契約の契約内容や提案しようとする契約内容等を踏まえ、個別具体的に判断されるべきものであり、一概にお答えすることは困難です。いずれにせよ、同号ロに係る対応の要否は、「二以上の比較可能な同種の保険契約」\nが存在するか、保険契約を選別・提案するものであるかどうかによって個別具体的に判断される必要があります。\nまた、既契約の満期に伴う顧客への案内が保険募集に該当するか否かについては、具体的な補償内容の提案・勧誘を伴うものかなど、案内の内容や表示方法等を踏まえ、個別具体的かつ実質的に判断される必要があります。\nその上で、保険募集人による選別・提案を実質的に伴うことなく、顧客の主体的な判断のみにより、既契約と同内容又はこれと大きく異ならない内容の保険契約を希望する旨が表明され、一の保険契約が選択された場合には、直ちに同号ロ(推奨販売)に係る対応が必要となるものではありません。","theme":"更改・継続契約","section":"監督指針","tags":["比較推奨","意向把握","更改・継続"]},{"no":575,"location":"－","comment":"既存契約の更改において、保険会社から送付される満期案内においては、通常、前契約と同条件のプランに加え、補償を見直し・変更したプランも併せて提示されている。\n基本的に既存契約と同条件での更改手続きは、「「平成26年改正保険業法(2年以内施行)に係る政府令・監督指針案」に対するパブリックコメント結果等について」における「コメントの概要及びコメントに対する金融庁の考え方」の通り、比較推奨販売の対象から外れるものと理解しているが、見直し・変更されたプランで契約する場合も、顧客から特段の他社との比較要望が無い限り、比較推奨の対象から外れるものと理解しているが相違ないか。\n顧客が継続加入を前提としている場合は、顧客による保険会社の特定がされており、その中でのプラン変更(特約付加等)の提案は、補償内容が見直し・変更されたとして335も、新たな契約というよりも、既存契約に関する「情報提供義務」の履行または契約内容のメンテナンスとしての性質と考えている。","pageStart":335,"pageEnd":336,"answer":"保険会社が保険契約者に対し満期案内を直接送付し、取扱代理店である乗合代理店が継続手続に係る保険募集に関与しない場合には、当該代理店に保険業法上の情報提供義務及び意向把握・確認義務が課されるものではありません。\n一方で、乗合代理店が案内(保険募集)を行う場合には、既契約と同条件の保険募集であることのみをもって、当然に比較推奨販売に係る規定の適用対象外となるものではありません。\n既契約の満期が到来する場合において、顧客から具体的な意向が示されていない中、乗合代理店が行う案内(保険募集)が既契約と同条件又は同等の補償条件で行われる場合においても、同法施行規則第227条の2第3項第4号ロ(推奨販売)に係る対応の要否は個別具体的に判断される必要があります。\nその上で、短期の損害保険契約については、その特性を踏まえると、当該契約の満期が到来することに伴い、乗合代理店において、既契約と同条件又は補償内容がほぼ変わらないプランの案内(保険募集)が行われたとしても、直ちに保険契約者等の保護に欠けるものとは言えず、一概に否定されるものではないと考えます。ただし、その場合であっても、他の保険契約の提案を望む顧客も存在すると考えられることから、乗合代理店として意向把握・確認義務を適切に履行するための対応として、顧客の希望に応じて他の保険契約を提案できることを明示すること、及び顧客のリスク状況や意向を適切に把握できるよう工夫して案内(保険募集)することが求められると考えます。\nまた、顧客から他社比較の要望がないことのみをもって、一律に比較推奨販売に係る対応が不要となるものではありません。保険募集人による選別・提案が実質的に伴うことなく、顧客の主体的な判断のみにより、既契約と同内容又はこれと大きく異ならない内容の保険契約を希望する旨が表明され、一の保険契約が選択された場合には、直ちに同号ロ(推奨販売)に係る対応が必要となるものではありません。","theme":"更改・継続契約","section":"監督指針","tags":["比較推奨","意向把握","更改・継続"]},{"no":576,"location":"Ⅱ－4－2－9(5)","comment":"乗合代理店が短期の損害保険契約(以下「既存契約」という。)の更改手続を担当する際に、保険契約者が既存契約の更改を希望する場合は、比較推奨販売の対象外になるという理解でよいか。\nまた、乗合代理店として保険契約者が既存契約の更改を希望することを確認できた場合は、乗合代理店から既存契約の更改手続を進める際に既存契約にない新たな特約等を付帯した補償充実プランを提案することも許容されるという理解でよいか。\n336","pageStart":336,"pageEnd":337,"answer":"保険募集人は、短期の損害保険契約の満期到来に伴う保険募集を行う場合においても、顧客が適切な理解に基づき、自主的に既契約の継続の要否や内容を判断できるよう、顧客のリスク特性や意向が変化している可能性にも留意しつつ、顧客の意向を適切に把握し、当該意向に沿った提案・説明を行う必要があります。\nその上で、保険募集人による選別・提案を実質的に伴うことなく、顧客の主体的な判断のみにより、既契約と同内容又はこれと大きく異ならない内容の保険契約を希望する旨が表明され、一の保険契約が選択された場合には、直ちに保険業法施行規則第227条の2第3項第4号ロ(推奨販売)に係る対応が必要となるものではありません。ただし、当該判断が顧客の主体的判断に基づくものか、又は保険募集人による恣意的な誘導が行われていないかは、個別具体的に判断されます。また、乗合代理店が継続手続に関与する過程で、他の保険契約との比較説明を行う場合には同号イを、「二以上の比較可能な同種の保険契約」の中から保険契約を選別・提案する場合には同号ロを踏まえた対応が必要です。\nまた、上記の場合において、顧客のリスク状況や意向を踏まえつつ、既契約にない特約等を付加した補償充実プランを案内・提案すること自体は、直ちに否定されるものではありません。ただし、当該補償充実プランを提示・推奨する場合には、その内容、既契約との差異、保険料への影響、主な留意点等を分かりやすく説明する必要があります。また、当該提案を行うことで、実質的に他の保険契約が「比較可能な同種の保険契約」になり得る場合には、他の選択肢があることを説明することや、顧客に追加的な意向を確認するなど、顧客の適切な商品選択の機会が実質的に阻害されないよう、適切な対応を行うことが重要と考えます。","theme":"更改・継続契約","section":"監督指針","tags":["比較推奨","更改・継続"]},{"no":577,"location":"Ⅱ－4－2－9(5)","comment":"火災保険等の満期更改手続きにおいて、同条件での更改であれば比較推奨販売は不要と考えているが、実務上は同条件プランに加え、補償拡充プランやおすすめプランを併せて案内するケースが一般的である。こうした案内は保険会社作成・保険代理店作成を問わず同様の内容と考えられる。また、商品改定により完全に同条件での更改ができない場合もある。\nこの点につき、以下の2点について確認したい。\n337①「同条件」を「同等の補償条件」と読み替えることは可能か②同条件を前提とした補償拡充プランを満期更改時に郵送等で追加提案する行為に問題はないか","pageStart":337,"pageEnd":338,"answer":"例えば、既契約の満期が到来する場合において、顧客から具体的な意向が示されていない中、乗合代理店が行う案内(保険募集)\nが既契約と同条件又は同等の補償条件であることのみをもって、当然に比較推奨販売に係る規定の適用対象外となるものではありません。保険業法施行規則第227条の2第3項第4号ロ(推奨販売)\nに係る対応の要否は、「二以上の比較可能な同種の保険契約」が存在するか、保険契約を選別・提案するものであるかどうかによって個別具体的に判断される必要があります。\nその上で、例えば、短期の損害保険契約については、その特性を踏まえると、当該契約の満期が到来することに伴い、乗合代理店において、既契約と同条件又は補償内容がほぼ変わらないプランの案内(保険募集)が行われたとしても、直ちに保険契約者等の保護に欠けるものとは言えず、一概に否定されるものではないと考えます。ただし、その場合であっても、他の保険契約の提案を望む顧客も存在すると考えられることから、乗合代理店として意向把握・確認義務を適切に履行するための対応として、顧客の希望に応じて他の保険契約を提案できることを明示すること、及び顧客のリスク状況や意向を適切に把握できるよう工夫して案内(保険募集)することが求められると考えます。\nなお、上記の案内(保険募集)を郵送で行うこともあり得ると考えますが、顧客とのやり取りが一度に限られる場合、顧客のリスク状況や意向の変化が捉えにくいものであることに留意し、適切な意向把握が行えるよう特に工夫する必要があると考えます。\nまた、当該案内(保険募集)時に「補償拡充プラン」を含め得るかどうかについては、既契約の契約内容や提案しようとする契約内容等を踏まえ、個別具体的に判断されるべきものであり、一概にお答えすることは困難です。いずれにせよ、同号ロに係る対応の要否は、「二以上の比較可能な同種の保険契約」が存在するか、保険契約を選別・提案するものであるかどうかによって個別具体的に判断される必要があります。","theme":"更改・継続契約","section":"監督指針","tags":["比較推奨","意向把握","更改・継続"]},{"no":578,"location":"Ⅱ－4－2－9(5)","comment":"満期更改で「現在と同じ会社の商品でいい」と言われた場合でも、商品改定や重要事項等に変更がある場合は、その内容を伝え、意向を確認する
