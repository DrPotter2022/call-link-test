<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Helpdesk 管理</title><style>body{max-width:720px;margin:32px auto;padding:0 16px;font-family:system-ui,sans-serif;line-height:1.6}section{border:1px solid #ddd;border-radius:10px;padding:16px;margin:16px 0}label{display:block;margin:10px 0}input{max-width:100%;padding:8px}button{padding:9px 12px}#status{white-space:pre-wrap;color:#333}.danger{color:#b91c1c}</style></head><body>
<h1>Helpdesk 管理</h1><p>Firebase の管理者権限を持つアカウントだけが操作できます。電話帳内容はこの画面に表示・保存されません。</p>
<section><h2>電話帳を取り込む</h2><p>旧 <code>helpdesk.html</code> を選択すると、電話帳の2セクションだけを送信します。</p><input id="source" type="file" accept="text/html,.html"><button id="import" type="button">取込み</button></section>
<section><h2>利用を許可する</h2><label>既存Firebase利用者のメールアドレス <input id="grantEmail" type="email" autocomplete="email"></label><button id="grant" type="button">利用を許可</button></section><p id="status" role="status"></p>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";import{getAuth,onAuthStateChanged,signInWithEmailAndPassword}from"https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
const firebaseConfig={apiKey:"AIzaSyB6Dq_RR65s0w-fYcfiNN7XELpS5TGf_oQ",authDomain:"index-6c554.firebaseapp.com",projectId:"index-6c554",appId:"1:571533029170:web:8d84392edc1f44ec45312b"};const auth=getAuth(initializeApp(firebaseConfig)),status=document.getElementById("status"),API={import:"https://us-central1-index-6c554.cloudfunctions.net/helpdeskDirectoryImport",grant:"https://us-central1-index-6c554.cloudfunctions.net/helpdeskGrantAccess"};
const api=async(name,body)=>{const token=await auth.currentUser.getIdToken(),res=await fetch(API[name],{method:"POST",headers:{Authorization:`Bearer ${token}`,"Content-Type":"application/json"},body:JSON.stringify(body),cache:"no-store"}),result=await res.json().catch(()=>({}));if(!res.ok||!result.ok)throw new Error(result.error||"request_failed")};
onAuthStateChanged(auth,async user=>{if(user)return;const email=prompt("管理者メールアドレス"),password=prompt("パスワード");if(!email||!password)return;try{await signInWithEmailAndPassword(auth,email,password);status.textContent="管理者としてログインしました。"}catch(_){status.textContent="ログインできません。";status.className="danger"}});
document.getElementById("import").addEventListener("click",async()=>{const file=document.getElementById("source").files[0];if(!file)return status.textContent="旧 helpdesk.html を選択してください。";try{const source=await file.text(),doc=new DOMParser().parseFromString(source,"text/html"),nonlife=doc.querySelector("section#nonlife"),life=doc.querySelector("section#life");if(!nonlife||!life)throw new Error();await api("import",{html:nonlife.outerHTML+life.outerHTML});status.textContent="取込みが完了しました。"}catch(_){status.textContent="取込みに失敗しました。管理者権限とファイルを確認してください。";status.className="danger"}});
document.getElementById("grant").addEventListener("click",async()=>{try{await api("grant",{email:document.getElementById("grantEmail").value.trim()});status.textContent="利用を許可しました。"}catch(_){status.textContent="許可できません。管理者権限とメールアドレスを確認してください。";status.className="danger"}});
</script></body></html>
