<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>ヘルプ・サポートデスク一覧</title><style>:root{--bg:#f6f8fb;--card:#fff;--ink:#1f2937;--muted:#6b7280;--line:#e5e7eb;--accent:#0f766e;--danger:#b91c1c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans JP",sans-serif}main{max-width:980px;margin:auto;padding:24px 12px 42px}.card,.company{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}.company{padding:0;margin:12px 0;overflow:hidden}h1{margin:0;font-size:22px}p{color:var(--muted)}label{display:block;margin-top:14px;font-weight:700}input{width:100%;margin-top:6px;padding:12px;font:inherit;border:1px solid var(--line);border-radius:10px}button{padding:11px 14px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:inherit;font-weight:700;cursor:pointer}#signIn{margin-top:16px}.secondary{background:#fff;color:var(--accent);border:1px solid var(--accent)}#error{min-height:1.5em;color:var(--danger);margin-top:12px}.hidden{display:none!important}.bar{display:flex;justify-content:space-between;align-items:center;gap:10px}.company summary{cursor:pointer;padding:14px;font-weight:800}.entry{border-top:1px solid var(--line);padding:13px 14px}.label{font-weight:800}.contact,.note{white-space:pre-line;margin-top:5px;color:#374151}.note{color:var(--muted)}.phones{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}.phone{display:inline-block;background:#ecfdf5;border:1px solid #99f6e4;color:#065f46;border-radius:999px;padding:8px 11px;font-weight:800;text-decoration:none}</style></head><body><main><div class="bar"><h1>ヘルプ・サポートデスク一覧</h1><button id="signOut" class="secondary hidden" type="button">ログアウト</button></div><section id="login" class="card"><p>利用を許可されたアカウントでログインしてください。</p><label>メールアドレス<input id="email" type="email" autocomplete="email" required></label><label>パスワード<input id="password" type="password" autocomplete="current-password" required></label><button id="signIn" type="button">ログイン</button><div id="error" role="alert"></div></section><section id="directory" class="hidden" aria-live="polite"></section></main><script type="module" src="./helpdesk.inline-1.js"></script></body></html>
